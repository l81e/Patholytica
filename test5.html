<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
   <title>Article Scroller - Patholytica</title>
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=DM+Sans:wght@400;500;600&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
   <style>
       :root {
           --bg-color: #0f0e0b;
           --text-primary: #f5f0e8;
           --text-secondary: #8a8070;
           --card-bg: #0f0e0b;
           --hover-bg: #1a1810;
           --border-color: #2a2518;
           --accent: #c8a96e;
           --accent-hover: #b8935a;
           --accent-glow: rgba(200, 169, 110, 0.25);
           --accent-soft: rgba(200, 169, 110, 0.12);
           /* Emoji font/size toggles */
           --emo-font: inherit;
           --emo-size-scale: 1;
       }
       body.light-theme {
           --bg-color: #faf6ee;
           --text-primary: #1a1710;
           --text-secondary: #706050;
           --card-bg: #faf6ee;
           --hover-bg: #f0ebe0;
           --border-color: #e0d8c8;
           --accent: #a07840;
           --accent-hover: #8a6430;
           --accent-glow: rgba(160, 120, 64, 0.2);
           --accent-soft: rgba(160, 120, 64, 0.08);
       }
       * { margin: 0; padding: 0; box-sizing: border-box; }
       body {
           font-family: "DM Sans", -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: var(--bg-color);
           color: var(--text-primary);
           overflow: hidden;
           transition: background 0.2s ease, color 0.2s ease;
           position: fixed;
           width: 100%;
           height: 100%;
       }

       /* ── Desktop layout ── */
       .app-container {
           position: fixed;
           top: 0;
           left: 50%;
           transform: translateX(-50%);
           width: 100%;
           max-width: 450px;
           height: 100vh;
           background: var(--bg-color);
       }
       @media (min-width: 900px) {
           body { overflow: auto; position: static; }
           .app-container {
               position: relative; left: auto; transform: none;
               max-width: 520px; margin: 0 auto;
               height: auto; min-height: 100vh;
               box-shadow: 0 0 60px rgba(0,0,0,0.5);
               border-left: 1px solid var(--border-color);
               border-right: 1px solid var(--border-color);
           }
           .scroller-container { height: auto; overflow: visible; }
           .posts-wrapper {
               height: auto; overflow: visible;
               scroll-snap-type: none;
           }
           .article-card, .mcq-card, .library-picker-card, .skeleton-card {
               height: auto; min-height: 100vh;
               scroll-snap-align: unset; scroll-snap-stop: unset;
               position: relative;
               border-bottom: 1px solid var(--border-color);
           }
           .action-buttons { position: sticky; bottom: 80px; }
           .footer-bar {
               position: sticky; bottom: 0;
               left: auto; transform: none;
               max-width: 520px;
           }
       }

       .scroller-container {
           position: relative;
           width: 100%;
           height: 100vh;
           background: var(--bg-color);
           overflow: hidden;
       }
       .posts-wrapper {
           height: 100%;
           overflow-y: scroll;
           scroll-snap-type: y mandatory;
           scrollbar-width: none;
       }
       .posts-wrapper::-webkit-scrollbar { display: none; }

       /* ══════════════════════════════════
          ARTICLE CARD
       ══════════════════════════════════ */
       .article-card {
           position: relative;
           height: 100vh;
           scroll-snap-align: start;
           scroll-snap-stop: always;
           background: var(--bg-color);
           padding: 0;
           padding-top: calc(20px + env(safe-area-inset-top));
           display: flex;
           flex-direction: column;
       }
       .article-header {
           display: flex;
           align-items: center;
           gap: 12px;
           flex-shrink: 0;
           position: relative;
           z-index: 50;
           margin-bottom: 14px;
           padding: 0 18px;
       }
       .author-avatar {
           width: 42px; height: 42px;
           border-radius: 50%;
           background: linear-gradient(135deg, var(--accent), #8a6430);
           display: flex; align-items: center; justify-content: center;
           font-size: 17px; font-weight: 700;
           color: #0f0e0b;
           overflow: hidden; flex-shrink: 0;
           cursor: pointer;
           transition: opacity 0.15s ease, box-shadow 0.2s ease;
       }
       .author-avatar:hover { opacity: 0.9; box-shadow: 0 0 0 2px var(--accent); }
       .author-avatar img { width: 100%; height: 100%; object-fit: cover; }
       .author-info { flex: 1; }
       .author-name {
           color: var(--text-primary);
           font-weight: 700; font-size: 14px; margin-bottom: 1px;
           cursor: pointer; display: inline-block;
           transition: color 0.15s ease; letter-spacing: -0.01em;
       }
       .author-name:hover { color: var(--accent); }
       .article-date { color: var(--text-secondary); font-size: 11px; font-weight: 500; }

       .follow-btn {
           position: relative; width: 32px; height: 32px;
           border-radius: 50%; border: 1.5px solid var(--border-color);
           background: var(--hover-bg); cursor: pointer;
           display: flex; align-items: center; justify-content: center;
           flex-shrink: 0;
           transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
           overflow: hidden; -webkit-tap-highlight-color: transparent;
       }
       .follow-btn:active { transform: scale(0.9); }
       .follow-btn .icon-plus, .follow-btn .icon-bell {
           position: absolute; width: 15px; height: 15px;
           transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
       }
       .follow-btn .icon-plus { stroke: var(--text-secondary); fill: none; stroke-width: 2; opacity: 1; transform: scale(1) rotate(0deg); }
       .follow-btn .icon-bell { stroke: var(--accent); fill: none; stroke-width: 1.8; opacity: 0; transform: scale(0.4) rotate(-20deg); }
       .follow-btn.following { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 10px var(--accent-glow); }
       .follow-btn.following .icon-plus { opacity: 0; transform: scale(0.4) rotate(90deg); }
       .follow-btn.following .icon-bell { opacity: 1; transform: scale(1) rotate(0deg); }
       @keyframes bellRing {
           0%{transform:scale(1) rotate(0deg)} 15%{transform:scale(1.15) rotate(-18deg)}
           30%{transform:scale(1.15) rotate(14deg)} 45%{transform:scale(1.08) rotate(-10deg)}
           60%{transform:scale(1.08) rotate(7deg)} 75%{transform:scale(1) rotate(-4deg)}
           90%{transform:scale(1) rotate(2deg)} 100%{transform:scale(1) rotate(0deg)}
       }
       .follow-btn.ringing .icon-bell { animation: bellRing 0.55s cubic-bezier(0.36,0.07,0.19,0.97) forwards; }

       /* Own-article edit button in header */
       .edit-own-btn {
           width: 32px; height: 32px; border-radius: 50%;
           border: 1.5px solid var(--border-color);
           background: var(--hover-bg); cursor: pointer;
           display: flex; align-items: center; justify-content: center;
           flex-shrink: 0;
           transition: border-color 0.2s, color 0.2s;
           color: var(--text-secondary);
           font-size: 12px;
       }
       .edit-own-btn:hover { border-color: var(--accent); color: var(--accent); }
       .edit-own-btn.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

       .article-title {
           font-size: 20px; font-weight: 800; color: var(--text-primary);
           margin-bottom: 10px; line-height: 1.2; flex-shrink: 0;
           letter-spacing: -0.02em; padding: 0 18px;
           font-family: 'Merriweather', serif;
       }
       .article-title.editing-title {
           font-family: 'Merriweather', serif;
           border: none; outline: none; background: transparent;
           border-bottom: 1.5px solid var(--accent);
           width: calc(100% - 36px);
           resize: none; overflow: hidden;
           caret-color: var(--accent);
       }
       .article-stats {
           display: flex; align-items: center; gap: 14px;
           margin-bottom: 10px; flex-shrink: 0; padding: 0 18px;
       }
       .stat-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); font-weight: 500; }
       .stat-item.views i { color: var(--accent); }
       .stat-item.likes i { color: #d4845a; }

       .article-content {
           color: var(--text-primary);
           font-size: 14px; line-height: 1.65;
           flex: 1; overflow-y: auto;
           padding: 0 18px; padding-right: 62px; padding-bottom: 110px;
           letter-spacing: 0.01em;
           text-align: justify;
       }
       .article-content::-webkit-scrollbar { width: 2px; }
       .article-content::-webkit-scrollbar-track { background: transparent; }
       .article-content::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
       .content-paragraph { margin-bottom: 12px; }

       /* Editable paragraph */
       .content-paragraph.editable-para {
           position: relative;
           border-left: 2px solid transparent;
           padding-left: 6px;
           margin-left: -8px;
           transition: border-color 0.15s;
           cursor: text;
       }
       .content-paragraph.editable-para:hover { border-left-color: rgba(200,169,110,0.3); }
       .content-paragraph.editable-para.editing-para { border-left-color: var(--accent); }
       .para-textarea {
           width: 100%; background: transparent; border: none; outline: none;
           font-size: 14px; line-height: 1.65; color: var(--text-primary);
           font-family: "DM Sans", sans-serif; letter-spacing: 0.01em;
           resize: none; overflow: hidden; padding: 0;
           caret-color: var(--accent); display: none;
       }
       .para-display { display: block; }
       .para-textarea.active { display: block; }
       .para-textarea.active + .para-display { display: none; }

       /* Edit mode toolbar (floating above bottom actions) */
       .edit-mode-toolbar {
           position: absolute; bottom: 110px; left: 18px; right: 62px;
           background: rgba(20,18,16,0.97); border: 1px solid var(--border-color);
           border-radius: 14px; padding: 10px 12px;
           display: none; align-items: center; gap: 8px;
           z-index: 20; flex-wrap: wrap;
           backdrop-filter: blur(12px);
       }
       .edit-mode-toolbar.show { display: flex; }
       .em-btn {
           padding: 5px 10px; border-radius: 7px; border: 1px solid var(--border-color);
           background: var(--hover-bg); color: var(--text-secondary);
           font-size: 10px; font-weight: 700; cursor: pointer;
           display: flex; align-items: center; gap: 4px;
           font-family: "DM Sans", sans-serif; flex-shrink: 0;
           transition: all 0.15s;
       }
       .em-btn:hover { border-color: var(--accent); color: var(--accent); }
       .em-btn.primary { background: var(--accent); color: #0f0e0b; border-color: var(--accent); }
       .em-btn.danger { background: rgba(196,106,78,0.15); color: #c46a4e; border-color: rgba(196,106,78,0.3); }

       .article-full-img-wrap {
           width: calc(100% + 80px);
           margin-left: -18px; margin-right: -62px;
           margin-bottom: 12px; margin-top: 4px;
           overflow: hidden;
       }
       .article-full-img-wrap img {
           width: 100%; height: auto; display: block;
           max-height: 340px; object-fit: cover;
       }
       .article-full-img-wrap .media-caption {
           font-size: 12px; color: var(--text-secondary);
           font-style: italic; padding: 7px 18px 0 18px;
       }

       /* ── YouTube: NO header/border, full-bleed, custom player ── */
       .article-full-yt-wrap {
           width: calc(100% + 80px);
           margin-left: -18px; margin-right: -62px;
           margin-bottom: 12px; margin-top: 4px;
           position: relative; overflow: hidden;
           background: #000;
       }
       .article-full-yt-wrap.yt-vertical {
           width: calc(100% + 80px);
       }
       .article-full-yt-wrap iframe {
           width: 100%; border: none; display: block;
           aspect-ratio: 16/9;
       }
       .article-full-yt-wrap.yt-vertical iframe {
           aspect-ratio: 9/16;
           max-height: 70vh;
       }
       /* Custom YT overlay controls */
       .yt-custom-controls {
           position: absolute; bottom: 0; left: 0; right: 0;
           padding: 28px 14px 10px;
           background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
           display: flex; align-items: center; gap: 10px;
           opacity: 0; transition: opacity 0.25s ease;
           pointer-events: none;
       }
       .article-full-yt-wrap:hover .yt-custom-controls,
       .article-full-yt-wrap.yt-controls-visible .yt-custom-controls {
           opacity: 1; pointer-events: all;
       }
       .yt-ctrl-btn {
           width: 32px; height: 32px; border-radius: 50%;
           background: rgba(255,255,255,0.12); border: none;
           color: #fff; cursor: pointer; flex-shrink: 0;
           display: flex; align-items: center; justify-content: center;
           font-size: 12px; backdrop-filter: blur(4px);
           transition: background 0.15s;
       }
       .yt-ctrl-btn:hover { background: rgba(255,255,255,0.22); }
       .yt-progress-wrap {
           flex: 1; height: 3px; background: rgba(255,255,255,0.2);
           border-radius: 2px; cursor: pointer; position: relative;
       }
       .yt-progress-bar {
           height: 100%; background: var(--accent); border-radius: 2px;
           width: 0%; transition: width 0.5s linear;
       }
       .yt-time { font-size: 9px; color: rgba(255,255,255,0.7); font-weight: 600; white-space: nowrap; }

       /* ── MCQ ── */
       .heart-burst {
           position: fixed; pointer-events: none; z-index: 9999;
           transform: translate(-50%, -50%);
           animation: heartBurstAnim 0.72s cubic-bezier(0.16,1,0.3,1) forwards;
       }
       .heart-burst svg { width: 80px; height: 80px; filter: drop-shadow(0 0 14px rgba(200,169,110,0.6)); }
       @keyframes heartBurstAnim {
           0%{opacity:0;transform:translate(-50%,-50%) scale(0.25) rotate(-12deg);}
           28%{opacity:1;transform:translate(-50%,-50%) scale(1.3) rotate(4deg);}
           52%{opacity:1;transform:translate(-50%,-50%) scale(0.92) rotate(-2deg);}
           72%{opacity:0.9;transform:translate(-50%,-50%) scale(1.08) rotate(0deg);}
           100%{opacity:0;transform:translate(-50%,-50%) scale(0.8) rotate(0deg) translateY(-18px);}
       }
       .mcq-card {
           position: relative; height: 100vh;
           scroll-snap-align: start; scroll-snap-stop: always;
           background: var(--bg-color);
           padding: 8px 18px 100px;
           padding-top: calc(20px + env(safe-area-inset-top));
           display: flex; flex-direction: column; overflow: hidden;
       }
       .mcq-badge {
           display: inline-flex; align-items: center; gap: 6px;
           background: var(--accent-soft); border: 1px solid rgba(200,169,110,0.3);
           border-radius: 20px; padding: 4px 12px;
           font-size: 10px; font-weight: 800; letter-spacing: 0.08em;
           text-transform: uppercase; color: var(--accent);
           margin-bottom: 16px; flex-shrink: 0; align-self: flex-start;
       }
       .mcq-question {
           font-size: 19px; font-weight: 800; color: var(--text-primary);
           line-height: 1.3; margin-bottom: 14px; flex-shrink: 0;
           padding-right: 50px; letter-spacing: -0.02em;
           font-family: 'Merriweather', serif;
       }
       .mcq-media { padding-right: 60px; flex-shrink: 0; margin-bottom: 14px; }
       .mcq-scroll-area {
           flex: 1; overflow-y: auto; padding-right: 60px;
           display: flex; flex-direction: column; gap: 0;
       }
       .mcq-scroll-area::-webkit-scrollbar { width: 2px; }
       .mcq-scroll-area::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
       .mcq-options { display: flex; flex-direction: column; gap: 9px; }
       .mcq-option {
           display: flex; align-items: center; gap: 12px;
           padding: 13px 14px; border-radius: 12px;
           border: 1px solid var(--border-color); background: var(--hover-bg);
           cursor: pointer;
           transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
           text-align: left; font-size: 14px; font-weight: 500;
           color: var(--text-primary); line-height: 1.4;
           -webkit-tap-highlight-color: transparent; width: 100%;
       }
       .mcq-option:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 12px var(--accent-glow); }
       .mcq-option .opt-letter {
           width: 26px; height: 26px; border-radius: 50%;
           border: 1.5px solid var(--border-color);
           display: flex; align-items: center; justify-content: center;
           font-size: 10px; font-weight: 800; flex-shrink: 0;
           color: var(--text-secondary); transition: all 0.15s ease;
       }
       .mcq-option .opt-text { flex: 1; }
       .mcq-option:disabled { cursor: default; }
       .mcq-option.selected-correct { border-color: #6abf85; background: rgba(106,191,133,0.08); box-shadow: 0 0 12px rgba(106,191,133,0.15); }
       .mcq-option.selected-correct .opt-letter { background: #6abf85; border-color: #6abf85; color: #0f0e0b; }
       .mcq-option.selected-wrong { border-color: #c46a4e; background: rgba(196,106,78,0.07); }
       .mcq-option.selected-wrong .opt-letter { background: #c46a4e; border-color: #c46a4e; color: #fff; }
       .mcq-option.reveal-correct { border-color: rgba(106,191,133,0.5); }
       .mcq-option.reveal-correct .opt-letter { border-color: #6abf85; color: #6abf85; }
       .mcq-result-msg { font-size: 13px; font-weight: 700; margin-top: 14px; min-height: 18px; color: var(--text-secondary); flex-shrink: 0; }
       .mcq-result-msg.correct { color: #6abf85; }
       .mcq-result-msg.wrong { color: #c46a4e; }

       /* ── Action Buttons ── */
       .action-buttons {
           position: absolute; right: 14px; bottom: 143px;
           display: flex; flex-direction: column; gap: 20px; z-index: 10;
           filter: drop-shadow(0 4px 16px rgba(0,0,0,0.7));
       }
       .action-btn {
           display: flex; flex-direction: column; align-items: center; gap: 3px;
           background: none; border: none; cursor: pointer; transition: transform 0.1s;
       }
       .action-btn:active { transform: scale(0.88); }
       .action-btn svg { width: 26px; height: 26px; stroke: #fff; fill: none; stroke-width: 2; }
       .action-btn span { color: #fff; font-size: 10px; font-weight: 700; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
       .action-btn.like-btn svg { stroke: #fff; fill: none; transition: fill 0.2s ease, stroke 0.2s ease; }
       .action-btn.like-btn.liked svg { fill: #d4845a; stroke: #d4845a; }

       .media-embed { margin: 10px 0; max-width: 100%; }
       .media-embed img { width: 100%; max-width: 100%; height: auto; border-radius: 10px; display: block; }
       .media-caption { font-size: 12px; color: var(--text-secondary); margin-top: 5px; font-style: italic; }

       .custom-audio-player {
           background: var(--hover-bg); border-radius: 12px; padding: 14px;
           display: flex; align-items: center; gap: 12px; max-width: 100%;
           border: 1px solid var(--border-color);
       }
       .play-btn {
           width: 40px; height: 40px; border-radius: 50%;
           background: var(--accent); border: none; color: #0f0e0b;
           cursor: pointer; display: flex; align-items: center; justify-content: center;
           font-size: 14px; transition: background 0.2s ease, box-shadow 0.2s ease; flex-shrink: 0;
           box-shadow: 0 0 14px var(--accent-glow);
       }
       .play-btn:hover { background: var(--accent-hover); }
       .audio-info { flex: 1; min-width: 0; overflow: hidden; }
       .audio-title { font-size: 12px; font-weight: 600; margin-bottom: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-primary); }
       .waveform-container { position: relative; height: 28px; background: var(--bg-color); border-radius: 6px; margin-bottom: 5px; cursor: pointer; overflow: hidden; }
       .waveform-progress { position: absolute; top: 0; left: 0; height: 100%; background: var(--accent); opacity: 0.35; transition: width 0.1s linear; }
       .waveform-bars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: space-around; padding: 0 4px; }
       .waveform-bar { width: 2px; background: var(--text-secondary); border-radius: 2px; opacity: 0.5; }
       .audio-time { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-secondary); }

       /* ── Toast ── */
       .share-toast {
           position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px);
           background: #1a1810; border: 1px solid var(--border-color);
           border-radius: 14px; padding: 10px 18px;
           font-size: 13px; font-weight: 700; color: var(--text-primary);
           z-index: 9999; opacity: 0;
           transition: opacity 0.2s ease, transform 0.2s ease;
           pointer-events: none; white-space: nowrap;
           box-shadow: 0 8px 24px rgba(0,0,0,0.5);
       }
       .share-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

       /* ── Comments ── */
       .comments-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 199; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; backdrop-filter: blur(4px); }
       .comments-overlay.active { opacity: 1; pointer-events: all; }
       .comments-popup {
           position: fixed; top: 50%; left: 50%;
           transform: translate(-50%, -50%) scale(0.9);
           width: calc(100% - 40px); max-width: 500px;
           height: 70vh; max-height: 600px;
           background: #141210; border-radius: 20px; z-index: 200;
           opacity: 0; pointer-events: none;
           transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
           display: flex; flex-direction: column;
           box-shadow: 0 24px 80px rgba(0,0,0,0.7), 0 0 0 1px var(--border-color);
       }
       .comments-popup.active { opacity: 1; pointer-events: all; transform: translate(-50%,-50%) scale(1); }
       .comments-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border-color); }
       .comments-header h3 { font-size: 15px; font-weight: 700; }
       .close-comments { background: none; border: none; color: var(--text-primary); font-size: 22px; cursor: pointer; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
       .close-comments:hover { background: var(--hover-bg); }
       .comments-list { flex: 1; overflow-y: auto; padding: 14px 18px; }
       .comments-list::-webkit-scrollbar { width: 3px; }
       .comments-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
       .comment-item { display: flex; gap: 10px; margin-bottom: 18px; }
       .comment-avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #8a6430); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #0f0e0b; flex-shrink: 0; overflow: hidden; }
       .comment-avatar img { width: 100%; height: 100%; object-fit: cover; }
       .comment-content { flex: 1; }
       .comment-author { font-weight: 700; font-size: 12px; margin-bottom: 3px; }
       .comment-text { font-size: 13px; line-height: 1.5; margin-bottom: 5px; }
       .comment-time { font-size: 10px; color: var(--text-secondary); }
       .comment-input-wrapper { padding: 10px 18px; border-top: 1px solid var(--border-color); background: #141210; border-radius: 0 0 20px 20px; }
       .comment-input-container { display: flex; gap: 8px; align-items: center; }
       .comment-input {
           flex: 1; background: var(--hover-bg); border: 1px solid var(--border-color);
           border-radius: 20px; padding: 9px 14px; color: var(--text-primary);
           font-size: 16px; outline: none; transition: border-color 0.15s ease;
           font-family: "DM Sans", sans-serif;
       }
       .comment-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
       .send-comment-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); border: none; color: #0f0e0b; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: background 0.2s ease; flex-shrink: 0; }
       .send-comment-btn:hover { background: var(--accent-hover); }
       .send-comment-btn:disabled { opacity: 0.4; cursor: not-allowed; }
       .no-comments { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-secondary); gap: 10px; }
       .no-comments i { font-size: 40px; opacity: 0.3; color: var(--accent); }
       .loading-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-primary); gap: 14px; }
       .spinner { width: 40px; height: 40px; border: 3px solid var(--border-color); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
       @keyframes spin { to { transform: rotate(360deg); } }

       /* ── Skeleton ── */
       @keyframes shimmer { 0%,100%{opacity:0.4} 50%{opacity:0.85} }
       .skeleton-base { background: var(--hover-bg); animation: shimmer 1.6s infinite; border-radius: 6px; }
       .skeleton-card { position: relative; height: 100vh; scroll-snap-align: start; scroll-snap-stop: always; background: var(--bg-color); padding: 8px 18px 100px; padding-top: calc(20px + env(safe-area-inset-top)); display: flex; flex-direction: column; }
       .skeleton-header { display: flex; align-items: center; gap: 12px; flex-shrink: 0; margin-bottom: 16px; }
       .skeleton-avatar { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; }
       .skeleton-author-block { flex: 1; display: flex; flex-direction: column; gap: 6px; }
       .skeleton-name { height: 13px; width: 110px; }
       .skeleton-date { height: 9px; width: 65px; }
       .skeleton-title { height: 22px; width: 88%; margin-bottom: 8px; border-radius: 6px; }
       .skeleton-title-short { height: 22px; width: 62%; margin-bottom: 12px; border-radius: 6px; }
       .skeleton-stats { display: flex; gap: 12px; margin-bottom: 14px; flex-shrink: 0; }
       .skeleton-stat { height: 12px; width: 48px; }
       .skeleton-line { height: 12px; margin-bottom: 9px; width: 100%; }
       .skeleton-line.w90{width:90%}.skeleton-line.w75{width:75%}.skeleton-line.w80{width:80%}.skeleton-line.w65{width:65%}.skeleton-line.w95{width:95%}

       /* ── Footer ── */
       .footer-bar {
           position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
           width: 100%; max-width: 450px;
           background: rgba(15,14,11,0.96);
           border-top: 1px solid var(--border-color);
           padding: 8px 24px;
           padding-bottom: calc(8px + env(safe-area-inset-bottom));
           display: flex; justify-content: space-around; align-items: center;
           z-index: 100;
           backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
       }
       .footer-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: var(--text-secondary); cursor: pointer; transition: color 0.2s ease; padding: 6px 12px; }
       .footer-btn:hover { color: var(--text-primary); }
       .footer-btn.active { color: var(--accent); }
       .footer-btn i { font-size: 19px; }
       .footer-btn span { font-size: 10px; font-weight: 600; }

       /* ══════════════════════════════════
          LIBRARY PICKER — Profile-style
       ══════════════════════════════════ */
       .library-picker-card {
           position: relative; height: 100vh;
           scroll-snap-align: start; scroll-snap-stop: always;
           background: var(--bg-color);
           display: flex; flex-direction: column; overflow: hidden;
       }

       /* Top strip: just logo + settings icon */
       .lp-topbar {
           flex-shrink: 0;
           padding: calc(14px + env(safe-area-inset-top)) 18px 12px;
           display: flex; align-items: center; justify-content: space-between;
       }
       .lp-logo-row { display: flex; align-items: center; gap: 8px; }
       .lp-logo-row img { height: 22px; width: auto; }
       .lp-logo-row span {
           font-size: 14px; font-weight: 800; color: var(--text-primary);
           font-family: 'Merriweather', serif; letter-spacing: -0.02em;
       }

       /* Settings icon & popup */
       .lp-settings-btn {
           width: 32px; height: 32px; border-radius: 50%;
           border: 1.5px solid var(--border-color); background: var(--hover-bg);
           color: var(--text-secondary); cursor: pointer;
           display: flex; align-items: center; justify-content: center;
           font-size: 13px; transition: border-color 0.2s, color 0.2s;
           flex-shrink: 0;
       }
       .lp-settings-btn:hover { border-color: var(--accent); color: var(--accent); }

       .lp-settings-popup {
           position: absolute; top: calc(14px + env(safe-area-inset-top) + 40px); right: 18px;
           width: 260px; background: #141210;
           border: 1px solid var(--border-color); border-radius: 14px;
           padding: 14px; z-index: 60;
           box-shadow: 0 12px 40px rgba(0,0,0,0.6);
           display: none;
       }
       .lp-settings-popup.show { display: block; }
       .lp-settings-section { margin-bottom: 14px; }
       .lp-settings-section:last-child { margin-bottom: 0; }
       .lp-settings-label {
           font-size: 9px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
           color: var(--text-secondary); margin-bottom: 8px; display: block;
       }
       /* Toggle row */
       .lp-toggle-row {
           display: flex; align-items: center; justify-content: space-between;
           padding: 6px 0;
       }
       .lp-toggle-name { font-size: 12px; font-weight: 600; color: var(--text-primary); }
       .lp-toggle {
           width: 36px; height: 20px; border-radius: 10px;
           background: var(--border-color); position: relative;
           cursor: pointer; transition: background 0.2s;
           border: none; flex-shrink: 0;
       }
       .lp-toggle.on { background: var(--accent); }
       .lp-toggle::after {
           content: ''; position: absolute; top: 3px; left: 3px;
           width: 14px; height: 14px; border-radius: 50%;
           background: #fff; transition: transform 0.2s;
       }
       .lp-toggle.on::after { transform: translateX(16px); }

       /* Font selector pills */
       .lp-font-pills { display: flex; gap: 5px; flex-wrap: wrap; }
       .lp-font-pill {
           padding: 4px 10px; border-radius: 20px;
           border: 1px solid var(--border-color); background: var(--hover-bg);
           font-size: 11px; cursor: pointer; color: var(--text-secondary);
           transition: all 0.15s; white-space: nowrap;
       }
       .lp-font-pill.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

       /* Size slider */
       .lp-size-row { display: flex; align-items: center; gap: 8px; }
       .lp-size-slider {
           flex: 1; -webkit-appearance: none; appearance: none;
           height: 3px; background: var(--border-color); border-radius: 2px; outline: none;
       }
       .lp-size-slider::-webkit-slider-thumb {
           -webkit-appearance: none; width: 14px; height: 14px;
           border-radius: 50%; background: var(--accent); cursor: pointer;
       }
       .lp-size-label { font-size: 10px; color: var(--text-secondary); width: 24px; text-align: right; }

       /* Auth status in settings */
       .lp-auth-status {
           display: flex; align-items: center; gap: 8px; padding: 8px 10px;
           background: var(--hover-bg); border-radius: 10px; border: 1px solid var(--border-color);
       }
       .lp-auth-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
       .lp-auth-dot.online { background: #6abf85; }
       .lp-auth-dot.offline { background: #c46a4e; }
       .lp-auth-name { font-size: 11px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
       .lp-auth-action { font-size: 10px; color: var(--accent); cursor: pointer; font-weight: 700; flex-shrink: 0; }

       /* Library shelf — poster style from profile */
       .lp-body {
           flex: 1; overflow-y: auto; overflow-x: hidden;
           padding: 4px 0 0;
       }
       .lp-body::-webkit-scrollbar { width: 2px; }
       .lp-body::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

       .lp-section-label {
           font-size: 10px; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase;
           color: var(--accent); display: flex; align-items: center; gap: 6px;
           padding: 4px 18px; flex-shrink: 0; margin-bottom: 6px;
       }
       .lp-shelf-wrap { overflow: visible; margin-bottom: 14px; padding-top: 4px; }
       .lp-shelf {
           display: flex; gap: 10px;
           width: calc(100% + 36px);
           margin-left: -18px; padding-left: 18px; padding-right: 18px;
           overflow-x: auto; overflow-y: visible;
           scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
           padding-bottom: 8px;
       }
       .lp-shelf::-webkit-scrollbar { height: 2px; }
       .lp-shelf::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

       /* Poster card */
       .lp-movie-card {
           flex-shrink: 0; width: 130px;
           scroll-snap-align: start; cursor: pointer; position: relative;
           border-radius: 10px; overflow: visible;
           transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
       }
       .lp-movie-card:hover { transform: translateY(-4px) scale(1.02); z-index: 20; }
       .lp-movie-card.selected { transform: translateY(-4px) scale(1.02); z-index: 20; }
       .lp-movie-card.selected .lp-movie-poster {
           box-shadow: 0 0 0 2.5px var(--accent), 0 12px 32px var(--accent-glow);
           border-color: var(--accent);
       }
       .lp-movie-poster {
           width: 130px; height: 190px; border-radius: 10px; overflow: hidden; position: relative;
           background: linear-gradient(135deg, #1e1a10 0%, #0e0c08 100%);
           border: 1px solid var(--border-color);
           box-shadow: 0 6px 20px rgba(0,0,0,0.5);
           transition: box-shadow 0.22s ease, border-color 0.22s ease;
       }
       .lp-movie-poster img { width: 100%; height: 100%; object-fit: cover; }
       .lp-poster-placeholder {
           width: 100%; height: 100%;
           display: flex; flex-direction: column;
           align-items: center; justify-content: center; gap: 8px;
           background: linear-gradient(160deg, #1e1a10 0%, #0e0c08 100%);
       }
       .lp-poster-letter { font-size: 26px; font-weight: 800; color: rgba(200,169,110,0.2); font-family: 'Merriweather', serif; }
       .lp-poster-icon { font-size: 18px; color: rgba(200,169,110,0.15); }
       .lp-movie-overlay {
           position: absolute; inset: 0;
           background: linear-gradient(to top, rgba(10,8,5,0.96) 0%, rgba(10,8,5,0.3) 50%, transparent 75%);
           display: flex; flex-direction: column; justify-content: flex-end; padding: 8px;
       }
       .lp-movie-count {
           display: inline-flex; align-items: center; gap: 3px;
           background: rgba(200,169,110,0.18); border: 1px solid rgba(200,169,110,0.25);
           backdrop-filter: blur(6px); border-radius: 5px; padding: 2px 6px;
           font-size: 9px; font-weight: 700; color: var(--accent);
           align-self: flex-start; margin-bottom: 4px;
       }
       .lp-movie-info { padding: 6px 2px 0; }
       .lp-movie-title {
           font-size: 12px; font-weight: 700; line-height: 1.3; color: var(--text-primary);
           display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
           margin-bottom: 3px; transition: color 0.2s ease;
       }
       .lp-movie-card:hover .lp-movie-title,
       .lp-movie-card.selected .lp-movie-title { color: var(--accent); }
       .lp-movie-meta { font-size: 10px; color: var(--text-secondary); }

       /* Browse All button in shelf */
       .lp-browse-all-card {
           flex-shrink: 0; width: 90px; cursor: pointer;
           display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 8px; padding-bottom: 48px;
       }
       .lp-browse-all-inner {
           width: 90px; height: 190px; border-radius: 10px;
           border: 1.5px dashed var(--border-color);
           display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 8px; background: var(--hover-bg);
           transition: border-color 0.2s, background 0.2s;
       }
       .lp-browse-all-card:hover .lp-browse-all-inner { border-color: var(--accent); background: var(--accent-soft); }
       .lp-browse-all-inner i { font-size: 20px; color: var(--text-secondary); }
       .lp-browse-all-inner span { font-size: 10px; font-weight: 700; color: var(--text-secondary); text-align: center; line-height: 1.3; }

       /* Scroll hint */
       .lp-scroll-hint {
           display: flex; align-items: center; justify-content: center; gap: 6px;
           font-size: 11px; color: var(--text-secondary); font-weight: 500;
           padding: 10px 0 calc(10px + env(safe-area-inset-bottom) + 72px);
           flex-shrink: 0;
       }
       .lp-scroll-hint i { font-size: 10px; opacity: 0.5; }

       /* Picker exit animation */
       @keyframes lp-card-exit {
           0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-24px) scale(0.97)}
       }
       .library-picker-card.exiting { animation: lp-card-exit 0.35s cubic-bezier(0.4,0,0.2,1) forwards; pointer-events: none; }
       .lp-loading { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 12px; padding: 20px 0; }

       /* ══════════════════════════════════
          TERM POPUP
       ══════════════════════════════════ */
       .term-link {
           color: var(--accent); border-bottom: 1px dashed rgba(200,169,110,0.45);
           cursor: pointer; font-weight: 600; transition: opacity 0.15s ease;
           -webkit-tap-highlight-color: transparent;
       }
       .term-link:hover { opacity: 0.75; }
       .term-popup {
           position: fixed; width: 270px; max-width: calc(100vw - 24px);
           background: #141210; border: 1px solid var(--border-color);
           border-radius: 12px; padding: 12px 14px 10px; z-index: 301;
           opacity: 0; pointer-events: none;
           transition: opacity 0.18s ease, transform 0.18s ease; transform: translateY(4px);
           box-shadow: 0 12px 40px rgba(0,0,0,0.6);
       }
       .term-popup.active { opacity: 1; pointer-events: all; transform: translateY(0); }
       .term-popup-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
       .term-popup-term { font-size: 12px; font-weight: 900; color: var(--accent); flex: 1; margin-right: 8px; }
       .term-popup-close { width: 20px; height: 20px; border-radius: 50%; background: var(--hover-bg); border: none; color: var(--text-secondary); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
       .term-popup-divider { height: 1px; background: var(--border-color); margin-bottom: 9px; }
       .term-popup-body { font-size: 12px; line-height: 1.6; color: var(--text-secondary); }

       /* ── Confetti ── */
       #confettiCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9998; }

       /* ══════════════════════════════════
          EMOJI HIGHLIGHT SYSTEM
          Toggleable, font-aware, size-aware
       ══════════════════════════════════ */

       /* Global toggle: when .emo-highlights-off is on body, all spans become plain */
       body.emo-highlights-off [class^="emo-"],
       body.emo-highlights-off [class*=" emo-"] {
           all: unset !important;
           color: inherit !important;
           font-size: inherit !important;
           font-family: inherit !important;
       }

       /* Font variants applied via body classes */
       body.emo-font-merriweather [class^="emo-"],
       body.emo-font-merriweather [class*=" emo-"] { --emo-font: 'Merriweather', serif; }
       body.emo-font-mono [class^="emo-"],
       body.emo-font-mono [class*=" emo-"] { --emo-font: 'Courier New', monospace; }
       body.emo-font-arabic [class^="emo-"],
       body.emo-font-arabic [class*=" emo-"] { --emo-font: 'Amiri', serif; }
       body.emo-font-dm [class^="emo-"],
       body.emo-font-dm [class*=" emo-"] { --emo-font: 'DM Sans', sans-serif; }

       /* Size via CSS variable */
       body [class^="emo-"], body [class*=" emo-"] {
           font-size: calc(1em * var(--emo-size-scale, 1));
       }

       /* ── Emoji styles (fixed, visually clean) ── */
       .emo-magnify { font-weight: 700; font-size: calc(1.12em * var(--emo-size-scale,1)); }
       .emo-pinned { font-weight: 700; border-left: 2px solid var(--accent); padding-left: 0.4em; background: linear-gradient(to right, var(--accent-soft), transparent); border-radius: 0 4px 4px 0; }
       .emo-book { font-family: var(--emo-font, 'Merriweather', Georgia, serif); background: rgba(200,169,110,0.07); color: #d4b88a; padding: 0.06em 0.3em; border-radius: 4px; border: 1px solid rgba(200,169,110,0.15); }
       .emo-brain { font-style: italic; color: var(--accent); border-bottom: 1.5px solid rgba(200,169,110,0.4); }
       .emo-temple { font-family: var(--emo-font, 'Merriweather', Georgia, serif); color: #c4b090; letter-spacing: 0.04em; }
       .emo-science { font-family: var(--emo-font, 'Courier New', monospace); color: #c0b080; font-size: calc(0.9em * var(--emo-size-scale,1)); border-bottom: 1px solid rgba(192,176,128,0.4); }
       .emo-micro { font-family: var(--emo-font, 'Courier New', monospace); color: #c8a96e; font-size: calc(0.9em * var(--emo-size-scale,1)); border-bottom: 1px dotted rgba(200,169,110,0.45); }
       .emo-robot { font-family: var(--emo-font, 'Courier New', monospace); color: #b8b0a0; border: 1px solid rgba(184,176,160,0.2); padding: 0.04em 0.28em; border-radius: 3px; font-size: calc(0.9em * var(--emo-size-scale,1)); }

       /* Colors */
       .emo-yellow { color: #e8c86a; font-weight: 600; }
       .emo-red    { color: #d4705a; font-weight: 600; }
       .emo-green  { color: #7ab88a; font-weight: 600; }
       .emo-blue   { color: #8ab0cc; font-weight: 600; }
       .emo-purple { color: #c8a96e; font-weight: 600; animation: champagnePulse 2.2s ease-in-out infinite; }
       @keyframes champagnePulse { 0%,100%{text-shadow:0 0 8px rgba(200,169,110,0.5)} 50%{text-shadow:0 0 18px rgba(220,190,130,0.9)} }
       .emo-dark { color: #f0e8d8; background: rgba(0,0,0,0.7); padding: 0.06em 0.3em; border-radius: 4px; }

       /* Semantic / status */
       .emo-idea { background: linear-gradient(to right, var(--accent-soft), rgba(200,169,110,0.03)); color: #d4a96e; padding: 0.06em 0.3em; border-radius: 4px; }
       .emo-urgent { font-weight: 700; color: #e8c86a; background: rgba(232,200,106,0.1); border: 1px solid rgba(232,200,106,0.25); padding: 0.06em 0.3em; border-radius: 5px; animation: urgentPulse 1.6s ease-in-out infinite; display: inline-block; }
       @keyframes urgentPulse { 0%,100%{box-shadow:0 0 0 0 rgba(232,200,106,0.25)} 50%{box-shadow:0 0 0 4px rgba(232,200,106,0)} }
       .emo-warning { background: rgba(200,169,110,0.08); border: 1px solid rgba(200,169,110,0.3); color: #c8a96e; padding: 0.06em 0.35em; border-radius: 5px; font-weight: 700; }
       .emo-check { color: #7ab88a; background: rgba(122,184,138,0.1); padding: 0.06em 0.28em; border-radius: 4px; font-weight: 700; }
       .emo-cross { color: #c97a5a; background: rgba(201,122,90,0.08); padding: 0.06em 0.28em; border-radius: 4px; text-decoration: line-through; text-decoration-color: rgba(201,122,90,0.5); }
       .emo-target { font-weight: 700; outline: 1.5px solid rgba(200,169,110,0.45); outline-offset: 3px; padding: 0.06em 0.25em; }
       .emo-lock { color: #8a8070; background: rgba(42,37,24,0.8); padding: 0.06em 0.32em; border-radius: 4px; border: 1px solid var(--border-color); font-weight: 600; }
       .emo-unlock { color: var(--accent); background: var(--accent-soft); padding: 0.06em 0.32em; border-radius: 4px; border: 1px solid rgba(200,169,110,0.25); }
       .emo-hourglass { color: var(--accent); background: var(--accent-soft); padding: 0.06em 0.28em; border-radius: 4px; }
       .emo-puzzle { border: 1px dashed rgba(200,169,110,0.35); padding: 0.06em 0.32em; border-radius: 5px; color: #c8a96e; }
       .emo-tag { background: var(--accent-soft); border: 1px solid rgba(200,169,110,0.2); color: #c8a96e; padding: 0.04em 0.5em; border-radius: 20px; font-size: calc(0.88em * var(--emo-size-scale,1)); }

       /* Gradient / animated */
       .emo-fire { font-weight: 700; background: linear-gradient(90deg,#c87040,#e8a040,#c8a96e); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: fireMove 2s linear infinite; }

<!-- ── Confetti ── -->
<script>
(function(){
   const canvas=document.getElementById('confettiCanvas'),ctx=canvas.getContext('2d');
   let particles=[],animFrame=null;
   function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
   window.addEventListener('resize',resize);resize();
   const COLORS=['#c8a96e','#e8d8a0','#a07840','#d4b86a','#7ab88a','#c97a5a','#8aa0c0','#f0e8d8'];
   function spawnParticles(x,y){
       for(let i=0;i<70;i++){const angle=Math.random()*Math.PI*2,speed=Math.random()*6+2;particles.push({x:x??canvas.width/2,y:y??canvas.height*0.4,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-3,size:Math.random()*6+3,color:COLORS[Math.floor(Math.random()*COLORS.length)],alpha:1,rotation:Math.random()*Math.PI*2,rotSpeed:(Math.random()-0.5)*0.2,shape:Math.random()>0.5?'rect':'circle'});}
       if(!animFrame)animate();
   }
   function animate(){
       ctx.clearRect(0,0,canvas.width,canvas.height);
       particles=particles.filter(p=>p.alpha>0.01);
       particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.vx*=0.99;p.alpha-=0.018;p.rotation+=p.rotSpeed;ctx.save();ctx.globalAlpha=Math.max(0,p.alpha);ctx.translate(p.x,p.y);ctx.rotate(p.rotation);ctx.fillStyle=p.color;if(p.shape==='rect'){ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);}else{ctx.beginPath();ctx.arc(0,0,p.size/2,0,Math.PI*2);ctx.fill();}ctx.restore();});
       if(particles.length>0){animFrame=requestAnimationFrame(animate);}else{animFrame=null;ctx.clearRect(0,0,canvas.width,canvas.height);}
   }
   window.launchConfetti=function(targetEl){if(targetEl){const r=targetEl.getBoundingClientRect();spawnParticles(r.left+r.width/2,r.top+r.height/2);}else{spawnParticles();}};
})();
</script>

<!-- ── Term popup ── -->
<script>
window._termPopupOutside=null;
window.openTermPopup=function(term,explanation,event){
   const popup=document.getElementById('termPopup');
   document.getElementById('termPopupTerm').textContent=term;
   document.getElementById('termPopupBody').innerHTML=explanation;
   const POPUP_W=270,POPUP_H=150,MARGIN=8,vw=window.innerWidth,vh=window.innerHeight;
   let anchorX=event?event.clientX:vw/2,anchorY=event?event.clientY:vh/2;
   let left=anchorX-POPUP_W/2,top=anchorY+14;
   left=Math.max(MARGIN,Math.min(left,vw-POPUP_W-MARGIN));
   if(top+POPUP_H>vh-MARGIN)top=anchorY-POPUP_H-8;top=Math.max(MARGIN,top);
   popup.style.left=left+'px';popup.style.top=top+'px';
   popup.classList.add('active');
   if(window._termPopupOutside)document.removeEventListener('click',window._termPopupOutside);
   setTimeout(()=>{window._termPopupOutside=function(e){if(!popup.contains(e.target)&&!e.target.classList.contains('term-link'))closeTermPopup();};document.addEventListener('click',window._termPopupOutside,{once:true});},10);
};
window.closeTermPopup=function(){
   document.getElementById('termPopup').classList.remove('active');
   if(window._termPopupOutside){document.removeEventListener('click',window._termPopupOutside);window._termPopupOutside=null;}
};
</script>

<!-- ── Emoji rendering ── -->
<script>
const EMOJI_MAP={
   '🔍':'emo-magnify','❗':'emo-urgent','📌':'emo-pinned','🔥':'emo-fire','💎':'emo-diamond',
   '🟡':'emo-yellow','🔵':'emo-blue','🟢':'emo-green','🟣':'emo-purple','🔴':'emo-red',
   '⚫':'emo-dark','🧠':'emo-brain','📖':'emo-book','💡':'emo-idea','🎯':'emo-target',
   '🧩':'emo-puzzle','🏷️':'emo-tag','🔬':'emo-micro','⚠️':'emo-warning','✅':'emo-check',
   '❌':'emo-cross','⏳':'emo-hourglass','🔒':'emo-lock','🔓':'emo-unlock','⚡':'emo-lightning',
   '🌊':'emo-wave','🌀':'emo-spin','💫':'emo-float','🚀':'emo-rocket','🎬':'emo-cinematic',
   '🌟':'emo-star','✨':'emo-sparkle','🌈':'emo-rainbow','👑':'emo-crown','🪄':'emo-magic',
   '❤️':'emo-heart','😄':'emo-happy','😌':'emo-calm','😮':'emo-surprised','😎':'emo-cool',
   '🤖':'emo-robot','🧪':'emo-science','🏛️':'emo-temple','🌍':'emo-earth','💰':'emo-money',
   '⚖️':'emo-balance','📡':'emo-signal','🎵':'emo-music','🧊':'emo-ice','🔊':'emo-sound',
};
function buildEmojiPattern(){const keys=Object.keys(EMOJI_MAP).sort((a,b)=>b.length-a.length);const escaped=keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');return new RegExp(`(${escaped})([\\s\\S]*?)\\1`,'gu');}
function escHtmlET(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* Arabic detection */
function hasArabic(text){ return /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/.test(text); }

function renderTerms(html){return html.replace(/([A-Za-z][A-Za-z0-9\-']{0,60}?)&lt;([^&]{1,600}?)&gt;/g,function(match,term,explanation){const safeTerm=term.trim().replace(/'/g,'&#39;');const safeExp=explanation.replace(/'/g,'&#39;');return `<span class="term-link" onclick="openTermPopup('${safeTerm}','${safeExp}',event)">${term.trim()}</span>`;});}

function renderEmojiText(text,applyTerms=true){
   const re=buildEmojiPattern();let result='',lastIndex=0,match;
   while((match=re.exec(text))!==null){
       result+=escHtmlET(text.slice(lastIndex,match.index));
       const cls=EMOJI_MAP[match[1]];
       result+=`<span class="${cls}">${renderEmojiText(match[2],false)}</span>`;
       lastIndex=re.lastIndex;
   }
   result+=escHtmlET(text.slice(lastIndex));
   return applyTerms?renderTerms(result):result;
}

/* Wrap Arabic portions of plain text */
function wrapArabic(html){
   return html.replace(/([\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF][^<]*)/g,'<span class="arabic-text">$1</span>');
}
</script>

<!-- ── Image color extraction ── -->
<script>
window._getImageDominantColor = function(imgEl, callback) {
   try {
       const canvas = document.createElement('canvas'),SIZE = 50;
       canvas.width = SIZE; canvas.height = SIZE;
       const ctx = canvas.getContext('2d');
       ctx.drawImage(imgEl, 0, 0, SIZE, SIZE);
       const data = ctx.getImageData(0, 0, SIZE, SIZE).data;
       let r=0,g=0,b=0,cnt=0;
       for(let i=0;i<data.length;i+=4){const a=data[i+3];if(a<128)continue;r+=data[i];g+=data[i+1];b+=data[i+2];cnt++;}
       if(!cnt){callback(null);return;}
       r=Math.min(255,Math.round(r/cnt*1.6));g=Math.min(255,Math.round(g/cnt*1.6));b=Math.min(255,Math.round(b/cnt*1.6));
       callback(`rgb(${r},${g},${b})`);
   } catch(e){ callback(null); }
};
</script>

<!-- ── YouTube custom player state ── -->
<script>
// YT API integration for custom controls
window._ytPlayers = {};
window._ytReady = false;
window.onYouTubeIframeAPIReady = function(){
   window._ytReady = true;
   Object.values(window._ytPlayerCbs || {}).forEach(cb=>cb());
};
// Lazy-load YT API
(function(){
   const tag=document.createElement('script');
   tag.src='https://www.youtube.com/iframe_api';
   document.head.appendChild(tag);
})();
window._ytPlayerCbs = {};

window.initYTPlayer = function(containerId, ytId, isVertical){
   const container = document.getElementById(containerId);
   if(!container) return;
   const iframeId = 'yt-iframe-'+containerId;
   const iframe = container.querySelector('iframe');
   if(iframe) iframe.id = iframeId;

   function doInit(){
       try {
           const player = new YT.Player(iframeId, {
               events: {
                   onStateChange: function(e){
                       const ctrl = document.getElementById('yt-ctrl-'+containerId);
                       if(!ctrl) return;
                       const icon = ctrl.querySelector('.yt-play-icon');
                       if(e.data === YT.PlayerState.PLAYING){
                           if(icon) icon.className='fas fa-pause yt-play-icon';
                           startYTProgress(containerId, player);
                       } else {
                           if(icon) icon.className='fas fa-play yt-play-icon';
                           stopYTProgress(containerId);
                       }
                   }
               }
           });
           window._ytPlayers[containerId] = player;
       } catch(err){ console.warn('[YT player init failed]', err); }
   }

   if(window._ytReady && typeof YT !== 'undefined' && YT.Player){ doInit(); }
   else { window._ytPlayerCbs[containerId] = doInit; }
};

window._ytProgressTimers = {};
window.startYTProgress = function(id, player){
   stopYTProgress(id);
   window._ytProgressTimers[id] = setInterval(()=>{
       try {
           const dur = player.getDuration();
           const cur = player.getCurrentTime();
           if(!dur) return;
           const pct = (cur/dur)*100;
           const bar = document.querySelector('#yt-ctrl-'+id+' .yt-progress-bar');
           if(bar) bar.style.width = pct+'%';
           const time = document.querySelector('#yt-ctrl-'+id+' .yt-time');
           if(time) time.textContent = fmtTime(cur) + ' / ' + fmtTime(dur);
       } catch(e){}
   }, 500);
};
window.stopYTProgress = function(id){
   if(window._ytProgressTimers[id]){ clearInterval(window._ytProgressTimers[id]); delete window._ytProgressTimers[id]; }
};
function fmtTime(s){ const m=Math.floor(s/60),sec=Math.floor(s%60); return m+':'+(sec<10?'0':'')+sec; }

window.ytTogglePlay = function(containerId){
   const player = window._ytPlayers[containerId];
   if(!player) return;
   try {
       const state = player.getPlayerState();
       if(state === 1) player.pauseVideo(); else player.playVideo();
   } catch(e){}
};
window.ytMute = function(containerId){
   const player = window._ytPlayers[containerId];
   if(!player) return;
   try {
       if(player.isMuted()){
           player.unMute();
           const btn=document.querySelector('#yt-ctrl-'+containerId+' .yt-mute-icon');
           if(btn) btn.className='fas fa-volume-up yt-mute-icon';
       } else {
           player.mute();
           const btn=document.querySelector('#yt-ctrl-'+containerId+' .yt-mute-icon');
           if(btn) btn.className='fas fa-volume-mute yt-mute-icon';
       }
   } catch(e){}
};
window.ytFullscreen = function(containerId){
   const el = document.getElementById(containerId);
   if(!el) return;

   if(!player) return;
   try {
       const bar = event.currentTarget;
       const rect = bar.getBoundingClientRect();
       const frac = Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width));
       player.seekTo(player.getDuration()*frac, true);
   } catch(e){}
};

window.toggleInlineEdit = function(articleId, btn){

   if(!card) return;

};

function enterInlineEdit(articleId, card, btn){
   card.classList.add('inline-editing');
   btn.classList.add('active');
   btn.title = 'Save changes';
   btn.innerHTML = '<i class="fas fa-check"></i>';

   // Make title editable
   const titleEl = card.querySelector('.article-title');
   if(titleEl){
       const raw = titleEl.dataset.raw || titleEl.textContent;
       titleEl.dataset.raw = raw;
       const ta = document.createElement('textarea');
       ta.className = 'article-title editing-title';
       ta.value = raw;
       ta.rows = 1;
       ta.oninput = function(){ this.style.height='auto'; this.style.height=this.scrollHeight+'px'; };
       titleEl.replaceWith(ta);
       setTimeout(()=>{ ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; },10);
   }

   // Make each paragraph editable
   card.querySelectorAll('.content-paragraph').forEach(para=>{
       para.classList.add('editable-para');
       const rawText = para.dataset.raw || para.innerText;
       para.dataset.raw = rawText;
       const display = document.createElement('div');
       display.className = 'para-display';
       display.innerHTML = para.innerHTML;
       const ta = document.createElement('textarea');
       ta.className = 'para-textarea';
       ta.value = rawText;
       ta.rows = 1;
       ta.oninput = function(){ this.style.height='auto'; this.style.height=this.scrollHeight+'px'; };
       para.innerHTML = '';
       para.appendChild(ta);
       para.appendChild(display);
       para.addEventListener('click', function(){
           if(!card.classList.contains('inline-editing')) return;
           ta.classList.add('active');
           this.classList.add('editing-para');
           ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px';
           ta.focus();
       });
       ta.addEventListener('blur', function(){
           display.innerHTML = renderEmojiText(this.value);
           ta.classList.remove('active');
           para.classList.remove('editing-para');
       });
   });

   // Show edit toolbar
   const toolbar = card.querySelector('.edit-mode-toolbar');
   if(toolbar) toolbar.classList.add('show');
}

async function commitInlineEdit(articleId, card, btn){
   btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="font-size:10px;"></i>';
   btn.style.pointerEvents = 'none';

   // Collect new title
   const titleTA = card.querySelector('textarea.editing-title');
   const newTitle = titleTA ? titleTA.value.trim() : null;

   // Collect new paragraphs
   const newParas = [];
   card.querySelectorAll('.content-paragraph.editable-para').forEach(para=>{
       const ta = para.querySelector('.para-textarea');
       newParas.push(ta ? ta.value.trim() : para.dataset.raw || '');
   });
   const newContent = newParas.join('\n\n');

   try{
       await ensureSupabaseAuth();
       const updateObj = {};
       if(newTitle) updateObj.title = newTitle;
       if(newContent) updateObj.content = newContent;
       const { error } = await supabase.from('articles').update(updateObj).eq('id', articleId);
       if(error) throw error;

       // Update local cache
       const artIdx = articles.findIndex(a=>a.id===articleId||String(a.id)===String(articleId));
       if(artIdx !== -1){
           if(newTitle) articles[artIdx].title = newTitle;
           if(newContent) articles[artIdx].content = newContent;
       }

       showFeedToast('✓ Saved');
   } catch(e){
       showFeedToast('⚠ Save failed');
   }

   exitInlineEdit(card, btn);
}

function exitInlineEdit(card, btn){
   card.classList.remove('inline-editing');
   btn.classList.remove('active');
   btn.title = 'Edit';
   btn.style.pointerEvents = '';
   btn.innerHTML = '<i class="fas fa-pen"></i>';

   // Restore title
   const titleTA = card.querySelector('textarea.editing-title');
   if(titleTA){
       const div = document.createElement('div');
       div.className = 'article-title';
       div.dataset.raw = titleTA.value;
       div.innerHTML = renderEmojiText(titleTA.value);
       titleTA.replaceWith(div);
   }

   // Restore paragraphs
   card.querySelectorAll('.content-paragraph.editable-para').forEach(para=>{
       const ta = para.querySelector('.para-textarea');
       const display = para.querySelector('.para-display');
       if(ta && display){
           const finalText = ta.value;
           para.dataset.raw = finalText;
           display.innerHTML = renderEmojiText(finalText);
           ta.classList.remove('active');
       }
       para.classList.remove('editable-para','editing-para');
   });

   const toolbar = card.querySelector('.edit-mode-toolbar');
   if(toolbar) toolbar.classList.remove('show');
}

function isMCQ(content){return typeof content==='string'&&content.trimStart().startsWith('❔');}
function parseMCQ(content){
   const lines=content.trim().split('\n').map(l=>l.trim()).filter(Boolean);
   const questionLine=lines[0].replace(/^❔/,'').trim();
   const options=lines.slice(1).map(line=>{const correct=line.startsWith('✅');return{label:line.replace(/^✅/,'').trim(),correct};});
   for(let i=options.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[options[i],options[j]]=[options[j],options[i]];}
   return{question:questionLine,options};
}

       else{d.className='media-embed';d.innerHTML=`<img src="${m.url}" alt="${m.caption||''}">${m.caption?`<div class="media-caption">${m.caption}</div>`:''}`;}
   } else if(m.type==='audio'){
       d.className='media-embed';
       const aid='audio-'+Math.random().toString(36).substr(2,9);
       const bars=Array(15).fill(0).map(()=>`<div class="waveform-bar" style="height:${Math.random()*60+20}%"></div>`).join('');
       d.innerHTML=`<div class="custom-audio-player"><button class="play-btn" onclick="toggleAudio(this,'${aid}')"><i class="fas fa-play"></i></button><div class="audio-info"><div class="audio-title">${m.caption||'Audio'}</div><div class="waveform-container" onclick="seekAudio(event,this,'${aid}')"><div class="waveform-progress"></div><div class="waveform-bars">${bars}</div></div><div class="audio-time"><span class="current-time">0:00</span><span class="duration">0:00</span></div></div><audio id="${aid}" src="${m.url}" style="display:none;"></audio></div>`;
       setTimeout(()=>{const audio=document.getElementById(aid);if(audio)audio.addEventListener('loadedmetadata',()=>{const dur=Math.floor(audio.duration);const dEl=audio.closest('.custom-audio-player')?.querySelector('.duration');if(dEl)dEl.textContent=`${Math.floor(dur/60)}:${(dur%60).toString().padStart(2,'0')}`;});},100);
   } else if(m.type==='pdf'){
       d.className='media-embed';
       d.innerHTML=`<div style="background:var(--hover-bg);border:1px solid var(--border-color);border-radius:12px;overflow:hidden;"><div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border-color);"><i class="fas fa-file-pdf" style="color:#c97a5a;font-size:16px;flex-shrink:0;"></i><span style="font-size:12px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-primary);">${m.caption||'Document'}</span><a href="${m.url}" target="_blank" rel="noopener" style="font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(200,169,110,0.25);border-radius:7px;padding:3px 9px;text-decoration:none;white-space:nowrap;flex-shrink:0;">Open PDF</a></div><iframe src="${m.url}" style="width:100%;height:200px;border:none;display:block;"></iframe></div>`;
   } else if(m.type==='youtube'){
       // Detect vertical from URL param or aspect metadata
       const ytMatch=m.url.match(/embed\/([A-Za-z0-9_-]{11})/);
       const videoId=ytMatch?ytMatch[1]:'';
       const isVertical = m.vertical || (m.url && m.url.includes('shorts'));
       const containerId = 'yt-wrap-'+(++_ytCounter);
       const ctrlId = 'yt-ctrl-'+containerId;

       d.className = forArticleContent ? 'article-full-yt-wrap'+(isVertical?' yt-vertical':'') : 'media-embed';
       d.id = containerId;

       // Append enablejsapi param
       const embedUrl = m.url + (m.url.includes('?')?'&':'?') + 'enablejsapi=1&origin='+encodeURIComponent(location.origin)+'&rel=0&modestbranding=1&iv_load_policy=3&disablekb=1';

       d.innerHTML = `
           <iframe src="${embedUrl}" title="${m.caption||'Video'}"
               allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture"
               allowfullscreen></iframe>
           <div class="yt-custom-controls" id="${ctrlId}">
               <button class="yt-ctrl-btn" onclick="ytTogglePlay('${containerId}')" title="Play/Pause">
                   <i class="fas fa-play yt-play-icon"></i>
               </button>
               <div class="yt-progress-wrap" onclick="ytSeek('${containerId}',event)">
                   <div class="yt-progress-bar"></div>
               </div>
               <span class="yt-time">0:00 / 0:00</span>
               <button class="yt-ctrl-btn" onclick="ytMute('${containerId}')" title="Mute">
                   <i class="fas fa-volume-up yt-mute-icon"></i>
               </button>
               <button class="yt-ctrl-btn" onclick="ytFullscreen('${containerId}')" title="Fullscreen">
                   <i class="fas fa-expand"></i>
               </button>
           </div>`;

       // Show controls on tap/hover
       d.addEventListener('touchstart', ()=>ytShowControls(d), {passive:true});
       d.addEventListener('mousemove', ()=>ytShowControls(d));

       // Init YT player after DOM insertion
       setTimeout(()=>window.initYTPlayer(containerId, videoId, isVertical), 300);
   }
   return d;
}

function buildAuthorHeader(article){
   const avatarContent=getAvatarContent(article);
   const authorSupaId=article.authorSupaUserId||'',authorFirebaseUid=article.firebase_user_id||'',authorUsername=article.authorUsername||'';
   const profileUrl=authorUsername?`profile.html?username=${encodeURIComponent(authorUsername)}`:(authorFirebaseUid?`profile.html?id=${encodeURIComponent(authorFirebaseUid)}`:'#');
   const isFollowing=authorSupaId&&userFollowing.has(String(authorSupaId));
   const showFollow=authorSupaId&&(!currentUser||String(currentUser.user_id)!==String(authorSupaId));
   const isOwnArticle=currentUser&&(String(currentUser.user_id)===String(authorSupaId)||auth.currentUser?.uid===authorFirebaseUid);

   const followBtnHTML=showFollow?`
       <button class="follow-btn ${isFollowing?'following':''}" data-supa-uid="${authorSupaId}"
           onclick="handleFollow(event,'${authorFirebaseUid}','${authorSupaId}')">
           <svg class="icon-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
           <svg class="icon-bell" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
       </button>`:'';

   const editBtnHTML=isOwnArticle?`
       <button class="edit-own-btn" title="Edit" onclick="toggleInlineEdit(${article.id},this)">
           <i class="fas fa-pen"></i>
       </button>`:'';

   return `
       <div class="author-avatar" onclick="window.location.href='${profileUrl}'">${avatarContent}</div>
       <div class="author-info">
           <div class="author-name" onclick="window.location.href='${profileUrl}'">${article.author}</div>
           <div class="article-date">${formatDate(new Date(article.created_at))}</div>
       </div>
       ${followBtnHTML}${editBtnHTML}`;
}

function buildMCQCard(article,index){
   const {question,options}=parseMCQ(article.content);
   const isLiked=userLikes.has(String(article.id));
   const letters=['A','B','C','D','E','F'];
   const card=document.createElement('div');
   card.className='mcq-card';card.dataset.index=index;card.dataset.articleId=article.id;
   card.innerHTML=`
       <div class="article-header">${buildAuthorHeader(article)}</div>
       <div class="mcq-badge">❔ Quick Question</div>
       <div class="mcq-question">${renderEmojiText(question)}</div>
       <div class="mcq-media" id="mcq-media-${article.id}"></div>
       <div class="mcq-scroll-area">
           <div class="mcq-options" id="mcq-opts-${article.id}"></div>
           <div class="mcq-result-msg" id="mcq-msg-${article.id}"></div>
       </div>
       <div class="action-buttons">
           <button class="action-btn like-btn ${isLiked?'liked':''}" data-id="${article.id}">
               <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
               <span class="like-count">${formatNumber(article.likes||0)}</span>
           </button>
           <button class="action-btn comment-btn" data-id="${article.id}">
               <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
               <span class="comment-count">0</span>
           </button>
           <button class="action-btn share-btn" data-id="${article.id}" data-title="${(article.title||'').replace(/"/g,'&quot;')}">
               <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
               <span>Share</span>
           </button>
       </div>`;
   if(article.media&&article.media.length>0){const mc=card.querySelector(`#mcq-media-${article.id}`);article.media.forEach(m=>mc.appendChild(createMediaElement(m,false)));}
   const optsContainer=card.querySelector(`#mcq-opts-${article.id}`),msgEl=card.querySelector(`#mcq-msg-${article.id}`);
   let answered=false;
   options.forEach((opt,i)=>{
       const btn=document.createElement('button');btn.className='mcq-option';
       btn.innerHTML=`<span class="opt-letter">${letters[i]||i+1}</span><span class="opt-text">${renderEmojiText(opt.label)}</span>`;
       btn.addEventListener('click',()=>{
           if(answered)return;answered=true;optsContainer.querySelectorAll('.mcq-option').forEach(b=>b.disabled=true);
           if(opt.correct){btn.classList.add('selected-correct');msgEl.textContent='✓ Correct!';msgEl.className='mcq-result-msg correct';window.launchConfetti(btn);}
           else{btn.classList.add('selected-wrong');msgEl.className='mcq-result-msg wrong';const correctIdx=options.findIndex(o=>o.correct);if(correctIdx!==-1){optsContainer.querySelectorAll('.mcq-option')[correctIdx].classList.add('reveal-correct');msgEl.textContent=`✗ The answer was: ${options[correctIdx].label}`;}else msgEl.textContent='✗ Incorrect';}
       });
       optsContainer.appendChild(btn);
   });
   setupDoubleTap(card,article.id);return card;
}

function formatNumber(num){if(num>=1000000)return (num/1000000).toFixed(1)+'M';if(num>=1000)return (num/1000).toFixed(1)+'K';return (num||0).toString();}
function formatDate(date){const now=new Date(),ms=now-date,mins=Math.floor(ms/60000),hrs=Math.floor(ms/3600000),days=Math.floor(ms/86400000);if(mins<60)return `${mins}m ago`;if(hrs<24)return `${hrs}h ago`;if(days<7)return `${days}d ago`;return date.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function getAvatarContent(article){if(article.authorPfp)return `<img src="${article.authorPfp}" alt="${article.author}">`;let letter='A';if(article.authorUsername){letter=article.authorUsername.charAt(0).toUpperCase();}else if(article.author){const atIdx=article.author.indexOf('@');letter=atIdx!==-1&&article.author.length>atIdx+1?article.author.charAt(atIdx+1).toUpperCase():article.author.charAt(0).toUpperCase();}return letter;}

async function getCurrentUser(){
   try{
       const firebaseUser=auth.currentUser;
       if(!firebaseUser){return null;}
       const {data,error}=await supabase.from('users').select('user_id, firebase_uid, username').eq('firebase_uid',firebaseUser.uid).single();
       if(error){return null;}
       return data;
   }catch(e){return null;}
}

onAuthStateChanged(auth,async(user)=>{
   if(user){
       await ensureSupabaseAuth();
       currentUser=await getCurrentUser();
       if(currentUser)await Promise.all([loadUserLikes(),loadUserFollowing(),loadUserFavLibs()]);
       // Update settings popup auth status
       const {data:ud}=await supabase.from('users').select('username,pfp').eq('firebase_uid',user.uid).single();
       updateLPAuthStatus(user, ud);
   } else {
       currentUser=null;userLikes.clear();userFollowing.clear();userFavLibs.clear();
       updateLPAuthStatus(null, null);
   }
});

async function loadUserFavLibs(){
   if(!currentUser)return;
   try{const {data}=await supabase.from('favourite_playlists').select('playlist_id').eq('user_id',currentUser.user_id);
   userFavLibs.clear();(data||[]).forEach(r=>userFavLibs.add(String(r.playlist_id)));}
   catch(e){}
}

async function loadUserLikes(){
   if(!currentUser){return;}
   try{const {data:likes}=await supabase.from('likes').select('article_id').eq('user_id',currentUser.user_id);
   userLikes.clear();(likes||[]).forEach(l=>userLikes.add(String(l.article_id)));updateLikeButtons();}
   catch(e){}
}

function updateLikeButtons(){document.querySelectorAll('.like-btn').forEach(btn=>{btn.classList.toggle('liked',userLikes.has(String(btn.dataset.id)));});}

function applyLikeColorFromCard(card,likeBtn){
   const imgEl=card.querySelector('.article-full-img-wrap img');if(!imgEl)return;
   const apply=()=>{window._getImageDominantColor(imgEl,color=>{if(color){likeBtn.querySelector('svg').style.fill=color;likeBtn.querySelector('svg').style.stroke=color;}});};
   if(imgEl.complete&&imgEl.naturalWidth>0)apply();else imgEl.addEventListener('load',apply,{once:true});
}

async function handleLike(e){
   const btn=e.currentTarget,id=String(btn.dataset.id),countSpan=btn.querySelector('.like-count');
   if(!currentUser){alert('Please log in to like articles');window.location.href='https://patholytica.com/login';return;}
   if(btn.dataset.processing==='true')return;btn.dataset.processing='true';
   const wasLiked=userLikes.has(id);
   const artIdx=articles.findIndex(a=>String(a.id)===id);
   const prevRealCount=artIdx!==-1?(articles[artIdx].likes||0):0;
   const newCount=wasLiked?Math.max(0,prevRealCount-1):prevRealCount+1;
   if(wasLiked){userLikes.delete(id);btn.classList.remove('liked');btn.querySelector('svg').style.fill='';btn.querySelector('svg').style.stroke='';}
   else{userLikes.add(id);btn.classList.add('liked');const card=btn.closest('.article-card,.mcq-card');if(card)applyLikeColorFromCard(card,btn);}
   countSpan.textContent=formatNumber(newCount);
   const card=btn.closest('.article-card,.mcq-card');
   if(card){const s=card.querySelector('.stat-item.likes span');if(s)s.textContent=formatNumber(newCount);}
   if(artIdx!==-1)articles[artIdx].likes=newCount;
   try{
       await ensureSupabaseAuth();
       if(wasLiked){
           await supabase.from('likes').delete().eq('article_id',parseInt(id)).eq('user_id',currentUser.user_id);
           const {data:fresh}=await supabase.from('articles').select('likes').eq('id',id).single();
           await supabase.from('articles').update({likes:Math.max(0,(fresh?.likes||1)-1)}).eq('id',id);
       } else {
           const {error:insErr}=await supabase.from('likes').insert([{article_id:parseInt(id),user_id:currentUser.user_id}]);
           if(!insErr||insErr.code==='23505'){
               const {data:fresh}=await supabase.from('articles').select('likes').eq('id',id).single();
               await supabase.from('articles').update({likes:(fresh?.likes||0)+1}).eq('id',id);
           }
       }
   }catch(err){
       if(wasLiked){userLikes.add(id);btn.classList.add('liked');}else{userLikes.delete(id);btn.classList.remove('liked');btn.querySelector('svg').style.fill='';btn.querySelector('svg').style.stroke='';}
       countSpan.textContent=formatNumber(prevRealCount);
       if(artIdx!==-1)articles[artIdx].likes=prevRealCount;
   }finally{btn.dataset.processing='false';}
}
