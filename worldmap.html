<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f0e0b">
<title>World Map</title>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e0b;
    --land: #241f14;
    --land-stroke: #3a3322;
    --grid: #16140e;
    --hover-bg: #1a1810;
    --border: #2a2518;
    --text: #f5f0e8;
    --muted: #8a8070;
    --accent: #c8a96e;
    --accent-hover: #b8935a;
    --accent-glow: rgba(200,169,110,0.25);
    --accent-soft: rgba(200,169,110,0.12);
    --font-ui: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-title: 'Merriweather', serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: var(--font-ui);
    overflow: hidden;
    position: fixed; inset: 0;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    padding: calc(14px + env(safe-area-inset-top)) 18px 22px;
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(to bottom, rgba(15,14,11,0.92), rgba(15,14,11,0));
    pointer-events: none;
  }
  h1 {
    font-family: var(--font-title);
    font-size: 18px; font-weight: 700;
    letter-spacing: -0.01em; color: var(--text);
  }
  h1 span { color: var(--accent); }
  button {
    pointer-events: auto;
    background: var(--hover-bg); color: var(--text-secondary, var(--muted));
    border: 1px solid var(--border);
    padding: 7px 14px; border-radius: 20px;
    font-family: var(--font-ui); font-size: 12px; font-weight: 700;
    cursor: pointer; transition: border-color .15s, color .15s;
  }
  button:hover, button:active { border-color: var(--accent); color: var(--accent); }

  #map {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block; cursor: grab;
    touch-action: none;
  }
  #map:active { cursor: grabbing; }

  .sea { fill: var(--bg); }
  .grid { fill: none; stroke: var(--grid); stroke-width: .5; }
  .country {
    fill: var(--land); stroke: var(--land-stroke); stroke-width: .6;
    vector-effect: non-scaling-stroke;
    transition: fill .15s ease;
  }
  .country:hover, .country.active {
    fill: var(--accent);
    stroke: var(--accent-hover);
  }

  #tooltip {
    position: fixed; z-index: 10; pointer-events: none; opacity: 0;
    background: var(--hover-bg); border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px; border-radius: 14px;
    font-size: 13px; font-weight: 700;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    transition: opacity .15s ease; white-space: nowrap;
  }
  #hint {
    position: fixed; left: 0; right: 0; z-index: 4;
    bottom: calc(14px + env(safe-area-inset-bottom));
    text-align: center; font-size: 11px; font-weight: 500;
    color: var(--muted); pointer-events: none;
    text-shadow: 0 1px 8px rgba(0,0,0,0.9);
  }
  #loading {
    position: fixed; inset: 0; display: flex;
    align-items: center; justify-content: center;
    font-size: 12px; color: var(--muted);
  }
</style>
</head>
<body>

<header>
  <h1>World <span>Map</span></h1>
  <button id="reset">Reset view</button>
</header>

<svg id="map"></svg>
<div id="loading">Loading map…</div>
<div id="tooltip"></div>
<div id="hint">Drag to move · Pinch or scroll to zoom · Tap a country</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script>
  const svg = d3.select("#map");
  const tooltip = document.getElementById("tooltip");
  let countries = null;
  let zoomBehavior = null;
  let initialTransform = d3.zoomIdentity;
  let lastW = 0, lastH = 0;

  function prepareCountries(world) {
    const geoms = world.objects.countries.geometries;

    // Israel (376) + Palestine (275) -> one combined territory named "Palestine"
    const isMerge = g =>
      Number(g.id) === 376 || Number(g.id) === 275 ||
      (g.properties && (g.properties.name === "Israel" || g.properties.name === "Palestine"));

    const toMerge = geoms.filter(isMerge);
    const others = geoms.filter(g => !isMerge(g));

    const list = topojson.feature(world, {
      type: "GeometryCollection",
      geometries: others
    }).features;

    if (toMerge.length) {
      list.push({
        type: "Feature",
        id: "PSE",
        properties: { name: "Palestine" },
        geometry: topojson.merge(world, toMerge)
      });
    }
    return list;
  }

  function draw() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    lastW = w; lastH = h;

    svg.selectAll("*").remove();
    svg.attr("viewBox", [0, 0, w, h]);

    const sphere = { type: "Sphere" };

    // Fit the whole map first, then scale up so it COVERS the screen
    const projection = d3.geoNaturalEarth1().fitExtent([[0, 0], [w, h]], sphere);
    let path = d3.geoPath(projection);
    let b = path.bounds(sphere);
    const k = Math.max(w / (b[1][0] - b[0][0]), h / (b[1][1] - b[0][1]));
    projection.scale(projection.scale() * k).translate([w / 2, h / 2]);
    path = d3.geoPath(projection);
    b = path.bounds(sphere);

    const g = svg.append("g");

    g.append("path").datum(sphere).attr("class", "sea").attr("d", path)
      .on("click", () => { g.selectAll(".country").classed("active", false); hide(); });
    g.append("path").datum(d3.geoGraticule10()).attr("class", "grid").attr("d", path)
      .style("pointer-events", "none");

    g.selectAll(".country")
      .data(countries)
      .join("path")
      .attr("class", "country")
      .attr("d", path)
      .on("pointerenter", (e, d) => show(e, d))
      .on("pointermove", (e) => move(e))
      .on("pointerleave", hide)
      .on("click", (e, d) => {
        g.selectAll(".country").classed("active", false);
        d3.select(e.currentTarget).classed("active", true);
        show(e, d);
      });

    zoomBehavior = d3.zoom()
      .extent([[0, 0], [w, h]])
      .scaleExtent([1, 14])
      .translateExtent(b)
      .on("zoom", (e) => g.attr("transform", e.transform));

    svg.call(zoomBehavior);

    // Start centered on the Middle East (clamped to the map edges)
    const px = projection([35, 31.5])[0];
    let tx = w / 2 - px;
    tx = Math.max(w - b[1][0], Math.min(-b[0][0], tx));
    initialTransform = d3.zoomIdentity.translate(tx, 0);
    svg.call(zoomBehavior.transform, initialTransform);
  }

  function show(e, d) {
    tooltip.textContent = d.properties.name || "Unknown";
    tooltip.style.opacity = 1;
    move(e);
  }
  function move(e) {
    const tw = tooltip.offsetWidth || 100;
    let x = e.clientX + 14;
    let y = e.clientY + 14;
    x = Math.max(8, Math.min(x, window.innerWidth - tw - 8));
    y = Math.max(8, Math.min(y, window.innerHeight - 50));
    tooltip.style.left = x + "px";
    tooltip.style.top = y + "px";
  }
  function hide() { tooltip.style.opacity = 0; }

  document.getElementById("reset").addEventListener("click", () => {
    svg.selectAll(".country").classed("active", false);
    hide();
    svg.transition().duration(600).call(zoomBehavior.transform, initialTransform);
  });

  d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then((world) => {
    countries = prepareCountries(world);
    document.getElementById("loading").remove();
    draw();
    window.addEventListener("resize", () => {
      // Ignore small height changes (phone address bar showing/hiding)
      if (Math.abs(window.innerWidth - lastW) > 1 || Math.abs(window.innerHeight - lastH) > 150) draw();
    });
  });
</script>
</body>
</html>
