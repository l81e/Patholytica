<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f0e0b">
<title>Map - Patholytica</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e0b;
    --land: #241f14;
    --land-stroke: #4a4128;
    --hover-bg: #1a1810;
    --border: #2a2518;
    --text: #f5f0e8;
    --muted: #8a8070;
    --accent: #c8a96e;
    --accent-hover: #b8935a;
    --accent-glow: rgba(200,169,110,0.25);
    --accent-soft: rgba(200,169,110,0.12);
    --font-ui: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-title: 'Merriweather', serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: var(--font-ui);
    overflow: hidden;
    position: fixed; inset: 0;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── HEADER ── */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    padding: calc(14px + env(safe-area-inset-top)) 16px 22px;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: linear-gradient(to bottom, rgba(15,14,11,0.94), rgba(15,14,11,0));
    pointer-events: none;
  }
  .logo { display: flex; align-items: center; flex-shrink: 0; }
  .logo img { height: 22px; display: block; }
  .logo-fallback { font-family: var(--font-title); font-size: 18px; font-weight: 700; color: var(--accent); }
  .header-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
  #countryBtn {
    pointer-events: auto;
    display: flex; align-items: center; gap: 8px;
    background: var(--hover-bg); color: var(--text);
    border: 1px solid var(--border);
    padding: 7px 12px; border-radius: 20px;
    font-family: var(--font-ui); font-size: 13px; font-weight: 700;
    cursor: pointer; transition: border-color .15s, color .15s;
    max-width: 210px; min-width: 0;
  }
  #countryBtn .fl { font-size: 16px; line-height: 1; }
  #countryBtn .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #countryBtn i { font-size: 10px; color: var(--muted); }
  #countryBtn:hover, #countryBtn:active { border-color: var(--accent); }
  #reset {
    pointer-events: auto; flex-shrink: 0;
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--hover-bg); color: var(--muted);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; cursor: pointer; transition: border-color .15s, color .15s;
  }
  #reset:hover, #reset:active { border-color: var(--accent); color: var(--accent); }

  /* ── MAP ── */
  #map {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block; cursor: grab;
    touch-action: none;
  }
  #map:active { cursor: grabbing; }

  .region {
    fill: var(--land); stroke: var(--land-stroke); stroke-width: .8;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
    transition: fill .15s ease;
  }
  .region:hover, .region.active { fill: var(--accent); stroke: var(--accent-hover); }
  .lbl {
    font: 600 10.5px var(--font-ui);
    fill: var(--text);
    paint-order: stroke; stroke: rgba(15,14,11,0.9); stroke-width: 3px; stroke-linejoin: round;
    text-anchor: middle; dominant-baseline: central;
    pointer-events: none;
  }

  #tooltip {
    position: fixed; z-index: 10; pointer-events: none; opacity: 0;
    background: var(--hover-bg); border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px; border-radius: 14px;
    font-size: 13px; font-weight: 700;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    transition: opacity .15s ease; white-space: nowrap;
  }
  #hint {
    position: fixed; left: 0; right: 0; z-index: 4;
    bottom: calc(76px + env(safe-area-inset-bottom));
    text-align: center; font-size: 11px; font-weight: 500;
    color: var(--muted); pointer-events: none; padding: 0 20px;
    text-shadow: 0 1px 8px rgba(0,0,0,0.9);
  }
  #hint.warn { color: var(--accent); }

  /* ── STATUS / ERROR OVERLAY ── */
  #status {
    position: fixed; inset: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding: 0 28px; text-align: center;
    font-size: 13px; color: var(--muted); pointer-events: none;
  }
  #status.hidden { display: none; }
  #statusText { white-space: pre-line; line-height: 1.5; }
  #statusLog {
    display: none; max-width: 420px; width: 100%;
    background: var(--hover-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 12px; text-align: left;
    font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace;
    color: #c46a4e; white-space: pre-wrap; word-break: break-word;
    max-height: 32vh; overflow-y: auto; pointer-events: auto;
    user-select: text; -webkit-user-select: text;
  }
  #retryBtn {
    display: none; pointer-events: auto;
    padding: 10px 22px; border-radius: 12px;
    background: var(--accent); color: #0f0e0b; border: none;
    font-family: var(--font-ui); font-size: 13px; font-weight: 800; cursor: pointer;
    box-shadow: 0 4px 16px var(--accent-glow);
  }
  .spin {
    width: 26px; height: 26px; border: 2.5px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── COUNTRY PICKER SHEET ── */
  #sheet {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.6);
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  #sheet.open { opacity: 1; pointer-events: all; }
  .sheet-panel {
    position: absolute; left: 50%; bottom: 0;
    width: 100%; max-width: 450px; height: 78%;
    background: var(--bg); border: 1px solid var(--border); border-bottom: none;
    border-radius: 22px 22px 0 0;
    transform: translate(-50%, 100%);
    transition: transform .3s cubic-bezier(0.2,0.8,0.2,1);
    display: flex; flex-direction: column;
  }
  #sheet.open .sheet-panel { transform: translate(-50%, 0); }
  .sheet-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 18px 10px;
  }
  .sheet-title { font-family: var(--font-title); font-size: 16px; font-weight: 700; }
  .sheet-close {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--hover-bg); border: 1px solid var(--border);
    color: var(--muted); cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  .sheet-close:hover { border-color: var(--accent); color: var(--accent); }
  #sheetSearch {
    margin: 0 18px 8px; padding: 11px 14px;
    background: var(--hover-bg); border: 1px solid var(--border);
    border-radius: 14px; color: var(--text);
    font-family: var(--font-ui); font-size: 16px; outline: none;
  }
  #sheetSearch:focus { border-color: var(--accent); }
  #sheetList { flex: 1; overflow-y: auto; padding: 4px 10px calc(16px + env(safe-area-inset-bottom)); }
  #sheetList::-webkit-scrollbar { width: 2px; }
  #sheetList::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .crow {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 12px 10px; background: none; border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text); font-family: var(--font-ui); font-size: 14px; font-weight: 600;
    text-align: left; cursor: pointer;
  }
  .crow:hover { background: var(--hover-bg); }
  .crow .fl { font-size: 20px; line-height: 1; }
  .crow .nm { flex: 1; }
  .crow.on { color: var(--accent); }
  .none { padding: 24px; text-align: center; color: var(--muted); font-size: 13px; }

  /* ── FOOTER (same as Patholytica) ── */
  .footer-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 450px;
    background: rgba(15,14,11,0.96);
    border-top: 1px solid #2a2518;
    padding: 8px 24px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
    display: flex; justify-content: space-around; align-items: center;
    z-index: 100;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  .footer-btn {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: none; color: #8a8070;
    cursor: pointer; transition: color 0.2s ease; padding: 6px 12px;
    font-family: var(--font-ui);
  }
  .footer-btn:hover { color: #f5f0e8; }
  .footer-btn.active { color: #c8a96e; }
  .footer-btn i { font-size: 19px; }
  .footer-btn span { font-size: 10px; font-weight: 600; }
  @media (max-width: 768px) {
    .footer-bar { padding: 8px 16px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
    .footer-btn { padding: 6px 8px; }
    .footer-btn i { font-size: 17px; }
    .footer-btn span { font-size: 9px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <img src="IMG_3220.png" alt="Patholytica"
         onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'Patholytica',className:'logo-fallback'}))">
  </div>
  <div class="header-right">
    <button id="countryBtn"><span class="fl">🌍</span><span class="nm">Country</span><i class="fas fa-chevron-down"></i></button>
    <button id="reset" title="Reset view"><i class="fas fa-crosshairs"></i></button>
  </div>
</header>

<svg id="map"></svg>
<div id="status">
  <div class="spin" id="statusSpin"></div>
  <div id="statusText">Loading…</div>
  <div id="statusLog"></div>
  <button id="retryBtn">Retry</button>
</div>
<div id="tooltip"></div>
<div id="hint">Drag to move · Pinch or scroll to zoom · Tap a region</div>

<div id="sheet">
  <div class="sheet-panel">
    <div class="sheet-head">
      <div class="sheet-title">Choose a country</div>
      <button class="sheet-close" id="sheetClose"><i class="fas fa-times"></i></button>
    </div>
    <input id="sheetSearch" type="search" placeholder="Search countries…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div id="sheetList"></div>
  </div>
</div>

<div class="footer-bar">
  <button class="footer-btn" onclick="location.href='https://patholytica.com/home'"><i class="fas fa-home"></i><span>Home</span></button>
  <button class="footer-btn" onclick="location.href='https://patholytica.com/dailyfeed'"><i class="fas fa-scroll"></i><span>Feed</span></button>
  <button class="footer-btn" onclick="location.href='explore.html'"><i class="fas fa-search"></i><span>Explore</span></button>
  <button class="footer-btn active"><i class="fas fa-map"></i><span>Map</span></button>
</div>

(function () {
  const $ = (s) => document.querySelector(s);

  // ── Status overlay (also used for errors) ──

    $("#statusSpin").style.display = opts.error ? "none" : "block";
    const logEl = $("#statusLog");
    if (opts.log && opts.log.length) {

  const COUNTRIES = COUNTRY_DATA.trim().split("\n").map((l) => {
    const [iso3, iso2, name] = l.split("|");
    return { iso3, iso2, name };
  }).sort((a, b) => a.name.localeCompare(b.name));
  const BY_ISO3 = Object.fromEntries(COUNTRIES.map((c) => [c.iso3, c]));
  const BY_ISO2 = Object.fromEntries(COUNTRIES.map((c) => [c.iso2, c]));

  // For countries with far-away territories, frame only the main area: [west, south, east, north]
  const FIT_BOX = {
    USA: [-125, 24.5, -66.5, 49.5],
    FRA: [-5.5, 41.2, 9.8, 51.2],
    ESP: [-9.5, 35.9, 4.5, 43.9],
    PRT: [-9.6, 36.9, -6.1, 42.2],
    NLD: [3.2, 50.7, 7.3, 53.6],
    DNK: [8, 54.5, 15.3, 57.8],
    NOR: [4.5, 57.9, 31.5, 71.3],
    GBR: [-8.7, 49.8, 2, 60.9],
    CHL: [-75.7, -56, -66.4, -17.5],
    NZL: [166, -47.4, 178.6, -34.3],
    ECU: [-81.2, -5.1, -75, 1.5]
  };

  const STORE_KEY = "patholytica_map_country";
  const readStore = () => { try { return localStorage.getItem(STORE_KEY); } catch (e) { return null; } };
  const writeStore = (v) => { try { localStorage.setItem(STORE_KEY, v); } catch (e) {} };

  const flag = (iso2) => String.fromCodePoint(...[...iso2].map((c) => 127397 + c.charCodeAt(0)));
  const norm = (s) => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  const errMsg = (e) => (e && e.message) ? e.message : String(e);
  const hostOf = (u) => { try { return new URL(u).hostname; } catch (e) { return u; } };

  // ── State ──
  let currentISO3 = null;
  let features = [];
  let items = [];
  let zoomBehavior = null;
  let lastT = d3.zoomIdentity;
  let lastW = 0, lastH = 0;
  let loadToken = 0;
  let labelRAF = null;
  const cache = {};

  // ── Networking ──
  async function fetchJSON(url, ms) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), ms || 15000);
    try {
      const r = await fetch(url, { signal: ctl.signal });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    } catch (e) {
      if (e && e.name === "AbortError") throw new Error("timed out");
      throw e;
    } finally { clearTimeout(t); }
  }

  async function detectIso2() {
    const tries = [
      async () => (await fetchJSON("https://api.country.is/", 5000)).country,
      async () => (await fetchJSON("https://ipwho.is/", 5000)).country_code,
      async () => (await fetchJSON("https://ipapi.co/json/", 5000)).country_code
    ];
    for (const t of tries) {
      try {
        const v = await t();
        if (v && typeof v === "string") return v.toUpperCase();
      } catch (e) {}
    }
    return null;
  }

  // ── Boundary data ──
  function rewindPoly(poly) {
    if (d3.geoArea({ type: "Polygon", coordinates: poly }) > 2 * Math.PI) {
      return poly.map((r) => r.slice().reverse());
    }
    return poly;
  }
  function fixFeature(f) {
    const g = f.geometry;
    if (!g) return f;
    if (g.type === "Polygon") g.coordinates = rewindPoly(g.coordinates);
    else if (g.type === "MultiPolygon") g.coordinates = g.coordinates.map(rewindPoly);
    return f;
  }
  function toFeatures(gj) {
    let feats = [];
    if (gj && gj.type === "FeatureCollection") feats = gj.features || [];
    else if (gj && gj.type === "Feature") feats = [gj];
    return feats.map(fixFeature).filter((f) => f.geometry);
  }

  // Provinces / governorates (geoBoundaries): API first, then a jsDelivr mirror
  async function getRegions(code, level, log) {
    const urls = [];
    try {
      const meta = await fetchJSON("https://www.geoboundaries.org/api/current/gbOpen/" + code + "/" + level + "/", 12000);
      const m = Array.isArray(meta) ? meta[0] : meta;
      if (m && m.simplifiedGeometryGeoJSON) urls.push(m.simplifiedGeometryGeoJSON);
      if (m && m.gjDownloadURL) urls.push(m.gjDownloadURL);
    } catch (e) {
      log.push("geoboundaries.org API (" + code + "): " + errMsg(e));
    }
    urls.push("https://cdn.jsdelivr.net/gh/wmgeolab/geoBoundaries@main/releaseData/gbOpen/" + code + "/" + level + "/geoBoundaries-" + code + "-" + level + "_simplified.geojson");
    for (const u of urls) {
      try {
        const f = toFeatures(await fetchJSON(u, 60000));
        if (f.length) return f;
        log.push(hostOf(u) + " (" + code + "): no features");
      } catch (e) {
        log.push(hostOf(u) + " (" + code + "): " + errMsg(e));
      }
    }
    return [];
  }

  // Whole-country outline, used only if province data can't be loaded
  async function getOutline(code, log) {
    try {
      const url = "https://cdn.jsdelivr.net/gh/johan/world.geo.json@master/countries/" + code + ".geojson";
      return toFeatures(await fetchJSON(url, 20000));
    } catch (e) {
      log.push("outline jsdelivr (" + code + "): " + errMsg(e));
      return [];
    }
  }

  async function fetchCountryFeatures(iso3) {
    const name = BY_ISO3[iso3].name;
    const log = [];
    let outlineOnly = false;
    // Palestine = the entire combined territory
    const codes = iso3 === "PSE" ? ["PSE", "ISR"] : [iso3];
    const results = await Promise.all(codes.map(async (code) => {
      let f = await getRegions(code, "ADM1", log);
      if (f.length) return f;
      f = await getOutline(code, log);
      if (f.length) {
        outlineOnly = true;
        f.forEach((x) => { x.properties = Object.assign({}, x.properties, { shapeName: name }); });
      }
      return f;
    }));
    const all = results.flat();
    if (!all.length) {
      const err = new Error("no data");
      err.log = log;
      throw err;
    }
    all.forEach((f) => {
      const p = f.properties || (f.properties = {});
      p._name = String(p.shapeName || p.shapeISO || p.name || "").trim();
    });
    return { feats: all, outlineOnly: outlineOnly };
  }

  // ── Loading a country ──
  function updateCountryButton(c) {
    $("#countryBtn .fl").textContent = flag(c.iso2);
    $("#countryBtn .nm").textContent = c.name;
  }

  async function loadCountry(iso3, opts) {
    const c = BY_ISO3[iso3];
    if (!c) return;
    const token = ++loadToken;
    currentISO3 = iso3;
    updateCountryButton(c);
    if (opts && opts.persist) writeStore(iso3);
    hideTooltip();
    hintEl.textContent = HINT_DEFAULT;
    hintEl.classList.remove("warn");
    showStatus("Loading " + c.name + "…");
    svg.selectAll("*").remove();
    features = []; items = [];
    try {
      let res = cache[iso3];
      if (!res) {
        res = await fetchCountryFeatures(iso3);
        if (!res.outlineOnly) cache[iso3] = res;
      }
      if (token !== loadToken) return;
      features = res.feats;
      hideStatus();
      if (res.outlineOnly) {
        hintEl.textContent = "Province data couldn't be loaded, so only the outline is shown. Re-select the country to retry.";
        hintEl.classList.add("warn");
      }
      draw();
    } catch (e) {
      if (token !== loadToken) return;
      showStatus("Couldn't load " + c.name + ".\nHere is exactly what failed:", {
        error: true, retry: true, log: (e && e.log && e.log.length) ? e.log : [errMsg(e)]
      });
    }
  }

  // ── Drawing ──
  function draw() {
    const w = window.innerWidth, h = window.innerHeight;
    lastW = w; lastH = h;
    svg.selectAll("*").remove();
    svg.attr("viewBox", [0, 0, w, h]);

    const fc = { type: "FeatureCollection", features: features };
    const box = FIT_BOX[currentISO3];
    const fitGeo = box
      ? { type: "MultiPoint", coordinates: [[box[0], box[1]], [box[2], box[1]], [box[2], box[3]], [box[0], box[3]]] }
      : fc;
    const lon0 = box ? (box[0] + box[2]) / 2 : d3.geoCentroid(fc)[0];

    const padT = h < 500 ? 60 : 92, padB = h < 500 ? 70 : 108, padX = 14;
    const projection = d3.geoEqualEarth().rotate([-lon0, 0])
      .fitExtent([[padX, padT], [w - padX, h - padB]], fitGeo);
    const path = d3.geoPath(projection);

    const g = svg.append("g");

    g.selectAll("path.region")
      .data(features)
      .join("path")
      .attr("class", "region")
      .attr("d", path)
      .on("pointerenter", (e, d) => showTip(e, d.properties._name))
      .on("pointermove", moveTip)
      .on("pointerleave", hideTooltip)
      .on("click", (e, d) => {
        g.selectAll(".region").classed("active", false);
        d3.select(e.currentTarget).classed("active", true);
        showTip(e, d.properties._name);
      });

    // Label anchors: centroid of each region's largest piece
    const labelG = svg.append("g");
    items = features.map((f) => {
      let best = f.geometry;
      if (best.type === "MultiPolygon") {
        let max = -1;
        best.coordinates.forEach((coords) => {
          const poly = { type: "Polygon", coordinates: coords };
          const a = d3.geoArea(poly);
          if (a > max) { max = a; best = poly; }
        });
      }
      const c = path.centroid(best);
      const bb = path.bounds(best);
      let name = f.properties._name;
      if (name.length > 26) name = name.slice(0, 25) + "…";
      return {
        name: name, x: c[0], y: c[1],
        bw: bb[1][0] - bb[0][0], bh: bb[1][1] - bb[0][1],
        area: (bb[1][0] - bb[0][0]) * (bb[1][1] - bb[0][1])
      };
    }).filter((d) => d.name && isFinite(d.x) && isFinite(d.y))
      .sort((a, b) => b.area - a.area);

    items.forEach((d) => {
      d.w = d.name.length * 6.1 + 8;
      d.el = labelG.append("text").attr("class", "lbl").text(d.name).style("display", "none");
    });

    zoomBehavior = d3.zoom()
      .extent([[0, 0], [w, h]])
      .scaleExtent([1, 60])
      .translateExtent([[-w * 0.6, -h * 0.6], [w * 1.6, h * 1.6]])
      .on("zoom", (e) => {
        g.attr("transform", e.transform);
        lastT = e.transform;
        if (!labelRAF) labelRAF = requestAnimationFrame(() => { labelRAF = null; updateLabels(lastT); });
      });

    svg.on("click.bg", (e) => {
      if (e.target === svg.node()) { g.selectAll(".region").classed("active", false); hideTooltip(); }
    });

    svg.call(zoomBehavior);
    svg.call(zoomBehavior.transform, d3.zoomIdentity);
  }

  // Show as many labels as fit without overlapping, biggest regions first
  function updateLabels(t) {
    const W = window.innerWidth, H = window.innerHeight;
    const top = 70, bottom = H - 70;
    const placed = [];
    const hgt = 14;
    for (const d of items) {
      const sx = t.applyX(d.x), sy = t.applyY(d.y);
      const x0 = sx - d.w / 2, x1 = sx + d.w / 2, y0 = sy - hgt / 2, y1 = sy + hgt / 2;
      let show = x1 > 0 && x0 < W && y1 > top && y0 < bottom;
      if (show) show = d.bw * t.k >= d.w * 0.5 || d.bh * t.k >= hgt * 2.5;
      if (show) {
        for (const p of placed) {
          if (x0 < p[2] && x1 > p[0] && y0 < p[3] && y1 > p[1]) { show = false; break; }
        }
      }
      if (show) {
        placed.push([x0, y0, x1, y1]);
        d.el.attr("transform", "translate(" + sx + "," + sy + ")").style("display", null);
      } else {
        d.el.style("display", "none");
      }
    }
  }

  // ── Tooltip ──
  function showTip(e, text) {
    tooltip.textContent = text || "Unknown";
    tooltip.style.opacity = 1;
    moveTip(e);
  }
  function moveTip(e) {
    const tw = tooltip.offsetWidth || 100;
    let x = e.clientX + 14;
    let y = e.clientY + 14;
    x = Math.max(8, Math.min(x, window.innerWidth - tw - 8));
    y = Math.max(8, Math.min(y, window.innerHeight - 50));
    tooltip.style.left = x + "px";
    tooltip.style.top = y + "px";
  }
  function hideTooltip() { tooltip.style.opacity = 0; }

  // ── Reset / Retry ──
  $("#reset").addEventListener("click", () => {
    svg.selectAll(".region").classed("active", false);
    hideTooltip();
    if (zoomBehavior) svg.transition().duration(600).call(zoomBehavior.transform, d3.zoomIdentity);
  });
  $("#retryBtn").addEventListener("click", () => {
    if (currentISO3) loadCountry(currentISO3);
    else init();
  });

  // ── Country picker ──
  const sheet = $("#sheet"), listEl = $("#sheetList"), searchEl = $("#sheetSearch");
  function renderList(q) {
    const query = norm(q || "").trim();
    const rows = COUNTRIES.filter((c) => norm(c.name).includes(query));
    listEl.innerHTML = rows.length
      ? rows.map((c) =>
          '<button class="crow' + (c.iso3 === currentISO3 ? " on" : "") + '" data-iso="' + c.iso3 + '">' +
          '<span class="fl">' + flag(c.iso2) + '</span><span class="nm">' + c.name + '</span>' +
          (c.iso3 === currentISO3 ? '<i class="fas fa-check"></i>' : "") + "</button>"
        ).join("")
      : '<div class="none">No match</div>';
  }
  function openSheet() {
    searchEl.value = "";
    renderList("");
    sheet.classList.add("open");
  }
  function closeSheet() { sheet.classList.remove("open"); searchEl.blur(); }

  $("#countryBtn").addEventListener("click", openSheet);
  $("#sheetClose").addEventListener("click", closeSheet);
  sheet.addEventListener("click", (e) => { if (e.target === sheet) closeSheet(); });
  searchEl.addEventListener("input", () => renderList(searchEl.value));
  listEl.addEventListener("click", (e) => {
    const row = e.target.closest(".crow");
    if (!row) return;
    closeSheet();
    loadCountry(row.dataset.iso, { persist: true });
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

  // ── Resize ──
  window.addEventListener("resize", () => {
    if (!features.length) return;
    // Ignore small height changes (phone address bar showing/hiding)
    if (Math.abs(window.innerWidth - lastW) > 1 || Math.abs(window.innerHeight - lastH) > 150) draw();
  });

  // ── Start ──
  async function init() {
    const saved = readStore();
    if (saved && BY_ISO3[saved]) { loadCountry(saved); return; }

    showStatus("Finding your country…");
    let iso2 = await detectIso2();
    if (iso2 === "IL") iso2 = "PS"; // Israel is not listed; maps to Palestine
    const c = iso2 && BY_ISO2[iso2];
    if (c) {
      loadCountry(c.iso3, { persist: true });
    } else {
      showStatus("Couldn't detect your country. Pick one to start.", { error: true });
      openSheet();
    }
  }
  init();
})();
</script>
</body>
</html>
