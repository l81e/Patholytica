<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Map – Dark</title>
<style>
  :root {
    --bg: #0b0f17;
    --sea: #0e1522;
    --land: #1c2536;
    --land-hover: #3b82f6;
    --stroke: #0b0f17;
    --grid: #151d2c;
    --text: #e6edf7;
    --muted: #7d8aa3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 5;
    padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(to bottom, rgba(11,15,23,.95), rgba(11,15,23,0));
    pointer-events: none;
  }
  h1 { font-size: 16px; font-weight: 600; letter-spacing: .04em; }
  h1 span { color: var(--muted); font-weight: 400; }
  button {
    pointer-events: auto; background: #151d2c; color: var(--text);
    border: 1px solid #243049; padding: 8px 14px; border-radius: 8px;
    font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--land-hover); }
  #map { width: 100%; height: 100%; display: block; cursor: grab; }
  #map:active { cursor: grabbing; }
  .sea { fill: var(--sea); }
  .grid { fill: none; stroke: var(--grid); stroke-width: .5; }
  .country {
    fill: var(--land); stroke: var(--stroke); stroke-width: .6;
    vector-effect: non-scaling-stroke; transition: fill .15s;
  }
  .country:hover, .country.active { fill: var(--land-hover); }
  #tooltip {
    position: fixed; z-index: 10; pointer-events: none; opacity: 0;
    background: #121a28; border: 1px solid #243049; color: var(--text);
    padding: 6px 10px; border-radius: 6px; font-size: 13px;
    transition: opacity .12s; white-space: nowrap;
  }
  #hint {
    position: fixed; bottom: 14px; left: 0; right: 0; text-align: center;
    font-size: 12px; color: var(--muted); pointer-events: none;
  }
</style>
</head>
<body>

<header>
  <h1>WORLD MAP <span>/ dark</span></h1>
  <button id="reset">Reset view</button>
</header>

<svg id="map"></svg>
<div id="tooltip"></div>
<div id="hint">Drag to move · Scroll or pinch to zoom · Hover or tap a country</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script>
  const svg = d3.select("#map");
  const tooltip = document.getElementById("tooltip");
  let world = null;
  let zoomBehavior = null;

  function draw() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    svg.selectAll("*").remove();
    svg.attr("viewBox", [0, 0, w, h]);

    const projection = d3.geoNaturalEarth1()
      .fitExtent([[20, 60], [w - 20, h - 40]], { type: "Sphere" });
    const path = d3.geoPath(projection);

    const g = svg.append("g");

    g.append("path").datum({ type: "Sphere" }).attr("class", "sea").attr("d", path);
    g.append("path").datum(d3.geoGraticule10()).attr("class", "grid").attr("d", path);

    const countries = topojson.feature(world, world.objects.countries).features;

    g.selectAll(".country")
      .data(countries)
      .join("path")
      .attr("class", "country")
      .attr("d", path)
      .on("pointerenter", (e, d) => show(e, d))
      .on("pointermove", (e) => move(e))
      .on("pointerleave", hide)
      .on("click", (e, d) => {
        g.selectAll(".country").classed("active", false);
        d3.select(e.currentTarget).classed("active", true);
        show(e, d);
      });

    zoomBehavior = d3.zoom()
      .scaleExtent([1, 10])
      .translateExtent([[0, 0], [w, h]])
      .on("zoom", (e) => g.attr("transform", e.transform));

    svg.call(zoomBehavior);
  }

  function show(e, d) {
    tooltip.textContent = d.properties.name || "Unknown";
    tooltip.style.opacity = 1;
    move(e);
  }
  function move(e) {
    tooltip.style.left = (e.clientX + 14) + "px";
    tooltip.style.top = (e.clientY + 14) + "px";
  }
  function hide() { tooltip.style.opacity = 0; }

  document.getElementById("reset").addEventListener("click", () => {
    svg.transition().duration(500).call(zoomBehavior.transform, d3.zoomIdentity);
  });

  d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then((data) => {
    world = data;
    draw();
    window.addEventListener("resize", draw);
  });
</script>
</body>
</html>
