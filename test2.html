<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Patholytica</title>
  <meta property="og:site_name" content="Patholytica">
  <meta property="og:type" content="article">
  <meta property="og:title" id="ogTitle" content="Patholytica – Learn smarter">
  <meta property="og:description" id="ogDescription" content="Bite-sized academic content in a social feed.">
  <meta property="og:image" id="ogImage" content="">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" id="twTitle" content="Patholytica – Learn smarter">
  <meta name="twitter:description" id="twDescription" content="Bite-sized academic content in a social feed.">
  <meta name="twitter:image" id="twImage" content="">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=DM+Sans:wght@400;500;600&family=Source+Serif+4:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ══ THEMES ══ */
    :root {
      --bg-color:#0f0e0b;--text-primary:#f5f0e8;--text-secondary:#8a8070;
      --card-bg:#0f0e0b;--hover-bg:#1a1810;--border-color:#2a2518;
      --accent:#c8a96e;--accent-hover:#b8935a;
      --accent-glow:rgba(200,169,110,0.25);--accent-soft:rgba(200,169,110,0.12);
      --font-article:'Merriweather',serif;--font-ui:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
      --font-size-base:14px;--font-size-title:20px;--font-size-mcq:19px;
    }
    body.theme-dark{
      --bg-color:#0f0e0b;--text-primary:#f5f0e8;--text-secondary:#8a8070;
      --card-bg:#0f0e0b;--hover-bg:#1a1810;--border-color:#2a2518;
      --accent:#c8a96e;--accent-hover:#b8935a;
      --accent-glow:rgba(200,169,110,0.25);--accent-soft:rgba(200,169,110,0.12);
    }
    body.theme-sepia{
      --bg-color:#1a1510;--text-primary:#e8dcc8;--text-secondary:#8a7860;
      --card-bg:#1a1510;--hover-bg:#231c14;--border-color:#352b20;
      --accent:#d4956a;--accent-hover:#b87850;
      --accent-glow:rgba(212,149,106,0.25);--accent-soft:rgba(212,149,106,0.12);
    }
    body.theme-light{
      --bg-color:#faf6ee;--text-primary:#1a1710;--text-secondary:#706050;
      --card-bg:#faf6ee;--hover-bg:#f0ebe0;--border-color:#e0d8c8;
      --accent:#a07840;--accent-hover:#8a6430;
      --accent-glow:rgba(160,120,64,0.2);--accent-soft:rgba(160,120,64,0.08);
    }
    body.font-serif{--font-article:'Merriweather',serif;--font-ui:'DM Sans',sans-serif;}
    body.font-modern{--font-article:'Inter',sans-serif;--font-ui:'Inter',sans-serif;}
    body.font-slab{--font-article:'Source Serif 4',serif;--font-ui:'DM Sans',sans-serif;}
    body.fontsize-sm{--font-size-base:12px;--font-size-title:17px;--font-size-mcq:16px;}
    body.fontsize-md{--font-size-base:14px;--font-size-title:20px;--font-size-mcq:19px;}
    body.fontsize-lg{--font-size-base:16px;--font-size-title:23px;--font-size-mcq:21px;}
    body.fontsize-xl{--font-size-base:18px;--font-size-title:26px;--font-size-mcq:24px;}
    body.no-emoji-effects .emo-fire,.emo-diamond,.emo-lightning,.emo-sparkle,.emo-rainbow,
    body.no-emoji-effects .emo-magic,.emo-purple,.emo-idea,.emo-urgent,.emo-target,
    body.no-emoji-effects .emo-wave,.emo-float,.emo-rocket,.emo-star,.emo-crown,
    body.no-emoji-effects .emo-heart,.emo-happy,.emo-calm,.emo-signal,.emo-music{
      animation:none!important;background:none!important;
      -webkit-background-clip:unset!important;-webkit-text-fill-color:unset!important;
      background-clip:unset!important;filter:none!important;
      text-shadow:none!important;color:var(--text-primary)!important;
    }

    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    body{
      font-family:var(--font-ui);background:var(--bg-color);color:var(--text-primary);
      overflow:hidden;transition:background 0.2s,color 0.2s;position:fixed;width:100%;height:100%;
    }
    .app-container{
      position:fixed;top:0;left:50%;transform:translateX(-50%);
      width:100%;max-width:450px;height:100vh;background:var(--bg-color);
    }
    .scroller-container{position:relative;width:100%;height:100vh;background:var(--bg-color);overflow:hidden;}
    .posts-wrapper{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;}
    .posts-wrapper::-webkit-scrollbar{display:none;}

    /* ══ ARTICLE CARD ══ */
    .article-card{
      position:relative;height:100vh;scroll-snap-align:start;scroll-snap-stop:always;
      background:var(--bg-color);padding:0;
      padding-top:calc(20px + env(safe-area-inset-top));
      display:flex;flex-direction:column;
    }
    .article-header{
      display:flex;align-items:center;gap:12px;flex-shrink:0;
      position:relative;z-index:50;margin-bottom:14px;padding:0 18px;
    }
    .author-avatar{
      width:42px;height:42px;border-radius:50%;
      background:linear-gradient(135deg,var(--accent),#8a6430);
      display:flex;align-items:center;justify-content:center;
      font-size:17px;font-weight:700;color:#0f0e0b;
      overflow:hidden;flex-shrink:0;cursor:pointer;
      transition:opacity 0.15s,box-shadow 0.2s;
    }
    .author-avatar:hover{opacity:0.9;box-shadow:0 0 0 2px var(--accent);}
    .author-avatar img{width:100%;height:100%;object-fit:cover;}
    .author-info{flex:1;}
    .author-name{
      color:var(--text-primary);font-weight:700;font-size:14px;margin-bottom:1px;
      cursor:pointer;display:inline-block;transition:color 0.15s;letter-spacing:-0.01em;
    }
    .author-name:hover{color:var(--accent);}
    .article-date{color:var(--text-secondary);font-size:11px;font-weight:500;}
    .follow-btn{
      position:relative;width:32px;height:32px;border-radius:50%;
      border:1.5px solid var(--border-color);background:var(--hover-bg);
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      flex-shrink:0;transition:border-color 0.25s,background 0.25s,box-shadow 0.25s;
      overflow:hidden;
    }
    .follow-btn:active{transform:scale(0.9);}
    .follow-btn .icon-plus,.follow-btn .icon-bell{
      position:absolute;width:15px;height:15px;
      transition:opacity 0.25s,transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
    }
    .follow-btn .icon-plus{stroke:var(--text-secondary);fill:none;stroke-width:2;opacity:1;transform:scale(1) rotate(0deg);}
    .follow-btn .icon-bell{stroke:var(--accent);fill:none;stroke-width:1.8;opacity:0;transform:scale(0.4) rotate(-20deg);}
    .follow-btn.following{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 10px var(--accent-glow);}
    .follow-btn.following .icon-plus{opacity:0;transform:scale(0.4) rotate(90deg);}
    .follow-btn.following .icon-bell{opacity:1;transform:scale(1) rotate(0deg);}
    @keyframes bellRing{
      0%{transform:scale(1) rotate(0deg)}20%{transform:scale(1.1) rotate(-12deg)}
      40%{transform:scale(1.1) rotate(10deg)}60%{transform:scale(1.05) rotate(-6deg)}
      80%{transform:scale(1) rotate(3deg)}100%{transform:scale(1) rotate(0deg)}
    }
    .follow-btn.ringing .icon-bell{animation:bellRing 0.5s ease forwards;}
    .article-title{
      font-size:var(--font-size-title);font-weight:800;color:var(--text-primary);
      margin-bottom:10px;line-height:1.2;flex-shrink:0;
      letter-spacing:-0.02em;padding:0 18px;font-family:var(--font-article);
    }
    .article-stats{
      display:flex;align-items:center;gap:14px;
      margin-bottom:10px;flex-shrink:0;padding:0 18px;
    }
    .stat-item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-secondary);font-weight:500;}
    .stat-item.views i{color:var(--accent);}
    .stat-item.likes i{color:#d4845a;}
    .article-content{
      color:var(--text-primary);font-size:var(--font-size-base);line-height:1.65;
      flex:1;overflow-y:auto;padding:0 18px;padding-right:62px;padding-bottom:110px;
      letter-spacing:0.01em;text-align:justify;font-family:var(--font-article);
    }
    .article-content::-webkit-scrollbar{width:2px;}
    .article-content::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:2px;}
    .content-paragraph{margin-bottom:12px;}
    .article-full-img-wrap{
      width:calc(100% + 80px);margin-left:-18px;margin-right:-62px;
      margin-bottom:12px;margin-top:4px;overflow:hidden;
    }
    .article-full-img-wrap img{width:100%;height:auto;display:block;max-height:340px;object-fit:cover;}
    .article-full-img-wrap .media-caption{font-size:12px;color:var(--text-secondary);font-style:italic;padding:7px 18px 0 18px;}
    .article-full-yt-wrap{
      width:calc(100% + 80px);margin-left:-18px;margin-right:-62px;
      margin-bottom:12px;margin-top:4px;overflow:hidden;background:#000;
    }
    .article-full-yt-wrap iframe{width:100%;aspect-ratio:16/9;border:none;display:block;}

    /* ══ MCQ CARD ══ */
    .mcq-card{
      position:relative;height:100vh;scroll-snap-align:start;scroll-snap-stop:always;
      background:var(--bg-color);padding:8px 18px 100px;
      padding-top:calc(20px + env(safe-area-inset-top));
      display:flex;flex-direction:column;overflow:hidden;
    }
    .mcq-question{
      font-size:var(--font-size-mcq);font-weight:800;color:var(--text-primary);
      line-height:1.3;margin-bottom:14px;flex-shrink:0;
      padding-right:50px;letter-spacing:-0.02em;font-family:var(--font-article);
    }
    .mcq-media{padding-right:60px;flex-shrink:0;margin-bottom:14px;}
    .mcq-scroll-area{flex:1;overflow-y:auto;padding-right:60px;display:flex;flex-direction:column;}
    .mcq-scroll-area::-webkit-scrollbar{width:2px;}
    .mcq-scroll-area::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:2px;}
    .mcq-options{display:flex;flex-direction:column;gap:9px;}
    .mcq-option{
      display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;
      border:1px solid var(--border-color);background:var(--hover-bg);cursor:pointer;
      transition:border-color 0.15s,background 0.15s,box-shadow 0.15s;
      text-align:left;font-size:var(--font-size-base);font-weight:500;
      color:var(--text-primary);line-height:1.4;width:100%;
    }
    .mcq-option:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 10px var(--accent-glow);}
    .mcq-option .opt-letter{
      width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border-color);
      display:flex;align-items:center;justify-content:center;
      font-size:10px;font-weight:800;flex-shrink:0;color:var(--text-secondary);transition:all 0.15s;
    }
    .mcq-option .opt-text{flex:1;}
    .mcq-option:disabled{cursor:default;}
    .mcq-option.selected-correct{border-color:#6abf85;background:rgba(106,191,133,0.08);}
    .mcq-option.selected-correct .opt-letter{background:#6abf85;border-color:#6abf85;color:#0f0e0b;}
    .mcq-option.selected-wrong{border-color:#c46a4e;background:rgba(196,106,78,0.07);}
    .mcq-option.selected-wrong .opt-letter{background:#c46a4e;border-color:#c46a4e;color:#fff;}
    .mcq-option.reveal-correct{border-color:rgba(106,191,133,0.5);}
    .mcq-option.reveal-correct .opt-letter{border-color:#6abf85;color:#6abf85;}
    .mcq-result-msg{font-size:13px;font-weight:700;margin-top:14px;min-height:18px;color:var(--text-secondary);flex-shrink:0;}
    .mcq-result-msg.correct{color:#6abf85;}
    .mcq-result-msg.wrong{color:#c46a4e;}

    /* ══ ACTION BUTTONS ══ */
    .action-buttons{
      position:absolute;right:14px;bottom:143px;
      display:flex;flex-direction:column;gap:20px;z-index:10;
      filter:drop-shadow(0 4px 16px rgba(0,0,0,0.7));
    }
    .action-btn{
      display:flex;flex-direction:column;align-items:center;gap:3px;
      background:none;border:none;cursor:pointer;transition:transform 0.1s;
    }
    .action-btn:active{transform:scale(0.88);}
    .action-btn svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2;}
    .action-btn span{color:#fff;font-size:10px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,0.9);}
    .action-btn.like-btn svg{stroke:#fff;fill:none;transition:fill 0.2s,stroke 0.2s;}
    .action-btn.like-btn.liked svg{fill:#d4845a;stroke:#d4845a;}
    .action-btn.edit-btn svg{stroke:var(--accent);}

    /* ══ MEDIA EMBEDS ══ */
    .media-embed{margin:10px 0;max-width:100%;}
    .media-embed img{width:100%;max-width:100%;height:auto;border-radius:10px;display:block;}
    .media-caption{font-size:12px;color:var(--text-secondary);margin-top:5px;font-style:italic;}
    .custom-audio-player{
      background:var(--hover-bg);border-radius:12px;padding:14px;
      display:flex;align-items:center;gap:12px;border:1px solid var(--border-color);
    }
    .play-btn{
      width:40px;height:40px;border-radius:50%;background:var(--accent);
      border:none;color:#0f0e0b;cursor:pointer;
      display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;
    }
    .audio-info{flex:1;min-width:0;overflow:hidden;}
    .audio-title{font-size:12px;font-weight:600;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-primary);}
    .waveform-container{position:relative;height:28px;background:var(--bg-color);border-radius:6px;margin-bottom:5px;cursor:pointer;overflow:hidden;}
    .waveform-progress{position:absolute;top:0;left:0;height:100%;background:var(--accent);opacity:0.35;transition:width 0.1s linear;}
    .waveform-bars{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:space-around;padding:0 4px;}
    .waveform-bar{width:2px;background:var(--text-secondary);border-radius:2px;opacity:0.5;}
    .audio-time{display:flex;justify-content:space-between;font-size:10px;color:var(--text-secondary);}

    /* ══ HEART BURST ══ */
    .heart-burst{
      position:fixed;pointer-events:none;z-index:9999;
      transform:translate(-50%,-50%);
      animation:heartBurstAnim 0.65s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    .heart-burst svg{width:70px;height:70px;filter:drop-shadow(0 0 10px rgba(200,169,110,0.5));}
    @keyframes heartBurstAnim{
      0%{opacity:0;transform:translate(-50%,-50%) scale(0.3);}
      30%{opacity:1;transform:translate(-50%,-50%) scale(1.2);}
      55%{transform:translate(-50%,-50%) scale(0.95);}
      80%{opacity:0.85;transform:translate(-50%,-50%) scale(1.05);}
      100%{opacity:0;transform:translate(-50%,-56%) scale(0.85);}
    }

    /* ══ SHARE TOAST ══ */
    .share-toast{
      position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(10px);
      background:#1a1810;border:1px solid var(--border-color);border-radius:14px;
      padding:10px 18px;font-size:13px;font-weight:700;color:var(--text-primary);
      z-index:9999;opacity:0;transition:opacity 0.2s,transform 0.2s;
      pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,0.5);
    }
    .share-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    /* ══ COMMENTS ══ */
    .comments-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:199;opacity:0;pointer-events:none;transition:opacity 0.3s;backdrop-filter:blur(4px);}
    .comments-overlay.active{opacity:1;pointer-events:all;}
    .comments-popup{
      position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.9);
      width:calc(100% - 40px);max-width:500px;height:70vh;max-height:600px;
      background:#141210;border-radius:20px;z-index:200;opacity:0;pointer-events:none;
      transition:all 0.3s cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column;
      box-shadow:0 24px 80px rgba(0,0,0,0.7),0 0 0 1px var(--border-color);
    }
    .comments-popup.active{opacity:1;pointer-events:all;transform:translate(-50%,-50%) scale(1);}
    .comments-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border-color);}
    .comments-header h3{font-size:15px;font-weight:700;}
    .close-comments{background:none;border:none;color:var(--text-primary);font-size:22px;cursor:pointer;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;}
    .close-comments:hover{background:var(--hover-bg);}
    .comments-list{flex:1;overflow-y:auto;padding:14px 18px;}
    .comments-list::-webkit-scrollbar{width:3px;}
    .comments-list::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:2px;}
    .comment-item{display:flex;gap:10px;margin-bottom:14px;}
    .comment-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#8a6430);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#0f0e0b;flex-shrink:0;overflow:hidden;}
    .comment-avatar img{width:100%;height:100%;object-fit:cover;}
    .comment-content{flex:1;}
    .comment-author{font-weight:700;font-size:12px;margin-bottom:3px;}
    .comment-text{font-size:13px;line-height:1.5;margin-bottom:5px;}
    .comment-meta{display:flex;align-items:center;gap:10px;}
    .comment-time{font-size:10px;color:var(--text-secondary);}
    .comment-reply-btn{font-size:10px;font-weight:700;color:var(--text-secondary);background:none;border:none;cursor:pointer;padding:0;transition:color 0.15s;}
    .comment-reply-btn:hover{color:var(--accent);}
    .comment-replies{margin-top:8px;padding-left:14px;border-left:2px solid var(--border-color);display:flex;flex-direction:column;gap:10px;}
    .reply-item{display:flex;gap:8px;}
    .reply-avatar{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#8a6430);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#0f0e0b;flex-shrink:0;overflow:hidden;}
    .reply-avatar img{width:100%;height:100%;object-fit:cover;}
    .reply-content{flex:1;}
    .reply-author{font-weight:700;font-size:11px;margin-bottom:2px;}
    .reply-text{font-size:12px;line-height:1.5;margin-bottom:3px;}
    .reply-time{font-size:10px;color:var(--text-secondary);}
    .comment-input-wrapper{padding:10px 18px;border-top:1px solid var(--border-color);background:#141210;border-radius:0 0 20px 20px;}
    .replying-to-bar{font-size:11px;color:var(--accent);font-weight:600;padding:6px 0 4px;display:none;align-items:center;gap:6px;}
    .replying-to-bar.visible{display:flex;}
    .replying-to-bar button{background:none;border:none;color:var(--text-secondary);font-size:13px;cursor:pointer;padding:0 2px;}
    .comment-input-container{display:flex;gap:8px;align-items:center;}
    .comment-input{
      flex:1;background:var(--hover-bg);border:1px solid var(--border-color);
      border-radius:20px;padding:9px 14px;color:var(--text-primary);
      font-size:16px;outline:none;transition:border-color 0.15s;font-family:var(--font-ui);
    }
    .comment-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
    .send-comment-btn{width:34px;height:34px;border-radius:50%;background:var(--accent);border:none;color:#0f0e0b;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
    .send-comment-btn:disabled{opacity:0.4;cursor:not-allowed;}
    .no-comments{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-secondary);gap:10px;}
    .no-comments i{font-size:40px;opacity:0.3;color:var(--accent);}

    /* ══ SKELETONS ══ */
    @keyframes shimmer{0%,100%{opacity:0.4}50%{opacity:0.85}}
    .skeleton-base{background:var(--hover-bg);animation:shimmer 1.6s infinite;border-radius:6px;}
    .skeleton-card{position:relative;height:100vh;scroll-snap-align:start;scroll-snap-stop:always;background:var(--bg-color);padding:8px 18px 100px;padding-top:calc(20px + env(safe-area-inset-top));display:flex;flex-direction:column;}
    .skeleton-header{display:flex;align-items:center;gap:12px;flex-shrink:0;margin-bottom:16px;}
    .skeleton-avatar{width:42px;height:42px;border-radius:50%;flex-shrink:0;}
    .skeleton-author-block{flex:1;display:flex;flex-direction:column;gap:6px;}
    .skeleton-name{height:13px;width:110px;}
    .skeleton-date{height:9px;width:65px;}
    .skeleton-title{height:22px;width:88%;margin-bottom:8px;border-radius:6px;}
    .skeleton-title-short{height:22px;width:62%;margin-bottom:12px;border-radius:6px;}
    .skeleton-stats{display:flex;gap:12px;margin-bottom:14px;flex-shrink:0;}
    .skeleton-stat{height:12px;width:48px;}
    .skeleton-line{height:12px;margin-bottom:9px;width:100%;}
    .skeleton-line.w90{width:90%}.skeleton-line.w75{width:75%}.skeleton-line.w80{width:80%}.skeleton-line.w65{width:65%}.skeleton-line.w95{width:95%}

    /* ══ LOADING ══ */
    .loading-container{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-primary);gap:14px;}
    .spinner{width:40px;height:40px;border:3px solid var(--border-color);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* ══ FOOTER ══ */
    .footer-bar{
      position:fixed;bottom:0;left:50%;transform:translateX(-50%);
      width:100%;max-width:450px;
      background:rgba(15,14,11,0.96);border-top:1px solid var(--border-color);
      padding:8px 24px;padding-bottom:calc(8px + env(safe-area-inset-bottom));
      display:flex;justify-content:space-around;align-items:center;z-index:100;
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    }
    .footer-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--text-secondary);cursor:pointer;transition:color 0.2s;padding:6px 12px;}
    .footer-btn:hover,.footer-btn.active{color:var(--accent);}
    .footer-btn i{font-size:19px;}
    .footer-btn span{font-size:10px;font-weight:600;}

    /* ══ LIBRARY PICKER CARD ══ */
    .library-picker-card{
      position:relative;height:100vh;scroll-snap-align:start;scroll-snap-stop:always;
      background:var(--bg-color);display:flex;flex-direction:column;overflow:hidden;
    }
    .lp-hero{
      flex-shrink:0;padding:calc(16px + env(safe-area-inset-top)) 18px 14px;
      background:var(--bg-color);border-bottom:1px solid var(--border-color);
    }
    .lp-hero-main-title{font-size:20px;font-weight:900;color:var(--text-primary);line-height:1.15;letter-spacing:-0.03em;font-family:var(--font-article);margin-bottom:3px;}
    .lp-hero-main-title span{color:var(--accent);}
    .lp-hero-sub{font-size:12px;color:var(--text-secondary);}
    .lp-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px 18px 0;display:flex;flex-direction:column;}
    .lp-body::-webkit-scrollbar{width:2px;}
    .lp-body::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:2px;}
    .lp-hint{font-size:11px;color:var(--accent);font-weight:700;margin-bottom:8px;}
    .lp-shelf-wrap{overflow:visible;margin-bottom:10px;padding-top:10px;}
    .lp-shelf{
      display:flex;gap:10px;width:calc(100% + 36px);margin-left:-18px;padding-left:18px;padding-right:18px;
      overflow-x:auto;overflow-y:visible;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:8px;
    }
    .lp-shelf::-webkit-scrollbar{height:2px;}
    .lp-shelf::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:2px;}
    .lp-movie-card{flex-shrink:0;width:130px;scroll-snap-align:start;cursor:pointer;position:relative;border-radius:10px;overflow:visible;transition:transform 0.22s cubic-bezier(0.34,1.56,0.64,1);}
    .lp-movie-card:hover,.lp-movie-card.selected{transform:translateY(-4px) scale(1.02);z-index:20;}
    .lp-movie-card.selected .lp-movie-poster{box-shadow:0 0 0 2.5px var(--accent),0 12px 32px var(--accent-glow);border-color:var(--accent);}
    .lp-movie-poster{width:130px;height:190px;border-radius:10px;overflow:hidden;position:relative;background:linear-gradient(135deg,#1e1a10,#0e0c08);border:1px solid var(--border-color);box-shadow:0 6px 20px rgba(0,0,0,0.5);transition:box-shadow 0.22s,border-color 0.22s;}
    .lp-movie-poster img{width:100%;height:100%;object-fit:cover;}
    .lp-poster-placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:linear-gradient(160deg,#1e1a10,#0e0c08);}
    .lp-poster-letter{font-size:26px;font-weight:800;color:rgba(200,169,110,0.2);font-family:var(--font-article);}
    .lp-poster-icon{font-size:18px;color:rgba(200,169,110,0.15);}
    .lp-movie-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,8,5,0.96) 0%,rgba(10,8,5,0.3) 50%,transparent 75%);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;}
    .lp-movie-count{display:inline-flex;align-items:center;gap:3px;background:rgba(200,169,110,0.18);border:1px solid rgba(200,169,110,0.25);backdrop-filter:blur(6px);border-radius:5px;padding:2px 6px;font-size:9px;font-weight:700;color:var(--accent);align-self:flex-start;margin-bottom:4px;}
    .lp-selected-badge{position:absolute;top:7px;right:7px;background:var(--accent);border-radius:50%;width:20px;height:20px;display:none;align-items:center;justify-content:center;font-size:10px;color:#0f0e0b;font-weight:800;}
    .lp-movie-card.selected .lp-selected-badge{display:flex;}
    .lp-movie-info{padding:6px 2px 0;}
    .lp-movie-title{font-size:12px;font-weight:700;line-height:1.3;color:var(--text-primary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:3px;transition:color 0.2s;}
    .lp-movie-card:hover .lp-movie-title,.lp-movie-card.selected .lp-movie-title{color:var(--accent);}
    .lp-movie-meta{font-size:10px;color:var(--text-secondary);}
    .lp-section-label{font-size:10px;font-weight:900;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:6px;padding:4px 0;margin-bottom:6px;}
    .lp-section-divider{font-size:10px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-secondary);opacity:0.4;padding:4px 0;margin-top:6px;margin-bottom:6px;}
    .lp-loading{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text-secondary);font-size:12px;padding:20px 0;}
    .lp-actions-fixed{
      flex-shrink:0;background:var(--bg-color);padding:12px 18px;
      padding-bottom:calc(20px + env(safe-area-inset-bottom) + 72px);
      border-top:1px solid var(--border-color);display:flex;flex-direction:column;gap:8px;
    }
    .lp-start-btn{
      width:100%;padding:14px;border-radius:12px;background:var(--accent);color:#0f0e0b;
      font-size:14px;font-weight:800;border:none;cursor:pointer;
      transition:background 0.15s,opacity 0.15s,transform 0.1s;font-family:var(--font-ui);
      box-shadow:0 4px 20px var(--accent-glow);
    }
    .lp-start-btn:hover:not(:disabled){background:var(--accent-hover);}
    .lp-start-btn:active:not(:disabled){transform:scale(0.98);}
    .lp-start-btn:disabled{opacity:0.3;cursor:not-allowed;}
    .lp-scroll-hint{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:var(--text-secondary);}
    .lp-scroll-hint i{font-size:10px;opacity:0.5;}
    @keyframes lp-btn-launch{0%{transform:scale(1)}30%{transform:scale(1.03)}60%{transform:scale(0.97)}100%{transform:scale(1)}}
    .lp-start-btn.launching{animation:lp-btn-launch 0.45s ease forwards;background:var(--accent-hover);}
    @keyframes lp-card-exit{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-24px) scale(0.97)}}
    .library-picker-card.exiting{animation:lp-card-exit 0.35s cubic-bezier(0.4,0,0.2,1) forwards;pointer-events:none;}

    /* Preferences */
    .lp-prefs-toggle{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--text-secondary);background:none;border:none;cursor:pointer;padding:6px 0;margin-bottom:4px;}
    .lp-prefs-toggle i.chev{transition:transform 0.2s;}
    .lp-prefs-toggle.open i.chev{transform:rotate(180deg);}
    .lp-prefs-panel{display:none;flex-direction:column;gap:12px;padding:10px 0 4px;border-top:1px solid var(--border-color);margin-bottom:8px;}
    .lp-prefs-panel.open{display:flex;}
    .lp-pref-group{display:flex;flex-direction:column;gap:6px;}
    .lp-pref-label{font-size:10px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-secondary);}
    .lp-chip-row{display:flex;flex-wrap:wrap;gap:6px;}
    .lp-chip{padding:5px 12px;border-radius:20px;border:1px solid var(--border-color);background:var(--hover-bg);font-size:11px;font-weight:700;color:var(--text-secondary);cursor:pointer;transition:all 0.15s;}
    .lp-chip:hover{border-color:var(--accent);color:var(--accent);}
    .lp-chip.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);}
    .lp-toggle-row{display:flex;align-items:center;justify-content:space-between;}
    .lp-toggle-row span{font-size:12px;color:var(--text-primary);font-weight:500;}
    .lp-toggle{position:relative;width:36px;height:20px;background:var(--border-color);border-radius:20px;cursor:pointer;transition:background 0.2s;flex-shrink:0;}
    .lp-toggle.on{background:var(--accent);}
    .lp-toggle::after{content:'';position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform 0.2s;}
    .lp-toggle.on::after{transform:translateX(16px);}

    /* ══ CREATE CARD ══ */
    .create-card{
      position:relative;height:100vh;scroll-snap-align:start;scroll-snap-stop:always;
      background:var(--bg-color);padding:0;
      padding-top:calc(20px + env(safe-area-inset-top));
      display:flex;flex-direction:column;overflow:hidden;
    }
    .create-card-scroll{
      flex:1;overflow-y:auto;overflow-x:hidden;
      padding-bottom:calc(120px + env(safe-area-inset-bottom));
    }
    .create-card-scroll::-webkit-scrollbar{width:2px;}
    .create-card-scroll::-webkit-scrollbar-thumb{background:var(--border-color);border-radius:2px;}

    /* create mode toggle */
    .create-mode-bar{
      display:flex;align-items:center;gap:8px;padding:0 18px 12px;flex-shrink:0;
    }
    .create-mode-toggle{display:flex;background:var(--hover-bg);border:1px solid var(--border-color);border-radius:20px;padding:3px;gap:2px;}
    .create-mode-btn{
      padding:5px 14px;border-radius:16px;border:none;cursor:pointer;
      font-size:11px;font-weight:700;font-family:var(--font-ui);
      color:var(--text-secondary);background:transparent;
      display:flex;align-items:center;gap:5px;transition:all 0.2s;
    }
    .create-mode-btn i{font-size:10px;}
    .create-mode-btn.active{background:var(--accent);color:#0f0e0b;box-shadow:0 2px 8px var(--accent-glow);}
    .create-mode-spacer{flex:1;}
    .create-signin-hint{font-size:11px;color:var(--text-secondary);}

    /* article editor fields */
    .create-title-input{
      font-size:var(--font-size-title);font-weight:800;color:var(--text-primary);
      line-height:1.2;letter-spacing:-0.02em;padding:0 18px 10px;
      font-family:var(--font-article);border:none;outline:none;background:transparent;
      width:100%;resize:none;overflow:hidden;min-height:1.2em;
    }
    .create-title-input::placeholder{color:var(--text-secondary);opacity:0.5;}
    .create-stats-bar{display:flex;gap:14px;padding:4px 18px 10px;border-bottom:1px solid var(--border-color);}
    .create-content-area{
      font-size:var(--font-size-base);line-height:1.65;color:var(--text-primary);
      padding:12px 18px;font-family:var(--font-article);
      min-height:200px;outline:none;white-space:pre-wrap;word-break:break-word;
    }
    .create-content-area:empty::before{content:attr(data-placeholder);color:var(--text-secondary);opacity:0.45;pointer-events:none;}
    .create-blocks-wrap{padding:0 0 8px;}

    /* create blocks */
    .cblk-row{display:flex;align-items:flex-start;position:relative;margin-bottom:2px;}
    .cblk-handle{width:26px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:3px;}
    .cblk-move{width:22px;height:22px;border-radius:5px;border:none;background:transparent;color:var(--border-color);display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;}
    .cblk-move:active{background:var(--hover-bg);color:var(--accent);}
    .cblk-content{flex:1;min-width:0;}
    .cblk-actions{width:26px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding-top:8px;gap:3px;}
    .cblk-act{width:22px;height:22px;border-radius:5px;border:none;background:transparent;color:var(--text-secondary);display:flex;align-items:center;justify-content:center;font-size:9px;cursor:pointer;}
    .cblk-act:active{background:var(--hover-bg);}
    .cblk-act.del:active{color:#f87171;}

    .cblk-text-display{
      font-size:var(--font-size-base);line-height:1.65;color:var(--text-primary);
      padding:6px 18px 6px 0;font-family:var(--font-article);
      min-height:38px;word-break:break-word;white-space:pre-wrap;cursor:text;
      -webkit-user-select:text;user-select:text;
    }
    .cblk-text-display:empty::before{content:attr(data-placeholder);color:var(--text-secondary);opacity:0.4;pointer-events:none;}
    .cblk-textarea{
      font-size:var(--font-size-base);line-height:1.65;color:var(--text-primary);
      border:none;outline:none;background:transparent;width:100%;resize:none;
      min-height:38px;padding:6px 18px 6px 0;
      font-family:var(--font-article);caret-color:var(--accent);overflow:hidden;display:none;
    }
    .cblk-textarea.editing{display:block;}
    .cblk-text-display.hidden{display:none;}
    .cblk-textarea::placeholder{color:var(--text-secondary);opacity:0.4;}

    .cblk-img-wrap{width:calc(100% + 26px);margin-right:-26px;margin-bottom:4px;margin-top:4px;overflow:hidden;}
    .cblk-img-wrap img{width:100%;height:auto;display:block;max-height:300px;object-fit:cover;}
    .cblk-caption{width:100%;background:transparent;border:none;outline:none;font-size:12px;color:var(--text-secondary);font-family:var(--font-ui);padding:5px 18px 5px 0;font-style:italic;}
    .cblk-caption::placeholder{color:var(--text-secondary);opacity:0.4;}
    .cblk-yt-wrap{width:calc(100% + 26px);margin-right:-26px;overflow:hidden;}
    .cblk-yt-wrap iframe{width:100%;aspect-ratio:16/9;border:none;display:block;}

    /* MCQ editor */
    .create-mcq-wrap{padding:10px 18px 0;}
    .create-mcq-q{
      font-size:var(--font-size-mcq);font-weight:800;color:var(--text-primary);
      line-height:1.3;letter-spacing:-0.02em;font-family:var(--font-article);
      border:none;outline:none;background:transparent;width:100%;resize:none;
      padding:0;margin-bottom:14px;min-height:1.3em;caret-color:var(--accent);
    }
    .create-mcq-q::placeholder{color:var(--text-secondary);opacity:0.45;}
    .create-mcq-opts{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
    .create-mcq-opt-row{display:flex;align-items:center;gap:10px;border:1px solid var(--border-color);border-radius:12px;padding:11px 13px;background:var(--hover-bg);}
    .create-mcq-opt-row.correct{border-color:rgba(106,191,133,0.6);background:rgba(106,191,133,0.06);}
    .create-mcq-letter{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border-color);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--text-secondary);flex-shrink:0;}
    .create-mcq-opt-row.correct .create-mcq-letter{background:#6abf85;border-color:#6abf85;color:#0f0e0b;}
    .create-mcq-opt-input{flex:1;background:transparent;border:none;outline:none;font-size:13px;font-weight:500;color:var(--text-primary);font-family:var(--font-ui);}
    .create-mcq-opt-input::placeholder{color:var(--text-secondary);opacity:0.45;}
    .create-mcq-mark{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;background:var(--bg-color);color:var(--text-secondary);}
    .create-mcq-opt-row.correct .create-mcq-mark{background:#6abf85;color:#0f0e0b;}
    .create-mcq-del{width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;background:transparent;color:var(--text-secondary);flex-shrink:0;}
    .create-mcq-add{margin:0 18px 10px;padding:12px;border-radius:10px;border:1px dashed var(--border-color);background:transparent;color:var(--text-secondary);font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--font-ui);width:calc(100% - 36px);}

    /* Batch input */
    .create-batch-toggle{
      display:flex;align-items:center;gap:6px;margin:8px 18px 0;
      font-size:11px;font-weight:700;color:var(--text-secondary);
      background:none;border:none;cursor:pointer;padding:4px 0;
    }
    .create-batch-toggle i.chev{transition:transform 0.2s;}
    .create-batch-toggle.open i.chev{transform:rotate(180deg);}
    .create-batch-panel{display:none;padding:8px 18px 0;}
    .create-batch-panel.open{display:block;}
    .create-batch-hints{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
    .create-batch-hint{background:var(--hover-bg);border:1px solid var(--border-color);border-radius:8px;padding:6px 10px;}
    .create-batch-hint code{font-size:10px;color:var(--text-secondary);font-family:'Courier New',monospace;line-height:1.5;}
    .create-batch-hint code em{color:var(--accent);font-style:normal;font-weight:700;}
    .create-batch-hint code .g{color:#6abf85;font-style:normal;font-weight:700;}
    .create-batch-textarea{
      width:100%;min-height:100px;background:var(--hover-bg);border:1px solid var(--border-color);
      border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.6;
      color:var(--text-primary);font-family:'Courier New',monospace;resize:none;outline:none;
      transition:border-color 0.15s;
    }
    .create-batch-textarea:focus{border-color:var(--accent);}
    .create-batch-textarea::placeholder{color:var(--text-secondary);opacity:0.4;font-style:italic;}
    .create-batch-meta{display:flex;gap:10px;padding:4px 0;font-size:10px;color:var(--text-secondary);}
    .create-batch-meta .ac{color:var(--accent);font-weight:700;}
    .create-batch-meta .mc{color:#6abf85;font-weight:700;}

    /* Library picker inline */
    .create-lib-row{
      margin:10px 18px 0;padding:11px 14px;background:var(--hover-bg);
      border:1px solid var(--border-color);border-radius:12px;
      display:flex;align-items:center;gap:10px;cursor:pointer;
    }
    .create-lib-row i.icon{font-size:13px;color:var(--accent);}
    .create-lib-row .lbl{font-size:12px;font-weight:700;flex:1;}
    .create-lib-row .val{font-size:11px;color:var(--text-secondary);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .create-lib-row .chev{font-size:10px;color:var(--text-secondary);}

    /* Media toolbar (create) */
    .create-media-bar{
      display:flex;flex-wrap:wrap;gap:6px;padding:10px 18px 0;
    }
    .create-media-btn{
      flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;
      padding:9px 6px;border-radius:10px;border:1px solid var(--border-color);
      background:var(--hover-bg);color:var(--text-secondary);font-size:11px;font-weight:700;
      cursor:pointer;font-family:var(--font-ui);white-space:nowrap;
    }
    .create-media-btn:active{border-color:var(--accent);color:var(--accent);}
    .create-media-btn i{font-size:12px;}
    .create-yt-bar{display:none;align-items:center;gap:6px;margin:6px 18px 0;}
    .create-yt-bar.show{display:flex;}
    .create-yt-input{flex:1;padding:8px 12px;background:var(--hover-bg);border:1px solid var(--border-color);border-radius:8px;outline:none;font-size:14px;color:var(--text-primary);font-family:var(--font-ui);}
    .create-yt-input:focus{border-color:var(--accent);}
    .create-yt-input::placeholder{color:var(--text-secondary);opacity:0.5;}
    .create-yt-add{padding:8px 12px;background:rgba(200,169,110,0.15);border:1px solid rgba(200,169,110,0.3);border-radius:8px;color:var(--accent);font-size:11px;font-weight:700;cursor:pointer;}
    .create-yt-cancel{padding:8px 10px;background:transparent;border:1px solid var(--border-color);border-radius:8px;color:var(--text-secondary);font-size:11px;cursor:pointer;}

    /* create bottom action bar */
    .create-bottom-bar{
      position:absolute;bottom:0;left:0;right:0;
      background:rgba(15,14,11,0.97);border-top:1px solid var(--border-color);
      padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom) + 60px);
      backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
      display:flex;gap:8px;align-items:center;z-index:20;
    }
    .create-publish-btn{
      flex:1;padding:12px;border-radius:12px;background:var(--accent);color:#0f0e0b;
      font-size:13px;font-weight:800;border:none;cursor:pointer;font-family:var(--font-ui);
      box-shadow:0 4px 16px var(--accent-glow);transition:background 0.15s,transform 0.1s;
    }
    .create-publish-btn:hover:not(:disabled){background:var(--accent-hover);}
    .create-publish-btn:active:not(:disabled){transform:scale(0.98);}
    .create-publish-btn:disabled{opacity:0.3;cursor:not-allowed;}
    .create-save-draft{
      padding:12px 14px;border-radius:12px;background:var(--hover-bg);
      border:1px solid var(--border-color);color:var(--text-secondary);
      font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font-ui);white-space:nowrap;
    }

    /* lib picker overlay (for create) */

<script>
/* ══ CONFETTI ══ */
(function(){
  const canvas=document.getElementById('confettiCanvas'),ctx=canvas.getContext('2d');
  let particles=[],animFrame=null;
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  window.addEventListener('resize',resize);resize();
  const COLORS=['#c8a96e','#e8d8a0','#a07840','#d4b86a','#7ab88a','#c97a5a','#8aa0c0','#f0e8d8'];
  function spawnParticles(x,y){
    for(let i=0;i<60;i++){const angle=Math.random()*Math.PI*2,speed=Math.random()*5+2;particles.push({x:x??canvas.width/2,y:y??canvas.height*0.4,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-2.5,size:Math.random()*5+2.5,color:COLORS[Math.floor(Math.random()*COLORS.length)],alpha:1,rotation:Math.random()*Math.PI*2,rotSpeed:(Math.random()-0.5)*0.15,shape:Math.random()>0.5?'rect':'circle'});}
    if(!animFrame)animate();
  }
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles=particles.filter(p=>p.alpha>0.01);
    particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.vx*=0.99;p.alpha-=0.016;p.rotation+=p.rotSpeed;ctx.save();ctx.globalAlpha=Math.max(0,p.alpha);ctx.translate(p.x,p.y);ctx.rotate(p.rotation);ctx.fillStyle=p.color;if(p.shape==='rect'){ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);}else{ctx.beginPath();ctx.arc(0,0,p.size/2,0,Math.PI*2);ctx.fill();}ctx.restore();});
    if(particles.length>0){animFrame=requestAnimationFrame(animate);}else{animFrame=null;ctx.clearRect(0,0,canvas.width,canvas.height);}
  }
  window.launchConfetti=function(targetEl){if(targetEl){const r=targetEl.getBoundingClientRect();spawnParticles(r.left+r.width/2,r.top+r.height/2);}else spawnParticles();};
})();
</script>

<script>
/* ══ EMOJI MAP & RENDERING ══ */
const EMOJI_MAP={
  '🔍':'emo-magnify','❗':'emo-urgent','📌':'emo-pinned','🔥':'emo-fire','💎':'emo-diamond',
  '🟡':'emo-yellow','🔵':'emo-blue','🟢':'emo-green','🟣':'emo-purple','🔴':'emo-red',
  '⚫':'emo-dark','🧠':'emo-brain','📖':'emo-book','💡':'emo-idea','🎯':'emo-target',
  '🧩':'emo-puzzle','🏷️':'emo-tag','🔬':'emo-micro','⚠️':'emo-warning','✅':'emo-check',
  '❌':'emo-cross','⏳':'emo-hourglass','🔒':'emo-lock','🔓':'emo-unlock','⚡':'emo-lightning',
  '🌊':'emo-wave','🌀':'emo-spin','💫':'emo-float','🚀':'emo-rocket','🎬':'emo-cinematic',
  '🌟':'emo-star','✨':'emo-sparkle','🌈':'emo-rainbow','👑':'emo-crown','🪄':'emo-magic',
  '❤️':'emo-heart','😄':'emo-happy','😌':'emo-calm','😮':'emo-surprised','😎':'emo-cool',
  '🤖':'emo-robot','🧪':'emo-science','🏛️':'emo-temple','🌍':'emo-earth','💰':'emo-money',
  '⚖️':'emo-balance','📡':'emo-signal','🎵':'emo-music','🧊':'emo-ice','🔊':'emo-sound',
};
function buildEmojiPattern(){const keys=Object.keys(EMOJI_MAP).sort((a,b)=>b.length-a.length);const escaped=keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');return new RegExp(`(${escaped})([\\s\\S]*?)\\1`,'gu');}
function escHtmlET(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderTerms(html){return html.replace(/([A-Za-z][A-Za-z0-9\-']{0,60}?)&lt;([^&]{1,600}?)&gt;/g,function(match,term,explanation){const safeTerm=term.trim().replace(/'/g,'&#39;');const safeExp=explanation.replace(/'/g,'&#39;');return `<span class="term-link" onclick="openTermPopup('${safeTerm}','${safeExp}',event)">${term.trim()}</span>`;});}
function renderEmojiText(text,applyTerms=true){const re=buildEmojiPattern();let result='',lastIndex=0,match;while((match=re.exec(text))!==null){result+=escHtmlET(text.slice(lastIndex,match.index));const cls=EMOJI_MAP[match[1]];result+=`<span class="${cls}">${renderEmojiText(match[2],false)}</span>`;lastIndex=re.lastIndex;}result+=escHtmlET(text.slice(lastIndex));return applyTerms?renderTerms(result):result;}
</script>

<script>
/* ══ IMAGE DOMINANT COLOR ══ */
window._getImageDominantColor=function(imgEl,callback){
  try{
    const canvas=document.createElement('canvas');const SIZE=50;canvas.width=SIZE;canvas.height=SIZE;
    const ctx=canvas.getContext('2d');ctx.drawImage(imgEl,0,0,SIZE,SIZE);
    const data=ctx.getImageData(0,0,SIZE,SIZE).data;
    let r=0,g=0,b=0,cnt=0;
    for(let i=0;i<data.length;i+=4){const a=data[i+3];if(a<128)continue;r+=data[i];g+=data[i+1];b+=data[i+2];cnt++;}
    if(!cnt){callback(null);return;}
    r=Math.round(r/cnt);g=Math.round(g/cnt);b=Math.round(b/cnt);
    const boost=1.5;r=Math.min(255,Math.round(r*boost));g=Math.min(255,Math.round(g*boost));b=Math.min(255,Math.round(b*boost));
    callback(`rgb(${r},${g},${b})`);
  }catch(e){callback(null);}
};
</script>

<script>
/* ══ EXPLORE ══ */
let exploreFilter='all',exploreQuery='',exploreOffset=0,exploreHasMore=false,exploreTimeout=null;
const EXPLORE_LIMIT=10;

function openExplore(){
  document.getElementById('exploreOverlay').classList.add('show');
  setTimeout(()=>document.getElementById('exploreInput').focus(),300);
}
function closeExplore(){document.getElementById('exploreOverlay').classList.remove('show');}
document.getElementById('exploreOverlay').addEventListener('click',function(e){if(e.target===this)closeExplore();});

document.getElementById('exploreInput').addEventListener('input',function(){
  const q=this.value.trim();
  document.getElementById('exploreClear').classList.toggle('show',!!q);
  exploreQuery=q;
  clearTimeout(exploreTimeout);
  if(!q){
    document.getElementById('exploreBody').innerHTML=`<div class="explore-empty"><i class="fas fa-search"></i><h3>Discover Content</h3><div style="font-size:13px;">Search for users, articles, or libraries</div></div>`;
    document.getElementById('exploreLoadMore').classList.add('hidden');return;
  }
  exploreTimeout=setTimeout(()=>{exploreOffset=0;doExploreSearch(true);},300);
});
document.getElementById('exploreClear').addEventListener('click',function(){
  document.getElementById('exploreInput').value='';this.classList.remove('show');exploreQuery='';
  document.getElementById('exploreBody').innerHTML=`<div class="explore-empty"><i class="fas fa-search"></i><h3>Discover Content</h3><div style="font-size:13px;">Search for users, articles, or libraries</div></div>`;
  document.getElementById('exploreLoadMore').classList.add('hidden');
  document.getElementById('exploreInput').focus();
});
document.getElementById('exploreFilters').addEventListener('click',function(e){
  const btn=e.target.closest('.explore-filter');if(!btn)return;
  document.querySelectorAll('.explore-filter').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');exploreFilter=btn.dataset.filter;
  if(exploreQuery){exploreOffset=0;doExploreSearch(true);}
});

function escH(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

async function doExploreSearch(isNew){
  if(!window._exploreSupabase)return;
  const sb=window._exploreSupabase;
  const q=exploreQuery;const body=document.getElementById('exploreBody');
  if(isNew){
    body.innerHTML=`<div class="explore-spinner"><div class="spinner" style="width:28px;height:28px;border-width:2px;"></div></div>`;
    document.getElementById('exploreLoadMore').classList.add('hidden');
  }
  try{
    let results=[];
    if(exploreFilter==='all'||exploreFilter==='users'){
      const {data:users}=await sb.from('users').select('user_id,username,full_name,pfp,bio').ilike('username',`%${q}%`).range(exploreOffset,exploreOffset+EXPLORE_LIMIT-1);
      if(users)results.push(...users.map(u=>({...u,_type:'user'})));
    }
    if(exploreFilter==='all'||exploreFilter==='articles'){
      const {data:arts}=await sb.from('articles').select('id,title,created_at,firebase_user_id').ilike('title',`%${q}%`).range(exploreOffset,exploreOffset+EXPLORE_LIMIT-1);
      if(arts){
        const uids=[...new Set(arts.map(a=>a.firebase_user_id).filter(Boolean))];
        let umap={};
        if(uids.length>0){const {data:us}=await sb.from('users').select('firebase_uid,username').in('firebase_uid',uids);if(us)us.forEach(u=>{umap[u.firebase_uid]=u;});}
        results.push(...arts.map(a=>({...a,_type:'article',_authorUsername:umap[a.firebase_user_id]?.username||'unknown'})));
      }
    }
    if(exploreFilter==='article-content'){
      const {data:arts}=await sb.from('articles').select('id,title,content,created_at,firebase_user_id').ilike('content',`%${q}%`).range(exploreOffset,exploreOffset+EXPLORE_LIMIT-1);
      if(arts){
        const uids=[...new Set(arts.map(a=>a.firebase_user_id).filter(Boolean))];
        let umap={};
        if(uids.length>0){const {data:us}=await sb.from('users').select('firebase_uid,username').in('firebase_uid',uids);if(us)us.forEach(u=>{umap[u.firebase_uid]=u;});}
        results.push(...arts.map(a=>{
          let excerpt='';
          if(a.content){const idx=a.content.toLowerCase().indexOf(q.toLowerCase());if(idx!==-1){const st=Math.max(0,idx-40);const en=Math.min(a.content.length,idx+q.length+80);excerpt=(st>0?'…':'')+a.content.substring(st,en)+(en<a.content.length?'…':'');}else excerpt=a.content.substring(0,120)+'…';}
          return {...a,_type:'article-content',_authorUsername:umap[a.firebase_user_id]?.username||'unknown',_excerpt:excerpt};
        }));
      }
    }
    if(exploreFilter==='all'||exploreFilter==='playlists'){
      const {data:plists}=await sb.from('playlists').select('id,name,description,thumbnail_url').ilike('name',`%${q}%`).range(exploreOffset,exploreOffset+EXPLORE_LIMIT-1);
      if(plists)results.push(...plists.map(p=>({...p,_type:'playlist'})));
    }
    exploreHasMore=results.length>=EXPLORE_LIMIT;
    exploreOffset+=results.length;
    if(isNew)body.innerHTML='';
    if(results.length===0&&isNew){
      body.innerHTML=`<div class="explore-empty"><i class="fas fa-search"></i><h3>No results found</h3><div style="font-size:13px;">Try different keywords</div></div>`;
    } else {
      results.forEach(r=>{
        const item=document.createElement('div');item.className='explore-result-item';
        let avHtml='',title='',sub='',badge='',onclick='';
        if(r._type==='user'){
          avHtml=r.pfp?`<img src="${escH(r.pfp)}" alt="">`:(r.username||'U')[0].toUpperCase();
          title='@'+(r.username||'unknown');sub=r.bio||'';badge='<span class="explore-result-badge badge-user">User</span>';
          onclick=`window.location.href='profile.html?username=${encodeURIComponent(r.username)}'`;
        } else if(r._type==='article'||r._type==='article-content'){
          avHtml='<i class="fas fa-file-alt" style="font-size:16px;color:#6abf85;"></i>';
          title=r.title||'Untitled';sub=`by @${r._authorUsername}${r._excerpt?' · '+r._excerpt.slice(0,60):''}`;
          badge='<span class="explore-result-badge badge-article">Article</span>';
          onclick=`openArticleFromExplore(${r.id})`;
        } else {
          avHtml='<i class="fas fa-book-open" style="font-size:16px;color:#9b7fe8;"></i>';
          title=r.name||'Library';sub=r.description||'';
          badge='<span class="explore-result-badge badge-playlist">Library</span>';
          onclick=`window.location.href='playlist.html?id=${r.id}'`;
        }
        item.innerHTML=`<div class="explore-result-avatar ${r._type==='article'||r._type==='article-content'?'art':r._type==='playlist'?'plist':''}">${avHtml}</div><div class="explore-result-content"><div class="explore-result-title">${escH(title)}</div><div class="explore-result-sub">${escH(sub)}</div></div>${badge}`;
        item.onclick=new Function(onclick);
        body.appendChild(item);
      });
    }
    document.getElementById('exploreLoadMore').classList.toggle('hidden',!exploreHasMore||results.length===0);
  }catch(e){console.error('[explore]',e);if(isNew)body.innerHTML=`<div class="explore-empty"><i class="fas fa-exclamation-triangle"></i><h3>Search failed</h3></div>`;}
}

  e.stopPropagation();if(!currentUser){window.location.href='https://patholytica.com/login';return;}
  const btn=e.currentTarget;if(btn.dataset.processing==='true')return;btn.dataset.processing='true';
  const supaUid=String(authorSupaUserId),wasFollowing=userFollowing.has(supaUid);
  if(wasFollowing)userFollowing.delete(supaUid);else userFollowing.add(supaUid);
  updateFollowButtons();
  if(!wasFollowing){setTimeout(()=>{btn.classList.add('ringing');btn.addEventListener('animationend',()=>btn.classList.remove('ringing'),{once:true});},260);}
  try{

  }catch(err){if(wasFollowing)userFollowing.add(supaUid);else userFollowing.delete(supaUid);updateFollowButtons();}
  finally{btn.dataset.processing='false';}
};

  if(anchorArticleId!==null||window._urlPlaylistId){

    }

  }

  const wrapper=document.getElementById('postsWrapper');

  wrapper.appendChild(pickerCard);
  injectInitialSkeletons(3);
  loadArticles(true);

  requestAnimationFrame(()=>{const firstSkeleton=wrapper.querySelector('.skeleton-card');if(firstSkeleton)wrapper.scrollTop=firstSkeleton.offsetTop;});
  initPrefsUI();

  const grid=document.getElementById('lpGrid'),startBtn=document.getElementById('lpStartBtn');
  const hint=document.getElementById('lpCountHint');
  const selected=new Set();

  try{
    const{data:libs,error}=await supabase.from('playlists').select('id,name,description,thumbnail_url').order('name',{ascending:true});
    if(error||!libs||!libs.length){grid.innerHTML='';return;}
    const{data:countRows}=await supabase.from('playlist_items').select('playlist_id');
    const countMap={};(countRows||[]).forEach(r=>{countMap[r.playlist_id]=(countMap[r.playlist_id]||0)+1;});
    const filteredLibs=libs.filter(lib=>(countMap[lib.id]||0)>0);
    const favedLibs=filteredLibs.filter(l=>userFavLibs.has(String(l.id))).sort((a,b)=>(countMap[b.id]||0)-(countMap[a.id]||0));
    const otherLibs=filteredLibs.filter(l=>!userFavLibs.has(String(l.id))).sort((a,b)=>(countMap[b.id]||0)-(countMap[a.id]||0));
    if(!filteredLibs.length){grid.innerHTML='';return;}
    grid.innerHTML='';

    function renderMovieItem(lib){
      const count=countMap[lib.id]||0;
      const fl=(lib.name||'?')[0].toUpperCase();
      const posterContent=lib.thumbnail_url?`<img src="${lib.thumbnail_url}" alt="${lib.name||''}" loading="lazy">`:`<div class="lp-poster-placeholder"><div class="lp-poster-letter">${fl}</div><div class="lp-poster-icon"><i class="fas fa-book-open"></i></div></div>`;
      const card=document.createElement('div');card.className='lp-movie-card';card.dataset.id=lib.id;
      card.innerHTML=`<div class="lp-movie-poster">${posterContent}<div class="lp-movie-overlay"><div class="lp-movie-count"><i class="fas fa-layer-group"></i> ${count}</div></div><div class="lp-selected-badge">✓</div></div><div class="lp-movie-info"><div class="lp-movie-title">${lib.name||'Untitled'}</div><div class="lp-movie-meta"></div></div>`;
      card.addEventListener('click',()=>{
        const id=String(lib.id);
        if(selected.has(id)){selected.delete(id);card.classList.remove('selected');}
        else{if(selected.size>=5)return;selected.add(id);card.classList.add('selected');}
        const n=selected.size;hint.textContent=`${n} / 5 selected`;startBtn.disabled=n===0;
        grid.querySelectorAll('.lp-movie-card').forEach(el=>{if(!el.classList.contains('selected')){el.style.opacity=n>=5?'0.35':'1';el.style.pointerEvents=n>=5?'none':'';}else{el.style.opacity='1';el.style.pointerEvents='';}});
      });
      return card;
    }

    function makeShelfSection(label,libs,isSub){
      const wrap=document.createElement('div');
      const lbl=document.createElement('div');lbl.className=isSub?'lp-section-divider':'lp-section-label';
      lbl.innerHTML=isSub?label:`<i class="fas fa-heart"></i> ${label}`;wrap.appendChild(lbl);
      const shelfWrap=document.createElement('div');shelfWrap.className='lp-shelf-wrap';
      const shelf=document.createElement('div');shelf.className='lp-shelf';
      libs.forEach(lib=>shelf.appendChild(renderMovieItem(lib)));
      shelfWrap.appendChild(shelf);wrap.appendChild(shelfWrap);return wrap;
    }

    if(favedLibs.length>0)grid.appendChild(makeShelfSection('Your Saved Libraries',favedLibs,false));
    if(otherLibs.length>0)grid.appendChild(makeShelfSection(favedLibs.length>0?'All Libraries':'Libraries',otherLibs,favedLibs.length>0));

    startBtn.addEventListener('click',async()=>{
      startBtn.disabled=true;startBtn.textContent='Loading…';
      animatePickerOut(async()=>{
        const playlistIds=[...selected].map(Number);
        const{data:items}=await supabase.from('playlist_items').select('article_id').in('playlist_id',playlistIds);
        const articleIds=[...new Set((items||[]).map(r=>r.article_id))];
        filteredArticleIds=articleIds.length>0?articleIds:null;
        articles=[];offset=0;hasMore=true;isLoading=false;
        document.getElementById('postsWrapper').querySelectorAll('.article-card,.mcq-card').forEach(c=>c.remove());
        loadArticles(true);
      });
    });
  }catch(e){console.error('[picker]',e);grid.innerHTML='';}
}

/* create block system */
function createAutoResize(el){el.style.height='auto';el.style.height=el.scrollHeight+'px';}
function genCId(){return'cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);}

function addCreateTextBlock(text=''){
  const id=genCId();
  createBlocks.push({id,type:'text',text});
  renderCreateBlocks();
  requestAnimationFrame(()=>{const ta=document.querySelector(`[data-cblk="${id}"] .cblk-textarea`);if(ta)activateCBlkEdit(id,ta);});
}

function addCreateImgBlock(dataUrl,name){createBlocks.push({id:genCId(),type:'image',dataUrl,name,caption:''});renderCreateBlocks();}
function addCreateAudioBlock(dataUrl,name){createBlocks.push({id:genCId(),type:'audio',dataUrl,name,caption:''});renderCreateBlocks();}
function addCreateYtBlockData(ytId){createBlocks.push({id:genCId(),type:'youtube',ytId,url:`https://www.youtube.com/embed/${ytId}`,caption:''});renderCreateBlocks();}
function removeCBlk(id){createBlocks=createBlocks.filter(b=>b.id!==id);if(createBlocks.length===0)addCreateTextBlock('');else renderCreateBlocks();}
function moveCBlkUp(id){const i=createBlocks.findIndex(b=>b.id===id);if(i>0){[createBlocks[i-1],createBlocks[i]]=[createBlocks[i],createBlocks[i-1]];renderCreateBlocks();}}
function moveCBlkDown(id){const i=createBlocks.findIndex(b=>b.id===id);if(i<createBlocks.length-1){[createBlocks[i],createBlocks[i+1]]=[createBlocks[i+1],createBlocks[i]];renderCreateBlocks();}}

function renderCreateBlocks(){
  const wrap=document.getElementById('createBlocksWrap');
  // save textarea values
  document.querySelectorAll('[data-cblk-ta]').forEach(ta=>{const blk=createBlocks.find(b=>b.id===ta.getAttribute('data-cblk-ta'));if(blk&&blk.type==='text')blk.text=ta.value;});
  wrap.innerHTML='';
  createBlocks.forEach((blk,idx)=>{
    const row=document.createElement('div');row.className='cblk-row';

    const handle=document.createElement('div');handle.className='cblk-handle';
    if(idx>0){const up=document.createElement('button');up.className='cblk-move';up.innerHTML='<i class="fas fa-chevron-up"></i>';up.onclick=()=>moveCBlkUp(blk.id);handle.appendChild(up);}
    if(idx<createBlocks.length-1){const dn=document.createElement('button');dn.className='cblk-move';dn.innerHTML='<i class="fas fa-chevron-down"></i>';dn.onclick=()=>moveCBlkDown(blk.id);handle.appendChild(dn);}

    const content=document.createElement('div');content.className='cblk-content';content.setAttribute('data-cblk',blk.id);

    if(blk.type==='text'){
      const disp=document.createElement('div');disp.className='cblk-text-display';disp.setAttribute('data-placeholder','Write here…');disp.setAttribute('data-cblk-display',blk.id);
      if(blk.text)disp.innerHTML=renderEmojiText(blk.text);
      const ta=document.createElement('textarea');ta.className='cblk-textarea';ta.placeholder='Write here…';ta.value=blk.text||'';ta.setAttribute('data-cblk-ta',blk.id);
      ta.addEventListener('input',function(){blk.text=this.value;this.style.height='auto';this.style.height=this.scrollHeight+'px';const d=document.querySelector(`[data-cblk-display="${blk.id}"]`);if(d)d.innerHTML=blk.text?renderEmojiText(blk.text):'';});
      ta.addEventListener('blur',()=>{blk.text=ta.value;ta.classList.remove('editing');disp.classList.remove('hidden');disp.innerHTML=blk.text?renderEmojiText(blk.text):'';});
      disp.addEventListener('click',()=>activateCBlkEdit(blk.id,ta));
      content.appendChild(disp);content.appendChild(ta);
      requestAnimationFrame(()=>{ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';});
    } else if(blk.type==='image'){
      const w=document.createElement('div');w.className='cblk-img-wrap';
      const img=document.createElement('img');img.src=blk.dataUrl||blk.url||'';img.alt=blk.name||'';img.crossOrigin='anonymous';w.appendChild(img);
      const cap=document.createElement('input');cap.className='cblk-caption';cap.placeholder='Add a caption…';cap.value=blk.caption||'';cap.oninput=function(){blk.caption=this.value;};w.appendChild(cap);
      content.appendChild(w);
    } else if(blk.type==='youtube'){
      const w=document.createElement('div');w.className='cblk-yt-wrap';
      const iframe=document.createElement('iframe');iframe.src=blk.url;iframe.title='YouTube';iframe.allow='accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture';iframe.allowFullscreen=true;w.appendChild(iframe);

/* batch parser */
function parseBatchInput(raw){
  const chunks=raw.trim().split('::');const results=[];
  for(const chunk of chunks){
    const c=chunk.trim();if(!c)continue;
    const mcqMatch=c.match(/^mcqart\d+:([\s\S]+)$/i);
    if(mcqMatch){
      const rest=mcqMatch[1];const fc=rest.indexOf(':');if(fc===-1)continue;
      const question=rest.slice(0,fc).trim();const optStr=rest.slice(fc+1).trim();
      const rawOpts=optStr.split('@').map(o=>o.trim()).filter(Boolean);if(!question||!rawOpts.length)continue;
      const options=rawOpts.map(o=>{const right=o.includes('{right}');return{label:o.replace('{right}','').trim(),correct:right};});
      if(!options.some(o=>o.correct)&&options.length>0)options[0].correct=true;
      results.push({type:'mcq',question,options});continue;
    }
    const artMatch=c.match(/^art\d+:([\s\S]+)$/i);
    if(artMatch){
      const rest=artMatch[1];const fc=rest.indexOf(':');if(fc===-1)continue;
      const title=rest.slice(0,fc).trim();const content=rest.slice(fc+1).trim();
      if(!title&&!content)continue;
      results.push({type:'article',title:title||'(untitled)',content:content||''});
    }
  }
  return results;
}

window.handleCreatePublish=async function(){
  if(!currentUser){window.location.href='https://patholytica.com/login';return;}
  const btn=document.getElementById('createPublishBtn');
  btn.disabled=true;btn.textContent='Publishing…';
  try{
    const authOk=await ensureSupabaseAuth();
    if(!authOk){showCreateToast('Auth error, try again','error');btn.disabled=false;btn.textContent='Publish';return;}

    if(createMode==='article'){
      const title=document.getElementById('createTitleInput').value.trim();
      if(!title){showCreateToast('Title required','error');btn.disabled=false;btn.textContent='Publish';return;}
      document.querySelectorAll('[data-cblk-ta]').forEach(ta=>{const blk=createBlocks.find(b=>b.id===ta.getAttribute('data-cblk-ta'));if(blk)blk.text=ta.value;});
      const textBlocks=createBlocks.filter(b=>b.type==='text');
      const content=textBlocks.map(b=>(b.text||'').trim()).filter(Boolean).join('\n\n');
      if(!content){showCreateToast('Add some content','error');btn.disabled=false;btn.textContent='Publish';return;}

      const isEditing=!!window._createEditingArticleId;
      let artId;
      if(isEditing){
        const{error}=await supabase.from('articles').update({title,content}).eq('id',window._createEditingArticleId);
        if(error)throw error;artId=window._createEditingArticleId;
        await supabase.from('media').delete().eq('article_id',artId);
      } else {
        const{data:art,error}=await supabase.from('articles').insert([{title,content,firebase_user_id:auth.currentUser.uid,views:0,likes:0}]).select().single();
        if(error)throw error;artId=art.id;
      }
      const mediaBlocks=createBlocks.filter(b=>b.type!=='text');
      if(mediaBlocks.length>0){
        let lastTIdx=0;const tIdxMap={};let tc=0;
        createBlocks.forEach(b=>{if(b.type==='text')tIdxMap[b.id]=tc++;});
        const inserts=[];
        createBlocks.forEach(b=>{if(b.type==='text')lastTIdx=tIdxMap[b.id]??lastTIdx;else inserts.push({article_id:artId,type:b.type,url:b.dataUrl||b.url||'',caption:b.caption||null,display_order:lastTIdx});});
        const{error:me}=await supabase.from('media').insert(inserts);if(me)console.error('[media insert]',me);
      }
      if(!isEditing&&createSelectedLibId){await supabase.from('playlist_items').insert([{playlist_id:createSelectedLibId,article_id:artId}]);}
      showCreateToast(isEditing?'Saved!':'Published! 🎉','success');
      resetCreateCard();
      setTimeout(()=>{
        anchorArticleId=artId;filteredArticleIds=null;articles=[];offset=0;hasMore=true;isLoading=false;
        document.getElementById('postsWrapper').querySelectorAll('.article-card,.mcq-card,.skeleton-card').forEach(c=>c.remove());
        loadArticles(true);
      },800);

    } else if(createMode==='mcq'){
      const question=document.getElementById('createMCQQuestion').value.trim();
      if(!question){showCreateToast('Question required','error');btn.disabled=false;btn.textContent='Publish';return;}
      const rows=[...document.querySelectorAll('.create-mcq-opt-row')];
      if(rows.length<2){showCreateToast('Need at least 2 options','error');btn.disabled=false;btn.textContent='Publish';return;}
      if(!rows.some(r=>r.classList.contains('correct'))){showCreateToast('Mark one correct answer','error');btn.disabled=false;btn.textContent='Publish';return;}
      const content=['❔'+question,...rows.map(r=>{const inp=r.querySelector('.create-mcq-opt-input').value.trim();return r.classList.contains('correct')?'✅'+inp:inp;})].join('\n');
      const{data:art,error}=await supabase.from('articles').insert([{title:question,content,firebase_user_id:auth.currentUser.uid,views:0,likes:0}]).select().single();
      if(error)throw error;
      if(createSelectedLibId)await supabase.from('playlist_items').insert([{playlist_id:createSelectedLibId,article_id:art.id}]);
      showCreateToast('Published! 🎉','success');
      resetCreateCard();
      setTimeout(()=>{anchorArticleId=art.id;filteredArticleIds=null;articles=[];offset=0;hasMore=true;isLoading=false;document.getElementById('postsWrapper').querySelectorAll('.article-card,.mcq-card,.skeleton-card').forEach(c=>c.remove());loadArticles(true);},800);

    } else if(createMode==='batch'){
      const raw=document.getElementById('createBatchInput').value||'';
      const items=parseBatchInput(raw);
      if(!items.length){showCreateToast('No valid items found','error');btn.disabled=false;btn.textContent='Publish';return;}
      let ok=0,fail=0,ids=[];
      for(const item of items){
        try{
          if(item.type==='article'){
            const{data:art,error}=await supabase.from('articles').insert([{title:item.title,content:item.content,firebase_user_id:auth.currentUser.uid,views:0,likes:0}]).select().single();
            if(error)throw error;ok++;ids.push(art.id);
          } else {
            const contentLines=item.options.map(o=>o.correct?`✅${o.label}`:o.label).join('\n');
            const fullContent=`❔${item.question}\n${contentLines}`;
            const{data:art,error}=await supabase.from('articles').insert([{title:item.question,content:fullContent,firebase_user_id:auth.currentUser.uid,views:0,likes:0}]).select().single();
            if(error)throw error;ok++;ids.push(art.id);
          }
        }catch(e){console.error('[batch item]',e);fail++;}
      }
      if(createSelectedLibId&&ids.length>0){
        await supabase.from('playlist_items').insert(ids.map(id=>({playlist_id:createSelectedLibId,article_id:id})));
      }
      showCreateToast(fail===0?`${ok} items published!`:`${ok} published, ${fail} failed`,fail>0?'error':'success');
      if(ok>0){document.getElementById('createBatchInput').value='';window.onCreateBatchInput();}
    }
  }catch(e){
    console.error('[publish]',e);
    showCreateToast('Error: '+e.message,'error');
  }finally{
    btn.disabled=false;btn.textContent=window._createEditingArticleId?'Save':'Publish';
  }
};

function isMCQ(content){return typeof content==='string'&&content.trimStart().startsWith('❔');}
function parseMCQ(content){
  const lines=content.trim().split('\n').map(l=>l.trim()).filter(Boolean);
  const questionLine=lines[0].replace(/^❔/,'').trim();
  const options=lines.slice(1).map(line=>{const correct=line.startsWith('✅');return{label:line.replace(/^✅/,'').trim(),correct};});
  for(let i=options.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[options[i],options[j]]=[options[j],options[i]];}
  return{question:questionLine,options};
}
