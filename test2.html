  try{
    const{data:art}=await supabase.from('articles').select('*').eq('id',articleId).single();
    if(!art)return;
    const isMCQPost=art.content&&art.content.trimStart().startsWith('❔');
    const cc=document.getElementById('createCard');if(cc)cc.scrollIntoView({behavior:'smooth'});
    window._createEditingArticleId=art.id;
    document.getElementById('createPublishBtn').textContent='Save';

    if(isMCQPost){
      switchCreateMode('mcq');
      const lines=art.content.trim().split('\n').map(l=>l.trim()).filter(Boolean);
      const qInput=document.getElementById('createMCQQuestion');if(qInput){qInput.value=lines[0].replace(/^❔/,'').trim();createAutoResize(qInput);}
      const optsWrap=document.getElementById('createMCQOpts');if(optsWrap){optsWrap.innerHTML='';lines.slice(1).forEach((line,i)=>{addCreateMCQOpt(line.startsWith('✅'));const inputs=optsWrap.querySelectorAll('.create-mcq-opt-input');if(inputs[i])inputs[i].value=line.replace(/^✅/,'').trim();});}
    } else {
      switchCreateMode('article');
      const titleInput=document.getElementById('createTitleInput');if(titleInput){titleInput.value=art.title||'';createAutoResize(titleInput);}
      createBlocks=[];
      if(art.content){
        const paragraphs=art.content.split('\n\n').filter(p=>p.trim());
        let mediaRows=[];
        const{data:med}=await supabase.from('media').select('*').eq('article_id',art.id).order('display_order',{ascending:true});
        mediaRows=med||[];
        paragraphs.forEach((p,i)=>{
          createBlocks.push({id:genCId(),type:'text',text:p.trim()});
          mediaRows.filter(m=>m.display_order===i).forEach(m=>{
            if(m.type==='image')createBlocks.push({id:genCId(),type:'image',dataUrl:m.url,url:m.url,name:m.caption||'Image',caption:m.caption||''});
            else if(m.type==='youtube'){const ytId=m.url.match(/embed\/([A-Za-z0-9_\-]{11})/)?.[1]||'';createBlocks.push({id:genCId(),type:'youtube',ytId,url:m.url,caption:m.caption||''});}
            else if(m.type==='audio')createBlocks.push({id:genCId(),type:'audio',dataUrl:m.url,url:m.url,name:m.caption||'Audio',caption:m.caption||''});
          });
        });
      }
      renderCreateBlocks();
    }
  }catch(e){showCreateToast('Failed to load article','error');}
};

function buildMCQCard(article,index){
  const{question,options}=parseMCQ(article.content);
  const isLiked=userLikes.has(String(article.id));
  const letters=['A','B','C','D','E','F'];
  const card=document.createElement('div');
  card.className='mcq-card';card.dataset.index=index;card.dataset.articleId=article.id;
  card.innerHTML=`
    <div class="article-header">${buildAuthorHeader(article)}</div>
    <div class="mcq-question">${renderEmojiText(question)}</div>
    <div class="mcq-media" id="mcq-media-${article.id}"></div>
    <div class="mcq-scroll-area">
      <div class="mcq-options" id="mcq-opts-${article.id}"></div>
      <div class="mcq-result-msg" id="mcq-msg-${article.id}"></div>
    </div>
    <div class="action-buttons">
      ${buildEditBtn(article)}
      <button class="action-btn like-btn ${isLiked?'liked':''}" data-id="${article.id}">
        <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        <span class="like-count">${formatNumber(article.likes||0)}</span>
      </button>
      <button class="action-btn comment-btn" data-id="${article.id}">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <span class="comment-count">0</span>
      </button>
      <button class="action-btn share-btn" data-id="${article.id}" data-title="${(article.title||'').replace(/"/g,'&quot;')}">
        <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
        <span>Share</span>
      </button>
    </div>`;
  if(article.media&&article.media.length>0){const mc=card.querySelector(`#mcq-media-${article.id}`);article.media.forEach(m=>mc.appendChild(createMediaElement(m,false)));}
  const optsContainer=card.querySelector(`#mcq-opts-${article.id}`),msgEl=card.querySelector(`#mcq-msg-${article.id}`);
  let answered=false;
  options.forEach((opt,i)=>{
    const btn=document.createElement('button');btn.className='mcq-option';
    btn.innerHTML=`<span class="opt-letter">${letters[i]||i+1}</span><span class="opt-text">${renderEmojiText(opt.label)}</span>`;
    btn.addEventListener('click',()=>{
      if(answered)return;answered=true;optsContainer.querySelectorAll('.mcq-option').forEach(b=>b.disabled=true);
      if(opt.correct){btn.classList.add('selected-correct');msgEl.textContent='✓ Correct!';msgEl.className='mcq-result-msg correct';window.launchConfetti(btn);}
      else{btn.classList.add('selected-wrong');msgEl.className='mcq-result-msg wrong';const ci=options.findIndex(o=>o.correct);if(ci!==-1){optsContainer.querySelectorAll('.mcq-option')[ci].classList.add('reveal-correct');msgEl.textContent=`✗ The answer was: ${options[ci].label}`;}else msgEl.textContent='✗ Incorrect';}
    });
    optsContainer.appendChild(btn);
  });
  setupDoubleTap(card,article.id);return card;
}

function formatNumber(num){if(num>=1000000)return(num/1000000).toFixed(1)+'M';if(num>=1000)return(num/1000).toFixed(1)+'K';return(num||0).toString();}
function formatDate(date){const now=new Date(),ms=now-date,mins=Math.floor(ms/60000),hrs=Math.floor(ms/3600000),days=Math.floor(ms/86400000);if(mins<60)return`${mins}m ago`;if(hrs<24)return`${hrs}h ago`;if(days<7)return`${days}d ago`;return date.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function getAvatarContent(article){if(article.authorPfp)return`<img src="${article.authorPfp}" alt="${article.author}">`;let letter='A';if(article.authorUsername){letter=article.authorUsername.charAt(0).toUpperCase();}else if(article.author){const atIdx=article.author.indexOf('@');letter=atIdx!==-1&&article.author.length>atIdx+1?article.author.charAt(atIdx+1).toUpperCase():article.author.charAt(0).toUpperCase();}return letter;}

function applyLikeColorFromCard(card,likeBtn){
  const imgEl=card.querySelector('.article-full-img-wrap img');if(!imgEl)return;
  const apply=()=>{window._getImageDominantColor(imgEl,color=>{if(color){likeBtn.querySelector('svg').style.fill=color;likeBtn.querySelector('svg').style.stroke=color;}});};
  if(imgEl.complete&&imgEl.naturalWidth>0)apply();else imgEl.addEventListener('load',apply,{once:true});
}

async function handleLike(e){
  const btn=e.currentTarget,id=String(btn.dataset.id),countSpan=btn.querySelector('.like-count');
  if(!currentUser){alert('Please log in to like articles');window.location.href='https://patholytica.com/login';return;}
  if(btn.dataset.processing==='true')return;btn.dataset.processing='true';
  const wasLiked=userLikes.has(id);
  const artIdx=articles.findIndex(a=>String(a.id)===id);
  const prevRealCount=artIdx!==-1?(articles[artIdx].likes||0):0;
  const newCount=wasLiked?Math.max(0,prevRealCount-1):prevRealCount+1;
  if(wasLiked){userLikes.delete(id);btn.classList.remove('liked');btn.querySelector('svg').style.fill='';btn.querySelector('svg').style.stroke='';}
  else{userLikes.add(id);btn.classList.add('liked');const card=btn.closest('.article-card,.mcq-card');if(card)applyLikeColorFromCard(card,btn);}
  countSpan.textContent=formatNumber(newCount);
  const card=btn.closest('.article-card,.mcq-card');if(card){const s=card.querySelector('.stat-item.likes span');if(s)s.textContent=formatNumber(newCount);}
  if(artIdx!==-1)articles[artIdx].likes=newCount;
  try{
    const authOk=await ensureSupabaseAuth();
    if(wasLiked){
      const{error:de}=await supabase.from('likes').delete().eq('article_id',parseInt(id)).eq('user_id',currentUser.user_id);if(de)console.error('[like delete]',de);
      const{error:re}=await supabase.rpc('decrement_likes',{article_id:parseInt(id)});if(re){const{data:fresh}=await supabase.from('articles').select('likes').eq('id',id).single();await supabase.from('articles').update({likes:Math.max(0,(fresh?.likes||1)-1)}).eq('id',id);}
    } else {
      const{error:ie}=await supabase.from('likes').insert([{article_id:parseInt(id),user_id:currentUser.user_id}]);if(ie&&ie.code!=='23505')throw ie;
      const{error:re}=await supabase.rpc('increment_likes',{article_id:parseInt(id)});if(re){const{data:fresh}=await supabase.from('articles').select('likes').eq('id',id).single();await supabase.from('articles').update({likes:(fresh?.likes||0)+1}).eq('id',id);}
    }
  }catch(err){
    console.error('[like]',err);
    if(wasLiked){userLikes.add(id);btn.classList.add('liked');}else{userLikes.delete(id);btn.classList.remove('liked');btn.querySelector('svg').style.fill='';btn.querySelector('svg').style.stroke='';}
    countSpan.textContent=formatNumber(prevRealCount);
    const card=btn.closest('.article-card,.mcq-card');if(card){const s=card.querySelector('.stat-item.likes span');if(s)s.textContent=formatNumber(prevRealCount);}
    if(artIdx!==-1)articles[artIdx].likes=prevRealCount;
  }finally{btn.dataset.processing='false';}
}

/* ─── LOAD ARTICLES ─── */
async function loadArticles(isInitial=true){
  if(isLoading||(!isInitial&&!hasMore))return;isLoading=true;
  try{
    if(isInitial&&anchorArticleId!==null){
      const{data:anchorArt,error:anchorErr}=await supabase.from('articles').select('*').eq('id',anchorArticleId).single();
      if(anchorErr||!anchorArt){anchorArticleId=null;}
      else{const{data:rest}=await supabase.from('articles').select('*').order('created_at',{ascending:false}).lt('created_at',anchorArt.created_at).limit(LIMIT-1);const combined=[anchorArt,...(rest||[])];await enrichAndRender(combined,isInitial);offset=LIMIT;isLoading=false;return;}
    }
    let query=supabase.from('articles').select('*').order('created_at',{ascending:false}).range(offset,offset+LIMIT-1);
    if(filteredArticleIds!==null){
      if(!filteredArticleIds.length){const wrapper=document.getElementById('postsWrapper');wrapper.querySelectorAll('.skeleton-card').forEach(s=>s.remove());wrapper.innerHTML+=`<div class="loading-container" style="height:100vh;scroll-snap-align:start;"><i class="fas fa-inbox" style="font-size:40px;color:var(--accent);opacity:0.4;"></i><div>No articles in selected libraries</div></div>`;isLoading=false;return;}
      query=query.in('id',filteredArticleIds);
    }
    const{data:articlesData,error}=await query;if(error)throw error;
    if(!articlesData||!articlesData.length){if(isInitial){const wrapper=document.getElementById('postsWrapper');wrapper.querySelectorAll('.skeleton-card').forEach(s=>s.remove());wrapper.innerHTML+=`<div class="loading-container" style="height:100vh;scroll-snap-align:start;"><i class="fas fa-inbox" style="font-size:40px;color:var(--accent);opacity:0.4;"></i><div>No articles found</div></div>`;}hasMore=false;isLoading=false;return;}
    if(articlesData.length<LIMIT)hasMore=false;offset+=articlesData.length;
    await enrichAndRender(articlesData,isInitial);isLoading=false;
  }catch(e){console.error('[loadArticles]',e);if(isInitial){const wrapper=document.getElementById('postsWrapper');wrapper.querySelectorAll('.skeleton-card').forEach(s=>s.remove());wrapper.innerHTML+=`<div class="loading-container" style="height:100vh;scroll-snap-align:start;"><i class="fas fa-exclamation-triangle" style="font-size:40px;color:var(--accent);opacity:0.4;"></i><div>Failed to load</div></div>`;}isLoading=false;}
}

async function enrichAndRender(articlesData,isInitial){
  const userIds=[...new Set(articlesData.map(a=>a.firebase_user_id).filter(Boolean))];
  let usersData=[];
  if(userIds.length>0){const{data:users}=await supabase.from('users').select('firebase_uid,username,full_name,pfp,user_id').in('firebase_uid',userIds);usersData=users||[];usersData.forEach(u=>{if(u.firebase_uid&&u.user_id){supaUserIdToFirebaseUid[u.user_id]=u.firebase_uid;firebaseUidToSupaUserId[u.firebase_uid]=u.user_id;}});}
  const articleIds=articlesData.map(a=>a.id);
  const{data:mediaData}=await supabase.from('media').select('*').in('article_id',articleIds).order('display_order',{ascending:true});
  const newArticles=articlesData.map(article=>{const user=usersData.find(u=>u.firebase_uid===article.firebase_user_id);return{...article,author:user?.username?`@${user.username}`:(user?.full_name||'Anonymous'),authorPfp:user?.pfp||null,authorUsername:user?.username||null,authorSupaUserId:user?.user_id||null,media:(mediaData||[]).filter(m=>m.article_id===article.id)};});
  articles=[...articles,...newArticles];
  renderArticles(isInitial);
}

function renderArticles(isInitial=true){
  const wrapper=document.getElementById('postsWrapper');
  if(isInitial){wrapper.querySelectorAll('.skeleton-card').forEach(s=>s.remove());wrapper.querySelectorAll('.article-card,.mcq-card').forEach(c=>c.remove());}
  else{const last=wrapper.lastElementChild;if(last&&last.classList.contains('skeleton-card'))last.remove();}
  const startIndex=isInitial?0:articles.length-LIMIT;
  for(let index=startIndex;index<articles.length;index++){
    const article=articles[index];
    if(isMCQ(article.content)){wrapper.appendChild(buildMCQCard(article,index));}
    else{
      const articleDiv=document.createElement('div');
      articleDiv.className='article-card';articleDiv.dataset.index=index;articleDiv.dataset.articleId=article.id;
      const hasImages=article.media&&article.media.some(m=>m.type==='image');
      if(hasImages)articleDiv.classList.add('has-image');
      const contentDiv=document.createElement('div');contentDiv.className='article-content';
      const paragraphs=(article.content||'No content available').split('\n\n');
      let firstTextEmitted=false;
      paragraphs.forEach((paragraph,pIndex)=>{
        if(!paragraph.trim())return;
        const p=document.createElement('div');p.className='content-paragraph';p.innerHTML=renderEmojiText(paragraph.trim());
        const associatedMedia=(article.media||[]).filter(m=>m.display_order===pIndex);
        if(!firstTextEmitted){contentDiv.appendChild(p);firstTextEmitted=true;associatedMedia.filter(m=>m.type==='image'||m.type==='youtube').forEach(m=>contentDiv.appendChild(createMediaElement(m,true)));}
        else{associatedMedia.filter(m=>m.type==='image'||m.type==='youtube').forEach(m=>contentDiv.appendChild(createMediaElement(m,true)));contentDiv.appendChild(p);}
      });
      if(article.media){article.media.filter(m=>m.display_order>=paragraphs.length||(m.type!=='image'&&m.type!=='youtube')).forEach(m=>contentDiv.appendChild(createMediaElement(m,m.type==='image'||m.type==='youtube')));}
      const isLiked=userLikes.has(String(article.id));
      articleDiv.innerHTML=`
        <div class="article-header">${buildAuthorHeader(article)}</div>
        <div class="article-title">${renderEmojiText(article.title||'Untitled')}</div>
        <div class="article-stats"><div class="stat-item views"><i class="fas fa-eye"></i><span>${formatNumber(article.views||0)}</span></div><div class="stat-item likes"><i class="fas fa-heart"></i><span>${formatNumber(article.likes||0)}</span></div></div>
        <div class="action-buttons">
          ${buildEditBtn(article)}
          <button class="action-btn like-btn ${isLiked?'liked':''}" data-id="${article.id}"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><span class="like-count">${formatNumber(article.likes||0)}</span></button>
          <button class="action-btn comment-btn" data-id="${article.id}"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg><span class="comment-count">0</span></button>
          <button class="action-btn share-btn" data-id="${article.id}" data-title="${(article.title||'').replace(/"/g,'&quot;')}"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg><span>Share</span></button>
        </div>`;
      articleDiv.querySelector('.article-stats').insertAdjacentElement('afterend',contentDiv);
      wrapper.appendChild(articleDiv);
      setupDoubleTap(articleDiv,article.id);
      if(isLiked&&hasImages){const likeBtn=articleDiv.querySelector('.like-btn');setTimeout(()=>{applyLikeColorFromCard(articleDiv,likeBtn);},200);}
    }
  }
  if(hasMore){const skDiv=document.createElement('div');skDiv.className='skeleton-card';skDiv.innerHTML=skeletonCardHTML();wrapper.appendChild(skDiv);}
  document.querySelectorAll('.like-btn').forEach(btn=>btn.addEventListener('click',handleLike));
  document.querySelectorAll('.comment-btn').forEach(btn=>btn.addEventListener('click',handleComments));
  document.querySelectorAll('.share-btn').forEach(btn=>btn.addEventListener('click',()=>shareArticle(btn.dataset.id,btn.dataset.title)));
  updateFollowButtons();
  if(isInitial){document.getElementById('postsWrapper').addEventListener('scroll',handleScroll);loadCommentCounts();setupIntersectionObserver();}
  else{setupIntersectionObserverForNew(startIndex);loadCommentCounts();}
}

/* intersection observers */
function setupIntersectionObserver(){const obs=new IntersectionObserver((entries)=>{entries.forEach(entry=>{const id=entry.target.dataset.articleId;if(!id)return;if(entry.isIntersecting&&entry.intersectionRatio>=0.75)startViewTimer(id);else clearViewTimer(id);});},{threshold:[0.75]});document.querySelectorAll('.article-card,.mcq-card').forEach(c=>{if(c.dataset.articleId)obs.observe(c);});}
function setupIntersectionObserverForNew(startIndex){const obs=new IntersectionObserver((entries)=>{entries.forEach(entry=>{const id=entry.target.dataset.articleId;if(!id)return;if(entry.isIntersecting&&entry.intersectionRatio>=0.75)startViewTimer(id);else clearViewTimer(id);});},{threshold:[0.75]});document.querySelectorAll('.article-card,.mcq-card').forEach(c=>{if(c.dataset.index>=startIndex&&c.dataset.articleId)obs.observe(c);});}
function startViewTimer(id){if(viewedArticles.has(id)||viewTimers[id])return;viewTimers[id]=setTimeout(async()=>{await incrementView(id);},5000);}
function clearViewTimer(id){if(viewTimers[id]){clearTimeout(viewTimers[id]);delete viewTimers[id];}}
async function incrementView(id){
  if(viewedArticles.has(id))return;
  try{viewedArticles.add(id);const{data:a}=await supabase.from('articles').select('views').eq('id',id).single();const nv=(a.views||0)+1;await supabase.from('articles').update({views:nv}).eq('id',id);const idx=articles.findIndex(a=>a.id===id);if(idx!==-1)articles[idx].views=nv;const card=document.querySelector(`.article-card[data-article-id="${id}"],.mcq-card[data-article-id="${id}"]`);if(card){const s=card.querySelector('.stat-item.views span');if(s)s.textContent=formatNumber(nv);}}catch(e){viewedArticles.delete(id);}
}

/* comments */
async function loadCommentCounts(){try{const{data:comments}=await supabase.from('comments').select('article_id');const counts={};(comments||[]).forEach(c=>{counts[c.article_id]=(counts[c.article_id]||0)+1;});document.querySelectorAll('.comment-btn').forEach(btn=>{btn.querySelector('.comment-count').textContent=counts[btn.dataset.id]||0;});}catch(e){}}

async function handleComments(e){currentArticleId=e.currentTarget.dataset.id;cancelReply();await loadComments(currentArticleId);openComments();}

function renderCommentNode(c,usersMap,isReply=false){
  const u=usersMap[c.user_id];
  const author=u?.username?`@${u.username}`:(u?.full_name||'Anonymous');
  const avatarContent=u?.pfp?`<img src="${u.pfp}" alt="">`:(u?.username||'A')[0].toUpperCase();
  const time=formatDate(new Date(c.created_at));
  const node=document.createElement('div');
  if(isReply){
    node.className='reply-item';
    node.innerHTML=`<div class="reply-avatar">${avatarContent}</div><div class="reply-content"><div class="reply-author">${author}</div><div class="reply-text">${renderEmojiText(c.comment_text)}</div><div class="reply-meta"><span class="reply-time">${time}</span></div></div>`;
  } else {
    node.className='comment-item';node.dataset.commentId=c.id;
    const replyCount=(c.replies||[]).length;
    let repliesHTML=replyCount>0?`<div class="comment-replies" id="replies-${c.id}">`+(c.replies||[]).map(r=>renderCommentNode(r,usersMap,true).outerHTML).join('')+`</div>`:`<div class="comment-replies" id="replies-${c.id}" style="display:none;"></div>`;
    node.innerHTML=`<div class="comment-avatar">${avatarContent}</div><div class="comment-content"><div class="comment-author">${author}</div><div class="comment-text">${renderEmojiText(c.comment_text)}</div><div class="comment-meta"><span class="comment-time">${time}</span><button class="comment-reply-btn" data-comment-id="${c.id}" data-author="${author}">Reply</button></div>${repliesHTML}</div>`;
    node.querySelector('.comment-reply-btn').addEventListener('click',()=>startReply(c.id,author));
  }
  return node;
}

async function loadComments(articleId){
  const list=document.getElementById('commentsList');
  if(!list.children.length||list.querySelector('.no-comments')){list.innerHTML='<div class="loading-container"><div class="spinner" style="width:28px;height:28px;border-width:2px;"></div></div>';}
  try{
    const{data:topComments}=await supabase.from('comments').select('*').eq('article_id',articleId).is('parent_comment_id',null).order('created_at',{ascending:true});
    if(!topComments||!topComments.length){list.innerHTML=`<div class="no-comments"><i class="fas fa-comments"></i><div>No comments yet</div><div style="font-size:11px;">Be the first to comment!</div></div>`;return;}
    const topIds=topComments.map(c=>c.id);
    const{data:replies}=await supabase.from('comments').select('*').in('parent_comment_id',topIds).order('created_at',{ascending:true});
    const allComments=[...topComments,...(replies||[])];
    const uids=[...new Set(allComments.map(c=>c.user_id).filter(Boolean))];let usersMap={};
    if(uids.length>0){const{data:users}=await supabase.from('users').select('user_id,username,full_name,pfp').in('user_id',uids);if(users)users.forEach(u=>{usersMap[u.user_id]=u;});}
    topComments.forEach(c=>{c.replies=(replies||[]).filter(r=>r.parent_comment_id===c.id);});
    list.innerHTML='';
    topComments.forEach(c=>list.appendChild(renderCommentNode(c,usersMap,false)));
  }catch(e){list.innerHTML=`<div class="no-comments"><i class="fas fa-exclamation-triangle"></i><div>Failed to load comments</div></div>`;}
}

function startReply(commentId,authorName){replyingToCommentId=commentId;replyingToAuthorName=authorName;const bar=document.getElementById('replyingToBar');document.getElementById('replyingToName').textContent=`Replying to ${authorName}`;bar.classList.add('visible');document.getElementById('commentInput').placeholder=`Reply to ${authorName}…`;document.getElementById('commentInput').focus();}
window.cancelReply=function(){replyingToCommentId=null;replyingToAuthorName=null;document.getElementById('replyingToBar').classList.remove('visible');document.getElementById('commentInput').placeholder='Add a comment…';};

window.openComments=()=>{document.getElementById('commentsPopup').classList.add('active');document.getElementById('commentsOverlay').classList.add('active');document.body.style.overflow='hidden';};
window.closeComments=()=>{document.getElementById('commentsPopup').classList.remove('active');document.getElementById('commentsOverlay').classList.remove('active');document.body.style.overflow='';cancelReply();};

window.sendComment=async function(){
  const input=document.getElementById('commentInput'),text=input.value.trim();
  if(!text||!currentArticleId)return;
  const sendBtn=document.getElementById('sendCommentBtn');sendBtn.disabled=true;
  const isReply=!!replyingToCommentId,parentId=replyingToCommentId;
  if(!currentUser)currentUser=await getCurrentUser();
  if(!currentUser){window.location.href='https://patholytica.com/login';sendBtn.disabled=false;return;}
  input.value='';cancelReply();
  const tempId='temp-'+Date.now();
  const list=document.getElementById('commentsList');
  const noC=list.querySelector('.no-comments');if(noC)noC.remove();
  const authorName=currentUser.username?`@${currentUser.username}`:'You';
  const avatarContent=(currentUser.username||'Y')[0].toUpperCase();
  if(isReply){
    const rc=document.getElementById(`replies-${parentId}`);
    if(rc){rc.style.display='';const rel=document.createElement('div');rel.className='reply-item';rel.id=tempId;rel.style.opacity='0.5';rel.innerHTML=`<div class="reply-avatar">${avatarContent}</div><div class="reply-content"><div class="reply-author">${authorName}</div><div class="reply-text">${renderEmojiText(text)}</div><div class="reply-meta"><span class="reply-time">Sending…</span></div></div>`;rc.appendChild(rel);}
  } else {
    const cel=document.createElement('div');cel.className='comment-item';cel.id=tempId;cel.style.opacity='0.5';
    cel.innerHTML=`<div class="comment-avatar">${avatarContent}</div><div class="comment-content"><div class="comment-author">${authorName}</div><div class="comment-text">${renderEmojiText(text)}</div><div class="comment-meta"><span class="comment-time">Sending…</span></div><div class="comment-replies" style="display:none;"></div></div>`;
    list.appendChild(cel);
  }
  const cb=document.querySelector(`.comment-btn[data-id="${currentArticleId}"]`);if(cb){const cs=cb.querySelector('.comment-count');cs.textContent=parseInt(cs.textContent||0)+1;}
  try{
    const authOk=await ensureSupabaseAuth();
    const insertPayload={article_id:currentArticleId,user_id:currentUser.user_id,comment_text:text};
    if(isReply)insertPayload.parent_comment_id=parentId;
    const{data:newComment,error}=await supabase.from('comments').insert([insertPayload]).select().single();
    if(error)throw error;
    const tempEl=document.getElementById(tempId);
    if(tempEl){tempEl.style.opacity='1';const timeEl=tempEl.querySelector('.comment-time,.reply-time');if(timeEl)timeEl.textContent=formatDate(new Date(newComment.created_at));}
    if(!isReply){
      const replyBtn=document.createElement('button');replyBtn.className='comment-reply-btn';replyBtn.textContent='Reply';replyBtn.addEventListener('click',()=>startReply(newComment.id,authorName));
      const meta=tempEl?.querySelector('.comment-meta');if(meta)meta.appendChild(replyBtn);
      const rc=tempEl?.querySelector('.comment-replies');if(rc)rc.id=`replies-${newComment.id}`;
    }
  }catch(err){const tempEl=document.getElementById(tempId);if(tempEl)tempEl.remove();if(cb){const cs=cb.querySelector('.comment-count');cs.textContent=Math.max(0,parseInt(cs.textContent||1)-1);}alert('Failed to post comment.');}
  finally{sendBtn.disabled=false;}
};

document.getElementById('commentInput').addEventListener('keypress',e=>{if(e.key==='Enter')window.sendComment();});
function handleScroll(e){const c=e.target;if(c.scrollTop+c.clientHeight>=c.scrollHeight*0.8&&hasMore&&!isLoading)loadArticles(false);}

/* expose anchorArticleId and offset for explore */
window._feedState={get anchorArticleId(){return anchorArticleId;},set anchorArticleId(v){anchorArticleId=v;},get filteredArticleIds(){return filteredArticleIds;},set filteredArticleIds(v){filteredArticleIds=v;},get articles(){return articles;},set articles(v){articles=v;},get offset(){return offset;},set offset(v){offset=v;},get hasMore(){return hasMore;},set hasMore(v){hasMore=v;},get isLoading(){return isLoading;},set isLoading(v){isLoading=v;}};

initLibraryPicker();
</script>
