<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Random Image</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #img {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    object-fit: cover;
    display: none;
    cursor: pointer;
  }
  #status {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #888;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 14px;
    letter-spacing: 0.05em;
    cursor: pointer;
  }
  #hint {
    position: fixed;
    bottom: 16px;
    right: 16px;
    color: rgba(255,255,255,0.4);
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 12px;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="status">loading…</div>
  <img id="img" alt="Random image">
  <div id="hint">click for another</div>

<script>
  const img = document.getElementById('img');
  const status = document.getElementById('status');

  async function loadRandomImage() {
    img.style.display = 'none';
    status.style.display = 'block';
    status.textContent = 'loading…';

    for (let attempt = 0; attempt < 10; attempt++) {
      try {
        const res = await fetch('https://en.wikipedia.org/api/rest_v1/page/random/summary');
        if (!res.ok) continue;
        const data = await res.json();
        const src = (data.originalimage && data.originalimage.source)
                 || (data.thumbnail && data.thumbnail.source);
        if (src) {
          await setImage(src);
          return;
        }
      } catch (e) {
        // network hiccup, try again
      }
    }
    status.textContent = 'having trouble — click to retry';
  }

  function setImage(src) {
    return new Promise((resolve, reject) => {
      const test = new Image();
      test.onload = () => {
        img.src = src;
        status.style.display = 'none';
        img.style.display = 'block';
        resolve();
      };
      test.onerror = reject;
      test.src = src;
    });
  }

  img.addEventListener('click', loadRandomImage);
  status.addEventListener('click', loadRandomImage);

  loadRandomImage();
</script>
</body>
</html>
