<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Patholytica — Home</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg-color: #121212;
  --text-primary: #fff;
  --text-secondary: #888;
  --card-bg: #1a1a1a;
  --hover-bg: #1f1f1f;
  --border-color: #2a2a2a;
  --accent: #a78bfa;
  --accent-dim: rgba(167,139,250,0.12);
  --accent-border: rgba(167,139,250,0.28);
  --accent-glow: rgba(167,139,250,0.18);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  min-height: 100%;
  font-family: "DM Sans", Arial, sans-serif;
  overflow-x: hidden; max-width: 100vw;
}
body { background: var(--bg-color); color: var(--text-primary); }

/* ── Header ── */
.header-wrapper {
  position: fixed; top: 0; left: 0; right: 0;
  background: rgba(18,18,18,0.92);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  padding-top: env(safe-area-inset-top);
  border-bottom: 1px solid var(--border-color);
  z-index: 40;
}
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 24px;
}
.logo-img { height: 28px; width: auto; cursor: pointer; }
.header-actions { display: flex; align-items: center; gap: 10px; }
.auth-buttons { display: none; gap: 12px; }
.auth-buttons.show { display: flex; }
.btn-login {
  padding: 7px 18px; border-radius: 20px; font-size: 13px; font-weight: 600;
  cursor: pointer; text-decoration: none;
  border: 1px solid var(--accent-border); background: var(--accent-dim); color: var(--accent);
  transition: background 0.2s ease, border-color 0.2s ease;
}
.btn-login:hover { background: rgba(167,139,250,0.2); border-color: var(--accent); }
.user-welcome { display: none; align-items: center; gap: 10px; font-size: 14px; position: relative; }
.user-welcome.show { display: flex; }
.welcome-text { font-weight: 600; cursor: pointer; color: var(--text-secondary); transition: color 0.2s ease; font-size: 13px; }
.welcome-text:hover { color: var(--accent); }
.header-icon-btn {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 50%;
  background: none; border: 1px solid var(--border-color);
  color: var(--text-secondary); font-size: 13px;
  cursor: pointer; transition: background 0.2s ease, color 0.2s ease;
  flex-shrink: 0; position: relative;
}
.header-icon-btn:hover { background: var(--hover-bg); color: var(--text-primary); }
.header-icon-btn.accent {
  background: var(--accent-dim);
  border-color: var(--accent-border);
  color: var(--accent);
}
.header-icon-btn.accent:hover { background: rgba(167,139,250,0.22); border-color: var(--accent); }
.header-icon-btn.hidden { display: none; }
.header-icon-btn.show { display: flex; }

.notif-badge {
  position: absolute; top: -4px; right: -4px;
  background: #ef4444; color: #fff;
  font-size: 9px; font-weight: 700;
  width: 16px; height: 16px; border-radius: 50%;
  display: none; align-items: center; justify-content: center;
  border: 2px solid var(--bg-color); pointer-events: none;
}
.notif-badge.show { display: flex; }

.notif-panel {
  display: none; flex-direction: column;
  position: fixed; top: calc(56px + env(safe-area-inset-top)); right: 12px;
  width: 320px; max-width: calc(100vw - 24px);
  max-height: 480px;
  background: #181818; border: 1px solid var(--border-color);
  border-radius: 16px; box-shadow: 0 16px 48px rgba(0,0,0,0.8);
  z-index: 300; overflow: hidden;
}
.notif-panel.show { display: flex; }
.notif-panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 10px; border-bottom: 1px solid var(--border-color);
  flex-shrink: 0;
}
.notif-panel-title { font-size: 14px; font-weight: 700; }
.notif-mark-all {
  font-size: 11px; font-weight: 600; color: var(--accent);
  background: none; border: none; cursor: pointer; padding: 0;
  font-family: "DM Sans", sans-serif; transition: opacity 0.2s ease;
}
.notif-mark-all:hover { opacity: 0.7; }
.notif-list { flex: 1; overflow-y: auto; }
.notif-list::-webkit-scrollbar { width: 3px; }
.notif-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
.notif-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 16px; border-bottom: 1px solid rgba(42,42,42,0.6);
  cursor: pointer; transition: background 0.15s ease; position: relative;
}
.notif-item:hover { background: var(--hover-bg); }
.notif-item.unread { background: rgba(167,139,250,0.04); }
.notif-item.unread::before {
  content: ''; position: absolute; left: 6px; top: 50%; transform: translateY(-50%);
  width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
}
.notif-icon {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 13px;
}
.notif-icon.like    { background: rgba(239,68,68,0.15);   color: #ef4444; }
.notif-icon.comment { background: rgba(96,165,250,0.15);  color: #60a5fa; }
.notif-icon.follow  { background: var(--accent-dim); color: var(--accent); }
.notif-icon.article { background: rgba(74,222,128,0.15);  color: #4ade80; }
.notif-text { flex: 1; min-width: 0; }
.notif-msg  { font-size: 13px; line-height: 1.4; color: var(--text-primary); }
.notif-time { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.notif-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 40px 20px; color: var(--text-secondary);
}
.notif-empty i { font-size: 32px; opacity: 0.3; }
.notif-empty p { font-size: 13px; opacity: 0.6; margin: 0; }
.notif-spinner-wrap { padding: 24px; display: flex; justify-content: center; }
.notif-spinner {
  width: 22px; height: 22px;
  border: 2px solid var(--border-color); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.header-popup {
  display: none; position: absolute; top: calc(100% + 10px); right: 0;
  background: #1e1e1e; border: 1px solid var(--border-color);
  border-radius: 12px; padding: 6px; min-width: 160px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.7);
  z-index: 200; flex-direction: column; gap: 2px;
}
.header-popup.show { display: flex; }
.popup-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: 8px;
  font-size: 14px; font-weight: 500; cursor: pointer;
  color: var(--text-primary); transition: background 0.2s ease; white-space: nowrap;
}
.popup-item:hover { background: var(--hover-bg); }
.popup-item i { font-size: 13px; width: 14px; text-align: center; color: var(--text-secondary); }
.popup-danger { color: #ff6b6b; }
.popup-danger i { color: #ff6b6b; }
.popup-divider { height: 1px; background: var(--border-color); margin: 4px 0; }

/* ── Main container ── */
.list-container {
  max-width: 960px; width: 100%; margin: 0 auto;
  padding: 16px 20px 120px;
  padding-top: calc(65px + env(safe-area-inset-top) + 16px);
}

/* ── Hero search bar ── */
.hero-search {
  margin-bottom: 28px;
}
.hero-title {
  font-size: 22px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.3px;
}
.hero-title span { color: var(--accent); }
.hero-sub {
  font-size: 13px; color: var(--text-secondary); margin-bottom: 14px;
}
.library-entry {
  display: flex; align-items: center; gap: 10px;
}
.library-id-input {
  flex: 1; min-width: 120px;
  background: #1a1a1a; border: 1px solid var(--border-color);
  border-radius: 12px; color: var(--text-primary);
  font-size: 14px; padding: 11px 16px; outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
  -moz-appearance: textfield; font-family: "DM Sans", sans-serif;
}
.library-id-input::-webkit-outer-spin-button,
.library-id-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.library-id-input::placeholder { color: var(--text-secondary); opacity: 0.5; }
.library-id-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
.library-id-input.error { border-color: #ff6b6b; box-shadow: 0 0 0 3px rgba(255,107,107,0.15); }
.btn-start {
  padding: 11px 22px; border-radius: 12px;
  background: var(--accent); color: #0e0a1f;
  border: none; font-size: 13px; font-weight: 700;
  cursor: pointer; white-space: nowrap;
  font-family: "DM Sans", sans-serif;
  transition: opacity 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
  box-shadow: 0 4px 20px rgba(167,139,250,0.35);
}
.btn-start:hover { opacity: 0.88; transform: translateY(-1px); box-shadow: 0 6px 24px rgba(167,139,250,0.45); }
.btn-start:active { transform: scale(0.97); }
.btn-start:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

/* ── Library banner ── */
.library-banner {
  display: none; background: #181818;
  border: 1px solid var(--accent-border); border-radius: 14px;
  padding: 14px 18px; margin-top: 12px;
  gap: 14px; align-items: flex-start;
  box-shadow: 0 0 0 1px var(--accent-glow);
}
.library-banner.show { display: flex; }
.library-banner-thumb {
  width: 48px; height: 48px; border-radius: 10px; overflow: hidden; flex-shrink: 0;
  background: var(--accent-dim); border: 1px solid var(--accent-border);
  display: flex; align-items: center; justify-content: center;
  color: var(--accent); font-size: 18px;
}
.library-banner-thumb img { width: 100%; height: 100%; object-fit: cover; }
.library-banner-info { flex: 1; min-width: 0; }
.library-banner-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.library-banner-meta { font-size: 12px; color: var(--text-secondary); display: flex; flex-wrap: wrap; gap: 6px 12px; }
.library-banner-meta span { display: flex; align-items: center; gap: 5px; }
.library-banner-meta i { font-size: 11px; opacity: 0.7; }
.library-banner-clear { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 14px; padding: 4px; border-radius: 50%; transition: color 0.2s ease; flex-shrink: 0; }
.library-banner-clear:hover { color: var(--text-primary); }
.banner-open-btn {
  display: inline-flex; align-items: center; gap: 5px;
  margin-top: 8px; padding: 5px 14px; border-radius: 20px;
  background: var(--accent-dim); border: 1px solid var(--accent-border);
  color: var(--accent); font-size: 12px; font-weight: 700; cursor: pointer;
  transition: background 0.2s ease;
}
.banner-open-btn:hover { background: rgba(167,139,250,0.22); }

/* ── Creators ── */
.section-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1.8px;
  color: var(--text-secondary); margin-bottom: 10px; opacity: 0.55; font-weight: 700;
}
.creators-section { margin-bottom: 28px; }
.creators-strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.creators-strip::-webkit-scrollbar { display: none; }
.creator-pill {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px 8px 8px; border-radius: 40px;
  background: #1a1a1a; border: 1px solid var(--border-color);
  cursor: pointer; transition: border-color 0.2s ease, background 0.2s ease;
  white-space: nowrap; flex-shrink: 0;
}
.creator-pill:hover { border-color: var(--accent-border); background: #1f1f1f; }
.creator-pill:nth-child(1) { border-color: rgba(167,139,250,0.35); }
.creator-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--accent-dim); border: 1.5px solid var(--accent-border);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: var(--accent);
  flex-shrink: 0; text-transform: uppercase; overflow: hidden;
}
.creator-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.creator-pill-name { font-size: 13px; font-weight: 600; }
.creator-pill-count { font-size: 11px; color: var(--text-secondary); margin-left: 2px; }
.creator-pill-rank { font-size: 13px; margin-left: 2px; }
.creator-skeleton { display: flex; align-items: center; gap: 12px; padding: 8px 10px; }
.skel-circle { width: 30px; height: 30px; border-radius: 50%; background: #2a2a2a; flex-shrink: 0; animation: shimmer 1.4s infinite; }
.skel-line   { height: 11px; border-radius: 6px; background: #2a2a2a; animation: shimmer 1.4s infinite; }

/* ── Libraries heading ── */
.libraries-heading {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; margin-top: 4px;
}
.libraries-heading .section-label { margin-bottom: 0; }
.lib-count-pill {
  font-size: 11px; font-weight: 700; color: var(--accent);
  background: var(--accent-dim); border: 1px solid var(--accent-border);
  border-radius: 20px; padding: 3px 11px; letter-spacing: 0.03em;
}

/* ── Section dividers ── */
.fav-section-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px; margin-top: 4px;
}
.fav-section-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 2px;
  font-weight: 700; color: var(--accent); white-space: nowrap;
}
.fav-section-line {
  flex: 1; height: 1px;
  background: linear-gradient(to right, var(--accent-border), transparent);
}
.all-section-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px; margin-top: 24px;
}
.all-section-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 2px;
  font-weight: 600; color: var(--text-secondary); opacity: 0.45; white-space: nowrap;
}
.all-section-line { flex: 1; height: 1px; background: var(--border-color); }

/* ══════════════════════════════════
   MOVIE-SHELF LAYOUT
══════════════════════════════════ */
.shelf-row {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 16px;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
}
.shelf-row::-webkit-scrollbar { height: 3px; }
.shelf-row::-webkit-scrollbar-track { background: transparent; }
.shelf-row::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

/* Movie poster card */
.movie-card {
  flex-shrink: 0;
  width: 150px;
  scroll-snap-align: start;
  cursor: pointer;
  position: relative;
  border-radius: 12px;
  overflow: visible;
  transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
}
.movie-card:hover { transform: translateY(-6px) scale(1.03); z-index: 2; }

.movie-poster {
  width: 150px; height: 220px;
  border-radius: 12px; overflow: hidden; position: relative;
  background: linear-gradient(135deg, #1e1a2e 0%, #12121e 100%);
  border: 1px solid var(--border-color);
  box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  transition: box-shadow 0.22s ease, border-color 0.22s ease;
}
.movie-card:hover .movie-poster {
  box-shadow: 0 16px 40px rgba(0,0,0,0.75), 0 0 0 1px var(--accent-border), 0 0 24px var(--accent-glow);
  border-color: var(--accent-border);
}
.movie-poster img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.3s ease;
}
.movie-card:hover .movie-poster img { transform: scale(1.06); }

/* Poster placeholder */
.poster-placeholder {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 10px;
  background: linear-gradient(160deg, #1e1a2e 0%, #0e0c1a 100%);
}
.poster-placeholder-icon {
  font-size: 32px; color: rgba(167,139,250,0.25);
}
.poster-placeholder-letter {
  font-size: 28px; font-weight: 800;
  color: rgba(167,139,250,0.18);
  letter-spacing: -1px;
  font-family: "Merriweather", serif;
}

/* Overlay gradient + info */
.movie-poster-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(10,8,20,0.98) 0%, rgba(10,8,20,0.55) 40%, transparent 70%);
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 10px;
}
.movie-poster-count {
  display: inline-flex; align-items: center; gap: 4px;
  background: rgba(167,139,250,0.18); border: 1px solid rgba(167,139,250,0.28);
  backdrop-filter: blur(6px);
  border-radius: 6px; padding: 3px 7px;
  font-size: 10px; font-weight: 700; color: var(--accent);
  align-self: flex-start; margin-bottom: 5px; letter-spacing: 0.03em;
}

/* Saved ribbon on poster */
.movie-saved-ribbon {
  position: absolute; top: 8px; right: 8px;
  background: rgba(10,8,20,0.82); border: 1px solid var(--accent-border);
  backdrop-filter: blur(6px);
  border-radius: 20px; padding: 3px 8px;
  font-size: 10px; font-weight: 700; color: var(--accent);
  display: none; align-items: center; gap: 4px;
}
.movie-saved-ribbon.show { display: flex; }

/* Card info below poster */
.movie-info { padding: 8px 2px 0; }
.movie-title {
  font-size: 13px; font-weight: 700; line-height: 1.3;
  color: var(--text-primary);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  margin-bottom: 4px;
  transition: color 0.2s ease;
}
.movie-card:hover .movie-title { color: var(--accent); }
.movie-creator-row {
  display: flex; align-items: center; gap: 5px;
}
.movie-creator-dot {
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--accent-dim); border: 1px solid var(--accent-border);
  display: flex; align-items: center; justify-content: center;
  font-size: 8px; font-weight: 700; color: var(--accent);
  overflow: hidden; flex-shrink: 0; text-transform: uppercase;
}
.movie-creator-dot img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.movie-creator-name { font-size: 11px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Action row below card */
.movie-actions {
  display: flex; align-items: center; gap: 6px;
  margin-top: 8px;
}
.movie-act-btn {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px;
  padding: 6px 0; border-radius: 8px; font-size: 11px; font-weight: 700;
  cursor: pointer; border: 1px solid var(--border-color);
  background: #1a1a1a; color: var(--text-secondary);
  font-family: "DM Sans", sans-serif;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.movie-act-btn:hover { background: var(--hover-bg); color: var(--text-primary); }
.movie-act-btn.primary {
  background: var(--accent-dim); border-color: var(--accent-border); color: var(--accent);
}
.movie-act-btn.primary:hover { background: rgba(167,139,250,0.22); }

/* Fav btn states */
.movie-act-btn.fav-btn.faved {
  border-color: rgba(239,68,68,0.35); color: #ef4444; background: rgba(239,68,68,0.06);
}
.heart-svg {
  width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round; display: block;
  transition: fill 0.2s ease, stroke 0.2s ease;
}
.movie-act-btn.fav-btn.faved .heart-svg { fill: #ef4444; stroke: #ef4444; }
@keyframes favPop {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.5); }
  65%  { transform: scale(0.85); }
  100% { transform: scale(1); }
}
.movie-act-btn.fav-btn.popping .btn-icon { animation: favPop 0.38s cubic-bezier(0.34,1.56,0.64,1) forwards; }

/* Skeleton */
.movie-card-skeleton { flex-shrink: 0; width: 150px; }
.skel-poster { width: 150px; height: 220px; border-radius: 12px; background: #1a1a1a; animation: shimmer 1.4s infinite; }
.skel-info { padding: 8px 2px 0; display: flex; flex-direction: column; gap: 6px; }
@keyframes shimmer { 0%,100%{opacity:0.4} 50%{opacity:0.85} }

/* ── Deck Preview Modal ── */
.deck-modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  align-items: flex-end; justify-content: center;
}
.deck-modal-overlay.show { display: flex; }
.deck-modal {
  width: 100%; max-width: 480px;
  background: #141414; border-radius: 24px 24px 0 0;
  border: 1px solid var(--border-color); border-bottom: none;
  display: flex; flex-direction: column;
  max-height: 88vh; overflow: hidden;
  animation: slideUp 0.32s cubic-bezier(0.4,0,0.2,1);
}
@keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.deck-modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 12px; border-bottom: 1px solid var(--border-color); flex-shrink: 0;
}
.deck-modal-title-block { flex: 1; min-width: 0; }

<script>
window.escHtml = function(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; };

function closeCreatePopup() { document.getElementById('createPopup').classList.remove('show'); }

/* Pong */
var pongRunning = false, pongInitialized = false;
function openPong() {
  document.getElementById('pongOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
  if (!pongInitialized) { initPong(); pongInitialized = true; }
}
function closePong() {
  document.getElementById('pongOverlay').classList.remove('show');
  document.body.style.overflow = ''; pongRunning = false;
}
document.getElementById('pongOverlay').addEventListener('click', function(e) { if (e.target === this) closePong(); });

function initPong() {
  const canvas = document.getElementById('pongCanvas'), ctx = canvas.getContext('2d');
  function resize() { const mw = Math.min(480, window.innerWidth - 80); canvas.width = mw; canvas.height = Math.round(mw * (200/480)); }
  resize(); window.addEventListener('resize', () => { resize(); resetPos(); });
  const ACCENT = '#a78bfa', PAD_W = 8, PAD_H_R = 0.22, BALL_R = 5, AI_S = 0.035;
  let W, H, padH, pY, aY, bX, bY, bVX, bVY, pScore = 0, aScore = 0, spd;
  function dims() { W = canvas.width; H = canvas.height; padH = Math.round(H * PAD_H_R); spd = W * 0.012; }
  function resetPos() {
    dims(); pY = aY = (H - padH) / 2; bX = W/2; bY = H/2;
    const ang = (Math.random()*0.6 - 0.3) + (Math.random() > 0.5 ? 0 : Math.PI);
    bVX = Math.cos(ang)*spd; bVY = Math.sin(ang)*spd;
    if (Math.abs(bVX) < spd*0.5) bVX = bVX < 0 ? -spd*0.7 : spd*0.7;
  }
  function draw() {
    ctx.clearRect(0,0,W,H);
    ctx.setLineDash([6,8]); ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = ACCENT; ctx.beginPath(); ctx.roundRect(4,pY,PAD_W,padH,4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.roundRect(W-4-PAD_W,aY,PAD_W,padH,4); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(bX,bY,BALL_R,0,Math.PI*2); ctx.fill();
  }
  function update() {
    if (!pongRunning) return;
    bX += bVX; bY += bVY;
    if (bY-BALL_R <= 0) { bY = BALL_R; bVY = Math.abs(bVY); }
    if (bY+BALL_R >= H) { bY = H-BALL_R; bVY = -Math.abs(bVY); }
    const am = H*AI_S, ac = aY+padH/2;
    if (ac < bY-4) aY = Math.min(H-padH, aY+am);
    else if (ac > bY+4) aY = Math.max(0, aY-am);
    if (bX-BALL_R<=4+PAD_W && bX-BALL_R>=2 && bY>=pY && bY<=pY+padH) {
      bX = 4+PAD_W+BALL_R;
      const h=(bY-(pY+padH/2))/(padH/2), s=Math.sqrt(bVX*bVX+bVY*bVY)*1.04;
      bVX = Math.abs(Math.cos(h*0.9)*s); bVY = Math.sin(h*0.9)*s;
    }
    if (bX+BALL_R>=W-4-PAD_W && bX+BALL_R<=W-2 && bY>=aY && bY<=aY+padH) {
      bX = W-4-PAD_W-BALL_R;
      const h=(bY-(aY+padH/2))/(padH/2), s=Math.sqrt(bVX*bVX+bVY*bVY)*1.02;
      bVX = -Math.abs(Math.cos(h*0.9)*s); bVY = Math.sin(h*0.9)*s;
    }
    if (bX-BALL_R <= 0) {
      aScore++; document.getElementById('aiScore').textContent = aScore;
      if (aScore >= 12) { pongRunning=false; document.getElementById('pongHint').textContent='AI wins! Tap to play again.'; pScore=0;aScore=0;document.getElementById('playerScore').textContent=0;document.getElementById('aiScore').textContent=0;resetPos();return; }
      resetPos();
    }
    if (bX+BALL_R >= W) {
      pScore++; document.getElementById('playerScore').textContent = pScore;
      if (pScore >= 12) { pongRunning=false; document.getElementById('pongHint').textContent='You win! Tap to play again.'; pScore=0;aScore=0;document.getElementById('playerScore').textContent=0;document.getElementById('aiScore').textContent=0;resetPos();return; }
      resetPos();
    }
  }
  function loop() { update(); draw(); requestAnimationFrame(loop); }
  function start() { if (pongRunning) return; pongRunning=true; document.getElementById('pongHint').textContent='Mouse / drag to move your paddle'; requestAnimationFrame(loop); }
  canvas.addEventListener('mousemove', e => { const r=canvas.getBoundingClientRect(); pY=Math.max(0,Math.min(H-padH,e.clientY-r.top-padH/2)); });
  canvas.addEventListener('touchmove', e => { e.preventDefault(); const r=canvas.getBoundingClientRect(); pY=Math.max(0,Math.min(H-padH,e.touches[0].clientY-r.top-padH/2)); }, {passive:false});
  canvas.addEventListener('click', start);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); start(); }, {passive:false});
  resetPos(); draw();
}
</script>

const HEART_SVG = `<svg class="heart-svg" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;

async function loadUserFavourites() {
  if (!currentSupaUser) return;
  try {
    const { data } = await supabase
      .from('favourite_playlists').select('playlist_id')
      .eq('user_id', currentSupaUser.user_id);
    userFavourites.clear();
    (data || []).forEach(r => userFavourites.add(String(r.playlist_id)));
    updateFavButtons();
  } catch(e) {}
}

function updateFavButtons() {
  document.querySelectorAll('.fav-btn').forEach(btn => {
    const pid   = String(btn.dataset.pid);
    const faved = userFavourites.has(pid);
    const iconWrap = btn.querySelector('.btn-icon');

    btn.classList.toggle('faved', faved);
    if (faved) { iconWrap.innerHTML = BELL_SVG; if (label) label.textContent = 'Saved'; }
    else        { iconWrap.innerHTML = HEART_SVG; if (label) label.textContent = 'Save'; }
    const ribbon = btn.closest('.movie-card')?.querySelector('.movie-saved-ribbon');
    if (ribbon) ribbon.classList.toggle('show', faved);
  });
}

window.toggleFavourite = async function(e, playlistId) {
  e.stopPropagation();
  if (!currentSupaUser) { window.location.href = 'login.html'; return; }
  const pid      = String(playlistId);
  const wasFaved = userFavourites.has(pid);
  if (wasFaved) userFavourites.delete(pid); else userFavourites.add(pid);
  updateFavButtons();
  const btn = document.querySelector(`.fav-btn[data-pid="${pid}"]`);
  if (btn) {
    btn.classList.remove('popping'); void btn.offsetWidth; btn.classList.add('popping');
    btn.addEventListener('animationend', () => btn.classList.remove('popping'), { once: true });
  }
  try {
    if (wasFaved) {
      await supabase.from('favourite_playlists').delete()
        .eq('user_id', currentSupaUser.user_id).eq('playlist_id', parseInt(pid));
    } else {
      await supabase.from('favourite_playlists')
        .insert([{ user_id: currentSupaUser.user_id, playlist_id: parseInt(pid) }]);
    }
  } catch(err) {
    if (wasFaved) userFavourites.add(pid); else userFavourites.delete(pid);
    updateFavButtons();
  }
};

/* NOTIFICATIONS */
function notifIcon(type) {
  if (type === 'like_article' || type === 'like_comment')           return { cls: 'like',    icon: 'fa-heart' };
  if (type === 'comment_on_article' || type === 'reply_to_comment') return { cls: 'comment', icon: 'fa-comment' };
  if (type === 'new_follower')                                      return { cls: 'follow',  icon: 'fa-user-plus' };
  if (type === 'new_article_from_following')                        return { cls: 'article', icon: 'fa-file-alt' };
  return { cls: 'follow', icon: 'fa-bell' };
}
function relTime(dateStr) {
  const ms = Date.now() - new Date(dateStr).getTime();
  const m = Math.floor(ms/60000), h = Math.floor(ms/3600000), d = Math.floor(ms/86400000);
  if (m < 1) return 'just now'; if (m < 60) return `${m}m ago`;
  if (h < 24) return `${h}h ago`; if (d < 7) return `${d}d ago`;
  return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
async function loadNotifications() {
  if (!currentSupaUser) return;
  const list  = document.getElementById('notifList');
  const badge = document.getElementById('notifBadge');
  list.innerHTML = '<div class="notif-spinner-wrap"><div class="notif-spinner"></div></div>';
  try {
    const { data: notifs } = await supabase
      .from('notifications').select('*')
      .eq('recipient_id', currentSupaUser.user_id)
      .order('created_at', { ascending: false }).limit(30);
    if (!notifs || notifs.length === 0) {
      list.innerHTML = `<div class="notif-empty"><i class="fas fa-bell-slash"></i><p>No notifications yet</p></div>`;
      badge.classList.remove('show'); return;
    }
    const unread = notifs.filter(n => !n.is_read).length;
    if (unread > 0) { badge.textContent = unread > 9 ? '9+' : unread; badge.classList.add('show'); }
    else badge.classList.remove('show');
    list.innerHTML = notifs.map(n => {
      const { cls, icon } = notifIcon(n.type);
      let target = '#';
      if (n.article_id) target = `article.html?id=${n.article_id}`;
      else if (n.playlist_id) target = `playlist.html?id=${n.playlist_id}`;
      return `<div class="notif-item ${n.is_read ? '' : 'unread'}" data-id="${n.id}" data-target="${target}" onclick="window._handleNotif(this)">
        <div class="notif-icon ${cls}"><i class="fas ${icon}"></i></div>
        <div class="notif-text">
          <div class="notif-msg">${window.escHtml(n.message || 'New notification')}</div>
          <div class="notif-time">${relTime(n.created_at)}</div>
        </div>
      </div>`;
    }).join('');
  } catch(e) {
    list.innerHTML = `<div class="notif-empty"><i class="fas fa-exclamation-triangle"></i><p>Failed to load</p></div>`;
  }
}
window._handleNotif = async function(el) {
  const id = el.dataset.id, target = el.dataset.target;
  el.classList.remove('unread');
  const unread = document.querySelectorAll('.notif-item.unread').length;
  const badge  = document.getElementById('notifBadge');
  if (unread === 0) badge.classList.remove('show');
  else { badge.textContent = unread > 9 ? '9+' : unread; }
  try { await supabase.from('notifications').update({ is_read: true }).eq('id', id); } catch(e) {}
  if (target && target !== '#') window.location.href = target;
};
document.getElementById('notifMarkAll').addEventListener('click', async function() {
  if (!currentSupaUser) return;
  document.querySelectorAll('.notif-item.unread').forEach(el => el.classList.remove('unread'));
  document.getElementById('notifBadge').classList.remove('show');
  try { await supabase.from('notifications').update({ is_read: true }).eq('recipient_id', currentSupaUser.user_id).eq('is_read', false); } catch(e) {}
});
document.getElementById('notifBellBtn').addEventListener('click', function(e) {
  e.stopPropagation();
  const panel = document.getElementById('notifPanel');
  panel.classList.toggle('show');
  if (panel.classList.contains('show') && currentSupaUser) loadNotifications();
});

/* CREATORS */
async function loadCreators() {
  const el = document.getElementById('creatorsList');
  try {
    const { data: articles } = await supabase.from('articles').select('firebase_user_id');
    if (!articles) { el.innerHTML = ''; return; }
    const counts = {};
    articles.forEach(a => { if (a.firebase_user_id) counts[a.firebase_user_id] = (counts[a.firebase_user_id]||0)+1; });
    const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);
    if (!sorted.length) { el.innerHTML = ''; return; }
    const { data: users } = await supabase.from('users').select('firebase_uid, username, pfp').in('firebase_uid', sorted.map(([u])=>u));
    const um = {};
    if (users) users.forEach(u => { um[u.firebase_uid] = u; });
    const medals = ['🥇','🥈','🥉','',''];
    el.innerHTML = sorted.map(([uid,count],i) => {
      const u = um[uid];
      const name = u?.username ? `@${u.username}` : 'Unknown';
      const init = (u?.username||'?').replace(/^@/,'')[0].toUpperCase();
      const avatarHTML  = u?.pfp ? `<img src="${u.pfp}" alt="${init}">` : init;
      const profileLink = u?.username ? `profile.html?username=${window.escHtml(u.username)}` : '#';
      return `<div class="creator-pill" onclick="window.location.href='${profileLink}'">
        <div class="creator-avatar">${avatarHTML}</div>
        <span class="creator-pill-name">${window.escHtml(name)}</span>
        <span class="creator-pill-count">${count}</span>
        <span class="creator-pill-rank">${medals[i]}</span>
      </div>`;
    }).join('');
  } catch(e) { el.innerHTML = ''; }
}

/* LIBRARIES */
const PAGE_SIZE = 12;
let currentOffset  = 0;
let totalLibraries = 0;

function buildMovieCard(lib, articleCount, creator, isFaved) {
  const card = document.createElement('div');
  card.className = 'movie-card';

  const creatorInit   = (creator?.username||'?').replace(/^@/,'')[0].toUpperCase();
  const creatorAvatar = creator?.pfp
    ? `<img src="${window.escHtml(creator.pfp)}" alt="${creatorInit}">`
    : creatorInit;
  const creatorName = creator?.username ? `@${creator.username}` : 'Unknown';

  const firstLetter = (lib.name||'?')[0].toUpperCase();

  const posterContent = lib.thumbnail_url
    ? `<img src="${window.escHtml(lib.thumbnail_url)}" alt="${window.escHtml(lib.name||'')}" loading="lazy">`
    : `<div class="poster-placeholder">
         <div class="poster-placeholder-letter">${firstLetter}</div>
         <div class="poster-placeholder-icon"><i class="fas fa-book-open"></i></div>
       </div>`;

  card.innerHTML = `
    <div class="movie-poster">
      ${posterContent}
      <div class="movie-poster-overlay">
        <div class="movie-poster-count"><i class="fas fa-layer-group"></i> ${articleCount}</div>
      </div>
      <div class="movie-saved-ribbon ${isFaved ? 'show' : ''}">
        <i class="fas fa-bookmark"></i> Saved
      </div>
    </div>
    <div class="movie-info">
      <div class="movie-title">${window.escHtml(lib.name||'Untitled')}</div>
      <div class="movie-creator-row">
        <div class="movie-creator-dot">${creatorAvatar}</div>
        <span class="movie-creator-name">${window.escHtml(creatorName)}</span>
      </div>
    </div>
    <div class="movie-actions">
      <button class="movie-act-btn fav-btn ${isFaved ? 'faved' : ''}" data-pid="${lib.id}" onclick="toggleFavourite(event,${lib.id})">
        <span class="btn-icon">${isFaved ? BELL_SVG : HEART_SVG}</span>
        <span class="fav-label">${isFaved ? 'Saved' : 'Save'}</span>
      </button>
      <button class="movie-act-btn primary" onclick="event.stopPropagation(); openDeckModal(${lib.id}, ${JSON.stringify(lib.name||'Library')})">
        <i class="fas fa-play"></i>
      </button>
    </div>`;

  card.querySelector('.movie-poster').addEventListener('click', () => openDeckModal(lib.id, lib.name||'Library'));
  card.querySelector('.movie-info').addEventListener('click',   () => openDeckModal(lib.id, lib.name||'Library'));

  return card;
}

function getOrCreateShelf(grid, shelfId) {
  let shelf = document.getElementById(shelfId);
  if (!shelf) {
    shelf = document.createElement('div');
    shelf.className = 'shelf-row';
    shelf.id = shelfId;
    grid.appendChild(shelf);
  }
  return shelf;
}

async function loadLibraries(append = false) {
  const grid         = document.getElementById('librariesGrid');
  const loadMoreWrap = document.getElementById('loadMoreWrap');
  const loadMoreBtn  = document.getElementById('loadMoreBtn');

  if (!append) {
    grid.innerHTML = `<div class="shelf-row" id="skeletonShelf">
      <div class="movie-card-skeleton"><div class="skel-poster"></div><div class="skel-info"><div class="skel-line" style="width:80%;margin-bottom:6px;"></div><div class="skel-line" style="width:50%;"></div></div></div>
      <div class="movie-card-skeleton"><div class="skel-poster"></div><div class="skel-info"><div class="skel-line" style="width:70%;margin-bottom:6px;"></div><div class="skel-line" style="width:40%;"></div></div></div>
      <div class="movie-card-skeleton"><div class="skel-poster"></div><div class="skel-info"><div class="skel-line" style="width:90%;margin-bottom:6px;"></div><div class="skel-line" style="width:55%;"></div></div></div>
      <div class="movie-card-skeleton"><div class="skel-poster"></div><div class="skel-info"><div class="skel-line" style="width:65%;margin-bottom:6px;"></div><div class="skel-line" style="width:35%;"></div></div></div>
    </div>`;
    currentOffset = 0; loadMoreWrap.style.display = 'none';
  }

  try {
    if (!append) {
      const { count } = await supabase.from('playlists').select('*',{count:'exact',head:true});
      totalLibraries = count || 0;
      document.getElementById('libCountBadge').textContent  = totalLibraries;
      document.getElementById('footerLibCount').textContent = totalLibraries;
    }

    const { data: libs, error } = await supabase
      .from('playlists').select('*')
      .order('created_at',{ascending:false})
      .range(currentOffset, currentOffset + PAGE_SIZE - 1);

    if (error) throw error;
    if (!append) grid.innerHTML = '';

    if (!libs || libs.length === 0) {
      if (!append) grid.innerHTML = `<div class="empty-state"><i class="fas fa-book-open"></i><p>No libraries yet</p></div>`;
      loadMoreWrap.style.display = 'none'; return;
    }

    const libIds = libs.map(l => l.id);
    const { data: itemRows } = await supabase.from('playlist_items').select('playlist_id').in('playlist_id', libIds);
    const countMap = {};
    (itemRows||[]).forEach(r => { countMap[r.playlist_id] = (countMap[r.playlist_id]||0)+1; });

    const userIds = [...new Set(libs.map(l=>l.user_id).filter(Boolean))];
    const creatorMap = {};
    if (userIds.length) {
      const { data: creators } = await supabase.from('users').select('user_id, username, pfp').in('user_id', userIds);
      (creators||[]).forEach(c => { creatorMap[c.user_id] = c; });
    }

    const favedLibs = libs.filter(l => userFavourites.has(String(l.id)));
    const otherLibs = libs.filter(l => !userFavourites.has(String(l.id)));

    if (!append && favedLibs.length > 0) {
      const favHeader = document.createElement('div');
      favHeader.className = 'fav-section-header';
      favHeader.innerHTML = `<span class="fav-section-label">Saved</span><div class="fav-section-line"></div>`;
      grid.appendChild(favHeader);

      const favShelf = document.createElement('div');
      favShelf.className = 'shelf-row'; favShelf.id = 'favShelf';
      grid.appendChild(favShelf);
      favedLibs.forEach(lib => favShelf.appendChild(buildMovieCard(lib, countMap[lib.id]||0, creatorMap[lib.user_id]||null, true)));

      if (otherLibs.length > 0) {
        const allHeader = document.createElement('div');
        allHeader.className = 'all-section-header';
        allHeader.innerHTML = `<div class="all-section-line"></div><span class="all-section-label">All Libraries</span><div class="all-section-line"></div>`;
        grid.appendChild(allHeader);
      }

      const allShelf = document.createElement('div');
      allShelf.className = 'shelf-row'; allShelf.id = 'allShelf';
      grid.appendChild(allShelf);
      otherLibs.forEach(lib => allShelf.appendChild(buildMovieCard(lib, countMap[lib.id]||0, creatorMap[lib.user_id]||null, false)));

    } else {
      const shelf = append
        ? (document.getElementById('allShelf') || getOrCreateShelf(grid, 'allShelf'))
        : getOrCreateShelf(grid, 'allShelf');
      libs.forEach(lib => shelf.appendChild(buildMovieCard(lib, countMap[lib.id]||0, creatorMap[lib.user_id]||null, userFavourites.has(String(lib.id)))));
    }

    currentOffset += libs.length;
    if (currentOffset < totalLibraries) {
      loadMoreWrap.style.display = 'block'; loadMoreBtn.disabled = false;
      loadMoreBtn.innerHTML = '<i class="fas fa-chevron-down"></i> Load more';
    } else {
      loadMoreWrap.style.display = 'none';
    }
  } catch(err) {
    grid.innerHTML = `<div class="error-state">Error loading libraries: ${err.message}</div>`;
  }
}

window.loadMoreLibraries = async function() {
  const btn = document.getElementById('loadMoreBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Loading…';
  await loadLibraries(true);
};

/* JUMP */
window.jumpToLibrary = async function() {
  const input = document.getElementById('libraryIdInput');
  const btn   = document.getElementById('startBtn');
  const banner = document.getElementById('libraryBanner');
  const bName  = document.getElementById('libraryBannerName');
  const bMeta  = document.getElementById('libraryBannerMeta');
  const bThumb = document.getElementById('libraryBannerThumb');
  const bOpenBtn = document.getElementById('bannerOpenBtn');
  const val = input.value.trim();
  if (!val || isNaN(val) || parseInt(val) <= 0) {
    input.classList.add('error'); setTimeout(() => input.classList.remove('error'), 1200); input.focus(); return;
  }
  const libraryId = parseInt(val);
  btn.disabled = true; btn.textContent = '…';
  bName.textContent = 'Loading…'; bMeta.innerHTML = '';
  bThumb.innerHTML = '<i class="fas fa-book-open"></i>';
  banner.classList.add('show');
  try {
    const { data: lib, error } = await supabase.from('playlists').select('*').eq('id', libraryId).single();
    if (error || !lib) {
      bName.textContent = `Library #${libraryId}`;
      bMeta.innerHTML = `<span><i class="fas fa-exclamation-circle"></i> Not found</span>`;
      bOpenBtn.style.display = 'none';
    } else {
      if (lib.thumbnail_url) bThumb.innerHTML = `<img src="${window.escHtml(lib.thumbnail_url)}" style="width:100%;height:100%;object-fit:cover;border-radius:9px;">`;
      bName.textContent = lib.name || `Library #${libraryId}`;
      const { count: artCount } = await supabase.from('playlist_items').select('*',{count:'exact',head:true}).eq('playlist_id', libraryId);
      const parts = [`<span><i class="fas fa-layer-group"></i> ${artCount||0} articles</span>`];
      if (lib.description) parts.push(`<span><i class="fas fa-align-left"></i> ${window.escHtml(lib.description)}</span>`);
      if (lib.created_at) {
        const d = new Date(lib.created_at).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});
        parts.push(`<span><i class="fas fa-calendar-alt"></i> ${d}</span>`);
      }
      bMeta.innerHTML = parts.join('');
      bOpenBtn.style.display = 'inline-flex';
      bOpenBtn.onclick = () => { window.location.href = `dailyfeed.html?playlist=${libraryId}`; };
    }
  } catch(e) {
    bName.textContent = `Library #${libraryId}`;
    bMeta.innerHTML = `<span><i class="fas fa-hashtag"></i> ID ${libraryId}</span>`;
    bOpenBtn.style.display = 'none';
  } finally {
    btn.disabled = false; btn.textContent = 'Go';
  }
};
window.clearJump = function() {
  document.getElementById('libraryIdInput').value = '';
  document.getElementById('libraryBanner').classList.remove('show');
};

/* DECK MODAL */
let deckArticles = [], deckCurrent = 0, deckLibId = null;

window.openDeckModal = async function(libId, libName) {
  deckLibId = libId;
  document.getElementById('deckModalTitle').textContent = libName;
  document.getElementById('deckModalMeta').textContent  = 'Loading articles…';
  document.getElementById('deckModalOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
  switchDeckTab('deck');
  const stack = document.getElementById('deckCardStack');
  stack.innerHTML = `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
    <div style="width:28px;height:28px;border:2.5px solid #2a2a2a;border-top-color:#a78bfa;border-radius:50%;animation:spin 0.9s linear infinite;"></div>
  </div>`;
  try {
    const { data: items, error: itemsErr } = await supabase
      .from('playlist_items').select('article_id').eq('playlist_id', libId);
    if (itemsErr) throw itemsErr;
    if (!items || items.length === 0) {
      document.getElementById('deckModalMeta').textContent = 'No articles';
      stack.innerHTML = `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:14px;">No articles yet</div>`;
      document.getElementById('deckArticleList').innerHTML = `<div style="padding:24px;text-align:center;color:var(--text-secondary);font-size:14px;">No articles yet</div>`;
      return;
    }
    const articleIds = items.map(i => i.article_id);
    const { data: arts, error: artsErr } = await supabase
      .from('articles').select('id, title, content, firebase_user_id, created_at, views, likes')
      .in('id', articleIds);
    if (artsErr) throw artsErr;
    const fbUids = [...new Set((arts||[]).map(a => a.firebase_user_id).filter(Boolean))];
    const authorMap = {};
    if (fbUids.length) {
      const { data: users } = await supabase
        .from('users').select('firebase_uid, username, full_name, pfp').in('firebase_uid', fbUids);
      (users||[]).forEach(u => {
        authorMap[u.firebase_uid] = {
          name: u.username ? `@${u.username}` : (u.full_name || 'Anonymous'),
          pfp:  u.pfp || null
        };
      });
    }
    const artMap = {};
    (arts||[]).forEach(a => { artMap[a.id] = a; });
    deckArticles = articleIds.map(id => artMap[id]).filter(Boolean).map(a => ({
      ...a,
      authorName: authorMap[a.firebase_user_id]?.name || 'Unknown',
      authorPfp:  authorMap[a.firebase_user_id]?.pfp  || null
    }));
    document.getElementById('deckModalMeta').textContent =
      `${deckArticles.length} article${deckArticles.length !== 1 ? 's' : ''}`;
    document.getElementById('deckOpenFeedBtn').onclick = () => {
      closeDeckModal(); window.location.href = `dailyfeed.html?playlist=${libId}`;
    };
    deckCurrent = 0; renderDeckCards(); renderDeckList();
  } catch(err) {
    document.getElementById('deckModalMeta').textContent = 'Failed to load';
    stack.innerHTML = `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ef4444;font-size:13px;">Error: ${window.escHtml(err.message)}</div>`;
  }
};

function renderDeckCards() {
  const stack = document.getElementById('deckCardStack');
  stack.innerHTML = '';
  if (!deckArticles.length) return;
  const visibleCount = Math.min(4, deckArticles.length - deckCurrent);
  for (let i = visibleCount - 1; i >= 0; i--) {
    const art  = deckArticles[deckCurrent + i];
    const card = document.createElement('div');
    card.className = `deck-article-card pos-${i}`;
    const isMCQ = typeof art.content === 'string' && art.content.trimStart().startsWith('❔');
    const raw = isMCQ
      ? art.content.replace(/^❔/,'').split('\n')[0].trim()
      : (art.content||'').replace(/\n+/g,' ').trim();
    const snippet = raw.slice(0, 130);
    const avatarHTML = art.authorPfp
      ? `<img src="${window.escHtml(art.authorPfp)}" alt="">`
      : `<span class="deck-art-author-init">${(art.authorName||'?').replace(/^@/,'')[0].toUpperCase()}</span>`;
    card.innerHTML = `
      <div class="deck-art-tag"><i class="fas fa-${isMCQ?'question-circle':'file-alt'}"></i> &nbsp;${isMCQ?'MCQ':'Article'}</div>
      <div class="deck-art-title">${window.escHtml(art.title||'Untitled')}</div>
      <div class="deck-art-snippet">${window.escHtml(snippet)}${raw.length>130?'…':''}</div>
      <div class="deck-art-footer">
        <div class="deck-art-author">${avatarHTML}<span>${window.escHtml(art.authorName)}</span></div>
        <div class="deck-art-read">Read <i class="fas fa-arrow-right" style="font-size:9px;"></i></div>
      </div>`;
    if (i === 0) card.addEventListener('click', () => { window.location.href = `article.html?id=${art.id}`; });
    stack.appendChild(card);
  }
  document.getElementById('deckProgress').textContent = `${deckCurrent+1} / ${deckArticles.length}`;
  document.getElementById('deckNextBtn').disabled = deckCurrent >= deckArticles.length - 1;
}

function renderDeckList() {
  const list = document.getElementById('deckArticleList');
  if (!deckArticles.length) {
    list.innerHTML = `<div style="padding:24px;text-align:center;color:var(--text-secondary);font-size:14px;">No articles</div>`;
    return;
  }
  list.innerHTML = deckArticles.map((art, i) => {
    const isMCQ = typeof art.content === 'string' && art.content.trimStart().startsWith('❔');
    const date  = new Date(art.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric'});
    return `<div class="deck-list-item" onclick="window.location.href='article.html?id=${art.id}'">
      <div class="deck-list-num">${i+1}</div>
      <div class="deck-list-info">
        <div class="deck-list-title">${window.escHtml(art.title||'Untitled')}</div>
        <div class="deck-list-meta">${isMCQ?'❔ MCQ':'📄 Article'} · ${window.escHtml(art.authorName)} · ${date}</div>
      </div>
      <i class="fas fa-chevron-right deck-list-arrow"></i>
    </div>`;
  }).join('');
}

document.getElementById('deckNextBtn').addEventListener('click', function() {
  if (deckCurrent >= deckArticles.length - 1) return;
  const top = document.querySelector('.deck-article-card.pos-0');
  if (top) { top.classList.add('swipe-left'); setTimeout(() => { deckCurrent++; renderDeckCards(); }, 270); }
  else { deckCurrent++; renderDeckCards(); }
});
document.getElementById('deckShuffleBtn').addEventListener('click', function() {
  for (let i = deckArticles.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [deckArticles[i], deckArticles[j]] = [deckArticles[j], deckArticles[i]];
  }
  deckCurrent = 0; renderDeckCards(); renderDeckList();
});

(function() {
  let startX = 0, dragging = false;
  const getStack = () => document.getElementById('deckCardStack');
  getStack().addEventListener('touchstart', e => { startX = e.touches[0].clientX; dragging = true; }, {passive:true});
  getStack().addEventListener('touchend',   e => {
    if (!dragging) return; dragging = false;
    if (e.changedTouches[0].clientX - startX < -60 && deckCurrent < deckArticles.length-1) {
      const top = getStack().querySelector('.deck-article-card.pos-0');
      if (top) { top.classList.add('swipe-left'); setTimeout(()=>{ deckCurrent++; renderDeckCards(); },270); }
    }
  });
  getStack().addEventListener('mousedown', e => { startX = e.clientX; dragging = true; });
  document.addEventListener('mouseup', e => {
    if (!dragging) return; dragging = false;
    if (e.clientX - startX < -60 && deckCurrent < deckArticles.length-1) {
      const top = document.querySelector('.deck-article-card.pos-0');
      if (top) { top.classList.add('swipe-left'); setTimeout(()=>{ deckCurrent++; renderDeckCards(); },270); }
    }
  });
})();

window.closeDeckModal = function() {
  document.getElementById('deckModalOverlay').classList.remove('show');
  document.body.style.overflow = '';
};
document.getElementById('deckModalOverlay').addEventListener('click', e => { if (e.target === document.getElementById('deckModalOverlay')) closeDeckModal(); });
document.getElementById('deckModalClose').addEventListener('click', closeDeckModal);
window.switchDeckTab = function(tab) {
  document.getElementById('tabDeck').classList.toggle('active', tab==='deck');
  document.getElementById('tabList').classList.toggle('active', tab==='list');
  document.getElementById('deckView').style.display = tab==='deck' ? 'flex' : 'none';
  document.getElementById('listView').style.display = tab==='list' ? 'flex' : 'none';
};

/* INIT */
loadCreators();
loadLibraries(false);
</script>
