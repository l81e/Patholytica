<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Patholytica — Batch Create</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
--bg:#0f0e0b; --text:#f5f0e8; --sub:#8a8070;
--hover:#1a1810; --border:#2a2518;
--accent:#c8a96e; --accent-h:#b8935a;
--accent-glow:rgba(200,169,110,0.25);
--accent-soft:rgba(200,169,110,0.12);
--green:#6abf85;
--error:#c46a4e;
--warning:#c8a040;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
font-family:"DM Sans",sans-serif;
background:var(--bg);color:var(--text);
position:fixed;width:100%;height:100%;
overflow:hidden;
}
.app{
position:fixed;top:0;left:50%;transform:translateX(-50%);
width:100%;max-width:450px;height:100%;
background:var(--bg);display:flex;flex-direction:column;
overflow:hidden;
}

/* ── Header ── */
.hdr{
flex-shrink:0;display:flex;align-items:center;gap:9px;
padding:10px 14px;
padding-top:calc(10px + env(safe-area-inset-top));
border-bottom:1px solid var(--border);
background:rgba(15,14,11,0.97);
backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
z-index:50;
}
.hdr-back{
width:34px;height:34px;border-radius:50%;
background:var(--hover);border:1px solid var(--border);
color:var(--text);cursor:pointer;
display:flex;align-items:center;justify-content:center;
font-size:13px;flex-shrink:0;
}
.hdr-back:active{border-color:var(--accent);color:var(--accent);}
.hdr-info{flex:1;min-width:0;}
.hdr-title{font-size:14px;font-weight:700;font-family:'Merriweather',serif;}
.hdr-sub{font-size:10px;color:var(--sub);margin-top:1px;}
.hdr-actions{display:flex;gap:6px;align-items:center;}
.hdr-btn{
padding:7px 12px;border-radius:20px;
font-size:11px;font-weight:700;cursor:pointer;
font-family:"DM Sans",sans-serif;
display:flex;align-items:center;gap:5px;white-space:nowrap;
border:none;transition:all .15s;
}
.hdr-ghost{background:var(--hover);border:1px solid var(--border)!important;color:var(--sub);}
.hdr-ghost:hover{border-color:var(--accent)!important;color:var(--accent);}
.hdr-lib{background:var(--accent-soft);border:1px solid rgba(200,169,110,.3)!important;color:var(--accent);}
.hdr-lib:hover{background:rgba(200,169,110,.2);}
.hdr-primary{background:var(--accent);color:#0f0e0b;box-shadow:0 2px 10px var(--accent-glow);}
.hdr-primary:hover{background:var(--accent-h);}
.hdr-btn:disabled{opacity:.35;cursor:not-allowed;}

/* ── Card counter strip (under header) ── */
.card-nav{
flex-shrink:0;display:flex;align-items:center;gap:8px;
padding:8px 10px;border-bottom:1px solid var(--border);
background:rgba(15,14,11,0.9);
}
.card-nav-arrow{
width:30px;height:30px;border-radius:50%;flex-shrink:0;
background:var(--hover);border:1px solid var(--border);
color:var(--text);cursor:pointer;
display:flex;align-items:center;justify-content:center;
font-size:12px;transition:all .15s;
}
.card-nav-arrow:active{border-color:var(--accent);color:var(--accent);}
.card-nav-arrow:disabled{opacity:.3;cursor:not-allowed;}
.card-nav-count{
font-size:11px;font-weight:700;color:var(--sub);
white-space:nowrap;flex-shrink:0;padding:0 2px;
}
.card-nav-count b{color:var(--text);}
.thumb-strip{
flex:1;display:flex;gap:6px;overflow-x:auto;
scrollbar-width:none;-ms-overflow-style:none;
padding:2px 2px;
}
.thumb-strip::-webkit-scrollbar{display:none;}
.thumb{
flex-shrink:0;width:40px;height:40px;border-radius:9px;
background:var(--hover);border:1.5px solid var(--border);
display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:1px;cursor:pointer;position:relative;transition:all .15s;
}
.thumb.active{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-glow);}
.thumb.invalid::after{
content:'';position:absolute;top:-2px;right:-2px;
width:8px;height:8px;border-radius:50%;
background:var(--warning);border:1.5px solid var(--bg);
}
.thumb i{font-size:11px;color:var(--sub);}
.thumb.active i{color:var(--accent);}
.thumb-label{font-size:6px;font-weight:800;letter-spacing:.03em;color:var(--sub);text-transform:uppercase;}
.thumb.active .thumb-label{color:var(--accent);}
.thumb-add{
flex-shrink:0;width:40px;height:40px;border-radius:9px;
background:transparent;border:1.5px dashed var(--border);
color:var(--sub);cursor:pointer;
display:flex;align-items:center;justify-content:center;
font-size:14px;transition:all .15s;
}
.thumb-add:active{border-color:var(--accent);color:var(--accent);}

/* ── Card viewport ── */
.card-viewport{
flex:1;overflow-y:auto;overflow-x:hidden;
padding-bottom:130px;
-webkit-overflow-scrolling:touch;
}
.card-viewport::-webkit-scrollbar{width:2px;}
.card-viewport::-webkit-scrollbar-thumb{background:var(--border);}

/* Type toggle + delete row, per card */
.card-toolbar-row{
display:flex;align-items:center;gap:8px;
padding:12px 18px 4px;
}
.mode-toggle{
display:flex;background:var(--hover);
border:1px solid var(--border);border-radius:20px;padding:3px;gap:2px;
}
.mode-toggle-btn{
padding:5px 11px;border-radius:16px;border:none;cursor:pointer;
font-size:11px;font-weight:700;font-family:"DM Sans",sans-serif;
color:var(--sub);background:transparent;
display:flex;align-items:center;gap:5px;transition:all .2s;
white-space:nowrap;
}
.mode-toggle-btn i{font-size:10px;}
.mode-toggle-btn.active{background:var(--accent);color:#0f0e0b;box-shadow:0 2px 8px var(--accent-glow);}
.card-del-btn{
margin-left:auto;width:30px;height:30px;border-radius:8px;
background:transparent;border:1px solid var(--border);
color:var(--sub);cursor:pointer;
display:flex;align-items:center;justify-content:center;font-size:11px;
}
.card-del-btn:active{background:rgba(196,106,78,.15);border-color:var(--error);color:var(--error);}

/* ── Author bar ── */
.preview-author-bar{display:flex;align-items:center;gap:10px;padding:10px 18px 6px;}
.preview-avatar{
width:34px;height:34px;border-radius:50%;
background:linear-gradient(135deg,var(--accent),#8a6430);
display:flex;align-items:center;justify-content:center;
font-size:13px;font-weight:700;color:#0f0e0b;flex-shrink:0;overflow:hidden;
}
.preview-avatar img{width:100%;height:100%;object-fit:cover;}
.preview-author-name{font-size:12px;font-weight:700;}
.preview-author-date{font-size:10px;color:var(--sub);}

/* ── Title ── */
.title-area{padding:0 18px 6px;}
.title-input{
font-size:19px;font-weight:800;color:var(--text);
line-height:1.25;letter-spacing:-0.02em;font-family:'Merriweather',serif;
border:none;outline:none;background:transparent;
width:100%;resize:none;overflow:hidden;padding:0;min-height:1.25em;
}
.title-input::placeholder{color:var(--sub);opacity:.5;}

/* ── Blocks ── */
.blocks-wrap{padding:6px 0 0;}

.block-row{
display:flex;align-items:flex-start;gap:0;
position:relative;margin-bottom:2px;
}

.block-handle-col{
width:28px;flex-shrink:0;
display:flex;flex-direction:column;
align-items:center;padding-top:10px;gap:4px;
}
.move-btn{
width:24px;height:24px;border-radius:6px;border:none;
background:transparent;color:var(--border);
display:flex;align-items:center;justify-content:center;
font-size:10px;cursor:pointer;transition:all .15s;
-webkit-tap-highlight-color:transparent;
}
.move-btn:active{background:var(--hover);color:var(--accent);}

.block-content{flex:1;min-width:0;}

.block-actions-col{
width:28px;flex-shrink:0;
display:flex;flex-direction:column;
align-items:center;padding-top:8px;gap:4px;
}
.blk-act{
width:24px;height:24px;border-radius:6px;border:none;
background:transparent;color:var(--sub);
display:flex;align-items:center;justify-content:center;
font-size:9px;cursor:pointer;transition:all .15s;
}
.blk-act:active{background:var(--hover);}
.blk-act.del:active{color:#f87171;}

/* ── Text block ── */
.text-block-container{position:relative;}
.text-block-display{
font-size:14px;line-height:1.7;color:var(--text);
padding:6px 16px 6px 0;
font-family:"DM Sans",sans-serif;letter-spacing:.01em;
min-height:42px;word-break:break-word;white-space:pre-wrap;
cursor:text;
-webkit-user-select:text;user-select:text;
}
.text-block-display:empty::before{content:attr(data-placeholder);color:var(--sub);opacity:.45;pointer-events:none;}
.text-block-textarea{
font-size:14px;line-height:1.7;color:var(--text);
border:none;outline:none;background:transparent;
width:100%;resize:none;
min-height:42px;
height:auto;
padding:6px 16px 6px 0;
font-family:"DM Sans",sans-serif;letter-spacing:.01em;
display:none;
-webkit-appearance:none;
caret-color:var(--accent);
overflow:hidden;
}
.text-block-textarea::placeholder{color:var(--sub);opacity:.45;}
.text-block-textarea.editing{display:block;}
.text-block-display.hidden{display:none;}

/* Emoji highlight preview styles */
.emo-magnify{font-weight:700;font-size:1.1em;}
.emo-urgent{font-weight:700;color:#e8c86a;background:rgba(232,200,106,.12);border:1px solid rgba(232,200,106,.25);padding:.05em .3em;border-radius:5px;}
.emo-pinned{border-left:2px solid var(--accent);padding-left:.45em;background:linear-gradient(to right,var(--accent-soft),transparent);border-radius:0 3px 3px 0;}
.emo-fire{font-weight:700;background:linear-gradient(90deg,#c87040,#e8a040,#c8a96e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.emo-diamond{font-weight:700;background:linear-gradient(135deg,#e8d8a0,#c8a96e,#a08050);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.emo-yellow{color:#e8c86a;text-shadow:0 0 8px rgba(232,200,106,.6);}
.emo-blue{color:#8aa0c0;text-shadow:0 0 8px rgba(138,160,192,.55);}
.emo-green{color:#7ab88a;text-shadow:0 0 8px rgba(122,184,138,.55);}
.emo-purple{color:var(--accent);text-shadow:0 0 10px rgba(200,169,110,.7);}
.emo-red{color:#c97a5a;text-shadow:0 0 8px rgba(201,122,90,.55);}
.emo-dark{color:#f0e8d8;background:rgba(0,0,0,.75);padding:.05em .3em;border-radius:4px;}
.emo-brain{font-style:italic;color:var(--accent);border-bottom:1.5px solid rgba(200,169,110,.35);}
.emo-book{font-family:'Merriweather',serif;background:rgba(200,169,110,.06);color:#d4b88a;padding:.05em .3em;border-radius:4px;border:1px solid rgba(200,169,110,.15);font-size:.95em;}
.emo-idea{background:linear-gradient(to right,var(--accent-soft),rgba(200,169,110,.04));color:#d4a96e;padding:.05em .3em;border-radius:4px;}
.emo-target{font-weight:700;outline:1.5px solid rgba(200,169,110,.5);outline-offset:2px;padding:.05em .25em;}
.emo-micro{font-family:'Courier New',monospace;color:#c8a96e;font-size:.9em;border-bottom:1px dotted rgba(200,169,110,.4);}
.emo-science{font-family:'Courier New',monospace;color:#b8a878;font-size:.9em;border-bottom:1px solid rgba(184,168,120,.35);}
.emo-warning{background:rgba(200,169,110,.1);border:1px solid rgba(200,169,110,.3);color:#c8a96e;padding:.05em .35em;border-radius:5px;font-weight:700;}
.emo-check{color:#7ab88a;background:rgba(122,184,138,.1);padding:.05em .28em;border-radius:4px;font-weight:700;}
.emo-cross{color:#c97a5a;background:rgba(201,122,90,.08);padding:.05em .28em;border-radius:4px;text-decoration:line-through;text-decoration-color:rgba(201,122,90,.5);}
.emo-hourglass{color:var(--accent);background:var(--accent-soft);padding:.05em .28em;border-radius:4px;}
.emo-lock{color:#8a8070;background:rgba(42,37,24,.8);padding:.05em .32em;border-radius:4px;border:1px solid var(--border);font-weight:600;}
.emo-unlock{color:var(--accent);background:var(--accent-soft);padding:.05em .32em;border-radius:4px;border:1px solid rgba(200,169,110,.25);}
.emo-lightning{font-weight:700;background:linear-gradient(90deg,#e8c86a,#c8a96e,#e8d8a0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.emo-sparkle{background:linear-gradient(90deg,#f0e0b0,#c8a96e,#f0e0b0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.emo-star{color:#f0e0b0;text-shadow:-1px -1px 6px rgba(200,169,110,.7),1px 1px 6px rgba(200,169,110,.7);}
.emo-crown{font-weight:800;background:linear-gradient(135deg,#e8d8a0,#c8a96e,#a07840);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.emo-rocket{font-weight:700;color:#e8d8a0;}
.emo-wave{color:#c8a96e;}
.emo-float{color:#c8a96e;}
.emo-rainbow{background:linear-gradient(90deg,#c97a5a,#c8a96e,#7ab88a,#8aa0c0,#c8a96e,#c97a5a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:700;}
.emo-magic{background:linear-gradient(90deg,#f0d8a0,#c8a96e,#e8c880,#f0d8a0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.emo-heart{color:#c87a6a;}
.emo-puzzle{border:1px dashed rgba(200,169,110,.35);padding:.05em .32em;border-radius:5px;color:#c8a96e;}
.emo-tag{background:var(--accent-soft);border:1px solid rgba(200,169,110,.25);color:#c8a96e;padding:.04em .5em;border-radius:20px;font-size:.88em;}

/* Image block */
.image-block-wrap{
width:calc(100% + 28px);margin-right:-28px;
margin-bottom:4px;margin-top:4px;overflow:hidden;border-radius:10px;
}
.image-block-wrap img{width:100%;height:auto;display:block;max-height:280px;object-fit:cover;}
.image-caption-input{
width:100%;background:transparent;border:none;outline:none;
font-size:12px;color:var(--sub);font-family:"DM Sans",sans-serif;
padding:5px 16px 5px 0;font-style:italic;
}
.image-caption-input::placeholder{color:var(--sub);opacity:.5;}

/* YouTube block */
.yt-block-wrap{width:calc(100% + 28px);margin-right:-28px;margin-bottom:4px;margin-top:4px;overflow:hidden;border-radius:10px;}
.yt-block-label{display:flex;align-items:center;gap:8px;padding:8px 16px;background:rgba(0,0,0,.4);border-bottom:1px solid rgba(255,255,255,.06);}
.yt-block-label i{color:#c97a5a;font-size:13px;}
.yt-block-label span{font-size:12px;font-weight:600;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.yt-block-label a{font-size:10px;font-weight:700;color:#c97a5a;background:rgba(201,122,90,.1);border:1px solid rgba(201,122,90,.2);border-radius:7px;padding:3px 9px;text-decoration:none;white-space:nowrap;flex-shrink:0;}
.yt-block-wrap iframe{width:100%;aspect-ratio:16/9;border:none;display:block;}
.yt-caption-input{width:100%;background:transparent;border:none;outline:none;font-size:12px;color:var(--sub);font-family:"DM Sans",sans-serif;padding:5px 16px 5px 0;font-style:italic;}
.yt-caption-input::placeholder{color:var(--sub);opacity:.5;}

/* Audio block */
.audio-block-wrap{padding:6px 16px 6px 0;}
.custom-audio-player{
background:var(--hover);border-radius:12px;padding:14px;
display:flex;align-items:center;gap:12px;border:1px solid var(--border);
}
.play-btn{
width:38px;height:38px;border-radius:50%;
background:var(--accent);border:none;color:#0f0e0b;
cursor:pointer;display:flex;align-items:center;justify-content:center;
font-size:13px;flex-shrink:0;box-shadow:0 0 14px var(--accent-glow);
}
.audio-info{flex:1;min-width:0;overflow:hidden;}
.audio-title-txt{font-size:12px;font-weight:600;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
.waveform-container{position:relative;height:26px;background:var(--bg);border-radius:6px;margin-bottom:5px;cursor:pointer;overflow:hidden;}
.waveform-progress{position:absolute;top:0;left:0;height:100%;background:var(--accent);opacity:.35;transition:width .1s linear;}
.waveform-bars{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:space-around;padding:0 4px;}
.waveform-bar{width:2px;background:var(--sub);border-radius:2px;opacity:.5;}
.audio-time{display:flex;justify-content:space-between;font-size:10px;color:var(--sub);}
.audio-caption-input{
width:100%;background:transparent;border:none;outline:none;
font-size:12px;color:var(--sub);font-family:"DM Sans",sans-serif;
margin-top:6px;padding:0;font-style:italic;
}
.audio-caption-input::placeholder{color:var(--sub);opacity:.5;}

/* MCQ */
.mcq-wrap{padding:6px 18px 0;}
.mcq-badge-edit{
display:inline-flex;align-items:center;gap:6px;
background:var(--accent-soft);border:1px solid rgba(200,169,110,.3);
border-radius:20px;padding:4px 12px;margin-bottom:12px;
font-size:10px;font-weight:800;letter-spacing:.08em;
text-transform:uppercase;color:var(--accent);
}
.mcq-question-input{
font-size:17px;font-weight:800;color:var(--text);
line-height:1.3;letter-spacing:-0.02em;font-family:'Merriweather',serif;
border:none;outline:none;background:transparent;
width:100%;resize:none;overflow:hidden;padding:0;
margin-bottom:14px;min-height:1.3em;
}
.mcq-question-input::placeholder{color:var(--sub);opacity:.45;}
.mcq-options-wrap{display:flex;flex-direction:column;gap:8px;}
.mcq-opt-row{
display:flex;align-items:center;gap:10px;
border:1px solid var(--border);border-radius:12px;
padding:11px 13px;background:var(--hover);
}
.mcq-opt-row.correct-opt{border-color:rgba(106,191,133,.6);background:rgba(106,191,133,.06);}
.mcq-opt-letter{
width:24px;height:24px;border-radius:50%;
border:1.5px solid var(--border);
display:flex;align-items:center;justify-content:center;
font-size:9px;font-weight:800;color:var(--sub);flex-shrink:0;
}
.mcq-opt-row.correct-opt .mcq-opt-letter{background:var(--green);border-color:var(--green);color:#0f0e0b;}
.mcq-opt-input{flex:1;background:transparent;border:none;outline:none;font-size:13px;font-weight:500;color:var(--text);font-family:"DM Sans",sans-serif;}
.mcq-opt-input::placeholder{color:var(--sub);opacity:.45;}
.mcq-mark-correct{
width:28px;height:28px;border-radius:50%;border:none;cursor:pointer;
display:flex;align-items:center;justify-content:center;
font-size:10px;flex-shrink:0;background:var(--bg);color:var(--sub);
-webkit-tap-highlight-color:transparent;
}
.mcq-opt-row.correct-opt .mcq-mark-correct{background:var(--green);color:#0f0e0b;}
.mcq-opt-del{
width:28px;height:28px;border-radius:50%;border:none;cursor:pointer;
display:flex;align-items:center;justify-content:center;
font-size:10px;background:transparent;color:var(--sub);flex-shrink:0;
-webkit-tap-highlight-color:transparent;
}
.mcq-add-opt{
margin-top:8px;padding:12px;border-radius:10px;
border:1px dashed var(--border);background:transparent;
color:var(--sub);font-size:12px;font-weight:600;cursor:pointer;
display:flex;align-items:center;justify-content:center;gap:6px;
font-family:"DM Sans",sans-serif;width:100%;
}

/* Validation note per card */
.card-issue{
margin:6px 18px 0;padding:8px 12px;border-radius:9px;
background:rgba(200,169,110,.08);border:1px solid rgba(200,169,110,.25);
font-size:11px;color:var(--warning);display:flex;align-items:center;gap:7px;
}

/* ── Bottom toolbar (article block tools) ── */
.bottom-toolbar{
position:fixed;bottom:0;left:50%;transform:translateX(-50%);
width:100%;max-width:450px;
background:rgba(15,14,11,0.97);
border-top:1px solid var(--border);
backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
padding:8px 12px;
padding-bottom:calc(8px + env(safe-area-inset-bottom));
display:flex;flex-wrap:wrap;gap:6px;z-index:200;
}
.tool-btn{
flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;
padding:10px 6px;border-radius:10px;
border:1px solid var(--border);background:var(--hover);
color:var(--sub);font-size:11px;font-weight:700;
cursor:pointer;font-family:"DM Sans",sans-serif;white-space:nowrap;
-webkit-tap-highlight-color:transparent;
-webkit-appearance:none;
}
.tool-btn:active{border-color:var(--accent);color:var(--accent);}
.tool-btn i{font-size:13px;}

/* YT input */
.yt-input-bar{
display:none;align-items:center;gap:6px;
margin:8px 18px 0;
}
.yt-input-bar.show{display:flex;}
.yt-url-in{
flex:1;padding:9px 12px;background:var(--hover);
border:1px solid var(--border);border-radius:8px;outline:none;
font-size:14px;color:var(--text);font-family:"DM Sans",sans-serif;
-webkit-appearance:none;
}
.yt-url-in:focus{border-color:#f87171;}
.yt-url-in::placeholder{color:var(--sub);opacity:.5;}
.yt-add-btn{padding:9px 12px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);border-radius:8px;color:#f87171;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;}
.yt-cancel-btn{padding:9px 10px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--sub);font-size:11px;cursor:pointer;}

/* ── Highlight sheet ── */
.hl-sheet-overlay{
position:fixed;inset:0;background:rgba(0,0,0,.7);
z-index:400;display:none;align-items:flex-end;justify-content:center;
backdrop-filter:blur(2px);
}
.hl-sheet-overlay.show{display:flex;}
.hl-sheet{
background:#141210;border-radius:20px 20px 0 0;
border:1px solid var(--border);border-bottom:none;
width:100%;max-width:450px;
max-height:60vh;display:flex;flex-direction:column;
animation:slideUp .25s cubic-bezier(.4,0,.2,1);
padding-bottom:env(safe-area-inset-bottom);
}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.hl-sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0;flex-shrink:0;}
.hl-sheet-header{
padding:10px 18px 8px;display:flex;align-items:center;justify-content:space-between;
border-bottom:1px solid var(--border);flex-shrink:0;
}
.hl-sheet-title{font-size:13px;font-weight:700;font-family:'Merriweather',serif;}
.hl-sheet-close{
width:28px;height:28px;border-radius:50%;
background:var(--hover);border:1px solid var(--border);
color:var(--text);cursor:pointer;
display:flex;align-items:center;justify-content:center;font-size:11px;
}
.hl-list{
flex:1;overflow-y:auto;padding:8px 0;
-webkit-overflow-scrolling:touch;
}
.hl-list::-webkit-scrollbar{width:2px;}
.hl-list::-webkit-scrollbar-thumb{background:var(--border);}
.hl-group-label{
font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
color:var(--sub);opacity:.6;padding:8px 18px 4px;
}
.hl-btn{
display:flex;align-items:center;gap:12px;padding:11px 18px;
cursor:pointer;border:none;background:transparent;
color:var(--text);font-size:13px;font-weight:600;
font-family:"DM Sans",sans-serif;width:100%;text-align:left;
-webkit-tap-highlight-color:transparent;
touch-action:manipulation;
user-select:none;-webkit-user-select:none;
}
.hl-btn:active{background:var(--hover);}
.hl-swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0;}
.hl-preview{font-size:12px;margin-left:auto;opacity:.7;}

/* ── Library sheet ── */
.sheet-overlay{
position:fixed;inset:0;background:rgba(0,0,0,.85);
z-index:300;display:none;align-items:flex-end;justify-content:center;
backdrop-filter:blur(4px);
}
.sheet-overlay.show{display:flex;}
.sheet{
background:#141210;border-radius:20px 20px 0 0;
border:1px solid var(--border);border-bottom:none;
width:100%;max-width:450px;max-height:88vh;
display:flex;flex-direction:column;
animation:slideUp .3s cubic-bezier(.4,0,.2,1);
padding-bottom:env(safe-area-inset-bottom);
}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0;flex-shrink:0;}
.sheet-header{padding:12px 18px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;}
.sheet-title{font-size:14px;font-weight:700;font-family:'Merriweather',serif;}
.sheet-close{width:28px;height:28px;border-radius:50%;background:var(--hover);border:1px solid var(--border);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;}
.sheet-body{flex:1;overflow-y:auto;padding:14px 18px;}
.sheet-body::-webkit-scrollbar{width:2px;}
.sheet-body::-webkit-scrollbar-thumb{background:var(--border);}
.lib-field label{
display:block;font-size:10px;font-weight:700;
letter-spacing:.08em;text-transform:uppercase;
color:var(--sub);margin-bottom:6px;
}
.lib-input{
width:100%;padding:10px 14px;
background:var(--hover);border:1px solid var(--border);
border-radius:10px;color:var(--text);
font-size:14px;outline:none;font-family:inherit;
transition:border-color .2s;-webkit-appearance:none;
margin-bottom:14px;
}
.lib-input:focus{border-color:var(--accent);}
.lib-input::placeholder{color:var(--sub);opacity:.5;}
.lib-textarea{
width:100%;padding:10px 14px;
background:var(--hover);border:1px solid var(--border);
border-radius:10px;color:var(--text);
font-size:13px;outline:none;resize:none;
font-family:inherit;line-height:1.5;
transition:border-color .2s;min-height:60px;
-webkit-appearance:none;
}
.lib-textarea:focus{border-color:var(--accent);}
.lib-textarea::placeholder{color:var(--sub);opacity:.5;}
.lib-info{
display:flex;align-items:center;gap:8px;padding:10px 14px;
background:var(--accent-soft);border:1px solid rgba(200,169,110,.2);
border-radius:10px;font-size:12px;color:var(--sub);margin-bottom:14px;
}
.lib-info i{color:var(--accent);font-size:13px;flex-shrink:0;}
.sheet-footer{
padding:10px 18px;border-top:1px solid var(--border);
display:flex;gap:8px;flex-shrink:0;
}

/* ── Preview sheet (final review before publish) ── */
.preview-mini-card{
background:var(--hover);border:1px solid var(--border);
border-radius:12px;padding:12px 14px;margin-bottom:10px;position:relative;
}
.preview-mini-card.mcq{border-color:rgba(106,191,133,.3);}
.preview-mini-badge{
position:absolute;top:10px;right:10px;
font-size:9px;font-weight:800;letter-spacing:.06em;
padding:2px 7px;border-radius:6px;
background:var(--accent-soft);color:var(--accent);
}
.preview-mini-card.mcq .preview-mini-badge{background:rgba(106,191,133,.12);color:var(--green);}
.preview-mini-title{
font-size:14px;font-weight:800;font-family:'Merriweather',serif;
line-height:1.3;margin-bottom:5px;padding-right:56px;color:var(--text);
}
.preview-mini-sub{font-size:11px;color:var(--sub);}

/* ── Progress overlay ── */
.progress-overlay{
position:fixed;inset:0;background:rgba(0,0,0,.75);
z-index:500;display:none;align-items:center;justify-content:center;
backdrop-filter:blur(4px);
}
.progress-overlay.show{display:flex;}
.progress-box{
background:#141210;border:1px solid var(--border);
border-radius:16px;padding:28px 24px;text-align:center;width:240px;
}
.progress-spinner{
width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);
border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px;
}
@keyframes spin{to{transform:rotate(360deg);}}
.progress-label{font-size:13px;font-weight:700;margin-bottom:3px;font-family:'Merriweather',serif;}
.progress-sub{font-size:11px;color:var(--sub);}
.progress-bar-wrap{margin-top:12px;background:var(--border);border-radius:4px;height:5px;overflow:hidden;}
.progress-bar{height:100%;background:var(--accent);border-radius:4px;transition:width .3s ease;width:0%;}

/* Toast */
.toast{
position:fixed;top:calc(60px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
background:#141210;border:1px solid var(--border);border-radius:10px;
padding:10px 16px;font-size:12px;font-weight:600;color:var(--text);
z-index:9999;opacity:0;pointer-events:none;white-space:nowrap;
transition:opacity .2s;box-shadow:0 8px 32px rgba(0,0,0,.5);
display:flex;align-items:center;gap:8px;
}
.toast.success{border-left:3px solid var(--green);}
.toast.error{border-left:3px solid var(--error);}
.toast.warning{border-left:3px solid var(--warning);}
.toast.show{opacity:1;}
.toast i{font-size:13px;}
.toast.success i{color:var(--green);}
.toast.error i{color:var(--error);}
.toast.warning i{color:var(--warning);}

.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;}
</style>
</head>
<body>

<div class="app">
<div class="hdr">
  <button class="hdr-back" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
  <div class="hdr-info">
    <div class="hdr-title">Batch Create</div>

  </div>

<script>
/* ══════════════════════════════════════
 EMOJI MAP & HIGHLIGHT EFFECTS  (identical to create.html)
══════════════════════════════════════ */
const EMOJI_MAP={
'🔍':'emo-magnify','❗':'emo-urgent','📌':'emo-pinned','🔥':'emo-fire','💎':'emo-diamond',
'🟡':'emo-yellow','🔵':'emo-blue','🟢':'emo-green','🟣':'emo-purple','🔴':'emo-red',
'⚫':'emo-dark','🧠':'emo-brain','📖':'emo-book','💡':'emo-idea','🎯':'emo-target',
'🧩':'emo-puzzle','🏷️':'emo-tag','🔬':'emo-micro','⚠️':'emo-warning','✅':'emo-check',
'❌':'emo-cross','⏳':'emo-hourglass','🔒':'emo-lock','🔓':'emo-unlock','⚡':'emo-lightning',
'🌊':'emo-wave','💫':'emo-float','🚀':'emo-rocket','🌟':'emo-star','✨':'emo-sparkle',
'🌈':'emo-rainbow','👑':'emo-crown','🪄':'emo-magic','❤️':'emo-heart','🧪':'emo-science',
};

const HIGHLIGHT_EFFECTS=[
{group:'Color'},
{label:'Yellow',emoji:'🟡',swatch:'#e8c86a',cls:'emo-yellow'},
{label:'Red',emoji:'🔴',swatch:'#c97a5a',cls:'emo-red'},
{label:'Green',emoji:'🟢',swatch:'#7ab88a',cls:'emo-green'},
{label:'Blue',emoji:'🔵',swatch:'#8aa0c0',cls:'emo-blue'},
{label:'Purple',emoji:'🟣',swatch:'#c8a96e',cls:'emo-purple'},
{label:'Dark bg',emoji:'⚫',swatch:'#2a2518',cls:'emo-dark'},
{group:'Emphasis'},
{label:'Magnify',emoji:'🔍',swatch:'#f5f0e8',cls:'emo-magnify'},
{label:'Urgent',emoji:'❗',swatch:'#e8c86a',cls:'emo-urgent'},
{label:'Pinned',emoji:'📌',swatch:'#c8a96e',cls:'emo-pinned'},
{label:'Fire',emoji:'🔥',swatch:'#c87040',cls:'emo-fire'},
{label:'Diamond',emoji:'💎',swatch:'#8aa0c0',cls:'emo-diamond'},
{label:'Lightning',emoji:'⚡',swatch:'#e8c86a',cls:'emo-lightning'},
{label:'Crown',emoji:'👑',swatch:'#c8a96e',cls:'emo-crown'},
{label:'Sparkle',emoji:'✨',swatch:'#f0e0b0',cls:'emo-sparkle'},
{label:'Star',emoji:'🌟',swatch:'#f0e0b0',cls:'emo-star'},
{group:'Academic'},
{label:'Brain',emoji:'🧠',swatch:'#8aa0c0',cls:'emo-brain'},
{label:'Book',emoji:'📖',swatch:'#d4b88a',cls:'emo-book'},
{label:'Microscope',emoji:'🔬',swatch:'#c8a96e',cls:'emo-micro'},
{label:'Science',emoji:'🧪',swatch:'#b8a878',cls:'emo-science'},
{label:'Idea',emoji:'💡',swatch:'#e8c86a',cls:'emo-idea'},
{label:'Target',emoji:'🎯',swatch:'#c97a5a',cls:'emo-target'},
{label:'Puzzle',emoji:'🧩',swatch:'#c8a96e',cls:'emo-puzzle'},
{label:'Tag',emoji:'🏷️',swatch:'#c8a96e',cls:'emo-tag'},
{group:'Status'},
{label:'Check',emoji:'✅',swatch:'#7ab88a',cls:'emo-check'},
{label:'Cross',emoji:'❌',swatch:'#c97a5a',cls:'emo-cross'},
{label:'Warning',emoji:'⚠️',swatch:'#e8c86a',cls:'emo-warning'},
{label:'Hourglass',emoji:'⏳',swatch:'#c8a96e',cls:'emo-hourglass'},
{label:'Lock',emoji:'🔒',swatch:'#8a8070',cls:'emo-lock'},
{label:'Unlock',emoji:'🔓',swatch:'#c8a96e',cls:'emo-unlock'},
{group:'Animated'},
{label:'Rainbow',emoji:'🌈',swatch:'#c8a96e',cls:'emo-rainbow'},
{label:'Magic',emoji:'🪄',swatch:'#f0d8a0',cls:'emo-magic'},
{label:'Rocket',emoji:'🚀',swatch:'#e8d8a0',cls:'emo-rocket'},
{label:'Wave',emoji:'🌊',swatch:'#8aa0c0',cls:'emo-wave'},
{label:'Float',emoji:'💫',swatch:'#c8a96e',cls:'emo-float'},
{label:'Heart',emoji:'❤️',swatch:'#c87a6a',cls:'emo-heart'},
];

(function(){
const list=document.getElementById('hlList');
HIGHLIGHT_EFFECTS.forEach(ef=>{
  if(ef.group){
    const lbl=document.createElement('div');
    lbl.className='hl-group-label';lbl.textContent=ef.group;
    list.appendChild(lbl);
  } else {
    const btn=document.createElement('button');
    btn.className='hl-btn';
    btn.dataset.emoji=ef.emoji;
    btn.innerHTML=`<div class="hl-swatch" style="background:${ef.swatch};"></div>${ef.label}<span class="hl-preview ${ef.cls}">Sample text</span>`;
    let _touchStartY=0,_touchMoved=false;
    btn.addEventListener('touchstart',e=>{_touchStartY=e.touches[0].clientY;_touchMoved=false;},{passive:true});
    btn.addEventListener('touchmove',e=>{if(Math.abs(e.touches[0].clientY-_touchStartY)>6)_touchMoved=true;},{passive:true});
    btn.addEventListener('touchend',e=>{if(_touchMoved)return;e.preventDefault();applyHighlight(ef.emoji);},{passive:false});
    btn.addEventListener('click',()=>applyHighlight(ef.emoji));
    list.appendChild(btn);
  }
});
})();

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function buildEmojiPattern(){
  const keys=Object.keys(EMOJI_MAP).sort((a,b)=>b.length-a.length);
  const escaped=keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
  return new RegExp(`(${escaped})([\\s\\S]*?)\\1`,'gu');
}
function renderEmojiPreview(text){
  const re=buildEmojiPattern();
  let result='',lastIndex=0,match;
  while((match=re.exec(text))!==null){
    result+=escHtml(text.slice(lastIndex,match.index));
    const cls=EMOJI_MAP[match[1]];
    result+=`<span class="${cls}">${renderEmojiPreview(match[2])}</span>`;
    lastIndex=re.lastIndex;
  }
  result+=escHtml(text.slice(lastIndex));
  return result;
}

/* ══════════════════════════════════════
 CARD STATE
 Each card: {id, type:'article'|'mcq',
   // article:
   title, blocks:[{id,type:'text'|'image'|'audio'|'youtube', ...}],
   // mcq:
   question, options:[{label,correct}]
 }
══════════════════════════════════════ */
let cards=[];
let activeIdx=0;
const letters=['A','B','C','D','E','F'];

function genId(prefix){return prefix+'_'+Date.now()+'_'+Math.random().toString(36).slice(2);}

function newArticleCard(){
  return{id:genId('card'),type:'article',title:'',blocks:[{id:genId('blk'),type:'text',text:''}]};
}
function newMcqCard(){
  return{id:genId('card'),type:'mcq',question:'',options:[
    {label:'',correct:true},{label:'',correct:false},{label:'',correct:false},{label:'',correct:false}
  ]};
}

function activeCard(){return cards[activeIdx];}

/* ══════════════════════════════════════
 INIT
══════════════════════════════════════ */
function initCards(){
  cards=[newArticleCard()];
  activeIdx=0;
  renderAll();
}

/* ══════════════════════════════════════
 NAV
══════════════════════════════════════ */
function goPrev(){if(activeIdx>0){commitActiveTextBlocks();activeIdx--;renderAll();}}
function goNext(){if(activeIdx<cards.length-1){commitActiveTextBlocks();activeIdx++;renderAll();}}
function jumpTo(i){if(i===activeIdx)return;commitActiveTextBlocks();activeIdx=i;renderAll();}

function addCard(type){
  commitActiveTextBlocks();
  cards.push(type==='mcq'?newMcqCard():newArticleCard());
  activeIdx=cards.length-1;
  renderAll();
}

function deleteCard(idx){
  if(cards.length<=1){showToast('Keep at least one card','warning');return;}
  cards.splice(idx,1);
  if(activeIdx>=cards.length)activeIdx=cards.length-1;
  else if(idx<activeIdx)activeIdx--;
  renderAll();
}

function commitActiveTextBlocks(){
  document.querySelectorAll('.text-block-textarea').forEach(ta=>{
    const row=ta.closest('[data-blk]');if(!row)return;
    const c=activeCard();if(!c||c.type!=='article')return;
    const blk=c.blocks.find(b=>b.id===row.getAttribute('data-blk'));
    if(blk&&blk.type==='text')blk.text=ta.value;
  });
  const c=activeCard();
  if(c&&c.type==='article'){
    const ti=document.getElementById('titleInput_'+c.id);
    if(ti)c.title=ti.value;
  }
  if(c&&c.type==='mcq'){
    const qi=document.getElementById('mcqQuestion_'+c.id);
    if(qi)c.question=qi.value;
    document.querySelectorAll(`[data-mcq-card="${c.id}"] .mcq-opt-input`).forEach((inp,i)=>{
      if(c.options[i])c.options[i].label=inp.value;
    });
  }
}

/* ══════════════════════════════════════
 VALIDATION
══════════════════════════════════════ */
function cardIsValid(c){
  if(c.type==='article'){
    const hasTitle=!!(c.title&&c.title.trim());
    const hasContent=c.blocks.some(b=>b.type==='text'&&b.text&&b.text.trim());
    return hasTitle&&hasContent;
  } else {
    const hasQ=!!(c.question&&c.question.trim());
    const filled=c.options.filter(o=>o.label&&o.label.trim());
    const hasCorrect=c.options.some(o=>o.correct&&o.label&&o.label.trim());
    return hasQ&&filled.length>=2&&hasCorrect;
  }
}

/* ══════════════════════════════════════
 TOP-LEVEL RENDER
══════════════════════════════════════ */
function renderAll(){
  renderNav();
  renderCardViewport();
  syncToolbarVisibility();
  syncGlobalButtons();
}

function renderNav(){
  document.getElementById('navCount').innerHTML=`<b>${activeIdx+1}</b>/${cards.length}`;
  document.getElementById('hdrSub').textContent=`${cards.length} card${cards.length!==1?'s':''}`;
  document.getElementById('navPrev').disabled=activeIdx===0;
  document.getElementById('navNext').disabled=activeIdx===cards.length-1;

  const strip=document.getElementById('thumbStrip');
  strip.innerHTML='';
  cards.forEach((c,i)=>{
    const t=document.createElement('div');
    t.className='thumb'+(i===activeIdx?' active':'')+(!cardIsValid(c)?' invalid':'');
    t.innerHTML=`<i class="fas fa-${c.type==='mcq'?'question-circle':'file-alt'}"></i><span class="thumb-label">${i+1}</span>`;
    t.onclick=()=>jumpTo(i);
    strip.appendChild(t);
  });
  requestAnimationFrame(()=>{
    const activeEl=strip.children[activeIdx];
    if(activeEl)activeEl.scrollIntoView({behavior:'smooth',inline:'nearest',block:'nearest'});
  });
}

function syncToolbarVisibility(){
  const c=activeCard();
  document.getElementById('bottomToolbar').style.display=(c&&c.type==='article')?'flex':'none';
}

function syncGlobalButtons(){
  const hasAny=cards.length>0;
  document.getElementById('previewBtn').disabled=!hasAny;
  document.getElementById('libraryBtn').disabled=!hasAny;
  document.getElementById('publishBtn').disabled=!hasAny;
}

/* ══════════════════════════════════════
 CARD VIEWPORT RENDER (mounts only the active card)
══════════════════════════════════════ */
function renderCardViewport(){
  const vp=document.getElementById('cardViewport');
  vp.innerHTML='';
  const c=activeCard();
  if(!c)return;

  const wrap=document.createElement('div');
  wrap.id='cardRoot_'+c.id;

  /* toolbar row: type toggle + delete */
  const toolRow=document.createElement('div');
  toolRow.className='card-toolbar-row';
  toolRow.innerHTML=`
    <div class="mode-toggle">
      <button class="mode-toggle-btn ${c.type==='article'?'active':''}" onclick="switchCardType('${c.id}','article')">
        <i class="fas fa-file-alt"></i> Art
      </button>
      <button class="mode-toggle-btn ${c.type==='mcq'?'active':''}" onclick="switchCardType('${c.id}','mcq')">
        <i class="fas fa-question-circle"></i> MCQ
      </button>
    </div>
    <button class="card-del-btn" onclick="deleteCard(${activeIdx})" title="Delete this card"><i class="fas fa-trash"></i></button>
  `;
  wrap.appendChild(toolRow);

  if(!cardIsValid(c)){
    const issue=document.createElement('div');
    issue.className='card-issue';
    issue.innerHTML=`<i class="fas fa-exclamation-triangle"></i> ${c.type==='article'?'Needs a title and some content':'Needs a question, 2+ options, and one marked correct'}`;
    wrap.appendChild(issue);
  }

  if(c.type==='article'){
    wrap.appendChild(renderArticleCardBody(c));
  } else {
    wrap.appendChild(renderMcqCardBody(c));
  }

  vp.appendChild(wrap);
}

function switchCardType(cardId,type){
  const c=cards.find(x=>x.id===cardId);
  if(!c||c.type===type)return;
  const idx=cards.findIndex(x=>x.id===cardId);
  cards[idx]=type==='mcq'?newMcqCard():newArticleCard();
  cards[idx].id=cardId;
  renderAll();
}

/* ── Article card body ── */

  authorBar.innerHTML=`
    <div class="preview-avatar" id="cardAvatar_${c.id}">?</div>
    <div>
      <div class="preview-author-name" id="cardAuthorName_${c.id}">@username</div>
      <div class="preview-author-date">Just now</div>

  const titleArea=document.createElement('div');

/* ── MCQ card body ── */
function renderMcqCardBody(c){
  const frag=document.createElement('div');

  const authorBar=document.createElement('div');
  authorBar.className='preview-author-bar';
  authorBar.innerHTML=`
    <div class="preview-avatar" id="cardAvatar_${c.id}">?</div>
    <div>
      <div class="preview-author-name" id="cardAuthorName_${c.id}">@username</div>
      <div class="preview-author-date">Just now</div>
    </div>`;
  frag.appendChild(authorBar);

  const mcqWrap=document.createElement('div');
  mcqWrap.className='mcq-wrap';
  mcqWrap.setAttribute('data-mcq-card',c.id);
  mcqWrap.innerHTML=`
    <div class="mcq-badge-edit"><i class="fas fa-question-circle"></i> Quick Question</div>
    <textarea class="mcq-question-input" id="mcqQuestion_${c.id}" placeholder="Type your question here…" rows="2"></textarea>
    <div class="mcq-options-wrap" id="mcqOptionsWrap_${c.id}"></div>
    <button class="mcq-add-opt" onclick="addMCQOption('${c.id}')"><i class="fas fa-plus"></i> Add Option</button>
  `;
  frag.appendChild(mcqWrap);

  const spacer=document.createElement('div');spacer.style.height='16px';
  frag.appendChild(spacer);

  populateUser(c.id,'mcq');

  requestAnimationFrame(()=>{
    const qEl=document.getElementById('mcqQuestion_'+c.id);
    if(qEl){
      qEl.value=c.question||'';
      autoResize(qEl);
      qEl.addEventListener('input',function(){c.question=this.value;autoResize(this);refreshThumbValidity();});
    }
    const optsWrap=document.getElementById('mcqOptionsWrap_'+c.id);
    if(optsWrap){
      optsWrap.innerHTML='';
      c.options.forEach((opt,i)=>renderMcqOptionRow(c,i));
    }
  });

  return frag;
}

function renderMcqOptionRow(c,i){
  const wrap=document.getElementById('mcqOptionsWrap_'+c.id);
  if(!wrap)return;
  const opt=c.options[i];
  const row=document.createElement('div');
  row.className='mcq-opt-row'+(opt.correct?' correct-opt':'');
  row.innerHTML=`<div class="mcq-opt-letter">${letters[i]||i+1}</div><input class="mcq-opt-input" placeholder="Option ${letters[i]||i+1}…" value="${escHtml(opt.label||'')}"><button class="mcq-mark-correct" onclick="markMcqCorrect('${c.id}',${i})"><i class="fas fa-check"></i></button><button class="mcq-opt-del" onclick="removeMcqOption('${c.id}',${i})"><i class="fas fa-times"></i></button>`;
  const inp=row.querySelector('.mcq-opt-input');
  inp.addEventListener('input',function(){opt.label=this.value;refreshThumbValidity();});
  wrap.appendChild(row);
}

function addMCQOption(cardId){
  const c=cards.find(x=>x.id===cardId);if(!c)return;
  if(c.options.length>=6)return;
  c.options.push({label:'',correct:false});
  const wrap=document.getElementById('mcqOptionsWrap_'+cardId);
  wrap.innerHTML='';
  c.options.forEach((_,i)=>renderMcqOptionRow(c,i));
}
function markMcqCorrect(cardId,i){
  const c=cards.find(x=>x.id===cardId);if(!c)return;
  c.options.forEach((o,idx)=>o.correct=(idx===i));
  const wrap=document.getElementById('mcqOptionsWrap_'+cardId);
  wrap.innerHTML='';
  c.options.forEach((_,idx)=>renderMcqOptionRow(c,idx));
}
function removeMcqOption(cardId,i){
  const c=cards.find(x=>x.id===cardId);if(!c)return;
  if(c.options.length<=2)return;
  const wasCorrect=c.options[i].correct;
  c.options.splice(i,1);
  if(wasCorrect&&c.options.length)c.options[0].correct=true;
  const wrap=document.getElementById('mcqOptionsWrap_'+cardId);
  wrap.innerHTML='';
  c.options.forEach((_,idx)=>renderMcqOptionRow(c,idx));
  refreshThumbValidity();
}

function refreshThumbValidity(){
  const strip=document.getElementById('thumbStrip');
  [...strip.children].forEach((t,i)=>{
    t.classList.toggle('invalid',!cardIsValid(cards[i]));
  });
}

 HELPERS

function goBack(){if(document.referrer&&document.referrer.includes(location.host))history.back();else location.href='index.html';}
function autoResize(el){el.style.height='auto';el.style.height=el.scrollHeight+'px';}
function showToast(msg,type='success'){
  const t=document.getElementById('toast');

}

function showYtBar(){const bar=document.getElementById('ytInputBar');if(bar){bar.classList.add('show');setTimeout(()=>document.getElementById('ytUrlInput')?.focus(),100);}}
function hideYtBar(){const bar=document.getElementById('ytInputBar');if(bar){bar.classList.remove('show');const i=document.getElementById('ytUrlInput');if(i)i.value='';}}
function extractYtId(url){const m=url.match(/(?:youtu\.be\/|v=|\/v\/|embed\/|shorts\/)([A-Za-z0-9_\-]{11})/);return m?m[1]:null;}

/* ══════════════════════════════════════
 BLOCK ENGINE (operates on the active card's .blocks array)
══════════════════════════════════════ */
function addTextBlock(text=''){
  const c=activeCard();if(!c||c.type!=='article')return;
  const id=genId('blk');
  c.blocks.push({id,type:'text',text});
  renderBlocks(c);
  requestAnimationFrame(()=>{
    const el=document.querySelector(`[data-blk="${id}"] .text-block-textarea`);
    if(el)activateTextEdit(id,el);
  });
}
function addImageBlock(dataUrl,name){const c=activeCard();if(!c)return;c.blocks.push({id:genId('blk'),type:'image',dataUrl,name,caption:''});renderBlocks(c);}
function addAudioBlock(dataUrl,name){const c=activeCard();if(!c)return;c.blocks.push({id:genId('blk'),type:'audio',dataUrl,name,caption:''});renderBlocks(c);}
function addYouTubeBlockData(ytId){const c=activeCard();if(!c)return;c.blocks.push({id:genId('blk'),type:'youtube',ytId,url:`https://www.youtube.com/embed/${ytId}`,caption:''});renderBlocks(c);}
function removeBlock(id){const c=activeCard();if(!c)return;c.blocks=c.blocks.filter(b=>b.id!==id);renderBlocks(c);refreshThumbValidity();}
function moveBlockUp(id){const c=activeCard();if(!c)return;const i=c.blocks.findIndex(b=>b.id===id);if(i>0){[c.blocks[i-1],c.blocks[i]]=[c.blocks[i],c.blocks[i-1]];renderBlocks(c);}}
function moveBlockDown(id){const c=activeCard();if(!c)return;const i=c.blocks.findIndex(b=>b.id===id);if(i<c.blocks.length-1){[c.blocks[i],c.blocks[i+1]]=[c.blocks[i+1],c.blocks[i]];renderBlocks(c);}}

function renderBlocks(c){
  const wrap=document.getElementById('blocksWrap_'+c.id);
  if(!wrap)return;
  document.querySelectorAll('.text-block-textarea').forEach(ta=>{
    const row=ta.closest('[data-blk]');if(!row)return;
    const blk=c.blocks.find(b=>b.id===row.getAttribute('data-blk'));
    if(blk&&blk.type==='text')blk.text=ta.value;
  });
  wrap.innerHTML='';
  if(c.blocks.length===0){c.blocks.push({id:genId('blk'),type:'text',text:''});}
  c.blocks.forEach((blk,idx)=>{
    const row=document.createElement('div');
    row.className='block-row';
    row.dataset.blkrow=blk.id;

    const handleCol=document.createElement('div');
    handleCol.className='block-handle-col';
    if(idx>0){
      const upBtn=document.createElement('button');
      upBtn.className='move-btn';upBtn.title='Move up';
      upBtn.innerHTML='<i class="fas fa-chevron-up"></i>';
      upBtn.onclick=()=>moveBlockUp(blk.id);
      handleCol.appendChild(upBtn);
    }
    if(idx<c.blocks.length-1){
      const dnBtn=document.createElement('button');
      dnBtn.className='move-btn';dnBtn.title='Move down';
      dnBtn.innerHTML='<i class="fas fa-chevron-down"></i>';
      dnBtn.onclick=()=>moveBlockDown(blk.id);
      handleCol.appendChild(dnBtn);
    }

    const content=document.createElement('div');
    content.className='block-content';
    content.setAttribute('data-blk',blk.id);

    if(blk.type==='text'){
      const container=document.createElement('div');
      container.className='text-block-container';

      const display=document.createElement('div');
      display.className='text-block-display';
      display.setAttribute('data-placeholder','Write here…');
      display.setAttribute('data-blk-display',blk.id);
      if(blk.text){display.innerHTML=renderEmojiPreview(blk.text);}
      display.addEventListener('click',()=>activateTextEdit(blk.id,ta));
      display.addEventListener('touchend',()=>{if(!window._hlPending)activateTextEdit(blk.id,ta);});

      const ta=document.createElement('textarea');
      ta.className='text-block-textarea';
      ta.placeholder='Write here…';
      ta.value=blk.text||'';
      ta.rows=1;
      ta.setAttribute('data-blk-ta',blk.id);

      ta.addEventListener('input',function(){
        blk.text=this.value;
        this.style.height='auto';
        this.style.height=this.scrollHeight+'px';
        const disp=document.querySelector(`[data-blk-display="${blk.id}"]`);
        if(disp)disp.innerHTML=blk.text?renderEmojiPreview(blk.text):'';
        refreshThumbValidity();
      });

      ta.addEventListener('blur',()=>{
        blk.text=ta.value;
        ta.classList.remove('editing');
        display.classList.remove('hidden');
        display.innerHTML=blk.text?renderEmojiPreview(blk.text):'';
      });

      let hlPressTimer;
      display.addEventListener('touchstart',()=>{
        hlPressTimer=setTimeout(()=>{
          window._hlPending=true;
          activateTextEdit(blk.id,ta);
          setTimeout(()=>{
            ta.focus();ta.select();
            _hlTargetBlkId=blk.id;
            _hlSavedSel={start:0,end:ta.value.length};
            openHlSheet();
            setTimeout(()=>{window._hlPending=false;},300);
          },200);
        },600);
      },{passive:true});
      display.addEventListener('touchend',()=>clearTimeout(hlPressTimer));
      display.addEventListener('touchmove',()=>clearTimeout(hlPressTimer));

      ta.addEventListener('mouseup',()=>checkTaSelection(blk.id,ta));
      ta.addEventListener('keyup',()=>checkTaSelection(blk.id,ta));
      ta.addEventListener('touchend',()=>{setTimeout(()=>checkTaSelection(blk.id,ta),200);});

      container.appendChild(display);
      container.appendChild(ta);
      content.appendChild(container);

      requestAnimationFrame(()=>{
        ta.style.height='auto';
        ta.style.height=ta.scrollHeight+'px';
      });

    } else if(blk.type==='image'){
      const wrap2=document.createElement('div');wrap2.className='image-block-wrap';
      const img=document.createElement('img');img.src=blk.dataUrl||blk.url||'';img.alt=blk.name||'';img.crossOrigin='anonymous';
      wrap2.appendChild(img);
      const cap=document.createElement('input');cap.className='image-caption-input';cap.placeholder='Add a caption…';cap.value=blk.caption||'';cap.oninput=function(){blk.caption=this.value;};
      wrap2.appendChild(cap);
      content.appendChild(wrap2);
    } else if(blk.type==='youtube'){
      const ytWrap=document.createElement('div');ytWrap.className='yt-block-wrap';
      const ytId=blk.ytId;
      const lbl=document.createElement('div');lbl.className='yt-block-label';
      lbl.innerHTML=`<i class="fab fa-youtube"></i><span>youtube.com/watch?v=${ytId}</span>${ytId?`<a href="https://www.youtube.com/watch?v=${ytId}" target="_blank" rel="noopener">Watch</a>`:''}`;
      ytWrap.appendChild(lbl);
      const iframe=document.createElement('iframe');iframe.src=blk.url;iframe.title='YouTube';iframe.allow='accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture';iframe.allowFullscreen=true;
      ytWrap.appendChild(iframe);
      const cap=document.createElement('input');cap.className='yt-caption-input';cap.placeholder='Add a caption…';cap.value=blk.caption||'';cap.oninput=function(){blk.caption=this.value;};
      ytWrap.appendChild(cap);
      content.appendChild(ytWrap);
    } else if(blk.type==='audio'){
      const audioWrap=document.createElement('div');audioWrap.className='audio-block-wrap';
      const audioId='aud_'+blk.id.replace(/[^a-z0-9]/gi,'');
      const bars=Array(15).fill(0).map(()=>`<div class="waveform-bar" style="height:${Math.random()*60+20}%"></div>`).join('');
      audioWrap.innerHTML=`
        <div class="custom-audio-player">
          <button class="play-btn" onclick="toggleAudio(this,'${audioId}')"><i class="fas fa-play"></i></button>
          <div class="audio-info">
            <div class="audio-title-txt">${escHtml(blk.name||'Audio')}</div>
            <div class="waveform-container" onclick="seekAudio(event,this,'${audioId}')">
              <div class="waveform-progress"></div>
              <div class="waveform-bars">${bars}</div>
            </div>
            <div class="audio-time"><span class="current-time">0:00</span><span class="duration">0:00</span></div>
          </div>
          <audio id="${audioId}" src="${blk.dataUrl||blk.url||''}" style="display:none;"></audio>
        </div>
        <input class="audio-caption-input" placeholder="Add a caption…" value="${escHtml(blk.caption||'')}" oninput="updateBlkCaption('${blk.id}',this.value)">`;
      setTimeout(()=>{const audio=document.getElementById(audioId);if(audio){audio.addEventListener('loadedmetadata',()=>{const dur=Math.floor(audio.duration);const d=audio.closest('.custom-audio-player')?.querySelector('.duration');if(d)d.textContent=`${Math.floor(dur/60)}:${(dur%60).toString().padStart(2,'0')}`;});}},100);
      content.appendChild(audioWrap);
    }

    const actCol=document.createElement('div');actCol.className='block-actions-col';
    const delBtn=document.createElement('button');delBtn.className='blk-act del';delBtn.title='Delete';delBtn.innerHTML='<i class="fas fa-trash"></i>';delBtn.onclick=()=>removeBlock(blk.id);
    actCol.appendChild(delBtn);
    if(blk.type==='text'){
      const hlBtn=document.createElement('button');hlBtn.className='blk-act';hlBtn.title='Highlight selected text';hlBtn.innerHTML='<i class="fas fa-highlighter"></i>';
      hlBtn.addEventListener('click',()=>{
        const ta=document.querySelector(`[data-blk-ta="${blk.id}"]`);
        if(!ta){showToast('Tap text first','error');return;}
        const s=ta.selectionStart,e=ta.selectionEnd;
        if(s===e){showToast('Select text first','error');return;}
        _hlTargetBlkId=blk.id;_hlSavedSel={start:s,end:e};
        openHlSheet();
      });
      hlBtn.addEventListener('touchend',e2=>{
        e2.preventDefault();
        const ta=document.querySelector(`[data-blk-ta="${blk.id}"]`);
        if(!ta){showToast('Tap text to edit first','error');return;}
        const s=ta.selectionStart,en=ta.selectionEnd;
        if(s===en){showToast('Select text first','error');return;}
        _hlTargetBlkId=blk.id;_hlSavedSel={start:s,end:en};
        openHlSheet();
      },{passive:false});
      actCol.appendChild(hlBtn);
    }

    row.appendChild(handleCol);
    row.appendChild(content);
    row.appendChild(actCol);
    wrap.appendChild(row);
  });
}

function activateTextEdit(blkId,ta){
  const disp=document.querySelector(`[data-blk-display="${blkId}"]`);
  if(!disp)return;
  disp.classList.add('hidden');
  ta.classList.add('editing');
  ta.style.height='auto';
  ta.style.height=ta.scrollHeight+'px';
  ta.focus();
  ta.setSelectionRange(ta.value.length,ta.value.length);
}
function checkTaSelection(blkId,ta){
  const s=ta.selectionStart,e=ta.selectionEnd;
  if(s!==e){_hlTargetBlkId=blkId;_hlSavedSel={start:s,end:e};}
}
function updateBlkCaption(id,val){const c=activeCard();if(!c)return;const b=c.blocks.find(x=>x.id===id);if(b)b.caption=val;}

/* ══════════════════════════════════════
 HIGHLIGHT SHEET
══════════════════════════════════════ */
window._hlPending=false;
let _hlTargetBlkId=null,_hlSavedSel=null;
function openHlSheet(){document.getElementById('hlSheetOverlay').classList.add('show');}
function closeHlSheet(){document.getElementById('hlSheetOverlay').classList.remove('show');}
(function(){
  const overlay=document.getElementById('hlSheetOverlay');
  const sheet=document.getElementById('hlSheet');
  let _ots=0,_otm=false;
  overlay.addEventListener('touchstart',e=>{_ots=e.touches[0].clientY;_otm=false;},{passive:true});
  overlay.addEventListener('touchmove',e=>{if(Math.abs(e.touches[0].clientY-_ots)>6)_otm=true;},{passive:true});
  overlay.addEventListener('touchend',e=>{if(_otm)return;if(!sheet.contains(e.target))closeHlSheet();});
  overlay.addEventListener('click',e=>{if(!sheet.contains(e.target))closeHlSheet();});
})();
function applyHighlight(emoji){
  closeHlSheet();
  if(!_hlTargetBlkId||!_hlSavedSel)return;
  const c=activeCard();if(!c)return;
  const blk=c.blocks.find(b=>b.id===_hlTargetBlkId);
  const ta=document.querySelector(`[data-blk-ta="${_hlTargetBlkId}"]`);
  if(!blk||!ta)return;
  const {start,end}=_hlSavedSel;
  const val=ta.value;
  const selected=val.slice(start,end);
  const wrapped=`${emoji}${selected}${emoji}`;
  const newVal=val.slice(0,start)+wrapped+val.slice(end);
  ta.value=newVal;blk.text=newVal;
  ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';
  const disp=document.querySelector(`[data-blk-display="${_hlTargetBlkId}"]`);
  if(disp)disp.innerHTML=renderEmojiPreview(newVal);
  _hlSavedSel=null;_hlTargetBlkId=null;
}

/* ══════════════════════════════════════
 MEDIA HANDLERS
══════════════════════════════════════ */
function handleImage(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>addImageBlock(ev.target.result,f.name);r.readAsDataURL(f);e.target.value='';}
function handleAudio(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>addAudioBlock(ev.target.result,f.name);r.readAsDataURL(f);e.target.value='';}
function addYouTubeBlock(){const url=document.getElementById('ytUrlInput').value.trim();if(!url)return;const id=extractYtId(url);if(!id){showToast('Invalid YouTube URL','error');return;}addYouTubeBlockData(id);hideYtBar();}

/* ══════════════════════════════════════
 AUDIO PLAYER
══════════════════════════════════════ */
window.toggleAudio=function(btn,audioId){
  const player=btn.closest('.custom-audio-player'),audio=document.getElementById(audioId),icon=btn.querySelector('i');
  if(!audio)return;
  if(audio.paused){
    audio.play();icon.className='fas fa-pause';
    audio.ontimeupdate=function(){
      const p=(audio.currentTime/audio.duration)*100;
      const pr=player.querySelector('.waveform-progress');if(pr)pr.style.width=p+'%';
      const ct=player.querySelector('.current-time');
      if(ct){const m=Math.floor(audio.currentTime/60),s=Math.floor(audio.currentTime%60);ct.textContent=`${m}:${s.toString().padStart(2,'0')}`;}
    };
    audio.onended=function(){
      icon.className='fas fa-play';
      const pr=player.querySelector('.waveform-progress');if(pr)pr.style.width='0%';
      const ct=player.querySelector('.current-time');if(ct)ct.textContent='0:00';
    };
  } else {
    audio.pause();icon.className='fas fa-play';
  }
};
window.seekAudio=function(event,container,audioId){
  const audio=document.getElementById(audioId);if(!audio||!audio.duration)return;
  const rect=container.getBoundingClientRect();
  audio.currentTime=((event.clientX-rect.left)/rect.width)*audio.duration;
};

function openReview(){
  commitActiveTextBlocks();
  const body=document.getElementById('reviewBody');
  body.innerHTML='';
  cards.forEach((c,i)=>{
    const card=document.createElement('div');
    card.className='preview-mini-card'+(c.type==='mcq'?' mcq':'');
    if(c.type==='article'){
      const excerpt=(c.blocks.filter(b=>b.type==='text').map(b=>b.text||'').join(' ').trim()).slice(0,140);
      card.innerHTML=`
        <div class="preview-mini-badge">ART ${i+1}</div>
        <div class="preview-mini-title">${escHtml(c.title||'(no title)')}</div>
        <div class="preview-mini-sub">${escHtml(excerpt||'(no content yet)')}${excerpt.length>=140?'…':''}${!cardIsValid(c)?' ⚠️ incomplete':''}</div>`;
    } else {
      const correct=c.options.find(o=>o.correct);
      card.innerHTML=`
        <div class="preview-mini-badge">MCQ ${i+1}</div>
        <div class="preview-mini-title">${escHtml(c.question||'(no question)')}</div>
        <div class="preview-mini-sub">${c.options.filter(o=>o.label&&o.label.trim()).length} options · correct: ${escHtml(correct?correct.label||'—':'none set')}${!cardIsValid(c)?' ⚠️ incomplete':''}</div>`;
    }
    card.onclick=()=>{closeReview();jumpTo(i);};
    body.appendChild(card);
  });
  document.getElementById('reviewSheetOverlay').classList.add('show');
}
function closeReview(){document.getElementById('reviewSheetOverlay').classList.remove('show');}

/* ── Upload a data URI to Supabase Storage, return public URL ── */
async function uploadMediaFile(artId,m,order){
  if(!m.dataUrl||!m.dataUrl.startsWith('data:'))return m.url||'';
  try{
    const res=await fetch(m.dataUrl);
    const blob=await res.blob();
    const ext=m.type==='audio'?'mp3':m.type==='image'?'jpg':'bin';
    const path=`${artId}/${Date.now()}_${order}.${ext}`;
    const{error:upErr}=await supabase.storage.from('article-media').upload(path,blob,{contentType:blob.type,upsert:true});
    if(upErr)throw upErr;
    const{data:pubData}=supabase.storage.from('article-media').getPublicUrl(path);
    return pubData.publicUrl;
  }catch(upEx){
    console.error('[media upload]',upEx);
    return '';
  }
}

async function insertMediaRow(artId,type,url,caption,displayOrder){
  const{error}=await supabase.rpc('insert_media',{
    p_article_id:artId,
    p_type:type,
    p_url:url,
    p_caption:caption||null,
    p_display_order:displayOrder
  });
  if(error)throw error;
}

/* ── Publish all cards (article blocks flattened to paragraphs, same join rule as create.html) ── */
async function doPublishCards(cardList){
  const results={ok:0,fail:0,ids:[]};
  for(let i=0;i<cardList.length;i++){
    const c=cardList[i];
    const pct=Math.round(((i+1)/cardList.length)*80);

    if(c.type==='article'){
      const label=(c.title||'(no title)').slice(0,36)+((c.title||'').length>36?'…':'');
      window.setProgress(`Publishing ${i+1} of ${cardList.length}`,`"${label}"`,pct);
      try{
        const content=c.blocks.filter(b=>b.type==='text').map(b=>(b.text||'').trim()).filter(Boolean).join('\n\n');
        const{data:art,error:insErr}=await supabase.rpc('insert_article',{
          p_firebase_uid:currentUser.uid,
          p_title:c.title||'(no title)',
          p_content:content
        });
        if(insErr)throw insErr;
        const artId=art?.id??art;
        if(!artId)throw new Error('insert_article returned no ID');
        results.ok++;results.ids.push(artId);

        const mediaBlocks=c.blocks.filter(b=>b.type!=='text');
        if(mediaBlocks.length>0){
          /* display order = index of preceding text block, mirroring create.html's rule */
          let lastTextIdx=0,tc=0;const textIdxMap={};
          c.blocks.forEach(b=>{if(b.type==='text')textIdxMap[b.id]=tc++;});
          for(const b of c.blocks){
            if(b.type==='text'){lastTextIdx=textIdxMap[b.id]??lastTextIdx;continue;}
            let mediaUrl=b.url||'';
            if(b.type==='image'||b.type==='audio'){
              mediaUrl=await uploadMediaFile(artId,b,lastTextIdx);
            }
            if(mediaUrl)await insertMediaRow(artId,b.type,mediaUrl,b.caption||null,lastTextIdx);
          }
        }
      }catch(err){console.error('[batch publish article]',err);results.fail++;}

    } else {
      const label=(c.question||'(no question)').slice(0,36)+((c.question||'').length>36?'…':'');
      window.setProgress(`Publishing ${i+1} of ${cardList.length}`,`"${label}"`,pct);
      try{
        const contentLines=c.options.filter(o=>o.label&&o.label.trim()).map(o=>o.correct?`✅${o.label}`:o.label).join('\n');
        const fullContent=`❔${c.question}\n${contentLines}`;
        const{data:art,error:insErr}=await supabase.rpc('insert_article',{
          p_firebase_uid:currentUser.uid,
          p_title:c.question||'(no question)',
          p_content:fullContent
        });
        if(insErr)throw insErr;
        const artId=art?.id??art;
        if(!artId)throw new Error('insert_article returned no ID');
        results.ok++;results.ids.push(artId);
      }catch(err){console.error('[batch publish mcq]',err);results.fail++;}
    }
  }
  return results;
}

/* ── Publish all (with optional library — matches batch.html's single-flow behavior) ── */
window.publishAll=async function(){
  if(!currentUser){window.showToast('Please log in first','error');return;}

  window.commitActiveTextBlocks();

  const validCards=window.cards.filter(c=>window.cardIsValid(c));
  const invalidCount=window.cards.length-validCards.length;
  if(!validCards.length){window.showToast('No complete cards to publish','warning');return;}

  const libName=document.getElementById('libName').value.trim();

  window.lockUI();
  await ensureSupabaseAuth();
  const results=await doPublishCards(validCards);
  window.setProgress('Done!','',libName?90:100);

  if(!libName){
    await new Promise(r=>setTimeout(r,500));
    window.unlockUI();
    if(results.fail===0&&invalidCount===0){
      window.showToast(`${results.ok} card${results.ok!==1?'s':''} published!`,'success');
      window.resetAllCards();
    } else {
      const skippedNote=invalidCount>0?`, ${invalidCount} skipped (incomplete)`:'';
      window.showToast(`${results.ok} published, ${results.fail} failed${skippedNote}`,results.ok>0?'warning':'error');
    }
    return;
  }

  if(results.ids.length===0){
    await new Promise(r=>setTimeout(r,500));
    window.unlockUI();
    window.showToast('All cards failed to publish','error');
    return;
  }

  try{
    const libDesc=document.getElementById('libDesc').value.trim();
    const{data:libraryId,error:libErr}=await supabase.rpc('insert_playlist',{
      p_firebase_uid:currentUser.uid,
      p_name:libName,
      p_description:libDesc||null
    });
    if(libErr)throw libErr;
    window.setProgress('Adding to library…',`${results.ids.length} items`,95);
    for(let pos=0;pos<results.ids.length;pos++){
      const{error:itemErr}=await supabase.rpc('insert_playlist_item',{
        p_playlist_id:libraryId,
        p_article_id:results.ids[pos],
        p_position:pos
      });
      if(itemErr)throw itemErr;
    }
    window.setProgress('Done!','',100);
    await new Promise(r=>setTimeout(r,600));
    window.unlockUI();
    const failNote=results.fail>0?`, ${results.fail} failed`:'';
    const skippedNote=invalidCount>0?`, ${invalidCount} skipped`:'';
    window.showToast(`${results.ok} published & added to "${libName}"${failNote}${skippedNote}`,(results.fail>0||invalidCount>0)?'warning':'success');
    window.resetAllCards();
    document.getElementById('libName').value='';
    document.getElementById('libDesc').value='';
  }catch(err){
    console.error('[library creation]',err);
    window.setProgress('Done!','',100);
    await new Promise(r=>setTimeout(r,500));
    window.unlockUI();
    window.showToast(`${results.ok} published but library failed: ${err.message}`,'warning');
  }
};
