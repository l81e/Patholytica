<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Algorithm Status — Patholytica</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f0e0b;
      --bg2: #141210;
      --bg3: #1a1810;
      --text: #f5f0e8;
      --muted: #8a8070;
      --border: #2a2518;
      --accent: #c8a96e;
      --accent-hover: #b8935a;
      --accent-glow: rgba(200,169,110,0.25);
      --accent-soft: rgba(200,169,110,0.10);
      --green: #6abf85;
      --green-soft: rgba(106,191,133,0.10);
      --red: #c46a4e;
      --red-soft: rgba(196,106,78,0.10);
      --blue: #8aa0c0;
      --blue-soft: rgba(138,160,192,0.10);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Page shell ── */
    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 0 120px;
      position: relative;
    }

    /* ── Top bar ── */
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: rgba(15,14,11,0.92);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      padding-top: calc(14px + env(safe-area-inset-top));
      display: flex; align-items: center; gap: 12px;
    }
    .topbar-back {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--bg3); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--muted);
      transition: color 0.15s, border-color 0.15s;
      flex-shrink: 0;
      text-decoration: none;
    }
    .topbar-back:hover { color: var(--text); border-color: var(--accent); }
    .topbar-title {
      flex: 1;
      font-family: 'Merriweather', serif;
      font-size: 15px; font-weight: 700;
      letter-spacing: -0.02em;
    }
    .topbar-user {
      font-size: 11px; font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid rgba(200,169,110,0.2);
      border-radius: 20px;
      padding: 3px 10px;
    }

    /* ── Section labels ── */
    .section-label {
      font-size: 9px; font-weight: 800;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--muted); padding: 22px 18px 8px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-label::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* ── Overview cards row ── */
    .overview-row {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 10px; padding: 0 18px;
    }
    .overview-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 12px;
      display: flex; flex-direction: column; gap: 6px;
      position: relative; overflow: hidden;
    }
    .overview-card::before {
      content: ''; position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      border-radius: 14px 14px 0 0;
    }
    .overview-card.card-comfort::before { background: linear-gradient(90deg, var(--accent), transparent); }
    .overview-card.card-mastery::before { background: linear-gradient(90deg, var(--green), transparent); }
    .overview-card.card-mcq::before    { background: linear-gradient(90deg, var(--blue), transparent); }

    .ov-icon { font-size: 18px; line-height: 1; }
    .ov-value {
      font-family: 'DM Mono', monospace;
      font-size: 22px; font-weight: 500;
      color: var(--text); line-height: 1;
    }
    .ov-label { font-size: 10px; font-weight: 600; color: var(--muted); }

    /* ── Subject score cards ── */
    .subject-list {
      display: flex; flex-direction: column; gap: 10px;
      padding: 0 18px;
    }
    .subject-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      animation: fadeUp 0.4s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .subject-top {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 12px;
    }
    .subject-icon {
      width: 34px; height: 34px; border-radius: 10px;
      background: var(--accent-soft); border: 1px solid rgba(200,169,110,0.2);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Merriweather', serif;
      font-size: 14px; font-weight: 700; color: var(--accent);
      flex-shrink: 0;
    }
    .subject-name {
      flex: 1;
      font-size: 13px; font-weight: 700; color: var(--text);
      line-height: 1.2;
    }
    .subject-badge {
      font-size: 9px; font-weight: 800; letter-spacing: 0.07em;
      text-transform: uppercase; padding: 3px 8px;
      border-radius: 20px;
    }
    .badge-weak    { background: rgba(196,106,78,0.12); color: var(--red); border: 1px solid rgba(196,106,78,0.25); }
    .badge-mid     { background: rgba(200,169,110,0.10); color: var(--accent); border: 1px solid rgba(200,169,110,0.25); }
    .badge-strong  { background: var(--green-soft); color: var(--green); border: 1px solid rgba(106,191,133,0.25); }
    .badge-new     { background: var(--blue-soft); color: var(--blue); border: 1px solid rgba(138,160,192,0.25); }

    /* Dual progress bars */
    .bars { display: flex; flex-direction: column; gap: 8px; }
    .bar-row {
      display: flex; align-items: center; gap: 10px;
    }
    .bar-label {
      font-size: 10px; font-weight: 600; color: var(--muted);
      width: 48px; flex-shrink: 0;
    }
    .bar-track {
      flex: 1; height: 5px; background: var(--border);
      border-radius: 99px; overflow: hidden;
    }
    .bar-fill {
      height: 100%; border-radius: 99px;
      transition: width 1s cubic-bezier(0.16,1,0.3,1);
      width: 0;
    }
    .bar-fill.comfort { background: linear-gradient(90deg, var(--accent), #e8c870); }
    .bar-fill.mastery { background: linear-gradient(90deg, var(--green), #a0e0b0); }
    .bar-pct {
      font-family: 'DM Mono', monospace;
      font-size: 10px; color: var(--muted);
      width: 26px; text-align: right; flex-shrink: 0;
    }

    /* Skip / appear row */
    .subject-meta {
      display: flex; gap: 12px; margin-top: 10px;
      padding-top: 10px; border-top: 1px solid var(--border);
    }
    .meta-item {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; color: var(--muted);
    }
    .meta-item i { font-size: 10px; }
    .meta-item.skip   { color: var(--red);   }
    .meta-item.appear { color: var(--muted); }
    .skip-rate-pill {
      margin-left: auto;
      font-size: 9px; font-weight: 700;
      padding: 2px 7px; border-radius: 20px;
    }
    .skip-rate-pill.high { background: var(--red-soft); color: var(--red); border: 1px solid rgba(196,106,78,0.25); }
    .skip-rate-pill.mid  { background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(200,169,110,0.2); }
    .skip-rate-pill.low  { background: var(--green-soft); color: var(--green); border: 1px solid rgba(106,191,133,0.2); }

    /* ── MCQ due section ── */
    .mcq-list {
      display: flex; flex-direction: column; gap: 8px;
      padding: 0 18px;
    }
    .mcq-row {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex; align-items: center; gap: 12px;
      animation: fadeUp 0.4s ease both;
    }
    .mcq-row.due { border-color: rgba(196,106,78,0.3); background: rgba(196,106,78,0.04); }
    .mcq-row.soon { border-color: rgba(200,169,110,0.2); }
    .mcq-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .mcq-dot.due  { background: var(--red); box-shadow: 0 0 6px var(--red); animation: pulse 1.5s ease infinite; }
    .mcq-dot.soon { background: var(--accent); }
    .mcq-dot.later { background: var(--green); }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:0.5; transform:scale(1.3); }
    }
    .mcq-info { flex: 1; min-width: 0; }
    .mcq-title {
      font-size: 12px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .mcq-when { font-size: 10px; color: var(--muted); }
    .mcq-rep {
      font-family: 'DM Mono', monospace;
      font-size: 10px; color: var(--muted);
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 6px; padding: 2px 7px; flex-shrink: 0;
    }

    /* ── Empty / loading states ── */
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      gap: 8px; padding: 32px 18px; color: var(--muted); text-align: center;
    }
    .empty-state i { font-size: 32px; opacity: 0.3; color: var(--accent); }
    .empty-state p { font-size: 12px; }

    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-row {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; padding: 24px 18px; color: var(--muted); font-size: 12px;
    }

    /* ── No user state ── */
    .auth-wall {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 60vh;
      gap: 14px; padding: 32px 18px; text-align: center;
    }
    .auth-wall i { font-size: 48px; color: var(--accent); opacity: 0.5; }
    .auth-wall h2 { font-family: 'Merriweather', serif; font-size: 18px; font-weight: 700; }
    .auth-wall p { font-size: 13px; color: var(--muted); max-width: 240px; }
    .auth-btn {
      padding: 12px 28px; border-radius: 12px;
      background: var(--accent); color: #0f0e0b;
      font-size: 13px; font-weight: 800; border: none; cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: background 0.15s;
    }
    .auth-btn:hover { background: var(--accent-hover); }

    /* ── Footer nav ── */
    .footer-bar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px;
      background: rgba(15,14,11,0.96);
      border-top: 1px solid var(--border);
      padding: 8px 24px;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
      display: flex; justify-content: space-around; align-items: center;
      z-index: 100;
      backdrop-filter: blur(20px);
    }
    .footer-btn {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      background: none; border: none; color: var(--muted);
      cursor: pointer; transition: color 0.2s; padding: 6px 12px;
      text-decoration: none;
    }
    .footer-btn:hover { color: var(--text); }
    .footer-btn.active { color: var(--accent); }
    .footer-btn i { font-size: 19px; }
    .footer-btn span { font-size: 10px; font-weight: 600; }

    /* ── Legend chip ── */
    .legend {
      display: flex; gap: 14px; flex-wrap: wrap;
      padding: 0 18px 4px;
    }
    .legend-item {
      display: flex; align-items: center; gap: 5px;
      font-size: 10px; color: var(--muted); font-weight: 500;
    }
    .legend-dot {
      width: 6px; height: 6px; border-radius: 50%;
    }
  </style>
</head>
<body>

<div class="page" id="page">

  <div class="topbar">
    <a class="topbar-back" href="dailyfeed.html">
      <i class="fas fa-arrow-left" style="font-size:13px;"></i>
    </a>
    <div class="topbar-title">Algorithm Status</div>
    <div class="topbar-user" id="topbarUser" style="display:none;"></div>
  </div>

  <div id="mainContent">
    <div class="loading-row"><div class="spinner"></div> Loading…</div>
  </div>

</div>

<div class="footer-bar">

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBs6V0yY14cuLBXB1nciZ-X0eyAiodC-Ak",
  authDomain: "patholytica.firebaseapp.com",
  projectId: "patholytica",
  storageBucket: "patholytica.firebasestorage.app",
  messagingSenderId: "738430635282",

};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const supabase = window.supabase.createClient(
  "https://vduqewqyvszfquntmark.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZkdXFld3F5dnN6ZnF1bnRtYXJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2MTg3MjgsImV4cCI6MjA4NTE5NDcyOH0.V2JellFmUGgYhKfW-D4CBdcBHyPztOlcgLCBdhnXj7c"
);

function formatRelativeTime(isoString) {
  if (!isoString) return '—';
  const date = new Date(isoString);
  const now = new Date();
  const diff = date - now;
  if (diff <= 0) return 'Due now';
  const mins = Math.floor(diff / 60000);
  const hrs  = Math.floor(diff / 3600000);
  const days = Math.floor(diff / 86400000);
  if (mins < 60)  return `in ${mins}m`;
  if (hrs  < 24)  return `in ${hrs}h`;
  return `in ${days}d`;
}

function subjectBadge(mastery, appear) {
  if (appear === 0) return { cls: 'badge-new', label: 'New' };
  if (mastery < 25) return { cls: 'badge-weak',   label: 'Weak' };
  if (mastery < 60) return { cls: 'badge-mid',    label: 'Learning' };
  return              { cls: 'badge-strong', label: 'Strong' };
}

function skipRatePill(skipCount, appearCount) {
  if (appearCount === 0) return { cls: 'low', label: '—' };
  const rate = skipCount / appearCount;
  if (rate > 0.6) return { cls: 'high', label: Math.round(rate * 100) + '% skip' };
  if (rate > 0.3) return { cls: 'mid',  label: Math.round(rate * 100) + '% skip' };
  return              { cls: 'low',  label: Math.round(rate * 100) + '% skip' };
}

async function loadDashboard(user) {
  const content = document.getElementById('mainContent');

  // Update topbar user chip
  const chip = document.getElementById('topbarUser');
  chip.textContent = user.username ? `@${user.username}` : `#${user.user_id}`;
  chip.style.display = '';

  // Fetch all data in parallel
  const [
    { data: scores },
    { data: mcqs },
    { data: playlists }
  ] = await Promise.all([
    supabase.from('user_subject_scores').select('*').eq('user_id', user.user_id),
    supabase.from('mcq_schedule').select('*, articles(title)').eq('user_id', user.user_id).order('next_show_at', { ascending: true }).limit(20),
    supabase.from('playlists').select('id, name')
  ]);

  const playlistMap = {};
  (playlists || []).forEach(p => { playlistMap[p.id] = p.name; });

  const scoreList = (scores || []).sort((a, b) => {
    // Sort: weak mastery first, then by activity
    const aPri = (100 - (a.mastery_score || 0)) * 0.6 + (a.appear_count > 0 ? (a.skip_count / a.appear_count) : 0) * 0.4;
    const bPri = (100 - (b.mastery_score || 0)) * 0.6 + (b.appear_count > 0 ? (b.skip_count / b.appear_count) : 0) * 0.4;
    return bPri - aPri;
  });

  const now = new Date();
  const dueMcqs   = (mcqs || []).filter(m => new Date(m.next_show_at) <= now);
  const futureMcqs = (mcqs || []).filter(m => new Date(m.next_show_at) >  now);

  // ── Overview totals
  const avgComfort = scoreList.length
    ? Math.round(scoreList.reduce((s, r) => s + (r.comfort_score || 0), 0) / scoreList.length) : 0;
  const avgMastery = scoreList.length
    ? Math.round(scoreList.reduce((s, r) => s + (r.mastery_score || 0), 0) / scoreList.length) : 0;
  const totalDue = dueMcqs.length;

  // ── Build HTML
  let html = '';

  // Overview row
  html += `
    <div class="section-label">Overview</div>
    <div class="overview-row">
      <div class="overview-card card-comfort">
        <div class="ov-icon">📖</div>
        <div class="ov-value">${avgComfort}</div>
        <div class="ov-label">Avg Comfort</div>
      </div>
      <div class="overview-card card-mastery">
        <div class="ov-icon">🧠</div>
        <div class="ov-value">${avgMastery}</div>
        <div class="ov-label">Avg Mastery</div>
      </div>
      <div class="overview-card card-mcq">
        <div class="ov-icon">❔</div>
        <div class="ov-value">${totalDue}</div>
        <div class="ov-label">MCQs Due</div>
      </div>
    </div>`;

  // Subject scores
  html += `<div class="section-label">Subjects</div>`;
  html += `
    <div class="legend" style="margin-bottom:10px;">
      <div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div> Comfort</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div> Mastery</div>
    </div>`;

  if (scoreList.length === 0) {
    html += `<div class="empty-state"><i class="fas fa-chart-bar"></i><p>No subject data yet.<br>Start reading to build your profile.</p></div>`;
  } else {
    html += `<div class="subject-list">`;
    scoreList.forEach((row, i) => {
      const name = playlistMap[row.playlist_id] || `Subject #${row.playlist_id}`;
      const comfort = Math.round(row.comfort_score || 0);
      const mastery = Math.round(row.mastery_score || 0);
      const appear  = row.appear_count || 0;
      const skip    = row.skip_count   || 0;
      const badge   = subjectBadge(mastery, appear);
      const pill    = skipRatePill(skip, appear);
      const firstLetter = name.charAt(0).toUpperCase();

      html += `
        <div class="subject-card" style="animation-delay:${i * 0.06}s">
          <div class="subject-top">
            <div class="subject-icon">${firstLetter}</div>
            <div class="subject-name">${name}</div>
            <div class="subject-badge ${badge.cls}">${badge.label}</div>
          </div>
          <div class="bars">
            <div class="bar-row">
              <div class="bar-label">Comfort</div>
              <div class="bar-track"><div class="bar-fill comfort" data-w="${comfort}" style="width:0%"></div></div>
              <div class="bar-pct">${comfort}</div>
            </div>
            <div class="bar-row">
              <div class="bar-label">Mastery</div>
              <div class="bar-track"><div class="bar-fill mastery" data-w="${mastery}" style="width:0%"></div></div>
              <div class="bar-pct">${mastery}</div>
            </div>
          </div>
          <div class="subject-meta">
            <div class="meta-item appear"><i class="fas fa-eye"></i> ${appear} shown</div>
            <div class="meta-item skip"><i class="fas fa-forward"></i> ${skip} skipped</div>
            <div class="skip-rate-pill ${pill.cls}">${pill.label}</div>
          </div>
        </div>`;
    });
    html += `</div>`;
  }

  // MCQ schedule
  html += `<div class="section-label">Spaced Repetition</div>`;

  if (!mcqs || mcqs.length === 0) {
    html += `<div class="empty-state"><i class="fas fa-calendar-check"></i><p>No MCQs scheduled yet.<br>Answer questions in your feed to start.</p></div>`;
  } else {
    html += `<div class="mcq-list">`;

    if (dueMcqs.length > 0) {
      dueMcqs.forEach((m, i) => {
        const title = m.articles?.title || `Article #${m.article_id}`;
        html += `
          <div class="mcq-row due" style="animation-delay:${i * 0.05}s">
            <div class="mcq-dot due"></div>
            <div class="mcq-info">
              <div class="mcq-title">${title}</div>
              <div class="mcq-when" style="color:var(--red)">Due now</div>
            </div>
            <div class="mcq-rep">×${m.rep_count || 0}</div>
          </div>`;
      });
    }

    futureMcqs.slice(0, 8).forEach((m, i) => {
      const title = m.articles?.title || `Article #${m.article_id}`;
      const when  = formatRelativeTime(m.next_show_at);
      const days  = (m.interval_days || 0);
      const dotCls = days < 1 ? 'soon' : 'later';
      html += `
        <div class="mcq-row" style="animation-delay:${(dueMcqs.length + i) * 0.05}s">
          <div class="mcq-dot ${dotCls}"></div>
          <div class="mcq-info">
            <div class="mcq-title">${title}</div>
            <div class="mcq-when">${when} · interval ${days < 1 ? Math.round(days * 1440) + 'm' : Math.round(days) + 'd'}</div>
          </div>
          <div class="mcq-rep">×${m.rep_count || 0}</div>
        </div>`;
    });

    html += `</div>`;
  }

  content.innerHTML = html;

  // Animate bars after render
  requestAnimationFrame(() => {
    document.querySelectorAll('.bar-fill[data-w]').forEach(el => {
      setTimeout(() => {
        el.style.width = el.dataset.w + '%';
      }, 120);
    });
  });
}

onAuthStateChanged(auth, async (firebaseUser) => {
  const content = document.getElementById('mainContent');
  if (!firebaseUser) {
    content.innerHTML = `
      <div class="auth-wall">
        <i class="fas fa-lock"></i>
        <h2>Sign in to view your stats</h2>
        <p>Your algorithm profile is personalised to you. Log in to see it.</p>
        <button class="auth-btn" onclick="window.location.href='https://patholytica.com/login'">Sign In</button>
      </div>`;
    return;
  }
  content.innerHTML = `<div class="loading-row"><div class="spinner"></div> Loading your profile…</div>`;
  try {
    const { data: user, error } = await supabase
      .from('users')
      .select('user_id, username, full_name')
      .eq('firebase_uid', firebaseUser.uid)
      .single();
    if (error || !user) throw error;
    await loadDashboard(user);
  } catch (e) {
    content.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load data.<br>Please try again.</p></div>`;
    console.error(e);
  }
});
</script>
