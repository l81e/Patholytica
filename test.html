<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extract — PDF Text Extractor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --paper:#eef0ec;
    --ink:#1c2620;
    --ink-soft:#5b6660;
    --line:#c7cdc4;
    --accent:#2f6f4f;
    --accent-soft:#dfe9e2;
    --white:#fbfbf9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
  }
  .wrap{
    max-width:820px;
    margin:0 auto;
    padding:48px 24px 80px;
  }
  header{
    border-bottom:1px solid var(--line);
    padding-bottom:24px;
    margin-bottom:32px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    flex-wrap:wrap;
    gap:8px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:28px;
    letter-spacing:-0.01em;
    margin:0;
  }
  .tag{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:var(--ink-soft);
  }
  #dropzone{
    border:1.5px dashed var(--line);
    border-radius:2px;
    padding:56px 24px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
    background:var(--white);
  }
  #dropzone.drag{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  #dropzone .big{
    font-family:'Fraunces', serif;
    font-size:19px;
    margin-bottom:6px;
  }
  #dropzone .small{
    font-size:12px;
    color:var(--ink-soft);
  }
  input[type=file]{display:none;}

  #status{
    margin-top:20px;
    font-size:12px;
    color:var(--ink-soft);
    min-height:16px;
  }
  #status.err{ color:#a4402b; }

  #progressBar{
    height:2px;
    background:var(--line);
    margin-top:8px;
    overflow:hidden;
    display:none;
  }
  #progressFill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .15s ease;
  }

  #resultBlock{ display:none; margin-top:36px; }

  .result-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    flex-wrap:wrap;
    gap:10px;
  }
  .result-head .meta{
    font-size:11px;
    color:var(--ink-soft);
  }
  .actions{ display:flex; gap:8px; }
  button.act{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    background:var(--white);
    border:1px solid var(--line);
    color:var(--ink);
    padding:8px 14px;
    cursor:pointer;
    border-radius:2px;
    transition:background .15s ease, border-color .15s ease;
  }
  button.act:hover{ border-color:var(--accent); }
  button.act.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--white);
  }
  button.act.primary:hover{ opacity:.9; }

  textarea{
    width:100%;
    min-height:420px;
    resize:vertical;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:2px;
    padding:18px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    line-height:1.6;
    color:var(--ink);
  }
  textarea:focus{ outline:2px solid var(--accent); outline-offset:-1px; }

  footer{
    margin-top:40px;
    font-size:11px;
    color:var(--ink-soft);
    border-top:1px solid var(--line);
    padding-top:16px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Extract</h1>
    <div class="tag">PDF → plain text</div>
  </header>

  <div id="dropzone">
    <div class="big">Drop a PDF here, or click to choose one</div>
    <div class="small">Processed entirely in your browser — nothing is uploaded anywhere</div>
    <input type="file" id="fileInput" accept="application/pdf">
  </div>

  <div id="status"></div>
  <div id="progressBar"><div id="progressFill"></div></div>

  <div id="resultBlock">
    <div class="result-head">
      <div class="meta" id="resultMeta"></div>
      <div class="actions">
        <button class="act" id="copyBtn">Copy</button>
        <button class="act primary" id="downloadBtn">Download .txt</button>
      </div>
    </div>
    <textarea id="output" spellcheck="false" readonly></textarea>
  </div>

  <footer>Text extraction only — works best on PDFs with a real text layer, not scanned images.</footer>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const statusEl = document.getElementById('status');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const resultBlock = document.getElementById('resultBlock');
const resultMeta = document.getElementById('resultMeta');
const output = document.getElementById('output');
const copyBtn = document.getElementById('copyBtn');
const downloadBtn = document.getElementById('downloadBtn');

let currentFilename = 'extracted';

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files.length) handleFile(e.target.files[0]);
});

function setStatus(msg, isErr){
  statusEl.textContent = msg;
  statusEl.className = isErr ? 'err' : '';
}

async function handleFile(file){
  if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
    setStatus('That file doesn\'t look like a PDF.', true);
    return;
  }
  currentFilename = file.name.replace(/\.pdf$/i, '') || 'extracted';
  resultBlock.style.display = 'none';
  progressBar.style.display = 'block';
  progressFill.style.width = '0%';
  setStatus('Reading file…');

  try {
    const buffer = await file.arrayBuffer();
    setStatus('Parsing PDF…');
    const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
    const numPages = pdf.numPages;
    let fullText = '';

    for (let i = 1; i <= numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      const pageText = content.items.map(item => item.str).join(' ');
      fullText += pageText.trim() + '\n\n';
      progressFill.style.width = Math.round((i / numPages) * 100) + '%';
      setStatus(`Extracting page ${i} of ${numPages}…`);
    }

    fullText = fullText.trim();

    if (!fullText) {
      setStatus('No extractable text found — this PDF may be scanned images without a text layer.', true);
      progressBar.style.display = 'none';
      return;
    }

    output.value = fullText;
    const wordCount = fullText.split(/\s+/).filter(Boolean).length;
    resultMeta.textContent = `${numPages} page${numPages !== 1 ? 's' : ''} · ~${wordCount.toLocaleString()} words`;
    resultBlock.style.display = 'block';
    setStatus('Done.');
    progressBar.style.display = 'none';
  } catch (err) {
    console.error(err);
    setStatus('Could not read this PDF. It may be corrupted, encrypted, or password-protected.', true);
    progressBar.style.display = 'none';
  }
}

copyBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(output.value);
    copyBtn.textContent = 'Copied';
    setTimeout(() => copyBtn.textContent = 'Copy', 1400);
  } catch {
    output.select();
    document.execCommand('copy');
  }
});

downloadBtn.addEventListener('click', () => {
  const blob = new Blob([output.value], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = currentFilename + '.txt';
  a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
