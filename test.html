<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkers — Hard AI</title>
<style>
:root {
  --sq-dark:  #9b7b4f;
  --sq-light: #e8d5b0;
  --bg0: #0c0c12;
  --bg1: #13131f;
  --bg2: #1c1c2e;
  --gold: #d4a84b;
  --gold2: #f0c96a;
  --red:  #c0392b;
  --red2: #e74c3c;
  --blk:  #1a1a2e;
  --blk2: #2c3e50;
  --text: #c8c8d8;
  --dim:  #555570;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg0);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  gap: 14px;
}

/* ── Header ── */
.header { text-align: center; }
.header h1 {
  font-size: clamp(1.4rem, 4vw, 2rem);
  font-weight: 200;
  letter-spacing: 10px;
  text-transform: uppercase;
  color: var(--gold);
  text-shadow: 0 0 30px rgba(212,168,75,.35);
}
.header p {
  font-size: .68rem;
  letter-spacing: 4px;
  color: var(--dim);
  text-transform: uppercase;
  margin-top: 3px;
}

/* ── Status bar ── */
.status-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 40px;
  padding: 7px 20px;
  min-width: 220px;
  justify-content: center;
}
#status {
  font-size: .85rem;
  letter-spacing: 1.5px;
  transition: color .3s;
}
#status.you  { color: var(--red2); }
#status.bot  { color: var(--dim); }
#status.win  { color: #2ecc71; font-weight: 600; }
#status.lose { color: var(--red2); font-weight: 600; }
#status.draw { color: var(--gold); font-weight: 600; }

.spinner {
  width: 13px; height: 13px;
  border: 2px solid rgba(255,255,255,.1);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin .65s linear infinite;
  display: none;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Board shell ── */
.board-shell {
  position: relative;
  padding: 10px;
  background: linear-gradient(145deg, var(--bg2), var(--bg1));
  border-radius: 6px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.05),
    0 24px 70px rgba(0,0,0,.7),
    0 0 60px rgba(212,168,75,.05);
}

#board {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows:    repeat(8, 1fr);
  width:  min(86vw, 460px);
  height: min(86vw, 460px);
  border-radius: 3px;
  overflow: hidden;
}

/* ── Squares ── */
.sq {
  display: flex; align-items: center; justify-content: center;
  position: relative;
  cursor: pointer;
  user-select: none;
  transition: background .15s;
}
.sq.light { background: var(--sq-light); }
.sq.dark  { background: var(--sq-dark); }
.sq.sel   { background: rgba(70,210,110,.3) !important;
             box-shadow: inset 0 0 0 2px rgba(70,210,110,.65); }
.sq.dot::after {
  content: '';
  position: absolute;
  width: 28%; height: 28%;
  border-radius: 50%;
  background: rgba(240,200,60,.75);
  box-shadow: 0 0 8px rgba(240,200,60,.5);
  z-index: 3;
  pointer-events: none;
  animation: popIn .18s cubic-bezier(.34,1.56,.64,1) both;
}
.sq.cap-target::after {
  width: 84%; height: 84%;
  border-radius: 50%;
  background: rgba(255,80,40,.18);
  border: 2px solid rgba(255,120,50,.55);
}
@keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }

/* ── Pieces ── */
.piece {
  width: 76%; height: 76%;
  border-radius: 50%;
  position: relative;
  z-index: 2;
  transition: transform .12s;
  animation: pieceIn .22s cubic-bezier(.34,1.56,.64,1) both;
  pointer-events: none;
}
@keyframes pieceIn { from { transform: scale(.2); opacity:0; } to { transform: scale(1); opacity:1; } }

.piece.player {
  background: radial-gradient(circle at 38% 30%, #e84040, #7a1010);
  box-shadow:
    inset 0 3px 7px rgba(255,255,255,.28),
    inset 0 -2px 5px rgba(0,0,0,.5),
    0 5px 12px rgba(0,0,0,.55);
}
.piece.bot {
  background: radial-gradient(circle at 38% 30%, #3a4a60, #0a0a18);
  box-shadow:
    inset 0 3px 7px rgba(255,255,255,.12),
    inset 0 -2px 5px rgba(0,0,0,.7),
    0 5px 12px rgba(0,0,0,.6);
}
.piece.king::after {
  content: '♛';
  font-size: 1.3rem;
  color: #ffd700;
  position: absolute;
  inset: 0;
  display: flex; align-items: center; justify-content: center;
  text-shadow: 0 1px 4px rgba(0,0,0,.9);
}

/* ── Scoreboard ── */
.scores {
  display: flex;
  gap: 24px;
  align-items: center;
}
.score-side {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.score-pip {
  width: 15px; height: 15px; border-radius: 50%;
}
.score-pip.red { background: radial-gradient(circle at 38% 30%, #e84040, #7a1010); }
.score-pip.blk { background: radial-gradient(circle at 38% 30%, #3a4a60, #0a0a18); border:1px solid #444; }
.score-num { font-size: 1.15rem; font-weight: 600; color: #dde; transition: color .25s; }
.score-lbl { font-size: .65rem; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; }
.score-sep { color: var(--dim); font-size: 1.2rem; }

/* ── Depth / eval meter ── */
.info-bar {
  display: flex; gap: 18px; font-size: .68rem;
  color: var(--dim); letter-spacing: 1px;
  text-transform: uppercase;
}
.info-val { color: var(--gold); font-weight: 600; margin-left: 4px; }

/* ── Button ── */
button {
  padding: 9px 26px;
  font-size: .78rem;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  background: transparent;
  color: var(--gold);
  border: 1px solid rgba(212,168,75,.4);
  border-radius: 30px;
  cursor: pointer;
  transition: all .2s;
}
button:hover {
  background: rgba(212,168,75,.09);
  border-color: var(--gold);
  box-shadow: 0 0 18px rgba(212,168,75,.18);
}

/* ── Move history ── */
.history-wrap {
  width: min(86vw, 460px);
  max-height: 72px;
  overflow-y: auto;
  background: rgba(255,255,255,.02);
  border: 1px solid rgba(255,255,255,.05);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: .65rem;
  color: var(--dim);
  letter-spacing: .5px;
  line-height: 1.8;
  scrollbar-width: thin;
  scrollbar-color: #333 transparent;
}
</style>
</head>
<body>

<div class="header">
  <h1>Checkers</h1>
  <p>Expert AI · Minimax · α-β · ID · TT · QS</p>
</div>

<div class="status-bar">
  <div class="spinner" id="spinner"></div>
  <span id="status" class="you">Your turn — Red</span>
</div>

<div class="board-shell">
  <div id="board"></div>
</div>

<div class="scores">
  <div class="score-side">
    <div class="score-pip red"></div>
    <div class="score-num" id="sp">12</div>
    <div class="score-lbl">You</div>
  </div>
  <div class="score-sep">vs</div>
  <div class="score-side">
    <div class="score-pip blk"></div>
    <div class="score-num" id="sb">12</div>
    <div class="score-lbl">Bot</div>
  </div>
</div>

<div class="info-bar">
  <span>Depth<span class="info-val" id="inf-depth">—</span></span>
  <span>Nodes<span class="info-val" id="inf-nodes">—</span></span>
  <span>TT hits<span class="info-val" id="inf-tt">—</span></span>
</div>

<button onclick="resetGame()">↺ &nbsp; New Game</button>

<div class="history-wrap" id="history"></div>

<script>
/* ═══════════════════════════════════════════════════
   CONSTANTS & GLOBALS
═══════════════════════════════════════════════════ */
const PLAYER = 1, BOT = -1, EMPTY = 0;
const INF = 1e8;

/* Piece values */
const VAL_PIECE = 100;
const VAL_KING  = 185;

/* Positional table — index [row][col], row 0 = top (BOT home) */
const POS = [
  [0, 5, 0, 5, 0, 5, 0, 5],
  [4, 0, 4, 0, 4, 0, 4, 0],
  [0, 3, 0, 4, 0, 4, 0, 3],
  [2, 0, 3, 0, 3, 0, 3, 0],
  [0, 2, 0, 3, 0, 3, 0, 2],
  [1, 0, 2, 0, 2, 0, 2, 0],
  [0, 1, 0, 1, 0, 1, 0, 1],
  [6, 0, 6, 0, 6, 0, 6, 0],   // back row (home) bonus
];

/* ── Zobrist hashing tables ── */
const ZOBRIST = (() => {
  const rng = () => (Math.floor(Math.random() * 0xFFFFFFFF) >>> 0);
  const t = {};
  // t[player][isKing][row][col]
  for (const pl of [PLAYER, BOT])
    for (const k of [0,1])
      for (let r = 0; r < 8; r++)
        for (let c = 0; c < 8; c++) {
          if (!t[pl]) t[pl] = {};
          if (!t[pl][k]) t[pl][k] = {};
          if (!t[pl][k][r]) t[pl][k][r] = {};
          t[pl][k][r][c] = rng();
        }
  return t;
})();

/* Transposition table — Map of hash → {score, depth, flag, move}
   flag: 0=exact, 1=lower(fail-high), 2=upper(fail-low) */
const TT = new Map();
const TT_MAX = 1 << 20;  // ~1M entries

/* ── Game state ── */
let board, turn, selPiece, availMoves, gameOver;
let histLog = [];
let lastStats = { depth: 0, nodes: 0, ttHits: 0 };

/* ═══════════════════════════════════════════════════
   BOARD INIT & HASH
═══════════════════════════════════════════════════ */
function initBoard() {
  board = Array.from({length:8}, () => Array(8).fill(EMPTY));
  for (let r = 0; r < 3; r++)
    for (let c = 0; c < 8; c++)
      if ((r+c)%2===1) board[r][c] = {player:BOT,   isKing:false};
  for (let r = 5; r < 8; r++)
    for (let c = 0; c < 8; c++)
      if ((r+c)%2===1) board[r][c] = {player:PLAYER, isKing:false};
  TT.clear();
}

function boardHash(b) {
  let h = 0;
  for (let r = 0; r < 8; r++)
    for (let c = 0; c < 8; c++) {
      const pc = b[r][c];
      if (pc !== EMPTY)
        h ^= ZOBRIST[pc.player][pc.isKing?1:0][r][c];
    }
  return h;
}

/* ═══════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════ */
function render() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  const jumps = getMoves(turn).some(m => m.jump);

  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const sq = document.createElement('div');
      sq.className = 'sq ' + ((r+c)%2===0 ? 'light' : 'dark');

      const pc = board[r][c];
      if (pc !== EMPTY) {
        const div = document.createElement('div');
        div.className = 'piece ' + (pc.player===PLAYER?'player':'bot');
        if (pc.isKing) div.classList.add('king');
        sq.appendChild(div);
      }

      if (selPiece && selPiece.r===r && selPiece.c===c) sq.classList.add('sel');

      const mv = availMoves.find(m => m.tr===r && m.tc===c);
      if (mv) {
        sq.classList.add('dot');
        if (mv.jump && pc!==EMPTY) sq.classList.add('cap-target');
      }

      sq.addEventListener('click', () => onClick(r, c, jumps));
      el.appendChild(sq);
    }
  }
  updateScores();
}

function updateScores() {
  let p=0, b=0;
  for (let r=0;r<8;r++) for(let c=0;c<8;c++) {
    const pc=board[r][c];
    if(pc!==EMPTY) pc.player===PLAYER?p++:b++;
  }
  document.getElementById('sp').textContent=p;
  document.getElementById('sb').textContent=b;
}

/* ═══════════════════════════════════════════════════
   PLAYER CLICK HANDLER
═══════════════════════════════════════════════════ */
function onClick(r, c, jumpsExist) {
  if (turn!==PLAYER || gameOver) return;
  const pc = board[r][c];

  if (pc!==EMPTY && pc.player===PLAYER) {
    const all = getMoves(PLAYER);
    const pool = jumpsExist ? all.filter(m=>m.jump) : all;
    availMoves = pool.filter(m=>m.fr===r && m.fc===c);
    selPiece = availMoves.length ? {r,c} : null;
    if (!availMoves.length) availMoves=[];
    render(); return;
  }

  const mv = availMoves.find(m=>m.tr===r && m.tc===c);
  if (!mv) return;

  applyMove(board, mv);
  logMove(mv, PLAYER);

  if (mv.jump) {
    const cont = getMoves(PLAYER).filter(m=>m.jump && m.fr===mv.tr && m.fc===mv.tc);
    if (cont.length) {
      selPiece={r:mv.tr,c:mv.tc}; availMoves=cont; render(); return;
    }
  }

  selPiece=null; availMoves=[]; turn=BOT;
  setStatus('Thinking…','bot'); showSpinner(true);
  render();
  setTimeout(doBotTurn, 50);
}

/* ═══════════════════════════════════════════════════
   BOT TURN
═══════════════════════════════════════════════════ */
function doBotTurn() {
  if (gameOver) return;
  const {move, depth, nodes, ttHits} = findBestMove();
  lastStats = {depth, nodes, ttHits};
  document.getElementById('inf-depth').textContent = depth;
  document.getElementById('inf-nodes').textContent = nodes > 999 ? (nodes/1000).toFixed(1)+'k' : nodes;
  document.getElementById('inf-tt').textContent = ttHits > 999 ? (ttHits/1000).toFixed(1)+'k' : ttHits;

  if (move) {
    applyMove(board, move);
    logMove(move, BOT);
    let cur = move;
    while (cur.jump) {
      const nxt = getMoves(BOT).filter(m=>m.jump && m.fr===cur.tr && m.fc===cur.tc);
      if (!nxt.length) break;
      // Pick best continuation by immediate eval
      nxt.sort((a,b) => {
        const ba=copyBoard(board); applyMove(ba,a);
        const bb=copyBoard(board); applyMove(bb,b);
        return evalBoard(bb)-evalBoard(ba);
      });
      cur=nxt[0]; applyMove(board,cur); logMove(cur,BOT);
    }
  }

  showSpinner(false); turn=PLAYER;
  setStatus('Your turn — Red','you');
  render(); checkEnd();
}

/* ═══════════════════════════════════════════════════
   MOVE APPLICATION
═══════════════════════════════════════════════════ */
function applyMove(b, mv) {
  const pc = b[mv.fr][mv.fc];
  b[mv.tr][mv.tc] = pc;
  b[mv.fr][mv.fc] = EMPTY;
  if (mv.jump) b[mv.jr][mv.jc] = EMPTY;
  if (pc.player===PLAYER && mv.tr===0) pc.isKing=true;
  if (pc.player===BOT   && mv.tr===7) pc.isKing=true;
}

/* ═══════════════════════════════════════════════════
   MOVE GENERATION
═══════════════════════════════════════════════════ */
function getMoves(player, b=board) {
  const moves=[], jumps=[];
  for (let r=0;r<8;r++) for (let c=0;c<8;c++) {
    const pc=b[r][c];
    if (pc===EMPTY||pc.player!==player) continue;
    const dirs = pc.isKing?[-1,1]:(player===PLAYER?[-1]:[1]);
    for (const dr of dirs) for (const dc of [-1,1]) {
      const nr=r+dr, nc=c+dc;
      if (nr<0||nr>7||nc<0||nc>7) continue;
      const tgt=b[nr][nc];
      if (tgt===EMPTY) {
        moves.push({fr:r,fc:c,tr:nr,tc:nc,jump:false});
      } else if (tgt.player!==player) {
        const jr2=nr+dr, jc2=nc+dc;
        if (jr2>=0&&jr2<8&&jc2>=0&&jc2<8&&b[jr2][jc2]===EMPTY)
          jumps.push({fr:r,fc:c,tr:jr2,tc:jc2,jump:true,jr:nr,jc:nc});
      }
    }
  }
  return jumps.length?jumps:moves;
}

/* ═══════════════════════════════════════════════════
   MOVE ORDERING (critical for alpha-beta efficiency)
═══════════════════════════════════════════════════ */
function orderMoves(moves, player) {
  return [...moves].sort((a,b)=>{
    if (a.jump!==b.jump) return a.jump?-1:1;
    // Prefer advancement
    const advA = player===BOT ? a.tr : (7-a.tr);
    const advB = player===BOT ? b.tr : (7-b.tr);
    return advB-advA;
  });
}

/* ═══════════════════════════════════════════════════
   BOARD COPY
═══════════════════════════════════════════════════ */
function copyBoard(b) {
  return b.map(row=>row.map(cell=>cell===EMPTY?EMPTY:{...cell}));
}

/* ═══════════════════════════════════════════════════
   STATIC EVALUATION
═══════════════════════════════════════════════════ */
function evalBoard(b) {
  let score=0;
  let botPc=0, plPc=0, botK=0, plK=0;
  let botMob=0, plMob=0;

  for (let r=0;r<8;r++) for (let c=0;c<8;c++) {
    const pc=b[r][c];
    if (pc===EMPTY) continue;
    const isBot = pc.player===BOT;
    const base  = pc.isKing ? VAL_KING : VAL_PIECE;
    const pos   = isBot ? POS[r][c] : POS[7-r][c];

    /* Mobility: open diagonal neighbours */
    let mob=0;
    for (const dr of [-1,1]) for (const dc of [-1,1]) {
      const mr=r+dr, mc=c+dc;
      if (mr>=0&&mr<8&&mc>=0&&mc<8&&b[mr][mc]===EMPTY) mob++;
    }

    /* Dog-hole bonus: corners a1/h8 equivalent are permanently safe */
    const dogHole = ((r===0||r===7)&&(c===0||c===7)) ? 6 : 0;

    /* King safety: kings at board edge are weaker */
    const edgePenalty = pc.isKing && (r===0||r===7||c===0||c===7) ? -4 : 0;

    const total = base + pos*2 + mob + dogHole + edgePenalty;
    if (isBot)  { score+=total; botPc++; if(pc.isKing)botK++; botMob+=mob; }
    else        { score-=total; plPc++;  if(pc.isKing)plK++;  plMob+=mob; }
  }

  /* Trade bonus: if bot is ahead in material, encourage simplification */
  const adv = (botPc - plPc);
  if (adv>0) score += adv*14;

  /* Mobility dominance */
  score += (botMob - plMob)*1.5;

  return score;
}

/* ═══════════════════════════════════════════════════
   QUIESCENCE SEARCH
   Extends search past horizon along jump-only sequences
   to avoid horizon effect.
═══════════════════════════════════════════════════ */
let _nodes=0, _ttHits=0;

function quiesce(b, alpha, beta, isMax, ply) {
  _nodes++;
  const standPat = evalBoard(b);

  if (ply > 8) return standPat;  // quiescence depth cap

  if (isMax) {
    if (standPat >= beta) return beta;
    if (standPat > alpha) alpha = standPat;

    const jumps = getMoves(BOT, b).filter(m=>m.jump);
    if (!jumps.length) return standPat;

    for (const mv of jumps) {
      const nb=copyBoard(b); applyMove(nb,mv);
      const s = quiesce(nb, alpha, beta, false, ply+1);
      if (s>=beta) return beta;
      if (s>alpha) alpha=s;
    }
    return alpha;
  } else {
    if (standPat <= alpha) return alpha;
    if (standPat < beta) beta = standPat;

    const jumps = getMoves(PLAYER, b).filter(m=>m.jump);
    if (!jumps.length) return standPat;

    for (const mv of jumps) {
      const nb=copyBoard(b); applyMove(nb,mv);
      const s = quiesce(nb, alpha, beta, true, ply+1);
      if (s<=alpha) return alpha;
      if (s<beta) beta=s;
    }
    return beta;
  }
}

/* ═══════════════════════════════════════════════════
   MINIMAX + ALPHA-BETA + TT + PVS + NULL MOVE
═══════════════════════════════════════════════════ */
function minimax(b, depth, alpha, beta, isMax, nullOk=true) {
  _nodes++;

  /* ── Transposition table lookup ── */
  const hash = boardHash(b);
  const tte = TT.get(hash);
  if (tte && tte.depth >= depth) {
    _ttHits++;
    if (tte.flag===0) return tte.score;               // exact
    if (tte.flag===1 && tte.score>=beta)  return tte.score; // lower
    if (tte.flag===2 && tte.score<=alpha) return tte.score; // upper
  }

  /* ── Terminal / leaf ── */
  const player = isMax ? BOT : PLAYER;
  const moves = getMoves(player, b);

  if (depth===0) {
    const qs = quiesce(b, alpha, beta, isMax, 0);
    return qs;
  }
  if (!moves.length) return isMax ? -INF : INF;

  /* ── Null-move pruning (don't apply at root or when in danger) ── */
  const R = 2; // reduction factor
  if (nullOk && depth >= R+1 && !isMax) {
    // Give BOT a free move and see if still bad for player
    const nb = copyBoard(b);
    const s = minimax(nb, depth-1-R, alpha, beta, true, false);
    if (s <= alpha) {
      // Fail-low even with free move → prune
      return alpha;
    }
  }

  const ordered = orderMoves(moves, player);
  let bestScore = isMax ? -INF : INF;
  let bestMove = null;
  let origAlpha = alpha;

  for (let i=0; i<ordered.length; i++) {
    const mv = ordered[i];
    const nb = copyBoard(b); applyMove(nb, mv);

    let s;
    /* ── Principal Variation Search ── */
    if (i===0) {
      s = minimax(nb, depth-1, alpha, beta, !isMax);
    } else {
      // Zero-window search first
      if (isMax) {
        s = minimax(nb, depth-1, alpha, alpha+1, false);
        if (s>alpha && s<beta) s = minimax(nb, depth-1, alpha, beta, false); // re-search
      } else {
        s = minimax(nb, depth-1, beta-1, beta, true);
        if (s>alpha && s<beta) s = minimax(nb, depth-1, alpha, beta, true);  // re-search
      }
    }

    if (isMax) {
      if (s>bestScore) { bestScore=s; bestMove=mv; }
      alpha=Math.max(alpha,s);
    } else {
      if (s<bestScore) { bestScore=s; bestMove=mv; }
      beta=Math.min(beta,s);
    }
    if (beta<=alpha) break; // prune
  }

  /* ── Store in TT ── */
  if (TT.size > TT_MAX) TT.clear(); // evict when full
  let flag = 0;
  if (bestScore <= origAlpha) flag=2;
  else if (bestScore >= beta) flag=1;
  TT.set(hash, {score:bestScore, depth, flag, move:bestMove});

  return bestScore;
}

/* ═══════════════════════════════════════════════════
   ITERATIVE DEEPENING ROOT SEARCH
═══════════════════════════════════════════════════ */
function findBestMove() {
  const moves = getMoves(BOT);
  if (!moves.length) return {move:null, depth:0, nodes:0, ttHits:0};

  _nodes=0; _ttHits=0;
  const TIME_LIMIT = 2200; // ms
  const start = Date.now();
  let bestMove = orderMoves(moves, BOT)[0];
  let reachedDepth = 0;

  for (let depth=1; depth<=12; depth++) {
    if (Date.now()-start > TIME_LIMIT) break;

    /* Aspiration windows — narrow window around last score */
    let alpha=-INF, beta=INF;
    let aspireDelta=25;

    let iterBest=null, iterScore=-INF;
    let candidates=[];

    // Try aspiration window (only from depth >=3)
    if (depth>=3 && reachedDepth>0) {
      alpha = iterScore - aspireDelta;
      beta  = iterScore + aspireDelta;
    }

    aspirationLoop: while (true) {
      iterBest=null; iterScore=-INF; candidates=[];
      const ordered = orderMoves(moves, BOT);
      // Prioritize TT move from previous iteration if available
      const ttEntry = TT.get(boardHash(board));
      if (ttEntry?.move) {
        const idx = ordered.findIndex(m=>m.fr===ttEntry.move.fr&&m.fc===ttEntry.move.fc&&m.tr===ttEntry.move.tr&&m.tc===ttEntry.move.tc);
        if (idx>0) { ordered.unshift(...ordered.splice(idx,1)); }
      }

      for (const mv of ordered) {
        if (Date.now()-start > TIME_LIMIT) break aspirationLoop;
        const nb=copyBoard(board); applyMove(nb,mv);
        const s=minimax(nb, depth-1, alpha, beta, false);
        if (s>iterScore) { iterScore=s; iterBest=mv; candidates=[mv]; }
        else if (s===iterScore) candidates.push(mv);
        alpha=Math.max(alpha,s);
      }

      if (iterScore<=alpha-aspireDelta || iterScore>=beta+aspireDelta) {
        // Widen window and retry
        aspireDelta*=4;
        alpha=iterScore-aspireDelta; beta=iterScore+aspireDelta;
        if (aspireDelta>INF/2) { alpha=-INF; beta=INF; } // full window fallback
      } else break;
    }

    if (iterBest) {
      bestMove = candidates[Math.floor(Math.random()*candidates.length)];
      reachedDepth=depth;
    }
    if (Date.now()-start > TIME_LIMIT) break;
  }

  return {move:bestMove, depth:reachedDepth, nodes:_nodes, ttHits:_ttHits};
}

/* ═══════════════════════════════════════════════════
   ENDGAME CHECK
═══════════════════════════════════════════════════ */
function checkEnd() {
  const pm=getMoves(PLAYER), bm=getMoves(BOT);
  const st=document.getElementById('status');
  if (!pm.length && turn===PLAYER) {
    st.textContent='Bot wins. Good game.'; st.className='lose'; gameOver=true;
  } else if (!bm.length && turn===BOT) {
    st.textContent='You win! Exceptional.'; st.className='win'; gameOver=true;
  }
}

/* ═══════════════════════════════════════════════════
   UTILITIES
═══════════════════════════════════════════════════ */
function setStatus(txt,cls) {
  const el=document.getElementById('status');
  el.textContent=txt; el.className=cls;
}
function showSpinner(v) {
  document.getElementById('spinner').style.display=v?'block':'none';
}

function logMove(mv, player) {
  const cols='abcdefgh';
  const who = player===PLAYER ? '🔴' : '⚫';
  const from = cols[mv.fc]+(8-mv.fr);
  const to   = cols[mv.tc]+(8-mv.tr);
  const type = mv.jump ? '×' : '→';
  const h = document.getElementById('history');
  h.textContent += `${who} ${from}${type}${to}  `;
  h.scrollTop = h.scrollHeight;
}

function resetGame() {
  turn=PLAYER; selPiece=null; availMoves=[]; gameOver=false;
  histLog=[];
  document.getElementById('history').textContent='';
  document.getElementById('inf-depth').textContent='—';
  document.getElementById('inf-nodes').textContent='—';
  document.getElementById('inf-tt').textContent='—';
  setStatus('Your turn — Red','you');
  showSpinner(false);
  TT.clear();
  initBoard(); render();
}

/* ── Boot ── */
initBoard();
render();
</script>
