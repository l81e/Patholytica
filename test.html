<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sullivan — Patholytica</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

:root {
  --bg-color: #0f0e0b;
  --text-primary: #f5f0e8;
  --text-secondary: #8a8070;
  --hover-bg: #1a1810;
  --border-color: #2a2518;
  --accent: #c8a96e;
  --accent-hover: #b8935a;
  --accent-glow: rgba(200,169,110,0.25);
  --accent-soft: rgba(200,169,110,0.12);
  --font-article: 'Merriweather', serif;
  --font-ui: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
}
body.theme-dark {
  --bg-color: #0f0e0b; --text-primary: #f5f0e8; --text-secondary: #8a8070;
  --hover-bg: #1a1810; --border-color: #2a2518;
  --accent: #c8a96e; --accent-hover: #b8935a;
  --accent-glow: rgba(200,169,110,0.25); --accent-soft: rgba(200,169,110,0.12);
}
body.theme-light {
  --bg-color: #faf6ee; --text-primary: #1a1710; --text-secondary: #706050;
  --hover-bg: #f0ebe0; --border-color: #e0d8c8;
  --accent: #a07840; --accent-hover: #8a6430;
  --accent-glow: rgba(160,120,64,0.2); --accent-soft: rgba(160,120,64,0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-ui);
  background: var(--bg-color);
  color: var(--text-primary);
  transition: background 0.2s ease, color 0.2s ease;
  display: flex;
  flex-direction: column;
}

.static-header {
  background: var(--bg-color);
  padding-top: env(safe-area-inset-top);
  border-bottom: 1px solid var(--border-color);
  flex-shrink: 0;
  z-index: 20;
  transition: background 0.2s ease, border-color 0.2s ease;
}
.static-header-inner {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px; max-width: 900px; margin: 0 auto;
}
.header-logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.header-logo img { height: 26px; width: auto; transition: filter 0.2s ease; }
body.theme-light .header-logo img { filter: invert(1) grayscale(1); }
.header-divider { width: 1px; height: 20px; background: var(--border-color); }
.sullivan-name {
  font-family: var(--font-article); font-weight: 700; font-size: 15px;
  color: var(--text-primary); letter-spacing: -0.01em;
}
.sullivan-tag {
  font-size: 10px; color: var(--accent); font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em;
  background: var(--accent-soft); padding: 2px 8px; border-radius: 20px;
  border: 1px solid rgba(200,169,110,0.25);
}
.header-right { display: flex; align-items: center; gap: 10px; }
.btn-icon-header {
  width: 34px; height: 34px; border-radius: 50%;
  background: none; border: 1px solid var(--border-color);
  color: var(--text-secondary); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; transition: border-color 0.2s, color 0.2s;
}
.btn-icon-header:hover { border-color: var(--accent); color: var(--accent); }

.search-panel {
  background: var(--bg-color);
  border-bottom: 1px solid var(--border-color);
  max-height: 0; overflow: hidden;
  transition: max-height 0.25s ease, border-color 0.2s ease;
  flex-shrink: 0;
}
.search-panel.open { max-height: 420px; }
.search-panel-inner { max-width: 900px; margin: 0 auto; padding: 14px 18px; }
.search-input-wrapper { position: relative; display: flex; align-items: center; }
.search-icon { position: absolute; left: 14px; color: var(--text-secondary); font-size: 13px; pointer-events: none; }
.search-input {
  width: 100%; padding: 10px 40px 10px 40px;
  border: 1px solid var(--border-color); border-radius: 22px;
  background: var(--hover-bg); color: var(--text-primary);
  font-size: 13px; font-family: var(--font-ui); outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-input::placeholder { color: var(--text-secondary); opacity: 0.7; }
.search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.clear-search {
  position: absolute; right: 8px; width: 26px; height: 26px; border-radius: 50%;
  background: transparent; border: none; color: var(--text-secondary); cursor: pointer;
  display: none; align-items: center; justify-content: center; font-size: 12px;
  transition: background 0.15s, color 0.15s;
}
.clear-search.show { display: flex; }
.clear-search:hover { background: var(--border-color); color: var(--text-primary); }

.filter-tabs { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
.filter-tabs::-webkit-scrollbar { display: none; }
.filter-tab {
  padding: 5px 13px; border-radius: 20px; font-size: 11px; font-weight: 700;
  border: 1px solid var(--border-color); background: none; color: var(--text-secondary);
  cursor: pointer; white-space: nowrap; font-family: var(--font-ui); transition: all 0.15s;
}
.filter-tab:hover { border-color: var(--accent); color: var(--accent); }
.filter-tab.active { background: var(--accent); border-color: var(--accent); color: #0f0e0b; }

.search-results-list { list-style: none; margin-top: 10px; max-height: 260px; overflow-y: auto; }
.search-empty {
  display: flex; flex-direction: column; align-items: center; padding: 28px 14px;
  color: var(--text-secondary); gap: 6px; list-style: none;
}
.search-empty i { font-size: 24px; opacity: 0.2; color: var(--accent); }
.search-empty p { font-size: 11px; opacity: 0.7; }

.search-result-item {
  display: flex; align-items: center; gap: 11px; padding: 10px 6px;
  cursor: pointer; border-radius: 10px; transition: background 0.15s;
}
.search-result-item:hover { background: var(--hover-bg); }
.sr-avatar {
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  background: var(--accent-soft); border: 1.5px solid rgba(200,169,110,0.25);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: var(--accent); overflow: hidden;
}
.sr-avatar img { width: 100%; height: 100%; object-fit: cover; }
.sr-avatar.article { background: rgba(106,191,133,0.12); color: #6abf85; border-color: rgba(106,191,133,0.2); }
.sr-avatar.playlist { background: rgba(106,159,207,0.12); color: #6a9fcf; border-color: rgba(106,159,207,0.2); }
.sr-content { flex: 1; min-width: 0; }
.sr-title {
  font-size: 13px; font-weight: 700; color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-family: var(--font-article);
}
.sr-subtitle {
  font-size: 10.5px; color: var(--text-secondary); font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sr-badge {
  padding: 3px 9px; border-radius: 20px; font-size: 9px; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0;
}
.sr-badge.user { background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(200,169,110,0.25); }
.sr-badge.article { background: rgba(106,191,133,0.1); color: #6abf85; border: 1px solid rgba(106,191,133,0.2); }
.sr-badge.playlist { background: rgba(106,159,207,0.1); color: #6a9fcf; border: 1px solid rgba(106,159,207,0.2); }

@keyframes shimmer { 0%,100%{opacity:0.4} 50%{opacity:0.85} }
.sr-skeleton { display: flex; align-items: center; gap: 11px; padding: 10px 6px; }
.sr-skel-base { background: var(--hover-bg); animation: shimmer 1.6s ease-in-out infinite; border-radius: 6px; }
.sr-skel-avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; }
.sr-skel-content { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.sr-skel-title { height: 11px; width: 55%; border-radius: 4px; }
.sr-skel-subtitle { height: 9px; width: 35%; border-radius: 4px; }

.chat-scroll {
  flex: 1; overflow-y: auto;
  padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
}
.chat-inner { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.chat-welcome {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: 50px 20px 30px; gap: 10px; color: var(--text-secondary);
}
.chat-welcome-icon {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--accent-soft); border: 1.5px solid rgba(200,169,110,0.25);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; color: var(--accent); margin-bottom: 6px;
}
.chat-welcome h2 {
  font-family: var(--font-article); font-size: 19px; font-weight: 700;
  color: var(--text-primary); letter-spacing: -0.01em;
}
.chat-welcome p { font-size: 13px; max-width: 340px; line-height: 1.5; }
.welcome-suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
.suggestion-chip {
  padding: 8px 15px; border-radius: 20px; font-size: 12px; font-weight: 600;
  border: 1px solid var(--border-color); background: var(--hover-bg);
  color: var(--text-secondary); cursor: pointer; font-family: var(--font-ui);
  transition: border-color 0.2s, color 0.2s;
}
.suggestion-chip:hover { border-color: var(--accent); color: var(--accent); }

.msg-row { display: flex; gap: 10px; max-width: 100%; }
.msg-row.user { flex-direction: row-reverse; }
.msg-avatar {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; margin-top: 2px;
}
.msg-avatar.sullivan { background: var(--accent-soft); color: var(--accent); border: 1.5px solid rgba(200,169,110,0.25); }
.msg-avatar.user-av { background: var(--hover-bg); color: var(--text-secondary); border: 1.5px solid var(--border-color); }
.msg-bubble-wrap { display: flex; flex-direction: column; gap: 4px; max-width: 78%; }
.msg-row.user .msg-bubble-wrap { align-items: flex-end; }
.msg-name { font-size: 10.5px; font-weight: 700; color: var(--text-secondary); padding: 0 4px; }
.msg-bubble {
  padding: 11px 14px; border-radius: 16px; font-size: 13.5px; line-height: 1.55;
  white-space: pre-wrap; word-wrap: break-word;
}
.msg-row.sullivan .msg-bubble {
  background: var(--hover-bg); color: var(--text-primary);
  border: 1px solid var(--border-color); border-top-left-radius: 4px;
}
.msg-row.user .msg-bubble {
  background: var(--accent); color: #0f0e0b; font-weight: 500;
  border-top-right-radius: 4px;
}
.msg-bubble a { color: inherit; text-decoration: underline; }

.attached-card {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 11px; border-radius: 12px; margin-bottom: 6px;
  background: rgba(15,14,11,0.12); border: 1px solid rgba(15,14,11,0.18);
  max-width: 260px;
}
.msg-row.sullivan .attached-card {
  background: var(--bg-color); border-color: var(--border-color);
}
.attached-card i { font-size: 13px; color: inherit; opacity: 0.8; flex-shrink: 0; }
.attached-card-text { min-width: 0; }
.attached-card-title {
  font-size: 11.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.attached-card-sub { font-size: 9.5px; opacity: 0.75; }

.tag-chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tag-chip {
  padding: 5px 12px; border-radius: 20px; font-size: 11.5px; font-weight: 700;
  background: var(--accent-soft); color: var(--accent);
  border: 1px solid rgba(200,169,110,0.3);
}

.typing-row { display: flex; gap: 10px; }
.typing-bubble {
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-top-left-radius: 4px; border-radius: 16px;
  padding: 13px 16px; display: flex; gap: 4px; align-items: center;
}
.typing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-secondary); animation: typingBounce 1.3s ease-in-out infinite; }
.typing-dot:nth-child(2) { animation-delay: 0.15s; }
.typing-dot:nth-child(3) { animation-delay: 0.3s; }
@keyframes typingBounce { 0%,60%,100%{ transform: translateY(0); opacity: 0.4; } 30%{ transform: translateY(-4px); opacity: 1; } }

.msg-error { color: #d97a6c; font-size: 12px; padding: 0 4px; }

.composer-bar {
  flex-shrink: 0; background: var(--bg-color);
  border-top: 1px solid var(--border-color);
  padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
  transition: background 0.2s ease, border-color 0.2s ease;
}
.composer-inner { max-width: 900px; margin: 0 auto; }
.composer-input-wrap {
  display: flex; align-items: flex-end; gap: 8px;
  border: 1px solid var(--border-color); border-radius: 22px;
  background: var(--hover-bg); padding: 6px 6px 6px 14px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.composer-input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.composer-textarea {
  flex: 1; border: none; background: none; outline: none; resize: none;
  color: var(--text-primary); font-family: var(--font-ui); font-size: 13.5px;
  line-height: 1.4; max-height: 120px; padding: 7px 0;
}
.composer-textarea::placeholder { color: var(--text-secondary); opacity: 0.7; }
.composer-btn {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 13px; transition: opacity 0.15s, background 0.15s;
}
.composer-btn.search-toggle { background: none; color: var(--text-secondary); border: 1px solid var(--border-color); }
.composer-btn.search-toggle:hover { color: var(--accent); border-color: var(--accent); }
.composer-btn.search-toggle.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.composer-btn.send-btn { background: var(--accent); color: #0f0e0b; }
.composer-btn.send-btn:disabled { opacity: 0.35; pointer-events: none; }
.composer-btn.send-btn:hover:not(:disabled) { background: var(--accent-hover); }

.composer-hint { font-size: 10.5px; color: var(--text-secondary); opacity: 0.6; margin-top: 7px; text-align: center; }
.composer-hint code {
  background: var(--hover-bg); padding: 1px 5px; border-radius: 4px;
  font-family: monospace; font-size: 10px;
}

@media (max-width: 768px) {
  .static-header-inner { padding: 10px 14px; }
  .search-panel-inner { padding: 12px 14px; }
  .chat-scroll { padding: 16px 14px calc(16px + env(safe-area-inset-bottom)); }
  .composer-bar { padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
  .msg-bubble-wrap { max-width: 86%; }
  .sullivan-name { display: none; }
}

</style>
</head>

const SULLIVAN_SYSTEM_PROMPT = `You are Sullivan, the AI study assistant built into Patholytica, a social publishing platform for medical and academic education. You help medical students and educators with pathology, general medicine, and study strategy questions. Be clear, accurate, and concise. Use plain language before jargon. When appropriate, use short lists or bolded terms for scannability, but don't over-format short answers. If asked something outside medicine/education, you can still help, but medical accuracy is your priority. Never invent citations or specific statistics you're not confident about — say so instead.`;

const chatWelcome = document.getElementById('chatWelcome');
const composerInput = document.getElementById('composerInput');
const sendBtn = document.getElementById('sendBtn');
const newChatBtn = document.getElementById('newChatBtn');

const searchToggleComposer = document.getElementById('searchToggleComposer');
const searchInput = document.getElementById('searchInput');
const clearSearchBtn = document.getElementById('clearSearch');
const searchResultsList = document.getElementById('searchResultsList');
const filterTabs = document.querySelectorAll('.filter-tab');

function escHtml(s){
  const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML;
}
function scrollToBottom(){
  requestAnimationFrame(()=>{ chatScroll.scrollTop = chatScroll.scrollHeight; });
}
function autoResizeTextarea(){
  composerInput.style.height='auto';
  composerInput.style.height=Math.min(composerInput.scrollHeight,120)+'px';
}
function handleImageError(img,fallback){
  img.style.display='none';
  img.parentElement.textContent=fallback;
}
function renderMarkdownLite(text){
  const escaped = escHtml(text);
  return escaped.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

function toggleSearchPanel(){
  searchPanel.classList.toggle('open');
  if(searchPanel.classList.contains('open')) searchInput.focus();
}
searchToggleHeader.addEventListener('click', toggleSearchPanel);
searchToggleComposer.addEventListener('click', toggleSearchPanel);

filterTabs.forEach(tab=>{
  tab.addEventListener('click',()=>{
    filterTabs.forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.filter;
    const q = searchInput.value.trim();
    if(q) runSearch(q);
  });
});

clearSearchBtn.addEventListener('click',()=>{
  searchInput.value='';
  clearSearchBtn.classList.remove('show');
  resetSearchResults();
  searchInput.focus();
});

searchInput.addEventListener('input',(e)=>{
  const q = e.target.value.trim();
  clearSearchBtn.classList.toggle('show', !!q);
  if(!q){ resetSearchResults(); return; }
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(()=>runSearch(q), 300);
});

function resetSearchResults(){
  searchResultsList.innerHTML = `<li class="search-empty"><i class="fas fa-search"></i><p>Search, then pick an article to have Sullivan tag it</p></li>`;
}

function showSearchSkeletons(n=4){
  searchResultsList.innerHTML='';
  for(let i=0;i<n;i++){
    const li=document.createElement('li'); li.className='sr-skeleton';
    li.innerHTML=`<div class="sr-skel-base sr-skel-avatar"></div>
      <div class="sr-skel-content">
        <div class="sr-skel-base sr-skel-title"></div>
        <div class="sr-skel-base sr-skel-subtitle"></div>
      </div>`;
    searchResultsList.appendChild(li);
  }
}

async function runSearch(query){
  showSearchSkeletons(4);
  try{
    let results = [];
    if(currentFilter==='all' || currentFilter==='users'){
      const { data: users } = await supabase.from('users').select('*')
        .ilike('username', `%${query}%`).limit(6);
      if(users) results.push(...users.map(u=>({...u, type:'user'})));
    }
    if(currentFilter==='all' || currentFilter==='articles'){
      const { data: articles } = await supabase.from('articles').select('*, media(url)')
        .ilike('title', `%${query}%`).limit(6);
      if(articles){
        const fbUids = [...new Set(articles.map(a=>a.firebase_user_id).filter(Boolean))];
        let um = {};
        if(fbUids.length){
          const { data: authors } = await supabase.from('users').select('firebase_uid,username,pfp').in('firebase_uid', fbUids);
          if(authors) authors.forEach(u=>{ um[u.firebase_uid]=u; });
        }
        results.push(...articles.map(a=>({
          ...a, type:'article',
          authorUsername: um[a.firebase_user_id]?.username || 'Unknown',
          articleImage: a.media?.length>0 ? a.media[0].url : null
        })));
      }
    }
    if(currentFilter==='all' || currentFilter==='playlists'){
      const { data: playlists } = await supabase.from('playlists').select('*')
        .ilike('name', `%${query}%`).limit(6);
      if(playlists) results.push(...playlists.map(p=>({...p, type:'playlist'})));
    }
    renderSearchResults(results);
  } catch(err){
    console.error(err);
    searchResultsList.innerHTML = `<li class="search-empty"><i class="fas fa-triangle-exclamation"></i><p>Search failed — try again</p></li>`;
  }
}

function renderSearchResults(results){
  if(results.length===0){
    searchResultsList.innerHTML = `<li class="search-empty"><i class="fas fa-magnifying-glass"></i><p>No results found</p></li>`;
    return;
  }
  searchResultsList.innerHTML='';
  results.forEach(r=>{
    const li = document.createElement('li');
    li.className='search-result-item';
    if(r.type==='user'){
      const init=(r.username||'U')[0].toUpperCase();
      const av=document.createElement('div'); av.className='sr-avatar';
      if(r.pfp){ const img=document.createElement('img'); img.src=r.pfp; img.onerror=function(){handleImageError(this,init);}; av.appendChild(img); }
      else av.textContent=init;
      li.innerHTML=`<div class="sr-content"><div class="sr-title">@${escHtml(r.username||'Unknown')}</div><div class="sr-subtitle">${escHtml(r.bio||'No bio')}</div></div><span class="sr-badge user">User</span>`;
      li.prepend(av);
      li.onclick=()=> insertPromptAboutUser(r);
    } else if(r.type==='article'){
      const init=(r.title||'A')[0].toUpperCase();
      const av=document.createElement('div'); av.className='sr-avatar article';
      if(r.articleImage){ const img=document.createElement('img'); img.src=r.articleImage; img.onerror=function(){handleImageError(this,init);}; av.appendChild(img); }
      else av.innerHTML='<i class="fas fa-file-alt" style="font-size:13px;"></i>';
      li.innerHTML=`<div class="sr-content"><div class="sr-title">${escHtml(r.title)}</div><div class="sr-subtitle">by @${escHtml(r.authorUsername)}</div></div><span class="sr-badge article">Article</span>`;
      li.prepend(av);
      li.onclick=()=> attachArticleForTagging(r);
    } else if(r.type==='playlist'){
      const av=document.createElement('div'); av.className='sr-avatar playlist';
      av.innerHTML='<i class="fas fa-layer-group" style="font-size:13px;"></i>';
      li.innerHTML=`<div class="sr-content"><div class="sr-title">${escHtml(r.name)}</div><div class="sr-subtitle">${r.article_count||0} article${(r.article_count||0)!==1?'s':''}</div></div><span class="sr-badge playlist">Library</span>`;
      li.prepend(av);
      li.onclick=()=> insertPromptAboutLibrary(r);
    }
    searchResultsList.appendChild(li);
  });
}

function closeSearchPanel(){ searchPanel.classList.remove('open'); }

function attachArticleForTagging(article){
  attachedArticle = { id: article.id, title: article.title, content: article.content || '', authorUsername: article.authorUsername };
  closeSearchPanel();
  composerInput.value = `Tag this article: "${article.title}"`;
  autoResizeTextarea(); updateSendState(); composerInput.focus();
}
function insertPromptAboutUser(user){
  closeSearchPanel();
  composerInput.value = `Tell me a bit about what @${user.username} tends to write about, based on their profile.`;
  autoResizeTextarea(); updateSendState(); composerInput.focus();
}
function insertPromptAboutLibrary(playlist){
  closeSearchPanel();
  composerInput.value = `What kind of topics would you expect in a library called "${playlist.name}"?`;
  autoResizeTextarea(); updateSendState(); composerInput.focus();
}

composerInput.addEventListener('input', ()=>{ autoResizeTextarea(); updateSendState(); });
composerInput.addEventListener('keydown', (e)=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});
sendBtn.addEventListener('click', sendMessage);

document.querySelectorAll('.suggestion-chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    composerInput.value = chip.dataset.prompt;
    autoResizeTextarea(); updateSendState(); sendMessage();
  });
});

function updateSendState(){
  sendBtn.disabled = isSending || composerInput.value.trim().length===0;
}

newChatBtn.addEventListener('click', ()=>{
  chatHistory = []; attachedArticle = null;
  chatInner.innerHTML = ''; chatInner.appendChild(chatWelcome);
});

async function sendMessage(){
  const text = composerInput.value.trim();
  if(!text || isSending) return;
  const articleForThisTurn = attachedArticle;
  attachedArticle = null;
  removeWelcome();
  appendUserMessage(text, articleForThisTurn);
  composerInput.value=''; autoResizeTextarea();
  isSending = true; updateSendState();
  const typingEl = appendTypingIndicator();
  try {
    const reply = await callGemini(text, articleForThisTurn);
    typingEl.remove();
    appendSullivanMessage(reply, articleForThisTurn);
    chatHistory.push({ role:'user', text: buildUserTurnForHistory(text, articleForThisTurn) });
    chatHistory.push({ role:'model', text: reply });
  } catch(err){
    console.error(err);
    typingEl.remove();
    appendErrorMessage(err);
  } finally {
    isSending = false; updateSendState();
  }
}

function removeWelcome(){ if(chatWelcome.parentElement) chatWelcome.remove(); }

function buildUserTurnForHistory(text, article){
  if(article) return `${text}\n\n[Attached article: "${article.title}"]\n${article.content.slice(0,4000)}`;
  return text;
}

function appendUserMessage(text, article){
  const row = document.createElement('div'); row.className='msg-row user';
  const av = document.createElement('div'); av.className='msg-avatar user-av'; av.innerHTML='<i class="fas fa-user"></i>';
  const wrap = document.createElement('div'); wrap.className='msg-bubble-wrap';
  const bubble = document.createElement('div'); bubble.className='msg-bubble';
  if(article){
    const card = document.createElement('div'); card.className='attached-card';
    card.innerHTML = `<i class="fas fa-file-alt"></i><div class="attached-card-text"><div class="attached-card-title">${escHtml(article.title)}</div><div class="attached-card-sub">by @${escHtml(article.authorUsername)}</div></div>`;
    bubble.appendChild(card);
  }
  const textNode = document.createElement('div'); textNode.textContent = text;
  bubble.appendChild(textNode); wrap.appendChild(bubble);
  row.appendChild(av); row.appendChild(wrap); chatInner.appendChild(row); scrollToBottom();
}

function appendSullivanMessageBase(replyText){
  const row = document.createElement('div'); row.className='msg-row sullivan';
  const av = document.createElement('div'); av.className='msg-avatar sullivan'; av.innerHTML='<i class="fas fa-feather-pointed"></i>';
  const wrap = document.createElement('div'); wrap.className='msg-bubble-wrap';
  const name = document.createElement('div'); name.className='msg-name'; name.textContent='Sullivan';
  const bubble = document.createElement('div'); bubble.className='msg-bubble'; bubble.innerHTML = renderMarkdownLite(replyText);
  wrap.appendChild(name); wrap.appendChild(bubble);
  row.appendChild(av); row.appendChild(wrap); chatInner.appendChild(row); scrollToBottom();
}

function appendSullivanMessage(replyText, article){
  const displayText = article ? replyText.replace(/TAGS:\s*.+/i, '').trim() : replyText;
  appendSullivanMessageBase(displayText);
  if(article){
    const lastBubble = chatInner.querySelector('.msg-row.sullivan:last-child .msg-bubble');
    if(lastBubble) extractAndRenderTags(lastBubble, replyText);
  }
}

function appendTypingIndicator(){
  const row = document.createElement('div'); row.className='msg-row sullivan typing-row';
  row.innerHTML = `<div class="msg-avatar sullivan"><i class="fas fa-feather-pointed"></i></div>
    <div class="typing-bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;
  chatInner.appendChild(row); scrollToBottom(); return row;
}

function appendErrorMessage(err){
  const row = document.createElement('div'); row.className='msg-row sullivan';
  row.innerHTML = `<div class="msg-avatar sullivan"><i class="fas fa-feather-pointed"></i></div>
    <div class="msg-bubble-wrap">
      <div class="msg-bubble">Something went wrong reaching Sullivan's brain.</div>
      <div class="msg-error">${escHtml(err.message || 'Unknown error')}</div>
    </div>`;
  chatInner.appendChild(row); scrollToBottom();
}

async function callGemini(userText, article){
  let promptText = userText;
  if(article){
    promptText =
`The user wants topic tags for the following Patholytica article.

Title: ${article.title}
Author: @${article.authorUsername}
Content:
"""
${article.content.slice(0, 6000)}
"""

User's message: "${userText}"

Respond in two parts:
1. A short (1-2 sentence) natural-language read of what the article is about.
2. On its own line, output: TAGS: tag one, tag two, tag three (5-8 concise topic tags, comma-separated, no numbering, lowercase unless a proper noun/eponym).`;
  }

  const contents = [];
  for(const turn of chatHistory){
    contents.push({ role: turn.role, parts: [{ text: turn.text }] });
  }
  contents.push({ role: 'user', parts: [{ text: promptText }] });

  const res = await fetch(EDGE_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'apikey': SUPABASE_ANON_KEY,
    },
    body: JSON.stringify({
      model: 'gemini-2.0-flash',
      contents,
      systemInstruction: { parts: [{ text: SULLIVAN_SYSTEM_PROMPT }] },
      generationConfig: { temperature: 0.7, maxOutputTokens: 1024 }
    })
  });

  if(!res.ok){
    const errText = await res.text().catch(()=> '');
    throw new Error(`Sullivan error (${res.status}): ${errText.slice(0,200)}`);
  }

  const data = await res.json();
  const candidate = data?.candidates?.[0];
  if(!candidate){
    const blockReason = data?.promptFeedback?.blockReason;
    throw new Error(blockReason ? `Blocked: ${blockReason}` : 'No response from Sullivan');
  }
  const rawText = candidate?.content?.parts?.map(p=>p.text||'').join('') || '';
  return rawText.trim() || "I wasn't able to generate a response for that — try rephrasing?";
}

function extractAndRenderTags(bubbleEl, replyText){
  const match = replyText.match(/TAGS:\s*(.+)/i);
  if(!match) return;
  const tags = match[1].split(',').map(t=>t.trim()).filter(Boolean);
  if(tags.length===0) return;
  const row = document.createElement('div'); row.className='tag-chip-row';
  tags.forEach(t=>{
    const chip = document.createElement('span'); chip.className='tag-chip'; chip.textContent = t;
    row.appendChild(chip);
  });
  bubbleEl.appendChild(row);
}

composerInput.focus();
</script>
