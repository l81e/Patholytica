<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Home - Patholytica</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #0f0e0b;
      --text-primary: #f5f0e8;
      --text-secondary: #8a8070;
      --card-bg: #0f0e0b;
      --hover-bg: #1a1810;
      --border-color: #2a2518;
      --accent: #c8a96e;
      --accent-hover: #b8935a;
      --accent-glow: rgba(200, 169, 110, 0.25);
      --accent-soft: rgba(200, 169, 110, 0.12);
    }
    body.light-theme {
      --bg-color: #faf6ee;
      --text-primary: #1a1710;
      --text-secondary: #706050;
      --card-bg: #faf6ee;
      --hover-bg: #f0ebe0;
      --border-color: #e0d8c8;
      --accent: #a07840;
      --accent-hover: #8a6430;
      --accent-glow: rgba(160, 120, 64, 0.2);
      --accent-soft: rgba(160, 120, 64, 0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-color);
      color: var(--text-primary);
      overflow: hidden;
      position: fixed;
      width: 100%;
      height: 100%;
    }
    .app-container {
      position: fixed;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 450px;
      height: 100vh;
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    .home-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(14px + env(safe-area-inset-top)) 18px 12px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-color);
      position: relative;
      z-index: 10;
    }
    .header-logo {
      display: flex; align-items: center; gap: 8px;
    }
    .header-logo img { height: 22px; width: auto; }
    .header-logo-text {
      font-family: 'Merriweather', serif;
      font-size: 16px; font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }
    .header-actions {
      display: flex; align-items: center; gap: 10px;
    }
    .header-icon-btn {
      position: relative;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--hover-bg);
      border: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 15px;
      transition: border-color 0.2s ease, color 0.2s ease;
    }
    .header-icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    .notif-badge {
      position: absolute; top: -2px; right: -2px;
      background: var(--accent);
      color: #0f0e0b;
      font-size: 8px; font-weight: 800;
      width: 16px; height: 16px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--bg-color);
    }
    .header-avatar {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #8a6430);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700;
      color: #0f0e0b;
      overflow: hidden; cursor: pointer;
      border: 1.5px solid var(--border-color);
      transition: border-color 0.2s ease;
    }
    .header-avatar:hover { border-color: var(--accent); }
    .header-avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* ── SCROLL BODY ── */
    .home-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }
    .home-scroll::-webkit-scrollbar { width: 2px; }
    .home-scroll::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

    /* ── WELCOME STRIP ── */
    .welcome-strip {
      padding: 16px 18px 0;
    }
    .welcome-greeting {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 2px;
      letter-spacing: 0.02em;
    }
    .welcome-name {
      font-family: 'Merriweather', serif;
      font-size: 20px; font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .welcome-name span { color: var(--accent); }

    /* ── STAT CARDS ── */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 14px 18px 0;
    }
    .stat-card {
      background: var(--hover-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 13px 14px;
      display: flex; align-items: center; gap: 10px;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
      text-decoration: none;
    }
    .stat-card:hover { border-color: var(--accent); background: rgba(200,169,110,0.06); }
    .stat-card-icon {
      width: 34px; height: 34px;
      border-radius: 10px;
      background: var(--accent-soft);
      border: 1px solid rgba(200,169,110,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: var(--accent);
      flex-shrink: 0;
    }
    .stat-card-info { min-width: 0; }
    .stat-card-value {
      font-size: 19px; font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 2px;
    }
    .stat-card-label {
      font-size: 10px; font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ── SECTION HEADER ── */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 18px 10px;
    }
    .section-title {
      font-size: 11px; font-weight: 900;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--accent);
      display: flex; align-items: center; gap: 6px;
    }
    .section-link {
      font-size: 11px; font-weight: 700;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .section-link:hover { color: var(--accent); }

    /* ── SAVED ARTICLES ── */
    .saved-list {
      padding: 0 18px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .saved-item {
      display: flex; align-items: center; gap: 12px;
      background: var(--hover-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
      text-decoration: none;
    }
    .saved-item:hover { border-color: var(--accent); background: rgba(200,169,110,0.05); }
    .saved-item-icon {
      width: 34px; height: 34px; flex-shrink: 0;
      border-radius: 9px;
      background: var(--accent-soft);
      border: 1px solid rgba(200,169,110,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: var(--accent);
    }
    .saved-item-info { flex: 1; min-width: 0; }
    .saved-item-title {
      font-size: 13px; font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .saved-item-meta {
      font-size: 11px; color: var(--text-secondary);
    }
    .saved-item-arrow {
      font-size: 11px; color: var(--border-color);
      flex-shrink: 0;
    }

    /* ── FEED PREVIEW ── */
    .feed-list {
      padding: 0 18px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .feed-card {
      background: var(--hover-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
      text-decoration: none;
      display: block;
    }
    .feed-card:hover { border-color: var(--accent); background: rgba(200,169,110,0.04); }
    .feed-card-header {
      display: flex; align-items: center; gap: 9px;
      margin-bottom: 9px;
    }
    .feed-avatar {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), #8a6430);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700; color: #0f0e0b;
      overflow: hidden;
    }
    .feed-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .feed-meta { flex: 1; min-width: 0; }
    .feed-author {
      font-size: 12px; font-weight: 700;
      color: var(--text-primary);
    }
    .feed-time { font-size: 10px; color: var(--text-secondary); }
    .feed-title {
      font-family: 'Merriweather', serif;
      font-size: 14px; font-weight: 700;
      color: var(--text-primary);
      line-height: 1.35;
      margin-bottom: 9px;
      letter-spacing: -0.01em;
    }
    .feed-card-footer {
      display: flex; align-items: center; gap: 12px;
    }
    .feed-stat {
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600; color: var(--text-secondary);
    }
    .feed-stat i { font-size: 10px; }
    .feed-stat.likes i { color: #d4845a; }
    .feed-stat.comments i { color: var(--accent); }
    .feed-read-btn {
      margin-left: auto;
      font-size: 10px; font-weight: 800;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid rgba(200,169,110,0.2);
      border-radius: 20px;
      padding: 4px 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* MCQ badge inside feed */
    .mcq-feed-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--accent-soft);
      border: 1px solid rgba(200,169,110,0.25);
      border-radius: 20px; padding: 3px 9px;
      font-size: 9px; font-weight: 800;
      letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 6px;
      align-self: flex-start;
    }

    /* ── LIBRARY SHELF ── */
    .library-shelf-wrap {
      padding-top: 4px;
      overflow: visible;
      margin-bottom: 4px;
    }
    .library-shelf {
      display: flex; gap: 10px;
      width: calc(100% + 36px);
      margin-left: -18px;
      padding-left: 18px;
      padding-right: 18px;
      overflow-x: auto;
      overflow-y: visible;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 8px;
    }
    .library-shelf::-webkit-scrollbar { height: 2px; }
    .library-shelf::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
    .lib-card {
      flex-shrink: 0; width: 110px;
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
      text-decoration: none;
    }
    .lib-card:hover { transform: translateY(-4px) scale(1.02); }
    .lib-poster {
      width: 110px; height: 160px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1e1a10, #0e0c08);
      border: 1px solid var(--border-color);
      overflow: hidden;
      position: relative;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .lib-card:hover .lib-poster {
      box-shadow: 0 12px 32px rgba(0,0,0,0.7), 0 0 0 2px rgba(200,169,110,0.5);
      border-color: rgba(200,169,110,0.5);
    }
    .lib-poster img { width: 100%; height: 100%; object-fit: cover; }
    .lib-poster-placeholder {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 6px;
    }
    .lib-poster-letter {
      font-family: 'Merriweather', serif;
      font-size: 22px; font-weight: 800;
      color: rgba(200,169,110,0.2);
    }
    .lib-poster-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(10,8,5,0.92) 0%, transparent 55%);
      display: flex; flex-direction: column; justify-content: flex-end; padding: 7px;
    }
    .lib-count {
      display: inline-flex; align-items: center; gap: 3px;
      background: rgba(200,169,110,0.18);
      border: 1px solid rgba(200,169,110,0.25);
      border-radius: 5px; padding: 2px 5px;
      font-size: 9px; font-weight: 700; color: var(--accent);
      align-self: flex-start;
    }
    .lib-info { padding: 6px 2px 0; }
    .lib-name {
      font-size: 11px; font-weight: 700;
      color: var(--text-primary); line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
      transition: color 0.2s ease;
    }
    .lib-card:hover .lib-name { color: var(--accent); }

    /* ── ACTIVE CREATORS ── */
    .creators-row {
      display: flex; gap: 14px;
      width: calc(100% + 36px);
      margin-left: -18px;
      padding-left: 18px;
      padding-right: 18px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
    }
    .creators-row::-webkit-scrollbar { height: 2px; }
    .creators-row::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
    .creator-item {
      flex-shrink: 0;
      display: flex; flex-direction: column;
      align-items: center; gap: 6px;
      cursor: pointer; text-decoration: none;
    }
    .creator-avatar-wrap {
      position: relative;
    }
    .creator-avatar {
      width: 52px; height: 52px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #8a6430);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: #0f0e0b;
      overflow: hidden;
      border: 2px solid var(--border-color);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .creator-item:hover .creator-avatar {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .creator-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .creator-name {
      font-size: 10px; font-weight: 700;
      color: var(--text-secondary);
      max-width: 56px;
      text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: color 0.2s ease;
    }
    .creator-item:hover .creator-name { color: var(--accent); }

    /* ── SKELETON ── */
    @keyframes shimmer { 0%,100%{opacity:0.4} 50%{opacity:0.85} }
    .skel { background: var(--hover-bg); animation: shimmer 1.6s infinite; border-radius: 6px; }

    /* ── FOOTER (exact match) ── */
    .footer-bar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 450px;
      background: rgba(15,14,11,0.96);
      border-top: 1px solid var(--border-color);
      padding: 8px 24px;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
      display: flex; justify-content: space-around; align-items: center;
      z-index: 100;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    }
    .footer-btn {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      background: none; border: none; color: var(--text-secondary);
      cursor: pointer; transition: color 0.2s ease; padding: 6px 12px;
    }
    .footer-btn:hover { color: var(--text-primary); }
    .footer-btn.active { color: var(--accent); }
    .footer-btn i { font-size: 19px; }
    .footer-btn span { font-size: 10px; font-weight: 600; }
    @media (max-width: 768px) {
      .footer-bar { padding: 8px 16px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
      .footer-btn { padding: 6px 8px; }
      .footer-btn i { font-size: 17px; }
      .footer-btn span { font-size: 9px; }
    }

    /* ── EMPTY / ERROR STATES ── */
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      gap: 8px; padding: 24px 18px;
      color: var(--text-secondary); font-size: 12px; text-align: center;
    }
    .empty-state i { font-size: 28px; color: var(--accent); opacity: 0.3; }
  </style>
</head>
<body>

<div class="app-container" id="appContainer">

  <!-- HEADER -->
  <div class="home-header">
    <div class="header-logo">
      <img src="IMG_3220.png" alt="Patholytica" onerror="this.style.display='none'">
      <div class="header-logo-text">Patholytica</div>
    </div>
    <div class="header-actions">
      <div class="header-icon-btn" id="notifBtn" onclick="window.location.href='notifications.html'">
        <i class="fas fa-bell"></i>
        <div class="notif-badge" id="notifBadge" style="display:none;">0</div>
      </div>
      <div class="header-avatar" id="headerAvatar" onclick="window.location.href='profile.html'">
        <i class="fas fa-user" style="font-size:13px;"></i>
      </div>
    </div>
  </div>

  <!-- SCROLL BODY -->
  <div class="home-scroll" id="homeScroll">

    <!-- WELCOME -->
    <div class="welcome-strip">
      <div class="welcome-greeting">Good to see you</div>
      <div class="welcome-name" id="welcomeName">Welcome back <span>👋</span></div>
    </div>

    <!-- STATS -->
    <div class="stats-grid" id="statsGrid">
      <a class="stat-card" href="profile.html">
        <div class="stat-card-icon"><i class="fas fa-file-alt"></i></div>
        <div class="stat-card-info">
          <div class="stat-card-value" id="statArticles">—</div>
          <div class="stat-card-label">Articles</div>
        </div>
      </a>
      <a class="stat-card" href="library.html">
        <div class="stat-card-icon"><i class="fas fa-layer-group"></i></div>
        <div class="stat-card-info">
          <div class="stat-card-value" id="statLibraries">—</div>
          <div class="stat-card-label">Libraries</div>
        </div>
      </a>
      <a class="stat-card" href="profile.html?tab=followers">
        <div class="stat-card-icon"><i class="fas fa-users"></i></div>
        <div class="stat-card-info">
          <div class="stat-card-value" id="statFollowers">—</div>
          <div class="stat-card-label">Followers</div>
        </div>
      </a>
      <a class="stat-card" href="profile.html?tab=likes">
        <div class="stat-card-icon"><i class="fas fa-heart"></i></div>
        <div class="stat-card-info">
          <div class="stat-card-value" id="statLikes">—</div>
          <div class="stat-card-label">Total Likes</div>
        </div>
      </a>
    </div>

    <!-- SAVED FOR LATER -->
    <div class="section-header">
      <div class="section-title"><i class="fas fa-bookmark"></i> Saved for Later</div>
      <a class="section-link" href="saved.html">See all <i class="fas fa-arrow-right" style="font-size:9px;"></i></a>
    </div>
    <div class="saved-list" id="savedList">
      <div class="skel" style="height:60px;border-radius:12px;"></div>
      <div class="skel" style="height:60px;border-radius:12px;"></div>
    </div>

    <!-- FROM PEOPLE YOU FOLLOW -->
    <div class="section-header">
      <div class="section-title"><i class="fas fa-scroll"></i> From People You Follow</div>
      <a class="section-link" href="https://patholytica.com/dailyfeed">Full Feed <i class="fas fa-arrow-right" style="font-size:9px;"></i></a>
    </div>
    <div class="feed-list" id="feedList">
      <div class="skel" style="height:110px;border-radius:14px;"></div>
      <div class="skel" style="height:110px;border-radius:14px;"></div>
    </div>

    <!-- YOUR LIBRARIES -->
    <div class="section-header">
      <div class="section-title"><i class="fas fa-book-open"></i> Your Libraries</div>
      <a class="section-link" href="library.html">See all <i class="fas fa-arrow-right" style="font-size:9px;"></i></a>
    </div>
    <div style="padding: 0 18px;">
      <div class="library-shelf-wrap">
        <div class="library-shelf" id="libraryShelf">
          <div class="skel" style="width:110px;height:160px;border-radius:10px;flex-shrink:0;"></div>
          <div class="skel" style="width:110px;height:160px;border-radius:10px;flex-shrink:0;"></div>
          <div class="skel" style="width:110px;height:160px;border-radius:10px;flex-shrink:0;"></div>
        </div>
      </div>
    </div>

    <!-- ACTIVE CREATORS -->
    <div class="section-header">
      <div class="section-title"><i class="fas fa-star"></i> Active Creators</div>
    </div>
    <div style="padding: 0 18px;">
      <div class="creators-row" id="creatorsRow">
        <div class="skel" style="width:52px;height:52px;border-radius:50%;flex-shrink:0;"></div>
        <div class="skel" style="width:52px;height:52px;border-radius:50%;flex-shrink:0;"></div>
        <div class="skel" style="width:52px;height:52px;border-radius:50%;flex-shrink:0;"></div>
        <div class="skel" style="width:52px;height:52px;border-radius:50%;flex-shrink:0;"></div>
        <div class="skel" style="width:52px;height:52px;border-radius:50%;flex-shrink:0;"></div>
      </div>
    </div>

    <div style="height: 16px;"></div>
  </div><!-- end home-scroll -->

</div><!-- end app-container -->

<div class="footer-bar">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

);

function formatNumber(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return (n || 0).toString();
}
function formatDate(date) {
  const ms = Date.now() - date, mins = Math.floor(ms/60000), hrs = Math.floor(ms/3600000), days = Math.floor(ms/86400000);
  if (mins < 60) return `${mins}m ago`;
  if (hrs < 24) return `${hrs}h ago`;
  if (days < 7) return `${days}d ago`;
  return date.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}
function avatarContent(pfp, username, fullName) {
  if (pfp) return `<img src="${pfp}" alt="">`;
  const src = username || fullName || '?';
  return src.charAt(0).toUpperCase();
}
function isMCQ(content) { return typeof content === 'string' && content.trimStart().startsWith('❔'); }

onAuthStateChanged(auth, async (firebaseUser) => {
  if (!firebaseUser) {
    // Not logged in — show generic greeting, hide stat cards
    document.getElementById('welcomeName').innerHTML = 'Welcome to <span>Patholytica</span>';
    clearSkeletons();
    loadActiveCreators(null, null);
    loadLibraries(null);
    return;
  }

  // Fetch supabase user
  const { data: user } = await supabase
    .from('users')
    .select('user_id, username, full_name, pfp, firebase_uid')
    .eq('firebase_uid', firebaseUser.uid)
    .single();

  if (!user) { clearSkeletons(); return; }

  // Welcome name
  const displayName = user.full_name || user.username || 'there';
  document.getElementById('welcomeName').innerHTML = `Welcome back, <span>${displayName.split(' ')[0]}</span>`;

  // Avatar
  const avatarEl = document.getElementById('headerAvatar');
  avatarEl.innerHTML = avatarContent(user.pfp, user.username, user.full_name);
  avatarEl.onclick = () => window.location.href = `profile.html?username=${user.username || ''}`;

  // Load everything in parallel
  await Promise.all([
    loadStats(user),
    loadNotifCount(user),
    loadSaved(user),
    loadFeed(user),
    loadLibraries(user),
    loadActiveCreators(user, firebaseUser.uid),
  ]);
});

async function loadNotifCount(user) {
  const { data } = await supabase
    .from('notifications')
    .select('id', { count: 'exact', head: true })
    .eq('recipient_id', user.user_id)
    .eq('is_read', false);
  const count = data?.length ?? 0;
  const badge = document.getElementById('notifBadge');
  // use the head:true count approach
  const { count: unread } = await supabase
    .from('notifications')
    .select('*', { count: 'exact', head: true })
    .eq('recipient_id', user.user_id)
    .eq('is_read', false);
  if (unread > 0) {
    badge.textContent = unread > 9 ? '9+' : unread;
    badge.style.display = 'flex';
  }
}

async function loadStats(user) {
  const [
    { count: artCount },
    { count: libCount },
    { count: followerCount },
  ] = await Promise.all([
    supabase.from('articles').select('*', { count:'exact', head:true }).eq('firebase_user_id', user.firebase_uid),
    supabase.from('playlists').select('*', { count:'exact', head:true }).eq('user_id', user.user_id),
    supabase.from('subscriptions').select('*', { count:'exact', head:true }).eq('author_id', user.user_id),
  ]);

  // Total likes on user's articles
  const { data: userArticles } = await supabase
    .from('articles').select('id, likes').eq('firebase_user_id', user.firebase_uid);
  const totalLikes = (userArticles || []).reduce((s, a) => s + (a.likes || 0), 0);

  document.getElementById('statArticles').textContent = formatNumber(artCount || 0);
  document.getElementById('statLibraries').textContent = formatNumber(libCount || 0);
  document.getElementById('statFollowers').textContent = formatNumber(followerCount || 0);
  document.getElementById('statLikes').textContent = formatNumber(totalLikes);
}

async function loadSaved(user) {
  const el = document.getElementById('savedList');
  const { data: saved } = await supabase
    .from('saved_articles')
    .select('article_id, created_at')
    .eq('user_id', user.user_id)
    .order('created_at', { ascending: false })
    .limit(3);

  if (!saved || saved.length === 0) {
    el.innerHTML = `<div class="empty-state"><i class="fas fa-bookmark"></i><div>Nothing saved yet</div></div>`;
    return;
  }

  const ids = saved.map(s => s.article_id);
  const { data: articles } = await supabase
    .from('articles').select('id, title, firebase_user_id, created_at').in('id', ids);

  const firebaseIds = [...new Set((articles || []).map(a => a.firebase_user_id).filter(Boolean))];
  let authors = {};
  if (firebaseIds.length > 0) {
    const { data: users } = await supabase.from('users').select('firebase_uid, username, full_name').in('firebase_uid', firebaseIds);
    (users || []).forEach(u => { authors[u.firebase_uid] = u; });
  }

  el.innerHTML = (articles || []).map(art => {
    const u = authors[art.firebase_user_id];
    const author = u?.username ? `@${u.username}` : (u?.full_name || 'Anonymous');
    const isMcq = isMCQ(art.title || '');
    return `
      <a class="saved-item" href="dailyfeed.html?article=${art.id}">
        <div class="saved-item-icon">
          <i class="fas ${isMcq ? 'fa-question-circle' : 'fa-file-alt'}"></i>
        </div>
        <div class="saved-item-info">
          <div class="saved-item-title">${art.title || 'Untitled'}</div>
          <div class="saved-item-meta">${author} · ${formatDate(new Date(art.created_at))}</div>
        </div>
        <div class="saved-item-arrow"><i class="fas fa-chevron-right"></i></div>
      </a>`;
  }).join('');
}

async function loadFeed(user) {
  const el = document.getElementById('feedList');

  // Get who they follow
  const { data: subs } = await supabase
    .from('subscriptions').select('author_id').eq('subscriber_id', user.user_id);

  if (!subs || subs.length === 0) {
    el.innerHTML = `<div class="empty-state"><i class="fas fa-user-friends"></i><div>Follow creators to see their posts here</div></div>`;
    return;
  }

  const authorIds = subs.map(s => s.author_id);

  // Get firebase_uids for those author supabase IDs
  const { data: authorUsers } = await supabase
    .from('users').select('firebase_uid, user_id, username, full_name, pfp').in('user_id', authorIds);

  const authorFirebaseUids = (authorUsers || []).map(u => u.firebase_uid).filter(Boolean);
  if (authorFirebaseUids.length === 0) {
    el.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><div>No articles yet</div></div>`;
    return;
  }

  const { data: articles } = await supabase
    .from('articles')
    .select('id, title, content, likes, created_at, firebase_user_id')
    .in('firebase_user_id', authorFirebaseUids)
    .order('created_at', { ascending: false })
    .limit(4);

  if (!articles || articles.length === 0) {
    el.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><div>No recent articles from people you follow</div></div>`;
    return;
  }

  // Comment counts
  const artIds = articles.map(a => a.id);
  const { data: comments } = await supabase.from('comments').select('article_id').in('article_id', artIds);
  const commentCounts = {};
  (comments || []).forEach(c => { commentCounts[c.article_id] = (commentCounts[c.article_id] || 0) + 1; });

  const usersMap = {};
  (authorUsers || []).forEach(u => { usersMap[u.firebase_uid] = u; });

  el.innerHTML = articles.map(art => {
    const u = usersMap[art.firebase_user_id];
    const author = u?.username ? `@${u.username}` : (u?.full_name || 'Anonymous');
    const av = avatarContent(u?.pfp, u?.username, u?.full_name);
    const mcq = isMCQ(art.content || '');
    const profileUrl = u?.username ? `profile.html?username=${u.username}` : '#';
    return `
      <a class="feed-card" href="dailyfeed.html?article=${art.id}">
        <div class="feed-card-header">
          <div class="feed-avatar">${av}</div>
          <div class="feed-meta">
            <div class="feed-author">${author}</div>
            <div class="feed-time">${formatDate(new Date(art.created_at))}</div>
          </div>
        </div>
        ${mcq ? `<div class="mcq-feed-badge">❔ Quick Question</div>` : ''}
        <div class="feed-title">${art.title || 'Untitled'}</div>
        <div class="feed-card-footer">
          <div class="feed-stat likes"><i class="fas fa-heart"></i> ${formatNumber(art.likes || 0)}</div>
          <div class="feed-stat comments"><i class="fas fa-comment"></i> ${commentCounts[art.id] || 0}</div>
          <div class="feed-read-btn">Read →</div>
        </div>
      </a>`;
  }).join('');
}

async function loadLibraries(user) {
  const el = document.getElementById('libraryShelf');
  let query = supabase.from('playlists').select('id, name, thumbnail_url').order('updated_at', { ascending: false }).limit(8);
  if (user) query = query.eq('user_id', user.user_id);
  const { data: libs } = await query;

  if (!libs || libs.length === 0) {
    el.innerHTML = `<div class="empty-state" style="padding:12px 0;"><i class="fas fa-layer-group"></i><div>No libraries yet</div></div>`;
    return;
  }

  const { data: countRows } = await supabase.from('playlist_items').select('playlist_id');
  const countMap = {};
  (countRows || []).forEach(r => { countMap[r.playlist_id] = (countMap[r.playlist_id] || 0) + 1; });

  el.innerHTML = libs.map(lib => {
    const count = countMap[lib.id] || 0;
    const letter = (lib.name || '?')[0].toUpperCase();
    const poster = lib.thumbnail_url
      ? `<img src="${lib.thumbnail_url}" alt="${lib.name}" loading="lazy">`
      : `<div class="lib-poster-placeholder"><div class="lib-poster-letter">${letter}</div></div>`;
    return `
      <a class="lib-card" href="dailyfeed.html?playlist=${lib.id}">
        <div class="lib-poster">
          ${poster}
          <div class="lib-poster-overlay">
            <div class="lib-count"><i class="fas fa-layer-group"></i> ${count}</div>
          </div>
        </div>
        <div class="lib-info">
          <div class="lib-name">${lib.name || 'Untitled'}</div>
        </div>
      </a>`;
  }).join('');
}

async function loadActiveCreators(currentUser, currentFirebaseUid) {
  const el = document.getElementById('creatorsRow');

  // Get users with most recent articles
  const { data: recentArticles } = await supabase
    .from('articles')
    .select('firebase_user_id, created_at')
    .order('created_at', { ascending: false })
    .limit(50);

  if (!recentArticles || recentArticles.length === 0) {
    el.innerHTML = '';
    return;
  }

  // Unique firebase_user_ids preserving order (most recent first)
  const seen = new Set();
  const uniqueIds = [];
  for (const a of recentArticles) {
    if (a.firebase_user_id && !seen.has(a.firebase_user_id)) {
      if (a.firebase_user_id !== currentFirebaseUid) {
        seen.add(a.firebase_user_id);
        uniqueIds.push(a.firebase_user_id);
        if (uniqueIds.length >= 10) break;
      }
    }
  }

  if (uniqueIds.length === 0) { el.innerHTML = ''; return; }

  const { data: users } = await supabase
    .from('users').select('firebase_uid, username, full_name, pfp').in('firebase_uid', uniqueIds);

  el.innerHTML = (users || []).map(u => {
    const av = avatarContent(u.pfp, u.username, u.full_name);
    const name = u.username ? `@${u.username}` : (u.full_name || 'User');
    const url = u.username ? `profile.html?username=${u.username}` : '#';
    return `
      <a class="creator-item" href="${url}">
        <div class="creator-avatar-wrap">
          <div class="creator-avatar">${av}</div>
        </div>
        <div class="creator-name">${name}</div>
      </a>`;
  }).join('');
}

function clearSkeletons() {
  ['savedList','feedList','libraryShelf','creatorsRow'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = '';
  });
}
</script>
