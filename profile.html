<style>
/* ══════════════════════════════════
   THEME SYSTEM — shared with homepage:
   body.theme-dark / body.theme-light for color scheme,
   body.font-serif / font-slab / font-modern for the
   article/display typeface. Preferences are persisted under
   the same localStorage keys the homepage uses (pref_theme,
   pref_fontfam) so a choice made on one page carries to the other.
══════════════════════════════════ */
:root {
  --bg-color: #0f0e0b;
  --text-primary: #f5f0e8;
  --text-secondary: #8a8070;
  --hover-bg: #1a1810;
  --border-color: #2a2518;
  --accent: #c8a96e;
  --accent-hover: #b8935a;
  --accent-glow: rgba(200,169,110,0.25);
  --accent-soft: rgba(200,169,110,0.12);
  --success: #4ade80;
  --error: #ef4444;
  --warn: #f59e0b;
  --font-article: 'Merriweather', serif;
  --font-ui: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
}
body.theme-light {
  --bg-color: #faf6ee;
  --text-primary: #1a1710;
  --text-secondary: #706050;
  --hover-bg: #f0ebe0;
  --border-color: #e0d8c8;
  --accent: #a07840;
  --accent-hover: #8a6430;
  --accent-glow: rgba(160,120,64,0.2);
  --accent-soft: rgba(160,120,64,0.08);
}
body.font-serif  { --font-article: 'Merriweather', serif; }
body.font-slab   { --font-article: 'Source Serif 4', serif; }
body.font-modern { --font-article: 'Inter', sans-serif; }

/* Back-compat aliases so the rest of this file's existing rules
   (written against --bg/--text/--sub/--hover/--border) keep working
   without a full find-and-replace pass. */
:root, body {
  --bg: var(--bg-color);
  --text: var(--text-primary);
  --sub: var(--text-secondary);
  --hover: var(--hover-bg);
  --border: var(--border-color);
  --accent-h: var(--accent-hover);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--font-ui);
  background: var(--bg); color: var(--text);
  overflow:hidden; position:fixed; width:100%; height:100vh;
  transition: background .2s, color .2s;
}
.app {
  position:fixed; top:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:450px; height:100vh;
  background: var(--bg); display:flex; flex-direction:column;
}

/* ── Header ── */
.header {
  flex-shrink:0; display:flex; align-items:center; gap:10px;
  padding: 10px 16px;
  padding-top: calc(10px + env(safe-area-inset-top));
  background: rgba(15,14,11,0.96);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  z-index:40;
}
body.theme-light .header { background: rgba(250,246,238,0.96); }
.icon-btn {
  width:36px; height:36px; border-radius:50%;
  background: none; border: none;
  color: var(--text-secondary); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:14px; transition: color .2s, background .2s; flex-shrink:0;
}
.icon-btn:hover { color: var(--accent); background: var(--accent-soft); }
.header-center { flex:1; }
.header-title { font-size:14px; font-weight:700; font-family: var(--font-article); }
.header-sub { font-size:10px; color: var(--sub); margin-top:1px; }

/* ── Scrollable content ── */
.profile-scroll {
  flex:1; overflow-y:auto; overflow-x:hidden;
}
.profile-scroll::-webkit-scrollbar { width:2px; }
.profile-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius:2px; }

/* ══════════════════════════════════
   HERO
══════════════════════════════════ */
.hero {
  position:relative; padding: 20px 18px 18px;
  border-bottom: 1px solid var(--border);
}
.hero-top {
  display:flex; align-items:flex-start; gap:16px; margin-bottom:14px;
}
.hero-avatar-wrap { position:relative; flex-shrink:0; }
.hero-avatar {
  width:68px; height:68px; border-radius:50%;
  background: linear-gradient(135deg, var(--hover), var(--bg));
  border: 2px solid rgba(200,169,110,0.35);
  display:flex; align-items:center; justify-content:center;
  font-size:24px; font-weight:800; color: var(--accent);
  overflow:hidden;
  box-shadow: 0 0 0 4px var(--bg), 0 0 0 5px rgba(200,169,110,0.2);
}
.hero-avatar img { width:100%; height:100%; object-fit:cover; }
.hero-counters {
  flex:1; display:flex; gap:0;
  border: 1px solid var(--border); border-radius:12px;
  overflow:hidden; margin-top:6px;
}
.hero-counter {
  flex:1; display:flex; flex-direction:column; align-items:center;
  padding:10px 6px; position:relative;
}
.hero-counter + .hero-counter::before {
  content:''; position:absolute; left:0; top:20%; bottom:20%;
  width:1px; background: var(--border);
}
.hero-counter-val {
  font-size:17px; font-weight:800; color: var(--text); line-height:1;
  font-family: var(--font-article);
}
.hero-counter-label { font-size:9px; font-weight:600; color: var(--sub); margin-top:3px; letter-spacing:.04em; text-transform:uppercase; }

.hero-identity { margin-bottom:10px; }
.hero-full-name {
  font-size:18px; font-weight:800; color: var(--text);
  font-family: var(--font-article); margin-bottom:2px; line-height:1.2;
}
.hero-username { font-size:12px; color: var(--sub); margin-bottom:8px; }
.hero-bio {
  font-size:13px; line-height:1.65; color: var(--text);
  white-space:pre-wrap; word-break:break-word;
}
.hero-bio-empty { font-size:12px; color: var(--sub); font-style:italic; }

.hero-actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
.btn-edit-profile {
  flex:1; padding:9px; border-radius:10px;
  background: var(--accent); color:#0f0e0b;
  font-size:12px; font-weight:700; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:6px;
  font-family: var(--font-ui);
  box-shadow: 0 2px 10px var(--accent-glow);
  transition: background .15s;
  min-width:120px;
}
.btn-edit-profile:hover { background: var(--accent-h); }
.btn-create-library, .btn-my-articles {
  padding:9px 14px; border-radius:10px;
  background: var(--hover); border: 1px solid var(--border);
  color: var(--text); font-size:12px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:6px;
  font-family: var(--font-ui);
  transition: border-color .15s, color .15s;
}
.btn-create-library:hover, .btn-my-articles:hover { border-color: var(--accent); color: var(--accent); }

/* ── Skeleton hero ── */
.hero-skeleton {
  padding:20px 18px 18px; border-bottom: 1px solid var(--border);
}
.sk-top { display:flex; gap:16px; margin-bottom:14px; }
.sk-av { width:68px; height:68px; border-radius:50%; flex-shrink:0; }
.sk-counters { flex:1; border:1px solid var(--border); border-radius:12px; margin-top:6px; }
.sk-name { height:18px; width:140px; border-radius:6px; margin-bottom:8px; }
.sk-bio-line { height:11px; border-radius:4px; margin-bottom:5px; }
@keyframes shimmer { 0%,100%{opacity:.3} 50%{opacity:.7} }
.sk { background: var(--hover); animation: shimmer 1.6s infinite; border-radius:6px; }

/* ── Section header (replaces the old tabs bar now that Libraries
     is the only in-page collection; Articles moved to its own page) ── */
.section-header {
  flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
  padding: 16px 16px 10px;
}
.section-header-title {
  font-size:15px; font-weight:800; color: var(--text);
  font-family: var(--font-article); display:flex; align-items:center; gap:8px;
}
.section-header-title i { font-size:13px; color: var(--accent); }
.section-header-count { font-size:11px; color: var(--sub); font-weight:600; }

/* ── Panel ── */
.panel { display:none; }
.panel.active { display:block; }

/* ── Selection bar ── */
.selection-bar {
  position:sticky; top:0; z-index:10;
  background: var(--bg); border-bottom: 1px solid var(--border);
  padding:8px 14px; display:none; align-items:center; gap:8px;
}
.selection-bar.show { display:flex; }
.sel-count { font-size:12px; font-weight:700; color: var(--accent); flex:1; }
.sel-btn {
  padding:6px 11px; border-radius:7px; font-size:11px; font-weight:700;
  cursor:pointer; border:none; font-family: var(--font-ui); transition: all .15s;
}
.sel-all { background: var(--hover); color: var(--text); border: 1px solid var(--border); }
.sel-all:hover { border-color: var(--accent); color: var(--accent); }
.sel-del { background: rgba(239,68,68,.12); color:#f87171; border: 1px solid rgba(239,68,68,.25); }
.sel-del:hover { background: rgba(239,68,68,.22); }
.sel-cancel { background:transparent; color: var(--sub); border: 1px solid var(--border); }

/* ── Library items ── */
.lib-grid {
  display:grid; grid-template-columns:1fr 1fr;
  gap:0; padding:0;
}
.library-card {
  position:relative; cursor:pointer;
  border-bottom: 1px solid var(--border);
  transition: background .12s;
  -webkit-tap-highlight-color:transparent;
}
.library-card:nth-child(odd) { border-right: 1px solid var(--border); }
.library-card:hover { background: var(--hover); }
.library-card.selected { background: rgba(200,169,110,.05); }

.lib-select-box {
  position:absolute; top:8px; left:8px; z-index:5;
  width:20px; height:20px; border-radius:50%;
  border: 1.5px solid rgba(255,255,255,.5);
  background:rgba(0,0,0,.4);
  display:none; align-items:center; justify-content:center;
  font-size:9px; color:transparent; backdrop-filter:blur(4px);
}
.selection-mode-lib .lib-select-box { display:flex; }
.library-card.selected .lib-select-box { background: var(--accent); border-color: var(--accent); color:#0f0e0b; }

.lib-poster {
  width:100%; aspect-ratio:3/4; position:relative; overflow:hidden;
  background: linear-gradient(135deg, var(--hover), var(--bg));
}
.lib-poster img { width:100%; height:100%; object-fit:cover; }
.lib-poster-placeholder {
  width:100%; height:100%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:8px;
}
.lib-poster-letter { font-size:32px; font-weight:800; color:rgba(200,169,110,.15); font-family: var(--font-article); }
.lib-poster-icon { font-size:20px; color:rgba(200,169,110,.1); }
.lib-poster-gradient {
  position:absolute; inset:0;
  background:linear-gradient(to top, rgba(10,8,5,.95) 0%, rgba(10,8,5,.3) 50%, transparent 80%);
  display:flex; flex-direction:column; justify-content:flex-end; padding:10px;
}
.lib-count-chip {
  display:inline-flex; align-items:center; gap:3px;
  background:rgba(200,169,110,.18); border:1px solid rgba(200,169,110,.25);
  border-radius:5px; padding:2px 6px; font-size:9px; font-weight:700;
  color: var(--accent); align-self:flex-start; margin-bottom:5px;
  backdrop-filter:blur(4px);
}
.lib-poster-name {
  font-size:12px; font-weight:700; color:#f5f0e8; line-height:1.25;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  text-shadow:0 1px 4px rgba(0,0,0,.8);
}
.lib-card-actions {
  position:absolute; top:8px; right:8px; display:flex; gap:4px; z-index:5;
  opacity:0; transition: opacity .15s;
}
.library-card:hover .lib-card-actions { opacity:1; }
.selection-mode-lib .lib-card-actions { display:none; }
.lib-action {
  width:24px; height:24px; border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  font-size:9px; cursor:pointer; border:none; transition: all .15s;
  backdrop-filter:blur(6px);
}
.lib-action.edit { background:rgba(200,169,110,.3); color:#f5f0e8; }
.lib-action.del  { background:rgba(239,68,68,.35); color:#fff; }

/* ── Library detail expanded panel ── */
.lib-detail-panel {
  grid-column: 1 / -1;
  background: var(--hover);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px;
  display:none;
  animation: detailIn .2s ease;
}
.lib-detail-panel.open { display:block; }
@keyframes detailIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
.lib-detail-name {
  font-size:15px; font-weight:800; color: var(--text);
  font-family: var(--font-article); margin-bottom:5px;
}
.lib-detail-desc {
  font-size:13px; color: var(--sub); line-height:1.6; margin-bottom:12px;
}
.lib-detail-desc-empty { font-size:12px; color: var(--sub); font-style:italic; margin-bottom:12px; }
.lib-detail-row { display:flex; align-items:center; gap:8px; }
.lib-detail-count { font-size:11px; color: var(--sub); display:flex; align-items:center; gap:4px; flex:1; }
.lib-detail-count i { color: var(--accent); font-size:10px; }
.btn-start-feed {
  padding:8px 16px; border-radius:8px;
  background: var(--accent); color:#0f0e0b;
  font-size:11px; font-weight:700; border:none; cursor:pointer;
  display:flex; align-items:center; gap:5px;
  font-family: var(--font-ui);
  transition: background .15s;
}
.btn-start-feed:hover { background: var(--accent-h); }

/* ── Empty / Loading ── */
.feed-empty {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:50px 20px; gap:12px; color: var(--sub); text-align:center;
}
.feed-empty i { font-size:36px; opacity:.18; color: var(--accent); }
.feed-empty h3 { font-size:15px; color: var(--text); font-family: var(--font-article); }
.feed-empty p { font-size:12px; }
.loading-wrap {
  display:flex; align-items:center; justify-content:center;
  padding:40px; gap:12px; color: var(--sub); font-size:13px;
}
.spinner { width:24px; height:24px; border:2.5px solid var(--border); border-top-color: var(--accent); border-radius:50%; animation:spin .8s linear infinite; flex-shrink:0; }
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Sheets ── */
.sheet-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.85);
  z-index:200; display:none; align-items:flex-end; justify-content:center;
  backdrop-filter:blur(4px);
}
.sheet-overlay.show { display:flex; }
.sheet {
  background: var(--hover-bg); border-radius:20px 20px 0 0;
  border:1px solid var(--border); border-bottom:none;
  width:100%; max-width:450px; max-height:88vh;
  display:flex; flex-direction:column;
  animation:slideUp .3s cubic-bezier(.4,0,.2,1);
  padding-bottom: env(safe-area-inset-bottom);
}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0;flex-shrink:0;}
.sheet-header{padding:12px 18px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;}
.sheet-title{font-size:14px;font-weight:700;font-family: var(--font-article);}
.sheet-close{width:28px;height:28px;border-radius:50%;background:var(--hover);border:1px solid var(--border);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:border-color .2s,color .2s;}
.sheet-close:hover{border-color:var(--accent);color:var(--accent);}
.sheet-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;}
.sheet-body::-webkit-scrollbar{width:2px;}
.sheet-body::-webkit-scrollbar-thumb{background:var(--border);}
.sheet-footer{padding:10px 18px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0;}

/* Form */
.form-field label{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin-bottom:7px;}
.form-hint{font-size:10px;color:var(--sub);margin-top:5px;line-height:1.5;}
.form-hint.error{color:#f87171;}
.form-input{width:100%;padding:10px 13px;background:var(--hover);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none;font-family: var(--font-ui);transition:border-color .2s,box-shadow .2s;}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.form-input::placeholder{color:var(--sub);opacity:.5;}
.form-input.at-prefixed{padding-left:26px;}
.form-field-prefix-wrap{position:relative;}
.form-field-prefix-wrap .prefix-at{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:14px;pointer-events:none;}
.form-textarea{width:100%;padding:10px 13px;background:var(--hover);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;outline:none;resize:none;font-family: var(--font-ui);line-height:1.55;transition:border-color .2s,box-shadow .2s;min-height:80px;}
.form-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.form-textarea::placeholder{color:var(--sub);opacity:.5;}
.char-count{font-size:10px;color:var(--sub);text-align:right;margin-top:4px;}

/* Avatar upload */
.avatar-upload-row{display:flex;align-items:center;gap:14px;}
.avatar-preview{width:60px;height:60px;border-radius:50%;background:var(--accent-soft);border:2px solid rgba(200,169,110,0.3);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--accent);overflow:hidden;flex-shrink:0;}
.avatar-preview img{width:100%;height:100%;object-fit:cover;}
.avatar-btns{display:flex;flex-direction:column;gap:6px;flex:1;}
.btn-upload-av,.btn-remove-av{padding:7px 12px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-family: var(--font-ui);transition:all .15s;}
.btn-upload-av{background:var(--hover);border:1px solid var(--border);color:var(--text);}
.btn-upload-av:hover{border-color:var(--accent);color:var(--accent);}
.btn-remove-av{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.2);color:#f87171;}
.btn-remove-av:hover{background:rgba(239,68,68,.15);}
.upload-hint{font-size:10px;color:var(--sub);}

/* Thumbnail */
.thumb-preview{width:100%;height:140px;border-radius:12px;background:linear-gradient(135deg,var(--hover),var(--bg));border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative;transition:border-color .2s;}
.thumb-preview:hover{border-color:var(--accent);}
.thumb-preview img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.thumb-preview-overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;opacity:0;transition:opacity .2s;}
.thumb-preview:hover .thumb-preview-overlay{opacity:1;}
.thumb-preview-placeholder{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--sub);}
.thumb-preview-placeholder i{font-size:28px;opacity:.4;}
.thumb-preview-placeholder span{font-size:11px;font-weight:600;}
.thumb-actions{display:flex;gap:6px;margin-top:8px;}
.thumb-action-btn{flex:1;padding:7px 10px;border-radius:7px;border:1px solid var(--border);background:var(--hover);color:var(--sub);font-size:10px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .15s;}
.thumb-action-btn:hover{border-color:var(--accent);color:var(--accent);}
.thumb-action-btn.danger:hover{border-color:var(--error);color:#f87171;}

/* Sheet buttons */
.btn{flex:1;padding:11px 8px;border-radius:10px;border:none;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;font-family: var(--font-ui);}
.btn-secondary{background:var(--hover);color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
.btn-primary{background:var(--accent);color:#0f0e0b;box-shadow:0 2px 10px var(--accent-glow);}
.btn-primary:hover{background:var(--accent-h);}
.btn-danger{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.22);}
.btn-danger:hover{background:rgba(239,68,68,.22);}

<script>
/* ── Emoji rendering system ── */
const EMOJI_MAP={
  '🔍':'emo-magnify','❗':'emo-urgent','📌':'emo-pinned','🔥':'emo-fire','💎':'emo-diamond',
  '🟡':'emo-yellow','🔵':'emo-blue','🟢':'emo-green','🟣':'emo-purple','🔴':'emo-red',
  '⚫':'emo-dark','🧠':'emo-brain','📖':'emo-book','💡':'emo-idea','🎯':'emo-target',
  '🧩':'emo-puzzle','🏷️':'emo-tag','🔬':'emo-micro','⚠️':'emo-warning','✅':'emo-check',
  '❌':'emo-cross','⏳':'emo-hourglass','🔒':'emo-lock','🔓':'emo-unlock','⚡':'emo-lightning',
  '🌊':'emo-wave','🌀':'emo-spin','💫':'emo-float','🚀':'emo-rocket','🎬':'emo-cinematic',
  '🌟':'emo-star','✨':'emo-sparkle','🌈':'emo-rainbow','👑':'emo-crown','🪄':'emo-magic',
  '❤️':'emo-heart','😄':'emo-happy','😌':'emo-calm','😮':'emo-surprised','😎':'emo-cool',
  '🤖':'emo-robot','🧪':'emo-science','🏛️':'emo-temple','🌍':'emo-earth','💰':'emo-money',
  '⚖️':'emo-balance','📡':'emo-signal','🎵':'emo-music','🧊':'emo-ice','🔊':'emo-sound',
};
function buildEmojiPattern(){
  const keys=Object.keys(EMOJI_MAP).sort((a,b)=>b.length-a.length);
  const escaped=keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
  return new RegExp(`(${escaped})([\\s\\S]*?)\\1`,'gu');
}
function escHtmlET(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderEmojiText(text){
  const re=buildEmojiPattern();
  let result='',lastIndex=0,match;
  while((match=re.exec(text))!==null){
    result+=escHtmlET(text.slice(lastIndex,match.index));
    const cls=EMOJI_MAP[match[1]];
    result+=`<span class="${cls}">${renderEmojiText(match[2])}</span>`;
    lastIndex=re.lastIndex;
  }
  result+=escHtmlET(text.slice(lastIndex));
  return result;
}

/* ── OG meta updater ── */
function updateOGMeta(ud, articleCount, followerCount){
  const displayName = ud.full_name || ud.username || 'User';
  const username = ud.username || '';
  const bio = ud.bio || '';
  const pfp = ud.pfp || 'https://patholytica.com/IMG_3220.png';
  const url = `https://patholytica.com/profile.html?username=${encodeURIComponent(username)}`;

  const title = `${displayName} (@${username}) — Patholytica`;
  const desc = bio
    ? `${bio.slice(0,120)}${bio.length>120?'…':''} · ${followerCount} followers · ${articleCount} articles`
    : `${followerCount} followers · ${articleCount} articles on Patholytica`;

  const setMeta = (sel, attr, val) => { const el=document.querySelector(sel); if(el) el.setAttribute(attr,val); };
  setMeta('#og-title','content',title);
  setMeta('#og-description','content',desc);
  setMeta('#og-image','content',pfp);
  setMeta('#og-url','content',url);

/* ── Theme toggle — shares localStorage keys with the homepage
   (pref_theme / pref_fontfam) so a choice made on either page is
   reflected on the other. This header button only cycles theme
   (light/dark); font family stays whatever was last set from the
   homepage's settings popover. ── */
window.toggleTheme=function(){
  const isLight=document.body.classList.contains('theme-light');
  document.body.classList.remove('theme-dark','theme-light');
  document.body.classList.add(isLight?'theme-dark':'theme-light');
  localStorage.setItem('pref_theme', isLight?'theme-dark':'theme-light');
};

/* ══════════════════════════════════
   LIBRARIES RENDERING
══════════════════════════════════ */
function renderLibrariesGrid(){
  const grid=document.getElementById('librariesGrid');
  document.getElementById('librariesSectionCount').textContent=`${libraries.length} librar${libraries.length!==1?'ies':'y'}`;
  if(!libraries.length){
    grid.style.display='block';
    grid.innerHTML=`<div class="feed-empty"><i class="fas fa-book-open"></i><h3>No libraries yet</h3><p>${isOwnProfile?"Create your first library.":"No libraries from this user."}</p></div>`;
    return;
  }
  grid.style.display='grid';
  grid.innerHTML='';
  libraries.forEach(lib=>{
    const count=libCounts[lib.id]||0;
    const card=document.createElement('div');card.className='library-card';card.dataset.id=lib.id;
    const firstLetter=(lib.name||'?')[0].toUpperCase();
    const posterContent=lib.thumbnail_url
      ?`<img src="${escHtml(lib.thumbnail_url)}" alt="${escHtml(lib.name||'')}">`
      :`<div class="lib-poster-placeholder"><div class="lib-poster-letter">${firstLetter}</div><div class="lib-poster-icon"><i class="fas fa-book-open"></i></div></div>`;
    card.innerHTML=`
      <div class="lib-select-box"><i class="fas fa-check" style="font-size:9px;"></i></div>
      ${isOwnProfile?`<div class="lib-card-actions">
        <button class="lib-action edit" onclick="openEditLibrary(event,${lib.id})"><i class="fas fa-pen"></i></button>
        <button class="lib-action del" onclick="confirmDeleteLibrary(event,${lib.id})"><i class="fas fa-trash"></i></button>
      </div>`:''}
      <div class="lib-poster">
        ${posterContent}
        <div class="lib-poster-gradient">
          <div class="lib-count-chip"><i class="fas fa-layer-group"></i> ${count}</div>
          <div class="lib-poster-name">${escHtml(lib.name||'Untitled')}</div>
        </div>
      </div>`;

    if(isOwnProfile){
      let pt,startX,startY;
      card.addEventListener('pointerdown',e=>{
        startX=e.clientX;startY=e.clientY;
        pt=setTimeout(()=>{enterSelLib();toggleLibSel(lib.id);},600);
      });
      card.addEventListener('pointermove',e=>{
        if(Math.abs(e.clientX-startX)>8||Math.abs(e.clientY-startY)>8)clearTimeout(pt);
      });
      card.addEventListener('pointerup',()=>clearTimeout(pt));
      card.addEventListener('pointerleave',()=>clearTimeout(pt));
      card.addEventListener('pointercancel',()=>clearTimeout(pt));
      card.addEventListener('click',e=>{
        if(e.target.closest('.lib-action'))return;
        if(inSelLib){toggleLibSel(lib.id);return;}
        toggleLibDetail(lib.id,lib,count,card);
      });
    } else {
      card.addEventListener('click',()=>toggleLibDetail(lib.id,lib,count,card));
    }

    grid.appendChild(card);
  });
}

function toggleLibDetail(libId,lib,count,card){
  if(openDetailLibId===libId){
    document.querySelectorAll('.lib-detail-panel').forEach(p=>p.remove());
    openDetailLibId=null;
    return;
  }
  document.querySelectorAll('.lib-detail-panel').forEach(p=>p.remove());
  openDetailLibId=libId;

  const panel=document.createElement('div');
  panel.className='lib-detail-panel open';
  const descHTML=lib.description
    ?`<div class="lib-detail-desc">${escHtml(lib.description)}</div>`
    :`<div class="lib-detail-desc-empty">No description.</div>`;
  panel.innerHTML=`
    <div class="lib-detail-name">${escHtml(lib.name||'Untitled')}</div>
    ${descHTML}
    <div class="lib-detail-row">
      <div class="lib-detail-count"><i class="fas fa-layer-group"></i>${count} article${count!==1?'s':''}</div>
      <button class="btn-start-feed" onclick="location.href='https://patholytica.com/dailyfeed.html?playlist=${libId}'">
        <i class="fas fa-play"></i> Start in Feed
      </button>
    </div>`;

  const grid=document.getElementById('librariesGrid');
  const cards=[...grid.querySelectorAll('.library-card')];
  const idx=cards.indexOf(card);
  const rowEndIdx=idx%2===0?idx+1:idx;
  const nextEl=rowEndIdx<cards.length-1?cards[rowEndIdx+1]:null;
  if(nextEl){grid.insertBefore(panel,nextEl);}
  else{grid.appendChild(panel);}
}

/* ── Library selection ── */
function enterSelLib(){inSelLib=true;document.getElementById('librariesGrid').classList.add('selection-mode-lib');document.getElementById('selBarLibraries').classList.add('show');}
window.exitSelectionModeLibraries=function(){inSelLib=false;selectedLibraries.clear();document.getElementById('librariesGrid').classList.remove('selection-mode-lib');document.getElementById('selBarLibraries').classList.remove('show');document.querySelectorAll('.library-card').forEach(e=>e.classList.remove('selected'));updSelLib();};
function toggleLibSel(id){const el=document.querySelector(`.library-card[data-id="${id}"]`);if(!el)return;if(selectedLibraries.has(id)){selectedLibraries.delete(id);el.classList.remove('selected');}else{selectedLibraries.add(id);el.classList.add('selected');}updSelLib();}

window.selectAllLibraries=function(){if(!inSelLib)enterSelLib();libraries.forEach(l=>{selectedLibraries.add(l.id);const el=document.querySelector(`.library-card[data-id="${l.id}"]`);if(el)el.classList.add('selected');});updSelLib();};

/* ── Delete library ── */
window.confirmDeleteLibrary=function(e,id){
  e.stopPropagation();
  const l=libraries.find(x=>x.id===id);
  openConfirmSheet('Delete Library',`"${(l?.name||'').slice(0,60)}" will be deleted. Articles inside won't be affected.`,async()=>{
    try{
      const{error}=await supabase.rpc('delete_playlist_owned',{p_playlist_id:id,p_firebase_uid:currentUser.uid});
      if(error)throw error;
      libraries=libraries.filter(x=>x.id!==id);
      delete libCounts[id];
      renderLibrariesGrid();renderHero(viewingUserData,0);
      showNotif('Library deleted','success');
    }catch(err){showNotif('Failed to delete','error');}
  });

window.confirmBulkDeleteLibraries=function(){
  if(!selectedLibraries.size){showNotif('None selected','warning');return;}
  const n=selectedLibraries.size;
  openConfirmSheet(`Delete ${n} Librar${n>1?'ies':'y'}`,`${n} librar${n>1?'ies':'y'} will be deleted. Articles won't be affected.`,async()=>{
    try{
      const ids=[...selectedLibraries];
      for(const libId of ids){
        const{error}=await supabase.rpc('delete_playlist_owned',{p_playlist_id:libId,p_firebase_uid:currentUser.uid});
        if(error)throw error;

      libraries=libraries.filter(x=>!ids.includes(x.id));
      ids.forEach(id=>delete libCounts[id]);
      exitSelectionModeLibraries();renderLibrariesGrid();renderHero(viewingUserData,0);
      showNotif(`${n} librar${n>1?'ies':'y'} deleted`,'success');
    }catch(err){showNotif('Failed to delete','error');}
  });
};

/* ── Edit library ── */
window.openEditLibrary=function(e,id){
  e.stopPropagation();
  const l=libraries.find(x=>x.id===id);if(!l)return;
  editingLibraryId=id;
  libThumbFile=null;libThumbCurrentUrl=l.thumbnail_url||null;
  document.getElementById('editLibraryName').value=l.name||'';
  document.getElementById('editLibraryDesc').value=l.description||'';
  const prev=document.getElementById('libThumbPreview');
  const placeholder=document.getElementById('libThumbPlaceholder');
  const actions=document.getElementById('libThumbActions');
  prev.querySelectorAll('img').forEach(img=>img.remove());
  if(l.thumbnail_url){
    const img=document.createElement('img');img.src=l.thumbnail_url;
    prev.insertBefore(img,placeholder);
    placeholder.style.display='none';actions.style.display='flex';
  } else {
    placeholder.style.display='flex';actions.style.display='none';
  }
  document.getElementById('editLibrarySheet').classList.add('show');
};
window.closeEditLibrary=function(){document.getElementById('editLibrarySheet').classList.remove('show');editingLibraryId=null;libThumbFile=null;};
window.handleLibThumb=function(input){
  const f=input.files[0];if(!f)return;
  if(f.size>5*1024*1024){showNotif('Max 5MB','warning');input.value='';return;}
  libThumbFile=f;
  const r=new FileReader();
  r.onload=ev=>{
    const prev=document.getElementById('libThumbPreview');
    const placeholder=document.getElementById('libThumbPlaceholder');
    prev.querySelectorAll('img').forEach(img=>img.remove());
    const img=document.createElement('img');img.src=ev.target.result;
    prev.insertBefore(img,placeholder);
    placeholder.style.display='none';
    document.getElementById('libThumbActions').style.display='flex';
  };
  r.readAsDataURL(f);
};
window.removeLibThumb=function(){
  const prev=document.getElementById('libThumbPreview');
  prev.querySelectorAll('img').forEach(img=>img.remove());
  document.getElementById('libThumbPlaceholder').style.display='flex';
  document.getElementById('libThumbActions').style.display='none';
  document.getElementById('libThumbInput').value='';
  libThumbFile=null;libThumbCurrentUrl=null;
};
window.saveLibrary=async function(){
  if(!editingLibraryId)return;
  const name=document.getElementById('editLibraryName').value.trim();
  const desc=document.getElementById('editLibraryDesc').value.trim();
  if(!name){showNotif('Name required','warning');return;}
  const btn=document.getElementById('saveLibraryBtn');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>';
  try{
    let thumbUrl=libThumbCurrentUrl;
    if(libThumbFile){
      const ext=libThumbFile.name.split('.').pop();
      const path=`library-thumbnails/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
      const{data,error:upErr}=await supabase.storage.from('media').upload(path,libThumbFile,{cacheControl:'3600',upsert:false});
      if(upErr)throw upErr;
      const{data:{publicUrl}}=supabase.storage.from('media').getPublicUrl(data.path);
      thumbUrl=publicUrl;
    }
    const{error}=await supabase.rpc('update_playlist',{
      p_playlist_id:editingLibraryId,
      p_firebase_uid:currentUser.uid,
      p_name:name,
      p_description:desc||null,
      p_thumbnail_url:thumbUrl||null
    });

    if(error)throw error;
    const idx=libraries.findIndex(x=>x.id===editingLibraryId);
    if(idx!==-1){libraries[idx].name=name;libraries[idx].description=desc;libraries[idx].thumbnail_url=thumbUrl||null;}
    closeEditLibrary();renderLibrariesGrid();showNotif('Library updated','success');
  }catch(err){console.error(err);showNotif('Failed to save','error');}
  btn.disabled=false;btn.innerHTML='<i class="fas fa-check"></i> Save';
};
document.getElementById('editLibrarySheet').addEventListener('click',e=>{if(e.target===e.currentTarget)closeEditLibrary();});

/* ── Edit Profile — now includes freely-editable Name & Username ── */
window.validateUsernameInput=function(input){
  const hint=document.getElementById('usernameHint');
  let v=input.value.replace(/[^a-zA-Z0-9_]/g,'').toLowerCase();
  if(v!==input.value)input.value=v;
  if(v.length===0){
    usernameIsValid=false;
    hint.textContent='Username is required.';
    hint.classList.add('error');
    return;
  }
  if(v.length<3){
    usernameIsValid=false;
    hint.textContent='Must be at least 3 characters.';
    hint.classList.add('error');
    return;
  }
  usernameIsValid=true;
  hint.textContent='Letters, numbers, and underscores only.';
  hint.classList.remove('error');
};

window.openEditProfile=function(){
  if(!currentUserData)return;
  const bio=currentUserData.bio||'';
  document.getElementById('bioInputEdit').value=bio;
  document.getElementById('bioCharCount').textContent=`${bio.length}/300`;
  document.getElementById('fullNameInputEdit').value=currentUserData.full_name||'';
  document.getElementById('usernameInputEdit').value=currentUserData.username||'';
  usernameIsValid=true;
  document.getElementById('usernameHint').textContent='Letters, numbers, and underscores only.';
  document.getElementById('usernameHint').classList.remove('error');
  const prev=document.getElementById('avatarPreviewCircle');
  const rb=document.getElementById('removeAvatarBtn');
  if(currentUserData.pfp){prev.innerHTML=`<img src="${currentUserData.pfp}">`;rb.style.display='flex';}
  else{prev.innerHTML=`<i class="fas fa-user"></i>`;rb.style.display='none';}
  selectedAvatarDataUrl=null;
  document.getElementById('editProfileSheet').classList.add('show');
};
window.closeEditProfile=function(){document.getElementById('editProfileSheet').classList.remove('show');selectedAvatarDataUrl=null;document.getElementById('fileInputAvatar').value='';};
window.handleAvatarSelect=function(event){
  const f=event.target.files[0];if(!f)return;
  if(f.size>2*1024*1024){showNotif('Max 2MB','warning');event.target.value='';return;}
  const r=new FileReader();
  r.onload=e=>{selectedAvatarDataUrl=e.target.result;document.getElementById('avatarPreviewCircle').innerHTML=`<img src="${selectedAvatarDataUrl}">`;document.getElementById('removeAvatarBtn').style.display='flex';};

};
window.removeAvatar=function(){selectedAvatarDataUrl='';document.getElementById('avatarPreviewCircle').innerHTML=`<i class="fas fa-user"></i>`;document.getElementById('removeAvatarBtn').style.display='none';document.getElementById('fileInputAvatar').value='';};
window.saveProfile=async function(){
  if(!currentUser||!isOwnProfile)return;

  const fullName=document.getElementById('fullNameInputEdit').value.trim();
  const username=document.getElementById('usernameInputEdit').value.trim().toLowerCase();
  const bio=document.getElementById('bioInputEdit').value.trim();

  if(!username||!usernameIsValid){showNotif('Please choose a valid username','warning');return;}

  const btn=document.getElementById('saveProfileBtn');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>';
  try{
    // Guard against clashing with another account's username before
    // writing, since usernames are now freely editable.
    if(username!==(currentUserData.username||'').toLowerCase()){
      const{data:clash}=await supabase.from('users').select('id').eq('username',username).neq('firebase_uid',currentUser.uid).maybeSingle();
      if(clash){
        showNotif('That username is already taken','error');
        btn.disabled=false;btn.innerHTML='<i class="fas fa-check"></i> Save';
        return;
      }
    }

    const pfpProvided=selectedAvatarDataUrl!==null;
    const{error}=await supabase.rpc('update_user_profile',{
      p_firebase_uid:currentUser.uid,
      p_bio:bio,
      p_pfp:pfpProvided?(selectedAvatarDataUrl||null):null,
      p_pfp_provided:pfpProvided,
      p_full_name:fullName||null,
      p_username:username
    });
    if(error)throw error;
    const{data:refreshed}=await supabase.from('users').select('*').eq('firebase_uid',currentUser.uid).single();
    if(refreshed){currentUserData=refreshed;viewingUserData=refreshed;}
    closeEditProfile();
    const{count:fc}=await supabase.from('subscriptions').select('*',{count:'exact',head:true}).eq('author_id',currentUserData.id);
    renderHero(currentUserData,fc||0);
    // Keep the URL's ?username= in sync so a share link / refresh
    // still resolves to this profile after a rename.
    if(getParam('username') && refreshed?.username){
      const url=new URL(location.href);
      url.searchParams.set('username',refreshed.username);
      history.replaceState(null,'',url);
    }
    showNotif('Profile updated','success');
  }catch(err){console.error(err);showNotif('Failed to save','error');}
  btn.disabled=false;btn.innerHTML='<i class="fas fa-check"></i> Save';
};
document.getElementById('editProfileSheet').addEventListener('click',e=>{if(e.target===e.currentTarget)closeEditProfile();});

onAuthStateChanged(auth,async user=>{currentUser=user||null;await loadProfile(user);});
