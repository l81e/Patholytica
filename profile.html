<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Patholytica — Profile</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #0f0e0b;
  --text: #f5f0e8;
  --sub: #8a8070;
  --hover: #1a1810;
  --border: #2a2518;
  --accent: #c8a96e;
  --accent-h: #b8935a;
  --accent-glow: rgba(200,169,110,0.25);
  --accent-soft: rgba(200,169,110,0.12);
  --success: #4ade80;
  --error: #ef4444;
  --warn: #f59e0b;
}
body.light-theme {
  --bg: #faf6ee;
  --text: #1a1710;
  --sub: #706050;
  --hover: #f0ebe0;
  --border: #e0d8c8;
  --accent: #a07840;
  --accent-h: #8a6430;
  --accent-glow: rgba(160,120,64,0.2);
  --accent-soft: rgba(160,120,64,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:"DM Sans",sans-serif;
  background: var(--bg); color: var(--text);
  overflow:hidden; position:fixed; width:100%; height:100vh;
  transition: background .2s, color .2s;
}
.app {
  position:fixed; top:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:450px; height:100vh;
  background: var(--bg); display:flex; flex-direction:column;
}

/* ── Header ── */
.header {
  flex-shrink:0; display:flex; align-items:center; gap:10px;
  padding: 10px 16px;
  padding-top: calc(10px + env(safe-area-inset-top));
  background: rgba(15,14,11,0.96);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  z-index:40;
}
body.light-theme .header { background: rgba(250,246,238,0.96); }
.icon-btn {
  width:34px; height:34px; border-radius:50%;
  background: var(--hover); border: 1px solid var(--border);
  color: var(--text); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; transition: border-color .2s, color .2s; flex-shrink:0;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.header-center { flex:1; }
.header-title { font-size:14px; font-weight:700; font-family:'Merriweather',serif; }
.header-sub { font-size:10px; color: var(--sub); margin-top:1px; }

/* ── Scrollable content ── */
.profile-scroll {
  flex:1; overflow-y:auto; overflow-x:hidden;
}
.profile-scroll::-webkit-scrollbar { width:2px; }
.profile-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius:2px; }

/* ══════════════════════════════════
   HERO — completely redesigned
══════════════════════════════════ */
.hero {
  position:relative; padding: 20px 18px 18px;
  border-bottom: 1px solid var(--border);
}

/* top row: avatar + key stats */
.hero-top {
  display:flex; align-items:flex-start; gap:16px; margin-bottom:14px;
}

.hero-avatar-wrap { position:relative; flex-shrink:0; }
.hero-avatar {
  width:68px; height:68px; border-radius:50%;
  background: linear-gradient(135deg, var(--hover), var(--bg));
  border: 2px solid rgba(200,169,110,0.35);
  display:flex; align-items:center; justify-content:center;
  font-size:24px; font-weight:800; color: var(--accent);
  overflow:hidden;
  box-shadow: 0 0 0 4px var(--bg), 0 0 0 5px rgba(200,169,110,0.2);
}
.hero-avatar img { width:100%; height:100%; object-fit:cover; }

.hero-counters {
  flex:1; display:flex; gap:0;
  border: 1px solid var(--border); border-radius:12px;
  overflow:hidden; margin-top:6px;
}
.hero-counter {
  flex:1; display:flex; flex-direction:column; align-items:center;
  padding:10px 6px; position:relative;
}
.hero-counter + .hero-counter::before {
  content:''; position:absolute; left:0; top:20%; bottom:20%;
  width:1px; background: var(--border);
}
.hero-counter-val {
  font-size:17px; font-weight:800; color: var(--text); line-height:1;
  font-family:'Merriweather',serif;
}
.hero-counter-label { font-size:9px; font-weight:600; color: var(--sub); margin-top:3px; letter-spacing:.04em; text-transform:uppercase; }

/* username + bio + actions */
.hero-identity { margin-bottom:10px; }
.hero-username {
  font-size:18px; font-weight:800; color: var(--text);
  font-family:'Merriweather',serif; margin-bottom:4px; line-height:1.2;
}
.hero-full-name { font-size:12px; color: var(--sub); margin-bottom:8px; }
.hero-bio {
  font-size:13px; line-height:1.65; color: var(--text);
  white-space:pre-wrap; word-break:break-word;
}
.hero-bio-empty { font-size:12px; color: var(--sub); font-style:italic; }

/* action buttons row */
.hero-actions { display:flex; gap:8px; margin-top:12px; }
.btn-edit-profile {
  flex:1; padding:9px; border-radius:10px;
  background: var(--accent); color:#0f0e0b;
  font-size:12px; font-weight:700; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:6px;
  font-family:"DM Sans",sans-serif;
  box-shadow: 0 2px 10px var(--accent-glow);
  transition: background .15s;
}
.btn-edit-profile:hover { background: var(--accent-h); }
.btn-create-library {
  padding:9px 14px; border-radius:10px;
  background: var(--hover); border: 1px solid var(--border);
  color: var(--text); font-size:12px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:6px;
  font-family:"DM Sans",sans-serif;
  transition: border-color .15s, color .15s;
}
.btn-create-library:hover { border-color: var(--accent); color: var(--accent); }

/* ── Skeleton hero ── */
.hero-skeleton {
  padding:20px 18px 18px; border-bottom: 1px solid var(--border);
}
.sk-top { display:flex; gap:16px; margin-bottom:14px; }
.sk-av { width:68px; height:68px; border-radius:50%; flex-shrink:0; }
.sk-counters { flex:1; border:1px solid var(--border); border-radius:12px; margin-top:6px; }
.sk-name { height:18px; width:140px; border-radius:6px; margin-bottom:8px; }
.sk-bio-line { height:11px; border-radius:4px; margin-bottom:5px; }
@keyframes shimmer { 0%,100%{opacity:.3} 50%{opacity:.7} }
.sk { background: var(--hover); animation: shimmer 1.6s infinite; border-radius:6px; }

/* ── Tabs ── */
.tabs {
  flex-shrink:0; display:flex;
  border-bottom: 1px solid var(--border);
  background: var(--bg); position:sticky; top:0; z-index:20;
}
.tab-btn {
  flex:1; padding:11px 0; font-size:11px; font-weight:700;
  letter-spacing:.05em; text-transform:uppercase;
  background:none; border:none; color: var(--sub);
  cursor:pointer; transition: color .15s; position:relative;
  font-family:"DM Sans",sans-serif;
}
.tab-btn.active { color: var(--accent); }
.tab-btn.active::after {
  content:''; position:absolute; bottom:0; left:15%; right:15%;
  height:2px; background: var(--accent); border-radius:2px 2px 0 0;
}
.tab-btn i { margin-right:4px; font-size:10px; }

/* ── Panel ── */
.panel { display:none; }
.panel.active { display:block; }

/* ── Selection bar ── */
.selection-bar {
  position:sticky; top:0; z-index:10;
  background: var(--bg); border-bottom: 1px solid var(--border);
  padding:8px 14px; display:none; align-items:center; gap:8px;
}
.selection-bar.show { display:flex; }
.sel-count { font-size:12px; font-weight:700; color: var(--accent); flex:1; }
.sel-btn {
  padding:6px 11px; border-radius:7px; font-size:11px; font-weight:700;
  cursor:pointer; border:none; font-family:"DM Sans",sans-serif; transition: all .15s;
}
.sel-all { background: var(--hover); color: var(--text); border: 1px solid var(--border); }
.sel-all:hover { border-color: var(--accent); color: var(--accent); }
.sel-del { background: rgba(239,68,68,.12); color:#f87171; border: 1px solid rgba(239,68,68,.25); }
.sel-del:hover { background: rgba(239,68,68,.22); }
.sel-cancel { background:transparent; color: var(--sub); border: 1px solid var(--border); }

/* ── Article item ── */
.article-item {
  display:flex; align-items:flex-start; gap:12px;
  padding:13px 16px; border-bottom: 1px solid var(--border);
  cursor:pointer; transition: background .12s; position:relative;
  -webkit-tap-highlight-color:transparent;
}
.article-item:hover { background: var(--hover); }
.article-item.selected { background: rgba(200,169,110,.05); border-left:3px solid var(--accent); padding-left:13px; }
.article-select-box {
  width:20px; height:20px; border-radius:50%;
  border: 1.5px solid var(--border);
  display:none; align-items:center; justify-content:center;
  font-size:9px; flex-shrink:0; margin-top:3px;
  color:transparent; transition: all .15s;
}
.selection-mode .article-select-box { display:flex; }
.article-item.selected .article-select-box { background: var(--accent); border-color: var(--accent); color:#0f0e0b; }
.article-item-body { flex:1; min-width:0; }
.article-item-title {
  font-size:14px; font-weight:700; line-height:1.3; margin-bottom:5px;
  font-family:'Merriweather',serif; color: var(--text);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.article-item-meta { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.art-stat { font-size:11px; color: var(--sub); display:flex; align-items:center; gap:3px; }
.art-stat i { font-size:9px; }
.mcq-badge-sm {
  font-size:9px; font-weight:700; padding:1px 6px; border-radius:4px; margin-bottom:4px;
  background:rgba(74,222,128,.12); color:#4ade80; display:inline-block;
  letter-spacing:.06em; text-transform:uppercase;
}
.article-item-actions {
  display:flex; flex-direction:column; gap:5px; flex-shrink:0;
  opacity:0; transition: opacity .15s;
}
.article-item:hover .article-item-actions { opacity:1; }
.selection-mode .article-item-actions { display:none; }
.item-action {
  width:26px; height:26px; border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  font-size:10px; cursor:pointer; border:none; transition: all .15s;
}
.item-action.edit { background:rgba(200,169,110,.12); color: var(--accent); }
.item-action.edit:hover { background:rgba(200,169,110,.22); }
.item-action.del { background:rgba(239,68,68,.08); color:#f87171; }
.item-action.del:hover { background:rgba(239,68,68,.18); }

/* ── Library item (movie-poster style) ── */
.lib-grid {
  display:grid; grid-template-columns:1fr 1fr;
  gap:0; padding:0;
}
.library-card {
  position:relative; cursor:pointer;
  border-bottom: 1px solid var(--border);
  transition: background .12s;
  -webkit-tap-highlight-color:transparent;
}
.library-card:nth-child(odd) { border-right: 1px solid var(--border); }
.library-card:hover { background: var(--hover); }
.library-card.selected { background: rgba(200,169,110,.05); }

.lib-select-box {
  position:absolute; top:8px; left:8px; z-index:5;
  width:20px; height:20px; border-radius:50%;
  border: 1.5px solid rgba(255,255,255,.5);
  background:rgba(0,0,0,.4);
  display:none; align-items:center; justify-content:center;
  font-size:9px; color:transparent; backdrop-filter:blur(4px);
}
.selection-mode-lib .lib-select-box { display:flex; }
.library-card.selected .lib-select-box { background: var(--accent); border-color: var(--accent); color:#0f0e0b; }

.lib-poster {
  width:100%; aspect-ratio:3/4; position:relative; overflow:hidden;
  background: linear-gradient(135deg, var(--hover), var(--bg));
}
.lib-poster img { width:100%; height:100%; object-fit:cover; }
.lib-poster-placeholder {
  width:100%; height:100%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:8px;
}
.lib-poster-letter { font-size:32px; font-weight:800; color:rgba(200,169,110,.15); font-family:'Merriweather',serif; }
.lib-poster-icon { font-size:20px; color:rgba(200,169,110,.1); }
.lib-poster-gradient {
  position:absolute; inset:0;
  background:linear-gradient(to top, rgba(10,8,5,.95) 0%, rgba(10,8,5,.3) 50%, transparent 80%);
  display:flex; flex-direction:column; justify-content:flex-end; padding:10px;
}
.lib-count-chip {
  display:inline-flex; align-items:center; gap:3px;
  background:rgba(200,169,110,.18); border:1px solid rgba(200,169,110,.25);
  border-radius:5px; padding:2px 6px; font-size:9px; font-weight:700;
  color: var(--accent); align-self:flex-start; margin-bottom:5px;
  backdrop-filter:blur(4px);
}
.lib-poster-name {
  font-size:12px; font-weight:700; color:#f5f0e8; line-height:1.25;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  text-shadow:0 1px 4px rgba(0,0,0,.8);
}
.lib-card-actions {
  position:absolute; top:8px; right:8px; display:flex; gap:4px; z-index:5;
  opacity:0; transition: opacity .15s;
}
.library-card:hover .lib-card-actions { opacity:1; }
.selection-mode-lib .lib-card-actions { display:none; }
.lib-action {
  width:24px; height:24px; border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  font-size:9px; cursor:pointer; border:none; transition: all .15s;
  backdrop-filter:blur(6px);
}
.lib-action.edit { background:rgba(200,169,110,.3); color:#f5f0e8; }
.lib-action.del  { background:rgba(239,68,68,.35); color:#fff; }

/* ── Empty / Loading ── */
.feed-empty {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:50px 20px; gap:12px; color: var(--sub); text-align:center;
}
.feed-empty i { font-size:36px; opacity:.18; color: var(--accent); }
.feed-empty h3 { font-size:15px; color: var(--text); font-family:'Merriweather',serif; }
.feed-empty p { font-size:12px; }
.loading-wrap {
  display:flex; align-items:center; justify-content:center;
  padding:40px; gap:12px; color: var(--sub); font-size:13px;
}
.spinner { width:24px; height:24px; border:2.5px solid var(--border); border-top-color: var(--accent); border-radius:50%; animation:spin .8s linear infinite; flex-shrink:0; }
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Sheets ── */
.sheet-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.85);
  z-index:200; display:none; align-items:flex-end; justify-content:center;
  backdrop-filter:blur(4px);
}
.sheet-overlay.show { display:flex; }
.sheet {
  background:#141210; border-radius:20px 20px 0 0;
  border:1px solid var(--border); border-bottom:none;
  width:100%; max-width:450px; max-height:88vh;
  display:flex; flex-direction:column;
  animation:slideUp .3s cubic-bezier(.4,0,.2,1);
  padding-bottom: env(safe-area-inset-bottom);
}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0;flex-shrink:0;}
.sheet-header{padding:12px 18px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;}
.sheet-title{font-size:14px;font-weight:700;font-family:'Merriweather',serif;}
.sheet-close{width:28px;height:28px;border-radius:50%;background:var(--hover);border:1px solid var(--border);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:border-color .2s,color .2s;}
.sheet-close:hover{border-color:var(--accent);color:var(--accent);}
.sheet-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;}
.sheet-body::-webkit-scrollbar{width:2px;}
.sheet-body::-webkit-scrollbar-thumb{background:var(--border);}
.sheet-footer{padding:10px 18px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0;}

/* Form */
.form-field label{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin-bottom:7px;}
.form-input{width:100%;padding:10px 13px;background:var(--hover);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none;font-family:"DM Sans",sans-serif;transition:border-color .2s,box-shadow .2s;}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.form-input::placeholder{color:var(--sub);opacity:.5;}
.form-textarea{width:100%;padding:10px 13px;background:var(--hover);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;outline:none;resize:none;font-family:"DM Sans",sans-serif;line-height:1.55;transition:border-color .2s,box-shadow .2s;min-height:80px;}
.form-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.form-textarea::placeholder{color:var(--sub);opacity:.5;}
.char-count{font-size:10px;color:var(--sub);text-align:right;margin-top:4px;}

/* Avatar upload */
.avatar-upload-row{display:flex;align-items:center;gap:14px;}
.avatar-preview{width:60px;height:60px;border-radius:50%;background:var(--accent-soft);border:2px solid rgba(200,169,110,0.3);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--accent);overflow:hidden;flex-shrink:0;}
.avatar-preview img{width:100%;height:100%;object-fit:cover;}
.avatar-btns{display:flex;flex-direction:column;gap:6px;flex:1;}
.btn-upload-av,.btn-remove-av{padding:7px 12px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-family:"DM Sans",sans-serif;transition:all .15s;}
.btn-upload-av{background:var(--hover);border:1px solid var(--border);color:var(--text);}
.btn-upload-av:hover{border-color:var(--accent);color:var(--accent);}
.btn-remove-av{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.2);color:#f87171;}
.btn-remove-av:hover{background:rgba(239,68,68,.15);}
.upload-hint{font-size:10px;color:var(--sub);}

/* Thumbnail section (library) */
.thumb-preview{width:100%;height:140px;border-radius:12px;background: linear-gradient(135deg, var(--hover), var(--bg));border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative;transition:border-color .2s;}
.thumb-preview:hover{border-color:var(--accent);}
.thumb-preview img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.thumb-preview-overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;opacity:0;transition:opacity .2s;}
.thumb-preview:hover .thumb-preview-overlay{opacity:1;}
.thumb-preview-placeholder{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--sub);}
.thumb-preview-placeholder i{font-size:28px;opacity:.4;}
.thumb-preview-placeholder span{font-size:11px;font-weight:600;}
.thumb-actions{display:flex;gap:6px;margin-top:8px;}
.thumb-action-btn{flex:1;padding:7px 10px;border-radius:7px;border:1px solid var(--border);background:var(--hover);color:var(--sub);font-size:10px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .15s;}
.thumb-action-btn:hover{border-color:var(--accent);color:var(--accent);}
.thumb-action-btn.danger:hover{border-color:var(--error);color:#f87171;}

/* Sheet buttons */
.btn{flex:1;padding:11px 8px;border-radius:10px;border:none;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;font-family:"DM Sans",sans-serif;}
.btn-secondary{background:var(--hover);color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
.btn-primary{background:var(--accent);color:#0f0e0b;box-shadow:0 2px 10px var(--accent-glow);}
.btn-primary:hover{background:var(--accent-h);}
.btn-danger{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.22);}
.btn-danger:hover{background:rgba(239,68,68,.22);}
.btn:disabled{opacity:.35;cursor:not-allowed;}

/* Confirm */
.confirm-icon{display:flex;align-items:center;justify-content:center;margin-bottom:4px;}
.confirm-icon i{font-size:30px;color:#f87171;}
.confirm-title{font-size:15px;font-weight:800;text-align:center;margin-bottom:6px;font-family:'Merriweather',serif;}
.confirm-msg{font-size:12px;color:var(--sub);text-align:center;line-height:1.55;}

/* Toast */
.notif{position:fixed;top:calc(60px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#141210;border:1px solid var(--border);border-radius:10px;padding:10px 16px;box-shadow:0 8px 32px rgba(0,0,0,.6);z-index:500;display:none;align-items:center;gap:8px;min-width:200px;max-width:300px;}
.notif.show{display:flex;animation:notifIn .25s ease;}
.notif.success{border-left:3px solid var(--success);}
.notif.error{border-left:3px solid var(--error);}
.notif.warning{border-left:3px solid var(--warn);}
.notif i{font-size:13px;}

<script type="module">

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const supabase=window.supabase.createClient("https://vduqewqyvszfquntmark.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZkdXFld3F5dnN6ZnF1bnRtYXJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2MTg3MjgsImV4cCI6MjA4NTE5NDcyOH0.V2JellFmUGgYhKfW-D4CBdcBHyPztOlcgLCBdhnXj7c");

let currentUser=null,currentUserData=null,viewingUserData=null,isOwnProfile=false;

let selectedArticles=new Set(),selectedLibraries=new Set();
let inSelArt=false,inSelLib=false;
let editingArticleId=null,editingLibraryId=null;
let selectedAvatarDataUrl=null;
let libThumbFile=null, libThumbCurrentUrl=null;

function getParam(n){return new URLSearchParams(location.search).get(n);}
function fmt(n){if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1000)return(n/1000).toFixed(1)+'K';return(n||0).toString();}
function fmtDate(d){const now=new Date(),ms=now-d,m=Math.floor(ms/60000),h=Math.floor(ms/3600000),dy=Math.floor(ms/86400000);if(m<60)return m+'m ago';if(h<24)return h+'h ago';if(dy<7)return dy+'d ago';return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function isMCQ(c){return typeof c==='string'&&c.trimStart().startsWith('❔');}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

window.showNotif=function(msg,type='success'){
  const el=document.getElementById('notif');
  el.querySelector('i').className=type==='success'?'fas fa-check-circle':type==='warning'?'fas fa-exclamation-triangle':'fas fa-exclamation-circle';
  document.getElementById('notifText').textContent=msg;
  el.className=`notif ${type} show`;
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),4000);
};
window.toggleTheme=function(){const l=document.body.classList.toggle('light-theme');localStorage.setItem('theme',l?'light':'dark');};
window.goBack=function(){if(document.referrer&&document.referrer.includes(location.host))history.back();else location.href='index.html';};
window.switchTab=function(tab){
  ['articles','libraries'].forEach(t=>{
    document.getElementById(`tab${t.charAt(0).toUpperCase()+t.slice(1)}`).classList.toggle('active',t===tab);
    document.getElementById(`panel${t.charAt(0).toUpperCase()+t.slice(1)}`).classList.toggle('active',t===tab);
  });
};

function renderHero(ud){
  const artCount=articles.length;
  const totalViews=articles.reduce((s,a)=>s+(a.views||0),0);
  const totalLikes=articles.reduce((s,a)=>s+(a.likes||0),0);
  const libCount=libraries.length;
  const avatarHTML=ud.pfp?`<img src="${escHtml(ud.pfp)}" alt="pfp">`:(ud.username||'U')[0].toUpperCase();
  const bioHTML=ud.bio
    ?`<div class="hero-bio">${escHtml(ud.bio)}</div>`
    :`<div class="hero-bio-empty">${isOwnProfile?'Add a bio to tell people about yourself…':'No bio yet.'}</div>`;
  document.getElementById('heroArea').innerHTML=`
    <div class="hero">
      <div class="hero-top">
        <div class="hero-avatar-wrap">
          <div class="hero-avatar">${avatarHTML}</div>
        </div>
        <div class="hero-counters">
          <div class="hero-counter"><div class="hero-counter-val">${fmt(artCount)}</div><div class="hero-counter-label">Articles</div></div>
          <div class="hero-counter"><div class="hero-counter-val">${fmt(totalViews)}</div><div class="hero-counter-label">Views</div></div>
          <div class="hero-counter"><div class="hero-counter-val">${fmt(totalLikes)}</div><div class="hero-counter-label">Likes</div></div>
          <div class="hero-counter"><div class="hero-counter-val">${fmt(libCount)}</div><div class="hero-counter-label">Libraries</div></div>
        </div>
      </div>
      <div class="hero-identity">
        <div class="hero-username">@${escHtml(ud.username||'user')}</div>
        ${ud.full_name&&ud.full_name!==ud.username?`<div class="hero-full-name">${escHtml(ud.full_name)}</div>`:''}
        ${bioHTML}
      </div>
      ${isOwnProfile?`
      <div class="hero-actions">
        <button class="btn-edit-profile" onclick="openEditProfile()"><i class="fas fa-pen"></i> Edit Profile</button>
        <button class="btn-create-library" onclick="location.href='create-library.html'"><i class="fas fa-plus"></i> Library</button>
      </div>`:''}
    </div>`;
  document.getElementById('headerTitle').textContent=`@${ud.username||'user'}`;
  document.getElementById('headerSub').textContent=isOwnProfile?'Your profile':'Profile';
  document.getElementById('tabsBar').style.display='flex';
}

async function loadProfile(loggedInUser){
  currentUser=loggedInUser;
  const usernameParam=getParam('username');
  try{
    let ud,userFirebaseId;
    if(usernameParam){
      const{data:pu,error}=await supabase.from('users').select('*').eq('username',usernameParam).single();
      if(error||!pu){document.getElementById('heroArea').innerHTML='';return;}
      ud=pu; userFirebaseId=pu.firebase_uid;
      isOwnProfile=!!(loggedInUser&&loggedInUser.uid===userFirebaseId);
      if(isOwnProfile)currentUserData=ud;
    } else {
      if(!loggedInUser){setTimeout(()=>location.href='login.html',1200);return;}
      const{data:own}=await supabase.from('users').select('*').eq('firebase_uid',loggedInUser.uid).single();
      if(!own)return;
      ud=own; userFirebaseId=loggedInUser.uid;
      currentUserData=ud; isOwnProfile=true;
    }
    viewingUserData=ud;
    const{data:arts}=await supabase.from('articles').select('*').eq('firebase_user_id',userFirebaseId).order('created_at',{ascending:false});
    articles=arts||[];
    const{data:libs}=await supabase.from('playlists').select('*').eq('user_id',ud.user_id).order('name',{ascending:true});
    libraries=libs||[];
    if(libraries.length>0){
      const{data:pi}=await supabase.from('playlist_items').select('playlist_id');
      libCounts={};(pi||[]).forEach(r=>{libCounts[r.playlist_id]=(libCounts[r.playlist_id]||0)+1;});
    }
    renderHero(ud);
    renderArticlesList();
    renderLibrariesGrid();
  }catch(e){console.error(e);}
}

function renderArticlesList(){
  const el=document.getElementById('articlesList');
  if(!articles.length){
    el.innerHTML=`<div class="feed-empty"><i class="fas fa-file-alt"></i><h3>No articles yet</h3><p>${isOwnProfile?"You haven't written anything yet.":"No articles from this user."}</p></div>`;return;
  }
  el.innerHTML='';
  articles.forEach(a=>{
    const div=document.createElement('div');div.className='article-item';div.dataset.id=a.id;
    const mcq=isMCQ(a.content);
    div.innerHTML=`
      <div class="article-select-box"><i class="fas fa-check" style="font-size:9px;"></i></div>
      <div class="article-item-body">
        ${mcq?'<div class="mcq-badge-sm">MCQ</div>':''}
        <div class="article-item-title">${escHtml(a.title||'Untitled')}</div>
        <div class="article-item-meta">
          <span class="art-stat"><i class="fas fa-eye"></i>${fmt(a.views||0)}</span>
          <span class="art-stat"><i class="fas fa-heart"></i>${fmt(a.likes||0)}</span>
          <span class="art-stat">${fmtDate(new Date(a.created_at))}</span>
        </div>
      </div>
      ${isOwnProfile?`
      <div class="article-item-actions">
        <button class="item-action edit" onclick="openEditArticle(event,${a.id})"><i class="fas fa-pen"></i></button>
        <button class="item-action del" onclick="confirmDeleteArticle(event,${a.id})"><i class="fas fa-trash"></i></button>
      </div>`:''}`;
    if(isOwnProfile){
      let pt;
      div.addEventListener('pointerdown',()=>{pt=setTimeout(()=>{enterSelArt();toggleArtSel(a.id);},500);});
      div.addEventListener('pointerup',()=>clearTimeout(pt));
      div.addEventListener('pointerleave',()=>clearTimeout(pt));
      div.addEventListener('click',()=>{if(inSelArt){toggleArtSel(a.id);return;}location.href=`article.html?id=${a.id}`;});
    } else {
      div.addEventListener('click',()=>location.href=`article.html?id=${a.id}`);
    }
    el.appendChild(div);
  });
}

function renderLibrariesGrid(){
  const grid=document.getElementById('librariesGrid');
  if(!libraries.length){
    grid.style.display='block';
    grid.innerHTML=`<div class="feed-empty"><i class="fas fa-book-open"></i><h3>No libraries yet</h3><p>${isOwnProfile?"Create your first library.":"No libraries from this user."}</p></div>`;
    return;
  }
  grid.style.display='grid';
  grid.innerHTML='';
  libraries.forEach(lib=>{
    const count=libCounts[lib.id]||0;
    const card=document.createElement('div');card.className='library-card';card.dataset.id=lib.id;
    const firstLetter=(lib.name||'?')[0].toUpperCase();
    const posterContent=lib.thumbnail_url
      ?`<img src="${escHtml(lib.thumbnail_url)}" alt="${escHtml(lib.name||'')}">`
      :`<div class="lib-poster-placeholder"><div class="lib-poster-letter">${firstLetter}</div><div class="lib-poster-icon"><i class="fas fa-book-open"></i></div></div>`;
    card.innerHTML=`
      <div class="lib-select-box"><i class="fas fa-check" style="font-size:9px;"></i></div>
      ${isOwnProfile?`<div class="lib-card-actions">
        <button class="lib-action edit" onclick="openEditLibrary(event,${lib.id})"><i class="fas fa-pen"></i></button>
        <button class="lib-action del" onclick="confirmDeleteLibrary(event,${lib.id})"><i class="fas fa-trash"></i></button>
      </div>`:''}
      <div class="lib-poster">
        ${posterContent}
        <div class="lib-poster-gradient">
          <div class="lib-count-chip"><i class="fas fa-layer-group"></i> ${count}</div>
          <div class="lib-poster-name">${escHtml(lib.name||'Untitled')}</div>
        </div>
      </div>`;
    if(isOwnProfile){
      let pt;
      card.addEventListener('pointerdown',()=>{pt=setTimeout(()=>{enterSelLib();toggleLibSel(lib.id);},500);});
      card.addEventListener('pointerup',()=>clearTimeout(pt));
      card.addEventListener('pointerleave',()=>clearTimeout(pt));
      card.addEventListener('click',()=>{if(inSelLib){toggleLibSel(lib.id);return;}});
    }
    grid.appendChild(card);
  });
}

/* ── Article selection ── */
function enterSelArt(){inSelArt=true;document.getElementById('articlesList').classList.add('selection-mode');document.getElementById('selBarArticles').classList.add('show');}
window.exitSelectionModeArticles=function(){inSelArt=false;selectedArticles.clear();document.getElementById('articlesList').classList.remove('selection-mode');document.getElementById('selBarArticles').classList.remove('show');document.querySelectorAll('#articlesList .article-item').forEach(e=>e.classList.remove('selected'));updSelArt();};
function toggleArtSel(id){const el=document.querySelector(`#articlesList .article-item[data-id="${id}"]`);if(!el)return;if(selectedArticles.has(id)){selectedArticles.delete(id);el.classList.remove('selected');}else{selectedArticles.add(id);el.classList.add('selected');}updSelArt();}
function updSelArt(){document.getElementById('selCountArticles').textContent=`${selectedArticles.size} selected`;}
window.selectAllArticles=function(){if(!inSelArt)enterSelArt();articles.forEach(a=>{selectedArticles.add(a.id);const el=document.querySelector(`#articlesList .article-item[data-id="${a.id}"]`);if(el)el.classList.add('selected');});updSelArt();};

/* ── Library selection ── */
function enterSelLib(){inSelLib=true;document.getElementById('librariesGrid').classList.add('selection-mode-lib');document.getElementById('selBarLibraries').classList.add('show');}
window.exitSelectionModeLibraries=function(){inSelLib=false;selectedLibraries.clear();document.getElementById('librariesGrid').classList.remove('selection-mode-lib');document.getElementById('selBarLibraries').classList.remove('show');document.querySelectorAll('.library-card').forEach(e=>e.classList.remove('selected'));updSelLib();};
function toggleLibSel(id){const el=document.querySelector(`.library-card[data-id="${id}"]`);if(!el)return;if(selectedLibraries.has(id)){selectedLibraries.delete(id);el.classList.remove('selected');}else{selectedLibraries.add(id);el.classList.add('selected');}updSelLib();}
function updSelLib(){document.getElementById('selCountLibraries').textContent=`${selectedLibraries.size} selected`;}
window.selectAllLibraries=function(){if(!inSelLib)enterSelLib();libraries.forEach(l=>{selectedLibraries.add(l.id);const el=document.querySelector(`.library-card[data-id="${l.id}"]`);if(el)el.classList.add('selected');});updSelLib();};

/* ── Confirm sheet ── */
let _confirmCb=null;
function openConfirmSheet(title,msg,cb){
  document.getElementById('confirmTitle').textContent=title;
  document.getElementById('confirmMsg').textContent=msg;
  _confirmCb=cb;
  const btn=document.getElementById('confirmActionBtn');
  btn.onclick=async()=>{btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Deleting…';await cb();btn.disabled=false;btn.innerHTML='<i class="fas fa-trash"></i> Delete';closeConfirmSheet();};
  document.getElementById('confirmSheet').classList.add('show');
}
window.closeConfirmSheet=function(){document.getElementById('confirmSheet').classList.remove('show');_confirmCb=null;};
document.getElementById('confirmSheet').addEventListener('click',e=>{if(e.target===e.currentTarget)closeConfirmSheet();});

/* ── Delete article ── */
window.confirmDeleteArticle=function(e,id){
  e.stopPropagation();
  const a=articles.find(x=>x.id===id);
  openConfirmSheet('Delete Article',`"${(a?.title||'').slice(0,60)}" will be permanently deleted.`,async()=>{
    try{
      await supabase.from('media').delete().eq('article_id',id);
      await supabase.from('comments').delete().eq('article_id',id);
      await supabase.from('likes').delete().eq('article_id',id);
      await supabase.from('playlist_items').delete().eq('article_id',id);
      const{error}=await supabase.from('articles').delete().eq('id',id);
      if(error)throw error;
      articles=articles.filter(x=>x.id!==id);
      renderArticlesList();renderHero(viewingUserData);
      showNotif('Article deleted','success');
    }catch(err){showNotif('Failed to delete','error');}
  });
};
window.confirmBulkDeleteArticles=function(){
  if(!selectedArticles.size){showNotif('None selected','warning');return;}
  const n=selectedArticles.size;
  openConfirmSheet(`Delete ${n} Article${n>1?'s':''}`,`${n} article${n>1?'s':''} will be permanently deleted.`,async()=>{
    try{
      const ids=[...selectedArticles];
      await supabase.from('media').delete().in('article_id',ids);
      await supabase.from('comments').delete().in('article_id',ids);
      await supabase.from('likes').delete().in('article_id',ids);
      await supabase.from('playlist_items').delete().in('article_id',ids);
      const{error}=await supabase.from('articles').delete().in('id',ids);
      if(error)throw error;
      articles=articles.filter(x=>!ids.includes(x.id));
      exitSelectionModeArticles();renderArticlesList();renderHero(viewingUserData);
      showNotif(`${n} article${n>1?'s':''} deleted`,'success');
    }catch(err){showNotif('Failed to delete','error');}
  });
};

/* ── Delete library ── */
window.confirmDeleteLibrary=function(e,id){
  e.stopPropagation();
  const l=libraries.find(x=>x.id===id);
  openConfirmSheet('Delete Library',`"${(l?.name||'').slice(0,60)}" will be deleted. Articles inside won't be affected.`,async()=>{
    try{
      await supabase.from('playlist_items').delete().eq('playlist_id',id);
      const{error}=await supabase.from('playlists').delete().eq('id',id);
      if(error)throw error;
      libraries=libraries.filter(x=>x.id!==id);
      delete libCounts[id];
      renderLibrariesGrid();renderHero(viewingUserData);
      showNotif('Library deleted','success');
    }catch(err){showNotif('Failed to delete','error');}
  });
};
window.confirmBulkDeleteLibraries=function(){
  if(!selectedLibraries.size){showNotif('None selected','warning');return;}
  const n=selectedLibraries.size;
  openConfirmSheet(`Delete ${n} Librar${n>1?'ies':'y'}`,`${n} librar${n>1?'ies':'y'} will be deleted. Articles won't be affected.`,async()=>{
    try{
      const ids=[...selectedLibraries];
      await supabase.from('playlist_items').delete().in('playlist_id',ids);
      const{error}=await supabase.from('playlists').delete().in('id',ids);
      if(error)throw error;
      libraries=libraries.filter(x=>!ids.includes(x.id));
      ids.forEach(id=>delete libCounts[id]);
      exitSelectionModeLibraries();renderLibrariesGrid();renderHero(viewingUserData);
      showNotif(`${n} librar${n>1?'ies':'y'} deleted`,'success');
    }catch(err){showNotif('Failed to delete','error');}
  });
};

/* ── Edit article ── */
window.openEditArticle=function(e,id){
  e.stopPropagation();
  const a=articles.find(x=>x.id===id);if(!a)return;
  editingArticleId=id;
  document.getElementById('editArticleTitle').value=a.title||'';
  document.getElementById('editArticleContent').value=a.content||'';
  document.getElementById('editArticleSheet').classList.add('show');
};
window.closeEditArticle=function(){document.getElementById('editArticleSheet').classList.remove('show');editingArticleId=null;};
window.saveArticle=async function(){
  if(!editingArticleId)return;
  const title=document.getElementById('editArticleTitle').value.trim();
  const content=document.getElementById('editArticleContent').value.trim();
  if(!title){showNotif('Title required','warning');return;}
  const btn=document.getElementById('saveArticleBtn');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>';
  try{
    const{error}=await supabase.from('articles').update({title,content}).eq('id',editingArticleId);
    if(error)throw error;
    const idx=articles.findIndex(x=>x.id===editingArticleId);
    if(idx!==-1){articles[idx].title=title;articles[idx].content=content;}
    closeEditArticle();renderArticlesList();showNotif('Saved','success');
  }catch(err){showNotif('Failed to save','error');}
  btn.disabled=false;btn.innerHTML='<i class="fas fa-check"></i> Save';
};
document.getElementById('editArticleSheet').addEventListener('click',e=>{if(e.target===e.currentTarget)closeEditArticle();});

/* ── Edit library ── */
window.openEditLibrary=function(e,id){
  e.stopPropagation();
  const l=libraries.find(x=>x.id===id);if(!l)return;
  editingLibraryId=id;
  libThumbFile=null;libThumbCurrentUrl=l.thumbnail_url||null;
  document.getElementById('editLibraryName').value=l.name||'';
  document.getElementById('editLibraryDesc').value=l.description||'';
  const prev=document.getElementById('libThumbPreview');
  const placeholder=document.getElementById('libThumbPlaceholder');
  const actions=document.getElementById('libThumbActions');
  prev.querySelectorAll('img').forEach(img=>img.remove());
  if(l.thumbnail_url){
    const img=document.createElement('img');img.src=l.thumbnail_url;
    prev.insertBefore(img,placeholder);
    placeholder.style.display='none';actions.style.display='flex';
  } else {
    placeholder.style.display='flex';actions.style.display='none';
  }
  document.getElementById('editLibrarySheet').classList.add('show');
};
window.closeEditLibrary=function(){document.getElementById('editLibrarySheet').classList.remove('show');editingLibraryId=null;libThumbFile=null;};
window.handleLibThumb=function(input){
  const f=input.files[0];if(!f)return;
  if(f.size>5*1024*1024){showNotif('Max 5MB','warning');input.value='';return;}
  libThumbFile=f;
  const r=new FileReader();
  r.onload=ev=>{
    const prev=document.getElementById('libThumbPreview');
    const placeholder=document.getElementById('libThumbPlaceholder');
    prev.querySelectorAll('img').forEach(img=>img.remove());
    const img=document.createElement('img');img.src=ev.target.result;
    prev.insertBefore(img,placeholder);
    placeholder.style.display='none';
    document.getElementById('libThumbActions').style.display='flex';
  };
  r.readAsDataURL(f);
};
window.removeLibThumb=function(){
  const prev=document.getElementById('libThumbPreview');
  prev.querySelectorAll('img').forEach(img=>img.remove());
  document.getElementById('libThumbPlaceholder').style.display='flex';
  document.getElementById('libThumbActions').style.display='none';
  document.getElementById('libThumbInput').value='';
  libThumbFile=null;libThumbCurrentUrl=null;
};
window.saveLibrary=async function(){
  if(!editingLibraryId)return;
  const name=document.getElementById('editLibraryName').value.trim();
  const desc=document.getElementById('editLibraryDesc').value.trim();
  if(!name){showNotif('Name required','warning');return;}
  const btn=document.getElementById('saveLibraryBtn');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>';
  try{
    let thumbUrl=libThumbCurrentUrl;
    if(libThumbFile){
      const ext=libThumbFile.name.split('.').pop();
      const path=`library-thumbnails/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
      const{data,error:upErr}=await supabase.storage.from('media').upload(path,libThumbFile,{cacheControl:'3600',upsert:false});
      if(upErr)throw upErr;
      const{data:{publicUrl}}=supabase.storage.from('media').getPublicUrl(data.path);
      thumbUrl=publicUrl;
    }
    const{error}=await supabase.from('playlists').update({name,description:desc||null,thumbnail_url:thumbUrl||null}).eq('id',editingLibraryId);
    if(error)throw error;
    const idx=libraries.findIndex(x=>x.id===editingLibraryId);
    if(idx!==-1){libraries[idx].name=name;libraries[idx].description=desc;libraries[idx].thumbnail_url=thumbUrl||null;}
    closeEditLibrary();renderLibrariesGrid();showNotif('Library updated','success');
  }catch(err){console.error(err);showNotif('Failed to save','error');}
  btn.disabled=false;btn.innerHTML='<i class="fas fa-check"></i> Save';
};
document.getElementById('editLibrarySheet').addEventListener('click',e=>{if(e.target===e.currentTarget)closeEditLibrary();});

/* ── Edit Profile ── */
window.openEditProfile=function(){
  if(!currentUserData)return;
  const bio=currentUserData.bio||'';
  document.getElementById('bioInputEdit').value=bio;
  document.getElementById('bioCharCount').textContent=`${bio.length}/300`;
  const prev=document.getElementById('avatarPreviewCircle');
  const rb=document.getElementById('removeAvatarBtn');
  if(currentUserData.pfp){prev.innerHTML=`<img src="${currentUserData.pfp}">`;rb.style.display='flex';}
  else{prev.innerHTML=`<i class="fas fa-user"></i>`;rb.style.display='none';}
  selectedAvatarDataUrl=null;
  document.getElementById('editProfileSheet').classList.add('show');
};
window.closeEditProfile=function(){document.getElementById('editProfileSheet').classList.remove('show');selectedAvatarDataUrl=null;document.getElementById('fileInputAvatar').value='';};
window.handleAvatarSelect=function(event){
  const f=event.target.files[0];if(!f)return;
  if(f.size>2*1024*1024){showNotif('Max 2MB','warning');event.target.value='';return;}
  const r=new FileReader();
  r.onload=e=>{selectedAvatarDataUrl=e.target.result;document.getElementById('avatarPreviewCircle').innerHTML=`<img src="${selectedAvatarDataUrl}">`;document.getElementById('removeAvatarBtn').style.display='flex';};
  r.readAsDataURL(f);
};
window.removeAvatar=function(){selectedAvatarDataUrl='';document.getElementById('avatarPreviewCircle').innerHTML=`<i class="fas fa-user"></i>`;document.getElementById('removeAvatarBtn').style.display='none';document.getElementById('fileInputAvatar').value='';};
window.saveProfile=async function(){
  if(!currentUser||!isOwnProfile)return;
  const btn=document.getElementById('saveProfileBtn');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>';
  try{
    const updateData={bio:document.getElementById('bioInputEdit').value.trim()};
    if(selectedAvatarDataUrl!==null)updateData.pfp=selectedAvatarDataUrl||null;
    const{error}=await supabase.from('users').update(updateData).eq('firebase_uid',currentUser.uid);
    if(error)throw error;
    const{data:refreshed}=await supabase.from('users').select('*').eq('firebase_uid',currentUser.uid).single();
    if(refreshed){currentUserData=refreshed;viewingUserData=refreshed;}
    closeEditProfile();renderHero(currentUserData);showNotif('Profile updated','success');
  }catch(err){showNotif('Failed to save','error');}
  btn.disabled=false;btn.innerHTML='<i class="fas fa-check"></i> Save';
};
document.getElementById('editProfileSheet').addEventListener('click',e=>{if(e.target===e.currentTarget)closeEditProfile();});

onAuthStateChanged(auth,async user=>{currentUser=user||null;await loadProfile(user);});
</script>
