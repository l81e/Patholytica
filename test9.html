<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Patholytica — Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>

/* ══════════════════════════════════════════════
   CSS VARIABLES — same as feedpage
══════════════════════════════════════════════ */
:root {
  --bg-color: #0f0e0b;
  --text-primary: #f5f0e8;
  --text-secondary: #8a8070;
  --card-bg: #0f0e0b;
  --hover-bg: #1a1810;
  --border-color: #2a2518;
  --accent: #c8a96e;
  --accent-hover: #b8935a;
  --accent-glow: rgba(200,169,110,0.25);
  --accent-soft: rgba(200,169,110,0.12);
  --font-article: 'Merriweather', serif;
  --font-ui: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
}
body.theme-dark {
  --bg-color: #0f0e0b; --text-primary: #f5f0e8; --text-secondary: #8a8070;
  --hover-bg: #1a1810; --border-color: #2a2518;
  --accent: #c8a96e; --accent-hover: #b8935a;
  --accent-glow: rgba(200,169,110,0.25); --accent-soft: rgba(200,169,110,0.12);
}
body.theme-light {
  --bg-color: #faf6ee; --text-primary: #1a1710; --text-secondary: #706050;
  --hover-bg: #f0ebe0; --border-color: #e0d8c8;
  --accent: #a07840; --accent-hover: #8a6430;
  --accent-glow: rgba(160,120,64,0.2); --accent-soft: rgba(160,120,64,0.08);
}
body.font-serif  { --font-article: 'Merriweather', serif; }
body.font-slab   { --font-article: 'Source Serif 4', serif; }
body.font-modern { --font-article: 'Inter', sans-serif; }

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  font-family: var(--font-ui);
  background: var(--bg-color);
  color: var(--text-primary);
  overflow-x: hidden;
  transition: background 0.2s ease, color 0.2s ease;
}

/* ══════════════════════════════════════════════
   HEADER
══════════════════════════════════════════════ */
.header-wrapper {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(15,14,11,0.96);
  border-bottom: 1px solid #2a2518;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  padding-top: env(safe-area-inset-top);
}
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 18px; max-width: 1200px; margin: 0 auto;
}
.header-logo { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.header-logo img { height: 24px; width: auto; }
.header-right { display: flex; align-items: center; gap: 8px; }

.hdr-chip {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 600; color: var(--text-secondary);
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 20px; padding: 5px 12px; cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.hdr-chip.logged-in { color: var(--accent); border-color: rgba(200,169,110,0.3); background: var(--accent-soft); }
.hdr-chip i { font-size: 10px; }
.hdr-icon-btn {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  color: var(--text-secondary); font-size: 13px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: border-color 0.15s, color 0.15s; position: relative;
}
.hdr-icon-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ══════════════════════════════════════════════
   SETTINGS POPOVER — same as feedpage
══════════════════════════════════════════════ */
.settings-popover {
  position: fixed; z-index: 500;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 16px; padding: 14px; width: 220px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  opacity: 0; pointer-events: none;
  transform: translateY(-8px) scale(0.97);
  transition: opacity 0.2s, transform 0.2s;
}
.settings-popover.open { opacity: 1; pointer-events: all; transform: translateY(0) scale(1); }
.sp-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color);
}
.sp-title { font-size: 12px; font-weight: 800; }
.sp-close {
  width: 22px; height: 22px; border-radius: 50%; background: var(--bg-color);
  border: 1px solid var(--border-color); color: var(--text-secondary);
  cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center;
}
.sp-close:hover { border-color: var(--accent); color: var(--accent); }
.sp-section { margin-bottom: 12px; }
.sp-section:last-child { margin-bottom: 0; }
.sp-label { font-size: 9px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 7px; }
.sp-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sp-pill {
  padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
  border: 1px solid var(--border-color); background: var(--bg-color);
  color: var(--text-secondary); cursor: pointer; transition: all 0.15s;
  font-family: var(--font-ui);
}
.sp-pill.active { background: var(--accent); color: #0f0e0b; border-color: var(--accent); }
.sp-pill:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
.sp-toggle-row { display: flex; align-items: center; justify-content: space-between; }
.sp-toggle-label { font-size: 12px; font-weight: 600; color: var(--text-primary); }
.sp-toggle {
  width: 36px; height: 20px; border-radius: 10px;
  background: var(--border-color); cursor: pointer; position: relative;
  transition: background 0.2s; flex-shrink: 0;
}
.sp-toggle.on { background: var(--accent); }
.sp-toggle::after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform 0.2s; }
.sp-toggle.on::after { transform: translateX(16px); }

/* ══════════════════════════════════════════════
   TABS
══════════════════════════════════════════════ */
.tabs-wrapper {
  position: fixed; top: calc(44px + env(safe-area-inset-top)); left: 0; right: 0; z-index: 90;
  background: var(--bg-color);
  border-bottom: 1px solid var(--border-color);
}
.tabs {
  display: flex; align-items: center; gap: 0;
  max-width: 1200px; margin: 0 auto;
  padding: 0 18px; overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 10px 16px; font-size: 12px; font-weight: 700;
  background: none; border: none; cursor: pointer;
  color: var(--text-secondary); white-space: nowrap;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
  font-family: var(--font-ui);
}
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-btn:hover { color: var(--text-primary); }
.tab-btn i { font-size: 12px; }

/* ══════════════════════════════════════════════
   MAIN CONTENT AREA
══════════════════════════════════════════════ */
.page-body {
  max-width: 1200px; margin: 0 auto;
  padding: 0 14px;
  padding-top: calc(44px + 41px + env(safe-area-inset-top) + 12px);
  padding-bottom: calc(80px + env(safe-area-inset-bottom));
}

/* ══════════════════════════════════════════════
   CREATORS STRIP
══════════════════════════════════════════════ */
.creators-strip {
  display: flex; gap: 14px; overflow-x: auto; padding: 4px 0 12px;
  scrollbar-width: none; margin-bottom: 4px;
}
.creators-strip::-webkit-scrollbar { display: none; }
.creator-pill {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  cursor: pointer; flex-shrink: 0; width: 56px;
  transition: opacity 0.15s;
}
.creator-pill:hover { opacity: 0.8; }
.creator-pill-avatar {
  width: 46px; height: 46px; border-radius: 50%;
  background: var(--accent-soft);
  border: 2px solid var(--border-color);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; color: var(--accent);
  overflow: hidden; flex-shrink: 0;
  transition: border-color 0.2s;
}
.creator-pill:hover .creator-pill-avatar { border-color: var(--accent); }
.creator-pill-avatar img { width: 100%; height: 100%; object-fit: cover; }
.creator-pill-name { font-size: 9px; font-weight: 600; color: var(--text-secondary); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

/* ══════════════════════════════════════════════
   PINTEREST MASONRY GRID
══════════════════════════════════════════════ */
.masonry-grid {
  columns: 2; column-gap: 10px;
}
@media (min-width: 600px)  { .masonry-grid { columns: 3; } }
@media (min-width: 900px)  { .masonry-grid { columns: 4; } }
@media (min-width: 1100px) { .masonry-grid { columns: 5; } }

.pin-card {
  break-inside: avoid; margin-bottom: 10px;
  border-radius: 14px; overflow: hidden;
  background: var(--hover-bg);
  border: 1px solid var(--border-color);
  cursor: pointer; position: relative;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
  display: block;
}
.pin-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 32px rgba(0,0,0,0.5);
  border-color: rgba(200,169,110,0.3);
}
.pin-card:active { transform: scale(0.98); }

/* Image area */
.pin-img-wrap { position: relative; width: 100%; overflow: hidden; }
.pin-img-wrap img { width: 100%; height: auto; display: block; }

/* Placeholder for articles with no image */
.pin-placeholder {
  width: 100%; aspect-ratio: 3/4;
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
  background: linear-gradient(135deg, var(--hover-bg) 0%, var(--bg-color) 100%);
}
.pin-placeholder-bg {
  position: absolute; inset: 0; opacity: 0.06;
  display: flex; align-items: center; justify-content: center;
  font-size: 80px; color: var(--accent);
}
/* Taller placeholder for MCQs */
.pin-placeholder.mcq-placeholder { aspect-ratio: 2/3; background: linear-gradient(135deg, #1a1810 0%, #121008 100%); }
.pin-placeholder-letter {
  font-size: 36px; font-weight: 800;
  color: rgba(200,169,110,0.18);
  font-family: var(--font-article);
  z-index: 1; position: relative;
}

/* Library thumbnail */
.pin-library-img-wrap { position: relative; width: 100%; aspect-ratio: 3/4; overflow: hidden; }
.pin-library-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pin-library-placeholder {
  width: 100%; aspect-ratio: 3/4;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px;
  background: linear-gradient(160deg, #1a1810 0%, #0f0e0b 100%);
}
.pin-library-placeholder i { font-size: 28px; color: rgba(200,169,110,0.15); }
.pin-library-placeholder span { font-size: 20px; font-weight: 800; color: rgba(200,169,110,0.12); font-family: var(--font-article); }

/* Bottom info bar */
.pin-info {
  padding: 9px 10px 10px;
  background: var(--hover-bg);
}
.pin-title {
  font-size: 12px; font-weight: 700; color: var(--text-primary);
  line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  font-family: var(--font-article); letter-spacing: -0.01em;
}
.pin-meta {
  display: flex; align-items: center; gap: 6px;
  margin-top: 5px; flex-wrap: wrap;
}
.pin-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
  background: var(--accent-soft); color: var(--accent);
  border: 1px solid rgba(200,169,110,0.2); border-radius: 4px; padding: 2px 6px;
}
.pin-badge.library-badge { background: rgba(106,159,207,0.1); color: #6a9fcf; border-color: rgba(106,159,207,0.2); }
.pin-badge.mcq-badge { background: rgba(106,191,133,0.08); color: #6abf85; border-color: rgba(106,191,133,0.18); }
.pin-count { font-size: 9px; color: var(--text-secondary); }

/* Overlay gradient on image cards */
.pin-img-overlay {
  position: absolute; bottom: 0; left: 0; right: 0; height: 50%;
  background: linear-gradient(to top, rgba(10,8,4,0.7) 0%, transparent 100%);
}

/* ══════════════════════════════════════════════
   SKELETON — same shimmer as feedpage
══════════════════════════════════════════════ */
@keyframes shimmer { 0%,100%{opacity:0.4} 50%{opacity:0.85} }
.skel { background: var(--hover-bg); animation: shimmer 1.6s infinite; border-radius: 6px; }
.pin-skeleton {
  break-inside: avoid; margin-bottom: 10px;
  border-radius: 14px; overflow: hidden;
  background: var(--hover-bg); border: 1px solid var(--border-color);
}
.pin-skel-img { width: 100%; background: var(--border-color); animation: shimmer 1.6s infinite; }
.pin-skel-body { padding: 9px 10px 10px; display: flex; flex-direction: column; gap: 6px; }
.pin-skel-line { height: 10px; border-radius: 5px; animation: shimmer 1.6s infinite; background: var(--border-color); }

/* ══════════════════════════════════════════════
   LOADING GIF — same as feedpage
══════════════════════════════════════════════ */
.loading-gif-wrap {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
}
.loading-gif-wrap img { width: 80px; height: 80px; object-fit: contain; opacity: 0.92; }

/* ══════════════════════════════════════════════
   LOAD MORE
══════════════════════════════════════════════ */
.load-more-wrap { text-align: center; margin-top: 8px; }
.btn-load-more {
  background: none; border: 1px solid var(--border-color);
  color: var(--text-secondary); font-size: 12px; font-weight: 600;
  cursor: pointer; padding: 9px 24px; border-radius: 20px;
  font-family: var(--font-ui);
  transition: border-color 0.2s, color 0.2s;
  display: inline-flex; align-items: center; gap: 7px;
}
.btn-load-more:hover { border-color: var(--accent); color: var(--accent); }
.btn-load-more:disabled { opacity: 0.35; pointer-events: none; }

/* ══════════════════════════════════════════════
   WORLD TAB
══════════════════════════════════════════════ */
.world-wrap { padding-top: 8px; }
.world-label {
  font-size: 10px; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}
.world-label::after { content:''; flex: 1; height: 1px; background: var(--border-color); }

.world-map-container {
  position: relative; width: 100%; border-radius: 16px;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  overflow: hidden; margin-bottom: 14px;
}
.world-map-container svg { width: 100%; height: auto; display: block; }

/* Map pin */
.map-pin {
  position: absolute; cursor: pointer;
  transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  z-index: 10;
}
.map-pin-dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--accent); border: 2px solid rgba(200,169,110,0.4);
  box-shadow: 0 0 0 0 var(--accent-glow);
  animation: pinPulse 2.5s ease-in-out infinite;
  transition: transform 0.15s ease;
}
.map-pin:hover .map-pin-dot { transform: scale(1.3); }
@keyframes pinPulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(200,169,110,0.5); }
  50%      { box-shadow: 0 0 0 8px rgba(200,169,110,0); }
}
.map-pin-label {
  font-size: 9px; font-weight: 700; color: var(--text-primary);
  background: rgba(10,8,4,0.82); border: 1px solid var(--border-color);
  border-radius: 5px; padding: 2px 6px; white-space: nowrap;
  backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none;
  transition: opacity 0.15s ease;
}
.map-pin:hover .map-pin-label { opacity: 1; }

/* Region info card */
.region-info {
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 14px; padding: 14px 16px;
  margin-bottom: 14px; display: none;
  animation: fadeIn 0.2s ease;
}
.region-info.show { display: block; }
@keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
.region-info-header {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
}
.region-info-name { font-size: 14px; font-weight: 800; color: var(--text-primary); font-family: var(--font-article); }
.region-info-close {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--bg-color); border: 1px solid var(--border-color);
  color: var(--text-secondary); font-size: 11px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.region-info-close:hover { border-color: var(--accent); color: var(--accent); }
.region-info-body { font-size: 12px; color: var(--text-secondary); line-height: 1.6; }
.region-coming-soon {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 8px; padding: 5px 12px; border-radius: 20px;
  background: var(--accent-soft); border: 1px solid rgba(200,169,110,0.2);
  color: var(--accent); font-size: 11px; font-weight: 700;
}

.world-regions-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
}
@media (min-width: 600px) { .world-regions-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 900px) { .world-regions-grid { grid-template-columns: repeat(4, 1fr); } }

.region-chip {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; border-radius: 12px;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  cursor: pointer; transition: all 0.15s;
}
.region-chip:hover { border-color: rgba(200,169,110,0.3); background: #1f1d14; }
.region-chip.active { border-color: var(--accent); background: var(--accent-soft); }
.region-chip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.region-chip-name { font-size: 12px; font-weight: 600; color: var(--text-primary); }
.region-chip-count { font-size: 10px; color: var(--text-secondary); margin-left: auto; }

/* ══════════════════════════════════════════════
   LIBRARIES-ONLY TAB — same masonry but wider aspect
══════════════════════════════════════════════ */
.lib-masonry { columns: 2; column-gap: 10px; }
@media (min-width: 600px) { .lib-masonry { columns: 3; } }
@media (min-width: 900px) { .lib-masonry { columns: 4; } }

/* ══════════════════════════════════════════════
   FOOTER BAR — EXACT feedpage values
   Always dark warm charcoal in both themes
══════════════════════════════════════════════ */
.footer-bar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 450px;
  background: rgba(15,14,11,0.96);
  border-top: 1px solid #2a2518;
  padding: 8px 24px;
  padding-bottom: calc(8px + env(safe-area-inset-bottom));
  display: flex; justify-content: space-around; align-items: center;
  z-index: 100;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.footer-btn {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; color: #8a8070;
  cursor: pointer; transition: color 0.2s ease; padding: 6px 12px;
}
.footer-btn:hover { color: #f5f0e8; }
.footer-btn.active { color: #c8a96e; }
.footer-btn i { font-size: 19px; }
.footer-btn span { font-size: 10px; font-weight: 600; }
@media (max-width: 768px) {
  .footer-bar { padding: 8px 16px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
  .footer-btn { padding: 6px 8px; }
  .footer-btn i { font-size: 17px; }
  .footer-btn span { font-size: 9px; }
}

/* ══════════════════════════════════════════════
   EMPTY / ERROR STATES
══════════════════════════════════════════════ */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 60px 20px; color: var(--text-secondary); gap: 10px;
  grid-column: 1 / -1;
}
.empty-state i { font-size: 36px; opacity: 0.2; color: var(--accent); }
.empty-state p { font-size: 13px; opacity: 0.55; }

/* ══════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════ */
.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px);
  background: #1a1810; border: 1px solid var(--border-color);
  border-radius: 14px; padding: 10px 18px;
  font-size: 13px; font-weight: 700; color: var(--text-primary);
  z-index: 9999; opacity: 0;
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none; white-space: nowrap;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  </style>
</head>
<body class="theme-dark font-serif">

<!-- 2. Settings system -->
<script>
(function(){
  const THEMES = ['theme-dark','theme-light'];
  const FONTS  = ['font-serif','font-slab','font-modern'];

  function applyTheme(val){
    THEMES.forEach(t=>document.body.classList.remove(t));
    document.body.classList.add(val);
    localStorage.setItem('pref_theme', val);
    const gif = document.getElementById('loadingGifImg');
    if (gif) gif.src = (val === 'theme-light') ? 'IMG_4856.gif' : 'IMG_4861.gif';
  }
  function applyFont(val){
    FONTS.forEach(f=>document.body.classList.remove(f));
    document.body.classList.add(val);
    localStorage.setItem('pref_fontfam', val);
  }
  function syncPills(){
    const curTheme = THEMES.find(t=>document.body.classList.contains(t)) || 'theme-dark';
    const curFont  = FONTS.find(f=>document.body.classList.contains(f)) || 'font-serif';
    document.querySelectorAll('#sp-themes [data-val]').forEach(b=>b.classList.toggle('active', b.dataset.val===curTheme));
    document.querySelectorAll('#sp-fonts [data-val]').forEach(b=>b.classList.toggle('active', b.dataset.val===curFont));
  }

  document.getElementById('sp-themes').addEventListener('click', e=>{
    const btn=e.target.closest('[data-val]'); if(!btn)return;
    applyTheme(btn.dataset.val); syncPills();
  });
  document.getElementById('sp-fonts').addEventListener('click', e=>{
    const btn=e.target.closest('[data-val]'); if(!btn)return;
    applyFont(btn.dataset.val); syncPills();
  });

  let _popOpen = false;
  window.closeSettings = function(){
    document.getElementById('settingsPopover').classList.remove('open');
    _popOpen = false;
  };
  window.toggleSettings = function(btn){
    const pop = document.getElementById('settingsPopover');
    _popOpen = !_popOpen;
    if(_popOpen){
      const r = btn.getBoundingClientRect();
      pop.style.top  = (r.bottom + 8) + 'px';
      pop.style.right = Math.max(8, window.innerWidth - r.right) + 'px';
      pop.style.left  = 'auto';
      pop.classList.add('open');
      syncPills();
      setTimeout(()=>document.addEventListener('click', function oc(e){
        if(!pop.contains(e.target) && e.target !== btn && !btn.contains(e.target)){
          pop.classList.remove('open'); _popOpen = false;
        }
        document.removeEventListener('click', oc);
      }, 10));
    } else {
      pop.classList.remove('open');
    }
  };

  document.addEventListener('DOMContentLoaded', syncPills);
})();
</script>

async function loadCreators(){
  const strip = document.getElementById('creatorsStrip');
  try{
    const { data:articles } = await supabase.from('articles').select('firebase_user_id');
    if(!articles){ strip.innerHTML=''; return; }
    const counts = {};
    articles.forEach(a=>{ if(a.firebase_user_id) counts[a.firebase_user_id]=(counts[a.firebase_user_id]||0)+1; });
    const topUids = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([uid])=>uid);
    if(!topUids.length){ strip.innerHTML=''; return; }
    const { data:users } = await supabase.from('users').select('firebase_uid,username,full_name,pfp').in('firebase_uid', topUids);

      const avatarHTML = u?.pfp ? `<img src="${u.pfp}" alt="${init}">` : init;

function escHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function isMCQ(c){ return typeof c==='string' && c.trimStart().startsWith('❔'); }
function truncate(s,n){ return (s||'').length>n ? s.slice(0,n)+'…' : (s||''); }

/* Skeleton placeholders */
function injectFYSkeletons(n=8){
  const grid = document.getElementById('foryouGrid');
  const heights = ['aspect-ratio:2/3','aspect-ratio:3/4','aspect-ratio:1/1','aspect-ratio:4/5'];
  for(let i=0;i<n;i++){
    const h = heights[i % heights.length];
    const sk = document.createElement('div');
    sk.className = 'pin-skeleton';
    sk.innerHTML = `<div class="pin-skel-img skel" style="${h};display:block;width:100%;"></div><div class="pin-skel-body"><div class="pin-skel-line skel" style="width:85%"></div><div class="pin-skel-line skel" style="width:55%;margin-top:4px;"></div></div>`;
    grid.appendChild(sk);
  }
}
function clearFYSkeletons(){ document.querySelectorAll('.pin-skeleton').forEach(s=>s.remove()); }

/* Build article pin card */
function buildArticlePin(article, imageUrl){
  const div = document.createElement('div');
  div.className = 'pin-card';
  const mcq = isMCQ(article.content);
  const title = article.title || 'Untitled';

  let imgSection = '';
  if(imageUrl){
    imgSection = `<div class="pin-img-wrap"><img src="${escHtml(imageUrl)}" alt="${escHtml(title)}" loading="lazy"><div class="pin-img-overlay"></div></div>`;
  } else {
    const firstLetter = title.replace(/^[^A-Za-z0-9]*/,'')[0]?.toUpperCase() || '?';
    const iconClass = mcq ? 'fa-question-circle' : 'fa-file-alt';
    const placeholderClass = mcq ? 'pin-placeholder mcq-placeholder' : 'pin-placeholder';
    imgSection = `<div class="${placeholderClass}">
      <div class="pin-placeholder-bg"><i class="fas ${iconClass}"></i></div>
      <div class="pin-placeholder-letter">${firstLetter}</div>
    </div>`;
  }

  const badge = mcq
    ? `<div class="pin-badge mcq-badge"><i class="fas fa-question-circle"></i> MCQ</div>`
    : `<div class="pin-badge"><i class="fas fa-file-alt"></i> Article</div>`;

  div.innerHTML = `
    ${imgSection}
    <div class="pin-info">
      <div class="pin-title">${escHtml(truncate(title, 80))}</div>
      <div class="pin-meta">${badge}<span class="pin-count"><i class="fas fa-eye" style="font-size:8px;margin-right:2px;"></i>${article.views||0}</span></div>
    </div>`;

  div.addEventListener('click', ()=>{
    location.href = `https://patholytica.com/dailyfeed?article=${article.id}`;
  });
  return div;
}

/* Build library pin card */
function buildLibraryPin(lib, articleCount){
  const div = document.createElement('div');
  div.className = 'pin-card';
  const name = lib.name || 'Untitled Library';
  const firstLetter = name.replace(/^[^A-Za-z0-9]*/,'')[0]?.toUpperCase() || '?';

  let imgSection = '';
  if(lib.thumbnail_url){
    imgSection = `<div class="pin-library-img-wrap"><img src="${escHtml(lib.thumbnail_url)}" alt="${escHtml(name)}" loading="lazy"><div class="pin-img-overlay"></div></div>`;
  } else {
    imgSection = `<div class="pin-library-placeholder">
      <i class="fas fa-book-open"></i>
      <span>${firstLetter}</span>
    </div>`;
  }

  div.innerHTML = `
    ${imgSection}
    <div class="pin-info">
      <div class="pin-title">${escHtml(truncate(name, 70))}</div>
      <div class="pin-meta">
        <div class="pin-badge library-badge"><i class="fas fa-layer-group"></i> Library</div>
        <span class="pin-count">${articleCount} article${articleCount!==1?'s':''}</span>
      </div>
    </div>`;

  div.addEventListener('click', ()=>{
    location.href = `https://patholytica.com/dailyfeed?playlist=${lib.id}`;
  });
  return div;
}

/* Main For You loader */
async function loadForYou(isInitial = true){
  if(fyLoading || (!isInitial && !fyHasMore)) return;
  fyLoading = true;
  if(isInitial){
    showLoadingGif();
    injectFYSkeletons(8);
  }

  try{
    // Fetch batch of articles with their first image
    const { data:arts, error:artErr } = await supabase
      .from('articles').select('*')
      .order('created_at', {ascending:false})
      .range(artOffset, artOffset + ART_LIMIT - 1);

    if(artErr) throw artErr;
    if(!arts || arts.length === 0){ fyHasMore = false; }
    else{
      artOffset += arts.length;
      if(arts.length < ART_LIMIT) fyHasMore = false;

      // Fetch first image for each article
      const artIds = arts.map(a=>a.id);
      const { data:media } = await supabase.from('media').select('article_id, url, type')
        .in('article_id', artIds).eq('type','image').order('display_order',{ascending:true});
      const imageMap = {};
      (media||[]).forEach(m=>{ if(!imageMap[m.article_id]) imageMap[m.article_id] = m.url; });

      fyArticlePool = [...fyArticlePool, ...arts.map(a=>({ ...a, _imageUrl: imageMap[a.id]||null }))];
    }

    // Fetch one batch of libraries to interleave
    const { data:libs } = await supabase.from('playlists').select('*')
      .order('created_at',{ascending:false})
      .range(fyOffset, fyOffset + 3);   // 4 libraries per For You batch
    fyOffset += (libs||[]).length;

    const libIds = (libs||[]).map(l=>l.id);
    let libCountMap = {};
    if(libIds.length){
      const { data:irows } = await supabase.from('playlist_items').select('playlist_id').in('playlist_id', libIds);
      (irows||[]).forEach(r=>{ libCountMap[r.playlist_id]=(libCountMap[r.playlist_id]||0)+1; });
    }

    // Interleave: 4 articles, 1 library, repeat
    if(isInitial){ clearFYSkeletons(); hideLoadingGif(); }
    else { clearFYSkeletons(); }

    const grid = document.getElementById('foryouGrid');
    const pool = fyArticlePool.splice(0, ART_LIMIT);
    let libIdx = 0;
    pool.forEach((art, i)=>{
      grid.appendChild(buildArticlePin(art, art._imageUrl));
      if((i+1) % 4 === 0 && libs && libIdx < libs.length){
        const lib = libs[libIdx++];
        grid.appendChild(buildLibraryPin(lib, libCountMap[lib.id]||0));
      }
    });
    // Remaining libs
    if(libs){ while(libIdx < libs.length){ const lib=libs[libIdx++]; grid.appendChild(buildLibraryPin(lib, libCountMap[lib.id]||0)); } }

    const loadMoreWrap = document.getElementById('foryouLoadMore');
    const loadMoreBtn  = document.getElementById('foryouLoadMoreBtn');
    if(fyHasMore){
      loadMoreWrap.style.display = 'block';
      loadMoreBtn.disabled = false;
      loadMoreBtn.innerHTML = '<i class="fas fa-chevron-down"></i> Load more';
    } else {
      loadMoreWrap.style.display = 'none';
    }
  }catch(e){
    console.error(e);
    clearFYSkeletons();
    hideLoadingGif();
    document.getElementById('foryouGrid').innerHTML += `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load</p></div>`;
  }finally{
    fyLoading = false;
  }
}

window.loadMoreForYou = async function(){
  const btn = document.getElementById('foryouLoadMoreBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Loading…';
  // Append skeleton at bottom
  injectFYSkeletons(4);
  await loadForYou(false);
};

/* ══════════════════════════════════════════════
   LIBRARIES TAB
══════════════════════════════════════════════ */
window.loadLibraries = async function(append = false){
  if(libLoading || (!append && false)) return;
  libLoading = true;
  const grid = document.getElementById('librariesGrid');
  if(!append){
    grid.innerHTML='';
    showLoadingGif();
    // Inject skeletons
    for(let i=0;i<6;i++){
      const sk=document.createElement('div'); sk.className='pin-skeleton';
      sk.innerHTML=`<div class="pin-skel-img skel" style="aspect-ratio:3/4;display:block;width:100%;"></div><div class="pin-skel-body"><div class="pin-skel-line skel" style="width:75%"></div><div class="pin-skel-line skel" style="width:45%;margin-top:4px;"></div></div>`;
      grid.appendChild(sk);
    }
  }
  try{
    const { data:libs } = await supabase.from('playlists').select('*')
      .order('created_at',{ascending:false})
      .range(libOffset, libOffset + LIB_LIMIT - 1);

    if(!append){ grid.innerHTML=''; hideLoadingGif(); }
    else { document.querySelectorAll('.pin-skeleton').forEach(s=>s.remove()); }

    if(!libs||libs.length===0){
      libHasMore = false;
      if(!append) grid.innerHTML = `<div class="empty-state"><i class="fas fa-book-open"></i><p>No libraries yet</p></div>`;
      document.getElementById('libsLoadMore').style.display = 'none';
      libLoading = false; return;
    }

    if(libs.length < LIB_LIMIT) libHasMore = false;
    libOffset += libs.length;

    const libIds = libs.map(l=>l.id);
    const { data:irows } = await supabase.from('playlist_items').select('playlist_id').in('playlist_id', libIds);
    const countMap = {};
    (irows||[]).forEach(r=>{ countMap[r.playlist_id]=(countMap[r.playlist_id]||0)+1; });

    libs.forEach(lib=>{ grid.appendChild(buildLibraryPin(lib, countMap[lib.id]||0)); });

    const lmw = document.getElementById('libsLoadMore');
    const lmb = document.getElementById('libsLoadMoreBtn');
    if(libHasMore){ lmw.style.display='block'; lmb.disabled=false; lmb.innerHTML='<i class="fas fa-chevron-down"></i> Load more'; }
    else lmw.style.display='none';
  }catch(e){
    hideLoadingGif();
    document.querySelectorAll('.pin-skeleton').forEach(s=>s.remove());
    grid.innerHTML += `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load</p></div>`;
  }finally{ libLoading=false; }
};

window.loadMoreLibraries = async function(){
  const btn = document.getElementById('libsLoadMoreBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Loading…';
  const grid = document.getElementById('librariesGrid');
  for(let i=0;i<4;i++){
    const sk=document.createElement('div'); sk.className='pin-skeleton';
    sk.innerHTML=`<div class="pin-skel-img skel" style="aspect-ratio:3/4;display:block;width:100%;"></div><div class="pin-skel-body"><div class="pin-skel-line skel" style="width:75%"></div><div class="pin-skel-line skel" style="width:45%;margin-top:4px;"></div></div>`;
    grid.appendChild(sk);
  }
  await window.loadLibraries(true);
};

loadCreators();
loadForYou(true);
