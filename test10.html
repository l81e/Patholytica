<!DOCTYPE html>
<html lang="en">
<head>

  <title>Patholytica — Home</title>

  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>

/* ══════════════════════════════════════════════
   CSS VARIABLES — exact feedpage values
══════════════════════════════════════════════ */
:root {
  --bg-color: #0f0e0b;
  --text-primary: #f5f0e8;
  --text-secondary: #8a8070;
  --hover-bg: #1a1810;
  --border-color: #2a2518;
  --accent: #c8a96e;
  --accent-hover: #b8935a;
  --accent-glow: rgba(200,169,110,0.25);
  --accent-soft: rgba(200,169,110,0.12);
  --font-article: 'Merriweather', serif;
  --font-ui: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
}
body.theme-dark {
  --bg-color: #0f0e0b; --text-primary: #f5f0e8; --text-secondary: #8a8070;
  --hover-bg: #1a1810; --border-color: #2a2518;
  --accent: #c8a96e; --accent-hover: #b8935a;
  --accent-glow: rgba(200,169,110,0.25); --accent-soft: rgba(200,169,110,0.12);
}
body.theme-light {
  --bg-color: #faf6ee; --text-primary: #1a1710; --text-secondary: #706050;
  --hover-bg: #f0ebe0; --border-color: #e0d8c8;
  --accent: #a07840; --accent-hover: #8a6430;
  --accent-glow: rgba(160,120,64,0.2); --accent-soft: rgba(160,120,64,0.08);
}
body.font-serif  { --font-article: 'Merriweather', serif; }
body.font-slab   { --font-article: 'Source Serif 4', serif; }
body.font-modern { --font-article: 'Inter', sans-serif; }

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  font-family: var(--font-ui);
  background: var(--bg-color);
  color: var(--text-primary);
  overflow-x: hidden;
  transition: background 0.2s ease, color 0.2s ease;
}

/* ══════════════════════════════════════════════
   HEADER — theme-aware (NOT hardcoded dark)
══════════════════════════════════════════════ */
.header-wrapper {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--bg-color);
  border-bottom: 1px solid var(--border-color);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  padding-top: env(safe-area-inset-top);
  transition: background 0.2s ease, border-color 0.2s ease;
}
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 18px; max-width: 1200px; margin: 0 auto;
}
.header-logo { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.header-logo img { height: 24px; width: auto; }
.header-right { display: flex; align-items: center; gap: 8px; }

.hdr-chip {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 600; color: var(--text-secondary);
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 20px; padding: 5px 12px; cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background 0.2s;
}
.hdr-chip.logged-in {
  color: var(--accent);
  border-color: rgba(200,169,110,0.3);
  background: var(--accent-soft);
}
.hdr-chip i { font-size: 10px; }

.hdr-icon-btn {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  color: var(--text-secondary); font-size: 13px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: border-color 0.15s, color 0.15s, background 0.2s;
}
.hdr-icon-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ══════════════════════════════════════════════
   SETTINGS POPOVER — same as feedpage
══════════════════════════════════════════════ */
.settings-popover {
  position: fixed; z-index: 500;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 16px; padding: 14px; width: 220px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  opacity: 0; pointer-events: none;
  transform: translateY(-8px) scale(0.97);
  transition: opacity 0.2s, transform 0.2s;
}
.settings-popover.open { opacity: 1; pointer-events: all; transform: translateY(0) scale(1); }
.sp-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color);
}
.sp-title { font-size: 12px; font-weight: 800; }
.sp-close {
  width: 22px; height: 22px; border-radius: 50%; background: var(--bg-color);
  border: 1px solid var(--border-color); color: var(--text-secondary);
  cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center;
  transition: border-color 0.15s, color 0.15s;
}
.sp-close:hover { border-color: var(--accent); color: var(--accent); }
.sp-section { margin-bottom: 12px; }
.sp-section:last-child { margin-bottom: 0; }
.sp-label {
  font-size: 9px; font-weight: 800; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-secondary); margin-bottom: 7px;
}
.sp-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sp-pill {
  padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
  border: 1px solid var(--border-color); background: var(--bg-color);
  color: var(--text-secondary); cursor: pointer; transition: all 0.15s;
  font-family: var(--font-ui);
}
.sp-pill.active { background: var(--accent); color: #0f0e0b; border-color: var(--accent); }
.sp-pill:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

/* ══════════════════════════════════════════════
   PAGE BODY
══════════════════════════════════════════════ */
.page-body {
  max-width: 1200px; margin: 0 auto;
  padding: 0 12px;
  padding-top: calc(44px + env(safe-area-inset-top) + 14px);
  padding-bottom: calc(80px + env(safe-area-inset-bottom));
}

/* ══════════════════════════════════════════════
   CREATORS STRIP
══════════════════════════════════════════════ */
.creators-strip {
  display: flex; gap: 14px; overflow-x: auto;
  padding: 4px 0 14px; scrollbar-width: none;
}
.creators-strip::-webkit-scrollbar { display: none; }
.creator-pill {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  cursor: pointer; flex-shrink: 0; width: 54px;
  transition: opacity 0.15s;
}
.creator-pill:hover { opacity: 0.8; }
.creator-pill-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--accent-soft);
  border: 2px solid var(--border-color);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700; color: var(--accent);
  overflow: hidden; flex-shrink: 0;
  transition: border-color 0.2s;
}
.creator-pill:hover .creator-pill-avatar { border-color: var(--accent); }
.creator-pill-avatar img { width: 100%; height: 100%; object-fit: cover; }
.creator-pill-name {
  font-size: 9px; font-weight: 600; color: var(--text-secondary);
  text-align: center; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; width: 100%;
}

/* ══════════════════════════════════════════════
   PINTEREST MASONRY
══════════════════════════════════════════════ */
.masonry-grid { columns: 2; column-gap: 10px; }
@media (min-width: 540px)  { .masonry-grid { columns: 3; } }
@media (min-width: 820px)  { .masonry-grid { columns: 4; } }
@media (min-width: 1080px) { .masonry-grid { columns: 5; } }

/* ══════════════════════════════════════════════
   PIN CARD — full-bleed image, overlay title
══════════════════════════════════════════════ */
.pin-card {
  break-inside: avoid;
  margin-bottom: 10px;
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  display: block;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}
.pin-card:hover {
  transform: translateY(-3px) scale(1.01);
  box-shadow: 0 12px 36px rgba(0,0,0,0.55);
}
.pin-card:active { transform: scale(0.98); }

.pin-card-img {
  width: 100%;
  height: auto;
  display: block;
}

.pin-card-img.fixed-ratio {
  width: 100%;
  object-fit: cover;
  display: block;
}

.pin-card-overlay {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: linear-gradient(
    to top,
    rgba(4,3,2,0.92) 0%,
    rgba(4,3,2,0.70) 30%,
    rgba(4,3,2,0.30) 60%,
    transparent 100%
  );
  padding: 28px 11px 11px;
  display: flex; flex-direction: column; gap: 5px;
}

.pin-overlay-title {
  font-size: 12px; font-weight: 700;
  color: #f5f0e8;
  line-height: 1.3; font-family: var(--font-article);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  letter-spacing: -0.01em;
  text-shadow: 0 1px 6px rgba(0,0,0,0.8);
}

.pin-overlay-meta {
  display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
}
.pin-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
  background: rgba(200,169,110,0.22);
  color: #e8d0a0;
  border: 1px solid rgba(200,169,110,0.3);
  border-radius: 4px; padding: 2px 6px;
  backdrop-filter: blur(4px);
}
.pin-badge.lib-badge { background: rgba(106,159,207,0.2); color: #a8c8e8; border-color: rgba(106,159,207,0.3); }
.pin-badge.mcq-badge { background: rgba(106,191,133,0.18); color: #a0d8b0; border-color: rgba(106,191,133,0.25); }
.pin-stat {
  font-size: 9px; color: rgba(245,240,232,0.65);
  display: flex; align-items: center; gap: 3px;
}
.pin-stat i { font-size: 8px; }

/* ══════════════════════════════════════════════
   SKELETON — feedpage shimmer
══════════════════════════════════════════════ */
@keyframes shimmer { 0%,100%{opacity:0.4} 50%{opacity:0.85} }
.pin-skeleton {
  break-inside: avoid; margin-bottom: 10px;
  border-radius: 14px; overflow: hidden;
  background: var(--hover-bg);
  animation: shimmer 1.6s ease-in-out infinite;
}
.pin-skeleton:nth-child(3n)   { height: 200px; }
.pin-skeleton:nth-child(3n+1) { height: 260px; }
.pin-skeleton:nth-child(3n+2) { height: 220px; }

/* ══════════════════════════════════════════════
   LOADING GIF
══════════════════════════════════════════════ */
.loading-gif-wrap {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%);

  display: flex; align-items: center; justify-content: center;
}
.loading-gif-wrap img { width: 80px; height: 80px; object-fit: contain; opacity: 0.92; }

/* ══════════════════════════════════════════════
   LOAD MORE
══════════════════════════════════════════════ */
.load-more-wrap { text-align: center; margin-top: 10px; }
.btn-load-more {

  color: var(--text-secondary); font-size: 12px; font-weight: 600;
  cursor: pointer; padding: 9px 24px; border-radius: 20px;
  font-family: var(--font-ui); display: inline-flex; align-items: center; gap: 7px;
  transition: border-color 0.2s, color 0.2s;
}
.btn-load-more:hover { border-color: var(--accent); color: var(--accent); }
.btn-load-more:disabled { opacity: 0.35; pointer-events: none; }

/* ══════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════ */
.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px);
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 14px; padding: 10px 18px;
  font-size: 13px; font-weight: 700; color: var(--text-primary);
  z-index: 9999; opacity: 0;
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none; white-space: nowrap;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ══════════════════════════════════════════════
   FOOTER BAR
══════════════════════════════════════════════ */
.footer-bar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 450px;
  background: rgba(15,14,11,0.96);
  border-top: 1px solid #2a2518;
  padding: 8px 24px;
  padding-bottom: calc(8px + env(safe-area-inset-bottom));
  display: flex; justify-content: space-around; align-items: center;
  z-index: 100;

}
.footer-btn {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; color: #8a8070;
  cursor: pointer; transition: color 0.2s ease; padding: 6px 12px;
}
.footer-btn:hover { color: #f5f0e8; }
.footer-btn.active { color: #c8a96e; }
.footer-btn i { font-size: 19px; }
.footer-btn span { font-size: 10px; font-weight: 600; }

  .footer-btn { padding: 6px 8px; }
  .footer-btn i { font-size: 17px; }

/* ══════════════════════════════════════════════

.empty-state p { font-size: 13px; opacity: 0.55; }

<!-- 1. Theme persistence -->
<script>
(function(){
  const theme   = localStorage.getItem('pref_theme')   || 'theme-dark';
  const fontFam = localStorage.getItem('pref_fontfam') || 'font-serif';
  const safeTheme = (theme === 'theme-light') ? 'theme-light' : 'theme-dark';
  document.body.className = [safeTheme, fontFam].filter(Boolean).join(' ');
  const gif = document.getElementById('loadingGifImg');
  if(gif) gif.src = safeTheme === 'theme-light' ? 'IMG_4856.gif' : 'IMG_4861.gif';
})();
</script>

<!-- 2. Settings -->
<script>
(function(){
  const THEMES = ['theme-dark','theme-light'];
  const FONTS  = ['font-serif','font-slab','font-modern'];

  function applyTheme(val){
    THEMES.forEach(t=>document.body.classList.remove(t));
    document.body.classList.add(val);
    localStorage.setItem('pref_theme', val);
    const gif = document.getElementById('loadingGifImg');
    if(gif) gif.src = val === 'theme-light' ? 'IMG_4856.gif' : 'IMG_4861.gif';
  }
  function applyFont(val){
    FONTS.forEach(f=>document.body.classList.remove(f));
    document.body.classList.add(val);
    localStorage.setItem('pref_fontfam', val);
  }
  function syncPills(){
    const curT = THEMES.find(t=>document.body.classList.contains(t))||'theme-dark';
    const curF = FONTS.find(f=>document.body.classList.contains(f))||'font-serif';
    document.querySelectorAll('#sp-themes [data-val]').forEach(b=>b.classList.toggle('active',b.dataset.val===curT));
    document.querySelectorAll('#sp-fonts  [data-val]').forEach(b=>b.classList.toggle('active',b.dataset.val===curF));
  }
  document.getElementById('sp-themes').addEventListener('click',e=>{
    const b=e.target.closest('[data-val]');if(!b)return;applyTheme(b.dataset.val);syncPills();
  });
  document.getElementById('sp-fonts').addEventListener('click',e=>{
    const b=e.target.closest('[data-val]');if(!b)return;applyFont(b.dataset.val);syncPills();
  });

  let _open=false;
  window.closeSettings=function(){document.getElementById('settingsPopover').classList.remove('open');_open=false;};
  window.toggleSettings=function(btn){
    const pop=document.getElementById('settingsPopover');
    _open=!_open;
    if(_open){
      const r=btn.getBoundingClientRect();
      pop.style.top=(r.bottom+8)+'px';
      pop.style.right=Math.max(8,window.innerWidth-r.right)+'px';
      pop.style.left='auto';
      pop.classList.add('open'); syncPills();
      setTimeout(()=>document.addEventListener('click',function oc(e){
        if(!pop.contains(e.target)&&e.target!==btn&&!btn.contains(e.target)){pop.classList.remove('open');_open=false;}
        document.removeEventListener('click',oc);
      },10));
    } else pop.classList.remove('open');
  };
  document.addEventListener('DOMContentLoaded',syncPills);
})();
</script>

  { url:'https://images.unsplash.com/photo-1530026186672-2cd00ffc50fe?w=600&q=80', h:340 },
  { url:'https://images.unsplash.com/photo-1576086213369-97a306d36557?w=600&q=80', h:300 },
  { url:'https://images.unsplash.com/photo-1505751172876-fa1923c5c528?w=600&q=80', h:280 },
  { url:'https://images.unsplash.com/photo-1559757148-5c350d0d3c56?w=600&q=80', h:260 },
  { url:'https://images.unsplash.com/photo-1584820927498-cfe5211fd8bf?w=600&q=80', h:320 },
  { url:'https://images.unsplash.com/photo-1532187863486-abf9dbad1b69?w=600&q=80', h:350 },
  { url:'https://images.unsplash.com/photo-1603791440384-56cd371ee9a7?w=600&q=80', h:380 },
  { url:'https://images.unsplash.com/photo-1559757175-0eb30cd8c063?w=600&q=80', h:290 },
  { url:'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=600&q=80', h:310 },
  { url:'https://images.unsplash.com/photo-1586773860418-d37222d8fce3?w=600&q=80', h:270 },
  { url:'https://images.unsplash.com/photo-1551601651-2a8555f1a136?w=600&q=80', h:360 },
  { url:'https://images.unsplash.com/photo-1518152006812-edab29b069ac?w=600&q=80', h:300 },
];

function stockFor(id){ return STOCK_POOL[id % STOCK_POOL.length]; }

/* ── State ── */
let currentUserData = null;
let artOffset = 0, artHasMore = true, artLoading = false;
const ART_BATCH = 18;
let libOffset  = 0;
const LIB_PER_BATCH = 4;

function esc(s){ const d=document.createElement('div');d.textContent=s;return d.innerHTML; }
function isMCQ(c){ return typeof c==='string'&&c.trimStart().startsWith('❔'); }
function trunc(s,n){ s=s||''; return s.length>n?s.slice(0,n)+'…':s; }
function fmtNum(n){ if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1000)return(n/1000).toFixed(1)+'K';return String(n||0); }

/* ── Auth ── */
onAuthStateChanged(auth, async user=>{
  const chip=document.getElementById('authChip');
  const chipText=document.getElementById('authChipText');
  const chipIcon=document.getElementById('authChipIcon');
  if(user){
    const{data:ud}=await supabase.from('users').select('user_id,username').eq('firebase_uid',user.uid).single();
    if(ud){
      currentUserData=ud;
      chip.classList.add('logged-in');
      chipText.textContent=ud.username?'@'+ud.username:'Account';
      chipIcon.className='fas fa-circle';chipIcon.style.fontSize='6px';
    }
  }else{
    currentUserData=null;chip.classList.remove('logged-in');
    chipText.textContent='Log in';chipIcon.className='fas fa-sign-in-alt';chipIcon.style.fontSize='';
  }
});
window.handleAuthChip=function(){
  if(currentUserData) location.href=`profile.html?username=${encodeURIComponent(currentUserData.username||'')}`;
  else location.href='login.html';
};

/* ══════════════════════════════════════════════
   CREATORS STRIP
══════════════════════════════════════════════ */
async function loadCreators(){
  const strip=document.getElementById('creatorsStrip');
  try{
    const{data:arts}=await supabase.from('articles').select('firebase_user_id');
    if(!arts){strip.innerHTML='';return;}
    const counts={};
    arts.forEach(a=>{if(a.firebase_user_id)counts[a.firebase_user_id]=(counts[a.firebase_user_id]||0)+1;});
    const topUids=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([u])=>u);
    if(!topUids.length){strip.innerHTML='';return;}
    const{data:users}=await supabase.from('users').select('firebase_uid,username,full_name,pfp').in('firebase_uid',topUids);
    const um={};(users||[]).forEach(u=>{um[u.firebase_uid]=u;});
    strip.innerHTML=topUids.map(uid=>{
      const u=um[uid];
      const name=u?.username?'@'+u.username:(u?.full_name||'?');
      const init=(name.replace(/^@/,'')||'?')[0].toUpperCase();
      const av=u?.pfp?`<img src="${u.pfp}" alt="${init}">`:`${init}`;
      const pUrl=u?.username?`profile.html?username=${encodeURIComponent(u.username)}`:'#';
      return`<div class="creator-pill" onclick="location.href='${pUrl}'">
        <div class="creator-pill-avatar">${av}</div>
        <div class="creator-pill-name">${esc(name)}</div>
      </div>`;
    }).join('');
  }catch(e){strip.innerHTML='';}
}

/* ══════════════════════════════════════════════
   BUILD ARTICLE PIN
══════════════════════════════════════════════ */
function buildArticlePin(article, imageUrl){
  const div=document.createElement('div');
  div.className='pin-card';
  const mcq=isMCQ(article.content);
  const title=article.title||'Untitled';

  let imgSrc = imageUrl;
  let imgH   = null;
  if(!imgSrc){
    const stock = stockFor(article.id);
    imgSrc = stock.url;
    imgH   = stock.h;
  }

  const imgStyle = imgH ? `height:${imgH}px;` : '';

  div.innerHTML=`
    <img class="pin-card-img${imgH?' fixed-ratio':''}"
         src="${esc(imgSrc)}"
         alt="${esc(title)}"
         loading="lazy"
         style="${imgStyle}object-fit:cover;"
         onerror="this.src='${stockFor(article.id).url}'">
    <div class="pin-card-overlay">
      <div class="pin-overlay-title">${esc(trunc(title,90))}</div>
      <div class="pin-overlay-meta">
        ${mcq
          ? `<div class="pin-badge mcq-badge"><i class="fas fa-question-circle"></i> MCQ</div>`
          : `<div class="pin-badge"><i class="fas fa-file-alt"></i> Article</div>`
        }
        <span class="pin-stat"><i class="fas fa-eye"></i>${fmtNum(article.views||0)}</span>
        <span class="pin-stat"><i class="fas fa-heart"></i>${fmtNum(article.likes||0)}</span>
      </div>
    </div>`;

  div.addEventListener('click',()=>{ location.href=`https://patholytica.com/dailyfeed?article=${article.id}`; });
  return div;
}

/* ══════════════════════════════════════════════
   BUILD LIBRARY PIN
══════════════════════════════════════════════ */
function buildLibraryPin(lib, articleCount){
  const div=document.createElement('div');
  div.className='pin-card';
  const name=lib.name||'Untitled Library';

  let imgSrc = lib.thumbnail_url;
  let imgH   = null;
  if(!imgSrc){
    const stock = stockFor(lib.id + 500);
    imgSrc = stock.url;
    imgH   = stock.h;
  }
  const imgStyle = imgH ? `height:${imgH}px;` : '';

  div.innerHTML=`
    <img class="pin-card-img${imgH?' fixed-ratio':''}"
         src="${esc(imgSrc)}"
         alt="${esc(name)}"
         loading="lazy"
         style="${imgStyle}object-fit:cover;"
         onerror="this.src='${stockFor(lib.id+500).url}'">
    <div class="pin-card-overlay">
      <div class="pin-overlay-title">${esc(trunc(name,70))}</div>
      <div class="pin-overlay-meta">
        <div class="pin-badge lib-badge"><i class="fas fa-layer-group"></i> Library</div>
        <span class="pin-stat">${articleCount} article${articleCount!==1?'s':''}</span>
      </div>
    </div>`;

  div.addEventListener('click',()=>{ location.href=`https://patholytica.com/dailyfeed?playlist=${lib.id}`; });
  return div;
}

/* ══════════════════════════════════════════════
   SKELETONS
══════════════════════════════════════════════ */
function injectSkeletons(n=8){
  const grid=document.getElementById('mainGrid');
  for(let i=0;i<n;i++){
    const sk=document.createElement('div');sk.className='pin-skeleton';grid.appendChild(sk);
  }
}
function clearSkeletons(){ document.querySelectorAll('.pin-skeleton').forEach(s=>s.remove()); }

/* ══════════════════════════════════════════════
   MAIN LOADER
══════════════════════════════════════════════ */
async function loadBatch(isInitial=true){
  if(artLoading||(!isInitial&&!artHasMore))return;
  artLoading=true;
  const grid=document.getElementById('mainGrid');

  if(isInitial){ showLoadingGif(); injectSkeletons(10); }

  try{
    const{data:arts,error:aErr}=await supabase
      .from('articles').select('*')
      .order('created_at',{ascending:false})
      .range(artOffset, artOffset+ART_BATCH-1);
    if(aErr)throw aErr;

    if(!arts||arts.length===0){ artHasMore=false; }
    else{
      artOffset+=arts.length;
      if(arts.length<ART_BATCH) artHasMore=false;

      const artIds=arts.map(a=>a.id);
      const{data:media}=await supabase.from('media').select('article_id,url,type')
        .in('article_id',artIds).eq('type','image').order('display_order',{ascending:true});
      const imgMap={};
      (media||[]).forEach(m=>{if(!imgMap[m.article_id])imgMap[m.article_id]=m.url;});

      const{data:libs}=await supabase.from('playlists').select('*')
        .order('created_at',{ascending:false})
        .range(libOffset, libOffset+LIB_PER_BATCH-1);
      libOffset+=(libs||[]).length;

      const libIds=(libs||[]).map(l=>l.id);
      let libCountMap={};
      if(libIds.length){
        const{data:irows}=await supabase.from('playlist_items').select('playlist_id').in('playlist_id',libIds);
        (irows||[]).forEach(r=>{libCountMap[r.playlist_id]=(libCountMap[r.playlist_id]||0)+1;});
      }

      clearSkeletons();
      hideLoadingGif();

      let libIdx=0;
      arts.forEach((art,i)=>{
        grid.appendChild(buildArticlePin(art, imgMap[art.id]||null));
        if((i+1)%4===0 && libs && libIdx<libs.length){
          const lib=libs[libIdx++];
          grid.appendChild(buildLibraryPin(lib, libCountMap[lib.id]||0));
        }
      });
      if(libs){ while(libIdx<libs.length){ const l=libs[libIdx++]; grid.appendChild(buildLibraryPin(l,libCountMap[l.id]||0)); } }
    }

    const lmw=document.getElementById('loadMoreWrap');
    const lmb=document.getElementById('loadMoreBtn');
    if(artHasMore){ lmw.style.display='block'; lmb.disabled=false; lmb.innerHTML='<i class="fas fa-chevron-down"></i> Load more'; }
    else lmw.style.display='none';

  }catch(e){
    console.error(e);
    clearSkeletons(); hideLoadingGif();
    grid.innerHTML+=`<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load</p></div>`;
  }finally{
    artLoading=false;
  }
}

window.loadMore=async function(){
  const btn=document.getElementById('loadMoreBtn');
  btn.disabled=true; btn.innerHTML='<i class="fas fa-circle-notch fa-spin"></i> Loading…';
  injectSkeletons(4);
  await loadBatch(false);
};

/* ── INIT ── */
loadCreators();
loadBatch(true);
</script>
