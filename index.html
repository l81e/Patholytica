/* Item 3: renders one carousel slide's inner content for a given media
   row. `isFirstSlide` controls video behavior — the first slide (if a
   video) plays fully interactively; every later video slide is a
   short muted/looped preview locked behind an overlay that hands off
   to the full article rather than playing inline. Item 2's double-tap
   exclusion is what keeps a first-slide YouTube video tappable — see
   buildArticleCarousel's click handler below. */
function buildCarouselSlideHTML(m,article,isFirstSlide){
  const title = article.title || (isMCQ(article.content)?'Quick Question':'Untitled');
  if(m.type==='image'){
    return `<div class="ig-post-media" data-id="${article.id}">
      <img src="${esc(m.url)}" alt="${esc(title)}" loading="lazy">
    </div>`;
  }
  if(m.type==='youtube'){
    if(isFirstSlide){
      return `<div class="ig-post-media" style="cursor:default;">
        <div class="ig-post-yt-wrap yt-interactive">
          <iframe src="${esc(m.url)}" title="${esc(title)}" loading="lazy"
            allow="accelerometer;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>
          <div class="ig-post-media-badge"><i class="fab fa-youtube"></i> Video</div>
        </div>
      </div>`;
    }
    // Later video slide: preview only, locked behind an overlay —
    // never full inline playback for a non-first video slide.
    return `<div class="ig-post-carousel-video-locked" onclick="location.href='https://patholytica.com/dailyfeed?article=${article.id}'">
      <div class="ig-post-media-badge"><i class="fab fa-youtube"></i> Video</div>
      <div class="ig-post-carousel-lock-overlay">
        <i class="fas fa-play-circle"></i>
        <span>Open to watch</span>
      </div>
    </div>`;
  }
  if(m.type==='audio'){
    const bars=Array(24).fill(0).map(()=>`<div class="ig-post-audio-bar" style="height:${Math.random()*70+20}%"></div>`).join('');
    const aid='home_audio_'+Math.random().toString(36).substr(2,9);
    return `<div class="ig-post-audio-wrap">
      <div class="ig-post-audio-title">${esc(trunc(stripEmoji(title),90))}</div>
      <div class="ig-post-audio-row">
        <button class="ig-post-audio-play" type="button" onclick="window._toggleHomeAudio(this,'${aid}')"><i class="fas fa-play"></i></button>
        <div class="ig-post-audio-wave">${bars}</div>
      </div>
      <audio id="${aid}" data-src="${esc(m.url)}" style="display:none;"></audio>
    </div>`;
  }
  return '';
}

/* Item 3: builds the full swipeable carousel for an article's media.
   Falls back to a single text-excerpt slide (matching the previous
   no-media behavior) when the article has no media at all. */
function buildArticleCarousel(article){
  const media = (mediaByArticle[article.id]||[]).filter(m=>m.type==='image'||m.type==='youtube'||m.type==='audio');
  if(!media.length){
    const excerpt = trunc((article.content||'').replace(/\n/g,' ').trim(), 140);
    return excerpt ? `<div class="ig-post-textexcerpt">${esc(excerpt)}</div>` : '';
  }
  if(media.length===1){
    return buildCarouselSlideHTML(media[0],article,true);
  }
  const slidesHTML = media.map((m,i)=>`<div class="ig-post-carousel-slide" data-slide-index="${i}" data-media-type="${m.type}">${buildCarouselSlideHTML(m,article,i===0)}</div>`).join('');
  const dotsHTML = media.map((_,i)=>`<div class="ig-post-carousel-dot${i===0?' active':''}"></div>`).join('');
  return `<div class="ig-post-carousel" data-carousel-id="${article.id}">
    <div class="ig-post-carousel-track">${slidesHTML}</div>
    <div class="ig-post-carousel-dots">${dotsHTML}</div>
    <div class="ig-post-carousel-counter">1/${media.length}</div>
  </div>`;
}

/* Item 3: tracks which slide is active as the user swipes, updating
   the dot indicator and the "N/total" counter. Uses native scroll
   position rather than custom drag math, so the gesture itself is the
   browser's own touch-scrolling — reliable and platform-consistent. */
function setupCarouselTracking(carouselEl){
  const track = carouselEl.querySelector('.ig-post-carousel-track');
  const dots = carouselEl.querySelectorAll('.ig-post-carousel-dot');
  const counter = carouselEl.querySelector('.ig-post-carousel-counter');
  const slideCount = dots.length;
  if(!track||!slideCount) return;
  let ticking=false;
  track.addEventListener('scroll',()=>{
    if(ticking) return;
    ticking=true;
    requestAnimationFrame(()=>{
      const idx = Math.round(track.scrollLeft/track.clientWidth);
      const clamped = Math.max(0,Math.min(slideCount-1,idx));
      dots.forEach((d,i)=>d.classList.toggle('active',i===clamped));
      if(counter) counter.textContent = `${clamped+1}/${slideCount}`;
      ticking=false;
    });
  },{passive:true});
}

function buildArticlePost(article){
  const post=document.createElement('div'); post.className='ig-post'; post.dataset.articleId=article.id;
  const avatarHTML=article.authorPfp?`<img src="${esc(article.authorPfp)}" alt="">`:(article.authorUsername||article.author||'A').replace('@','').charAt(0).toUpperCase();
  const profileUrl=article.authorUsername?`profile.html?username=${encodeURIComponent(article.authorUsername)}`:'#';
  const title=article.title||'Untitled';

  const headerHTML = buildPostHeader({
    avatarHTML, username: article.author||'Anonymous',
    avatarClick: `location.href='${profileUrl}'`, usernameClick: `location.href='${profileUrl}'`,
    subtext: `<span>${relTime(article.created_at)}</span>`,
    followHTML: buildFollowBtnHTML(article)
  });

  const bodyHTML = buildArticleCarousel(article);

  post.innerHTML = headerHTML + bodyHTML +
    buildActionRow(article) +
    `<div class="ig-post-caption"><span class="cap-user" onclick="location.href='${profileUrl}'">${esc(article.author||'Anonymous')}</span><span class="ig-post-title-link" onclick="location.href='https://patholytica.com/dailyfeed?article=${article.id}'">${esc(trunc(stripEmoji(title),140))}</span></div>
    <div class="ig-post-timestamp">${relTime(article.created_at)}</div>`;

  const carouselEl=post.querySelector('.ig-post-carousel');
  if(carouselEl) setupCarouselTracking(carouselEl);

  // Double-tap-to-heart applies to a single non-carousel image slide
  // (matching prior behavior) and to each image slide inside a
  // carousel — never to a YouTube slide, per Item 2.
  const likeBtn=post.querySelector('.like-btn');
  if(likeBtn){
    post.querySelectorAll('.ig-post-media').forEach(mediaEl=>setupDoubleTapLike(mediaEl,likeBtn));
  }
  return post;
}

function buildMCQPost(article){
  const post=document.createElement('div'); post.className='ig-post'; post.dataset.articleId=article.id;
  const avatarHTML=article.authorPfp?`<img src="${esc(article.authorPfp)}" alt="">`:(article.authorUsername||article.author||'A').replace('@','').charAt(0).toUpperCase();
  const profileUrl=article.authorUsername?`profile.html?username=${encodeURIComponent(article.authorUsername)}`:'#';

  const lines=(article.content||'').trim().split('\n').map(l=>l.trim()).filter(Boolean);
  const question=lines[0]?lines[0].replace(/^❔/,'').trim():'';
  const rawOpts=lines.slice(1).map(l=>({label:l.replace(/^✅/,'').trim(),correct:l.startsWith('✅')}));
  for(let i=rawOpts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rawOpts[i],rawOpts[j]]=[rawOpts[j],rawOpts[i]];}
  const letters=['A','B','C','D','E','F'];

  post.innerHTML = buildPostHeader({
    avatarHTML, username: article.author||'Anonymous',
    avatarClick: `location.href='${profileUrl}'`, usernameClick: `location.href='${profileUrl}'`,
    subtext: `<span>❔ Quick Question</span><span class="dot"></span><span>${relTime(article.created_at)}</span>`,
    followHTML: buildFollowBtnHTML(article)
  }) + `
    <div class="ig-post-mcq-body">
      <div class="ig-post-mcq-badge"><i class="fas fa-question-circle"></i> Quick Question</div>
      <div class="ig-post-mcq-q">${esc(stripEmoji(question))}</div>
      <div class="ig-post-mcq-opts" id="igMcqOpts_${article.id}">
        ${rawOpts.map((o,i)=>`<button class="ig-post-mcq-opt" data-correct="${o.correct}"><span class="opt-l">${letters[i]||i+1}</span><span>${esc(o.label)}</span></button>`).join('')}
      </div>
      <div class="ig-post-mcq-result" id="igMcqResult_${article.id}"></div>
    </div>` +
    buildActionRow(article) +
    `<div class="ig-post-timestamp">${relTime(article.created_at)}</div>`;

  let answered=false;
  post.querySelectorAll('.ig-post-mcq-opt').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(answered)return; answered=true;
      const opts=post.querySelectorAll('.ig-post-mcq-opt');
      opts.forEach(b=>b.disabled=true);
      const msgEl=document.getElementById(`igMcqResult_${article.id}`);
      const isCorrect=btn.dataset.correct==='true';
      if(isCorrect){
        btn.classList.add('correct'); if(msgEl){msgEl.textContent='✓ Correct!';msgEl.className='ig-post-mcq-result correct';}
      }else{
        btn.classList.add('wrong'); if(msgEl)msgEl.className='ig-post-mcq-result wrong';
        const correctBtn=[...opts].find(b=>b.dataset.correct==='true');
        if(correctBtn){correctBtn.classList.add('reveal'); if(msgEl)msgEl.textContent='✗ Incorrect';}
      }
    });
  });
  return post;
}

/* Item 7: renders one library as a book-cover card inside the shelf
   carousel — the thumbnail fills the card like a book cover rather
   than sitting as a small round avatar in a header. */
function buildLibraryCoverHTML(lib,articleCount){
  const isSaved=isLibSaved(lib.id);
  const coverHTML = lib.thumbnail_url
    ? `<img src="${esc(lib.thumbnail_url)}" alt="${esc(lib.name||'Library')}" loading="lazy">`
    : `<div class="lib-cover-fallback"><i class="fas fa-layer-group"></i></div>`;
  return `<div class="lib-cover-card" data-lib-id="${lib.id}">
    <div class="lib-cover-thumb" onclick="window.openCardPreview('library','${lib.id}')">
      ${coverHTML}
      <button class="lib-cover-save${isSaved?' saved':''}" onclick="event.stopPropagation();window._toggleLibSaveInline(${lib.id},'${esc(lib.name||'Untitled Library').replace(/'/g,"\\'")}','${esc(lib.thumbnail_url||'')}',${articleCount})">
        <i class="fa${isSaved?'s':'r'} fa-bookmark"></i>
      </button>
    </div>
    <div class="lib-cover-title" onclick="window.openCardPreview('library','${lib.id}')">${esc(trunc(lib.name||'Untitled Library',48))}</div>
    <div class="lib-cover-meta">${articleCount} article${articleCount!==1?'s':''}</div>
    <button class="lib-cover-study-btn" onclick="location.href='https://patholytica.com/dailyfeed?playlist=${lib.id}'"><i class="fas fa-play"></i> Study</button>
  </div>`;
}

/* Item 7: a swipeable shelf of book-cover cards, one post per group
   of libraries rather than one post per library — the carousel is the
   distinct, shelf-like display Item 7 asked for, replacing the old
   single-thumbnail post. `libs` is an array of {lib, articleCount}. */
function buildLibraryPost(libs){
  if(!libs||!libs.length) return null;
  const post=document.createElement('div'); post.className='ig-post ig-post-lib-shelf';
  post.setAttribute('data-lib-ids',libs.map(x=>x.lib.id).join(','));
  const cardsHTML = libs.map(x=>buildLibraryCoverHTML(x.lib,x.articleCount)).join('');
  const dotsHTML = libs.length>1
    ? `<div class="ig-post-carousel-dots lib-shelf-dots">${libs.map((_,i)=>`<div class="ig-post-carousel-dot${i===0?' active':''}"></div>`).join('')}</div>`
    : '';
  post.innerHTML = `
    <div class="ig-post-header">
      <div class="ig-post-avatar lib-avatar-tint"><i class="fas fa-book-open"></i></div>
      <div class="ig-post-headertext">
        <span class="ig-post-username">Libraries for you</span>
        <div class="ig-post-subtext"><span>Swipe to browse</span></div>
      </div>
    </div>
    <div class="lib-shelf-carousel">
      <div class="lib-shelf-track">${cardsHTML}</div>
      ${dotsHTML}
    </div>`;
  const trackEl=post.querySelector('.lib-shelf-track');
  const dots=post.querySelectorAll('.lib-shelf-dots .ig-post-carousel-dot');
  if(trackEl&&dots.length){
    let ticking=false;
    trackEl.addEventListener('scroll',()=>{
      if(ticking) return;
      ticking=true;
      requestAnimationFrame(()=>{
        const cardWidth = trackEl.querySelector('.lib-cover-card')?.offsetWidth || trackEl.clientWidth;
        const idx = Math.round(trackEl.scrollLeft/(cardWidth+12));
        const clamped = Math.max(0,Math.min(dots.length-1,idx));
        dots.forEach((d,i)=>d.classList.toggle('active',i===clamped));
        ticking=false;
      });
    },{passive:true});
  }
  return post;
}

window._toggleLibSaveInline=function(id,name,thumb,count){
  const newState=toggleFavourite({id,name,thumbnail_url:thumb||null,_count:count});
  document.querySelectorAll(`.lib-cover-card[data-lib-id="${id}"] .lib-cover-save`).forEach(b=>{
    b.classList.toggle('saved', newState);
    b.innerHTML = newState ? '<i class="fas fa-bookmark"></i>' : '<i class="far fa-bookmark"></i>';
  });
};

function buildMediaFeedPost(m,article){
  const post=document.createElement('div'); post.className='ig-post';
  if(!article) return null;
  const title = article.title || (isMCQ(article.content)?'Quick Question':'Untitled');
  const avatarHTML=article.authorPfp?`<img src="${esc(article.authorPfp)}" alt="">`:(article.authorUsername||article.author||'A').replace('@','').charAt(0).toUpperCase();
  const profileUrl=article.authorUsername?`profile.html?username=${encodeURIComponent(article.authorUsername)}`:'#';
  const goHref=`https://patholytica.com/dailyfeed?article=${article.id}`;

  const header = buildPostHeader({
    avatarHTML, username: article.author||'Anonymous',
    avatarClick: `location.href='${profileUrl}'`, usernameClick: `location.href='${profileUrl}'`,
    subtext: `<span>${relTime(article.created_at)}</span>`,
    followHTML: buildFollowBtnHTML(article)
  });

  if(m.type==='image'){
    post.innerHTML = header + `
      <div class="ig-post-media" data-id="${article.id}">
        <img src="${esc(m.url)}" alt="${esc(title)}" loading="lazy"
             onerror="this.closest('.ig-post')&&this.closest('.ig-post').remove();">
      </div>` +
      buildActionRow(article) +
      `<div class="ig-post-caption"><span class="cap-user" onclick="location.href='${profileUrl}'">${esc(article.author||'Anonymous')}</span><span class="ig-post-title-link" onclick="location.href='${goHref}'">${esc(trunc(stripEmoji(title),140))}</span></div>
      <div class="ig-post-timestamp">${relTime(article.created_at)}</div>`;
    const mediaEl=post.querySelector('.ig-post-media');
    const likeBtn=post.querySelector('.like-btn');
    if(mediaEl&&likeBtn) setupDoubleTapLike(mediaEl,likeBtn);
  } else if(m.type==='youtube'){
    post.innerHTML = header + `
      <div class="ig-post-media" style="cursor:default;">
        <div class="ig-post-yt-wrap">
          <iframe src="${esc(m.url)}" title="${esc(title)}" loading="lazy"
            allow="accelerometer;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>
          <div class="ig-post-media-badge"><i class="fab fa-youtube"></i> Video</div>
        </div>
      </div>` +
      buildActionRow(article) +
      `<div class="ig-post-caption"><span class="cap-user" onclick="location.href='${profileUrl}'">${esc(article.author||'Anonymous')}</span><span class="ig-post-title-link" onclick="location.href='${goHref}'">${esc(trunc(stripEmoji(title),140))}</span></div>
      <div class="ig-post-timestamp">${relTime(article.created_at)}</div>`;
  } else if(m.type==='audio'){
    const bars=Array(24).fill(0).map(()=>`<div class="ig-post-audio-bar" style="height:${Math.random()*70+20}%"></div>`).join('');
    const aid='home_audio_'+Math.random().toString(36).substr(2,9);
    post.innerHTML = header + `
      <div class="ig-post-audio-wrap">
        <div class="ig-post-audio-title">${esc(trunc(stripEmoji(title),90))}</div>
        <div class="ig-post-audio-row">
          <button class="ig-post-audio-play" type="button" onclick="window._toggleHomeAudio(this,'${aid}')"><i class="fas fa-play"></i></button>
          <div class="ig-post-audio-wave">${bars}</div>
        </div>
        <audio id="${aid}" data-src="${esc(m.url)}" style="display:none;"></audio>
      </div>` +
      buildActionRow(article) +
      `<div class="ig-post-caption"><span class="cap-user" onclick="location.href='${profileUrl}'">${esc(article.author||'Anonymous')}</span><span class="ig-post-title-link" onclick="location.href='${goHref}'">${esc(trunc(stripEmoji(title),140))}</span></div>
      <div class="ig-post-timestamp">${relTime(article.created_at)}</div>`;
  }
  return post;
}

window._toggleHomeAudio=function(btn,audioId){
  const audio=document.getElementById(audioId);
  if(!audio)return;
  if(!audio.src && audio.dataset.src){ audio.src=audio.dataset.src; audio.load(); }
  const icon=btn.querySelector('i');
  if(audio.paused){
    audio.play().catch(()=>{}); icon.className='fas fa-pause';
    audio.onended=()=>{ icon.className='fas fa-play'; };
  }else{
    audio.pause(); icon.className='fas fa-play';
  }
};

/* ══ SKELETONS ══ */
function ig_skeletonHTML(){
  return `
    <div class="ig-skel-header">
      <div class="ig-skel-avatar skel-circle"></div>
      <div class="ig-skel-name skel-line"></div>
    </div>
    <div class="ig-skel-media skel-line" style="border-radius:0;"></div>
    <div class="ig-skel-actions">
      <div class="ig-skel-icon skel-line"></div>
      <div class="ig-skel-icon skel-line"></div>
      <div class="ig-skel-icon skel-line"></div>
    </div>
    <div class="ig-skel-line skel-line" style="width:40%;"></div>
    <div class="ig-skel-line skel-line" style="width:75%;"></div>`;
}
function injectSkeletons(n=4){
  const grid=document.getElementById('mainGrid');
  for(let i=0;i<n;i++){
    const sk=document.createElement('div');
    sk.className='ig-post-skeleton';
    sk.innerHTML=ig_skeletonHTML();
    grid.appendChild(sk);
  }
}
function clearSkeletons(){ document.querySelectorAll('.ig-post-skeleton').forEach(s=>s.remove()); }

/* ══ MAIN LOADER ══ */
async function fetchAllArticles(){
  if(allArticles!==null) return;
  const{data,error}=await supabase.from('articles')
    .select('*').order('created_at',{ascending:false}).limit(300);
  if(error) throw error;
  allArticles=data||[];
  shuffledArts=weightedShuffle(allArticles);
}

let libExhausted = false;

async function loadBatch(isInitial=true){
  if(artLoading)return;
  if(!isInitial && !artHasMore) return;
  artLoading=true;
  if(isInitial) injectSkeletons(4);
  const grid=document.getElementById('mainGrid');
  try{
    if(isInitial){
      await fetchAllArticles();
      await fetchMediaPool();
    }
    const batch=shuffledArts.slice(artOffset,artOffset+ART_BATCH);
    artOffset+=batch.length;
    artHasMore = artOffset < shuffledArts.length;
    if(!batch.length){ artHasMore=false; }
    else{
      const artIds=batch.map(a=>a.id);
      const{data:media}=await supabase.from('media').select('article_id,url,type')
        .in('article_id',artIds).order('display_order',{ascending:true});
      (media||[]).forEach(m=>{
        if(!mediaByArticle[m.article_id]) mediaByArticle[m.article_id]=[];
        mediaByArticle[m.article_id].push(m);
      });

      const uids=[...new Set(batch.map(a=>a.firebase_user_id).filter(Boolean))];
      let usersData=[];
      if(uids.length){
        const{data:u}=await supabase.from('users').select('firebase_uid,username,full_name,pfp,user_id:id').in('firebase_uid',uids);
        usersData=u||[];
      }
      const enrichedBatch=batch.map(a=>{
        const u=usersData.find(x=>x.firebase_uid===a.firebase_user_id);
        return{...a,author:u?.username?`@${u.username}`:(u?.full_name||'Anonymous'),authorPfp:u?.pfp||null,authorUsername:u?.username||null,authorSupaUserId:u?.user_id||null};
      });

      let libs=[];
      if(!libExhausted){
        const{data:libData,error:libErr}=await supabase.from('playlists').select('*')
          .not('name','like','algotag(%')
          .order('created_at',{ascending:false}).range(libOffset,libOffset+LIB_PER_BATCH-1);
        if(libErr){
          libExhausted=true;
        }else{
          libs=libData||[];
          libOffset+=libs.length;
          if(libs.length<LIB_PER_BATCH) libExhausted=true;
        }
      }

      const libIds=libs.map(l=>l.id);
      let libCountMap={};
      if(libIds.length){
        const{data:irows}=await supabase.from('playlist_items').select('playlist_id').in('playlist_id',libIds);
        (irows||[]).forEach(r=>{libCountMap[r.playlist_id]=(libCountMap[r.playlist_id]||0)+1;});
      }
      let sortedLibs=[...libs];
      if(userFavourites.size>0){
        const saved=sortedLibs.filter(l=>userFavourites.has(String(l.id))).slice(0,5);
        const unsaved=sortedLibs.filter(l=>!userFavourites.has(String(l.id)));
        sortedLibs=[...saved,...unsaved];
      }
      clearSkeletons();
      let libIdx=0;
      const LIB_SHELF_SIZE=3;
      function nextLibGroup(){
        const group=sortedLibs.slice(libIdx,libIdx+LIB_SHELF_SIZE).map(l=>({lib:l,articleCount:libCountMap[l.id]||0}));
        libIdx+=group.length;
        return group;
      }
      const artIdToArticle={}; enrichedBatch.forEach(a=>{artIdToArticle[a.id]=a;});
      enrichedBatch.forEach((art,i)=>{
        const post = isMCQ(art.content) ? buildMCQPost(art) : buildArticlePost(art);
        grid.appendChild(post);
        if((i+1)%4===0&&libIdx<sortedLibs.length){
          const group=nextLibGroup();
          const shelfPost=buildLibraryPost(group);
          if(shelfPost) grid.appendChild(shelfPost);
        }
        if((i+1)%5===0 && mediaPool.length){
          const m=mediaPool[mediaPoolOffset % mediaPool.length];
          mediaPoolOffset++;
          const refArticle = artIdToArticle[m.article_id] || null;
          if(refArticle){
            const mPost=buildMediaFeedPost(m, refArticle);
            if(mPost) grid.appendChild(mPost);
          }
        }
      });
      while(libIdx<sortedLibs.length){
        const group=nextLibGroup();
        const shelfPost=buildLibraryPost(group);
        if(shelfPost) grid.appendChild(shelfPost);
      }
    }
    loadHomeCommentCounts();
    updateScrollLoaderState();
  }catch(e){
    console.error(e);clearSkeletons();
    if(isInitial){
      grid.innerHTML+=`<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load</p></div>`;
    }
    updateScrollLoaderState();
  }finally{
    artLoading=false;
  }
}

/* ══ INFINITE SCROLL (replaces the manual Load More button) ══ */
function updateScrollLoaderState(){
  const loaderWrap=document.getElementById('scrollLoaderWrap');
  const endMsg=document.getElementById('scrollEndMsg');
  loaderWrap.classList.remove('active');
  if(artHasMore){
    endMsg.classList.remove('active');
  }else{
    endMsg.classList.add('active');
  }
}

const scrollObserver = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting && artHasMore && !artLoading){
      document.getElementById('scrollLoaderWrap').classList.add('active');
      loadBatch(false);
    }
  });
},{ rootMargin: '400px 0px 0px 0px' });

document.addEventListener('DOMContentLoaded', ()=>{
  const sentinel = document.getElementById('scrollSentinel');
  if(sentinel) scrollObserver.observe(sentinel);
});

loadCreators();
loadBatch(true);
</script>
