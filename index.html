<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Patholytica — Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>

:root {
  --bg-color: #0f0e0b;
  --text-primary: #f5f0e8;
  --text-secondary: #8a8070;
  --hover-bg: #1a1810;
  --border-color: #2a2518;
  --accent: #c8a96e;
  --accent-hover: #b8935a;
  --accent-glow: rgba(200,169,110,0.25);
  --accent-soft: rgba(200,169,110,0.12);
  --font-article: 'Merriweather', serif;
  --font-ui: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
}
body.theme-dark {
  --bg-color: #0f0e0b; --text-primary: #f5f0e8; --text-secondary: #8a8070;
  --hover-bg: #1a1810; --border-color: #2a2518;
  --accent: #c8a96e; --accent-hover: #b8935a;
  --accent-glow: rgba(200,169,110,0.25); --accent-soft: rgba(200,169,110,0.12);
}
body.theme-light {
  --bg-color: #faf6ee; --text-primary: #1a1710; --text-secondary: #706050;
  --hover-bg: #f0ebe0; --border-color: #e0d8c8;
  --accent: #a07840; --accent-hover: #8a6430;
  --accent-glow: rgba(160,120,64,0.2); --accent-soft: rgba(160,120,64,0.08);
}
body.font-serif  { --font-article: 'Merriweather', serif; }
body.font-slab   { --font-article: 'Source Serif 4', serif; }
body.font-modern { --font-article: 'Inter', sans-serif; }

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  font-family: var(--font-ui);
  background: var(--bg-color);
  color: var(--text-primary);
  overflow-x: hidden;
  transition: background 0.2s ease, color 0.2s ease;
}

.static-header {
  background: var(--bg-color);
  padding-top: env(safe-area-inset-top);
  transition: background 0.2s ease;
}
.static-header-inner {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px 6px; max-width: 1200px; margin: 0 auto;
}
.header-logo { display: flex; align-items: center; cursor: pointer; }
.header-logo img {
  height: 28px; width: auto;
  transition: filter 0.2s ease;
}
body.theme-light .header-logo img { filter: invert(1) grayscale(1); }

.header-actions { display: flex; align-items: center; gap: 4px; }
.header-icon-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: none; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--text-secondary);
  transition: color 0.2s, background 0.2s;
  margin-right: 4px; position: relative;
}
.header-icon-btn:hover { color: var(--accent); background: var(--accent-soft); }
.header-icon-btn.active { color: var(--accent); }
.header-notif-badge {
  position: absolute; top: 3px; right: 3px;
  background: #c46a4e; color: #fff; font-size: 9px; font-weight: 700;
  width: 15px; height: 15px; border-radius: 50%;
  display: none; align-items: center; justify-content: center;
  border: 1.5px solid var(--bg-color); pointer-events: none;
}
.header-notif-badge.show { display: flex; }

.notif-panel {
  display: none; flex-direction: column;
  position: fixed; z-index: 500;
  width: 310px; max-width: calc(100vw - 24px); max-height: 460px;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 16px; box-shadow: 0 16px 48px rgba(0,0,0,0.7);
  overflow: hidden;
}
.notif-panel.open { display: flex; }
.notif-panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 16px 10px; border-bottom: 1px solid var(--border-color); flex-shrink: 0;
}
.notif-panel-title { font-size: 13px; font-weight: 700; }
.notif-mark-all {
  font-size: 11px; font-weight: 600; color: var(--accent);
  background: none; border: none; cursor: pointer; font-family: var(--font-ui);
  transition: opacity 0.2s;
}
.notif-mark-all:hover { opacity: 0.7; }
.notif-list { flex: 1; overflow-y: auto; }
.notif-list::-webkit-scrollbar { width: 2px; }
.notif-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
.notif-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 11px 16px; border-bottom: 1px solid rgba(42,37,24,0.6);
  cursor: pointer; transition: background 0.15s; position: relative;
}
.notif-item:hover { background: var(--hover-bg); }
.notif-item.unread { background: rgba(200,169,110,0.04); }
.notif-item.unread::before {
  content: ''; position: absolute; left: 6px; top: 50%; transform: translateY(-50%);
  width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
}
.notif-icon {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 12px;
}
.notif-icon.like    { background: rgba(196,106,78,0.15); color: #c46a4e; }
.notif-icon.comment { background: rgba(138,160,192,0.15); color: #8aa0c0; }
.notif-icon.follow  { background: var(--accent-soft); color: var(--accent); }
.notif-icon.article { background: rgba(106,191,133,0.15); color: #6abf85; }
.notif-icon.discord { background: rgba(88,101,242,0.15); color: #7289da; }
.notif-icon.insta   { background: rgba(225,48,108,0.12); color: #e1306c; }
.notif-text { flex: 1; min-width: 0; }
.notif-msg  { font-size: 12px; line-height: 1.4; color: var(--text-primary); }
.notif-time { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }
.notif-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 40px 20px; color: var(--text-secondary);
}
.notif-empty i { font-size: 28px; opacity: 0.25; color: var(--accent); }
.notif-empty p { font-size: 12px; opacity: 0.6; margin: 0; text-align: center; }
.notif-empty a {
  font-size: 12px; font-weight: 700; color: var(--accent);
  text-decoration: none; margin-top: 4px;
  background: var(--accent-soft); border: 1px solid rgba(200,169,110,0.3);
  border-radius: 20px; padding: 6px 16px; display: inline-block;
  transition: background 0.15s;
}
.notif-empty a:hover { background: rgba(200,169,110,0.2); }
.notif-spinner-wrap { padding: 24px; display: flex; justify-content: center; }
.notif-spinner {
  width: 22px; height: 22px;
  border: 2px solid var(--border-color); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.settings-popover {
  position: fixed; z-index: 500;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 16px; padding: 0; width: 230px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  opacity: 0; pointer-events: none;
  transform: translateY(-8px) scale(0.97);
  transition: opacity 0.2s, transform 0.2s;
  overflow: hidden;
}
.settings-popover.open { opacity: 1; pointer-events: all; transform: translateY(0) scale(1); }
.sp-profile {
  padding: 14px 14px 12px;
  border-bottom: 1px solid var(--border-color);
  display: flex; align-items: center; gap: 10px;
  cursor: pointer; transition: background 0.15s;
}
.sp-profile:hover { background: rgba(200,169,110,0.06); }
.sp-profile-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--accent-soft); border: 1.5px solid rgba(200,169,110,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: var(--accent);
  overflow: hidden; flex-shrink: 0;
}
.sp-profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
.sp-profile-info { flex: 1; min-width: 0; }
.sp-profile-name {
  font-size: 13px; font-weight: 700; color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sp-profile-status { font-size: 10px; margin-top: 1px; }
.sp-profile-status.online { color: #6abf85; }
.sp-profile-status.guest  { color: var(--text-secondary); }
.sp-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.sp-label {
  font-size: 9px; font-weight: 800; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-secondary); margin-bottom: 7px;
}
.sp-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sp-pill {
  padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
  border: 1px solid var(--border-color); background: var(--bg-color);
  color: var(--text-secondary); cursor: pointer; transition: all 0.15s;
  font-family: var(--font-ui);
}
.sp-pill.active { background: var(--accent); color: #0f0e0b; border-color: var(--accent); }
.sp-pill:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
.sp-logout {
  width: 100%; padding: 9px 12px; border-radius: 10px;
  background: rgba(196,106,78,0.08); border: 1px solid rgba(196,106,78,0.22);
  color: #c46a4e; font-size: 12px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px;
  font-family: var(--font-ui); transition: background 0.15s; margin-top: 4px;
}
.sp-logout:hover { background: rgba(196,106,78,0.16); }
.sp-login {
  width: 100%; padding: 9px 12px; border-radius: 10px;
  background: var(--accent-soft); border: 1px solid rgba(200,169,110,0.3);
  color: var(--accent); font-size: 12px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px;
  font-family: var(--font-ui); transition: background 0.15s; margin-top: 4px;
}
.sp-login:hover { background: rgba(200,169,110,0.2); }

.float-overlay {
  position: fixed; inset: 0; z-index: 400;
  background: rgba(0,0,0,0.65); backdrop-filter: blur(5px);
  display: none; align-items: center; justify-content: center;
  padding: 20px;
}
.float-overlay.open { display: flex; }

.user-float-card {
  width: 100%; max-width: 360px;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 20px;
  padding: 22px 20px 20px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.75);
  animation: floatIn 0.22s cubic-bezier(0.34,1.26,0.64,1);
  max-height: 90vh; overflow-y: auto;
}
@keyframes floatIn {
  from { opacity:0; transform: scale(0.93) translateY(8px); }
  to   { opacity:1; transform: scale(1)    translateY(0);   }
}
.float-close {
  position: absolute; top: 14px; right: 14px;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--bg-color); border: 1px solid var(--border-color);
  color: var(--text-secondary); font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: color 0.15s, border-color 0.15s;
}
.float-close:hover { color: var(--accent); border-color: var(--accent); }

.user-float-card .user-popup-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.user-float-card .user-popup-avatar {
  width: 58px; height: 58px; border-radius: 50%;
  background: var(--accent-soft); border: 2px solid rgba(200,169,110,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700; color: var(--accent);
  overflow: hidden; flex-shrink: 0;
}
.user-float-card .user-popup-avatar img { width: 100%; height: 100%; object-fit: cover; }
.user-float-card .user-popup-identity { flex: 1; min-width: 0; }
.user-float-card .user-popup-name {
  font-size: 16px; font-weight: 800; color: var(--text-primary);
  font-family: var(--font-article); margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.user-float-card .user-popup-handle-txt { font-size: 12px; color: var(--text-secondary); }
.user-float-card .user-popup-stats {
  display: flex; border: 1px solid var(--border-color);
  border-radius: 12px; overflow: hidden; margin-bottom: 14px;
}
.user-float-card .user-popup-stat {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 10px 6px; position: relative;
}
.user-float-card .user-popup-stat + .user-popup-stat::before {
  content: ''; position: absolute; left: 0; top: 20%; bottom: 20%;
  width: 1px; background: var(--border-color);
}
.user-float-card .user-popup-stat-val {
  font-size: 16px; font-weight: 800; color: var(--text-primary);
  font-family: var(--font-article); line-height: 1;
}
.user-float-card .user-popup-stat-label {
  font-size: 9px; font-weight: 600; color: var(--text-secondary);
  margin-top: 3px; text-transform: uppercase; letter-spacing: 0.04em;
}
.user-float-card .user-popup-bio { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px; }
.user-float-card .user-popup-btn {
  width: 100%; padding: 11px; border-radius: 10px;
  background: var(--accent); color: #0f0e0b;
  font-size: 13px; font-weight: 700; border: none; cursor: pointer;
  font-family: var(--font-ui); transition: background 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.user-float-card .user-popup-btn:hover { background: var(--accent-hover); }

@keyframes skelShimmer {
  0%   { background-position: -400px 0; }
  100% { background-position:  400px 0; }
}
.skel-line {
  border-radius: 6px;
  background: linear-gradient(90deg, var(--border-color) 25%, var(--hover-bg) 50%, var(--border-color) 75%);
  background-size: 400px 100%;
  animation: skelShimmer 1.4s ease infinite;
}
.skel-circle {
  border-radius: 50%;
  background: linear-gradient(90deg, var(--border-color) 25%, var(--hover-bg) 50%, var(--border-color) 75%);
  background-size: 400px 100%;
  animation: skelShimmer 1.4s ease infinite;
}

.card-float-card {
  width: 100%; max-width: 460px;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 20px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.75);
  animation: floatIn 0.22s cubic-bezier(0.34,1.26,0.64,1);
  max-height: 90vh; display: flex; flex-direction: column;
  position: relative;
}
.card-float-inner {
  flex: 1; overflow-y: auto; padding: 22px 20px 20px;
}
.card-float-inner::-webkit-scrollbar { width: 2px; }
.card-float-inner::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

.saved-panel {
  display: none; flex-direction: column;
  position: fixed; z-index: 500;
  width: 320px; max-width: calc(100vw - 24px); max-height: 480px;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 16px; box-shadow: 0 16px 48px rgba(0,0,0,0.7);
  overflow: hidden;
}
.saved-panel.open { display: flex; }
.saved-panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 16px 10px; border-bottom: 1px solid var(--border-color); flex-shrink: 0;
}
.saved-panel-title { font-size: 13px; font-weight: 700; }
.saved-list { flex: 1; overflow-y: auto; }
.saved-list::-webkit-scrollbar { width: 2px; }
.saved-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
.saved-item {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 16px; border-bottom: 1px solid rgba(42,37,24,0.6);
  cursor: pointer; transition: background 0.15s;
}
.saved-item:hover { background: rgba(200,169,110,0.05); }
.saved-item-thumb {
  width: 44px; height: 44px; border-radius: 9px; flex-shrink: 0;
  background: var(--accent-soft); overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  color: var(--accent); font-size: 16px;
}
.saved-item-thumb img { width: 100%; height: 100%; object-fit: cover; }
.saved-item-info { flex: 1; min-width: 0; }
.saved-item-name {
  font-size: 13px; font-weight: 700; color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.saved-item-meta { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.saved-item-remove {
  flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary); font-size: 11px; background: none; border: none;
  cursor: pointer; transition: color 0.15s, background 0.15s;
}
.saved-item-remove:hover { color: #c46a4e; background: rgba(196,106,78,0.1); }
.saved-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 40px 20px; color: var(--text-secondary);
}
.saved-empty i { font-size: 28px; opacity: 0.25; color: var(--accent); }
.saved-empty p { font-size: 12px; opacity: 0.6; margin: 0; text-align: center; }

.cp-type-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
  border-radius: 5px; padding: 3px 8px; margin-bottom: 10px;
}
.cp-type-badge.article { background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(200,169,110,0.3); }
.cp-type-badge.mcq     { background: rgba(106,191,133,0.12); color: #a0d8b0; border: 1px solid rgba(106,191,133,0.25); }
.cp-type-badge.library { background: rgba(106,159,207,0.12); color: #a8c8e8; border: 1px solid rgba(106,159,207,0.25); }
.cp-title { font-size: 17px; font-weight: 800; line-height: 1.3; color: var(--text-primary); font-family: var(--font-article); margin-bottom: 10px; }
.cp-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.cp-meta-item { font-size: 11px; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
.cp-meta-item i { font-size: 10px; }
.cp-excerpt { font-size: 14px; line-height: 1.7; color: var(--text-secondary); margin-bottom: 18px; }
.cp-mcq-q { font-size: 15px; font-weight: 700; color: var(--text-primary); font-family: var(--font-article); line-height: 1.4; margin-bottom: 12px; }
.cp-mcq-opts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.cp-mcq-opt {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 13px; border-radius: 10px;
  border: 1px solid var(--border-color); background: var(--bg-color);
  font-size: 13px; color: var(--text-primary); cursor: pointer;
  transition: border-color 0.15s, background 0.15s; text-align: left; width: 100%;
  font-family: var(--font-ui);
}
.cp-mcq-opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.cp-mcq-opt:disabled { cursor: default; }
.cp-mcq-opt .opt-l {
  width: 24px; height: 24px; border-radius: 50%;
  border: 1.5px solid var(--border-color);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 800; flex-shrink: 0; color: var(--text-secondary);
}
.cp-mcq-opt.correct { border-color: #6abf85; background: rgba(106,191,133,0.08); }
.cp-mcq-opt.correct .opt-l { background: #6abf85; border-color: #6abf85; color: #0f0e0b; }
.cp-mcq-opt.wrong   { border-color: #c46a4e; background: rgba(196,106,78,0.07); }
.cp-mcq-opt.wrong   .opt-l { background: #c46a4e; border-color: #c46a4e; color: #fff; }
.cp-mcq-opt.reveal  { border-color: rgba(106,191,133,0.5); }
.cp-mcq-opt.reveal  .opt-l { border-color: #6abf85; color: #6abf85; }
.cp-mcq-result { font-size: 13px; font-weight: 700; margin-bottom: 14px; }
.cp-mcq-result.correct { color: #6abf85; }
.cp-mcq-result.wrong   { color: #c46a4e; }
.cp-lib-desc { font-size: 14px; line-height: 1.7; color: var(--text-secondary); margin-bottom: 16px; }
.cp-lib-save-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.cp-save-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 700;
  border: 1px solid var(--border-color); background: none; color: var(--text-secondary);
  cursor: pointer; font-family: var(--font-ui); transition: all 0.15s;
}
.cp-save-btn:hover { border-color: var(--accent); color: var(--accent); }
.cp-save-btn.saved { border-color: rgba(200,169,110,0.4); color: var(--accent); background: var(--accent-soft); }
.cp-save-btn i { font-size: 12px; }
.cp-actions { display: flex; gap: 8px; }
.cp-btn-primary {
  flex: 1; padding: 11px; border-radius: 10px;
  background: var(--accent); color: #0f0e0b;
  font-size: 13px; font-weight: 700; border: none; cursor: pointer;
  font-family: var(--font-ui); transition: background 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.cp-btn-primary:hover { background: var(--accent-hover); }
.cp-loading { display: flex; align-items: center; justify-content: center; padding: 40px; }
.cp-loading-ring {
  width: 26px; height: 26px;
  border: 2px solid var(--border-color); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.9s linear infinite;
}

.page-body {
  max-width: 640px; margin: 0 auto;
  padding: 0;
  padding-bottom: calc(80px + env(safe-area-inset-bottom));
}

.ig-feed { display: flex; flex-direction: column; }

.ig-post {
  padding-bottom: 6px;
  margin-bottom: 6px;
}

.ig-post-header {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 12px;
}
.ig-post-avatar {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent), #8a6430);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #0f0e0b;
  overflow: hidden; cursor: pointer;
  box-shadow: 0 0 0 2px var(--bg-color), 0 0 0 3.5px var(--accent);
}
.ig-post-avatar img { width: 100%; height: 100%; object-fit: cover; }
.ig-post-avatar.lib-avatar-tint {
  background: rgba(106,159,207,0.18); color: #6a9fcf;
  box-shadow: 0 0 0 2px var(--bg-color), 0 0 0 3.5px rgba(106,159,207,0.5);
}
.ig-post-headertext { flex: 1; min-width: 0; }
.ig-post-username {
  font-size: 13px; font-weight: 700; color: var(--text-primary);
  cursor: pointer; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ig-post-username:hover { color: var(--accent); }
.ig-post-subtext { font-size: 11px; color: var(--text-secondary); display: flex; align-items: center; gap: 5px; }
.ig-post-subtext .dot { width: 2px; height: 2px; border-radius: 50%; background: var(--text-secondary); flex-shrink: 0; }
.ig-post-follow-btn {
  font-size: 12px; font-weight: 700; color: var(--accent);
  background: none; border: none; cursor: pointer; padding: 4px 6px;
  font-family: var(--font-ui); flex-shrink: 0; transition: opacity 0.15s;
}
.ig-post-follow-btn:hover { opacity: 0.7; }
.ig-post-follow-btn.following { color: var(--text-secondary); }

/* Item 4: header follow pill — rectangular, labeled, replaces the
   circular icon-only follow button when it sits in the post header. */
.ig-post-follow-pill {
  flex-shrink: 0; padding: 6px 14px; border-radius: 8px;
  border: 1.5px solid var(--accent); background: var(--accent-soft);
  color: var(--accent); font-size: 12px; font-weight: 700;
  font-family: var(--font-ui); cursor: pointer;
  transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  -webkit-tap-highlight-color: transparent; white-space: nowrap;
}
.ig-post-follow-pill:hover { background: rgba(200,169,110,0.22); }
.ig-post-follow-pill:active { transform: scale(0.96); }
.ig-post-follow-pill.following {
  border-color: var(--border-color); background: none; color: var(--text-secondary);
}
.ig-post-follow-pill.following:hover { border-color: var(--accent); color: var(--accent); }

.ig-post-media {
  position: relative; width: 100%;
  background: var(--hover-bg);
  cursor: pointer; overflow: hidden;
}
.ig-post-media img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.ig-post-media-fallback {
  width: 100%; aspect-ratio: 1/1;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  background: linear-gradient(135deg, var(--hover-bg) 0%, #1e1c16 100%);
  color: var(--accent); padding: 20px; text-align: center;
}
.ig-post-media-fallback i { font-size: 30px; opacity: 0.55; }
.ig-post-media-fallback span { font-size: 13px; font-weight: 700; color: var(--text-primary); font-family: var(--font-article); line-height: 1.35; opacity: 0.85; }
.ig-post-media-badge {
  position: absolute; top: 10px; right: 10px; z-index: 2;
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
  background: rgba(0,0,0,0.55); color: #fff; border-radius: 5px; padding: 3px 7px;
  backdrop-filter: blur(4px); pointer-events: none;
}
.ig-post-yt-wrap { position: relative; width: 100%; background: #000; }
.ig-post-yt-wrap iframe { width: 100%; aspect-ratio: 1/1; border: none; display: block; pointer-events: none; }
/* Item 2: once a YouTube slide is the active carousel slide, the
   iframe becomes genuinely interactive (playable) — the double-tap
   listener is never bound over an active YouTube slide in JS, and
   this class removes the click-passthrough veneer so taps reach the
   player instead of the post underneath it. */
.ig-post-yt-wrap.yt-interactive iframe { pointer-events: auto; }

/* Item 3: swipeable per-article carousel. One slide-track that pages
   horizontally; each slide is one media block (image / video-preview /
   audio / text). Dots indicate position; a locked video slide shows a
   short muted preview with an explicit "open to watch" overlay rather
   than full playback inline. */
.ig-post-carousel {
  position: relative; width: 100%; overflow: hidden;
}
.ig-post-carousel-track {
  display: flex; width: 100%;
  overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.ig-post-carousel-track::-webkit-scrollbar { display: none; }
.ig-post-carousel-slide {
  flex: 0 0 100%; width: 100%; scroll-snap-align: start; scroll-snap-stop: always;
  position: relative;
}
.ig-post-carousel-dots {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); z-index: 3;
  display: flex; align-items: center; gap: 5px;
  padding: 4px 8px; border-radius: 20px;
  background: rgba(0,0,0,0.4); backdrop-filter: blur(3px);
  pointer-events: none;
}
.ig-post-carousel-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: rgba(255,255,255,0.45); transition: background 0.15s, transform 0.15s;
  flex-shrink: 0;
}
.ig-post-carousel-dot.active { background: #fff; transform: scale(1.3); }
.ig-post-carousel-counter {
  position: absolute; top: 10px; right: 10px; z-index: 3;
  font-size: 10px; font-weight: 700; color: #fff;
  background: rgba(0,0,0,0.5); backdrop-filter: blur(3px);
  border-radius: 10px; padding: 3px 8px; pointer-events: none;
}
/* Video-preview slide (any slide after the first, when that slide is
   a video): short muted/looping preview only, with a locked overlay
   that hands off to the full article rather than playing inline. */
.ig-post-carousel-video-locked {
  position: relative; width: 100%; aspect-ratio: 1/1; background: #000; overflow: hidden;
}
.ig-post-carousel-video-locked video {
  width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none;
}
.ig-post-carousel-lock-overlay {
  position: absolute; inset: 0; z-index: 2;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  background: rgba(0,0,0,0.42); cursor: pointer; text-align: center; padding: 20px;
}
.ig-post-carousel-lock-overlay i { font-size: 24px; color: #fff; opacity: 0.92; }
.ig-post-carousel-lock-overlay span {
  font-size: 12px; font-weight: 700; color: #fff;
  background: rgba(0,0,0,0.35); border-radius: 20px; padding: 6px 14px;
}
.ig-post-carousel-slide-text {
  padding: 16px 14px; min-height: 100px; display: flex; align-items: center;
  background: var(--hover-bg);
  font-size: 13px; line-height: 1.6; color: var(--text-primary);
}

/* Item 7: library shelf — a swipeable row of book-cover cards,
   replacing the old single small-thumbnail library post. Each card
   shows the library's own thumbnail_url filling a tall cover shape,
   the way a shelf of book spines/covers would read. */
.lib-shelf-carousel { padding: 4px 12px 12px; }
.lib-shelf-track {
  display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x proximity;
  scrollbar-width: none; -webkit-overflow-scrolling: touch; padding-bottom: 4px;
}
.lib-shelf-track::-webkit-scrollbar { display: none; }
.lib-cover-card {
  flex: 0 0 132px; width: 132px; scroll-snap-align: start;
  display: flex; flex-direction: column;
}
.lib-cover-thumb {
  position: relative; width: 132px; height: 176px; border-radius: 10px;
  overflow: hidden; cursor: pointer; background: var(--hover-bg);
  border: 1px solid var(--border-color);
  box-shadow: 0 6px 16px rgba(0,0,0,0.35);
}
.lib-cover-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lib-cover-fallback {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(160deg, rgba(106,159,207,0.18), rgba(106,159,207,0.05));
  color: #6a9fcf; font-size: 30px;
}
.lib-cover-save {
  position: absolute; top: 7px; right: 7px; z-index: 2;
  width: 26px; height: 26px; border-radius: 50%;
  background: rgba(0,0,0,0.5); backdrop-filter: blur(3px); border: none;
  color: #fff; font-size: 11px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.lib-cover-save:hover { background: rgba(0,0,0,0.7); }
.lib-cover-save.saved { color: var(--accent); }
.lib-cover-title {
  font-size: 12.5px; font-weight: 700; color: var(--text-primary);
  font-family: var(--font-article); line-height: 1.3; margin-top: 8px;
  cursor: pointer; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.lib-cover-title:hover { color: var(--accent); }
.lib-cover-meta { font-size: 10.5px; color: var(--text-secondary); margin-top: 2px; }
.lib-cover-study-btn {
  margin-top: 7px; padding: 7px; border-radius: 8px; width: 100%;
  background: var(--accent-soft); border: 1px solid rgba(200,169,110,0.3);
  color: var(--accent); font-size: 11px; font-weight: 700; cursor: pointer;
  font-family: var(--font-ui); transition: background 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
.lib-cover-study-btn:hover { background: rgba(200,169,110,0.22); }
.lib-shelf-dots { position: static; transform: none; margin: 8px auto 0; width: fit-content; background: none; padding: 0; backdrop-filter: none; }
.lib-shelf-dots .ig-post-carousel-dot { background: var(--border-color); }
.lib-shelf-dots .ig-post-carousel-dot.active { background: var(--accent); }

.ig-post-actions {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 10px 6px;
}
/* Item 1: icon and count sit side-by-side within a button (row, not
   column), with visible internal gap; Item 5: actions-left now holds
   only like/comment/view — share moves to its own right-aligned slot
   below, separated from these three. */
.ig-post-actions-left { display: flex; align-items: center; gap: 18px; }
.ig-action-btn {
  display: flex; flex-direction: row; align-items: center; gap: 6px;
  min-width: 0; padding: 4px 4px;
  background: none; border: none; cursor: pointer; color: var(--text-primary);
  transition: transform 0.1s; flex-shrink: 0;
}
.ig-action-btn:active { transform: scale(0.9); }
.ig-action-btn svg { width: 22px; height: 22px; stroke: var(--text-primary); fill: none; stroke-width: 1.8; flex-shrink: 0; }
.ig-action-btn.like-btn.liked svg { fill: #d4845a; stroke: #d4845a; }
.ig-action-btn.save-btn.saved svg { fill: var(--accent); stroke: var(--accent); }
.ig-action-btn-count {
  font-size: 11px; font-weight: 700; color: var(--text-secondary); line-height: 1;
}
.ig-action-btn.like-btn.liked .ig-action-btn-count { color: #d4845a; }
/* Item 5: share sits alone at the bottom-right, away from the other
   three action buttons. */
.ig-post-actions-right { display: flex; align-items: center; flex-shrink: 0; }

.ig-post-caption {
  padding: 0 12px; font-size: 13px; line-height: 1.5; color: var(--text-primary);
  margin-bottom: 3px;
}
.ig-post-caption .cap-user { font-weight: 700; margin-right: 5px; cursor: pointer; }
.ig-post-caption .cap-user:hover { color: var(--accent); }
.ig-post-title-link { cursor: pointer; }
.ig-post-title-link:hover { color: var(--accent); }

.ig-post-timestamp {
  padding: 2px 12px 10px;
  font-size: 10px; letter-spacing: 0.03em; text-transform: uppercase;
  color: var(--text-secondary);
}

.ig-post-mcq-body { padding: 4px 12px 6px; }
.ig-post-mcq-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--accent-soft); border: 1px solid rgba(200,169,110,0.3);
  border-radius: 20px; padding: 4px 11px;
  font-size: 10px; font-weight: 800; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--accent); margin-bottom: 10px;
}
.ig-post-mcq-q {
  font-size: 15px; font-weight: 800; color: var(--text-primary);
  font-family: var(--font-article); line-height: 1.35; margin-bottom: 12px;
}
.ig-post-mcq-opts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 6px; }
.ig-post-mcq-opt {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 13px; border-radius: 11px;
  border: 1px solid var(--border-color); background: var(--hover-bg);
  font-size: 13px; font-weight: 500; color: var(--text-primary); cursor: pointer;
  transition: border-color 0.15s, background 0.15s; text-align: left; width: 100%;
  font-family: var(--font-ui);
}
.ig-post-mcq-opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.ig-post-mcq-opt:disabled { cursor: default; }
.ig-post-mcq-opt .opt-l {
  width: 24px; height: 24px; border-radius: 50%;
  border: 1.5px solid var(--border-color);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 800; flex-shrink: 0; color: var(--text-secondary);
}
.ig-post-mcq-opt.correct { border-color: #6abf85; background: rgba(106,191,133,0.08); }
.ig-post-mcq-opt.correct .opt-l { background: #6abf85; border-color: #6abf85; color: #0f0e0b; }
.ig-post-mcq-opt.wrong   { border-color: #c46a4e; background: rgba(196,106,78,0.07); }
.ig-post-mcq-opt.wrong   .opt-l { background: #c46a4e; border-color: #c46a4e; color: #fff; }
.ig-post-mcq-opt.reveal  { border-color: rgba(106,191,133,0.5); }
.ig-post-mcq-opt.reveal  .opt-l { border-color: #6abf85; color: #6abf85; }
.ig-post-mcq-result { font-size: 12.5px; font-weight: 700; margin-top: 8px; min-height: 16px; }
.ig-post-mcq-result.correct { color: #6abf85; }
.ig-post-mcq-result.wrong   { color: #c46a4e; }

.ig-post-textexcerpt {
  padding: 0 12px; margin-top: 2px; margin-bottom: 6px;
  font-size: 12.5px; line-height: 1.55; color: var(--text-secondary);
}

.comments-modal-overlay {
  position: fixed; inset: 0; z-index: 550;
  background: rgba(0,0,0,0.65); backdrop-filter: blur(5px);
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.comments-modal-overlay.open { display: flex; }
.comments-modal {
  width: 100%; max-width: 420px; height: min(72vh, 600px);
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 20px; box-shadow: 0 24px 64px rgba(0,0,0,0.75);
  animation: floatIn 0.22s cubic-bezier(0.34,1.26,0.64,1);
  display: flex; flex-direction: column; overflow: hidden;
}
.comments-modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 18px; border-bottom: 1px solid var(--border-color); flex-shrink: 0;
}
.comments-modal-title { font-size: 14px; font-weight: 800; color: var(--text-primary); }
.comments-modal-close {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--bg-color); border: 1px solid var(--border-color);
  color: var(--text-secondary); font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: color 0.15s, border-color 0.15s;
}
.comments-modal-close:hover { color: var(--accent); border-color: var(--accent); }
.comments-modal-list { flex: 1; overflow-y: auto; padding: 12px 18px; }
.comments-modal-list::-webkit-scrollbar { width: 2px; }
.comments-modal-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
.cm-comment-item { display: flex; gap: 10px; margin-bottom: 16px; }
.cm-comment-avatar {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
  background: linear-gradient(135deg, var(--accent), #8a6430);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #0f0e0b;
}
.cm-comment-avatar img { width: 100%; height: 100%; object-fit: cover; }
.cm-comment-body { flex: 1; min-width: 0; }
.cm-comment-author { font-weight: 700; font-size: 12px; color: var(--text-primary); margin-bottom: 3px; }
.cm-comment-text { font-size: 13px; line-height: 1.5; color: var(--text-primary); margin-bottom: 4px; }
.cm-comment-time { font-size: 10px; color: var(--text-secondary); }
.cm-comment-time.uploading { color: var(--accent); font-style: italic; }
.cm-comment-time.upload-error { color: #c46a4e; }
.cm-comments-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; color: var(--text-secondary); gap: 10px;
}
.cm-comments-empty i { font-size: 32px; opacity: 0.25; color: var(--accent); }
.cm-comments-empty p { font-size: 12.5px; margin: 0; text-align: center; }
.comments-modal-input-wrap {
  padding: 10px 14px; border-top: 1px solid var(--border-color); flex-shrink: 0;
}
.comments-modal-input-row { display: flex; gap: 8px; align-items: center; }
.comments-modal-input {
  flex: 1; background: var(--bg-color); border: 1px solid var(--border-color);
  border-radius: 20px; padding: 9px 14px; color: var(--text-primary);
  font-size: 16px; outline: none; transition: border-color 0.15s ease;
  font-family: var(--font-ui);
}
.comments-modal-input:focus { border-color: var(--accent); }
.comments-modal-send {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--accent); border: none; color: #0f0e0b;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 14px; transition: background 0.2s ease; flex-shrink: 0;
}
.comments-modal-send:hover { background: var(--accent-hover); }
.comments-modal-send:disabled { opacity: 0.4; cursor: not-allowed; }

.ig-post-audio-wrap { padding: 12px; }
.ig-post-audio-title { font-size: 13.5px; font-weight: 700; color: var(--text-primary); font-family: var(--font-article); margin-bottom: 10px; line-height: 1.35; }
.ig-post-audio-row { display: flex; align-items: center; gap: 11px; }
.ig-post-audio-play {
  width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
  background: var(--accent); border: none; color: #0f0e0b;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 13px; transition: background 0.15s;
}
.ig-post-audio-play:hover { background: var(--accent-hover); }
.ig-post-audio-wave { flex: 1; height: 24px; display: flex; align-items: center; gap: 2px; }
.ig-post-audio-bar { flex: 1; background: var(--border-color); border-radius: 2px; min-width: 2px; }

.creators-strip { display: flex; gap: 14px; overflow-x: auto; padding: 12px 12px 10px; scrollbar-width: none; align-items: flex-start; }
.creators-strip::-webkit-scrollbar { display: none; }
.strip-pill { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; flex-shrink: 0; width: 54px; transition: opacity 0.15s; }
.strip-pill:hover { opacity: 0.8; }
.creator-pill-circle {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--accent-soft); border: 2px solid var(--border-color);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700; color: var(--accent);
  overflow: hidden; flex-shrink: 0; transition: border-color 0.2s;
}
.strip-pill:hover .creator-pill-circle { border-color: var(--accent); }
.creator-pill-circle img { width: 100%; height: 100%; object-fit: cover; }
.strip-pill-name {
  font-size: 9px; font-weight: 600; color: var(--text-secondary);
  text-align: center; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; width: 100%;
}
.strip-skeleton-pill { display: flex; flex-direction: column; align-items: center; gap: 5px; flex-shrink: 0; width: 54px; }
.strip-skeleton-circle {
  width: 44px; height: 44px; border-radius: 50%;
  background: linear-gradient(90deg, var(--border-color) 25%, var(--hover-bg) 50%, var(--border-color) 75%);
  background-size: 400px 100%; animation: skelShimmer 1.4s ease infinite;
}
.strip-skeleton-label {
  width: 36px; height: 8px; border-radius: 4px;
  background: linear-gradient(90deg, var(--border-color) 25%, var(--hover-bg) 50%, var(--border-color) 75%);
  background-size: 400px 100%; animation: skelShimmer 1.4s ease infinite;
}

.create-strip-circle {
  background: var(--accent-soft) !important;
  border: 2px solid rgba(200,169,110,0.35) !important;
  color: var(--accent) !important; font-size: 17px !important;
}
.strip-pill:hover .create-strip-circle { border-color: var(--accent) !important; }

.ig-post-skeleton { padding-bottom: 6px; margin-bottom: 6px; }
.ig-skel-header { display: flex; align-items: center; gap: 11px; padding: 11px 12px; }
.ig-skel-avatar { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; }
.ig-skel-name { height: 11px; width: 110px; border-radius: 5px; }
.ig-skel-media { width: 100%; aspect-ratio: 1/1; }
.ig-skel-actions { display: flex; gap: 10px; padding: 10px 12px 4px; }
.ig-skel-icon { width: 24px; height: 24px; border-radius: 6px; }
.ig-skel-line { height: 11px; margin: 0 12px 8px; border-radius: 5px; }

.scroll-sentinel { height: 1px; width: 100%; }
.scroll-loader-wrap { text-align: center; padding: 16px 12px; display: none; }
.scroll-loader-wrap.active { display: block; }
.scroll-loader-spinner {
  width: 24px; height: 24px; margin: 0 auto;
  border: 2px solid var(--border-color); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.9s linear infinite;
}
.scroll-end-msg {
  text-align: center; padding: 24px 20px; color: var(--text-secondary);
  font-size: 12px; opacity: 0.6; display: none;
}
.scroll-end-msg.active { display: block; }

.create-menu-overlay {
  position: fixed; inset: 0; z-index: 399;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(3px);
  display: none; align-items: flex-end; justify-content: center;
}
.create-menu-overlay.open { display: flex; }
.create-menu-sheet {
  width: 100%; max-width: 450px;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-bottom: none;
  border-radius: 20px 20px 0 0;
  padding: 8px 16px calc(16px + env(safe-area-inset-bottom));
  animation: createSheetUp 0.25s cubic-bezier(0.4,0,0.2,1);
}
@keyframes createSheetUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.create-menu-handle { width: 36px; height: 4px; background: var(--border-color); border-radius: 2px; margin: 8px auto 14px; }
.create-menu-title { font-size: 13px; font-weight: 800; color: var(--text-primary); padding: 0 4px 12px; }
.create-menu-item {
  display: flex; align-items: center; gap: 13px;
  padding: 13px 10px; border-radius: 12px;
  cursor: pointer; transition: background 0.15s;
}
.create-menu-item:hover { background: var(--bg-color); }
.create-menu-icon {
  width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0;
  background: var(--accent-soft); border: 1px solid rgba(200,169,110,0.25);
  display: flex; align-items: center; justify-content: center;
  color: var(--accent); font-size: 16px;
}
.create-menu-text { flex: 1; }
.create-menu-item-title { font-size: 13.5px; font-weight: 700; color: var(--text-primary); margin-bottom: 1px; }
.create-menu-item-sub { font-size: 11px; color: var(--text-secondary); }
.create-menu-item i.chev { color: var(--text-secondary); font-size: 11px; }

@media (min-width: 820px) {
  .create-menu-overlay { align-items: center; }
  .create-menu-sheet {
    max-width: 380px; border-radius: 18px; border-bottom: 1px solid var(--border-color);
    padding-bottom: 16px; animation: createSheetPop 0.2s cubic-bezier(0.34,1.26,0.64,1);
  }
  @keyframes createSheetPop { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
}

.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px);
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 14px; padding: 10px 18px;
  font-size: 13px; font-weight: 700; color: var(--text-primary);
  z-index: 9999; opacity: 0;
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none; white-space: nowrap;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.heart-burst {
  position: fixed; pointer-events: none; z-index: 9999;
  transform: translate(-50%, -50%);
  animation: heartBurstAnim 0.65s cubic-bezier(0.16,1,0.3,1) forwards;
}
.heart-burst svg { width: 70px; height: 70px; filter: drop-shadow(0 0 10px rgba(200,169,110,0.5)); }
@keyframes heartBurstAnim {
  0%  {opacity:0; transform:translate(-50%,-50%) scale(0.3);}
  30% {opacity:1; transform:translate(-50%,-50%) scale(1.2);}
  55% {transform:translate(-50%,-50%) scale(0.95);}
  80% {opacity:0.85; transform:translate(-50%,-50%) scale(1.05);}
  100%{opacity:0; transform:translate(-50%,-56%) scale(0.85);}
}

.footer-bar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 450px;
  background: #0f0e0b; border-top: 1px solid #2a2518;

<script>
(function(){
  const THEMES=['theme-dark','theme-light'];
  const FONTS = ['font-serif','font-slab','font-modern'];
  function applyTheme(val){
    THEMES.forEach(t=>document.body.classList.remove(t));
    document.body.classList.add(val);
    localStorage.setItem('pref_theme', val);
  }
  function applyFont(val){
    FONTS.forEach(f=>document.body.classList.remove(f));
    document.body.classList.add(val);
    localStorage.setItem('pref_fontfam', val);
  }
  function syncPills(){
    const curT = THEMES.find(t=>document.body.classList.contains(t))||'theme-dark';
    const curF = FONTS.find(f=>document.body.classList.contains(f))||'font-modern';
    document.querySelectorAll('#sp-themes [data-val]').forEach(b=>b.classList.toggle('active',b.dataset.val===curT));
    document.querySelectorAll('#sp-fonts [data-val]').forEach(b=>b.classList.toggle('active',b.dataset.val===curF));
  }
  document.getElementById('sp-themes').addEventListener('click',e=>{
    const b=e.target.closest('[data-val]');if(!b)return;applyTheme(b.dataset.val);syncPills();
  });
  document.getElementById('sp-fonts').addEventListener('click',e=>{
    const b=e.target.closest('[data-val]');if(!b)return;applyFont(b.dataset.val);syncPills();
  });
  let _open=false;
  window.closeSettings=function(){
    document.getElementById('settingsPopover').classList.remove('open');
    _open=false;
  };
  window.handleHeaderSettings=function(btn){
    const pop=document.getElementById('settingsPopover');
    _open=!_open;
    if(_open){
      document.getElementById('notifPanel').classList.remove('open');
      document.getElementById('savedPanel').classList.remove('open');
      const r=btn.getBoundingClientRect();
      pop.style.top=(r.bottom+8)+'px';
      let left=r.right-230;
      if(left<8) left=8;
      pop.style.left=left+'px';
      pop.style.right='auto';
      pop.classList.add('open');
      syncPills();
      setTimeout(()=>document.addEventListener('click',function oc(e){
        if(!pop.contains(e.target)&&!btn.contains(e.target)){
          pop.classList.remove('open');_open=false;
        }
        document.removeEventListener('click',oc);
      },10));
    } else {
      pop.classList.remove('open');
    }
  };
  document.addEventListener('DOMContentLoaded',syncPills);
})();
</script>

<script>
window._isLoggedIn = false;

const COMMUNITY_NOTIFS = [
  {
    id:'__discord__', cls:'discord', icon:'fa-brands fa-discord',
    msg:'🎉 Join our early community on Discord — be among the first members!',
    time:'Patholytica Community',
    target:'https://discord.gg/cx6cWF4KTf'
  },
  {
    id:'__insta__', cls:'insta', icon:'fa-brands fa-instagram',
    msg:'📸 Follow us on Instagram @patholytica for updates and highlights.',
    time:'Patholytica Community',
    target:'https://www.instagram.com/patholytica'
  }
];

function communityNotifsHTML(){
  return COMMUNITY_NOTIFS.map(n=>`
    <div class="notif-item" data-target="${n.target}" onclick="window.open('${n.target}','_blank')">
      <div class="notif-icon ${n.cls}"><i class="fas ${n.icon}"></i></div>
      <div class="notif-text">
        <div class="notif-msg">${n.msg}</div>
        <div class="notif-time">${n.time}</div>
      </div>
      <i class="fas fa-external-link-alt" style="font-size:9px;color:var(--text-secondary);flex-shrink:0;margin-top:2px;"></i>
    </div>`).join('');
}

window.handleHeaderBell = function(btn){
  const panel = document.getElementById('notifPanel');
  const isOpen = panel.classList.contains('open');
  window.closeSettings();
  document.getElementById('savedPanel').classList.remove('open');
  if(isOpen){ panel.classList.remove('open'); return; }
  if(!window._isLoggedIn){
    document.getElementById('notifList').innerHTML = communityNotifsHTML() + `
      <div class="notif-empty">
        <i class="fas fa-bell"></i>
        <p>Log in to see your notifications</p>
        <a href="login.html">Log in</a>
      </div>`;
    positionPanel(panel, btn);
    return;
  }
  positionPanel(panel, btn);
  if(window._supabaseNotifLoader) window._supabaseNotifLoader();
};

function positionPanel(panel, anchor){
  const r = anchor.getBoundingClientRect();
  panel.style.top = (r.bottom + 8) + 'px';
  let left = r.right - 310;
  if(left < 8) left = 8;
  panel.style.left = left + 'px';
  panel.style.right = 'auto';
  panel.classList.add('open');
  setTimeout(()=>document.addEventListener('click', function oc(e){
    if(!panel.contains(e.target) && !anchor.contains(e.target)){
      panel.classList.remove('open');
    }
    document.removeEventListener('click', oc);
  }, 10));
}
</script>

<script>
const LS_SAVED_KEY = 'patholytica_saved_libs';
function getSavedLibs(){
  try{ const raw=JSON.parse(localStorage.getItem(LS_SAVED_KEY)||'[]'); return Array.isArray(raw)?raw:[]; }catch(e){ return []; }
}
function setSavedLibs(list){
  try{ localStorage.setItem(LS_SAVED_KEY, JSON.stringify(list)); }catch(e){}
}
function isLibSaved(id){ return getSavedLibs().some(l=>String(l.id)===String(id)); }
function addSavedLib(lib){
  const list=getSavedLibs().filter(l=>String(l.id)!==String(lib.id));
  list.unshift({ id:lib.id, name:lib.name||'Untitled Library', thumbnail_url:lib.thumbnail_url||null, _count:lib._count||0, saved_at:Date.now() });
  setSavedLibs(list);
}
function removeSavedLib(id){ setSavedLibs(getSavedLibs().filter(l=>String(l.id)!==String(id))); }

window.handleBookmarkBtn = function(btn){
  const panel = document.getElementById('savedPanel');
  const isOpen = panel.classList.contains('open');
  window.closeSettings();
  document.getElementById('notifPanel').classList.remove('open');
  if(isOpen){ panel.classList.remove('open'); return; }
  const r = btn.getBoundingClientRect();
  panel.style.top  = (r.bottom + 8) + 'px';
  let left = r.right - 320;
  if(left < 8) left = 8;
  panel.style.left  = left + 'px';
  panel.style.right = 'auto';
  panel.classList.add('open');
  setTimeout(()=>document.addEventListener('click', function oc(e){
    if(!panel.contains(e.target) && !btn.contains(e.target)){ panel.classList.remove('open'); }
    document.removeEventListener('click', oc);
  }, 10));
  renderSavedPanel();
};

function renderSavedPanel(){
  const list = document.getElementById('savedList');
  const libs = getSavedLibs();
  if(!libs.length){
    list.innerHTML=`<div class="saved-empty"><i class="fas fa-bookmark"></i><p>No saved libraries yet</p></div>`;
    return;
  }
  list.innerHTML = libs.map(lib=>{
    const cnt = lib._count||0;
    const thumb = lib.thumbnail_url
      ? `<img src="${esc(lib.thumbnail_url)}" alt="">`
      : `<i class="fas fa-layer-group"></i>`;
    return `<div class="saved-item" data-id="${esc(String(lib.id))}">
      <div class="saved-item-thumb" onclick="window.openCardPreview('library','${esc(String(lib.id))}');document.getElementById('savedPanel').classList.remove('open');">${thumb}</div>
      <div class="saved-item-info" onclick="window.openCardPreview('library','${esc(String(lib.id))}');document.getElementById('savedPanel').classList.remove('open');">
        <div class="saved-item-name">${esc(lib.name||'Untitled')}</div>
        <div class="saved-item-meta">${cnt} article${cnt!==1?'s':''}</div>
      </div>
      <button class="saved-item-remove" title="Remove" onclick="window._removeSavedFromPanel(event,'${esc(String(lib.id))}')">
        <i class="fas fa-times"></i>
      </button>
    </div>`;
  }).join('');
}

window._removeSavedFromPanel = function(e, id){
  e.stopPropagation();
  removeSavedLib(id);
  if(typeof userFavouritesLocalSync==='function') userFavouritesLocalSync();
  renderSavedPanel();
  showToast('Removed from saved');
  if(typeof window._refreshLibraryBadges==='function') window._refreshLibraryBadges();
};

function shuffleArray(arr){ const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; }

function weightedScore(item){
  const v=item.views||0, l=item.likes||0;
  return Math.log(v+1)*2 + Math.log(l+1)*3 + Math.random()*4;
}
function weightedShuffle(arr){
  const scored=arr.map(item=>({item,score:weightedScore(item)}));
  scored.sort((a,b)=>b.score-a.score);
  for(let i=0;i<scored.length-1;i+=2){ if(Math.random()<0.25)[scored[i],scored[i+1]]=[scored[i+1],scored[i]]; }
  return scored.map(s=>s.item);
}

function buildFollowBtnHTML(article){

window._handleFollowHome = async function(e,aFbUid,aSupaId){
  e.stopPropagation();
  if(!currentSupaUser){ location.href='login.html'; return; }
  const btn=e.currentTarget;
  if(btn.dataset.processing==='true')return; btn.dataset.processing='true';
  const supaUid=String(aSupaId);
  const wasFollowing=userFollowingHome.has(supaUid);
  if(wasFollowing) userFollowingHome.delete(supaUid); else userFollowingHome.add(supaUid);
  document.querySelectorAll(`.ig-post-follow-pill[data-supa-uid="${supaUid}"]`).forEach(b=>{
    b.classList.toggle('following',!wasFollowing);
    b.textContent = !wasFollowing ? 'Following' : 'Follow';
  });
  try{
    if(wasFollowing){
      const{error}=await supabase.rpc('unfollow_user',{p_author_id:parseInt(aSupaId),p_firebase_uid:currentSupaUser.firebase_uid});
      if(error)throw error;
    }else{
      const{error}=await supabase.rpc('follow_user',{p_author_id:parseInt(aSupaId),p_firebase_uid:currentSupaUser.firebase_uid});
      if(error)throw error;
    }
  }catch(err){
    if(wasFollowing) userFollowingHome.add(supaUid); else userFollowingHome.delete(supaUid);
    document.querySelectorAll(`.ig-post-follow-pill[data-supa-uid="${supaUid}"]`).forEach(b=>{
      const stillFollowing=userFollowingHome.has(supaUid);

async function handleFeedLike(btn){
  const id=String(btn.dataset.id);
  if(!currentSupaUser){ location.href='login.html'; return; }
  const wasLiked=userLikesHome.has(id);
  const countEl=btn.querySelector('[data-role="like-count"]');
  const prevCount=parseInt(btn.dataset.count||'0');
  const newCount=wasLiked?Math.max(0,prevCount-1):prevCount+1;
  btn.dataset.count=newCount;
  if(wasLiked){userLikesHome.delete(id);btn.classList.remove('liked');}
  else{userLikesHome.add(id);btn.classList.add('liked');}
  if(countEl) countEl.textContent = fmtNum(newCount);
  try{
    if(wasLiked){
      const{error}=await supabase.rpc('unlike_article',{p_article_id:parseInt(id),p_firebase_uid:currentSupaUser.firebase_uid});
      if(error)throw error;
    }else{
      const{error}=await supabase.rpc('like_article',{p_article_id:parseInt(id),p_firebase_uid:currentSupaUser.firebase_uid});
      if(error)throw error;
    }
  }catch(e){
    if(wasLiked){userLikesHome.add(id);btn.classList.add('liked');}
    else{userLikesHome.delete(id);btn.classList.remove('liked');}
    btn.dataset.count=prevCount;
    if(countEl) countEl.textContent = fmtNum(prevCount);
  }
}
window._handleFeedLike = handleFeedLike;

/* Item 2: double-tap-to-heart never fires over a YouTube embed — the
   video needs real taps to reach its own player (play/pause/seek),
   not to be swallowed by the heart gesture. Guards here defensively;
   the carousel's own per-slide handler (added for Item 3) applies the
   same exclusion at the slide level, since a single post can carry
   both image and YouTube slides once the carousel is in place. */
function setupDoubleTapLike(mediaEl,likeBtn){
  let lastTap=0;
  mediaEl.addEventListener('click',function(e){
    if(e.target.closest('.ig-post-yt-wrap')) return;
    const now=Date.now();
    if(now-lastTap<320){
      if(!likeBtn.classList.contains('liked')) handleFeedLike(likeBtn);
      window.spawnHeartBurst(e.clientX,e.clientY);
      e.preventDefault();
    }
    lastTap=now;
  });
}

async function loadCreators(){
  const strip = document.getElementById('creatorsStrip');
  try{
    const{data:arts}=await supabase.from('articles').select('firebase_user_id');
    if(!arts) return;
    const counts={};
    arts.forEach(a=>{if(a.firebase_user_id)counts[a.firebase_user_id]=(counts[a.firebase_user_id]||0)+1;});
    const topUids=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([u])=>u);
    if(!topUids.length){ strip.querySelectorAll('[id^="creatorSkel"]').forEach(el=>el.remove()); return; }
    const{data:users}=await supabase.from('users').select('firebase_uid,username,full_name,pfp').in('firebase_uid',topUids);
    const um={};(users||[]).forEach(u=>{um[u.firebase_uid]=u;});
    strip.querySelectorAll('[id^="creatorSkel"]').forEach(el=>el.remove());
    topUids.forEach(uid=>{
      const u=um[uid];
      const name=u?.username?'@'+u.username:(u?.full_name||'?');
      const init=(name.replace(/^@/,'')||'?')[0].toUpperCase();
      const pill=document.createElement('div');
      pill.className='strip-pill creator-strip-pill';
      pill.innerHTML=`
        <div class="creator-pill-circle">${u?.pfp?`<img src="${esc(u.pfp)}" alt="${init}">`:`${init}`}</div>

      strip.appendChild(pill);
    });
  }catch(e){
    strip.querySelectorAll('[id^="creatorSkel"]').forEach(el=>el.remove());
  }
}

window._shareHomeArticle=function(articleId,title){
