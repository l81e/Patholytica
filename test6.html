const _lpSelected=new Set();

async function loadPickerLibraries(body,footer,hint){
   try{
       const{data:libs}=await supabase.from('playlists').select('id,name,description,thumbnail_url').order('name',{ascending:true});
       const{data:countRows}=await supabase.from('playlist_items').select('playlist_id');
       const countMap={};(countRows||[]).forEach(r=>{countMap[r.playlist_id]=(countMap[r.playlist_id]||0)+1;});
       const filteredLibs=(libs||[]).filter(l=>(countMap[l.id]||0)>0);
       if(!filteredLibs.length){body.innerHTML=`<div style="padding:30px 18px;font-size:12px;color:var(--text-secondary);">No libraries yet</div>`;return;}

       const favedLibs=filteredLibs.filter(l=>userFavLibs.has(String(l.id))).sort((a,b)=>(countMap[b.id]||0)-(countMap[a.id]||0));
       const otherLibs=filteredLibs.filter(l=>!userFavLibs.has(String(l.id))).sort((a,b)=>(countMap[b.id]||0)-(countMap[a.id]||0));

       body.innerHTML='';

       function addShelf(label,libs2){
           const lbl=document.createElement('div');lbl.className='lp-section-label';
           lbl.innerHTML=`<i class="fas fa-book-open"></i>${label}`;
           body.appendChild(lbl);
           const shelfWrap=document.createElement('div');shelfWrap.className='lp-shelf-wrap';
           const shelf=document.createElement('div');shelf.className='lp-shelf';
           libs2.forEach(lib=>shelf.appendChild(makeMovieCard(lib,countMap[lib.id]||0)));
           shelfWrap.appendChild(shelf);body.appendChild(shelfWrap);
       }

       if(favedLibs.length)addShelf('Saved',favedLibs);
       addShelf(favedLibs.length?'All Libraries':'Libraries',otherLibs);
   }catch(e){console.error(e);body.innerHTML=`<div style="padding:20px;font-size:12px;color:var(--text-secondary);">Failed to load</div>`;}
}

function makeMovieCard(lib,count){
   const card=document.createElement('div');
   card.className='lp-movie-card';card.dataset.id=lib.id;
   const letter=(lib.name||'?')[0].toUpperCase();
   const poster=lib.thumbnail_url
       ?`<img src="${lib.thumbnail_url}" alt="${lib.name||''}" loading="lazy">`
       :`<div class="lp-poster-placeholder"><div class="lp-poster-letter">${letter}</div><div class="lp-poster-icon"><i class="fas fa-book-open"></i></div></div>`;
   card.innerHTML=`
       <div class="lp-movie-poster">
           ${poster}
           <div class="lp-movie-overlay">
               <div class="lp-movie-count"><i class="fas fa-layer-group"></i> ${count}</div>
           </div>
           <div class="lp-selected-badge">✓</div>
       </div>
       <div class="lp-movie-info">
           <div class="lp-movie-title">${lib.name||'Untitled'}</div>
           <div class="lp-movie-meta">${count} article${count!==1?'s':''}</div>
       </div>`;

   card.addEventListener('click',()=>{
       const id=String(lib.id);
       if(_lpSelected.has(id)){_lpSelected.delete(id);card.classList.remove('selected');}
       else{if(_lpSelected.size>=5)return;_lpSelected.add(id);card.classList.add('selected');}
       const footer=document.getElementById('lpActionFooter');
       const hint=document.getElementById('lpScrollHint');
       const selLabel=document.getElementById('lpSelLabel');
       const n=_lpSelected.size;
       if(n>0){
           footer?.classList.add('visible');
           if(hint)hint.style.display='none';
           if(selLabel)selLabel.textContent=`(${n} selected)`;
       } else {
           footer?.classList.remove('visible');
           if(hint)hint.style.display='';
           if(selLabel)selLabel.textContent='';
       }
   });
   return card;
}

window.lpStartFeedAll=function(){
   filteredArticleIds=null;
   animatePickerOut(()=>{articles=[];offset=0;hasMore=true;isLoading=false;clearSkeletons();loadArticles(true);});
};
window.lpStartFeedSelected=async function(){
   if(!_lpSelected.size)return;
   const btn=document.getElementById('lpBeginBtn');
   if(btn){btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Loading…';btn.disabled=true;}
   const ids=[..._lpSelected].map(Number);
   const{data:items}=await supabase.from('playlist_items').select('article_id').in('playlist_id',ids);
   const articleIds=[...new Set((items||[]).map(r=>r.article_id))];
   filteredArticleIds=articleIds.length?articleIds:null;
   animatePickerOut(()=>{articles=[];offset=0;hasMore=true;isLoading=false;clearSkeletons();loadArticles(true);});
};

function animatePickerOut(cb){
   const p=document.getElementById('libraryPickerCard');if(!p){cb();return;}
   p.classList.add('exiting');
   p.addEventListener('animationend',()=>{
       const sk=document.createElement('div');sk.className='skeleton-card';sk.innerHTML=skeletonCardHTML();
       p.replaceWith(sk);cb();
   },{once:true});
}
function clearSkeletons(){document.querySelectorAll('.skeleton-card').forEach(s=>s.remove());}

// ── Article loading
async function loadArticles(isInitial=true){
   if(isLoading||(!isInitial&&!hasMore))return;isLoading=true;
   try{
       if(isInitial&&anchorArticleId!==null){
           const{data:anchor,error}=await supabase.from('articles').select('*').eq('id',anchorArticleId).single();
           if(!error&&anchor){
               const{data:rest}=await supabase.from('articles').select('*').order('created_at',{ascending:false}).lt('created_at',anchor.created_at).limit(LIMIT-1);
               await enrichAndRender([anchor,...(rest||[])],isInitial);offset=LIMIT;isLoading=false;return;
           }
           anchorArticleId=null;
       }
       let query=supabase.from('articles').select('*').order('created_at',{ascending:false}).range(offset,offset+LIMIT-1);
       if(filteredArticleIds!==null){
           if(!filteredArticleIds.length){clearSkeletons();isLoading=false;return;}
           query=query.in('id',filteredArticleIds);
       }
       const{data:data2,error}=await query;
       if(error)throw error;
       if(!data2?.length){clearSkeletons();hasMore=false;isLoading=false;return;}
       if(data2.length<LIMIT)hasMore=false;
       offset+=data2.length;
       await enrichAndRender(data2,isInitial);
       isLoading=false;
   }catch(e){console.error(e);clearSkeletons();isLoading=false;}
}

async function enrichAndRender(data2,isInitial){
   const uids=[...new Set(data2.map(a=>a.firebase_user_id).filter(Boolean))];
   let usersData=[];
   if(uids.length){const{data:u}=await supabase.from('users').select('firebase_uid,username,full_name,pfp,user_id').in('firebase_uid',uids);usersData=u||[];}
   const artIds=data2.map(a=>a.id);
   const{data:mediaData}=await supabase.from('media').select('*').in('article_id',artIds).order('display_order',{ascending:true});
   const newArts=data2.map(a=>{
       const u=usersData.find(x=>x.firebase_uid===a.firebase_user_id);
       return{...a,author:u?.username?`@${u.username}`:(u?.full_name||'Anonymous'),authorPfp:u?.pfp||null,authorUsername:u?.username||null,authorSupaUserId:u?.user_id||null,media:(mediaData||[]).filter(m=>m.article_id===a.id)};
   });
   articles=[...articles,...newArts];
   renderArticles(isInitial);
}

function renderArticles(isInitial=true){
   const wrapper=document.getElementById('postsWrapper');
   if(isInitial){clearSkeletons();wrapper.querySelectorAll('.article-card,.mcq-card').forEach(c=>c.remove());}
   else{const last=wrapper.lastElementChild;if(last?.classList.contains('skeleton-card'))last.remove();}
   const startIndex=isInitial?0:articles.length-LIMIT;
   for(let i=startIndex;i<articles.length;i++){
       const a=articles[i];
       const card=isMCQ(a.content)?buildMCQCard(a,i):buildArticleCard(a,i);
       wrapper.appendChild(card);
       attachCardListeners(card,a);
   }
   if(hasMore){const sk=document.createElement('div');sk.className='skeleton-card';sk.innerHTML=skeletonCardHTML();wrapper.appendChild(sk);}
   if(isInitial){wrapper.addEventListener('scroll',handleScroll);loadCommentCounts();setupIntersectionObserver();}
   else{loadCommentCounts();}
}

// ── Like
async function handleLike(e){
   const btn=e.currentTarget,id=String(btn.dataset.id);
   const countSpan=btn.querySelector('.like-count');
   if(!currentUser){location.href='https://patholytica.com/login';return;}
   if(btn.dataset.processing==='true')return;btn.dataset.processing='true';
   const ud=window._currentUserData;if(!ud)return;
   const wasLiked=userLikes.has(id);
   const artIdx=articles.findIndex(a=>String(a.id)===id);
   const prevCount=artIdx!==-1?(articles[artIdx].likes||0):0;
   const newCount=wasLiked?Math.max(0,prevCount-1):prevCount+1;
   if(wasLiked){userLikes.delete(id);btn.classList.remove('liked');}
   else{userLikes.add(id);btn.classList.add('liked');}
   countSpan.textContent=formatNumber(newCount);
   if(artIdx!==-1)articles[artIdx].likes=newCount;
   // update stat
   const card=btn.closest('.article-card,.mcq-card');
   if(card){const s=card.querySelector('.stat-item.likes span');if(s)s.textContent=formatNumber(newCount);}
   try{
       await ensureSupabaseAuth();
       if(wasLiked){
           await supabase.from('likes').delete().eq('article_id',parseInt(id)).eq('user_id',ud.user_id);
           await supabase.rpc('decrement_likes',{article_id:parseInt(id)}).catch(async()=>{
               const{data:f}=await supabase.from('articles').select('likes').eq('id',id).single();
               await supabase.from('articles').update({likes:Math.max(0,(f?.likes||1)-1)}).eq('id',id);
           });
       } else {
           await supabase.from('likes').insert([{article_id:parseInt(id),user_id:ud.user_id}]).then(()=>{}).catch(()=>{});
           await supabase.rpc('increment_likes',{article_id:parseInt(id)}).catch(async()=>{
               const{data:f}=await supabase.from('articles').select('likes').eq('id',id).single();
               await supabase.from('articles').update({likes:(f?.likes||0)+1}).eq('id',id);
           });
       }
   }catch(err){
       if(wasLiked){userLikes.add(id);btn.classList.add('liked');}else{userLikes.delete(id);btn.classList.remove('liked');}
       countSpan.textContent=formatNumber(prevCount);
       if(artIdx!==-1)articles[artIdx].likes=prevCount;
   }finally{btn.dataset.processing='false';}
}

// ── Follow
window.handleFollow=async function(e,aFbUid,aSupaId){
   e.stopPropagation();
   if(!currentUser){location.href='https://patholytica.com/login';return;}
   const btn=e.currentTarget;if(btn.dataset.processing==='true')return;btn.dataset.processing='true';
   const ud=window._currentUserData;if(!ud)return;
   const supaUid=String(aSupaId),wasFollowing=userFollowing.has(supaUid);
   if(wasFollowing)userFollowing.delete(supaUid);else userFollowing.add(supaUid);
   updateFollowButtons();
   if(!wasFollowing){setTimeout(()=>{btn.classList.add('ringing');btn.addEventListener('animationend',()=>btn.classList.remove('ringing'),{once:true});},260);}
   try{
       await ensureSupabaseAuth();
       if(wasFollowing)await supabase.from('subscriptions').delete().eq('subscriber_id',ud.user_id).eq('author_id',parseInt(aSupaId));
       else await supabase.from('subscriptions').insert([{subscriber_id:ud.user_id,author_id:parseInt(aSupaId)}]);
   }catch(err){
       if(wasFollowing)userFollowing.add(supaUid);else userFollowing.delete(supaUid);updateFollowButtons();
   }finally{btn.dataset.processing='false';}
};

// ── Views
function setupIntersectionObserver(){
   const obs=new IntersectionObserver(entries=>{entries.forEach(entry=>{const id=entry.target.dataset.articleId;if(!id)return;if(entry.isIntersecting&&entry.intersectionRatio>=0.75)startViewTimer(id);else clearViewTimer(id);});},{threshold:[0.75]});
   document.querySelectorAll('.article-card,.mcq-card').forEach(c=>{if(c.dataset.articleId)obs.observe(c);});
}
function startViewTimer(id){if(viewedArticles.has(id)||viewTimers[id])return;viewTimers[id]=setTimeout(async()=>await incrementView(id),5000);}
function clearViewTimer(id){if(viewTimers[id]){clearTimeout(viewTimers[id]);delete viewTimers[id];}}
async function incrementView(id){
   if(viewedArticles.has(id))return;viewedArticles.add(id);
   try{
       const{data:a}=await supabase.from('articles').select('views').eq('id',id).single();
       const nv=(a?.views||0)+1;
       await supabase.from('articles').update({views:nv}).eq('id',id);
       const idx=articles.findIndex(x=>x.id===id);if(idx!==-1)articles[idx].views=nv;
       const card=document.querySelector(`.article-card[data-article-id="${id}"],.mcq-card[data-article-id="${id}"]`);
       if(card){const s=card.querySelector('.stat-item.views span');if(s)s.textContent=formatNumber(nv);}
   }catch(e){viewedArticles.delete(id);}
}

// ── Comments
async function loadCommentCounts(){
   try{
       const{data}=await supabase.from('comments').select('article_id');
       const counts={};(data||[]).forEach(c=>{counts[c.article_id]=(counts[c.article_id]||0)+1;});
       document.querySelectorAll('.comment-btn').forEach(btn=>{btn.querySelector('.comment-count').textContent=counts[btn.dataset.id]||0;});
   }catch(e){}
}
async function handleComments(e){currentArticleId=e.currentTarget.dataset.id;await loadComments(currentArticleId);openComments();}
async function loadComments(articleId){
   const list=document.getElementById('commentsList');
   list.innerHTML='<div class="loading-container"><div class="spinner" style="width:28px;height:28px;border-width:2px;"></div></div>';
   try{
       const{data:comments}=await supabase.from('comments').select('*').eq('article_id',articleId).order('created_at',{ascending:true});
       if(!comments?.length){list.innerHTML=`<div class="no-comments"><i class="fas fa-comments"></i><div>No comments yet</div></div>`;return;}
       const uids=[...new Set(comments.map(c=>c.user_id).filter(Boolean))];let usersMap={};
       if(uids.length){const{data:users}=await supabase.from('users').select('user_id,username,full_name,pfp').in('user_id',uids);if(users)users.forEach(u=>{usersMap[u.user_id]=u;});}
       list.innerHTML=comments.map(c=>{const u=usersMap[c.user_id],author=u?.username?`@${u.username}`:(u?.full_name||'Anonymous');const av=u?.pfp?`<img src="${u.pfp}">`:(u?.username||'A')[0].toUpperCase();return`<div class="comment-item"><div class="comment-avatar">${av}</div><div class="comment-content"><div class="comment-author">${author}</div><div class="comment-text">${renderEmojiText(c.comment_text)}</div><div class="comment-time">${formatDate(new Date(c.created_at))}</div></div></div>`;}).join('');
   }catch(e){list.innerHTML=`<div class="no-comments"><i class="fas fa-exclamation-triangle"></i><div>Failed to load</div></div>`;}
}
window.openComments=()=>{document.getElementById('commentsPopup').classList.add('active');document.getElementById('commentsOverlay').classList.add('active');};
window.closeComments=()=>{document.getElementById('commentsPopup').classList.remove('active');document.getElementById('commentsOverlay').classList.remove('active');};
window.sendComment=async function(){
   const input=document.getElementById('commentInput'),text=input.value.trim();
   if(!text||!currentArticleId||!currentUser)return;
   const ud=window._currentUserData;if(!ud)return;
   const btn=document.getElementById('sendCommentBtn');btn.disabled=true;
   try{
       await ensureSupabaseAuth();
       await supabase.from('comments').insert([{article_id:parseInt(currentArticleId),user_id:ud.user_id,comment_text:text}]);
       input.value='';await loadComments(currentArticleId);
       const cb=document.querySelector(`.comment-btn[data-id="${currentArticleId}"]`);
       if(cb){const cs=cb.querySelector('.comment-count');cs.textContent=parseInt(cs.textContent)+1;}
   }catch(e){}finally{btn.disabled=false;}
};
document.getElementById('commentInput').addEventListener('keypress',e=>{if(e.key==='Enter')window.sendComment();});

function handleScroll(e){const c=e.target;if(c.scrollTop+c.clientHeight>=c.scrollHeight*0.8&&hasMore&&!isLoading)loadArticles(false);}

// ── Expose for reRenderCard
window.articles=articles;
window.isMCQ=isMCQ;
window.buildMCQCard=buildMCQCard;
window.buildArticleCard=buildArticleCard;
window.attachCardListeners=attachCardListeners;

// ── Init
initLibraryPicker();
