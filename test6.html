<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
   <title>Article Scroller - Patholytica</title>
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
   <style>

/* ══════════════════════════════════════════════
   CSS VARIABLES — THEMES
══════════════════════════════════════════════ */
:root {
   --bg-color: #0f0e0b;
   --text-primary: #f5f0e8;
   --text-secondary: #8a8070;
   --card-bg: #0f0e0b;
   --hover-bg: #1a1810;
   --border-color: #2a2518;
   --accent: #c8a96e;
   --accent-hover: #b8935a;
   --accent-glow: rgba(200,169,110,0.25);
   --accent-soft: rgba(200,169,110,0.12);
   --font-content: "DM Sans", -apple-system, sans-serif;
   --font-heading: "Merriweather", Georgia, serif;
   --content-size: 14px;
}

/* Absolute Dark */
body.theme-absolute-dark {
   --bg-color: #000000;
   --text-primary: #e8e8e8;
   --text-secondary: #666666;
   --card-bg: #000000;
   --hover-bg: #111111;
   --border-color: #222222;
   --accent: #c8a96e;
   --accent-hover: #b8935a;
   --accent-glow: rgba(200,169,110,0.2);
   --accent-soft: rgba(200,169,110,0.10);
}

/* Absolute Light */
body.theme-absolute-light {
   --bg-color: #ffffff;
   --text-primary: #111111;
   --text-secondary: #666666;
   --card-bg: #ffffff;
   --hover-bg: #f5f5f5;
   --border-color: #dddddd;
   --accent: #8a6020;
   --accent-hover: #6a4010;
   --accent-glow: rgba(138,96,32,0.18);
   --accent-soft: rgba(138,96,32,0.08);
}

/* Sepia */
body.theme-sepia {
   --bg-color: #f4ede0;
   --text-primary: #2c1f0e;
   --text-secondary: #7a6040;
   --card-bg: #f4ede0;
   --hover-bg: #ede3d0;
   --border-color: #d8c8a8;
   --accent: #8a5a20;
   --accent-hover: #6a4010;
   --accent-glow: rgba(138,90,32,0.2);
   --accent-soft: rgba(138,90,32,0.10);
}

/* Midnight Blue */
body.theme-midnight {
   --bg-color: #0a0f1e;
   --text-primary: #e8edf5;
   --text-secondary: #6070a0;
   --card-bg: #0a0f1e;
   --hover-bg: #111828;
   --border-color: #1e2840;
   --accent: #6090d0;
   --accent-hover: #4070b0;
   --accent-glow: rgba(96,144,208,0.25);
   --accent-soft: rgba(96,144,208,0.12);
}

/* Champagne (default) already in :root above */

* { margin:0; padding:0; box-sizing:border-box; }

body {
   font-family: var(--font-content);
   background: var(--bg-color);
   color: var(--text-primary);
   overflow: hidden;
   transition: background 0.25s, color 0.25s;
   position: fixed;
   width: 100%;
   height: 100%;
}

/* ── FONT VARIANTS ── */
body.font-merriweather .article-content,
body.font-merriweather .mcq-question { font-family: 'Merriweather', Georgia, serif; font-size: 13px; line-height: 1.8; }

body.font-serif .article-content,
body.font-serif .mcq-question { font-family: 'Noto Serif', Georgia, serif; font-size: 13px; line-height: 1.8; }

body.font-mono .article-content,
body.font-mono .mcq-question { font-family: 'Source Code Pro', monospace; font-size: 12px; line-height: 1.7; }

body.font-arabic .article-content,
body.font-arabic .mcq-question { font-family: 'Noto Naskh Arabic', serif; font-size: 15px; line-height: 2.0; }

/* ── CONTENT SIZE ── */
body.size-sm .article-content  { font-size: 12px !important; }
body.size-sm .mcq-question     { font-size: 16px !important; }
body.size-lg .article-content  { font-size: 16px !important; }
body.size-lg .mcq-question     { font-size: 21px !important; }
body.size-xl .article-content  { font-size: 18px !important; }
body.size-xl .mcq-question     { font-size: 23px !important; }

/* ── ARABIC RTL paragraphs ── */
.rtl-para {
   direction: rtl;
   text-align: right;
   font-family: 'Noto Naskh Arabic', serif;
   font-size: 15px;
   line-height: 2.0;
}

/* ══════════════════════════════════════════════
   LAYOUT
══════════════════════════════════════════════ */
.app-container {
   position: fixed;
   top: 0;
   left: 50%;
   transform: translateX(-50%);
   width: 100%;
   max-width: 450px;
   height: 100vh;
   background: var(--bg-color);
}

/* Desktop layout */
@media (min-width: 769px) {
   body { overflow: hidden; }
   .app-container {
       max-width: 100%;
       display: flex;
       flex-direction: row;
       gap: 0;
   }
   .scroller-container { flex: 0 0 520px; max-width: 520px; }
   .desktop-sidebar {
       display: flex !important;
       flex: 1;
       flex-direction: column;
       padding: 28px 24px;
       border-left: 1px solid var(--border-color);
       overflow-y: auto;
       max-width: 320px;
   }
}

.desktop-sidebar {
   display: none;
}

.scroller-container {
   position: relative;
   width: 100%;
   height: 100vh;
   background: var(--bg-color);
   overflow: hidden;
}

.posts-wrapper {
   height: 100%;
   overflow-y: scroll;
   scroll-snap-type: y mandatory;
   scrollbar-width: none;
}
.posts-wrapper::-webkit-scrollbar { display: none; }

/* ══════════════════════════════════════════════
   ARTICLE CARD
══════════════════════════════════════════════ */
.article-card {
   position: relative;
   height: 100vh;
   scroll-snap-align: start;
   scroll-snap-stop: always;
   background: var(--bg-color);
   padding: 0;
   padding-top: calc(20px + env(safe-area-inset-top));
   display: flex;
   flex-direction: column;
}

.article-header {
   display: flex;
   align-items: center;
   gap: 12px;
   flex-shrink: 0;
   position: relative;
   z-index: 50;
   margin-bottom: 14px;
   padding: 0 18px;
}

.author-avatar {
   width: 42px; height: 42px;
   border-radius: 50%;
   background: linear-gradient(135deg, var(--accent), #8a6430);
   display: flex; align-items: center; justify-content: center;
   font-size: 17px; font-weight: 700;
   color: #0f0e0b;
   overflow: hidden; flex-shrink: 0;
   cursor: pointer;
   transition: opacity 0.15s, box-shadow 0.2s;
}
.author-avatar:hover { opacity: 0.9; box-shadow: 0 0 0 2px var(--accent); }
.author-avatar img { width: 100%; height: 100%; object-fit: cover; }
.author-info { flex: 1; }
.author-name {
   color: var(--text-primary);
   font-weight: 700; font-size: 14px; margin-bottom: 1px;
   cursor: pointer; display: inline-block;
   transition: color 0.15s; letter-spacing: -0.01em;
}
.author-name:hover { color: var(--accent); }
.article-date { color: var(--text-secondary); font-size: 11px; font-weight: 500; }

/* Follow button */
.follow-btn {
   position: relative; width: 32px; height: 32px;
   border-radius: 50%; border: 1.5px solid var(--border-color);
   background: var(--hover-bg); cursor: pointer;
   display: flex; align-items: center; justify-content: center;
   flex-shrink: 0;
   transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
   overflow: hidden; -webkit-tap-highlight-color: transparent;
}
.follow-btn:active { transform: scale(0.9); }
.follow-btn .icon-plus, .follow-btn .icon-bell {
   position: absolute; width: 15px; height: 15px;
   transition: opacity 0.25s, transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
}
.follow-btn .icon-plus { stroke: var(--text-secondary); fill: none; stroke-width: 2; opacity: 1; transform: scale(1) rotate(0deg); }
.follow-btn .icon-bell { stroke: var(--accent); fill: none; stroke-width: 1.8; opacity: 0; transform: scale(0.4) rotate(-20deg); }
.follow-btn.following { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 10px var(--accent-glow); }
.follow-btn.following .icon-plus { opacity: 0; transform: scale(0.4) rotate(90deg); }
.follow-btn.following .icon-bell { opacity: 1; transform: scale(1) rotate(0deg); }
@keyframes bellRing {
   0%{transform:scale(1) rotate(0deg)} 15%{transform:scale(1.15) rotate(-18deg)}
   30%{transform:scale(1.15) rotate(14deg)} 45%{transform:scale(1.08) rotate(-10deg)}
   60%{transform:scale(1.08) rotate(7deg)} 75%{transform:scale(1) rotate(-4deg)}
   90%{transform:scale(1) rotate(2deg)} 100%{transform:scale(1) rotate(0deg)}
}
.follow-btn.ringing .icon-bell { animation: bellRing 0.55s cubic-bezier(0.36,0.07,0.19,0.97) forwards; }

/* Edit btn on own articles */
.edit-article-btn {
   width: 32px; height: 32px; border-radius: 50%;
   border: 1.5px solid var(--border-color);
   background: var(--hover-bg); cursor: pointer;
   display: flex; align-items: center; justify-content: center;
   flex-shrink: 0; color: var(--text-secondary);
   font-size: 12px; transition: all 0.2s;
}
.edit-article-btn:hover { border-color: var(--accent); color: var(--accent); }

.article-title {
   font-size: 20px; font-weight: 800; color: var(--text-primary);
   margin-bottom: 10px; line-height: 1.2; flex-shrink: 0;
   letter-spacing: -0.02em; padding: 0 18px;
   font-family: var(--font-heading);
}

.article-stats {
   display: flex; align-items: center; gap: 14px;
   margin-bottom: 10px; flex-shrink: 0; padding: 0 18px;
}
.stat-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); font-weight: 500; }
.stat-item.views i { color: var(--accent); }
.stat-item.likes i { color: #d4845a; }

.article-content {
   color: var(--text-primary);
   font-size: var(--content-size, 14px); line-height: 1.65;
   flex: 1; overflow-y: auto;
   padding: 0 18px; padding-right: 62px; padding-bottom: 110px;
   letter-spacing: 0.01em;
   text-align: justify;
   transition: font-size 0.2s, font-family 0.2s;
}
.article-content::-webkit-scrollbar { width: 2px; }
.article-content::-webkit-scrollbar-track { background: transparent; }
.article-content::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
.content-paragraph { margin-bottom: 12px; }

/* ── IMAGE ── */
.article-full-img-wrap {
   width: calc(100% + 80px);
   margin-left: -18px; margin-right: -62px;
   margin-bottom: 12px; margin-top: 4px;
   overflow: hidden;
}
.article-full-img-wrap img {
   width: 100%; height: auto; display: block;
   max-height: 340px; object-fit: cover;
}
.article-full-img-wrap .media-caption {
   font-size: 12px; color: var(--text-secondary);
   font-style: italic; padding: 7px 18px 0 18px;
}

/* ══════════════════════════════════════════════
   YOUTUBE — CUSTOM PLAYER (no header)
══════════════════════════════════════════════ */
.article-full-yt-wrap {
   width: calc(100% + 80px);
   margin-left: -18px; margin-right: -62px;
   margin-bottom: 12px; margin-top: 4px;
   position: relative;
   background: #000;
}
/* Normal horizontal */
.article-full-yt-wrap { aspect-ratio: 16/9; }
/* Vertical video override */
.article-full-yt-wrap.yt-vertical {
   aspect-ratio: unset;
   height: min(70vh, 560px);
}
.article-full-yt-wrap.yt-vertical iframe {
   width: 100%; height: 100%;
   object-fit: cover;
}

.article-full-yt-wrap iframe {
   width: 100%; height: 100%;
   border: none; display: block;
   pointer-events: none; /* we handle via overlay */
}

/* custom controls overlay */
.yt-controls {
   position: absolute; bottom: 0; left: 0; right: 0;
   background: linear-gradient(transparent, rgba(0,0,0,0.82));
   padding: 28px 12px 10px;
   display: flex; flex-direction: column; gap: 6px;
   z-index: 10; opacity: 0;
   transition: opacity 0.25s;
}
.article-full-yt-wrap:hover .yt-controls,
.article-full-yt-wrap.yt-active .yt-controls { opacity: 1; }

/* tap zone on top to show/hide controls */
.yt-tap-zone {
   position: absolute; inset: 0; z-index: 9;
   cursor: pointer;
}

.yt-progress-row {
   display: flex; align-items: center; gap: 8px;
}
.yt-scrubber {
   flex: 1; height: 3px; border-radius: 3px;
   background: rgba(255,255,255,0.25);
   position: relative; cursor: pointer;
}
.yt-scrubber-fill {
   height: 100%; border-radius: 3px;
   background: var(--accent);
   width: 0%;
   pointer-events: none;
   transition: width 0.1s linear;
}
.yt-time { font-size: 10px; color: rgba(255,255,255,0.85); font-weight: 600; white-space: nowrap; }

.yt-btn-row {
   display: flex; align-items: center; gap: 8px;
}
.yt-ctrl-btn {
   background: none; border: none; cursor: pointer;
   color: #fff; font-size: 16px;
   display: flex; align-items: center; justify-content: center;
   width: 30px; height: 30px; border-radius: 50%;
   transition: background 0.15s;
   flex-shrink: 0;
}
.yt-ctrl-btn:hover { background: rgba(255,255,255,0.15); }
.yt-ctrl-btn.sm { font-size: 13px; width: 26px; height: 26px; }
.yt-vol-slider {
   width: 60px; height: 3px; accent-color: var(--accent);
   cursor: pointer;
}
.yt-spacer { flex: 1; }

/* vertical video caption */
.yt-caption-below {
   font-size: 11px; color: var(--text-secondary);
   font-style: italic; padding: 6px 18px 0;
   text-align: center;
}

/* ══════════════════════════════════════════════
   MCQ CARD
══════════════════════════════════════════════ */
.mcq-card {
   position: relative; height: 100vh;
   scroll-snap-align: start; scroll-snap-stop: always;
   background: var(--bg-color);
   padding: 8px 18px 100px;
   padding-top: calc(20px + env(safe-area-inset-top));
   display: flex; flex-direction: column; overflow: hidden;
}
.mcq-badge {
   display: inline-flex; align-items: center; gap: 6px;
   background: var(--accent-soft); border: 1px solid rgba(200,169,110,0.3);
   border-radius: 20px; padding: 4px 12px;
   font-size: 10px; font-weight: 800; letter-spacing: 0.08em;
   text-transform: uppercase; color: var(--accent);
   margin-bottom: 16px; flex-shrink: 0; align-self: flex-start;
}
.mcq-question {
   font-size: 19px; font-weight: 800; color: var(--text-primary);
   line-height: 1.3; margin-bottom: 14px; flex-shrink: 0;
   padding-right: 50px; letter-spacing: -0.02em;
   font-family: var(--font-heading);
}
.mcq-media { padding-right: 60px; flex-shrink: 0; margin-bottom: 14px; }
.mcq-scroll-area {
   flex: 1; overflow-y: auto; padding-right: 60px;
   display: flex; flex-direction: column; gap: 0;
}
.mcq-scroll-area::-webkit-scrollbar { width: 2px; }
.mcq-scroll-area::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
.mcq-options { display: flex; flex-direction: column; gap: 9px; }
.mcq-option {
   display: flex; align-items: center; gap: 12px;
   padding: 13px 14px; border-radius: 12px;
   border: 1px solid var(--border-color); background: var(--hover-bg);
   cursor: pointer;
   transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
   text-align: left; font-size: 14px; font-weight: 500;
   color: var(--text-primary); line-height: 1.4;
   -webkit-tap-highlight-color: transparent; width: 100%;
}
.mcq-option:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 12px var(--accent-glow); }
.mcq-option .opt-letter {
   width: 26px; height: 26px; border-radius: 50%;
   border: 1.5px solid var(--border-color);
   display: flex; align-items: center; justify-content: center;
   font-size: 10px; font-weight: 800; flex-shrink: 0;
   color: var(--text-secondary); transition: all 0.15s;
}
.mcq-option .opt-text { flex: 1; }
.mcq-option:disabled { cursor: default; }
.mcq-option.selected-correct { border-color: #6abf85; background: rgba(106,191,133,0.08); box-shadow: 0 0 12px rgba(106,191,133,0.15); }
.mcq-option.selected-correct .opt-letter { background: #6abf85; border-color: #6abf85; color: #0f0e0b; }
.mcq-option.selected-wrong { border-color: #c46a4e; background: rgba(196,106,78,0.07); }
.mcq-option.selected-wrong .opt-letter { background: #c46a4e; border-color: #c46a4e; color: #fff; }
.mcq-option.reveal-correct { border-color: rgba(106,191,133,0.5); }
.mcq-option.reveal-correct .opt-letter { border-color: #6abf85; color: #6abf85; }
.mcq-result-msg {
   font-size: 13px; font-weight: 700; margin-top: 14px;
   min-height: 18px; color: var(--text-secondary); flex-shrink: 0;
}
.mcq-result-msg.correct { color: #6abf85; }
.mcq-result-msg.wrong   { color: #c46a4e; }

/* ── ACTION BUTTONS ── */
.action-buttons {
   position: absolute; right: 14px; bottom: 143px;
   display: flex; flex-direction: column; gap: 20px; z-index: 10;
   filter: drop-shadow(0 4px 16px rgba(0,0,0,0.7));
}
.action-btn {
   display: flex; flex-direction: column; align-items: center; gap: 3px;
   background: none; border: none; cursor: pointer; transition: transform 0.1s;
}
.action-btn:active { transform: scale(0.88); }
.action-btn svg { width: 26px; height: 26px; stroke: #fff; fill: none; stroke-width: 2; }
.action-btn span { color: #fff; font-size: 10px; font-weight: 700; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
.action-btn.like-btn svg { stroke: #fff; fill: none; transition: fill 0.2s, stroke 0.2s; }
.action-btn.like-btn.liked svg { fill: #d4845a; stroke: #d4845a; }

/* ── HEART BURST ── */
.heart-burst {
   position: fixed; pointer-events: none; z-index: 9999;
   transform: translate(-50%, -50%);
   animation: heartBurstAnim 0.72s cubic-bezier(0.16,1,0.3,1) forwards;
}
.heart-burst svg { width: 80px; height: 80px; filter: drop-shadow(0 0 14px rgba(200,169,110,0.6)); }
@keyframes heartBurstAnim {
   0%  {opacity:0; transform:translate(-50%,-50%) scale(0.25) rotate(-12deg);}
   28% {opacity:1; transform:translate(-50%,-50%) scale(1.3) rotate(4deg);}
   52% {opacity:1; transform:translate(-50%,-50%) scale(0.92) rotate(-2deg);}
   72% {opacity:0.9; transform:translate(-50%,-50%) scale(1.08) rotate(0deg);}
   100%{opacity:0; transform:translate(-50%,-50%) scale(0.8) rotate(0deg);}
}

/* ── MEDIA ── */
.media-embed { margin: 10px 0; max-width: 100%; }
.media-embed img { width: 100%; max-width: 100%; height: auto; border-radius: 10px; display: block; }
.media-caption { font-size: 12px; color: var(--text-secondary); margin-top: 5px; font-style: italic; }
.custom-audio-player {
   background: var(--hover-bg); border-radius: 12px; padding: 14px;
   display: flex; align-items: center; gap: 12px; max-width: 100%;
   border: 1px solid var(--border-color);
}
.play-btn {
   width: 40px; height: 40px; border-radius: 50%;
   background: var(--accent); border: none; color: #0f0e0b;
   cursor: pointer; display: flex; align-items: center; justify-content: center;
   font-size: 14px; transition: background 0.2s; flex-shrink: 0;
   box-shadow: 0 0 14px var(--accent-glow);
}
.play-btn:hover { background: var(--accent-hover); }
.audio-info { flex: 1; min-width: 0; overflow: hidden; }
.audio-title { font-size: 12px; font-weight: 600; margin-bottom: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-primary); }
.waveform-container { position: relative; height: 28px; background: var(--bg-color); border-radius: 6px; margin-bottom: 5px; cursor: pointer; overflow: hidden; }
.waveform-progress { position: absolute; top: 0; left: 0; height: 100%; background: var(--accent); opacity: 0.35; transition: width 0.1s linear; }
.waveform-bars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: space-around; padding: 0 4px; }
.waveform-bar { width: 2px; background: var(--text-secondary); border-radius: 2px; opacity: 0.5; }
.audio-time { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-secondary); }

/* ── SKELETON ── */
@keyframes shimmer { 0%,100%{opacity:0.4} 50%{opacity:0.85} }
.skeleton-base { background: var(--hover-bg); animation: shimmer 1.6s infinite; border-radius: 6px; }
.skeleton-card { position: relative; height: 100vh; scroll-snap-align: start; scroll-snap-stop: always; background: var(--bg-color); padding: 8px 18px 100px; padding-top: calc(20px + env(safe-area-inset-top)); display: flex; flex-direction: column; }
.skeleton-header { display: flex; align-items: center; gap: 12px; flex-shrink: 0; margin-bottom: 16px; }
.skeleton-avatar { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; }
.skeleton-author-block { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.skeleton-name { height: 13px; width: 110px; }
.skeleton-date { height: 9px; width: 65px; }
.skeleton-title { height: 22px; width: 88%; margin-bottom: 8px; border-radius: 6px; }
.skeleton-title-short { height: 22px; width: 62%; margin-bottom: 12px; border-radius: 6px; }
.skeleton-stats { display: flex; gap: 12px; margin-bottom: 14px; }
.skeleton-stat { height: 12px; width: 48px; }
.skeleton-line { height: 12px; margin-bottom: 9px; width: 100%; }
.skeleton-line.w90{width:90%}.skeleton-line.w75{width:75%}.skeleton-line.w80{width:80%}.skeleton-line.w65{width:65%}.skeleton-line.w95{width:95%}

/* ── SHARE / TOAST ── */
.share-toast {
   position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px);
   background: var(--hover-bg); border: 1px solid var(--border-color);
   border-radius: 14px; padding: 10px 18px;
   font-size: 13px; font-weight: 700; color: var(--text-primary);
   z-index: 9999; opacity: 0;
   transition: opacity 0.2s, transform 0.2s;
   pointer-events: none; white-space: nowrap;
   box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
.share-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── COMMENTS ── */
.comments-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 199; opacity: 0; pointer-events: none; transition: opacity 0.3s; backdrop-filter: blur(4px); }
.comments-overlay.active { opacity: 1; pointer-events: all; }
.comments-popup {
   position: fixed; top: 50%; left: 50%;
   transform: translate(-50%, -50%) scale(0.9);
   width: calc(100% - 40px); max-width: 500px;
   height: 70vh; max-height: 600px;
   background: var(--hover-bg); border-radius: 20px; z-index: 200;
   opacity: 0; pointer-events: none;
   transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
   display: flex; flex-direction: column;
   box-shadow: 0 24px 80px rgba(0,0,0,0.7), 0 0 0 1px var(--border-color);
}
.comments-popup.active { opacity: 1; pointer-events: all; transform: translate(-50%,-50%) scale(1); }
.comments-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border-color); }
.comments-header h3 { font-size: 15px; font-weight: 700; }
.close-comments { background: none; border: none; color: var(--text-primary); font-size: 22px; cursor: pointer; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.close-comments:hover { background: var(--hover-bg); }
.comments-list { flex: 1; overflow-y: auto; padding: 14px 18px; }
.comments-list::-webkit-scrollbar { width: 3px; }
.comments-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
.comment-item { display: flex; gap: 10px; margin-bottom: 18px; }
.comment-avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #8a6430); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #0f0e0b; flex-shrink: 0; overflow: hidden; }
.comment-avatar img { width: 100%; height: 100%; object-fit: cover; }
.comment-content { flex: 1; }
.comment-author { font-weight: 700; font-size: 12px; margin-bottom: 3px; }
.comment-text { font-size: 13px; line-height: 1.5; margin-bottom: 5px; }
.comment-time { font-size: 10px; color: var(--text-secondary); }
.comment-input-wrapper { padding: 10px 18px; border-top: 1px solid var(--border-color); border-radius: 0 0 20px 20px; }
.comment-input-container { display: flex; gap: 8px; align-items: center; }
.comment-input {
   flex: 1; background: var(--bg-color); border: 1px solid var(--border-color);
   border-radius: 20px; padding: 9px 14px; color: var(--text-primary);
   font-size: 16px; outline: none; transition: border-color 0.15s;
   font-family: var(--font-content);
}
.comment-input:focus { border-color: var(--accent); }
.send-comment-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); border: none; color: #0f0e0b; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.send-comment-btn:hover { background: var(--accent-hover); }
.send-comment-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.no-comments { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-secondary); gap: 10px; }
.no-comments i { font-size: 40px; opacity: 0.3; color: var(--accent); }
.loading-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-primary); gap: 14px; }
.spinner { width: 40px; height: 40px; border: 3px solid var(--border-color); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── TERM POPUP ── */
.term-popup {
   position: fixed; width: 270px; max-width: calc(100vw - 24px);
   background: var(--hover-bg); border: 1px solid var(--border-color);
   border-radius: 12px; padding: 12px 14px 10px; z-index: 301;
   opacity: 0; pointer-events: none;
   transition: opacity 0.18s, transform 0.18s; transform: translateY(4px);
   box-shadow: 0 12px 40px rgba(0,0,0,0.6);
}
.term-popup.active { opacity: 1; pointer-events: all; transform: translateY(0); }
.term-popup-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.term-popup-term { font-size: 12px; font-weight: 900; color: var(--accent); flex: 1; margin-right: 8px; }
.term-popup-close { width: 20px; height: 20px; border-radius: 50%; background: var(--bg-color); border: none; color: var(--text-secondary); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.term-popup-divider { height: 1px; background: var(--border-color); margin-bottom: 9px; }
.term-popup-body { font-size: 12px; line-height: 1.6; color: var(--text-secondary); }
.term-link {
   color: var(--accent); border-bottom: 1px dashed rgba(200,169,110,0.45);
   cursor: pointer; font-weight: 600; transition: opacity 0.15s;
}
.term-link:hover { opacity: 0.75; }

/* ── FOOTER ── */
.footer-bar {
   position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
   width: 100%; max-width: 450px;
   background: rgba(15,14,11,0.96);
   border-top: 1px solid var(--border-color);
   padding: 8px 24px;
   padding-bottom: calc(8px + env(safe-area-inset-bottom));
   display: flex; justify-content: space-around; align-items: center;
   z-index: 100;
   backdrop-filter: blur(20px);
}
body.theme-absolute-light .footer-bar { background: rgba(255,255,255,0.96); }
body.theme-sepia .footer-bar { background: rgba(244,237,224,0.96); }
body.theme-midnight .footer-bar { background: rgba(10,15,30,0.96); }
.footer-btn {
   display: flex; flex-direction: column; align-items: center; gap: 3px;
   background: none; border: none; color: var(--text-secondary);
   cursor: pointer; transition: color 0.2s; padding: 6px 12px;
}
.footer-btn:hover { color: var(--text-primary); }
.footer-btn.active { color: var(--accent); }
.footer-btn i { font-size: 19px; }
.footer-btn span { font-size: 10px; font-weight: 600; }

@media (min-width: 769px) {
   .footer-bar { max-width: 520px; }
   .app-container { max-width: none; left: 0; transform: none; display: flex; }
}

/* ══════════════════════════════════════════════
   LIBRARY PICKER CARD — Profile-style
══════════════════════════════════════════════ */
.library-picker-card {
   position: relative; height: 100vh;
   scroll-snap-align: start; scroll-snap-stop: always;
   background: var(--bg-color);
   display: flex; flex-direction: column; overflow: hidden;
}

/* top bar: settings icon + login status */
.lp-topbar {
   flex-shrink: 0;
   display: flex; align-items: center; justify-content: space-between;
   padding: calc(14px + env(safe-area-inset-top)) 18px 10px;
   border-bottom: 1px solid var(--border-color);
}
.lp-topbar-logo {
   display: flex; align-items: center; gap: 7px;
}
.lp-topbar-logo img { height: 20px; }
.lp-topbar-title {
   font-size: 14px; font-weight: 900; font-family: var(--font-heading);
   letter-spacing: -0.02em;
}
.lp-topbar-right { display: flex; align-items: center; gap: 8px; }
.lp-login-chip {
   display: flex; align-items: center; gap: 6px;
   font-size: 11px; font-weight: 600; color: var(--text-secondary);
   background: var(--hover-bg); border: 1px solid var(--border-color);
   border-radius: 20px; padding: 4px 10px; cursor: pointer;
   transition: border-color 0.15s;
}
.lp-login-chip.logged-in { color: var(--accent); border-color: rgba(200,169,110,0.3); background: var(--accent-soft); }
.lp-login-chip i { font-size: 10px; }
.lp-settings-btn {
   width: 32px; height: 32px; border-radius: 50%;
   background: var(--hover-bg); border: 1px solid var(--border-color);
   cursor: pointer; display: flex; align-items: center; justify-content: center;
   font-size: 13px; color: var(--text-secondary);
   transition: border-color 0.15s, color 0.15s;
}
.lp-settings-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Settings popover */
.lp-settings-popover {
   position: fixed; z-index: 500;
   background: var(--hover-bg); border: 1px solid var(--border-color);
   border-radius: 16px; padding: 14px;
   width: 240px;
   box-shadow: 0 12px 40px rgba(0,0,0,0.5);
   opacity: 0; pointer-events: none;
   transform: translateY(-8px) scale(0.97);
   transition: opacity 0.2s, transform 0.2s;
}
.lp-settings-popover.open {
   opacity: 1; pointer-events: all;
   transform: translateY(0) scale(1);
}
.lp-settings-section { margin-bottom: 12px; }
.lp-settings-section:last-child { margin-bottom: 0; }
.lp-settings-label {
   font-size: 9px; font-weight: 800; letter-spacing: 0.1em;
   text-transform: uppercase; color: var(--text-secondary);
   margin-bottom: 7px;
}
.lp-settings-row {
   display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
}
.lp-pill {
   padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
   border: 1px solid var(--border-color); background: var(--bg-color);
   color: var(--text-secondary); cursor: pointer;
   transition: all 0.15s; white-space: nowrap;
   font-family: var(--font-content);
}
.lp-pill.active { background: var(--accent); color: #0f0e0b; border-color: var(--accent); }
.lp-pill:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

/* size slider */
.lp-slider { width: 100%; accent-color: var(--accent); cursor: pointer; }

/* emoji toggle row */
.lp-toggle-row {
   display: flex; align-items: center; justify-content: space-between;
}
.lp-toggle-label { font-size: 12px; font-weight: 600; color: var(--text-primary); }
.lp-toggle {
   width: 36px; height: 20px; border-radius: 10px;
   background: var(--border-color); cursor: pointer;
   position: relative; transition: background 0.2s; flex-shrink: 0;
}
.lp-toggle.on { background: var(--accent); }
.lp-toggle::after {
   content: ''; position: absolute; top: 2px; left: 2px;
   width: 16px; height: 16px; border-radius: 50%;
   background: #fff; transition: transform 0.2s;
}
.lp-toggle.on::after { transform: translateX(16px); }

/* lib scroll body */
.lp-body {
   flex: 1; overflow-y: auto; overflow-x: hidden;
   padding: 10px 0 0;
   display: flex; flex-direction: column;
}
.lp-body::-webkit-scrollbar { width: 2px; }
.lp-body::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

.lp-section-label {
   font-size: 10px; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase;
   color: var(--accent); display: flex; align-items: center; gap: 6px;
   padding: 6px 18px; flex-shrink: 0;
}

.lp-shelf-wrap { overflow: visible; margin-bottom: 14px; }
.lp-shelf {
   display: flex; gap: 12px;
   width: 100%; padding: 4px 18px 8px;
   overflow-x: auto; overflow-y: visible;
   scroll-snap-type: x mandatory;
   -webkit-overflow-scrolling: touch;
}
.lp-shelf::-webkit-scrollbar { height: 2px; }
.lp-shelf::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

/* Profile-style movie card */
.lp-movie-card {
   flex-shrink: 0; width: 120px;
   scroll-snap-align: start; cursor: pointer; position: relative;
   border-radius: 10px; overflow: visible;
   transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
}
.lp-movie-card:hover { transform: translateY(-4px) scale(1.02); z-index: 20; }
.lp-movie-card.selected { transform: translateY(-4px) scale(1.04); z-index: 20; }
.lp-movie-card.selected .lp-movie-poster {
   box-shadow: 0 0 0 2.5px var(--accent), 0 12px 32px var(--accent-glow);
   border-color: var(--accent);
}
.lp-movie-poster {
   width: 120px; height: 175px;
   border-radius: 10px; overflow: hidden; position: relative;
   background: linear-gradient(135deg, var(--hover-bg), var(--bg-color));
   border: 1px solid var(--border-color);
   box-shadow: 0 6px 20px rgba(0,0,0,0.5);
   transition: box-shadow 0.22s, border-color 0.22s;
}
.lp-movie-poster img { width: 100%; height: 100%; object-fit: cover; }
.lp-poster-placeholder {
   width: 100%; height: 100%;
   display: flex; flex-direction: column;
   align-items: center; justify-content: center; gap: 8px;
}
.lp-poster-letter { font-size: 26px; font-weight: 800; color: rgba(200,169,110,0.2); font-family: var(--font-heading); }
.lp-poster-icon { font-size: 18px; color: rgba(200,169,110,0.15); }
.lp-movie-overlay {
   position: absolute; inset: 0;
   background: linear-gradient(to top, rgba(10,8,5,0.96) 0%, rgba(10,8,5,0.2) 50%, transparent 75%);
   display: flex; flex-direction: column; justify-content: flex-end; padding: 8px;
}
.lp-movie-count {
   display: inline-flex; align-items: center; gap: 3px;
   background: rgba(200,169,110,0.18); border: 1px solid rgba(200,169,110,0.25);
   backdrop-filter: blur(6px); border-radius: 5px; padding: 2px 6px;
   font-size: 9px; font-weight: 700; color: var(--accent);
   align-self: flex-start; margin-bottom: 4px;
}
.lp-selected-badge {
   position: absolute; top: 7px; right: 7px;
   background: var(--accent); border-radius: 50%;
   width: 20px; height: 20px;
   display: none; align-items: center; justify-content: center;
   font-size: 10px; color: #0f0e0b; font-weight: 800;
}
.lp-movie-card.selected .lp-selected-badge { display: flex; }
.lp-movie-info { padding: 6px 2px 0; }
.lp-movie-title {
   font-size: 11px; font-weight: 700; line-height: 1.3; color: var(--text-primary);
   display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
   margin-bottom: 2px; transition: color 0.2s;
}
.lp-movie-card:hover .lp-movie-title,
.lp-movie-card.selected .lp-movie-title { color: var(--accent); }
.lp-movie-meta { font-size: 9px; color: var(--text-secondary); }

/* Bottom action row (appears when ≥1 selected) */
.lp-action-footer {
   flex-shrink: 0;
   padding: 10px 18px;
   padding-bottom: calc(10px + env(safe-area-inset-bottom) + 72px);
   border-top: 1px solid var(--border-color);
   background: var(--bg-color);
   display: flex; gap: 8px; align-items: center;
   transform: translateY(100%);
   transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
}
.lp-action-footer.visible { transform: translateY(0); }
.lp-begin-btn {
   flex: 1; padding: 13px; border-radius: 12px;
   background: var(--accent); color: #0f0e0b;
   font-size: 14px; font-weight: 800; border: none; cursor: pointer;
   display: flex; align-items: center; justify-content: center; gap: 7px;
   box-shadow: 0 4px 20px var(--accent-glow);
   font-family: var(--font-content);
   transition: background 0.15s;
}
.lp-begin-btn:hover { background: var(--accent-hover); }
.lp-all-btn {
   padding: 13px 14px; border-radius: 12px;
   background: var(--hover-bg); border: 1px solid var(--border-color);
   color: var(--text-secondary); font-size: 12px; font-weight: 700; cursor: pointer;
   font-family: var(--font-content);
   transition: border-color 0.15s, color 0.15s;
}
.lp-all-btn:hover { border-color: var(--accent); color: var(--accent); }

/* scroll hint when no selection */
.lp-scroll-hint {
   display: flex; align-items: center; justify-content: center; gap: 6px;
   font-size: 11px; color: var(--text-secondary); font-weight: 500;
   padding: 12px 18px;
   padding-bottom: calc(12px + env(safe-area-inset-bottom) + 72px);
   flex-shrink: 0;
}

/* exit animation */
@keyframes lp-card-exit {
   0%{opacity:1;transform:translateY(0) scale(1)}
   100%{opacity:0;transform:translateY(-24px) scale(0.97)}
}
.library-picker-card.exiting { animation: lp-card-exit 0.35s cubic-bezier(0.4,0,0.2,1) forwards; pointer-events: none; }

/* loading */
.lp-loading { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 12px; padding: 30px 0; }

/* ══════════════════════════════════════════════
   INLINE EDITOR (own articles)
══════════════════════════════════════════════ */
.inline-editor-overlay {
   position: fixed; inset: 0;
   background: rgba(0,0,0,0.88);
   z-index: 250; opacity: 0; pointer-events: none;
   transition: opacity 0.3s; backdrop-filter: blur(4px);
}
.inline-editor-overlay.active { opacity: 1; pointer-events: all; }

.inline-editor {
   position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%);
   width: 100%; max-width: 520px;
   max-height: 88vh;
   background: var(--hover-bg);
   border-radius: 20px 20px 0 0;
   border: 1px solid var(--border-color);
   border-bottom: none;
   z-index: 251;
   display: flex; flex-direction: column;
   transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
   padding-bottom: env(safe-area-inset-bottom);
}
.inline-editor.open { transform: translateX(-50%) translateY(0); }

.inline-editor-handle { width: 36px; height: 4px; background: var(--border-color); border-radius: 2px; margin: 12px auto 0; flex-shrink: 0; }
.inline-editor-header {
   padding: 10px 18px; display: flex; align-items: center; justify-content: space-between;
   border-bottom: 1px solid var(--border-color); flex-shrink: 0;
}
.inline-editor-title { font-size: 13px; font-weight: 700; font-family: var(--font-heading); }
.inline-editor-close {
   width: 28px; height: 28px; border-radius: 50%;
   background: var(--bg-color); border: 1px solid var(--border-color);
   color: var(--text-primary); cursor: pointer;
   display: flex; align-items: center; justify-content: center; font-size: 11px;
}
.inline-editor-body { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 12px; }
.inline-editor-body::-webkit-scrollbar { width: 2px; }
.ie-label { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 6px; }
.ie-input, .ie-textarea {
   width: 100%; padding: 10px 13px;
   background: var(--bg-color); border: 1px solid var(--border-color);
   border-radius: 10px; color: var(--text-primary);
   font-size: 14px; outline: none;
   font-family: var(--font-content); transition: border-color 0.15s;
}
.ie-input:focus, .ie-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ie-textarea { resize: none; min-height: 140px; line-height: 1.6; }
.ie-mcq-opt-row {
   display: flex; align-items: center; gap: 8px;
   padding: 10px 12px; border-radius: 10px;
   border: 1px solid var(--border-color); background: var(--bg-color);
   margin-bottom: 7px;
}
.ie-mcq-opt-row.correct { border-color: #6abf85; background: rgba(106,191,133,0.06); }
.ie-opt-letter {
   width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--border-color);
   display: flex; align-items: center; justify-content: center;
   font-size: 9px; font-weight: 800; flex-shrink: 0; color: var(--text-secondary);
}
.ie-mcq-opt-row.correct .ie-opt-letter { background: #6abf85; border-color: #6abf85; color: #0f0e0b; }
.ie-opt-input {
   flex: 1; background: transparent; border: none; outline: none;
   font-size: 13px; color: var(--text-primary); font-family: var(--font-content);
}
.ie-mark-correct {
   width: 26px; height: 26px; border-radius: 50%; border: none; cursor: pointer;
   background: var(--hover-bg); color: var(--text-secondary); font-size: 10px;
   display: flex; align-items: center; justify-content: center;
}
.ie-mcq-opt-row.correct .ie-mark-correct { background: #6abf85; color: #0f0e0b; }
.ie-mcq-add {
   padding: 10px; border-radius: 8px;
   border: 1px dashed var(--border-color); background: transparent;
   color: var(--text-secondary); font-size: 12px; font-weight: 600; cursor: pointer;
   display: flex; align-items: center; justify-content: center; gap: 5px;
   width: 100%; font-family: var(--font-content);
}
.inline-editor-footer {
   padding: 10px 18px; border-top: 1px solid var(--border-color);
   display: flex; gap: 8px; flex-shrink: 0;
}
.ie-btn {
   flex: 1; padding: 11px; border-radius: 10px; border: none;
   font-size: 12px; font-weight: 700; cursor: pointer;
   font-family: var(--font-content);
   display: flex; align-items: center; justify-content: center; gap: 5px;
}
.ie-btn-cancel { background: var(--bg-color); color: var(--text-secondary); border: 1px solid var(--border-color); flex: 0.5; }
.ie-btn-save { background: var(--accent); color: #0f0e0b; box-shadow: 0 2px 10px var(--accent-glow); }
.ie-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ══════════════════════════════════════════════
   EMOJI HIGHLIGHT EFFECTS
   (toggled via .emoji-off on body)
══════════════════════════════════════════════ */
body.emoji-off .emo-magnify,body.emoji-off .emo-pinned,body.emoji-off .emo-book,
body.emoji-off .emo-brain,body.emoji-off .emo-science,body.emoji-off .emo-micro,

<!-- Theme persistence -->
<script>
(function(){
   const t=localStorage.getItem('pth-theme')||'champagne';
   const f=localStorage.getItem('pth-font')||'default';
   const s=localStorage.getItem('pth-size')||'md';
   const e=localStorage.getItem('pth-emoji');
   applyTheme(t);applyFont(f);applySize(s);
   if(e==='off')document.body.classList.add('emoji-off');

   function applyTheme(th){
       ['champagne','absolute-dark','absolute-light','sepia','midnight'].forEach(x=>document.body.classList.remove('theme-'+x));
       if(th!=='champagne')document.body.classList.add('theme-'+th);
   }
   function applyFont(fo){
       ['merriweather','serif','mono','arabic'].forEach(x=>document.body.classList.remove('font-'+x));
       if(fo!=='default')document.body.classList.add('font-'+fo);
   }
   function applySize(sz){
       ['sm','lg','xl'].forEach(x=>document.body.classList.remove('size-'+x));
       if(sz!=='md')document.body.classList.add('size-'+sz);
   }

   window._applyTheme=applyTheme;
   window._applyFont=applyFont;
   window._applySize=applySize;
})();
</script>

<!-- Confetti -->
<script>
(function(){
   const canvas=document.getElementById('confettiCanvas'),ctx=canvas.getContext('2d');
   let particles=[],animFrame=null;
   function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
   window.addEventListener('resize',resize);resize();
   const COLORS=['#c8a96e','#e8d8a0','#a07840','#d4b86a','#7ab88a','#c97a5a','#8aa0c0','#f0e8d8'];
   function spawnParticles(x,y){
       for(let i=0;i<70;i++){const angle=Math.random()*Math.PI*2,speed=Math.random()*6+2;particles.push({x:x??canvas.width/2,y:y??canvas.height*0.4,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-3,size:Math.random()*6+3,color:COLORS[Math.floor(Math.random()*COLORS.length)],alpha:1,rotation:Math.random()*Math.PI*2,rotSpeed:(Math.random()-0.5)*0.2,shape:Math.random()>0.5?'rect':'circle'});}
       if(!animFrame)animate();
   }
   function animate(){
       ctx.clearRect(0,0,canvas.width,canvas.height);
       particles=particles.filter(p=>p.alpha>0.01);

<!-- Emoji rendering -->
<script>
const EMOJI_MAP={
   '🔍':'emo-magnify','❗':'emo-urgent','📌':'emo-pinned','🔥':'emo-fire','💎':'emo-diamond',
   '🟡':'emo-yellow','🔵':'emo-blue','🟢':'emo-green','🟣':'emo-purple','🔴':'emo-red',
   '⚫':'emo-dark','🧠':'emo-brain','📖':'emo-book','💡':'emo-idea','🎯':'emo-target',
   '🧩':'emo-puzzle','🏷️':'emo-tag','🔬':'emo-micro','⚠️':'emo-warning','✅':'emo-check',
   '❌':'emo-cross','⏳':'emo-hourglass','🔒':'emo-lock','🔓':'emo-unlock','⚡':'emo-lightning',
   '🌊':'emo-wave','🌀':'emo-spin','💫':'emo-float','🚀':'emo-rocket','🎬':'emo-cinematic',
   '🌟':'emo-star','✨':'emo-sparkle','🌈':'emo-rainbow','👑':'emo-crown','🪄':'emo-magic',
   '❤️':'emo-heart','😄':'emo-happy','😌':'emo-calm','😮':'emo-surprised','😎':'emo-cool',
   '🤖':'emo-robot','🧪':'emo-science','🏛️':'emo-temple','🌍':'emo-earth','💰':'emo-money',
   '⚖️':'emo-balance','📡':'emo-signal','🎵':'emo-music','🧊':'emo-ice','🔊':'emo-sound',
};

function buildEmojiPattern(){
   const keys=Object.keys(EMOJI_MAP).sort((a,b)=>b.length-a.length);
   const escaped=keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
   return new RegExp(`(${escaped})([\\s\\S]*?)\\1`,'gu');
}
function escHtmlET(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderTerms(html){
   return html.replace(/([A-Za-z][A-Za-z0-9\-']{0,60}?)&lt;([^&]{1,600}?)&gt;/g,function(match,term,explanation){
       const safeTerm=term.trim().replace(/'/g,'&#39;');
       const safeExp=explanation.replace(/'/g,'&#39;');
       return `<span class="term-link" onclick="openTermPopup('${safeTerm}','${safeExp}',event)">${term.trim()}</span>`;
   });
}
function isArabic(str){return /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/.test(str);}
function renderEmojiText(text,applyTerms=true){
   const re=buildEmojiPattern();
   let result='',lastIndex=0,match;
   while((match=re.exec(text))!==null){
       result+=escHtmlET(text.slice(lastIndex,match.index));
       const cls=EMOJI_MAP[match[1]];
       result+=`<span class="${cls}">${renderEmojiText(match[2],false)}</span>`;
       lastIndex=re.lastIndex;
   }
   result+=escHtmlET(text.slice(lastIndex));
   return applyTerms?renderTerms(result):result;
}

function renderParagraph(text){
   const html=renderEmojiText(text);
   const arabic=isArabic(text);
   return `<div class="content-paragraph${arabic?' rtl-para':''}">${html}</div>`;
}
</script>

<script>

window._ytAPIReady=false;

function whenYTReady(cb){
   if(window._ytAPIReady)cb();

const _ytPlayers={};

function initYTPlayer(containerId,ytId,isVertical){
   const wrap=document.getElementById(containerId);if(!wrap)return;
   const iframeId='yti_'+containerId;

   whenYTReady(()=>{
       const player=new YT.Player(iframeId,{
           events:{
               onReady:e=>{
                   _ytPlayers[containerId]=e.target;
                   // detect vertical via metadata
                   updateYTTime(containerId);

                   const ctrl=document.getElementById('ytplay_'+containerId);

                       ctrl.innerHTML='<i class="fas fa-play"></i>';

const _ytTimers={};
function startYTProgress(cid){
   stopYTProgress(cid);
   _ytTimers[cid]=setInterval(()=>updateYTTime(cid),500);
}
function stopYTProgress(cid){clearInterval(_ytTimers[cid]);}
function updateYTTime(cid){
   const p=_ytPlayers[cid];if(!p||typeof p.getCurrentTime!=='function')return;
   const cur=p.getCurrentTime()||0;
   const dur=p.getDuration()||0;
   const pct=dur>0?(cur/dur*100):0;
   const fill=document.getElementById('ytfill_'+cid);
   if(fill)fill.style.width=pct+'%';
   const time=document.getElementById('yttime_'+cid);
   if(time)time.textContent=fmtTime(cur)+(dur>0?' / '+fmtTime(dur):'');
}
function fmtTime(s){const m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+sec.toString().padStart(2,'0');}

window.ytTogglePlay=function(cid){
   const p=_ytPlayers[cid];if(!p)return;
   const state=p.getPlayerState();

};
window.ytSeek=function(e,cid){

   const bar=e.currentTarget;
   const rect=bar.getBoundingClientRect();
   const pct=(e.clientX-rect.left)/rect.width;
   const dur=p.getDuration()||0;
   p.seekTo(pct*dur,true);
};
window.ytSetVol=function(val,cid){

<!-- Image dominant color -->
<script>
window._getImageDominantColor=function(imgEl,callback){
   try{
       const canvas=document.createElement('canvas');
       const SIZE=50;canvas.width=SIZE;canvas.height=SIZE;
       const ctx=canvas.getContext('2d');ctx.drawImage(imgEl,0,0,SIZE,SIZE);
       const data=ctx.getImageData(0,0,SIZE,SIZE).data;
       let r=0,g=0,b=0,cnt=0;
       for(let i=0;i<data.length;i+=4){const a=data[i+3];if(a<128)continue;r+=data[i];g+=data[i+1];b+=data[i+2];cnt++;}
       if(!cnt){callback(null);return;}
       r=Math.min(255,Math.round(r/cnt*1.6));g=Math.min(255,Math.round(g/cnt*1.6));b=Math.min(255,Math.round(b/cnt*1.6));
       callback(`rgb(${r},${g},${b})`);
   }catch(e){callback(null);}
};
</script>

function escHtmlAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

window.ieMCQMarkCorrect=function(idx){
   document.querySelectorAll('.ie-mcq-opt-row').forEach(r=>r.classList.remove('correct'));

window.ieAddMCQOpt=function(){

window.saveInlineEdit=async function(){
   if(!_inlineEditingId||!window._supabase)return;
   const btn=document.getElementById('ieSaveBtn');
   btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>';
   try{
       let updateData={};
       if(_inlineEditingType==='article'){
           const t=document.getElementById('ie-title')?.value.trim();
           const c=document.getElementById('ie-content')?.value.trim();
           if(!t){showFeedToast('Title required');btn.disabled=false;btn.innerHTML='<i class="fas fa-check"></i> Save';return;}
           updateData={title:t,content:c};
       } else {
           const q=document.getElementById('ie-mcq-q')?.value.trim();
           if(!q){showFeedToast('Question required');btn.disabled=false;btn.innerHTML='<i class="fas fa-check"></i> Save';return;}
           const wrap=document.getElementById('ie-opts-wrap');
           const rows=wrap?[...wrap.querySelectorAll('.ie-mcq-opt-row')]:[];
           if(!rows.some(r=>r.classList.contains('correct'))){showFeedToast('Mark one correct answer');btn.disabled=false;btn.innerHTML='<i class="fas fa-check"></i> Save';return;}
           const lines=['❔'+q,...rows.map((r,i)=>{const inp=document.getElementById('ie-opt-inp-'+i);const v=(inp?.value||'').trim();return r.classList.contains('correct')?'✅'+v:v;})];
           updateData={title:q,content:lines.join('\n')};
       }
       const {error}=await window._supabase.from('articles').update(updateData).eq('id',_inlineEditingId);
       if(error)throw error;
       // update local cache
       const idx=articles.findIndex(a=>a.id===_inlineEditingId);
       if(idx!==-1){Object.assign(articles[idx],updateData);}
       closeInlineEditor();
       // re-render the updated card in place
       reRenderCard(_inlineEditingId);
       showFeedToast('Saved ✓');
   }catch(e){showFeedToast('Error saving');}
   btn.disabled=false;btn.innerHTML='<i class="fas fa-check"></i> Save';
};

function showFeedToast(msg){
   const t=document.getElementById('shareToast');
   t.textContent=msg;t.classList.add('show');
   clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2500);
}

function reRenderCard(articleId){
   const art=articles.find(a=>a.id===articleId);if(!art)return;
   const existing=document.querySelector(`.article-card[data-article-id="${articleId}"],.mcq-card[data-article-id="${articleId}"]`);
   if(!existing)return;
   const idx=parseInt(existing.dataset.index)||0;
   const newCard=isMCQ(art.content)?buildMCQCard(art,idx):buildArticleCard(art,idx);
   existing.replaceWith(newCard);
   attachCardListeners(newCard,art);
}
</script>

// ── Auth state
onAuthStateChanged(auth,async user=>{
   currentUser=user;
   if(user){
       await ensureSupabaseAuth();
       const {data:ud}=await supabase.from('users').select('user_id,firebase_uid,username').eq('firebase_uid',user.uid).single();
       if(ud){
           window._currentUserData=ud;
           await Promise.all([loadUserLikes(ud),loadUserFollowing(ud),loadUserFavLibs(ud)]);
       }
       // update auth chip
       const chips=document.querySelectorAll('.lp-login-chip');
       chips.forEach(c=>{c.classList.add('logged-in');c.innerHTML=`<i class="fas fa-circle" style="font-size:6px;"></i>${ud?.username?'@'+ud.username:'Logged in'}`;});

       if(dsAuth)dsAuth.textContent='Not logged in';

async function loadUserLikes(ud){
   if(!ud)return;
   const{data}=await supabase.from('likes').select('article_id').eq('user_id',ud.user_id);
   userLikes.clear();(data||[]).forEach(l=>userLikes.add(String(l.article_id)));updateLikeButtons();
}
async function loadUserFollowing(ud){
   if(!ud)return;
   const{data}=await supabase.from('subscriptions').select('author_id').eq('subscriber_id',ud.user_id);
   userFollowing.clear();(data||[]).forEach(r=>userFollowing.add(String(r.author_id)));updateFollowButtons();
}
async function loadUserFavLibs(ud){
   if(!ud)return;
   const{data}=await supabase.from('favourite_playlists').select('playlist_id').eq('user_id',ud.user_id);

// ── Helpers
function isMCQ(c){return typeof c==='string'&&c.trimStart().startsWith('❔');}
function parseMCQ(c){
   const lines=c.trim().split('\n').map(l=>l.trim()).filter(Boolean);
   const q=lines[0].replace(/^❔/,'').trim();
   const opts=lines.slice(1).map(l=>({label:l.replace(/^✅/,'').trim(),correct:l.startsWith('✅')}));
   for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
   return{question:q,options:opts};
}
function formatNumber(n){if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1000)return(n/1000).toFixed(1)+'K';return(n||0).toString();}
function formatDate(d){const now=new Date(),ms=now-d,m=Math.floor(ms/60000),h=Math.floor(ms/3600000),dy=Math.floor(ms/86400000);if(m<60)return m+'m ago';if(h<24)return h+'h ago';if(dy<7)return dy+'d ago';return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function getAvatarContent(a){if(a.authorPfp)return`<img src="${a.authorPfp}" alt="">`;const s=a.authorUsername||a.author||'A';return s.replace('@','').charAt(0).toUpperCase();}

function isOwnArticle(a){
   if(!currentUser)return false;
   return a.firebase_user_id===currentUser.uid;
}

// ── Author header
function buildAuthorHeader(article){
   const avatarContent=getAvatarContent(article);
   const aSupaId=article.authorSupaUserId||'';
   const aFbUid=article.firebase_user_id||'';
   const aUser=article.authorUsername||'';
   const profileUrl=aUser?`profile.html?username=${encodeURIComponent(aUser)}`:(aFbUid?`profile.html?id=${encodeURIComponent(aFbUid)}`:'#');
   const isFollowing=aSupaId&&userFollowing.has(String(aSupaId));
   const showFollow=aSupaId&&(!currentUser||String(window._currentUserData?.user_id)!==String(aSupaId));
   const showEdit=isOwnArticle(article);

   const followBtn=showFollow?`
       <button class="follow-btn${isFollowing?' following':''}" data-supa-uid="${aSupaId}"
           onclick="handleFollow(event,'${aFbUid}','${aSupaId}')">
           <svg class="icon-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
           <svg class="icon-bell" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
       </button>`:'';

   const editBtn=showEdit?`<button class="edit-article-btn" onclick="openInlineEditor(${article.id},'${isMCQ(article.content)?'mcq':'article'}','${(article.title||'').replace(/'/g,"\\'")}',null)" title="Edit"><i class="fas fa-pen"></i></button>`:'';

   return `
       <div class="author-avatar" onclick="location.href='${profileUrl}'">${avatarContent}</div>
       <div class="author-info">
           <div class="author-name" onclick="location.href='${profileUrl}'">${article.author}</div>
           <div class="article-date">${formatDate(new Date(article.created_at))}</div>
       </div>
       ${followBtn}${editBtn}`;
}

// ── YouTube embed (no header, custom controls)
function createYTElement(m,forArticle=false){
   const ytMatch=(m.url||'').match(/embed\/([A-Za-z0-9_-]{11})/);
   const videoId=ytMatch?ytMatch[1]:'';
   if(!videoId)return document.createTextNode('');

   const containerId='ytc_'+videoId+'_'+Math.random().toString(36).slice(2,6);
   const isVertical=m.vertical===true; // set from your media table if you know it

   const wrap=document.createElement('div');
   if(forArticle){
       wrap.className='article-full-yt-wrap'+(isVertical?' yt-vertical':'');
   } else {
       wrap.className='article-full-yt-wrap';
   }
   wrap.id=containerId;
   wrap.style.position='relative';

   // iframe (no header: modestbranding=1, rel=0, controls=0)
   const iframe=document.createElement('iframe');
   iframe.id='yti_'+containerId;
   iframe.src=`https://www.youtube.com/embed/${videoId}?enablejsapi=1&modestbranding=1&rel=0&controls=0&playsinline=1`;
   iframe.allow='accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;fullscreen';
   iframe.allowFullscreen=true;
   iframe.style.width='100%';
   iframe.style.height='100%';
   iframe.style.border='none';
   iframe.style.display='block';
   iframe.style.pointerEvents='none';
   wrap.appendChild(iframe);

   // tap zone
   const tapZone=document.createElement('div');
   tapZone.className='yt-tap-zone';
   tapZone.onclick=()=>ytToggleControls(containerId);
   wrap.appendChild(tapZone);

   // controls
   const controls=document.createElement('div');
   controls.className='yt-controls';
   controls.innerHTML=`
       <div class="yt-progress-row">
           <div class="yt-scrubber" onclick="ytSeek(event,'${containerId}')">
               <div class="yt-scrubber-fill" id="ytfill_${containerId}"></div>
           </div>
           <div class="yt-time" id="yttime_${containerId}">0:00</div>
       </div>
       <div class="yt-btn-row">
           <button class="yt-ctrl-btn" id="ytplay_${containerId}" onclick="ytTogglePlay('${containerId}')">
               <i class="fas fa-play"></i>
           </button>
           <input type="range" class="yt-vol-slider" min="0" max="100" value="100"
               onchange="ytSetVol(this.value,'${containerId}')" oninput="ytSetVol(this.value,'${containerId}')">
           <div class="yt-spacer"></div>
           <button class="yt-ctrl-btn sm" onclick="ytFullscreen('${containerId}')">
               <i class="fas fa-expand"></i>
           </button>
       </div>`;
   wrap.appendChild(controls);

   // caption below vertical
   if(isVertical&&m.caption){
       const cap=document.createElement('div');cap.className='yt-caption-below';cap.textContent=m.caption;
       wrap.appendChild(cap);
   }

   // init player after render
   setTimeout(()=>initYTPlayer(containerId,videoId,isVertical),200);
   return wrap;
}

// ── Generic media element
function createMediaElement(m,forArticleContent=false){
   const d=document.createElement('div');
   if(m.type==='image'){
       if(forArticleContent){
           d.className='article-full-img-wrap';
           d.innerHTML=`<img src="${m.url}" alt="${m.caption||''}" crossorigin="anonymous">${m.caption?`<div class="media-caption">${m.caption}</div>`:''}`;
       } else {
           d.className='media-embed';
           d.innerHTML=`<img src="${m.url}" alt="${m.caption||''}">${m.caption?`<div class="media-caption">${m.caption}</div>`:''}`;
       }
   } else if(m.type==='youtube'){
       return createYTElement(m,forArticleContent);
   } else if(m.type==='audio'){
       d.className='media-embed';
       const aid='audio_'+Math.random().toString(36).substr(2,9);
       const bars=Array(15).fill(0).map(()=>`<div class="waveform-bar" style="height:${Math.random()*60+20}%"></div>`).join('');
       d.innerHTML=`<div class="custom-audio-player">
           <button class="play-btn" onclick="toggleAudio(this,'${aid}')"><i class="fas fa-play"></i></button>
           <div class="audio-info">
               <div class="audio-title">${m.caption||'Audio'}</div>
               <div class="waveform-container" onclick="seekAudio(event,this,'${aid}')">
                   <div class="waveform-progress"></div><div class="waveform-bars">${bars}</div>
               </div>
               <div class="audio-time"><span class="current-time">0:00</span><span class="duration">0:00</span></div>
           </div>
           <audio id="${aid}" src="${m.url}" style="display:none;"></audio>
       </div>`;
       setTimeout(()=>{const a=document.getElementById(aid);if(a)a.addEventListener('loadedmetadata',()=>{const dur=Math.floor(a.duration);const dEl=a.closest('.custom-audio-player')?.querySelector('.duration');if(dEl)dEl.textContent=`${Math.floor(dur/60)}:${(dur%60).toString().padStart(2,'0')}`;});},100);
   }
   return d;
}

// ── Build article card DOM
function buildArticleCard(article,index){
   const div=document.createElement('div');
   div.className='article-card';div.dataset.index=index;div.dataset.articleId=article.id;
   const hasImages=article.media?.some(m=>m.type==='image');
   if(hasImages)div.classList.add('has-image');
   const isLiked=userLikes.has(String(article.id));

   div.innerHTML=`
       <div class="article-header">${buildAuthorHeader(article)}</div>
       <div class="article-title">${renderEmojiText(article.title||'Untitled')}</div>
       <div class="article-stats">
           <div class="stat-item views"><i class="fas fa-eye"></i><span>${formatNumber(article.views||0)}</span></div>
           <div class="stat-item likes"><i class="fas fa-heart"></i><span>${formatNumber(article.likes||0)}</span></div>
       </div>
       <div class="action-buttons">
           <button class="action-btn like-btn${isLiked?' liked':''}" data-id="${article.id}">
               <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
               <span class="like-count">${formatNumber(article.likes||0)}</span>
           </button>
           <button class="action-btn comment-btn" data-id="${article.id}">
               <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
               <span class="comment-count">0</span>
           </button>
           <button class="action-btn share-btn" data-id="${article.id}" data-title="${(article.title||'').replace(/"/g,'&quot;')}">
               <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
               <span>Share</span>
           </button>
       </div>`;

   // content
   const contentDiv=document.createElement('div');contentDiv.className='article-content';
   const paragraphs=(article.content||'').split('\n\n');
   paragraphs.forEach((para,pIdx)=>{
       if(para.trim()){
           contentDiv.insertAdjacentHTML('beforeend',renderParagraph(para.trim()));
           if(article.media?.length){
               article.media.filter(m=>m.display_order===pIdx&&(m.type==='image'||m.type==='youtube'))
                   .forEach(m=>contentDiv.appendChild(createMediaElement(m,true)));
           }
       }
   });
   if(article.media){
       article.media.filter(m=>m.display_order>=paragraphs.length||(m.type!=='image'&&m.type!=='youtube'))
           .forEach(m=>contentDiv.appendChild(createMediaElement(m,m.type==='image'||m.type==='youtube')));
   }
   div.querySelector('.article-stats').insertAdjacentElement('afterend',contentDiv);
   return div;
}

// ── Build MCQ card DOM
function buildMCQCard(article,index){
   const {question,options}=parseMCQ(article.content);
   const isLiked=userLikes.has(String(article.id));
   const letters=['A','B','C','D','E','F'];
   const card=document.createElement('div');
   card.className='mcq-card';card.dataset.index=index;card.dataset.articleId=article.id;
   card.innerHTML=`
       <div class="article-header">${buildAuthorHeader(article)}</div>
       <div class="mcq-badge">❔ Quick Question</div>
       <div class="mcq-question">${renderEmojiText(question)}</div>
       <div class="mcq-media" id="mcq-media-${article.id}"></div>
       <div class="mcq-scroll-area">
           <div class="mcq-options" id="mcq-opts-${article.id}"></div>
           <div class="mcq-result-msg" id="mcq-msg-${article.id}"></div>
       </div>
       <div class="action-buttons">
           <button class="action-btn like-btn${isLiked?' liked':''}" data-id="${article.id}">
               <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
               <span class="like-count">${formatNumber(article.likes||0)}</span>
           </button>
           <button class="action-btn comment-btn" data-id="${article.id}">
               <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
               <span class="comment-count">0</span>
           </button>
           <button class="action-btn share-btn" data-id="${article.id}">
               <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
               <span>Share</span>
           </button>
       </div>`;

   if(article.media?.length){const mc=card.querySelector(`#mcq-media-${article.id}`);article.media.forEach(m=>mc.appendChild(createMediaElement(m,false)));}
   const optsContainer=card.querySelector(`#mcq-opts-${article.id}`);
   const msgEl=card.querySelector(`#mcq-msg-${article.id}`);
   let answered=false;
   options.forEach((opt,i)=>{
       const btn=document.createElement('button');btn.className='mcq-option';
       btn.innerHTML=`<span class="opt-letter">${letters[i]||i+1}</span><span class="opt-text">${renderEmojiText(opt.label)}</span>`;
       btn.addEventListener('click',()=>{
           if(answered)return;answered=true;
           optsContainer.querySelectorAll('.mcq-option').forEach(b=>b.disabled=true);
           if(opt.correct){btn.classList.add('selected-correct');msgEl.textContent='✓ Correct!';msgEl.className='mcq-result-msg correct';window.launchConfetti(btn);}
           else{btn.classList.add('selected-wrong');msgEl.className='mcq-result-msg wrong';const ci=options.findIndex(o=>o.correct);if(ci!==-1){optsContainer.querySelectorAll('.mcq-option')[ci].classList.add('reveal-correct');msgEl.textContent=`✗ The answer was: ${options[ci].label}`;}else msgEl.textContent='✗ Incorrect';}
       });
       optsContainer.appendChild(btn);
   });
   return card;
}

// ── Double tap like
function setupDoubleTap(card,articleId){
   let lastTap=0;
   card.addEventListener('touchend',function(e){
       if(e.target.closest('button,a,.term-link,.action-buttons,.author-name,.author-avatar,.follow-btn,.edit-article-btn'))return;
       const now=Date.now(),touch=e.changedTouches[0];
       if(now-lastTap<320){triggerDoubleTapLike(card,articleId,touch.clientX,touch.clientY);e.preventDefault();}
       lastTap=now;
   },{passive:false});
   card.addEventListener('dblclick',function(e){
       if(e.target.closest('button,a,.term-link,.action-buttons,.author-name,.author-avatar,.follow-btn'))return;
       triggerDoubleTapLike(card,articleId,e.clientX,e.clientY);
   });
}
function triggerDoubleTapLike(card,articleId,x,y){
   const likeBtn=card.querySelector('.like-btn');if(!likeBtn)return;
   if(!likeBtn.classList.contains('liked'))likeBtn.click();
   window.spawnHeartBurst(x,y);
}

// ── LIBRARY PICKER (profile-style)
async function initLibraryPicker(){
   if(anchorArticleId!==null){window._pickerHandledLoad=true;injectInitialSkeletons(3);loadArticles(true);return;}
   if(window._urlPlaylistId){
       window._pickerHandledLoad=true;injectInitialSkeletons(3);
       try{const{data:items}=await supabase.from('playlist_items').select('article_id').eq('playlist_id',window._urlPlaylistId);filteredArticleIds=[...new Set((items||[]).map(r=>r.article_id))]||null;}catch(e){filteredArticleIds=null;}
       loadArticles(true);return;
   }

   const wrapper=document.getElementById('postsWrapper');
   const pickerCard=buildPickerCard();
   wrapper.insertBefore(pickerCard,wrapper.firstChild);
   window._pickerHandledLoad=true;
   injectInitialSkeletons(3);
   loadArticles(true);

   requestAnimationFrame(()=>{
       const first=wrapper.querySelector('.skeleton-card');
       if(first)wrapper.scrollTop=first.offsetTop;
   });
}
