<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
   <title>Article Scroller - Patholytica</title>
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
   <style>

/* ══════════════════════════════════════════════
   CSS VARIABLES — THEMES
══════════════════════════════════════════════ */
:root {
   --bg-color: #0f0e0b;
   --text-primary: #f5f0e8;
   --text-secondary: #8a8070;
   --card-bg: #0f0e0b;
   --hover-bg: #1a1810;
   --border-color: #2a2518;
   --accent: #c8a96e;
   --accent-hover: #b8935a;
   --accent-glow: rgba(200,169,110,0.25);
   --accent-soft: rgba(200,169,110,0.12);
   --font-content: "DM Sans", -apple-system, sans-serif;
   --font-heading: "Merriweather", Georgia, serif;
   --content-size: 14px;
}

/* Absolute Dark */
body.theme-absolute-dark {
   --bg-color: #000000;
   --text-primary: #e8e8e8;
   --text-secondary: #666666;
   --card-bg: #000000;
   --hover-bg: #111111;
   --border-color: #222222;
   --accent: #c8a96e;
   --accent-hover: #b8935a;
   --accent-glow: rgba(200,169,110,0.2);
   --accent-soft: rgba(200,169,110,0.10);
}

/* Absolute Light */
body.theme-absolute-light {
   --bg-color: #ffffff;
   --text-primary: #111111;
   --text-secondary: #666666;
   --card-bg: #ffffff;
   --hover-bg: #f5f5f5;
   --border-color: #dddddd;
   --accent: #8a6020;
   --accent-hover: #6a4010;
   --accent-glow: rgba(138,96,32,0.18);
   --accent-soft: rgba(138,96,32,0.08);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
   font-family: var(--font-content);
   background: var(--bg-color);
   color: var(--text-primary);
   overflow: hidden;
   transition: background 0.25s, color 0.25s;
   position: fixed;
   width: 100%;
   height: 100%;
}

/* ── FONT VARIANTS ── */
body.font-merriweather .article-content,
body.font-merriweather .mcq-question { font-family: 'Merriweather', Georgia, serif; font-size: 13px; line-height: 1.8; }

body.font-serif .article-content,
body.font-serif .mcq-question { font-family: 'Noto Serif', Georgia, serif; font-size: 13px; line-height: 1.8; }

body.font-mono .article-content,
body.font-mono .mcq-question { font-family: 'Source Code Pro', monospace; font-size: 12px; line-height: 1.7; }

body.font-arabic .article-content,
body.font-arabic .mcq-question { font-family: 'Noto Naskh Arabic', serif; font-size: 15px; line-height: 2.0; }

/* ── CONTENT SIZE ── */
body.size-sm .article-content  { font-size: 12px !important; }
body.size-sm .mcq-question     { font-size: 16px !important; }
body.size-lg .article-content  { font-size: 16px !important; }
body.size-lg .mcq-question     { font-size: 21px !important; }
body.size-xl .article-content  { font-size: 18px !important; }
body.size-xl .mcq-question     { font-size: 23px !important; }

/* ── ARABIC RTL paragraphs ── */
.rtl-para {
   direction: rtl;
   text-align: right;
   font-family: 'Noto Naskh Arabic', serif;
   font-size: 15px;
   line-height: 2.0;
}

/* ══════════════════════════════════════════════
   LAYOUT
══════════════════════════════════════════════ */
.app-container {
   position: fixed;
   top: 0;
   left: 50%;
   transform: translateX(-50%);
   width: 100%;
   max-width: 450px;
   height: 100vh;
   background: var(--bg-color);
}

/* Desktop layout */
@media (min-width: 769px) {
   body { overflow: hidden; }
   .app-container {
       max-width: 100%;
       left: 0;
       transform: none;
       display: flex;
       flex-direction: row;
       gap: 0;
   }
   .scroller-container { flex: 0 0 460px; max-width: 460px; }
   .desktop-sidebar {
       display: flex !important;
       flex: 1;
       flex-direction: column;
       border-left: 1px solid var(--border-color);
       overflow-y: auto;
       max-width: 240px;
       min-width: 200px;
   }
   /* Hide mobile footer on desktop */
   .footer-bar { display: none !important; }
}

.desktop-sidebar {
   display: none;
}

.scroller-container {
   position: relative;
   width: 100%;
   height: 100vh;
   background: var(--bg-color);
   overflow: hidden;
}

.posts-wrapper {
   height: 100%;
   overflow-y: scroll;
   scroll-snap-type: y mandatory;
   scrollbar-width: none;
}
.posts-wrapper::-webkit-scrollbar { display: none; }

/* ══════════════════════════════════════════════
   ARTICLE CARD
══════════════════════════════════════════════ */
.article-card {
   position: relative;
   height: 100vh;
   scroll-snap-align: start;
   scroll-snap-stop: always;
   background: var(--bg-color);
   padding: 0;
   padding-top: calc(20px + env(safe-area-inset-top));
   display: flex;
   flex-direction: column;
}

.article-header {
   display: flex;
   align-items: center;
   gap: 12px;
   flex-shrink: 0;
   position: relative;
   z-index: 50;
   margin-bottom: 14px;
   padding: 0 18px;
}

.author-avatar {
   width: 42px; height: 42px;
   border-radius: 50%;
   background: linear-gradient(135deg, var(--accent), #8a6430);
   display: flex; align-items: center; justify-content: center;
   font-size: 17px; font-weight: 700;
   color: #0f0e0b;
   overflow: hidden; flex-shrink: 0;
   cursor: pointer;
   transition: opacity 0.15s, box-shadow 0.2s;
}
.author-avatar:hover { opacity: 0.9; box-shadow: 0 0 0 2px var(--accent); }
.author-avatar img { width: 100%; height: 100%; object-fit: cover; }
.author-info { flex: 1; }
.author-name {
   color: var(--text-primary);
   font-weight: 700; font-size: 14px; margin-bottom: 1px;
   cursor: pointer; display: inline-block;
   transition: color 0.15s; letter-spacing: -0.01em;
}
.author-name:hover { color: var(--accent); }
.article-date { color: var(--text-secondary); font-size: 11px; font-weight: 500; }

/* Follow button */
.follow-btn {
   position: relative; width: 32px; height: 32px;
   border-radius: 50%; border: 1.5px solid var(--border-color);
   background: var(--hover-bg); cursor: pointer;
   display: flex; align-items: center; justify-content: center;
   flex-shrink: 0;
   transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
   overflow: hidden; -webkit-tap-highlight-color: transparent;
}
.follow-btn:active { transform: scale(0.9); }
.follow-btn .icon-plus, .follow-btn .icon-bell {
   position: absolute; width: 15px; height: 15px;
   transition: opacity 0.25s, transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
}
.follow-btn .icon-plus { stroke: var(--text-secondary); fill: none; stroke-width: 2; opacity: 1; transform: scale(1) rotate(0deg); }
.follow-btn .icon-bell { stroke: var(--accent); fill: none; stroke-width: 1.8; opacity: 0; transform: scale(0.4) rotate(-20deg); }
.follow-btn.following { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 10px var(--accent-glow); }
.follow-btn.following .icon-plus { opacity: 0; transform: scale(0.4) rotate(90deg); }
.follow-btn.following .icon-bell { opacity: 1; transform: scale(1) rotate(0deg); }
@keyframes bellRing {
   0%{transform:scale(1) rotate(0deg)} 15%{transform:scale(1.15) rotate(-18deg)}
   30%{transform:scale(1.15) rotate(14deg)} 45%{transform:scale(1.08) rotate(-10deg)}
   60%{transform:scale(1.08) rotate(7deg)} 75%{transform:scale(1) rotate(-4deg)}
   90%{transform:scale(1) rotate(2deg)} 100%{transform:scale(1) rotate(0deg)}
}
.follow-btn.ringing .icon-bell { animation: bellRing 0.55s cubic-bezier(0.36,0.07,0.19,0.97) forwards; }

/* ── INLINE CARD EDIT CONTROLS ── */
.card-edit-controls {
   display: flex; gap: 6px; flex-shrink: 0;
}
.card-edit-btn {
   width: 32px; height: 32px; border-radius: 50%;
   border: 1.5px solid var(--border-color);
   background: var(--hover-bg); cursor: pointer;
   display: flex; align-items: center; justify-content: center;
   flex-shrink: 0; font-size: 12px;
   transition: all 0.2s;
}
.card-edit-btn.edit-trigger { color: var(--text-secondary); }
.card-edit-btn.edit-trigger:hover { border-color: var(--accent); color: var(--accent); }
.card-edit-btn.edit-confirm { color: #6abf85; border-color: rgba(106,191,133,0.4); background: rgba(106,191,133,0.08); display: none; }
.card-edit-btn.edit-confirm:hover { background: rgba(106,191,133,0.18); border-color: #6abf85; }
.card-edit-btn.edit-cancel { color: #c46a4e; border-color: rgba(196,106,78,0.4); background: rgba(196,106,78,0.08); display: none; }
.card-edit-btn.edit-cancel:hover { background: rgba(196,106,78,0.18); border-color: #c46a4e; }

/* editing state */
.article-card.is-editing .card-edit-btn.edit-trigger { display: none; }
.article-card.is-editing .card-edit-btn.edit-confirm { display: flex; }
.article-card.is-editing .card-edit-btn.edit-cancel { display: flex; }
.mcq-card.is-editing .card-edit-btn.edit-trigger { display: none; }
.mcq-card.is-editing .card-edit-btn.edit-confirm { display: flex; }
.mcq-card.is-editing .card-edit-btn.edit-cancel { display: flex; }

/* editable fields */
.editable-title {
   outline: none;
   border-radius: 6px;
   transition: background 0.2s, box-shadow 0.2s;
}
.is-editing .editable-title {
   background: var(--hover-bg);
   box-shadow: 0 0 0 2px var(--accent);
   padding: 4px 8px;
}
.editable-content {
   outline: none;
   border-radius: 6px;
   transition: background 0.2s;
   width: 100%;
   min-height: 60px;
   resize: none;
   font-family: var(--font-content);
   font-size: var(--content-size, 14px);
   line-height: 1.65;
   color: var(--text-primary);
   background: transparent;
   border: none;
}
.is-editing .article-content {
   background: rgba(200,169,110,0.04);
   border-radius: 8px;
   padding: 10px 18px 10px 18px !important;
}
.editable-content:focus {
   background: var(--hover-bg);
   outline: none;
}
.mcq-edit-wrap { display: flex; flex-direction: column; gap: 8px; padding: 0 18px; }
.mcq-edit-q {
   width: 100%; padding: 8px 12px;
   background: var(--hover-bg); border: 1.5px solid var(--accent);
   border-radius: 8px; color: var(--text-primary);
   font-family: var(--font-heading); font-size: 16px; font-weight: 700;
   outline: none; resize: none; line-height: 1.4;
}
.mcq-edit-opt-row { display: flex; align-items: center; gap: 8px; }
.mcq-edit-opt-input {
   flex: 1; padding: 8px 12px;
   background: var(--hover-bg); border: 1px solid var(--border-color);
   border-radius: 8px; color: var(--text-primary);
   font-family: var(--font-content); font-size: 13px; outline: none;
   transition: border-color 0.15s;
}
.mcq-edit-opt-input:focus { border-color: var(--accent); }
.mcq-edit-correct-btn {
   width: 26px; height: 26px; border-radius: 50%; border: none; cursor: pointer;
   background: var(--hover-bg); color: var(--text-secondary); font-size: 10px;
   display: flex; align-items: center; justify-content: center;
   flex-shrink: 0; transition: all 0.15s;
}
.mcq-edit-correct-btn.is-correct { background: #6abf85; color: #0f0e0b; }

.article-title {
   font-size: 20px; font-weight: 800; color: var(--text-primary);
   margin-bottom: 10px; line-height: 1.2; flex-shrink: 0;
   letter-spacing: -0.02em; padding: 0 18px;
   font-family: var(--font-heading);
}

.article-stats {
   display: flex; align-items: center; gap: 14px;
   margin-bottom: 10px; flex-shrink: 0; padding: 0 18px;
}
.stat-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); font-weight: 500; }
.stat-item.views i { color: var(--accent); }
.stat-item.likes i { color: #d4845a; }

.article-content {
   color: var(--text-primary);
   font-size: var(--content-size, 14px); line-height: 1.65;
   flex: 1; overflow-y: auto;
   padding: 0 18px; padding-right: 62px; padding-bottom: 110px;
   letter-spacing: 0.01em;
   text-align: justify;
   transition: font-size 0.2s, font-family 0.2s;
}
.article-content::-webkit-scrollbar { width: 2px; }
.article-content::-webkit-scrollbar-track { background: transparent; }
.article-content::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
.content-paragraph { margin-bottom: 12px; }

/* ── IMAGE ── */
.article-full-img-wrap {
   width: calc(100% + 80px);
   margin-left: -18px; margin-right: -62px;
   margin-bottom: 12px; margin-top: 4px;
   overflow: hidden;
}
.article-full-img-wrap img {
   width: 100%; height: auto; display: block;
   max-height: 340px; object-fit: cover;
}
.article-full-img-wrap .media-caption {
   font-size: 12px; color: var(--text-secondary);
   font-style: italic; padding: 7px 18px 0 18px;
}

/* ── YOUTUBE LINK (no custom player) ── */
.yt-link-wrap {
   display: flex; align-items: center; gap: 10px;
   padding: 12px 14px; border-radius: 10px;
   background: var(--hover-bg); border: 1px solid var(--border-color);
   margin: 10px 0; text-decoration: none; color: var(--text-primary);
   transition: border-color 0.15s;
}
.yt-link-wrap:hover { border-color: var(--accent); }
.yt-link-icon { color: #ff4444; font-size: 20px; flex-shrink: 0; }
.yt-link-text { font-size: 12px; font-weight: 600; flex: 1; }
.yt-link-arrow { color: var(--text-secondary); font-size: 11px; }

/* ══════════════════════════════════════════════
   MCQ CARD
══════════════════════════════════════════════ */
.mcq-card {
   position: relative; height: 100vh;
   scroll-snap-align: start; scroll-snap-stop: always;
   background: var(--bg-color);
   padding: 8px 18px 100px;
   padding-top: calc(20px + env(safe-area-inset-top));
   display: flex; flex-direction: column; overflow: hidden;
}
.mcq-badge {
   display: inline-flex; align-items: center; gap: 6px;
   background: var(--accent-soft); border: 1px solid rgba(200,169,110,0.3);
   border-radius: 20px; padding: 4px 12px;
   font-size: 10px; font-weight: 800; letter-spacing: 0.08em;
   text-transform: uppercase; color: var(--accent);
   margin-bottom: 16px; flex-shrink: 0; align-self: flex-start;
}
.mcq-question {
   font-size: 19px; font-weight: 800; color: var(--text-primary);
   line-height: 1.3; margin-bottom: 14px; flex-shrink: 0;
   padding-right: 50px; letter-spacing: -0.02em;
   font-family: var(--font-heading);
}
.mcq-media { padding-right: 60px; flex-shrink: 0; margin-bottom: 14px; }
.mcq-scroll-area {
   flex: 1; overflow-y: auto; padding-right: 60px;
   display: flex; flex-direction: column; gap: 0;
}
.mcq-scroll-area::-webkit-scrollbar { width: 2px; }
.mcq-scroll-area::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
.mcq-options { display: flex; flex-direction: column; gap: 9px; }
.mcq-option {
   display: flex; align-items: center; gap: 12px;
   padding: 13px 14px; border-radius: 12px;
   border: 1px solid var(--border-color); background: var(--hover-bg);
   cursor: pointer;
   transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
   text-align: left; font-size: 14px; font-weight: 500;
   color: var(--text-primary); line-height: 1.4;
   -webkit-tap-highlight-color: transparent; width: 100%;
}
.mcq-option:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 12px var(--accent-glow); }
.mcq-option .opt-letter {
   width: 26px; height: 26px; border-radius: 50%;
   border: 1.5px solid var(--border-color);
   display: flex; align-items: center; justify-content: center;
   font-size: 10px; font-weight: 800; flex-shrink: 0;
   color: var(--text-secondary); transition: all 0.15s;
}
.mcq-option .opt-text { flex: 1; }
.mcq-option:disabled { cursor: default; }
.mcq-option.selected-correct { border-color: #6abf85; background: rgba(106,191,133,0.08); box-shadow: 0 0 12px rgba(106,191,133,0.15); }
.mcq-option.selected-correct .opt-letter { background: #6abf85; border-color: #6abf85; color: #0f0e0b; }
.mcq-option.selected-wrong { border-color: #c46a4e; background: rgba(196,106,78,0.07); }
.mcq-option.selected-wrong .opt-letter { background: #c46a4e; border-color: #c46a4e; color: #fff; }
.mcq-option.reveal-correct { border-color: rgba(106,191,133,0.5); }
.mcq-option.reveal-correct .opt-letter { border-color: #6abf85; color: #6abf85; }
.mcq-result-msg {
   font-size: 13px; font-weight: 700; margin-top: 14px;
   min-height: 18px; color: var(--text-secondary); flex-shrink: 0;
}
.mcq-result-msg.correct { color: #6abf85; }
.mcq-result-msg.wrong   { color: #c46a4e; }

/* ── ACTION BUTTONS ── */
.action-buttons {
   position: absolute; right: 14px; bottom: 143px;
   display: flex; flex-direction: column; gap: 20px; z-index: 10;
   filter: drop-shadow(0 4px 16px rgba(0,0,0,0.7));
}
.action-btn {
   display: flex; flex-direction: column; align-items: center; gap: 3px;
   background: none; border: none; cursor: pointer; transition: transform 0.1s;
}
.action-btn:active { transform: scale(0.88); }
.action-btn svg { width: 26px; height: 26px; stroke: #fff; fill: none; stroke-width: 2; }
.action-btn span { color: #fff; font-size: 10px; font-weight: 700; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
.action-btn.like-btn svg { stroke: #fff; fill: none; transition: fill 0.2s, stroke 0.2s; }
.action-btn.like-btn.liked svg { fill: #d4845a; stroke: #d4845a; }

/* ── HEART BURST ── */
.heart-burst {
   position: fixed; pointer-events: none; z-index: 9999;
   transform: translate(-50%, -50%);
   animation: heartBurstAnim 0.72s cubic-bezier(0.16,1,0.3,1) forwards;
}
.heart-burst svg { width: 80px; height: 80px; filter: drop-shadow(0 0 14px rgba(200,169,110,0.6)); }
@keyframes heartBurstAnim {
   0%  {opacity:0; transform:translate(-50%,-50%) scale(0.25) rotate(-12deg);}
   28% {opacity:1; transform:translate(-50%,-50%) scale(1.3) rotate(4deg);}
   52% {opacity:1; transform:translate(-50%,-50%) scale(0.92) rotate(-2deg);}
   72% {opacity:0.9; transform:translate(-50%,-50%) scale(1.08) rotate(0deg);}
   100%{opacity:0; transform:translate(-50%,-50%) scale(0.8) rotate(0deg);}
}

/* ── MEDIA ── */
.media-embed { margin: 10px 0; max-width: 100%; }
.media-embed img { width: 100%; max-width: 100%; height: auto; border-radius: 10px; display: block; }
.media-caption { font-size: 12px; color: var(--text-secondary); margin-top: 5px; font-style: italic; }
.custom-audio-player {
   background: var(--hover-bg); border-radius: 12px; padding: 14px;
   display: flex; align-items: center; gap: 12px; max-width: 100%;
   border: 1px solid var(--border-color);
}
.play-btn {
   width: 40px; height: 40px; border-radius: 50%;
   background: var(--accent); border: none; color: #0f0e0b;
   cursor: pointer; display: flex; align-items: center; justify-content: center;
   font-size: 14px; transition: background 0.2s; flex-shrink: 0;
   box-shadow: 0 0 14px var(--accent-glow);
}
.play-btn:hover { background: var(--accent-hover); }
.audio-info { flex: 1; min-width: 0; overflow: hidden; }
.audio-title { font-size: 12px; font-weight: 600; margin-bottom: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-primary); }
.waveform-container { position: relative; height: 28px; background: var(--bg-color); border-radius: 6px; margin-bottom: 5px; cursor: pointer; overflow: hidden; }
.waveform-progress { position: absolute; top: 0; left: 0; height: 100%; background: var(--accent); opacity: 0.35; transition: width 0.1s linear; }
.waveform-bars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: space-around; padding: 0 4px; }
.waveform-bar { width: 2px; background: var(--text-secondary); border-radius: 2px; opacity: 0.5; }
.audio-time { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-secondary); }

/* ── SKELETON ── */
@keyframes shimmer { 0%,100%{opacity:0.4} 50%{opacity:0.85} }
.skeleton-base { background: var(--hover-bg); animation: shimmer 1.6s infinite; border-radius: 6px; }
.skeleton-card { position: relative; height: 100vh; scroll-snap-align: start; scroll-snap-stop: always; background: var(--bg-color); padding: 8px 18px 100px; padding-top: calc(20px + env(safe-area-inset-top)); display: flex; flex-direction: column; }
.skeleton-header { display: flex; align-items: center; gap: 12px; flex-shrink: 0; margin-bottom: 16px; }
.skeleton-avatar { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; }
.skeleton-author-block { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.skeleton-name { height: 13px; width: 110px; }
.skeleton-date { height: 9px; width: 65px; }
.skeleton-title { height: 22px; width: 88%; margin-bottom: 8px; border-radius: 6px; }
.skeleton-title-short { height: 22px; width: 62%; margin-bottom: 12px; border-radius: 6px; }
.skeleton-stats { display: flex; gap: 12px; margin-bottom: 14px; }
.skeleton-stat { height: 12px; width: 48px; }
.skeleton-line { height: 12px; margin-bottom: 9px; width: 100%; }
.skeleton-line.w90{width:90%}.skeleton-line.w75{width:75%}.skeleton-line.w80{width:80%}.skeleton-line.w65{width:65%}.skeleton-line.w95{width:95%}

/* ── SHARE / TOAST ── */
.share-toast {
   position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px);
   background: var(--hover-bg); border: 1px solid var(--border-color);
   border-radius: 14px; padding: 10px 18px;
   font-size: 13px; font-weight: 700; color: var(--text-primary);
   z-index: 9999; opacity: 0;
   transition: opacity 0.2s, transform 0.2s;
   pointer-events: none; white-space: nowrap;
   box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
.share-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── MOBILE COMMENTS (popup) ── */
.comments-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 199; opacity: 0; pointer-events: none; transition: opacity 0.3s; backdrop-filter: blur(4px); }
.comments-overlay.active { opacity: 1; pointer-events: all; }
.comments-popup {
   position: fixed; top: 50%; left: 50%;
   transform: translate(-50%, -50%) scale(0.9);
   width: calc(100% - 40px); max-width: 500px;
   height: 70vh; max-height: 600px;
   background: var(--hover-bg); border-radius: 20px; z-index: 200;
   opacity: 0; pointer-events: none;
   transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
   display: flex; flex-direction: column;
   box-shadow: 0 24px 80px rgba(0,0,0,0.7), 0 0 0 1px var(--border-color);
}
.comments-popup.active { opacity: 1; pointer-events: all; transform: translate(-50%,-50%) scale(1); }
.comments-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border-color); }
.comments-header h3 { font-size: 15px; font-weight: 700; }
.close-comments { background: none; border: none; color: var(--text-primary); font-size: 22px; cursor: pointer; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.close-comments:hover { background: var(--hover-bg); }
.comments-list { flex: 1; overflow-y: auto; padding: 14px 18px; }
.comments-list::-webkit-scrollbar { width: 3px; }
.comments-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
.comment-item { display: flex; gap: 10px; margin-bottom: 18px; }
.comment-avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #8a6430); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #0f0e0b; flex-shrink: 0; overflow: hidden; }
.comment-avatar img { width: 100%; height: 100%; object-fit: cover; }
.comment-content { flex: 1; }
.comment-author { font-weight: 700; font-size: 12px; margin-bottom: 3px; }
.comment-text { font-size: 13px; line-height: 1.5; margin-bottom: 5px; }
.comment-time { font-size: 10px; color: var(--text-secondary); }
.comment-time.uploading { color: var(--accent); font-style: italic; }
.comment-time.upload-error { color: #c46a4e; }
.comment-input-wrapper { padding: 10px 18px; border-top: 1px solid var(--border-color); border-radius: 0 0 20px 20px; }
.comment-input-container { display: flex; gap: 8px; align-items: center; }
.comment-input {
   flex: 1; background: var(--bg-color); border: 1px solid var(--border-color);
   border-radius: 20px; padding: 9px 14px; color: var(--text-primary);
   font-size: 16px; outline: none; transition: border-color 0.15s;
   font-family: var(--font-content);
}
.comment-input:focus { border-color: var(--accent); }
.send-comment-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); border: none; color: #0f0e0b; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.send-comment-btn:hover { background: var(--accent-hover); }
.send-comment-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.no-comments { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-secondary); gap: 10px; }
.no-comments i { font-size: 40px; opacity: 0.3; color: var(--accent); }
.loading-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-primary); gap: 14px; }
.spinner { width: 40px; height: 40px; border: 3px solid var(--border-color); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── DESKTOP SIDEBAR COMMENTS ── */
.ds-comments-panel {
   display: flex; flex-direction: column; flex: 1; min-height: 0;
}
.ds-comments-header {
   display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px;
   border-bottom: 1px solid var(--border-color); flex-shrink: 0;
}
.ds-comments-back {
   width: 26px; height: 26px; border-radius: 50%;
   background: var(--hover-bg); border: 1px solid var(--border-color);
   color: var(--text-secondary); cursor: pointer; font-size: 10px;
   display: flex; align-items: center; justify-content: center;
   transition: all 0.15s; flex-shrink: 0;
}
.ds-comments-back:hover { border-color: var(--accent); color: var(--accent); }
.ds-comments-title { font-size: 13px; font-weight: 700; flex: 1; }
.ds-comments-list { flex: 1; overflow-y: auto; padding: 10px 14px; }
.ds-comments-list::-webkit-scrollbar { width: 2px; }
.ds-comments-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
.ds-comment-input-area {
   flex-shrink: 0; padding: 8px 14px;
   border-top: 1px solid var(--border-color);
   display: flex; gap: 6px; align-items: center;
}
.ds-comment-input {
   flex: 1; background: var(--bg-color); border: 1px solid var(--border-color);
   border-radius: 16px; padding: 7px 12px; color: var(--text-primary);
   font-size: 13px; outline: none; transition: border-color 0.15s;
   font-family: var(--font-content);
}
.ds-comment-input:focus { border-color: var(--accent); }
.ds-send-btn { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); border: none; color: #0f0e0b; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
.ds-send-btn:hover { background: var(--accent-hover); }
.ds-send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── TERM POPUP ── */
.term-popup {
   position: fixed; width: 270px; max-width: calc(100vw - 24px);
   background: var(--hover-bg); border: 1px solid var(--border-color);
   border-radius: 12px; padding: 12px 14px 10px; z-index: 301;
   opacity: 0; pointer-events: none;
   transition: opacity 0.18s, transform 0.18s; transform: translateY(4px);
   box-shadow: 0 12px 40px rgba(0,0,0,0.6);
}
.term-popup.active { opacity: 1; pointer-events: all; transform: translateY(0); }
.term-popup-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.term-popup-term { font-size: 12px; font-weight: 900; color: var(--accent); flex: 1; margin-right: 8px; }
.term-popup-close { width: 20px; height: 20px; border-radius: 50%; background: var(--bg-color); border: none; color: var(--text-secondary); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.term-popup-divider { height: 1px; background: var(--border-color); margin-bottom: 9px; }
.term-popup-body { font-size: 12px; line-height: 1.6; color: var(--text-secondary); }
.term-link {
   color: var(--accent); border-bottom: 1px dashed rgba(200,169,110,0.45);
   cursor: pointer; font-weight: 600; transition: opacity 0.15s;
}
.term-link:hover { opacity: 0.75; }

/* ── FOOTER (mobile only) ── */
.footer-bar {
   position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
   width: 100%; max-width: 450px;
   background: rgba(15,14,11,0.96);
   border-top: 1px solid var(--border-color);
   padding: 8px 24px;
   padding-bottom: calc(8px + env(safe-area-inset-bottom));
   display: flex; justify-content: space-around; align-items: center;
   z-index: 100;
   backdrop-filter: blur(20px);
}
body.theme-absolute-light .footer-bar { background: rgba(255,255,255,0.96); }
.footer-btn {
   display: flex; flex-direction: column; align-items: center; gap: 3px;
   background: none; border: none; color: var(--text-secondary);
   cursor: pointer; transition: color 0.2s; padding: 6px 12px;
}
.footer-btn:hover { color: var(--text-primary); }
.footer-btn.active { color: var(--accent); }
.footer-btn i { font-size: 19px; }
.footer-btn span { font-size: 10px; font-weight: 600; }

/* ══════════════════════════════════════════════
   LIBRARY PICKER CARD — Profile movie-poster style
══════════════════════════════════════════════ */
.library-picker-card {
   position: relative; height: 100vh;
   scroll-snap-align: start; scroll-snap-stop: always;
   background: var(--bg-color);
   display: flex; flex-direction: column; overflow: hidden;
}

.lp-topbar {
   flex-shrink: 0;
   display: flex; align-items: center; justify-content: space-between;
   padding: calc(14px + env(safe-area-inset-top)) 18px 10px;
   border-bottom: 1px solid var(--border-color);
}
.lp-topbar-logo {
   display: flex; align-items: center; gap: 7px;
}
.lp-topbar-logo img { height: 22px; }
.lp-topbar-right { display: flex; align-items: center; gap: 8px; }
.lp-login-chip {
   display: flex; align-items: center; gap: 6px;
   font-size: 11px; font-weight: 600; color: var(--text-secondary);
   background: var(--hover-bg); border: 1px solid var(--border-color);
   border-radius: 20px; padding: 4px 10px; cursor: pointer;
   transition: border-color 0.15s;
}
.lp-login-chip.logged-in { color: var(--accent); border-color: rgba(200,169,110,0.3); background: var(--accent-soft); }
.lp-login-chip i { font-size: 10px; }
.lp-settings-btn {
   width: 32px; height: 32px; border-radius: 50%;
   background: var(--hover-bg); border: 1px solid var(--border-color);
   cursor: pointer; display: flex; align-items: center; justify-content: center;
   font-size: 13px; color: var(--text-secondary);
   transition: border-color 0.15s, color 0.15s;
}
.lp-settings-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Settings popover */
.lp-settings-popover {
   position: fixed; z-index: 500;
   background: var(--hover-bg); border: 1px solid var(--border-color);
   border-radius: 16px; padding: 14px;
   width: 240px;
   box-shadow: 0 12px 40px rgba(0,0,0,0.5);
   opacity: 0; pointer-events: none;
   transform: translateY(-8px) scale(0.97);
   transition: opacity 0.2s, transform 0.2s;
}
.lp-settings-popover.open {
   opacity: 1; pointer-events: all;
   transform: translateY(0) scale(1);
}
.lp-settings-popover-header {
   display: flex; align-items: center; justify-content: space-between;
   margin-bottom: 12px; padding-bottom: 10px;
   border-bottom: 1px solid var(--border-color);
}
.lp-settings-popover-title { font-size: 12px; font-weight: 800; color: var(--text-primary); }
.lp-settings-popover-close {
   width: 22px; height: 22px; border-radius: 50%;
   background: var(--bg-color); border: 1px solid var(--border-color);
   color: var(--text-secondary); cursor: pointer; font-size: 11px;
   display: flex; align-items: center; justify-content: center;
   transition: all 0.15s;
}
.lp-settings-popover-close:hover { border-color: var(--accent); color: var(--accent); }
.lp-settings-section { margin-bottom: 12px; }
.lp-settings-section:last-child { margin-bottom: 0; }
.lp-settings-label {
   font-size: 9px; font-weight: 800; letter-spacing: 0.1em;
   text-transform: uppercase; color: var(--text-secondary);
   margin-bottom: 7px;
}
.lp-settings-row {
   display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
}
.lp-pill {
   padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
   border: 1px solid var(--border-color); background: var(--bg-color);
   color: var(--text-secondary); cursor: pointer;
   transition: all 0.15s; white-space: nowrap;
   font-family: var(--font-content);
}
.lp-pill.active { background: var(--accent); color: #0f0e0b; border-color: var(--accent); }
.lp-pill:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
.lp-toggle-row {
   display: flex; align-items: center; justify-content: space-between;
}
.lp-toggle-label { font-size: 12px; font-weight: 600; color: var(--text-primary); }
.lp-toggle {
   width: 36px; height: 20px; border-radius: 10px;
   background: var(--border-color); cursor: pointer;
   position: relative; transition: background 0.2s; flex-shrink: 0;
}
.lp-toggle.on { background: var(--accent); }
.lp-toggle::after {
   content: ''; position: absolute; top: 2px; left: 2px;
   width: 16px; height: 16px; border-radius: 50%;
   background: #fff; transition: transform 0.2s;
}
.lp-toggle.on::after { transform: translateX(16px); }

/* lib scroll body */
.lp-body {
   flex: 1; overflow-y: auto; overflow-x: hidden;
   padding: 10px 0 0;
   display: flex; flex-direction: column;
}
.lp-body::-webkit-scrollbar { width: 2px; }
.lp-body::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

.lp-section-label {
   font-size: 10px; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase;
   color: var(--accent); display: flex; align-items: center; gap: 6px;
   padding: 6px 18px; flex-shrink: 0;
}

.lp-shelf-wrap { overflow: visible; margin-bottom: 14px; }
.lp-shelf {
   display: flex; gap: 12px;
   width: 100%; padding: 4px 18px 8px;
   overflow-x: auto; overflow-y: visible;
   scroll-snap-type: x mandatory;
   -webkit-overflow-scrolling: touch;
}
.lp-shelf::-webkit-scrollbar { height: 2px; }
.lp-shelf::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

/* ── Profile-style movie card (matches profile.html) ── */
.lp-movie-card {
   flex-shrink: 0; width: 110px;
   scroll-snap-align: start; cursor: pointer; position: relative;
   border-radius: 10px; overflow: visible;
   transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
}
.lp-movie-card:hover { transform: translateY(-4px) scale(1.02); z-index: 20; }
.lp-movie-card.selected { transform: translateY(-4px) scale(1.04); z-index: 20; }

/* poster: aspect-ratio 3/4 like profile.html lib-poster */
.lp-movie-poster {
   width: 110px;
   aspect-ratio: 3/4;
   border-radius: 10px; overflow: hidden; position: relative;
   background: linear-gradient(135deg, var(--hover-bg), var(--bg-color));
   border: 1px solid var(--border-color);
   box-shadow: 0 6px 20px rgba(0,0,0,0.5);
   transition: box-shadow 0.22s, border-color 0.22s;
}
.lp-movie-card.selected .lp-movie-poster {
   box-shadow: 0 0 0 2.5px var(--accent), 0 12px 32px var(--accent-glow);
   border-color: var(--accent);
}
.lp-movie-poster img { width: 100%; height: 100%; object-fit: cover; }

/* poster placeholder matching lib-poster-placeholder */
.lp-poster-placeholder {
   width: 100%; height: 100%;
   display: flex; flex-direction: column;
   align-items: center; justify-content: center; gap: 8px;
}
.lp-poster-letter { font-size: 24px; font-weight: 800; color: rgba(200,169,110,0.18); font-family: var(--font-heading); }
.lp-poster-icon { font-size: 16px; color: rgba(200,169,110,0.12); }

/* gradient overlay matching lib-poster-gradient */
.lp-movie-overlay {
   position: absolute; inset: 0;
   background: linear-gradient(to top, rgba(10,8,5,0.95) 0%, rgba(10,8,5,0.3) 50%, transparent 80%);
   display: flex; flex-direction: column; justify-content: flex-end; padding: 8px;
}

/* count chip matching lib-count-chip */
.lp-movie-count {
   display: inline-flex; align-items: center; gap: 3px;
   background: rgba(200,169,110,0.18); border: 1px solid rgba(200,169,110,0.25);
   backdrop-filter: blur(4px); border-radius: 5px; padding: 2px 6px;
   font-size: 9px; font-weight: 700; color: var(--accent);
   align-self: flex-start; margin-bottom: 4px;
}

/* title on poster like lib-poster-name */
.lp-movie-poster-name {
   font-size: 11px; font-weight: 700; color: #f5f0e8; line-height: 1.25;
   display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
   text-shadow: 0 1px 4px rgba(0,0,0,0.8);
}

/* selected checkmark matching lib-select-box feel */
.lp-selected-badge {
   position: absolute; top: 7px; right: 7px;
   background: var(--accent); border-radius: 50%;
   width: 20px; height: 20px;
   display: none; align-items: center; justify-content: center;
   font-size: 10px; color: #0f0e0b; font-weight: 800;
   z-index: 5;
}
.lp-movie-card.selected .lp-selected-badge { display: flex; }

/* meta below poster */
.lp-movie-info { padding: 5px 2px 0; }
.lp-movie-meta { font-size: 9px; color: var(--text-secondary); }

/* Bottom action row */
.lp-action-footer {
   flex-shrink: 0;
   padding: 10px 18px;
   padding-bottom: calc(10px + env(safe-area-inset-bottom) + 72px);
   border-top: 1px solid var(--border-color);
   background: var(--bg-color);
   display: flex; gap: 8px; align-items: center;
   transform: translateY(100%);
   transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
}
.lp-action-footer.visible { transform: translateY(0); }
.lp-begin-btn {
   flex: 1; padding: 13px; border-radius: 12px;
   background: var(--accent); color: #0f0e0b;
   font-size: 14px; font-weight: 800; border: none; cursor: pointer;
   display: flex; align-items: center; justify-content: center; gap: 7px;
   box-shadow: 0 4px 20px var(--accent-glow);
   font-family: var(--font-content);
   transition: background 0.15s;
}
.lp-begin-btn:hover { background: var(--accent-hover); }
.lp-all-btn {
   padding: 13px 14px; border-radius: 12px;
   background: var(--hover-bg); border: 1px solid var(--border-color);
   color: var(--text-secondary); font-size: 12px; font-weight: 700; cursor: pointer;
   font-family: var(--font-content);
   transition: border-color 0.15s, color 0.15s;
}
.lp-all-btn:hover { border-color: var(--accent); color: var(--accent); }

.lp-scroll-hint {
   display: flex; align-items: center; justify-content: center; gap: 6px;
   font-size: 11px; color: var(--text-secondary); font-weight: 500;
   padding: 12px 18px;
   padding-bottom: calc(12px + env(safe-area-inset-bottom) + 72px);
   flex-shrink: 0;
}

@keyframes lp-card-exit {
   0%{opacity:1;transform:translateY(0) scale(1)}
   100%{opacity:0;transform:translateY(-24px) scale(0.97)}
}
.library-picker-card.exiting { animation: lp-card-exit 0.35s cubic-bezier(0.4,0,0.2,1) forwards; pointer-events: none; }
.lp-loading { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 12px; padding: 30px 0; }

/* ══════════════════════════════════════════════
   EMOJI HIGHLIGHT EFFECTS
══════════════════════════════════════════════ */
body.emoji-off .emo-magnify,body.emoji-off .emo-pinned,body.emoji-off .emo-book,
body.emoji-off .emo-brain,body.emoji-off .emo-science,body.emoji-off .emo-micro,
body.emoji-off .emo-robot,body.emoji-off .emo-yellow,body.emoji-off .emo-red,
body.emoji-off .emo-green,body.emoji-off .emo-blue,body.emoji-off .emo-purple,
body.emoji-off .emo-dark,body.emoji-off .emo-idea,body.emoji-off .emo-urgent,
body.emoji-off .emo-warning,body.emoji-off .emo-check,body.emoji-off .emo-cross,
body.emoji-off .emo-target,body.emoji-off .emo-lock,body.emoji-off .emo-unlock,
body.emoji-off .emo-hourglass,body.emoji-off .emo-puzzle,body.emoji-off .emo-tag,
body.emoji-off .emo-fire,body.emoji-off .emo-diamond,body.emoji-off .emo-lightning,
body.emoji-off .emo-star,body.emoji-off .emo-sparkle,body.emoji-off .emo-rainbow,
body.emoji-off .emo-crown,body.emoji-off .emo-magic,body.emoji-off .emo-heart,
body.emoji-off .emo-happy,body.emoji-off .emo-calm,body.emoji-off .emo-wave,
body.emoji-off .emo-spin,body.emoji-off .emo-float,body.emoji-off .emo-rocket,
body.emoji-off .emo-cinematic,body.emoji-off .emo-sound,body.emoji-off .emo-signal,
body.emoji-off .emo-music,body.emoji-off .emo-cool,body.emoji-off .emo-balance,
body.emoji-off .emo-ice,body.emoji-off .emo-temple,body.emoji-off .emo-earth,
body.emoji-off .emo-money,body.emoji-off .emo-surprised {
   all: unset;
   color: inherit;
   font-size: inherit;
   font-family: inherit;
}
.emo-magnify { font-weight: 700; font-size: 1.12em; }
.emo-pinned { font-weight: 700; border-left: 2.5px solid var(--accent); padding-left: 0.5em; padding-right: 0.15em; background: linear-gradient(to right, var(--accent-soft), transparent); border-radius: 0 4px 4px 0; }
.emo-book { font-family: 'Merriweather', Georgia, serif; background: rgba(200,169,110,0.07); color: #d4b88a; padding: 0.06em 0.35em; border-radius: 4px; border: 1px solid rgba(200,169,110,0.18); font-size: 0.95em; }

<!-- Theme persistence -->
<script>
(function(){
   const t=localStorage.getItem('pth-theme')||'champagne';
   const f=localStorage.getItem('pth-font')||'default';
   const s=localStorage.getItem('pth-size')||'md';
   const e=localStorage.getItem('pth-emoji');
   applyTheme(t);applyFont(f);applySize(s);
   if(e==='off')document.body.classList.add('emoji-off');

   function applyTheme(th){
       ['champagne','absolute-dark','absolute-light'].forEach(x=>document.body.classList.remove('theme-'+x));
       if(th!=='champagne')document.body.classList.add('theme-'+th);
   }
   function applyFont(fo){
       ['merriweather','serif','mono','arabic'].forEach(x=>document.body.classList.remove('font-'+x));
       if(fo!=='default')document.body.classList.add('font-'+fo);
   }
   function applySize(sz){
       ['sm','lg','xl'].forEach(x=>document.body.classList.remove('size-'+x));
       if(sz!=='md')document.body.classList.add('size-'+sz);
   }

   window._applyTheme=applyTheme;
   window._applyFont=applyFont;
   window._applySize=applySize;
})();
</script>

<!-- Confetti -->
<script>
(function(){
   const canvas=document.getElementById('confettiCanvas'),ctx=canvas.getContext('2d');
   let particles=[],animFrame=null;
   function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
   window.addEventListener('resize',resize);resize();
   const COLORS=['#c8a96e','#e8d8a0','#a07840','#d4b86a','#7ab88a','#c97a5a','#8aa0c0','#f0e8d8'];
   function spawnParticles(x,y){
       for(let i=0;i<70;i++){const angle=Math.random()*Math.PI*2,speed=Math.random()*6+2;particles.push({x:x??canvas.width/2,y:y??canvas.height*0.4,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-3,size:Math.random()*6+3,color:COLORS[Math.floor(Math.random()*COLORS.length)],alpha:1,rotation:Math.random()*Math.PI*2,rotSpeed:(Math.random()-0.5)*0.2,shape:Math.random()>0.5?'rect':'circle'});}
       if(!animFrame)animate();
   }
   function animate(){
       ctx.clearRect(0,0,canvas.width,canvas.height);
       particles=particles.filter(p=>p.alpha>0.01);
       particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.vx*=0.99;p.alpha-=0.018;p.rotation+=p.rotSpeed;ctx.save();ctx.globalAlpha=Math.max(0,p.alpha);ctx.translate(p.x,p.y);ctx.rotate(p.rotation);ctx.fillStyle=p.color;if(p.shape==='rect'){ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);}else{ctx.beginPath();ctx.arc(0,0,p.size/2,0,Math.PI*2);ctx.fill();}ctx.restore();});
       if(particles.length>0){animFrame=requestAnimationFrame(animate);}else{animFrame=null;ctx.clearRect(0,0,canvas.width,canvas.height);}
   }
   window.launchConfetti=function(targetEl){if(targetEl){const r=targetEl.getBoundingClientRect();spawnParticles(r.left+r.width/2,r.top+r.height/2);}else{spawnParticles();}};
})();
</script>

<!-- Settings popover logic -->
<script>
(function(){
   let popoverOpen=false;

   window.closeSettingsPopover=function(){
       document.getElementById('settingsPopover').classList.remove('open');
       popoverOpen=false;
   };

   window.toggleSettingsPopover=function(btn){
       const pop=document.getElementById('settingsPopover');
       popoverOpen=!popoverOpen;
       if(popoverOpen){
           const r=btn.getBoundingClientRect();
           const top=r.bottom+8;
           const right=window.innerWidth-r.right;
           pop.style.top=top+'px';
           pop.style.right=Math.max(8,right)+'px';
           pop.style.left='auto';
           pop.classList.add('open');
           setTimeout(()=>document.addEventListener('click',outsideClose,{once:true}),10);
       } else {
           pop.classList.remove('open');
       }
   };

   function outsideClose(e){
       const pop=document.getElementById('settingsPopover');
       const btn=document.getElementById('lpSettingsBtn');
       if(!pop.contains(e.target)&&e.target!==btn&&!btn?.contains(e.target)){
           pop.classList.remove('open');popoverOpen=false;
       }
   }

   function syncPills(){
       const th=getActiveTheme();
       const fo=getActiveFont();
       const sz=getActiveSize();
       const emoOn=!document.body.classList.contains('emoji-off');

       ['sp-themes','ds-themes'].forEach(id=>{
           const el=document.getElementById(id);if(!el)return;
           el.querySelectorAll('.lp-pill,.ds-pill').forEach(p=>p.classList.toggle('active',p.dataset.theme===th));
       });
       ['sp-fonts','ds-fonts'].forEach(id=>{
           const el=document.getElementById(id);if(!el)return;
           el.querySelectorAll('.lp-pill,.ds-pill').forEach(p=>p.classList.toggle('active',p.dataset.font===fo));

<!-- Emoji rendering -->
<script>
const EMOJI_MAP={
   '🔍':'emo-magnify','❗':'emo-urgent','📌':'emo-pinned','🔥':'emo-fire','💎':'emo-diamond',
   '🟡':'emo-yellow','🔵':'emo-blue','🟢':'emo-green','🟣':'emo-purple','🔴':'emo-red',
   '⚫':'emo-dark','🧠':'emo-brain','📖':'emo-book','💡':'emo-idea','🎯':'emo-target',
   '🧩':'emo-puzzle','🏷️':'emo-tag','🔬':'emo-micro','⚠️':'emo-warning','✅':'emo-check',
   '❌':'emo-cross','⏳':'emo-hourglass','🔒':'emo-lock','🔓':'emo-unlock','⚡':'emo-lightning',
   '🌊':'emo-wave','🌀':'emo-spin','💫':'emo-float','🚀':'emo-rocket','🎬':'emo-cinematic',
   '🌟':'emo-star','✨':'emo-sparkle','🌈':'emo-rainbow','👑':'emo-crown','🪄':'emo-magic',
   '❤️':'emo-heart','😄':'emo-happy','😌':'emo-calm','😮':'emo-surprised','😎':'emo-cool',
   '🤖':'emo-robot','🧪':'emo-science','🏛️':'emo-temple','🌍':'emo-earth','💰':'emo-money',
   '⚖️':'emo-balance','📡':'emo-signal','🎵':'emo-music','🧊':'emo-ice','🔊':'emo-sound',
};

function buildEmojiPattern(){
   const keys=Object.keys(EMOJI_MAP).sort((a,b)=>b.length-a.length);
   const escaped=keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
   return new RegExp(`(${escaped})([\\s\\S]*?)\\1`,'gu');
}
function escHtmlET(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderTerms(html){
   return html.replace(/([A-Za-z][A-Za-z0-9\-']{0,60}?)&lt;([^&]{1,600}?)&gt;/g,function(match,term,explanation){
       const safeTerm=term.trim().replace(/'/g,'&#39;');
       const safeExp=explanation.replace(/'/g,'&#39;');
       return `<span class="term-link" onclick="openTermPopup('${safeTerm}','${safeExp}',event)">${term.trim()}</span>`;
   });
}
function isArabic(str){return /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/.test(str);}
function renderEmojiText(text,applyTerms=true){
   const re=buildEmojiPattern();
   let result='',lastIndex=0,match;
   while((match=re.exec(text))!==null){
       result+=escHtmlET(text.slice(lastIndex,match.index));
       const cls=EMOJI_MAP[match[1]];
       result+=`<span class="${cls}">${renderEmojiText(match[2],false)}</span>`;
       lastIndex=re.lastIndex;
   }
   result+=escHtmlET(text.slice(lastIndex));
   return applyTerms?renderTerms(result):result;
}

function renderParagraph(text){
   const html=renderEmojiText(text);
   const arabic=isArabic(text);
   return `<div class="content-paragraph${arabic?' rtl-para':''}">${html}</div>`;
}
</script>

<!-- Image dominant color -->
<script>
window._getImageDominantColor=function(imgEl,callback){
   try{
       const canvas=document.createElement('canvas');
       const SIZE=50;canvas.width=SIZE;canvas.height=SIZE;
       const ctx=canvas.getContext('2d');ctx.drawImage(imgEl,0,0,SIZE,SIZE);
       const data=ctx.getImageData(0,0,SIZE,SIZE).data;
       let r=0,g=0,b=0,cnt=0;
       for(let i=0;i<data.length;i+=4){const a=data[i+3];if(a<128)continue;r+=data[i];g+=data[i+1];b+=data[i+2];cnt++;}
       if(!cnt){callback(null);return;}
       r=Math.min(255,Math.round(r/cnt*1.6));g=Math.min(255,Math.round(g/cnt*1.6));b=Math.min(255,Math.round(b/cnt*1.6));
       callback(`rgb(${r},${g},${b})`);
   }catch(e){callback(null);}
};
</script>

       if(q)q.style.display='none';
       if(scrollArea)scrollArea.style.display='none';

       // build edit UI
       const existingEdit=card.querySelector('.mcq-edit-wrap');
       if(existingEdit)existingEdit.remove();

       const lines=(art.content||'').trim().split('\n').map(l=>l.trim()).filter(Boolean);
       const question=lines[0].replace(/^❔/,'').trim();
       const opts=lines.slice(1).map(l=>({label:l.replace(/^✅/,'').trim(),correct:l.startsWith('✅')}));

       const editWrap=document.createElement('div');
       editWrap.className='mcq-edit-wrap';
       editWrap.innerHTML=`<div class="ie-label" style="font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin-bottom:4px;">Question</div>
           <textarea class="mcq-edit-q" id="mcqeq_${articleId}" rows="3">${question}</textarea>
           <div class="ie-label" style="font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin:8px 0 4px;">Options</div>
           <div id="mcqeopts_${articleId}">
           ${opts.map((o,i)=>`<div class="mcq-edit-opt-row"><span style="width:18px;text-align:center;font-size:10px;font-weight:800;color:var(--text-secondary);">${'ABCDEF'[i]}</span><input class="mcq-edit-opt-input" value="${o.label.replace(/"/g,'&quot;')}" data-idx="${i}"><button class="mcq-edit-correct-btn${o.correct?' is-correct':''}" data-idx="${i}" onclick="mcqEditMarkCorrect(this,'${articleId}')"><i class="fas fa-check"></i></button></div>`).join('')}

window.mcqEditMarkCorrect=function(btn,articleId){
   const wrap=document.getElementById('mcqeopts_'+articleId);
   if(!wrap)return;
   wrap.querySelectorAll('.mcq-edit-correct-btn').forEach(b=>b.classList.remove('is-correct'));
   btn.classList.add('is-correct');
};

window.cancelCardEdit=function(btn){
   const card=btn.closest('.article-card,.mcq-card');
   if(!card)return;
   card.classList.remove('is-editing');
   const articleId=card.dataset.articleId;
   const art=articles.find(a=>String(a.id)===String(articleId));
   if(!art)return;
   // re-render the card to restore original state
   reRenderCard(String(articleId));
};

window.confirmCardEdit=async function(btn){
   const card=btn.closest('.article-card,.mcq-card');
   if(!card)return;
   if(btn.dataset.saving==='true')return;
   btn.dataset.saving='true';
   btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>';

   const articleId=card.dataset.articleId;
   const art=articles.find(a=>String(a.id)===String(articleId));
   if(!art||!window._supabase){btn.dataset.saving='false';btn.innerHTML='<i class="fas fa-check"></i>';return;}

   try{
       let updateData={};
       if(card.classList.contains('article-card')){
           const titleEl=card.querySelector('.article-title');
           const ta=card.querySelector('.editable-content');
           const newTitle=(titleEl?.innerText||'').trim();
           const newContent=(ta?.value||'').trim();
           if(!newTitle){showFeedToast('Title required');btn.dataset.saving='false';btn.innerHTML='<i class="fas fa-check"></i>';return;}
           updateData={title:newTitle,content:newContent};
       } else {
           const qEl=card.querySelector('.mcq-edit-q');
           const q=(qEl?.value||'').trim();
           if(!q){showFeedToast('Question required');btn.dataset.saving='false';btn.innerHTML='<i class="fas fa-check"></i>';return;}
           const optsInputs=card.querySelectorAll('.mcq-edit-opt-input');
           const correctBtns=card.querySelectorAll('.mcq-edit-correct-btn');
           if(!card.querySelector('.mcq-edit-correct-btn.is-correct')){showFeedToast('Mark one correct answer');btn.dataset.saving='false';btn.innerHTML='<i class="fas fa-check"></i>';return;}
           const lines=['❔'+q];
           optsInputs.forEach((inp,i)=>{
               const v=inp.value.trim();
               const isCorrect=correctBtns[i]?.classList.contains('is-correct');
               lines.push(isCorrect?'✅'+v:v);
           });
           updateData={title:q,content:lines.join('\n')};
       }
       const{error}=await window._supabase.from('articles').update(updateData).eq('id',articleId);
       if(error)throw error;
       const idx=articles.findIndex(a=>String(a.id)===String(articleId));
       if(idx!==-1){Object.assign(articles[idx],updateData);}
       card.classList.remove('is-editing');
       reRenderCard(String(articleId));
       showFeedToast('Saved ✓');
   }catch(e){showFeedToast('Error saving');}
   btn.dataset.saving='false';btn.innerHTML='<i class="fas fa-check"></i>';
};

// ── Media element (no custom YT player)
function createMediaElement(m,forArticleContent=false){
   const d=document.createElement('div');
   if(m.type==='image'){
       if(forArticleContent){
           d.className='article-full-img-wrap';
           d.innerHTML=`<img src="${m.url}" alt="${m.caption||''}" crossorigin="anonymous">${m.caption?`<div class="media-caption">${m.caption}</div>`:''}`;
       } else {
           d.className='media-embed';
           d.innerHTML=`<img src="${m.url}" alt="${m.caption||''}">${m.caption?`<div class="media-caption">${m.caption}</div>`:''}`;
       }
   } else if(m.type==='youtube'){
       // Plain link — no custom player
       const ytMatch=(m.url||'').match(/embed\/([A-Za-z0-9_-]{11})/);
       const videoId=ytMatch?ytMatch[1]:'';
       const href=videoId?`https://www.youtube.com/watch?v=${videoId}`:m.url;
       d.innerHTML=`<a class="yt-link-wrap" href="${href}" target="_blank" rel="noopener">
           <span class="yt-link-icon"><i class="fab fa-youtube"></i></span>
           <span class="yt-link-text">${m.caption||'Watch on YouTube'}</span>
           <span class="yt-link-arrow"><i class="fas fa-external-link-alt"></i></span>
       </a>`;
   } else if(m.type==='audio'){
       d.className='media-embed';
       const aid='audio_'+Math.random().toString(36).substr(2,9);
       const bars=Array(15).fill(0).map(()=>`<div class="waveform-bar" style="height:${Math.random()*60+20}%"></div>`).join('');
       d.innerHTML=`<div class="custom-audio-player">
           <button class="play-btn" onclick="toggleAudio(this,'${aid}')"><i class="fas fa-play"></i></button>
           <div class="audio-info">
               <div class="audio-title">${m.caption||'Audio'}</div>
               <div class="waveform-container" onclick="seekAudio(event,this,'${aid}')">
                   <div class="waveform-progress"></div><div class="waveform-bars">${bars}</div>
               </div>
               <div class="audio-time"><span class="current-time">0:00</span><span class="duration">0:00</span></div>
           </div>
           <audio id="${aid}" src="${m.url}" style="display:none;"></audio>
       </div>`;
       setTimeout(()=>{const a=document.getElementById(aid);if(a)a.addEventListener('loadedmetadata',()=>{const dur=Math.floor(a.duration);const dEl=a.closest('.custom-audio-player')?.querySelector('.duration');if(dEl)dEl.textContent=`${Math.floor(dur/60)}:${(dur%60).toString().padStart(2,'0')}`;});},100);
   }
   return d;
}

               <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
               <span>Share</span>
           </button>
       </div>`;

   // content
   const contentDiv=document.createElement('div');contentDiv.className='article-content';
   const paragraphs=(article.content||'').split('\n\n');

   div.querySelector('.article-stats').insertAdjacentElement('afterend',contentDiv);
   return div;

       </div>

               <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>

           </button>
           <button class="action-btn share-btn" data-id="${article.id}">
               <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
               <span>Share</span>
           </button>
       </div>`;

   if(article.media?.length){const mc=card.querySelector(`#mcq-media-${article.id}`);article.media.forEach(m=>mc.appendChild(createMediaElement(m,false)));}
   const optsContainer=card.querySelector(`#mcq-opts-${article.id}`);
   const msgEl=card.querySelector(`#mcq-msg-${article.id}`);
   let answered=false;
   options.forEach((opt,i)=>{
       const btn=document.createElement('button');btn.className='mcq-option';
       btn.innerHTML=`<span class="opt-letter">${letters[i]||i+1}</span><span class="opt-text">${renderEmojiText(opt.label)}</span>`;
       btn.addEventListener('click',()=>{

           if(opt.correct){btn.classList.add('selected-correct');msgEl.textContent='✓ Correct!';msgEl.className='mcq-result-msg correct';window.launchConfetti(btn);}

       });
       optsContainer.appendChild(btn);
   });
   return card;
}

// ── Double tap like
function setupDoubleTap(card,articleId){
   let lastTap=0;
   card.addEventListener('touchend',function(e){
       if(e.target.closest('button,a,.term-link,.action-buttons,.author-name,.author-avatar,.follow-btn,.card-edit-btn,.editable-title,.editable-content,.mcq-edit-wrap'))return;
       const now=Date.now(),touch=e.changedTouches[0];
       if(now-lastTap<320){triggerDoubleTapLike(card,articleId,touch.clientX,touch.clientY);e.preventDefault();}
       lastTap=now;
   },{passive:false});
   card.addEventListener('dblclick',function(e){
       if(e.target.closest('button,a,.term-link,.action-buttons,.author-name,.author-avatar,.follow-btn,.card-edit-btn,.editable-title,.editable-content,.mcq-edit-wrap'))return;
       triggerDoubleTapLike(card,articleId,e.clientX,e.clientY);
   });
}
function triggerDoubleTapLike(card,articleId,x,y){
   const likeBtn=card.querySelector('.like-btn');if(!likeBtn)return;
   if(!likeBtn.classList.contains('liked'))likeBtn.click();
   window.spawnHeartBurst(x,y);
}

const _lpSelected=new Set();

async function loadPickerLibraries(body,footer,hint){
   try{
       const{data:libs}=await supabase.from('playlists').select('id,name,description,thumbnail_url').order('name',{ascending:true});
       const{data:countRows}=await supabase.from('playlist_items').select('playlist_id');
       const countMap={};(countRows||[]).forEach(r=>{countMap[r.playlist_id]=(countMap[r.playlist_id]||0)+1;});
       const filteredLibs=(libs||[]).filter(l=>(countMap[l.id]||0)>0);
       if(!filteredLibs.length){body.innerHTML=`<div style="padding:30px 18px;font-size:12px;color:var(--text-secondary);">No libraries yet</div>`;return;}

       const favedLibs=filteredLibs.filter(l=>userFavLibs.has(String(l.id))).sort((a,b)=>(countMap[b.id]||0)-(countMap[a.id]||0));
       const otherLibs=filteredLibs.filter(l=>!userFavLibs.has(String(l.id))).sort((a,b)=>(countMap[b.id]||0)-(countMap[a.id]||0));

       body.innerHTML='';

       function addShelf(label,libs2){
           const lbl=document.createElement('div');lbl.className='lp-section-label';
           lbl.innerHTML=`<i class="fas fa-book-open"></i>${label}`;
           body.appendChild(lbl);
           const shelfWrap=document.createElement('div');shelfWrap.className='lp-shelf-wrap';
           const shelf=document.createElement('div');shelf.className='lp-shelf';
           libs2.forEach(lib=>shelf.appendChild(makeMovieCard(lib,countMap[lib.id]||0)));
           shelfWrap.appendChild(shelf);body.appendChild(shelfWrap);
       }

       if(favedLibs.length)addShelf('Saved',favedLibs);
       addShelf(favedLibs.length?'All Libraries':'Libraries',otherLibs);
   }catch(e){console.error(e);body.innerHTML=`<div style="padding:20px;font-size:12px;color:var(--text-secondary);">Failed to load</div>`;}
}

function makeMovieCard(lib,count){
   const card=document.createElement('div');
   card.className='lp-movie-card';card.dataset.id=lib.id;
   const letter=(lib.name||'?')[0].toUpperCase();

   // poster element (matches profile.html lib-poster layout)
   const posterEl=document.createElement('div');
   posterEl.className='lp-movie-poster';

   if(lib.thumbnail_url){
       const img=document.createElement('img');
       img.src=lib.thumbnail_url;img.alt=lib.name||'';img.loading='lazy';
       posterEl.appendChild(img);
   } else {
       const placeholder=document.createElement('div');
       placeholder.className='lp-poster-placeholder';
       placeholder.innerHTML=`<div class="lp-poster-letter">${letter}</div><div class="lp-poster-icon"><i class="fas fa-book-open"></i></div>`;
       posterEl.appendChild(placeholder);
   }

   // gradient overlay with count chip + name (like lib-poster-gradient)
   const overlay=document.createElement('div');
   overlay.className='lp-movie-overlay';
   overlay.innerHTML=`
       <div class="lp-movie-count"><i class="fas fa-layer-group"></i> ${count}</div>
       <div class="lp-movie-poster-name">${lib.name||'Untitled'}</div>`;
   posterEl.appendChild(overlay);

   // selected badge
   const badge=document.createElement('div');
   badge.className='lp-selected-badge';badge.textContent='✓';
   posterEl.appendChild(badge);

   card.appendChild(posterEl);

   // small meta below
   const meta=document.createElement('div');
   meta.className='lp-movie-info';
   meta.innerHTML=`<div class="lp-movie-meta">${count} article${count!==1?'s':''}</div>`;
   card.appendChild(meta);

   card.addEventListener('click',()=>{
       const id=String(lib.id);
       if(_lpSelected.has(id)){_lpSelected.delete(id);card.classList.remove('selected');}
       else{if(_lpSelected.size>=5)return;_lpSelected.add(id);card.classList.add('selected');}
       const actionFooter=document.getElementById('lpActionFooter');
       const scrollHint=document.getElementById('lpScrollHint');
       const selLabel=document.getElementById('lpSelLabel');
       const n=_lpSelected.size;
       if(n>0){actionFooter?.classList.add('visible');if(scrollHint)scrollHint.style.display='none';if(selLabel)selLabel.textContent=`(${n} selected)`;}
       else{actionFooter?.classList.remove('visible');if(scrollHint)scrollHint.style.display='';if(selLabel)selLabel.textContent='';}
   });
   return card;
}

window.lpStartFeedAll=function(){
   filteredArticleIds=null;
   animatePickerOut(()=>{articles=[];offset=0;hasMore=true;isLoading=false;clearSkeletons();loadArticles(true);});
};
window.lpStartFeedSelected=async function(){
   if(!_lpSelected.size)return;
   const btn=document.getElementById('lpBeginBtn');
   if(btn){btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Loading…';btn.disabled=true;}
   const ids=[..._lpSelected].map(Number);
   const{data:items}=await supabase.from('playlist_items').select('article_id').in('playlist_id',ids);
   const articleIds=[...new Set((items||[]).map(r=>r.article_id))];
   filteredArticleIds=articleIds.length?articleIds:null;
   animatePickerOut(()=>{articles=[];offset=0;hasMore=true;isLoading=false;clearSkeletons();loadArticles(true);});
};

function animatePickerOut(cb){
   const p=document.getElementById('libraryPickerCard');if(!p){cb();return;}
   p.classList.add('exiting');
   p.addEventListener('animationend',()=>{
       const sk=document.createElement('div');sk.className='skeleton-card';sk.innerHTML=skeletonCardHTML();
       p.replaceWith(sk);cb();
   },{once:true});
}
function clearSkeletons(){document.querySelectorAll('.skeleton-card').forEach(s=>s.remove());}

// ── Article loading
async function loadArticles(isInitial=true){
   if(isLoading||(!isInitial&&!hasMore))return;isLoading=true;
   try{
       if(isInitial&&anchorArticleId!==null){
           const{data:anchor,error}=await supabase.from('articles').select('*').eq('id',anchorArticleId).single();
           if(!error&&anchor){
               const{data:rest}=await supabase.from('articles').select('*').order('created_at',{ascending:false}).lt('created_at',anchor.created_at).limit(LIMIT-1);
               await enrichAndRender([anchor,...(rest||[])],isInitial);offset=LIMIT;isLoading=false;return;
           }
           anchorArticleId=null;
       }
       let query=supabase.from('articles').select('*').order('created_at',{ascending:false}).range(offset,offset+LIMIT-1);
       if(filteredArticleIds!==null){
           if(!filteredArticleIds.length){clearSkeletons();isLoading=false;return;}
           query=query.in('id',filteredArticleIds);
       }
       const{data:data2,error}=await query;
       if(error)throw error;
       if(!data2?.length){clearSkeletons();hasMore=false;isLoading=false;return;}
       if(data2.length<LIMIT)hasMore=false;
       offset+=data2.length;
       await enrichAndRender(data2,isInitial);
       isLoading=false;
   }catch(e){console.error(e);clearSkeletons();isLoading=false;}
}

async function enrichAndRender(data2,isInitial){
   const uids=[...new Set(data2.map(a=>a.firebase_user_id).filter(Boolean))];
   let usersData=[];
   if(uids.length){const{data:u}=await supabase.from('users').select('firebase_uid,username,full_name,pfp,user_id').in('firebase_uid',uids);usersData=u||[];}
   const artIds=data2.map(a=>a.id);
   const{data:mediaData}=await supabase.from('media').select('*').in('article_id',artIds).order('display_order',{ascending:true});
   const newArts=data2.map(a=>{
       const u=usersData.find(x=>x.firebase_uid===a.firebase_user_id);
       return{...a,author:u?.username?`@${u.username}`:(u?.full_name||'Anonymous'),authorPfp:u?.pfp||null,authorUsername:u?.username||null,authorSupaUserId:u?.user_id||null,media:(mediaData||[]).filter(m=>m.article_id===a.id)};
   });
   articles=[...articles,...newArts];
   renderArticles(isInitial);
}

function renderArticles(isInitial=true){
   const wrapper=document.getElementById('postsWrapper');
   if(isInitial){clearSkeletons();wrapper.querySelectorAll('.article-card,.mcq-card').forEach(c=>c.remove());}
   else{const last=wrapper.lastElementChild;if(last?.classList.contains('skeleton-card'))last.remove();}
   const startIndex=isInitial?0:articles.length-LIMIT;
   for(let i=startIndex;i<articles.length;i++){
       const a=articles[i];
       const card=isMCQ(a.content)?buildMCQCard(a,i):buildArticleCard(a,i);
       wrapper.appendChild(card);
       attachCardListeners(card,a);
   }
   if(hasMore){const sk=document.createElement('div');sk.className='skeleton-card';sk.innerHTML=skeletonCardHTML();wrapper.appendChild(sk);}
   if(isInitial){wrapper.addEventListener('scroll',handleScroll);loadCommentCounts();setupIntersectionObserver();}
   else{loadCommentCounts();}
}

// ── Like
async function handleLike(e){
   const btn=e.currentTarget,id=String(btn.dataset.id);
   const countSpan=btn.querySelector('.like-count');
   if(!currentUser){location.href='https://patholytica.com/login';return;}
   if(btn.dataset.processing==='true')return;btn.dataset.processing='true';
   const ud=window._currentUserData;if(!ud)return;
   const wasLiked=userLikes.has(id);
   const artIdx=articles.findIndex(a=>String(a.id)===id);
   const prevCount=artIdx!==-1?(articles[artIdx].likes||0):0;
   const newCount=wasLiked?Math.max(0,prevCount-1):prevCount+1;
   if(wasLiked){userLikes.delete(id);btn.classList.remove('liked');}
   else{userLikes.add(id);btn.classList.add('liked');}
   countSpan.textContent=formatNumber(newCount);
   if(artIdx!==-1)articles[artIdx].likes=newCount;
   const card=btn.closest('.article-card,.mcq-card');
   if(card){const s=card.querySelector('.stat-item.likes span');if(s)s.textContent=formatNumber(newCount);}
   try{
       await ensureSupabaseAuth();
       if(wasLiked){
           await supabase.from('likes').delete().eq('article_id',parseInt(id)).eq('user_id',ud.user_id);
           await supabase.rpc('decrement_likes',{article_id:parseInt(id)}).catch(async()=>{
               const{data:f}=await supabase.from('articles').select('likes').eq('id',id).single();
               await supabase.from('articles').update({likes:Math.max(0,(f?.likes||1)-1)}).eq('id',id);
           });
       } else {
           await supabase.from('likes').insert([{article_id:parseInt(id),user_id:ud.user_id}]).then(()=>{}).catch(()=>{});
           await supabase.rpc('increment_likes',{article_id:parseInt(id)}).catch(async()=>{
               const{data:f}=await supabase.from('articles').select('likes').eq('id',id).single();
               await supabase.from('articles').update({likes:(f?.likes||0)+1}).eq('id',id);
           });
       }
   }catch(err){
       if(wasLiked){userLikes.add(id);btn.classList.add('liked');}else{userLikes.delete(id);btn.classList.remove('liked');}
       countSpan.textContent=formatNumber(prevCount);
       if(artIdx!==-1)articles[artIdx].likes=prevCount;
   }finally{btn.dataset.processing='false';}
}

// ── Follow
window.handleFollow=async function(e,aFbUid,aSupaId){
   e.stopPropagation();
   if(!currentUser){location.href='https://patholytica.com/login';return;}
   const btn=e.currentTarget;if(btn.dataset.processing==='true')return;btn.dataset.processing='true';
   const ud=window._currentUserData;if(!ud)return;
   const supaUid=String(aSupaId),wasFollowing=userFollowing.has(supaUid);
   if(wasFollowing)userFollowing.delete(supaUid);else userFollowing.add(supaUid);
   updateFollowButtons();
   if(!wasFollowing){setTimeout(()=>{btn.classList.add('ringing');btn.addEventListener('animationend',()=>btn.classList.remove('ringing'),{once:true});},260);}
   try{
       await ensureSupabaseAuth();
       if(wasFollowing)await supabase.from('subscriptions').delete().eq('subscriber_id',ud.user_id).eq('author_id',parseInt(aSupaId));
       else await supabase.from('subscriptions').insert([{subscriber_id:ud.user_id,author_id:parseInt(aSupaId)}]);
   }catch(err){
       if(wasFollowing)userFollowing.add(supaUid);else userFollowing.delete(supaUid);updateFollowButtons();
   }finally{btn.dataset.processing='false';}
};

// ── Views
function setupIntersectionObserver(){
   const obs=new IntersectionObserver(entries=>{entries.forEach(entry=>{const id=entry.target.dataset.articleId;if(!id)return;if(entry.isIntersecting&&entry.intersectionRatio>=0.75)startViewTimer(id);else clearViewTimer(id);});},{threshold:[0.75]});
   document.querySelectorAll('.article-card,.mcq-card').forEach(c=>{if(c.dataset.articleId)obs.observe(c);});
}
function startViewTimer(id){if(viewedArticles.has(id)||viewTimers[id])return;viewTimers[id]=setTimeout(async()=>await incrementView(id),5000);}
function clearViewTimer(id){if(viewTimers[id]){clearTimeout(viewTimers[id]);delete viewTimers[id];}}
async function incrementView(id){
   if(viewedArticles.has(id))return;viewedArticles.add(id);
   try{
       const{data:a}=await supabase.from('articles').select('views').eq('id',id).single();
       const nv=(a?.views||0)+1;
       await supabase.from('articles').update({views:nv}).eq('id',id);
       const idx=articles.findIndex(x=>x.id===id);if(idx!==-1)articles[idx].views=nv;
       const card=document.querySelector(`.article-card[data-article-id="${id}"],.mcq-card[data-article-id="${id}"]`);
       if(card){const s=card.querySelector('.stat-item.views span');if(s)s.textContent=formatNumber(nv);}
   }catch(e){viewedArticles.delete(id);}
}

// ── Comments
async function loadCommentCounts(){
   try{
       const{data}=await supabase.from('comments').select('article_id');
       const counts={};(data||[]).forEach(c=>{counts[c.article_id]=(counts[c.article_id]||0)+1;});
       document.querySelectorAll('.comment-btn').forEach(btn=>{btn.querySelector('.comment-count').textContent=counts[btn.dataset.id]||0;});
   }catch(e){}
}

async function handleComments(e){
   const articleId=e.currentTarget.dataset.id;
   currentArticleId=articleId;
   if(isDesktop()){
       showDsComments(articleId);
   } else {
       await loadMobileComments(articleId);
       openComments();
   }
}

async function loadMobileComments(articleId){
   const list=document.getElementById('commentsList');
   list.innerHTML='<div class="loading-container"><div class="spinner" style="width:28px;height:28px;border-width:2px;"></div></div>';
   try{
       const{data:comments}=await supabase.from('comments').select('*').eq('article_id',articleId).order('created_at',{ascending:true});
       if(!comments?.length){list.innerHTML=`<div class="no-comments"><i class="fas fa-comments"></i><div>No comments yet</div></div>`;return;}
       const uids=[...new Set(comments.map(c=>c.user_id).filter(Boolean))];let usersMap={};
       if(uids.length){const{data:users}=await supabase.from('users').select('user_id,username,full_name,pfp').in('user_id',uids);if(users)users.forEach(u=>{usersMap[u.user_id]=u;});}
       list.innerHTML=comments.map(c=>{const u=usersMap[c.user_id],author=u?.username?`@${u.username}`:(u?.full_name||'Anonymous');const av=u?.pfp?`<img src="${u.pfp}">`:(u?.username||'A')[0].toUpperCase();return`<div class="comment-item"><div class="comment-avatar">${av}</div><div class="comment-content"><div class="comment-author">${author}</div><div class="comment-text">${renderEmojiText(c.comment_text)}</div><div class="comment-time">${formatDate(new Date(c.created_at))}</div></div></div>`;}).join('');
   }catch(e){list.innerHTML=`<div class="no-comments"><i class="fas fa-exclamation-triangle"></i><div>Failed to load</div></div>`;}
}

window.openComments=()=>{document.getElementById('commentsPopup').classList.add('active');document.getElementById('commentsOverlay').classList.add('active');};
window.closeComments=()=>{document.getElementById('commentsPopup').classList.remove('active');document.getElementById('commentsOverlay').classList.remove('active');};

window.sendComment=async function(){
   const input=document.getElementById('commentInput'),text=input.value.trim();
   if(!text||!currentArticleId||!currentUser)return;
   const ud=window._currentUserData;if(!ud)return;
   const btn=document.getElementById('sendCommentBtn');btn.disabled=true;

   const list=document.getElementById('commentsList');
   // Remove empty state if present
   const emptyEl=list.querySelector('.no-comments');
   if(emptyEl)emptyEl.remove();

   // Optimistic render
   const tempId='tmp_'+Date.now();
   const authorName=ud.username?`@${ud.username}`:'Anonymous';
   const av=(ud.username||'A')[0].toUpperCase();
   const tempHTML=`<div class="comment-item" id="cmnt_${tempId}">
       <div class="comment-avatar">${av}</div>
       <div class="comment-content">
           <div class="comment-author">${authorName}</div>
           <div class="comment-text">${renderEmojiText(text)}</div>
           <div class="comment-time uploading">Uploading…</div>
       </div>
   </div>`;
   list.insertAdjacentHTML('beforeend',tempHTML);
   list.scrollTop=list.scrollHeight;
   input.value='';

   // update count optimistically
   const cb=document.querySelector(`.comment-btn[data-id="${currentArticleId}"]`);
   if(cb){const cs=cb.querySelector('.comment-count');cs.textContent=parseInt(cs.textContent)+1;}

   try{
       await ensureSupabaseAuth();
       await supabase.from('comments').insert([{article_id:parseInt(currentArticleId),user_id:ud.user_id,comment_text:text}]);
       const tempEl=document.getElementById('cmnt_'+tempId);
       if(tempEl){const timeEl=tempEl.querySelector('.comment-time');if(timeEl){timeEl.className='comment-time';timeEl.textContent='Just now';}}
   }catch(e){
       const tempEl=document.getElementById('cmnt_'+tempId);
       if(tempEl){const timeEl=tempEl.querySelector('.comment-time');if(timeEl){timeEl.className='comment-time upload-error';timeEl.textContent='Failed to send';}}
       if(cb){const cs=cb.querySelector('.comment-count');cs.textContent=Math.max(0,parseInt(cs.textContent)-1);}
   }finally{btn.disabled=false;}
};
document.getElementById('commentInput').addEventListener('keypress',e=>{if(e.key==='Enter')window.sendComment();});

function handleScroll(e){const c=e.target;if(c.scrollTop+c.clientHeight>=c.scrollHeight*0.8&&hasMore&&!isLoading)loadArticles(false);}

// ── Toast
function showFeedToast(msg){
   const t=document.getElementById('shareToast');
   t.textContent=msg;t.classList.add('show');
   clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2500);
}

// ── reRenderCard
function reRenderCard(articleId){
   const art=articles.find(a=>String(a.id)===String(articleId));if(!art)return;
   const existing=document.querySelector(`.article-card[data-article-id="${articleId}"],.mcq-card[data-article-id="${articleId}"]`);
   if(!existing)return;
   const idx=parseInt(existing.dataset.index)||0;
   const newCard=isMCQ(art.content)?buildMCQCard(art,idx):buildArticleCard(art,idx);
   existing.replaceWith(newCard);
   attachCardListeners(newCard,art);
}

// ── Expose globals
window.articles=articles;
window.isMCQ=isMCQ;
window.buildMCQCard=buildMCQCard;
window.buildArticleCard=buildArticleCard;
window.attachCardListeners=attachCardListeners;
window.reRenderCard=reRenderCard;
window.showFeedToast=showFeedToast;

// ── Init
initLibraryPicker();
</script>
