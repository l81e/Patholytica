/* ══════════════════════════════════════════════
   CSS VARIABLES — DARK (default) + LIGHT only
══════════════════════════════════════════════ */
:root {
  --bg-color: #0f0e0b;
  --text-primary: #f5f0e8;
  --text-secondary: #8a8070;
  --card-bg: #0f0e0b;
  --hover-bg: #1a1810;
  --border-color: #2a2518;
  --accent: #c8a96e;
  --accent-hover: #b8935a;
  --accent-glow: rgba(200,169,110,0.25);
  --accent-soft: rgba(200,169,110,0.12);
  --font-article: 'Merriweather', serif;
  --font-ui: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-size-base: 14px;
  --font-size-title: 20px;
  --font-size-mcq: 19px;
  --action-btn-stroke: #fff;
}

body.theme-dark {
  --bg-color: #0f0e0b;
  --text-primary: #f5f0e8;
  --text-secondary: #8a8070;
  --card-bg: #0f0e0b;
  --hover-bg: #1a1810;
  --border-color: #2a2518;
  --accent: #c8a96e;
  --accent-hover: #b8935a;
  --accent-glow: rgba(200,169,110,0.25);
  --accent-soft: rgba(200,169,110,0.12);
  --action-btn-stroke: #fff;
}

body.theme-light {
  --bg-color: #faf6ee;
  --text-primary: #1a1710;
  --text-secondary: #706050;
  --card-bg: #faf6ee;
  --hover-bg: #f0ebe0;
  --border-color: #e0d8c8;
  --accent: #a07840;
  --accent-hover: #8a6430;
  --accent-glow: rgba(160,120,64,0.2);
  --accent-soft: rgba(160,120,64,0.08);
  --action-btn-stroke: #1c1a14;
}

/* ── FONT FAMILIES ── */
body.font-serif  { --font-article: 'Merriweather', serif;    --font-ui: 'DM Sans', sans-serif; }
body.font-slab   { --font-article: 'Source Serif 4', serif;  --font-ui: 'DM Sans', sans-serif; }
body.font-modern { --font-article: 'Inter', sans-serif;       --font-ui: 'Inter', sans-serif; }

/* ── FONT SIZES ── */
body.fontsize-sm { --font-size-base: 12px; --font-size-title: 17px; --font-size-mcq: 16px; }
body.fontsize-md { --font-size-base: 14px; --font-size-title: 20px; --font-size-mcq: 19px; }
body.fontsize-lg { --font-size-base: 16px; --font-size-title: 23px; --font-size-mcq: 21px; }
body.fontsize-xl { --font-size-base: 18px; --font-size-title: 26px; --font-size-mcq: 24px; }

/* ── EMOJI EFFECTS OFF ── */
body.no-emoji-effects .emo-fire,body.no-emoji-effects .emo-diamond,body.no-emoji-effects .emo-lightning,
body.no-emoji-effects .emo-sparkle,body.no-emoji-effects .emo-rainbow,body.no-emoji-effects .emo-magic,
body.no-emoji-effects .emo-earth,body.no-emoji-effects .emo-purple,body.no-emoji-effects .emo-idea,
body.no-emoji-effects .emo-urgent,body.no-emoji-effects .emo-target,body.no-emoji-effects .emo-wave,
body.no-emoji-effects .emo-spin,body.no-emoji-effects .emo-float,body.no-emoji-effects .emo-rocket,
body.no-emoji-effects .emo-cinematic,body.no-emoji-effects .emo-star,body.no-emoji-effects .emo-crown,
body.no-emoji-effects .emo-heart,body.no-emoji-effects .emo-happy,body.no-emoji-effects .emo-calm,
body.no-emoji-effects .emo-surprised,body.no-emoji-effects .emo-signal,body.no-emoji-effects .emo-music,
body.no-emoji-effects .emo-sound,body.no-emoji-effects .emo-magnify,body.no-emoji-effects .emo-pinned,
body.no-emoji-effects .emo-book,body.no-emoji-effects .emo-brain,body.no-emoji-effects .emo-science,
body.no-emoji-effects .emo-micro,body.no-emoji-effects .emo-robot,body.no-emoji-effects .emo-yellow,
body.no-emoji-effects .emo-red,body.no-emoji-effects .emo-green,body.no-emoji-effects .emo-blue,
body.no-emoji-effects .emo-dark,body.no-emoji-effects .emo-check,body.no-emoji-effects .emo-cross,
body.no-emoji-effects .emo-hourglass,body.no-emoji-effects .emo-lock,body.no-emoji-effects .emo-unlock,
body.no-emoji-effects .emo-puzzle,body.no-emoji-effects .emo-tag,body.no-emoji-effects .emo-cool,
body.no-emoji-effects .emo-balance,body.no-emoji-effects .emo-ice,body.no-emoji-effects .emo-temple,
body.no-emoji-effects .emo-money,body.no-emoji-effects .emo-warning {
  animation: none !important;
  background: none !important;
  -webkit-background-clip: unset !important;
  -webkit-text-fill-color: unset !important;
  background-clip: unset !important;
  filter: none !important;
  text-shadow: none !important;
  color: var(--text-primary) !important;
  border: none !important;
  padding: 0 !important;
  font-style: normal !important;
  font-weight: inherit !important;
  font-family: inherit !important;
  letter-spacing: normal !important;
}

/* ══════════════════════════════════════════════
   BASE
══════════════════════════════════════════════ */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-ui);
  background: var(--bg-color);
  color: var(--text-primary);
  overflow: hidden;
  transition: background 0.2s ease, color 0.2s ease;
  position: fixed;
  width: 100%;
  height: 100%;
}

.app-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 100vh;
  background: var(--bg-color);
  display: flex;
  flex-direction: row;
}

.scroller-container {
  position: relative;
  flex: 1;
  height: 100vh;
  background: var(--bg-color);
  overflow: hidden;
  min-width: 0;
}

.posts-wrapper {
  height: 100%;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
}
.posts-wrapper::-webkit-scrollbar { display: none; }

/* Item 1 fix: while the feed hasn't finished its very first paint,
   nothing in the wrapper should be visible at all. JS removes this
   class only once the first article/MCQ card is in the DOM AND the
   scroll position has already been snapped past the picker, so the
   user's very first frame is the article, never the picker. */
.posts-wrapper.pre-reveal {
  visibility: hidden;
}

/* ── DESKTOP LAYOUT ── */
.desktop-sidebar { display: none; }

@media (min-width: 769px) {
  body { overflow: hidden; }

  .app-container {
    max-width: none;
    left: 0;
    transform: none;
    display: flex;
    flex-direction: row;
    height: 100vh;
    width: 100%;
  }

  .scroller-container {
    flex: 1;
    max-width: none;
    min-width: 0;
  }

  .desktop-sidebar {
    display: flex !important;
    flex-direction: column;
    border-left: 1px solid var(--border-color);
    overflow-y: auto;
    width: 220px;
    min-width: 220px;
    max-width: 220px;
    flex-shrink: 0;
    transition: width 0.3s cubic-bezier(0.4,0,0.2,1),
                min-width 0.3s cubic-bezier(0.4,0,0.2,1),
                opacity 0.2s ease;
    position: relative;
  }

  .desktop-sidebar.collapsed {
    width: 36px;
    min-width: 36px;
    max-width: 36px;
    overflow: hidden;
  }

  .desktop-sidebar.collapsed .ds-sidebar-inner {
    opacity: 0;
    pointer-events: none;
  }

  .ds-sidebar-inner {
    opacity: 1;
    transition: opacity 0.2s ease;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    min-width: 220px;
  }

  .ds-collapse-btn {
    position: absolute;
    top: 50%;
    left: 0;
    transform: translateY(-50%);
    width: 20px;
    height: 48px;
    background: var(--hover-bg);
    border: 1px solid var(--border-color);
    border-right: none;
    border-radius: 6px 0 0 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    font-size: 10px;
    z-index: 10;
    transition: color 0.15s, background 0.15s;
    flex-shrink: 0;
  }
  .ds-collapse-btn:hover { color: var(--accent); background: var(--accent-soft); }

  /* Issue 3b fix: on desktop the mobile footer is hidden, so the
     picker's Begin/Browse-All actions must live somewhere visible.
     They render inside this in-card bar instead, only on desktop. */
  .footer-bar { display: none !important; }

  .lp-desktop-actionbar {
    display: flex !important;
  }
}

/* On mobile, restore single-column layout */
@media (max-width: 768px) {
  .app-container {
    left: 50%;
    transform: translateX(-50%);
    max-width: 450px;
    flex-direction: column;
  }
  .scroller-container {
    flex: none;
    width: 100%;
    height: 100vh;
  }
}

/* ══════════════════════════════════════════════
   ARTICLE CARD
══════════════════════════════════════════════ */
.article-card {
  position: relative;
  height: 100vh;
  scroll-snap-align: start; scroll-snap-stop: always;
  background: var(--bg-color);
  padding: 0;
  padding-top: calc(20px + env(safe-area-inset-top));
  display: flex; flex-direction: column;
}

.article-header {
  display: flex; align-items: center; gap: 12px;
  flex-shrink: 0; position: relative; z-index: 50;
  margin-bottom: 14px; padding: 0 18px;
}

.author-avatar {
  width: 42px; height: 42px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #8a6430);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 700; color: #0f0e0b;
  overflow: hidden; flex-shrink: 0; cursor: pointer;
  transition: opacity 0.15s ease, box-shadow 0.2s ease;
}
.author-avatar:hover { opacity: 0.9; box-shadow: 0 0 0 2px var(--accent); }
.author-avatar img { width: 100%; height: 100%; object-fit: cover; }
.author-info { flex: 1; }
.author-name {
  color: var(--text-primary); font-weight: 700; font-size: 14px;
  margin-bottom: 1px; cursor: pointer; display: inline-block;
  transition: color 0.15s ease; letter-spacing: -0.01em;
}
.author-name:hover { color: var(--accent); }
.article-date { color: var(--text-secondary); font-size: 11px; font-weight: 500; }

/* ── FOLLOW BUTTON ── */
.follow-btn {
  position: relative; width: 32px; height: 32px;
  border-radius: 50%; border: 1.5px solid var(--border-color);
  background: var(--hover-bg); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
  overflow: hidden; -webkit-tap-highlight-color: transparent;
}
.follow-btn:active { transform: scale(0.9); }
.follow-btn .icon-plus, .follow-btn .icon-bell {
  position: absolute; width: 15px; height: 15px;
  transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
}
.follow-btn .icon-plus { stroke: var(--text-secondary); fill: none; stroke-width: 2; opacity: 1; transform: scale(1) rotate(0deg); }
.follow-btn .icon-bell { stroke: var(--accent); fill: none; stroke-width: 1.8; opacity: 0; transform: scale(0.4) rotate(-20deg); }
.follow-btn.following { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 10px var(--accent-glow); }
.follow-btn.following .icon-plus { opacity: 0; transform: scale(0.4) rotate(90deg); }
.follow-btn.following .icon-bell { opacity: 1; transform: scale(1) rotate(0deg); }
@keyframes bellRing {
  0%{transform:scale(1) rotate(0deg)} 20%{transform:scale(1.1) rotate(-12deg)}
  40%{transform:scale(1.1) rotate(10deg)} 60%{transform:scale(1.05) rotate(-6deg)}
  80%{transform:scale(1) rotate(3deg)} 100%{transform:scale(1) rotate(0deg)}
}
.follow-btn.ringing .icon-bell { animation: bellRing 0.5s ease forwards; }

/* ── EDIT BUTTON ── */
.card-edit-btn {
  width: 32px; height: 32px; border-radius: 50%;
  border: 1.5px solid var(--border-color);
  background: var(--hover-bg); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 12px; color: var(--text-secondary);
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.card-edit-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* ── TITLES & STATS ── */
.article-title {
  font-size: var(--font-size-title); font-weight: 800; color: var(--text-primary);
  margin-bottom: 10px; line-height: 1.2; flex-shrink: 0;
  letter-spacing: -0.02em; padding: 0 18px;
  font-family: var(--font-article);
  transition: font-size 0.3s ease;
}
.article-title-link, .mcq-question-link {
  cursor: pointer;
  transition: color 0.15s ease;
}
.article-title-link:hover, .mcq-question-link:hover { color: var(--accent); }
.article-title-link:active, .mcq-question-link:active { color: var(--accent-hover); }

.article-stats {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 10px; flex-shrink: 0; padding: 0 18px;
}
.stat-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); font-weight: 500; }
.stat-item.views i { color: var(--accent); }
.stat-item.likes i { color: #d4845a; }

/* ── CONTENT ── */
.article-content {
  color: var(--text-primary);
  font-size: var(--font-size-base); line-height: 1.65;
  flex: 1; overflow-y: auto;
  padding: 0 18px; padding-right: 62px; padding-bottom: 110px;
  letter-spacing: 0.01em; text-align: justify;
  font-family: var(--font-article);
  transition: font-size 0.3s ease;
}
.article-content::-webkit-scrollbar { width: 2px; }
.article-content::-webkit-scrollbar-track { background: transparent; }
.article-content::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
.content-paragraph { margin-bottom: 12px; }

/* ── FULL-WIDTH IMAGE ── */
.article-full-img-wrap {
  width: calc(100% + 80px);
  margin-left: -18px; margin-right: -62px;
  margin-bottom: 12px; margin-top: 4px; overflow: hidden;
}
.article-full-img-wrap img { width: 100%; height: auto; display: block; max-height: 340px; object-fit: cover; }
.article-full-img-wrap .media-caption { font-size: 12px; color: var(--text-secondary); font-style: italic; padding: 7px 18px 0 18px; }

/* ── YOUTUBE EMBED ── */
.article-full-yt-wrap {
  width: calc(100% + 80px);
  margin-left: -18px; margin-right: -62px;
  margin-bottom: 12px; margin-top: 4px;
  overflow: hidden; background: var(--bg-color);
}
.article-full-yt-wrap iframe { width: 100%; aspect-ratio: 16/9; border: none; display: block; }
.article-full-yt-wrap .media-caption {
  font-size: 12px; color: var(--text-secondary); font-style: italic;
  padding: 7px 18px 0 18px; background: var(--bg-color);
}

/* ── ACTION BUTTONS ── */
.action-buttons {
  position: absolute; right: 14px; bottom: 143px;
  display: flex; flex-direction: column; gap: 20px; z-index: 10;
  filter: drop-shadow(0 4px 16px rgba(0,0,0,0.7));
}
body.theme-light .action-buttons {
  filter: none;
}
.action-btn {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; cursor: pointer; transition: transform 0.1s;
}
.action-btn:active { transform: scale(0.88); }
.action-btn svg { width: 26px; height: 26px; stroke: var(--action-btn-stroke); fill: none; stroke-width: 2; }
.action-btn span { color: var(--action-btn-stroke); font-size: 10px; font-weight: 700; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
.action-btn.like-btn svg { stroke: var(--action-btn-stroke); fill: none; transition: fill 0.2s ease, stroke 0.2s ease; }
.action-btn.like-btn.liked svg { fill: #d4845a; stroke: #d4845a; }
body.theme-light .action-btn span {
  text-shadow: none;
}
/* ══════════════════════════════════════════════
   MCQ CARD
══════════════════════════════════════════════ */
.mcq-card {
  position: relative; height: 100vh;
  scroll-snap-align: start; scroll-snap-stop: always;
  background: var(--bg-color);
  padding: 8px 18px 100px;
  padding-top: calc(20px + env(safe-area-inset-top));
  display: flex; flex-direction: column; overflow: hidden;
}
.mcq-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--accent-soft); border: 1px solid rgba(200,169,110,0.3);
  border-radius: 20px; padding: 4px 12px;
  font-size: 10px; font-weight: 800; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--accent);
  margin-bottom: 16px; flex-shrink: 0; align-self: flex-start;
}
.mcq-question {
  font-size: var(--font-size-mcq); font-weight: 800; color: var(--text-primary);
  line-height: 1.3; margin-bottom: 14px; flex-shrink: 0;
  padding-right: 50px; letter-spacing: -0.02em;
  font-family: var(--font-article);
  transition: font-size 0.3s ease;
}
.mcq-media { padding-right: 60px; flex-shrink: 0; margin-bottom: 14px; }
.mcq-scroll-area { flex: 1; overflow-y: auto; padding-right: 60px; display: flex; flex-direction: column; }
.mcq-scroll-area::-webkit-scrollbar { width: 2px; }
.mcq-scroll-area::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
.mcq-options { display: flex; flex-direction: column; gap: 9px; }
.mcq-option {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 14px; border-radius: 12px;
  border: 1px solid var(--border-color); background: var(--hover-bg);
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  text-align: left; font-size: var(--font-size-base); font-weight: 500;
  color: var(--text-primary); line-height: 1.4;
  -webkit-tap-highlight-color: transparent; width: 100%;
  transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease, font-size 0.3s ease;
}
.mcq-option:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 10px var(--accent-glow); }
.mcq-option .opt-letter {
  width: 26px; height: 26px; border-radius: 50%;
  border: 1.5px solid var(--border-color);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 800; flex-shrink: 0;
  color: var(--text-secondary); transition: all 0.15s ease;
}
.mcq-option .opt-text { flex: 1; }
.mcq-option:disabled { cursor: default; }
.mcq-option.selected-correct { border-color: #6abf85; background: rgba(106,191,133,0.08); box-shadow: 0 0 10px rgba(106,191,133,0.12); }
.mcq-option.selected-correct .opt-letter { background: #6abf85; border-color: #6abf85; color: #0f0e0b; }
.mcq-option.selected-wrong { border-color: #c46a4e; background: rgba(196,106,78,0.07); }
.mcq-option.selected-wrong .opt-letter { background: #c46a4e; border-color: #c46a4e; color: #fff; }
.mcq-option.reveal-correct { border-color: rgba(106,191,133,0.5); }
.mcq-option.reveal-correct .opt-letter { border-color: #6abf85; color: #6abf85; }
.mcq-result-msg { font-size: 13px; font-weight: 700; margin-top: 14px; min-height: 18px; color: var(--text-secondary); flex-shrink: 0; }
.mcq-result-msg.correct { color: #6abf85; }
.mcq-result-msg.wrong   { color: #c46a4e; }

/* ══════════════════════════════════════════════
   HEART BURST
══════════════════════════════════════════════ */
.heart-burst {
  position: fixed; pointer-events: none; z-index: 9999;
  transform: translate(-50%, -50%);
  animation: heartBurstAnim 0.65s cubic-bezier(0.16,1,0.3,1) forwards;
}
.heart-burst svg { width: 70px; height: 70px; filter: drop-shadow(0 0 10px rgba(200,169,110,0.5)); }
@keyframes heartBurstAnim {
  0%  {opacity:0; transform:translate(-50%,-50%) scale(0.3);}
  30% {opacity:1; transform:translate(-50%,-50%) scale(1.2);}
  55% {transform:translate(-50%,-50%) scale(0.95);}
  80% {opacity:0.85; transform:translate(-50%,-50%) scale(1.05);}
  100%{opacity:0; transform:translate(-50%,-56%) scale(0.85);}
}

/* ══════════════════════════════════════════════
   MEDIA
══════════════════════════════════════════════ */
.media-embed { margin: 10px 0; max-width: 100%; }
.media-embed img { width: 100%; max-width: 100%; height: auto; border-radius: 10px; display: block; }
.media-caption { font-size: 12px; color: var(--text-secondary); margin-top: 5px; font-style: italic; }

.custom-audio-player {
  background: var(--hover-bg); border-radius: 12px; padding: 14px;
  display: flex; align-items: center; gap: 12px; max-width: 100%;
  border: 1px solid var(--border-color);
}
.play-btn {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--accent); border: none; color: #0f0e0b;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 14px; transition: background 0.2s ease; flex-shrink: 0;
  box-shadow: 0 0 14px var(--accent-glow);
}
.play-btn:hover { background: var(--accent-hover); }
.audio-info { flex: 1; min-width: 0; overflow: hidden; }
.audio-title { font-size: 12px; font-weight: 600; margin-bottom: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-primary); }
.waveform-container { position: relative; height: 28px; background: var(--bg-color); border-radius: 6px; margin-bottom: 5px; cursor: pointer; overflow: hidden; }
.waveform-progress { position: absolute; top: 0; left: 0; height: 100%; background: var(--accent); opacity: 0.35; transition: width 0.1s linear; }
.waveform-bars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: space-around; padding: 0 4px; }
.waveform-bar { width: 2px; background: var(--text-secondary); border-radius: 2px; opacity: 0.5; }
.audio-time { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-secondary); }

/* ══════════════════════════════════════════════
   LOADING GIF OVERLAY
══════════════════════════════════════════════ */
.loading-gif-wrap {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  display: flex; align-items: center; justify-content: center;
}
.loading-gif-wrap img {
  width: 80px; height: 80px;
  object-fit: contain;
  opacity: 0.92;
}

/* ══════════════════════════════════════════════
   SHARE TOAST
══════════════════════════════════════════════ */
.share-toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px);
  background: #1a1810; border: 1px solid var(--border-color);
  border-radius: 14px; padding: 10px 18px;
  font-size: 13px; font-weight: 700; color: var(--text-primary);
  z-index: 9999; opacity: 0;
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none; white-space: nowrap;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
.share-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ══════════════════════════════════════════════
   COMMENTS — MOBILE POPUP
══════════════════════════════════════════════ */
.comments-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 199;
  opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
  backdrop-filter: blur(4px);
}
.comments-overlay.active { opacity: 1; pointer-events: all; }
.comments-popup {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.9);
  width: calc(100% - 40px); max-width: 500px;
  height: 70vh; max-height: 600px;
  background: var(--hover-bg);
  border-radius: 20px; z-index: 200;
  opacity: 0; pointer-events: none;
  transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
  display: flex; flex-direction: column;
  box-shadow: 0 24px 80px rgba(0,0,0,0.7), 0 0 0 1px var(--border-color);
}
.comments-popup.active { opacity: 1; pointer-events: all; transform: translate(-50%,-50%) scale(1); }
.comments-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid var(--border-color);
}
.comments-header h3 { font-size: 15px; font-weight: 700; }
.close-comments {
  background: none; border: none; color: var(--text-primary);
  font-size: 22px; cursor: pointer;
  width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
}
.close-comments:hover { background: var(--bg-color); }
.comments-list { flex: 1; overflow-y: auto; padding: 14px 18px; }
.comments-list::-webkit-scrollbar { width: 3px; }
.comments-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

.comment-item { display: flex; gap: 10px; margin-bottom: 18px; }
.comment-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #8a6430);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #0f0e0b;
  flex-shrink: 0; overflow: hidden;
}
.comment-avatar img { width: 100%; height: 100%; object-fit: cover; }
.comment-content { flex: 1; }
.comment-author { font-weight: 700; font-size: 12px; margin-bottom: 3px; }
.comment-text { font-size: 13px; line-height: 1.5; margin-bottom: 4px; }
.comment-time { font-size: 10px; color: var(--text-secondary); }
.comment-time.uploading { color: var(--accent); font-style: italic; }
.comment-time.upload-error { color: #c46a4e; }

.no-comments { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-secondary); gap: 10px; }
.no-comments i { font-size: 40px; opacity: 0.3; color: var(--accent); }
.loading-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-primary); gap: 14px; }
.spinner { width: 40px; height: 40px; border: 3px solid var(--border-color); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.comment-input-wrapper {
  padding: 10px 18px; border-top: 1px solid var(--border-color);
  border-radius: 0 0 20px 20px;
}
.comment-input-container { display: flex; gap: 8px; align-items: center; }
.comment-input {
  flex: 1; background: var(--bg-color); border: 1px solid var(--border-color);
  border-radius: 20px; padding: 9px 14px; color: var(--text-primary);
  font-size: 16px; outline: none; transition: border-color 0.15s ease;
  font-family: var(--font-ui);
}
.comment-input:focus { border-color: var(--accent); }
.send-comment-btn {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--accent); border: none; color: #0f0e0b;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 14px; transition: background 0.2s ease; flex-shrink: 0;
}
.send-comment-btn:hover { background: var(--accent-hover); }
.send-comment-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ══════════════════════════════════════════════
   DESKTOP SIDEBAR
══════════════════════════════════════════════ */
.ds-nav-section { padding: 10px 12px 6px; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
.ds-nav-btn {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px;
  border-radius: 10px; background: none; border: none; cursor: pointer;
  color: var(--text-secondary); width: 100%; font-size: 13px; font-weight: 600;
  font-family: var(--font-ui); transition: color 0.15s, background 0.15s; text-align: left;
}
.ds-nav-btn i { font-size: 15px; width: 18px; text-align: center; }
.ds-nav-btn:hover { color: var(--text-primary); background: var(--hover-bg); }
.ds-nav-btn.active { color: var(--accent); }

.ds-comments-panel { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.ds-comments-header { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
.ds-comments-back {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  color: var(--text-secondary); cursor: pointer; font-size: 10px;
  display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0;
}
.ds-comments-back:hover { border-color: var(--accent); color: var(--accent); }
.ds-comments-title { font-size: 13px; font-weight: 700; flex: 1; }
.ds-comments-list { flex: 1; overflow-y: auto; padding: 10px 14px; }
.ds-comments-list::-webkit-scrollbar { width: 2px; }
.ds-comments-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
.ds-comment-input-area { flex-shrink: 0; padding: 8px 14px; border-top: 1px solid var(--border-color); display: flex; gap: 6px; align-items: center; }
.ds-comment-input {
  flex: 1; background: var(--bg-color); border: 1px solid var(--border-color);
  border-radius: 16px; padding: 7px 12px; color: var(--text-primary);
  font-size: 13px; outline: none; transition: border-color 0.15s; font-family: var(--font-ui);
}
.ds-comment-input:focus { border-color: var(--accent); }
.ds-send-btn {
  width: 30px; height: 30px; border-radius: 50%; background: var(--accent);
  border: none; color: #0f0e0b; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0;
}
.ds-send-btn:hover { background: var(--accent-hover); }
.ds-send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.ds-settings-section { padding: 10px 12px; }
.ds-section { margin-bottom: 12px; }
.ds-section:last-child { margin-bottom: 0; }
.ds-label { font-size: 9px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 8px; }
.ds-pill-row { display: flex; flex-wrap: wrap; gap: 5px; }
.ds-pill {
  padding: 4px 9px; border-radius: 20px; font-size: 10px; font-weight: 700;
  border: 1px solid var(--border-color); background: var(--hover-bg);
  color: var(--text-secondary); cursor: pointer; transition: all 0.15s; font-family: var(--font-ui);
}
.ds-pill.active { background: var(--accent); color: #0f0e0b; border-color: var(--accent); }
.ds-pill:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
.ds-toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.ds-toggle-label { font-size: 11px; font-weight: 600; color: var(--text-primary); }
.ds-auth-section { padding: 10px 12px; border-top: 1px solid var(--border-color); flex-shrink: 0; margin-top: auto; }
.ds-auth-info { font-size: 11px; color: var(--text-secondary); }

/* ══════════════════════════════════════════════
   SKELETON
══════════════════════════════════════════════ */
@keyframes shimmer { 0%,100%{opacity:0.4} 50%{opacity:0.85} }
.skeleton-base { background: var(--hover-bg); animation: shimmer 1.6s infinite; border-radius: 6px; }
.skeleton-card { position: relative; height: 100vh; scroll-snap-align: start; scroll-snap-stop: always; background: var(--bg-color); padding: 8px 18px 100px; padding-top: calc(20px + env(safe-area-inset-top)); display: flex; flex-direction: column; }
.skeleton-header { display: flex; align-items: center; gap: 12px; flex-shrink: 0; margin-bottom: 16px; }
.skeleton-avatar { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; }
.skeleton-author-block { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.skeleton-name { height: 13px; width: 110px; }
.skeleton-date { height: 9px; width: 65px; }
.skeleton-title { height: 22px; width: 88%; margin-bottom: 8px; border-radius: 6px; }
.skeleton-title-short { height: 22px; width: 62%; margin-bottom: 12px; border-radius: 6px; }
.skeleton-stats { display: flex; gap: 12px; margin-bottom: 14px; flex-shrink: 0; }
.skeleton-stat { height: 12px; width: 48px; }
.skeleton-line { height: 12px; margin-bottom: 9px; width: 100%; }
.skeleton-line.w90{width:90%}.skeleton-line.w75{width:75%}.skeleton-line.w80{width:80%}.skeleton-line.w65{width:65%}.skeleton-line.w95{width:95%}

/* ══════════════════════════════════════════════
   FOOTER BAR — now dynamically swaps between default
   nav (4 buttons) and picker actions (2 buttons) via JS
══════════════════════════════════════════════ */
.footer-bar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 450px;
  background: rgba(15,14,11,0.96);
  border-top: 1px solid #2a2518;
  padding: 8px 24px;
  padding-bottom: calc(8px + env(safe-area-inset-bottom));
  display: flex; justify-content: space-around; align-items: center;
  z-index: 100;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.footer-btn {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; color: #8a8070;
  cursor: pointer; transition: color 0.2s ease, opacity 0.2s ease, transform 0.2s ease; padding: 6px 12px;
}
.footer-btn:hover { color: #f5f0e8; }
.footer-btn.active { color: #c8a96e; }
.footer-btn i { font-size: 19px; }
.footer-btn span { font-size: 10px; font-weight: 600; }

/* Picker-mode footer content — replaces the 4 nav buttons while
   libraries are selected in the picker card (mobile). */
.footer-picker-actions {
  display: flex; align-items: center; gap: 10px; width: 100%;
  animation: footerSwapIn 0.25s cubic-bezier(0.2,0.8,0.2,1);
}
@keyframes footerSwapIn {
  0%{opacity:0; transform:translateY(6px);}
  100%{opacity:1; transform:translateY(0);}
}
.footer-picker-browseall {
  flex-shrink: 0; padding: 11px 16px; border-radius: 12px;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  color: var(--text-secondary); font-size: 12.5px; font-weight: 700; cursor: pointer;
  font-family: var(--font-ui); transition: border-color 0.15s, color 0.15s;
}
.footer-picker-browseall:hover { border-color: var(--accent); color: var(--accent); }
.footer-picker-begin {
  flex: 1; padding: 11px; border-radius: 12px;
  background: var(--accent); color: #0f0e0b;
  font-size: 13px; font-weight: 800; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  box-shadow: 0 4px 16px var(--accent-glow);
  font-family: var(--font-ui); transition: background 0.15s;
}
.footer-picker-begin:hover { background: var(--accent-hover); }

@media (max-width: 768px) {
  .footer-bar { padding: 8px 16px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
  .footer-btn { padding: 6px 8px; }
  .footer-btn i { font-size: 17px; }
  .footer-btn span { font-size: 9px; }
}

/* Issue 3b fix: desktop-only in-card action bar for the picker, since
   .footer-bar is display:none on desktop and can't host these buttons. */
.lp-desktop-actionbar {
  display: none;
  align-items: center; gap: 10px;
  padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border-color);
  flex-shrink: 0;
}
.lp-desktop-actionbar.visible { animation: footerSwapIn 0.25s cubic-bezier(0.2,0.8,0.2,1); }

/* ══════════════════════════════════════════════
   LIBRARY PICKER CARD
══════════════════════════════════════════════ */
.library-picker-card {
  position: relative; height: 100vh;
  scroll-snap-align: start; scroll-snap-stop: always;
  background: var(--bg-color);
  display: flex; flex-direction: column; overflow: hidden;
}

.lp-topbar {
  flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
  padding: calc(14px + env(safe-area-inset-top)) 18px 10px;
}
.lp-topbar-logo { display: flex; align-items: center; gap: 7px; }
.lp-topbar-logo img { height: 22px; }
body.theme-light .lp-topbar-logo img { filter: invert(1) grayscale(1); }
.lp-topbar-right { display: flex; align-items: center; gap: 8px; }
.lp-settings-btn, .lp-picks-btn {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: var(--text-secondary); transition: border-color 0.15s, color 0.15s;
}
.lp-settings-btn:hover, .lp-picks-btn:hover { border-color: var(--accent); color: var(--accent); }

.lp-settings-popover {
  position: fixed; z-index: 500;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 16px; padding: 14px; width: 220px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  opacity: 0; pointer-events: none;
  transform: translateY(-8px) scale(0.97);
  transition: opacity 0.2s, transform 0.2s;
}
.lp-settings-popover.open { opacity: 1; pointer-events: all; transform: translateY(0) scale(1); }
.lp-settings-popover-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color);
}
.lp-settings-popover-title { font-size: 12px; font-weight: 800; color: var(--text-primary); }
.lp-settings-popover-close {
  width: 22px; height: 22px; border-radius: 50%; background: var(--bg-color);
  border: 1px solid var(--border-color); color: var(--text-secondary);
  cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.lp-settings-popover-close:hover { border-color: var(--accent); color: var(--accent); }
.lp-settings-section { margin-bottom: 12px; }
.lp-settings-section:last-child { margin-bottom: 0; }
.lp-settings-label { font-size: 9px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 7px; }
.lp-settings-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.lp-pill {
  padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
  border: 1px solid var(--border-color); background: var(--bg-color);
  color: var(--text-secondary); cursor: pointer; transition: all 0.15s;
  white-space: nowrap; font-family: var(--font-ui);
}
.lp-pill.active { background: var(--accent); color: #0f0e0b; border-color: var(--accent); }
.lp-pill:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
.lp-toggle-row { display: flex; align-items: center; justify-content: space-between; }
.lp-toggle-label { font-size: 12px; font-weight: 600; color: var(--text-primary); }
.lp-toggle {
  width: 36px; height: 20px; border-radius: 10px;
  background: var(--border-color); cursor: pointer;
  position: relative; transition: background 0.2s; flex-shrink: 0;
}
.lp-toggle.on { background: var(--accent); }
.lp-toggle::after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform 0.2s; }
.lp-toggle.on::after { transform: translateX(16px); }

.lp-body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px 0 0; display: flex; flex-direction: column; }
.lp-body::-webkit-scrollbar { width: 2px; }
.lp-body::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
.lp-section-label { font-size: 10px; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 6px; padding: 6px 18px; flex-shrink: 0; }

/* Library rows — matches explore.html's .result-item list pattern */
.lib-row-list { display: flex; flex-direction: column; padding: 0 18px; margin-bottom: 10px; }
.lib-row {
  display: flex; align-items: center; gap: 13px;
  padding: 14px 0; border-bottom: 1px solid var(--border-color);
  cursor: pointer; transition: background 0.15s, padding 0.15s, margin 0.15s;
  position: relative;
}
.lib-row:hover { background: var(--hover-bg); margin: 0 -12px; padding: 14px 12px; border-radius: 10px; border-bottom-color: transparent; }
.lib-row:last-child { border-bottom: none; }
.lib-row.selected { background: var(--accent-soft); border-radius: 10px; margin: 0 -12px; padding: 14px 12px; border-bottom-color: transparent; }
.lib-avatar {
  width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
  background: rgba(106,159,207,0.12); border: 1.5px solid rgba(106,159,207,0.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 700; color: #6a9fcf;
}
.lib-avatar img { width: 100%; height: 100%; object-fit: cover; }
.lib-content { flex: 1; min-width: 0; }
.lib-title { font-size: 14px; font-weight: 700; color: var(--text-primary); font-family: var(--font-article); letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
.lib-subtitle { font-size: 11px; color: var(--text-secondary); font-weight: 500; }
.lib-badge {
  padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0;
  background: rgba(106,159,207,0.1); color: #6a9fcf; border: 1px solid rgba(106,159,207,0.2);
}
.lib-selected-check {
  width: 20px; height: 20px; border-radius: 50%; background: var(--accent);
  display: none; align-items: center; justify-content: center; font-size: 10px;
  color: #0f0e0b; font-weight: 800; flex-shrink: 0; margin-left: 4px;
}
.lib-row.selected .lib-selected-check { display: flex; }

.lp-scroll-hint { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 11px; color: var(--text-secondary); font-weight: 500; padding: 12px 18px calc(12px + env(safe-area-inset-bottom) + 72px); flex-shrink: 0; }

.lp-loading { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 12px; padding: 30px 0; }

/* ══════════════════════════════════════════════
   UNIFIED FADE/BLUR FEED TRANSITION
   One single mechanism used for: initial Begin from
   the picker, Browse All, Browse-a-random-feed, and
   any future full-feed swap. It fades opacity, adds a
   gentle blur, and drops/lifts slightly — matching the
   feel of the reference page's lp-card-exit animation,
   but implemented as an explicit, always-unambiguous
   class so it can never silently collide with any other
   animation class an element might still be carrying.
══════════════════════════════════════════════ */
.feed-fade-exit {
  animation: feedFadeOut 0.35s cubic-bezier(0.4,0,0.2,1) forwards !important;
  pointer-events: none !important;
}
@keyframes feedFadeOut {
  0%   { opacity: 1; filter: blur(0px); transform: translateY(0) scale(1); }
  100% { opacity: 0; filter: blur(10px); transform: translateY(-18px) scale(0.97); }
}

  const safeTheme = (theme === 'theme-light') ? 'theme-light' : 'theme-dark';

<!-- 2. Confetti -->
<script>
(function(){
  const canvas=document.getElementById('confettiCanvas'),ctx=canvas.getContext('2d');
  let particles=[],animFrame=null;
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  window.addEventListener('resize',resize);resize();
  const COLORS=['#c8a96e','#e8d8a0','#a07840','#d4b86a','#7ab88a','#c97a5a','#8aa0c0','#f0e8d8'];
  function spawnParticles(x,y){
    for(let i=0;i<60;i++){const angle=Math.random()*Math.PI*2,speed=Math.random()*5+2;particles.push({x:x??canvas.width/2,y:y??canvas.height*0.4,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-2.5,size:Math.random()*5+2.5,color:COLORS[Math.floor(Math.random()*COLORS.length)],alpha:1,rotation:Math.random()*Math.PI*2,rotSpeed:(Math.random()-0.5)*0.15,shape:Math.random()>0.5?'rect':'circle'});}
    if(!animFrame)animate();
  }
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles=particles.filter(p=>p.alpha>0.01);

    if(particles.length>0){animFrame=requestAnimationFrame(animate);}else{animFrame=null;ctx.clearRect(0,0,canvas.width,canvas.height);}
  }
  window.launchConfetti=function(targetEl){if(targetEl){const r=targetEl.getBoundingClientRect();spawnParticles(r.left+r.width/2,r.top+r.height/2);}else{spawnParticles();}};

<!-- 7. Emoji renderer -->
<script>
const EMOJI_MAP={
  '🔍':'emo-magnify','❗':'emo-urgent','📌':'emo-pinned','🔥':'emo-fire','💎':'emo-diamond',
  '🟡':'emo-yellow','🔵':'emo-blue','🟢':'emo-green','🟣':'emo-purple','🔴':'emo-red',
  '⚫':'emo-dark','🧠':'emo-brain','📖':'emo-book','💡':'emo-idea','🎯':'emo-target',
  '🧩':'emo-puzzle','🏷️':'emo-tag','🔬':'emo-micro','⚠️':'emo-warning','✅':'emo-check',
  '❌':'emo-cross','⏳':'emo-hourglass','🔒':'emo-lock','🔓':'emo-unlock','⚡':'emo-lightning',
  '🌊':'emo-wave','🌀':'emo-spin','💫':'emo-float','🚀':'emo-rocket','🎬':'emo-cinematic',
  '🌟':'emo-star','✨':'emo-sparkle','🌈':'emo-rainbow','👑':'emo-crown','🪄':'emo-magic',
  '❤️':'emo-heart','😄':'emo-happy','😌':'emo-calm','😮':'emo-surprised','😎':'emo-cool',
  '🤖':'emo-robot','🧪':'emo-science','🏛️':'emo-temple','🌍':'emo-earth','💰':'emo-money',
  '⚖️':'emo-balance','📡':'emo-signal','🎵':'emo-music','🧊':'emo-ice','🔊':'emo-sound',
};
function buildEmojiPattern(){const keys=Object.keys(EMOJI_MAP).sort((a,b)=>b.length-a.length);const escaped=keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');return new RegExp(`(${escaped})([\\s\\S]*?)\\1`,'gu');}
function escHtmlET(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderTerms(html){return html.replace(/([A-Za-z][A-Za-z0-9\-']{0,60}?)&lt;([^&]{1,600}?)&gt;/g,function(match,term,explanation){const safeTerm=term.trim().replace(/'/g,'&#39;');const safeExp=explanation.replace(/'/g,'&#39;');return `<span class="term-link" onclick="openTermPopup('${safeTerm}','${safeExp}',event)">${term.trim()}</span>`;});}
function renderEmojiText(text,applyTerms=true){const re=buildEmojiPattern();let result='',lastIndex=0,match;while((match=re.exec(text))!==null){result+=escHtmlET(text.slice(lastIndex,match.index));const cls=EMOJI_MAP[match[1]];result+=`<span class="${cls}">${renderEmojiText(match[2],false)}</span>`;lastIndex=re.lastIndex;}result+=escHtmlET(text.slice(lastIndex));return applyTerms?renderTerms(result):result;}
</script>

  const showFollow=aSupaId&&currentUser&&String(currentUser.user_id)!==String(aSupaId);
  const showEdit=isOwnArticle(article);
  const followBtn=showFollow?`<button class="follow-btn${isFollowing?' following':''}" data-supa-uid="${aSupaId}" onclick="handleFollow(event,'${aFbUid}','${aSupaId}')"><svg class="icon-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><svg class="icon-bell" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></button>`:'';
  const editBtn=showEdit?`<button class="card-edit-btn" title="Edit article" onclick="location.href='https://patholytica.com/create?article=${article.id}'"><i class="fas fa-pen"></i></button>`:'';
  return`<div class="author-avatar" onclick="location.href='${profileUrl}'">${avatarContent}</div><div class="author-info"><div class="author-name" onclick="location.href='${profileUrl}'">${article.author}</div><div class="article-date">${formatDate(new Date(article.created_at))}</div></div>${followBtn}${editBtn}`;
}

function createMediaElement(m,forArticleContent=false){
  const d=document.createElement('div');
  if(m.type==='image'){
    if(forArticleContent){d.className='article-full-img-wrap';d.innerHTML=`<img src="${m.url}" alt="${m.caption||''}">${m.caption?`<div class="media-caption">${m.caption}</div>`:''}`;}
    else{d.className='media-embed';d.innerHTML=`<img src="${m.url}" alt="${m.caption||''}">${m.caption?`<div class="media-caption">${m.caption}</div>`:''}`;}
  }else if(m.type==='youtube'){
    if(forArticleContent){
      d.className='article-full-yt-wrap';
      d.innerHTML=`<iframe src="${m.url}" title="${m.caption||'Video'}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>${m.caption?`<div class="media-caption">${m.caption}</div>`:''}`;
    }else{
      d.className='media-embed';
      d.style.cssText='border-radius:10px;overflow:hidden;background:#000;';
      d.innerHTML=`<iframe src="${m.url}" title="${m.caption||'Video'}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen style="width:100%;aspect-ratio:16/9;border:none;display:block;"></iframe>${m.caption?`<div class="media-caption" style="padding:5px 0 0;">${m.caption}</div>`:''}`;
    }
  }else if(m.type==='audio'){
    d.className='media-embed';
    const aid='audio_'+Math.random().toString(36).substr(2,9);
    const bars=Array(15).fill(0).map(()=>`<div class="waveform-bar" style="height:${Math.random()*60+20}%"></div>`).join('');
    d.innerHTML=`<div class="custom-audio-player"><button class="play-btn" onclick="toggleAudio(this,'${aid}')"><i class="fas fa-play"></i></button><div class="audio-info"><div class="audio-title">${m.caption||'Audio'}</div><div class="waveform-container" onclick="seekAudio(event,this,'${aid}')"><div class="waveform-progress"></div><div class="waveform-bars">${bars}</div></div><div class="audio-time"><span class="current-time">0:00</span><span class="duration">0:00</span></div></div><audio id="${aid}" data-src="${m.url}" style="display:none;"></audio></div>`;
  }else if(m.type==='pdf'){
    d.className='media-embed';
    d.innerHTML=`<div style="background:var(--hover-bg);border:1px solid var(--border-color);border-radius:12px;overflow:hidden;"><div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border-color);"><i class="fas fa-file-pdf" style="color:#c97a5a;font-size:16px;flex-shrink:0;"></i><span style="font-size:12px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-primary);">${m.caption||'Document'}</span><a href="${m.url}" target="_blank" rel="noopener" style="font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(200,169,110,0.25);border-radius:7px;padding:3px 9px;text-decoration:none;white-space:nowrap;flex-shrink:0;">Open PDF</a></div><iframe src="${m.url}" style="width:100%;height:200px;border:none;display:block;"></iframe></div>`;
  }
  return d;
}

function buildArticleCard(article,index){
  const div=document.createElement('div');div.className='article-card';div.dataset.index=index;div.dataset.articleId=article.id;
  const isLiked=userLikes.has(String(article.id));
  div.innerHTML=`<div class="article-header">${buildAuthorHeader(article)}</div><div class="article-title article-title-link" onclick="location.href='https://patholytica.com/article?id=${article.id}'">${renderEmojiText(article.title||'Untitled')}</div><div class="article-stats"><div class="stat-item views"><i class="fas fa-eye"></i><span>${formatNumber(article.views||0)}</span></div><div class="stat-item likes"><i class="fas fa-heart"></i><span>${formatNumber(article.likes||0)}</span></div></div><div class="action-buttons"><button class="action-btn like-btn${isLiked?' liked':''}" data-id="${article.id}"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><span class="like-count">${formatNumber(article.likes||0)}</span></button><button class="action-btn comment-btn" data-id="${article.id}"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg><span class="comment-count">0</span></button><button class="action-btn share-btn" data-id="${article.id}" data-title="${(article.title||'').replace(/"/g,'&quot;')}"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg><span>Share</span></button></div>`;
  const contentDiv=document.createElement('div');contentDiv.className='article-content';
  const paragraphs=(article.content||'').split('\n\n');
  let firstTextEmitted=false;
  paragraphs.forEach((para,pIdx)=>{
    if(!para.trim())return;
    const p=document.createElement('div');p.className='content-paragraph';p.innerHTML=renderEmojiText(para.trim());
    const assoc=(article.media||[]).filter(m=>m.display_order===pIdx);
    if(!firstTextEmitted){contentDiv.appendChild(p);firstTextEmitted=true;assoc.filter(m=>m.type==='image'||m.type==='youtube').forEach(m=>contentDiv.appendChild(createMediaElement(m,true)));}
    else{assoc.filter(m=>m.type==='image'||m.type==='youtube').forEach(m=>contentDiv.appendChild(createMediaElement(m,true)));contentDiv.appendChild(p);}
  });
  if(article.media){article.media.filter(m=>m.display_order>=paragraphs.length||(m.type!=='image'&&m.type!=='youtube')).forEach(m=>contentDiv.appendChild(createMediaElement(m,m.type==='image'||m.type==='youtube')));}
  div.querySelector('.article-stats').insertAdjacentElement('afterend',contentDiv);
  return div;
}

function buildMCQCard(article,index){

  if(article.media?.length){const mc=card.querySelector(`#mcq-media-${article.id}`);article.media.forEach(m=>mc.appendChild(createMediaElement(m,false)));}
  const optsContainer=card.querySelector(`#mcq-opts-${article.id}`),msgEl=card.querySelector(`#mcq-msg-${article.id}`);
  let answered=false;
  options.forEach((opt,i)=>{
    const btn=document.createElement('button');btn.className='mcq-option';
    btn.innerHTML=`<span class="opt-letter">${letters[i]||i+1}</span><span class="opt-text">${renderEmojiText(opt.label)}</span>`;
    btn.addEventListener('click',()=>{
      if(answered)return;answered=true;optsContainer.querySelectorAll('.mcq-option').forEach(b=>b.disabled=true);
      if(opt.correct){
        btn.classList.add('selected-correct');msgEl.textContent='✓ Correct!';msgEl.className='mcq-result-msg correct';window.launchConfetti(btn);
        if(currentUser){supabase.rpc('record_article_interaction',{p_user_id:currentUser.user_id,p_article_id:parseInt(article.id),p_interaction_type:'view'}).then(({error})=>{if(error)console.error('[record_article_interaction mcq-correct]',error);});}
      }
      else{
        btn.classList.add('selected-wrong');msgEl.className='mcq-result-msg wrong';const ci=options.findIndex(o=>o.correct);if(ci!==-1){optsContainer.querySelectorAll('.mcq-option')[ci].classList.add('reveal-correct');msgEl.textContent=`✗ The answer was: ${options[ci].label}`;}else msgEl.textContent='✗ Incorrect';
        if(currentUser){supabase.rpc('record_article_interaction',{p_user_id:currentUser.user_id,p_article_id:parseInt(article.id),p_interaction_type:'comment'}).then(({error})=>{if(error)console.error('[record_article_interaction mcq-wrong]',error);});}
      }
    });
    optsContainer.appendChild(btn);
  });
  return card;
}

    if(e.target.closest('button,a,.term-link,.action-buttons,.author-name,.author-avatar,.follow-btn,.card-edit-btn'))return;
    const now=Date.now(),touch=e.changedTouches[0];

    lastTap=now;
  },{passive:false});
  card.addEventListener('dblclick',function(e){

async function handleLike(e){
  const btn=e.currentTarget,id=String(btn.dataset.id),countSpan=btn.querySelector('.like-count');
  if(!currentFirebaseUser){location.href='https://patholytica.com/login';return;}
  if(btn.dataset.processing==='true')return;
  btn.dataset.processing='true';
  if(!currentUser)return;

  const wasLiked=userLikes.has(id);
  const artIdx=articles.findIndex(a=>String(a.id)===id);
  const prevCount=artIdx!==-1?(articles[artIdx].likes||0):0;
  const newCount=wasLiked?Math.max(0,prevCount-1):prevCount+1;

  if(wasLiked){userLikes.delete(id);btn.classList.remove('liked');}
  else{userLikes.add(id);btn.classList.add('liked');}
  countSpan.textContent=formatNumber(newCount);
  if(artIdx!==-1)articles[artIdx].likes=newCount;
  const card=btn.closest('.article-card,.mcq-card');
  if(card){const s=card.querySelector('.stat-item.likes span');if(s)s.textContent=formatNumber(newCount);}
    try{
    await ensureSupabaseAuth();
    if(wasLiked){
      const{error}=await supabase.rpc('unlike_article',{p_article_id:parseInt(id),p_firebase_uid:currentFirebaseUser.uid});
      if(error)throw error;
    }else{
      const{error}=await supabase.rpc('like_article',{p_article_id:parseInt(id),p_firebase_uid:currentFirebaseUser.uid});
      if(error)throw error;
      supabase.rpc('record_article_interaction',{p_user_id:currentUser.user_id,p_article_id:parseInt(id),p_interaction_type:'like'}).then(({error})=>{if(error)console.error('[record_article_interaction like]',error);});
    }
  }catch(err){
    console.error('[handleLike exception]',err);
    if(wasLiked){userLikes.add(id);btn.classList.add('liked');}
    else{userLikes.delete(id);btn.classList.remove('liked');}
    countSpan.textContent=formatNumber(prevCount);
    if(artIdx!==-1)articles[artIdx].likes=prevCount;
    if(card){const s=card.querySelector('.stat-item.likes span');if(s)s.textContent=formatNumber(prevCount);}
  }finally{btn.dataset.processing='false';}
}

window.handleFollow=async function(e,aFbUid,aSupaId){
  e.stopPropagation();
  if(!currentFirebaseUser){location.href='https://patholytica.com/login';return;}
  const btn=e.currentTarget;if(btn.dataset.processing==='true')return;btn.dataset.processing='true';
  if(!currentUser)return;
  const supaUid=String(aSupaId),wasFollowing=userFollowing.has(supaUid);
  if(wasFollowing)userFollowing.delete(supaUid);else userFollowing.add(supaUid);
  updateFollowButtons();
  if(!wasFollowing){setTimeout(()=>{btn.classList.add('ringing');btn.addEventListener('animationend',()=>btn.classList.remove('ringing'),{once:true});},260);}
  try{
    await ensureSupabaseAuth();
    if(wasFollowing){await supabase.from('subscriptions').delete().eq('follower_id',currentUser.user_id).eq('author_id',parseInt(aSupaId));}
    else{await supabase.from('subscriptions').insert([{follower_id:currentUser.user_id,author_id:parseInt(aSupaId)}]);}
  }catch(err){
  }finally{btn.dataset.processing='false';}
};

// ── Library Picker ──
// Issue 1 fix (core of the rewrite): the picker card is now built and
// its data fetched entirely in the background (invisible, since
// #postsWrapper carries .pre-reveal from the very first line of HTML).
// It is inserted above the feed in the DOM, but NOTHING is shown to the
// user until the first batch of real feed cards has also been built
// and appended, and the scroll position has already been jumped past
// the picker to the first card. Only then does revealFeed() remove
// .pre-reveal — so the very first pixel the user ever sees is the
// first article, never the picker, never a skeleton, never a flash.
//
// LOADING-STATE FIX: the previous version never actually called
// injectInitialSkeletons(), so the loading GIF (which is position:fixed
// on <body>, not a child of #postsWrapper, and therefore NOT hidden by
// pre-reveal) never appeared, and the wrapper sat blank during the
// fetch. That call is added below, right before the fetch begins, so
// the GIF is visible on top of the still-hidden wrapper for as long as
// loadArticles() takes. pre-reveal itself is untouched — it still gates
// the picker card exactly as before, and the skeleton cards it also
// inserts stay invisible until reveal, same as everything else in the
// wrapper.
async function initLibraryPicker(){
  if(anchorArticleId!==null){
    showLoadingGif();
    await authReady;
    await loadArticles(true);
    revealFeed();
    return;
  }
  if(window._urlPlaylistId){
    showLoadingGif();
    await authReady;
    try{const{data:items}=await supabase.from('playlist_items').select('article_id').eq('playlist_id',window._urlPlaylistId);filteredArticleIds=[...new Set((items||[]).map(r=>r.article_id))];}catch(e){filteredArticleIds=null;}
    await loadArticles(true);
    revealFeed();
    return;
  }

  const wrapper=document.getElementById('postsWrapper');
  const pickerCard=buildPickerCard();
  wrapper.appendChild(pickerCard);

  // Show the loading indicator now: the picker card just went into the
  // DOM but is still visibility:hidden via pre-reveal on the wrapper,
  // and the GIF itself lives on <body> so it renders regardless. This
  // is the visible cue while authReady + loadArticles resolve below.
  showLoadingGif();

  await authReady;
  await loadArticles(true);

  // At this point the first batch of real feed cards is already in the
  // DOM (appended after the picker card by renderArticles). Jump the
  // scroll position straight to the first feed card BEFORE anything is
  // revealed, so that when .pre-reveal comes off there is no visible
  // scroll jump either — the user's first frame already shows the
  // first card sitting at scrollTop 0 of the viewport.
  snapToFirstFeedCard();
  revealFeed();
}

function revealFeed(){
  if(_firstPaintRevealed)return;
  _firstPaintRevealed=true;
  const wrapper=document.getElementById('postsWrapper');
  wrapper.classList.remove('pre-reveal');
  // The loading GIF has served its purpose the moment real content is
  // about to be shown — hide it here as a safety net in case
  // loadArticles()'s own clearSkeletons()/hideLoadingGif() call, deep
  // inside renderArticles(), was skipped on some code path (e.g. the
  // filteredArticleIds-empty early return in loadArticles).
  hideLoadingGif();
}

function snapToFirstFeedCard(){
  const wrapper=document.getElementById('postsWrapper');
  const firstCard=wrapper.querySelector('.article-card,.mcq-card');
  if(firstCard)wrapper.scrollTop=firstCard.offsetTop;
}

function makeLibRow(lib,count){

  const badge=document.createElement('span');badge.className='lib-badge';badge.textContent='Library';
  const check=document.createElement('div');check.className='lib-selected-check';check.textContent='✓';
  row.appendChild(av);row.appendChild(ct);row.appendChild(badge);row.appendChild(check);
  row.addEventListener('click',()=>{
    const id=String(lib.id);
    if(_lpSelected.has(id)){_lpSelected.delete(id);row.classList.remove('selected');}
    else{if(_lpSelected.size>=5)return;_lpSelected.add(id);row.classList.add('selected');}

// ── Unified fade/blur transition ──
// One single helper used by "Begin" (from the picker), "Browse All",
// and "Browse a random feed instead", so all three transitions look
// and behave identically: the card currently on screen fades + blurs
// out via the explicit .feed-fade-exit class (which always wins, since
// it's the only animation-bearing class ever added at that moment —
// any stale animation class from a previous transition is stripped
// first), then the new feed's cards fade + blur in via .feed-fade-enter
// once they've rendered.
function transitionToNewFeed(loadFn){
  const wrapper=document.getElementById('postsWrapper');
  const visibleCard=wrapper.querySelector('.library-picker-card, .article-card, .mcq-card, .end-feed-card');
  if(!visibleCard){clearFeedAndShowSkeletons();loadFn();return;}

  // Strip any leftover transition classes so the new one is never
  // fighting a class it doesn't know about.
  visibleCard.classList.remove('feed-fade-exit','feed-fade-enter');
  // Force a reflow so re-adding the class always restarts the animation
  // even if this exact element was faded before.
  void visibleCard.offsetWidth;
  visibleCard.classList.add('feed-fade-exit');

  let done=false;
  const finish=()=>{
    if(done)return;done=true;
    visibleCard.removeEventListener('animationend',finish);
    visibleCard.remove();
    clearFeedAndShowSkeletons();
    loadFn().then(()=>{
      fadeInNewFeedCards();
    });
  };
  visibleCard.addEventListener('animationend',finish,{once:true});
  // Safety net: if for any reason animationend never fires (e.g. the
  // element was already removed from the DOM elsewhere), don't leave
  // the user stuck looking at a faded-out card forever.
  setTimeout(finish,450);
}

function fadeInNewFeedCards(){
  const wrapper=document.getElementById('postsWrapper');
  const cards=wrapper.querySelectorAll('.article-card,.mcq-card,.end-feed-card');
  cards.forEach(c=>{
    c.classList.remove('feed-fade-enter');
    void c.offsetWidth;
    c.classList.add('feed-fade-enter');
    c.addEventListener('animationend',()=>c.classList.remove('feed-fade-enter'),{once:true});
  });
}

// Item 3 fix: exclude already-shown article IDs explicitly rather than
// trusting a numeric offset, since inserts into pick_items during the
// session (from ongoing interactions) shift what a positional offset
// window actually contains.
async function loadUserPicks(userId,excludeIds,limit){
  const{data:picksRow,error:picksErr}=await supabase.from('picks').select('id').eq('user_id',userId).maybeSingle();
  if(picksErr){console.error('[loadUserPicks] picks lookup failed:',picksErr);return[];}
  if(!picksRow)return[];
  let query=supabase
    .from('pick_items')
    .select('article_id, position, articles!fk_pick_items_article(*)')
    .eq('picks_id',picksRow.id)
    .order('position',{ascending:true})
    .limit(limit);
  if(excludeIds.size>0){
    query=query.not('article_id','in',`(${[...excludeIds].join(',')})`);
  }
  const{data:items,error}=await query;
  if(error){console.error('[loadUserPicks] pick_items query failed:',error);return[];}
  if(!items?.length)return[];
  return items.filter(it=>it.articles).map(it=>it.articles);
}

async function loadArticles(isInitial=true){
  if(isLoading||(!isInitial&&!hasMore))return;isLoading=true;
  try{
    if(isInitial&&anchorArticleId!==null){
      const{data:anchor,error}=await supabase.from('articles').select('*').eq('id',anchorArticleId).single();
      if(!error&&anchor){const{data:rest}=await supabase.from('articles').select('*').order('created_at',{ascending:false}).lt('created_at',anchor.created_at).limit(LIMIT-1);await enrichAndRender([anchor,...(rest||[])],isInitial);isLoading=false;return;}
      anchorArticleId=null;
    }

    if(currentUser&&filteredArticleIds===null&&usingPicksFeed!==false&&!randomModeForced){
      const pickedArticles=await loadUserPicks(currentUser.user_id,shownArticleIds,LIMIT);
      if(pickedArticles.length){
        usingPicksFeed=true;
        sawAnyPicks=true;
        pickedArticles.forEach(a=>shownArticleIds.add(a.id));
        if(pickedArticles.length<LIMIT)hasMore=false;
        await enrichAndRender(pickedArticles,isInitial);isLoading=false;
        if(!hasMore)appendEndFeedCardIfNeeded();
        return;
      }
      usingPicksFeed=false;
      if(isInitial&&!sawAnyPicks)appendEndFeedCardIfNeeded(true);
    }

    let query=supabase.from('articles').select('*').order('created_at',{ascending:false}).range(offset,offset+LIMIT-1);
    if(filteredArticleIds!==null){if(!filteredArticleIds.length){clearSkeletons();isLoading=false;return;}query=query.in('id',filteredArticleIds);}
    const{data:data2,error}=await query;if(error)throw error;
    if(!data2?.length){clearSkeletons();hasMore=false;isLoading=false;return;}
    if(data2.length<LIMIT)hasMore=false;
    offset+=data2.length;
    data2.forEach(a=>shownArticleIds.add(a.id));
    await enrichAndRender(data2,isInitial);isLoading=false;
  }catch(e){console.error(e);clearSkeletons();isLoading=false;}
}

  if(_endFeedCardShown)return;

  const card=buildEndFeedCard(forceNotPersonalized?false:sawAnyPicks);

async function enrichAndRender(data2,isInitial){
  const uids=[...new Set(data2.map(a=>a.firebase_user_id).filter(Boolean))];
  let usersData=[];
  if(uids.length){const{data:u}=await supabase.from('users').select('firebase_uid,username,full_name,pfp,user_id:id').in('firebase_uid',uids);usersData=u||[];}
  const artIds=data2.map(a=>a.id);
  const{data:mediaData}=await supabase.from('media').select('*').in('article_id',artIds).order('display_order',{ascending:true});
  const newArts=data2.map(a=>{const u=usersData.find(x=>x.firebase_uid===a.firebase_user_id);return{...a,author:u?.username?`@${u.username}`:(u?.full_name||'Anonymous'),authorPfp:u?.pfp||null,authorUsername:u?.username||null,authorSupaUserId:u?.user_id||null,media:(mediaData||[]).filter(m=>m.article_id===a.id)};});
  articles=[...articles,...newArts];
  renderArticles(isInitial);
}

function renderArticles(isInitial=true){
  const wrapper=document.getElementById('postsWrapper');
  if(isInitial){clearSkeletons();wrapper.querySelectorAll('.article-card,.mcq-card').forEach(c=>c.remove());}
  else{const last=wrapper.lastElementChild;if(last?.classList.contains('skeleton-card'))last.remove();}
  const startIndex=isInitial?0:articles.length-LIMIT;
  for(let i=startIndex;i<articles.length;i++){
    const a=articles[i];
    const card=isMCQ(a.content)?buildMCQCard(a,i):buildArticleCard(a,i);
    wrapper.appendChild(card);attachCardListeners(card,a);
  }
  if(hasMore){const sk=document.createElement('div');sk.className='skeleton-card';sk.innerHTML=skeletonCardHTML();wrapper.appendChild(sk);}
  if(isInitial){wrapper.addEventListener('scroll',handleScroll);loadCommentCounts();setupIntersectionObserver();}
  else{loadCommentCounts();}
}

function handleScroll(e){const c=e.target;if(c.scrollTop+c.clientHeight>=c.scrollHeight*0.8&&hasMore&&!isLoading)loadArticles(false);}
function setupIntersectionObserver(){
  const obs=new IntersectionObserver(entries=>{entries.forEach(entry=>{const id=entry.target.dataset.articleId;if(!id)return;if(entry.isIntersecting&&entry.intersectionRatio>=0.75){startViewTimer(id);startAudioLoadTimer(id);}else{clearViewTimer(id);clearAudioLoadTimer(id);}});},{threshold:[0.75]});
  document.querySelectorAll('.article-card,.mcq-card').forEach(c=>{if(c.dataset.articleId)obs.observe(c);});
}
function startViewTimer(id){if(viewedArticles.has(id)||viewTimers[id])return;viewTimers[id]=setTimeout(async()=>await incrementView(id),5000);}
function clearViewTimer(id){if(viewTimers[id]){clearTimeout(viewTimers[id]);delete viewTimers[id];}}

function startAudioLoadTimer(articleId){
  if(audioLoadTimers[articleId])return;
  const card=document.querySelector(`.article-card[data-article-id="${articleId}"],.mcq-card[data-article-id="${articleId}"]`);
  if(!card)return;
  const audioEls=card.querySelectorAll('audio[data-src]');
  if(!audioEls.length)return;
  audioLoadTimers[articleId]=setTimeout(()=>{
    audioEls.forEach(a=>window.loadAudioIfNeeded(a.id));
  },10000);
}
function clearAudioLoadTimer(articleId){
  if(audioLoadTimers[articleId]){clearTimeout(audioLoadTimers[articleId]);delete audioLoadTimers[articleId];}
}

async function incrementView(id){
  if(viewedArticles.has(id))return;viewedArticles.add(id);
  try{
    const{data:nv,error}=await supabase.rpc('increment_views',{p_article_id:parseInt(id)});
    if(error)throw error;
    const idx=articles.findIndex(x=>x.id===id);if(idx!==-1)articles[idx].views=nv;
    const card=document.querySelector(`.article-card[data-article-id="${id}"],.mcq-card[data-article-id="${id}"]`);
    if(card){const s=card.querySelector('.stat-item.views span');if(s)s.textContent=formatNumber(nv);}
    if(currentUser){
      supabase.rpc('record_article_interaction',{p_user_id:currentUser.user_id,p_article_id:parseInt(id),p_interaction_type:'view'}).then(({error})=>{if(error)console.error('[record_article_interaction view]',error);});
    }
  }catch(e){viewedArticles.delete(id);}
}

     if(error)throw error;
    const tempEl=document.getElementById(tempId);if(tempEl){const timeEl=tempEl.querySelector('.comment-time');if(timeEl){timeEl.className='comment-time';timeEl.textContent='Just now';}}
    supabase.rpc('record_article_interaction',{p_user_id:currentUser.user_id,p_article_id:parseInt(currentArticleId),p_interaction_type:'comment'}).then(({error})=>{if(error)console.error('[record_article_interaction comment]',error);});
  }catch(e){
    const tempEl=document.getElementById(tempId);if(tempEl){const timeEl=tempEl.querySelector('.comment-time');if(timeEl){timeEl.className='comment-time upload-error';timeEl.textContent='Failed to send';}}
    if(cb){const cs=cb.querySelector('.comment-count');cs.textContent=Math.max(0,parseInt(cs.textContent)-1);}
  }finally{sendBtn.disabled=false;}
};
document.getElementById('commentInput').addEventListener('keypress',e=>{if(e.key==='Enter')window.sendComment();});

// ── Init ──
initLibraryPicker();
</script>
