<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Patholytica — Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>

/* ══════════════════════════════════════════════
   CSS VARIABLES
══════════════════════════════════════════════ */
:root {
  --bg-color: #0f0e0b;
  --text-primary: #f5f0e8;
  --text-secondary: #8a8070;
  --hover-bg: #1a1810;
  --border-color: #2a2518;
  --accent: #c8a96e;
  --accent-hover: #b8935a;
  --accent-glow: rgba(200,169,110,0.25);
  --accent-soft: rgba(200,169,110,0.12);
  --font-article: 'Merriweather', serif;
  --font-ui: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
}
body.theme-dark {
  --bg-color: #0f0e0b; --text-primary: #f5f0e8; --text-secondary: #8a8070;
  --hover-bg: #1a1810; --border-color: #2a2518;
  --accent: #c8a96e; --accent-hover: #b8935a;
  --accent-glow: rgba(200,169,110,0.25); --accent-soft: rgba(200,169,110,0.12);
}
body.theme-light {
  --bg-color: #faf6ee; --text-primary: #1a1710; --text-secondary: #706050;
  --hover-bg: #f0ebe0; --border-color: #e0d8c8;
  --accent: #a07840; --accent-hover: #8a6430;
  --accent-glow: rgba(160,120,64,0.2); --accent-soft: rgba(160,120,64,0.08);
}
body.font-serif  { --font-article: 'Merriweather', serif; }
body.font-slab   { --font-article: 'Source Serif 4', serif; }
body.font-modern { --font-article: 'Inter', sans-serif; }

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  font-family: var(--font-ui);
  background: var(--bg-color);
  color: var(--text-primary);
  overflow-x: hidden;
  transition: background 0.2s ease, color 0.2s ease;
}

/* ══════════════════════════════════════════════
   HEADER
══════════════════════════════════════════════ */
.header-wrapper {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--bg-color);
  border-bottom: 1px solid var(--border-color);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  padding-top: env(safe-area-inset-top);
  transition: background 0.2s ease, border-color 0.2s ease;
}
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 18px; max-width: 1200px; margin: 0 auto;
}
.header-logo { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.header-logo img { height: 24px; width: auto; }
.header-right { display: flex; align-items: center; gap: 8px; }

.hdr-icon-btn {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  color: var(--text-secondary); font-size: 13px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: border-color 0.15s, color 0.15s, background 0.2s;
  position: relative; flex-shrink: 0;
}
.hdr-icon-btn:hover { border-color: var(--accent); color: var(--accent); }

/* notification badge */
.notif-badge {
  position: absolute; top: -3px; right: -3px;
  background: #c46a4e; color: #fff; font-size: 9px; font-weight: 700;
  width: 15px; height: 15px; border-radius: 50%;
  display: none; align-items: center; justify-content: center;
  border: 1.5px solid var(--bg-color); pointer-events: none;
}
.notif-badge.show { display: flex; }

/* ══════════════════════════════════════════════
   NOTIFICATIONS PANEL
══════════════════════════════════════════════ */
.notif-panel {
  display: none; flex-direction: column;
  position: fixed; z-index: 500;
  width: 310px; max-width: calc(100vw - 24px); max-height: 460px;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 16px; box-shadow: 0 16px 48px rgba(0,0,0,0.7);
  overflow: hidden;
}
.notif-panel.open { display: flex; }
.notif-panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 16px 10px; border-bottom: 1px solid var(--border-color); flex-shrink: 0;
}
.notif-panel-title { font-size: 13px; font-weight: 700; }
.notif-mark-all {
  font-size: 11px; font-weight: 600; color: var(--accent);
  background: none; border: none; cursor: pointer; font-family: var(--font-ui);
  transition: opacity 0.2s;
}
.notif-mark-all:hover { opacity: 0.7; }
.notif-list { flex: 1; overflow-y: auto; }
.notif-list::-webkit-scrollbar { width: 2px; }
.notif-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
.notif-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 11px 16px; border-bottom: 1px solid rgba(42,37,24,0.6);
  cursor: pointer; transition: background 0.15s; position: relative;
}
.notif-item:hover { background: var(--hover-bg); }
.notif-item.unread { background: rgba(200,169,110,0.04); }
.notif-item.unread::before {
  content: ''; position: absolute; left: 6px; top: 50%; transform: translateY(-50%);
  width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
}
.notif-icon {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 12px;
}
.notif-icon.like    { background: rgba(196,106,78,0.15); color: #c46a4e; }
.notif-icon.comment { background: rgba(138,160,192,0.15); color: #8aa0c0; }
.notif-icon.follow  { background: var(--accent-soft); color: var(--accent); }
.notif-icon.article { background: rgba(106,191,133,0.15); color: #6abf85; }
.notif-text { flex: 1; min-width: 0; }
.notif-msg  { font-size: 12px; line-height: 1.4; color: var(--text-primary); }
.notif-time { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }
.notif-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 40px 20px; color: var(--text-secondary);
}
.notif-empty i { font-size: 28px; opacity: 0.25; color: var(--accent); }
.notif-empty p { font-size: 12px; opacity: 0.6; margin: 0; }
.notif-spinner-wrap { padding: 24px; display: flex; justify-content: center; }
.notif-spinner {
  width: 22px; height: 22px;
  border: 2px solid var(--border-color); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ══════════════════════════════════════════════
   SETTINGS POPOVER
══════════════════════════════════════════════ */
.settings-popover {
  position: fixed; z-index: 500;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 16px; padding: 0; width: 230px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  opacity: 0; pointer-events: none;
  transform: translateY(-8px) scale(0.97);
  transition: opacity 0.2s, transform 0.2s;
  overflow: hidden;
}
.settings-popover.open { opacity: 1; pointer-events: all; transform: translateY(0) scale(1); }

/* profile section at top of settings */
.sp-profile {
  padding: 14px 14px 12px;
  border-bottom: 1px solid var(--border-color);
  display: flex; align-items: center; gap: 10px;
  cursor: pointer;
  transition: background 0.15s;
}
.sp-profile:hover { background: rgba(200,169,110,0.06); }
.sp-profile-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--accent-soft); border: 1.5px solid rgba(200,169,110,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: var(--accent);
  overflow: hidden; flex-shrink: 0;
}
.sp-profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
.sp-profile-info { flex: 1; min-width: 0; }
.sp-profile-name {
  font-size: 13px; font-weight: 700; color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sp-profile-status {
  font-size: 10px; margin-top: 1px;
}
.sp-profile-status.online { color: #6abf85; }
.sp-profile-status.guest  { color: var(--text-secondary); }

/* settings body */
.sp-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.sp-section { }
.sp-label {
  font-size: 9px; font-weight: 800; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-secondary); margin-bottom: 7px;
}
.sp-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sp-pill {
  padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
  border: 1px solid var(--border-color); background: var(--bg-color);
  color: var(--text-secondary); cursor: pointer; transition: all 0.15s;
  font-family: var(--font-ui);
}
.sp-pill.active { background: var(--accent); color: #0f0e0b; border-color: var(--accent); }
.sp-pill:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

/* logout button */
.sp-logout {
  width: 100%; padding: 9px 12px; border-radius: 10px;
  background: rgba(196,106,78,0.08); border: 1px solid rgba(196,106,78,0.22);
  color: #c46a4e; font-size: 12px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px;
  font-family: var(--font-ui); transition: background 0.15s;
  margin-top: 4px;
}
.sp-logout:hover { background: rgba(196,106,78,0.16); }
.sp-login {
  width: 100%; padding: 9px 12px; border-radius: 10px;
  background: var(--accent-soft); border: 1px solid rgba(200,169,110,0.3);
  color: var(--accent); font-size: 12px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px;
  font-family: var(--font-ui); transition: background 0.15s;
  margin-top: 4px;
}
.sp-login:hover { background: rgba(200,169,110,0.2); }

/* ══════════════════════════════════════════════
   USER PREVIEW POPUP (creator strip click)
══════════════════════════════════════════════ */
.user-popup-overlay {
  position: fixed; inset: 0; z-index: 400;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
  display: none; align-items: flex-end; justify-content: center;
}
.user-popup-overlay.open { display: flex; }
.user-popup {
  width: 100%; max-width: 420px;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 20px 20px 0 0; border-bottom: none;
  padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
  animation: slideUp 0.3s cubic-bezier(0.4,0,0.2,1);
}
@keyframes slideUp { from{transform:translateY(100%);opacity:0} to{transform:translateY(0);opacity:1} }
.user-popup-handle {
  width: 36px; height: 4px; background: var(--border-color);
  border-radius: 2px; margin: 0 auto 18px;
}
.user-popup-header {
  display: flex; align-items: center; gap: 14px; margin-bottom: 14px;
}
.user-popup-avatar {
  width: 58px; height: 58px; border-radius: 50%;
  background: var(--accent-soft); border: 2px solid rgba(200,169,110,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700; color: var(--accent);
  overflow: hidden; flex-shrink: 0;
}
.user-popup-avatar img { width: 100%; height: 100%; object-fit: cover; }
.user-popup-identity { flex: 1; min-width: 0; }
.user-popup-name {
  font-size: 16px; font-weight: 800; color: var(--text-primary);
  font-family: var(--font-article); margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.user-popup-handle { font-size: 12px; color: var(--text-secondary); }
.user-popup-stats {
  display: flex; gap: 0;
  border: 1px solid var(--border-color); border-radius: 12px;
  overflow: hidden; margin-bottom: 14px;
}
.user-popup-stat {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 10px 6px; position: relative;
}
.user-popup-stat + .user-popup-stat::before {
  content: ''; position: absolute; left: 0; top: 20%; bottom: 20%;
  width: 1px; background: var(--border-color);
}
.user-popup-stat-val {
  font-size: 16px; font-weight: 800; color: var(--text-primary);
  font-family: var(--font-article); line-height: 1;
}
.user-popup-stat-label {
  font-size: 9px; font-weight: 600; color: var(--text-secondary);
  margin-top: 3px; text-transform: uppercase; letter-spacing: 0.04em;
}
.user-popup-bio {
  font-size: 13px; color: var(--text-secondary); line-height: 1.6;
  margin-bottom: 16px;
}
.user-popup-btn {
  width: 100%; padding: 11px; border-radius: 10px;
  background: var(--accent); color: #0f0e0b;
  font-size: 13px; font-weight: 700; border: none; cursor: pointer;
  font-family: var(--font-ui); transition: background 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.user-popup-btn:hover { background: var(--accent-hover); }
.user-popup-spinner {
  display: flex; align-items: center; justify-content: center; padding: 30px;
}
.user-popup-spinner-ring {
  width: 24px; height: 24px;
  border: 2px solid var(--border-color); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.9s linear infinite;
}

/* ══════════════════════════════════════════════
   CONTENT PREVIEW POPUP (pin card click)
══════════════════════════════════════════════ */
.card-preview-overlay {
  position: fixed; inset: 0; z-index: 400;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
  display: none; align-items: flex-end; justify-content: center;
}
.card-preview-overlay.open { display: flex; }
.card-preview {
  width: 100%; max-width: 480px;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 20px 20px 0 0; border-bottom: none;
  max-height: 80vh; display: flex; flex-direction: column;
  animation: slideUp 0.3s cubic-bezier(0.4,0,0.2,1);
}
.card-preview-handle {
  width: 36px; height: 4px; background: var(--border-color);
  border-radius: 2px; margin: 12px auto 0; flex-shrink: 0;
}
.card-preview-inner {
  flex: 1; overflow-y: auto; padding: 16px 18px calc(18px + env(safe-area-inset-bottom));
}
.card-preview-inner::-webkit-scrollbar { width: 2px; }
.card-preview-inner::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

.cp-type-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
  border-radius: 5px; padding: 3px 8px; margin-bottom: 10px;
}
.cp-type-badge.article { background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(200,169,110,0.3); }
.cp-type-badge.mcq     { background: rgba(106,191,133,0.12); color: #a0d8b0; border: 1px solid rgba(106,191,133,0.25); }
.cp-type-badge.library { background: rgba(106,159,207,0.12); color: #a8c8e8; border: 1px solid rgba(106,159,207,0.25); }

.cp-title {
  font-size: 17px; font-weight: 800; line-height: 1.3; color: var(--text-primary);
  font-family: var(--font-article); margin-bottom: 10px;
}
.cp-meta {
  display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap;
}
.cp-meta-item { font-size: 11px; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
.cp-meta-item i { font-size: 10px; }
.cp-excerpt {
  font-size: 14px; line-height: 1.7; color: var(--text-secondary);
  margin-bottom: 18px;
}
/* MCQ inside preview */
.cp-mcq-q {
  font-size: 15px; font-weight: 700; color: var(--text-primary);
  font-family: var(--font-article); line-height: 1.4; margin-bottom: 12px;
}
.cp-mcq-opts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.cp-mcq-opt {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 13px; border-radius: 10px;
  border: 1px solid var(--border-color); background: var(--bg-color);
  font-size: 13px; color: var(--text-primary); cursor: pointer;
  transition: border-color 0.15s, background 0.15s; text-align: left; width: 100%;
  font-family: var(--font-ui);
}
.cp-mcq-opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.cp-mcq-opt:disabled { cursor: default; }
.cp-mcq-opt .opt-l {
  width: 24px; height: 24px; border-radius: 50%;
  border: 1.5px solid var(--border-color);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 800; flex-shrink: 0; color: var(--text-secondary);
}
.cp-mcq-opt.correct { border-color: #6abf85; background: rgba(106,191,133,0.08); }
.cp-mcq-opt.correct .opt-l { background: #6abf85; border-color: #6abf85; color: #0f0e0b; }
.cp-mcq-opt.wrong   { border-color: #c46a4e; background: rgba(196,106,78,0.07); }
.cp-mcq-opt.wrong   .opt-l { background: #c46a4e; border-color: #c46a4e; color: #fff; }
.cp-mcq-opt.reveal  { border-color: rgba(106,191,133,0.5); }
.cp-mcq-opt.reveal  .opt-l { border-color: #6abf85; color: #6abf85; }
.cp-mcq-result { font-size: 13px; font-weight: 700; margin-bottom: 14px; }
.cp-mcq-result.correct { color: #6abf85; }
.cp-mcq-result.wrong   { color: #c46a4e; }
/* library inside preview */
.cp-lib-desc {
  font-size: 14px; line-height: 1.7; color: var(--text-secondary);
  margin-bottom: 16px;
}
.cp-lib-save-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 16px;
}
.cp-save-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 700;
  border: 1px solid var(--border-color); background: none; color: var(--text-secondary);
  cursor: pointer; font-family: var(--font-ui); transition: all 0.15s;
}
.cp-save-btn:hover { border-color: var(--accent); color: var(--accent); }
.cp-save-btn.saved { border-color: rgba(200,169,110,0.4); color: var(--accent); background: var(--accent-soft); }
.cp-save-btn i { font-size: 12px; }
/* footer actions */
.cp-actions {
  display: flex; gap: 8px;
}
.cp-btn-primary {
  flex: 1; padding: 11px; border-radius: 10px;
  background: var(--accent); color: #0f0e0b;
  font-size: 13px; font-weight: 700; border: none; cursor: pointer;
  font-family: var(--font-ui); transition: background 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.cp-btn-primary:hover { background: var(--accent-hover); }
.cp-btn-secondary {
  padding: 11px 16px; border-radius: 10px;
  background: none; border: 1px solid var(--border-color); color: var(--text-secondary);
  font-size: 13px; font-weight: 700; cursor: pointer;
  font-family: var(--font-ui); transition: border-color 0.15s, color 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.cp-btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

/* preview loading */
.cp-loading {
  display: flex; align-items: center; justify-content: center; padding: 40px;
}
.cp-loading-ring {
  width: 26px; height: 26px;
  border: 2px solid var(--border-color); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.9s linear infinite;
}

/* ══════════════════════════════════════════════
   PAGE BODY
══════════════════════════════════════════════ */
.page-body {
  max-width: 1200px; margin: 0 auto;
  padding: 0 12px;
  padding-top: calc(44px + env(safe-area-inset-top) + 14px);
  padding-bottom: calc(80px + env(safe-area-inset-bottom));
}

/* ══════════════════════════════════════════════
   CREATORS STRIP
══════════════════════════════════════════════ */
.creators-strip {
  display: flex; gap: 14px; overflow-x: auto;
  padding: 4px 0 14px; scrollbar-width: none;
}
.creators-strip::-webkit-scrollbar { display: none; }
.creator-pill {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  cursor: pointer; flex-shrink: 0; width: 54px;
  transition: opacity 0.15s;
}
.creator-pill:hover { opacity: 0.8; }
.creator-pill-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--accent-soft);
  border: 2px solid var(--border-color);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 700; color: var(--accent);
  overflow: hidden; flex-shrink: 0;
  transition: border-color 0.2s;
}
.creator-pill:hover .creator-pill-avatar { border-color: var(--accent); }
.creator-pill-avatar img { width: 100%; height: 100%; object-fit: cover; }
.creator-pill-name {
  font-size: 9px; font-weight: 600; color: var(--text-secondary);
  text-align: center; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; width: 100%;
}

/* ══════════════════════════════════════════════
   MASONRY
══════════════════════════════════════════════ */

/* ══════════════════════════════════════════════
   PIN CARD
══════════════════════════════════════════════ */
.pin-card {
  break-inside: avoid; margin-bottom: 10px; border-radius: 14px;
  overflow: hidden; cursor: pointer; position: relative; display: block;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
  background: var(--hover-bg);
}
.pin-card:hover {
  transform: translateY(-3px) scale(1.01);
  box-shadow: 0 12px 36px rgba(0,0,0,0.55);
}
.pin-card:active { transform: scale(0.98); }

.pin-card-img {
  width: 100%; height: auto; display: block;
}
.pin-card-img.fixed-ratio {
  width: 100%; object-fit: cover; display: block;
}

/* CSS-only fallback when image fails */
.pin-card-img-fallback {
  width: 100%; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--hover-bg) 0%, #1e1c16 100%);
  color: var(--accent); font-size: 28px; opacity: 0.4;
}

.pin-card-overlay {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: linear-gradient(to top, rgba(4,3,2,0.92) 0%, rgba(4,3,2,0.70) 30%, rgba(4,3,2,0.30) 60%, transparent 100%);
  padding: 28px 11px 11px;
  display: flex; flex-direction: column; gap: 5px;
}
.pin-overlay-title {
  font-size: 12px; font-weight: 700; color: #f5f0e8;
  line-height: 1.3; font-family: var(--font-article);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  letter-spacing: -0.01em; text-shadow: 0 1px 6px rgba(0,0,0,0.8);
}
.pin-overlay-meta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.pin-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em;
  background: var(--accent-soft); color: var(--accent);
  border: 1px solid rgba(200,169,110,0.3);
  border-radius: 4px; padding: 2px 6px; backdrop-filter: blur(4px);

.pin-badge.mcq-badge  { background: var(--accent-soft); color: var(--accent); border-color: rgba(200,169,110,0.3); }
.pin-badge.art-badge  { background: var(--accent-soft); color: var(--accent); border-color: rgba(200,169,110,0.3); }

<script>
(function(){
  const theme   = localStorage.getItem('pref_theme')   || 'theme-dark';
  const fontFam = localStorage.getItem('pref_fontfam') || 'font-serif';
  const safeTheme = (theme === 'theme-light') ? 'theme-light' : 'theme-dark';
  document.body.className = [safeTheme, fontFam].filter(Boolean).join(' ');
})();
</script>

<!-- 2. Settings popover -->
<script>
(function(){
  const FONTS = ['font-serif','font-slab','font-modern'];

  function applyFont(val){
    FONTS.forEach(f=>document.body.classList.remove(f));
    document.body.classList.add(val);
    localStorage.setItem('pref_fontfam', val);
  }
  function syncPills(){
    const curF = FONTS.find(f=>document.body.classList.contains(f))||'font-serif';
    document.querySelectorAll('#sp-fonts [data-val]').forEach(b=>b.classList.toggle('active',b.dataset.val===curF));
  }
  document.getElementById('sp-fonts').addEventListener('click',e=>{
    const b=e.target.closest('[data-val]');if(!b)return;applyFont(b.dataset.val);syncPills();
  });

  let _open=false;
  window.closeSettings=function(){
    document.getElementById('settingsPopover').classList.remove('open');
    _open=false;
  };
  window.toggleSettings=function(btn){
    const pop=document.getElementById('settingsPopover');
    _open=!_open;
    if(_open){
      const r=btn.getBoundingClientRect();
      pop.style.top=(r.bottom+8)+'px';
      pop.style.right=Math.max(8,window.innerWidth-r.right)+'px';
      pop.style.left='auto';
      pop.classList.add('open');
      syncPills();
      setTimeout(()=>document.addEventListener('click',function oc(e){
        if(!pop.contains(e.target)&&e.target!==btn&&!btn.contains(e.target)){
          pop.classList.remove('open');_open=false;
        }
        document.removeEventListener('click',oc);
      },10));
    } else {
      pop.classList.remove('open');
    }
  };

  document.addEventListener('DOMContentLoaded',syncPills);
})();
</script>

window.fmtNum=function(n){if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1000)return(n/1000).toFixed(1)+'K';return String(n||0);};
window.relTime=function(dateStr){
  const ms=Date.now()-new Date(dateStr).getTime(),m=Math.floor(ms/60000),h=Math.floor(ms/3600000),d=Math.floor(ms/86400000);
  if(m<1)return'just now';if(m<60)return`${m}m ago`;if(h<24)return`${h}h ago`;if(d<7)return`${d}d ago`;
  return new Date(dateStr).toLocaleDateString('en-US',{month:'short',day:'numeric'});
};
</script>

      fabWrap.classList.add('visible');
      // load favourites
      await loadUserFavourites();
      // load notifications
      await loadNotifications();
    }
  } else {
    currentSupaUser = null; currentUserData = null; userFavourites.clear();
    updateSpProfile(null, false);
    document.getElementById('spAuthAction').innerHTML=
      `<button class="sp-login" onclick="location.href='login.html'"><i class="fas fa-sign-in-alt"></i> Log in</button>`;
    bellBtn.style.display = 'none';
    fabWrap.classList.remove('visible');
  }
});

function updateSpProfile(ud, loggedIn){

   FAVOURITES

async function loadUserFavourites(){
  if(!currentSupaUser) return;
  try{
    const{data}=await supabase.from('favourite_playlists').select('playlist_id').eq('user_id',currentSupaUser.user_id);
    userFavourites.clear();
    (data||[]).forEach(r=>userFavourites.add(String(r.playlist_id)));
  }catch(e){}
}

async function toggleFavourite(playlistId){
  if(!currentSupaUser){ location.href='login.html'; return; }
  const pid = String(playlistId);
  const wasFaved = userFavourites.has(pid);
  if(wasFaved) userFavourites.delete(pid); else userFavourites.add(pid);
  try{
    if(wasFaved){
      await supabase.from('favourite_playlists').delete()
        .eq('user_id',currentSupaUser.user_id).eq('playlist_id',parseInt(pid));
    } else {
      await supabase.from('favourite_playlists').insert([
        {user_id:currentSupaUser.user_id, playlist_id:parseInt(pid)}
      ]);
    }
    showToast(wasFaved ? 'Removed from saved' : 'Library saved!');
  }catch(err){
    if(wasFaved) userFavourites.add(pid); else userFavourites.delete(pid);
  }
  return !wasFaved; // new state
}

/* ══════════════════════════════════════════════
   NOTIFICATIONS
══════════════════════════════════════════════ */
function notifIcon(type){
  if(type==='like_article'||type==='like_comment')    return{cls:'like',icon:'fa-heart'};
  if(type==='comment_on_article'||type==='reply_to_comment') return{cls:'comment',icon:'fa-comment'};
  if(type==='new_follower')                           return{cls:'follow',icon:'fa-user-plus'};
  if(type==='new_article_from_following')             return{cls:'article',icon:'fa-file-alt'};
  return{cls:'follow',icon:'fa-bell'};
}

async function loadNotifications(){
  if(!currentSupaUser) return;
  const list=document.getElementById('notifList');
  const badge=document.getElementById('notifBadge');
  list.innerHTML='<div class="notif-spinner-wrap"><div class="notif-spinner"></div></div>';
  try{
    const{data:notifs}=await supabase.from('notifications').select('*')
      .eq('recipient_id',currentSupaUser.user_id)
      .order('created_at',{ascending:false}).limit(30);
    if(!notifs||!notifs.length){
      list.innerHTML=`<div class="notif-empty"><i class="fas fa-bell-slash"></i><p>No notifications yet</p></div>`;
      badge.classList.remove('show'); return;
    }
    const unread=notifs.filter(n=>!n.is_read).length;
    if(unread>0){badge.textContent=unread>9?'9+':unread;badge.classList.add('show');}
    else badge.classList.remove('show');
    list.innerHTML=notifs.map(n=>{
      const{cls,icon}=notifIcon(n.type);
      let target='#';
      if(n.article_id) target=`https://patholytica.com/dailyfeed?article=${n.article_id}`;
      else if(n.playlist_id) target=`playlist.html?id=${n.playlist_id}`;
      return`<div class="notif-item ${n.is_read?'':'unread'}" data-id="${n.id}" data-target="${target}" onclick="window._handleNotif(this)">
        <div class="notif-icon ${cls}"><i class="fas ${icon}"></i></div>
        <div class="notif-text">
          <div class="notif-msg">${esc(n.message||'New notification')}</div>
          <div class="notif-time">${relTime(n.created_at)}</div>
        </div>
      </div>`;
    }).join('');
  }catch(e){
    list.innerHTML=`<div class="notif-empty"><i class="fas fa-exclamation-triangle"></i><p>Failed to load</p></div>`;
  }
}

window._handleNotif=async function(el){
  const id=el.dataset.id, target=el.dataset.target;
  el.classList.remove('unread');
  const unread=document.querySelectorAll('.notif-item.unread').length;
  const badge=document.getElementById('notifBadge');
  if(unread===0) badge.classList.remove('show');
  else{badge.textContent=unread>9?'9+':unread;}
  try{await supabase.from('notifications').update({is_read:true}).eq('id',id);}catch(e){}
  if(target&&target!=='#') window.location.href=target;
};

document.getElementById('notifMarkAll').addEventListener('click',async function(){
  if(!currentSupaUser)return;
  document.querySelectorAll('.notif-item.unread').forEach(el=>el.classList.remove('unread'));
  document.getElementById('notifBadge').classList.remove('show');
  try{await supabase.from('notifications').update({is_read:true}).eq('recipient_id',currentSupaUser.user_id).eq('is_read',false);}catch(e){}
});

// Bell toggle
document.getElementById('notifBellBtn').addEventListener('click',function(e){
  e.stopPropagation();
  const panel=document.getElementById('notifPanel');
  const btn=this;
  const isOpen=panel.classList.contains('open');
  // close settings if open
  closeSettings();
  if(isOpen){ panel.classList.remove('open'); return; }
  // position below bell
  const r=btn.getBoundingClientRect();
  panel.style.top=(r.bottom+8)+'px';
  panel.style.right=Math.max(8,window.innerWidth-r.right)+'px';
  panel.style.left='auto';
  panel.classList.add('open');
  if(currentSupaUser) loadNotifications();
  setTimeout(()=>document.addEventListener('click',function oc(e){
    if(!panel.contains(e.target)&&e.target!==btn&&!btn.contains(e.target)){
      panel.classList.remove('open');
    }
    document.removeEventListener('click',oc);
  },10));
});

/* ══════════════════════════════════════════════
   CARD PREVIEW POPUP
══════════════════════════════════════════════ */
let previewMCQAnswered = false;

window.openCardPreview = async function(type, id){
  const overlay=document.getElementById('cardPreviewOverlay');
  const inner=document.getElementById('cardPreviewInner');
  previewMCQAnswered = false;
  inner.innerHTML='<div class="cp-loading"><div class="cp-loading-ring"></div></div>';
  overlay.classList.add('open');

  try{
    if(type==='article' || type==='mcq'){
      const{data:art}=await supabase.from('articles').select('*').eq('id',id).single();
      if(!art){inner.innerHTML='<p style="padding:20px;color:var(--text-secondary);">Not found</p>';return;}

      // fetch author
      let authorName='Unknown', authorPfp=null;
      if(art.firebase_user_id){
        const{data:au}=await supabase.from('users').select('username,pfp').eq('firebase_uid',art.firebase_user_id).single();
        if(au){ authorName=au.username?`@${au.username}`:'Unknown'; authorPfp=au.pfp||null; }
      }

      const mcq=isMCQ(art.content);
      const badgeClass=mcq?'mcq':'article';
      const badgeLabel=mcq?'MCQ':'Article';

      let contentHTML='';
      if(mcq){
        const lines=(art.content||'').trim().split('\n').map(l=>l.trim()).filter(Boolean);
        const question=lines[0].replace(/^❔/,'').trim();
        const rawOpts=lines.slice(1).map(l=>({label:l.replace(/^✅/,'').trim(),correct:l.startsWith('✅')}));
        // shuffle options
        for(let i=rawOpts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rawOpts[i],rawOpts[j]]=[rawOpts[j],rawOpts[i]];}
        const letters=['A','B','C','D','E','F'];
        const optsHTML=rawOpts.map((o,i)=>
          `<button class="cp-mcq-opt" data-correct="${o.correct}">
            <span class="opt-l">${letters[i]||i+1}</span>
            <span>${esc(o.label)}</span>
          </button>`).join('');
        contentHTML=`
          <div class="cp-mcq-q">${esc(question)}</div>
          <div class="cp-mcq-opts" id="cpMcqOpts">${optsHTML}</div>
          <div class="cp-mcq-result" id="cpMcqResult"></div>`;
      } else {
        const excerpt=trunc((art.content||'').replace(/\n/g,' '),320);
        contentHTML=`<div class="cp-excerpt">${esc(excerpt)}${(art.content||'').length>320?'…':''}</div>`;
      }

      inner.innerHTML=`
        <div class="cp-type-badge ${badgeClass}"><i class="fas fa-${mcq?'question-circle':'file-alt'}"></i> ${badgeLabel}</div>
        <div class="cp-title">${esc(art.title||'Untitled')}</div>
        <div class="cp-meta">
          <span class="cp-meta-item"><i class="fas fa-eye"></i>${fmtNum(art.views||0)}</span>
          <span class="cp-meta-item"><i class="fas fa-heart"></i>${fmtNum(art.likes||0)}</span>
          <span class="cp-meta-item"><i class="fas fa-user"></i>${esc(authorName)}</span>
        </div>
        ${contentHTML}
        <div class="cp-actions">
          <button class="cp-btn-primary" onclick="location.href='https://patholytica.com/dailyfeed?article=${id}'">
            <i class="fas fa-book-open"></i> Read in Feed
          </button>
          <button class="cp-btn-secondary" onclick="closeCardPreview()">
            <i class="fas fa-times"></i>
          </button>
        </div>`;

      // wire up MCQ interactivity
      if(mcq){
        inner.querySelectorAll('.cp-mcq-opt').forEach(btn=>{
          btn.addEventListener('click',()=>{
            if(previewMCQAnswered)return;
            previewMCQAnswered=true;
            const isCorrect=btn.dataset.correct==='true';
            inner.querySelectorAll('.cp-mcq-opt').forEach(b=>b.disabled=true);
            const res=document.getElementById('cpMcqResult');
            if(isCorrect){
              btn.classList.add('correct');
              if(res){res.textContent='✓ Correct!';res.className='cp-mcq-result correct';}
            } else {
              btn.classList.add('wrong');
              const cb=inner.querySelector('.cp-mcq-opt[data-correct="true"]');
              if(cb)cb.classList.add('reveal');
              if(res){res.textContent='✗ Incorrect';res.className='cp-mcq-result wrong';}
            }
          });
        });
      }

    } else if(type==='library'){
      const{data:lib}=await supabase.from('playlists').select('*').eq('id',id).single();
      if(!lib){inner.innerHTML='<p style="padding:20px;color:var(--text-secondary);">Not found</p>';return;}

      const{count:artCount}=await supabase.from('playlist_items')
        .select('*',{count:'exact',head:true}).eq('playlist_id',id);

      // fetch saved libraries (top 5 shown at top)
      const savedLibs = await getFavedLibIds();
      const isSaved = savedLibs.has(String(id));

      // creator
      let creatorName='Unknown';
      if(lib.user_id){
        const{data:cr}=await supabase.from('users').select('username').eq('user_id',lib.user_id).single();
        if(cr) creatorName=cr.username?`@${cr.username}`:'Unknown';
      }

      inner.innerHTML=`
        <div class="cp-type-badge library"><i class="fas fa-layer-group"></i> Library</div>
        <div class="cp-title">${esc(lib.name||'Untitled Library')}</div>
        <div class="cp-meta">
          <span class="cp-meta-item"><i class="fas fa-layer-group"></i>${artCount||0} articles</span>
          <span class="cp-meta-item"><i class="fas fa-user"></i>${esc(creatorName)}</span>
        </div>
        ${lib.description?`<div class="cp-lib-desc">${esc(lib.description)}</div>`:''}
        <div class="cp-lib-save-row">
          <button class="cp-save-btn ${isSaved?'saved':''}" id="cpSaveBtn" onclick="window._cpToggleSave(${id})">
            <i class="fas fa-bookmark"></i> ${isSaved?'Saved':'Save Library'}
          </button>
        </div>
        <div class="cp-actions">
          <button class="cp-btn-primary" onclick="location.href='https://patholytica.com/dailyfeed?playlist=${id}'">
            <i class="fas fa-play"></i> Study Now
          </button>
          <button class="cp-btn-secondary" onclick="closeCardPreview()">
            <i class="fas fa-times"></i>
          </button>
        </div>`;
    }
  }catch(e){
    inner.innerHTML='<p style="padding:20px;color:var(--text-secondary);text-align:center;">Failed to load</p>';
  }
};

// helper to get current saved lib ids (from memory or supabase)
async function getFavedLibIds(){
  if(userFavourites.size>0) return userFavourites;
  if(!currentSupaUser) return new Set();
  try{
    const{data}=await supabase.from('favourite_playlists').select('playlist_id').eq('user_id',currentSupaUser.user_id);
    const s=new Set();(data||[]).forEach(r=>s.add(String(r.playlist_id)));
    return s;
  }catch(e){return new Set();}
}

window._cpToggleSave=async function(playlistId){
  const btn=document.getElementById('cpSaveBtn');
  if(!btn)return;
  const newState=await toggleFavourite(playlistId);
  if(newState===undefined)return;
  btn.className=`cp-save-btn ${newState?'saved':''}`;
  btn.innerHTML=`<i class="fas fa-bookmark"></i> ${newState?'Saved':'Save Library'}`;
};

window.closeCardPreview=function(e){
  if(!e||e.target===document.getElementById('cardPreviewOverlay')){
    document.getElementById('cardPreviewOverlay').classList.remove('open');
  }
};

/* ══════════════════════════════════════════════
   CREATORS STRIP
══════════════════════════════════════════════ */
async function loadCreators(){
  const strip=document.getElementById('creatorsStrip');
  try{
    const{data:arts}=await supabase.from('articles').select('firebase_user_id');
    if(!arts){strip.innerHTML='';return;}
    const counts={};
    arts.forEach(a=>{if(a.firebase_user_id)counts[a.firebase_user_id]=(counts[a.firebase_user_id]||0)+1;});
    const topUids=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([u])=>u);
    if(!topUids.length){strip.innerHTML='';return;}
    const{data:users}=await supabase.from('users').select('firebase_uid,username,full_name,pfp').in('firebase_uid',topUids);
    const um={};(users||[]).forEach(u=>{um[u.firebase_uid]=u;});
    strip.innerHTML=topUids.map(uid=>{
      const u=um[uid];
      const name=u?.username?'@'+u.username:(u?.full_name||'?');
      const init=(name.replace(/^@/,'')||'?')[0].toUpperCase();
      const av=u?.pfp?`<img src="${esc(u.pfp)}" alt="${init}">`:`${init}`;
      return`<div class="creator-pill" onclick="openUserPopup('${uid}')">
        <div class="creator-pill-avatar">${av}</div>
        <div class="creator-pill-name">${esc(name)}</div>
      </div>`;
    }).join('');
  }catch(e){strip.innerHTML='';}
}

function buildArticlePin(article, imageUrl){
  const div=document.createElement('div');
  div.className='pin-card';
  const mcq=isMCQ(article.content);
  const title=article.title||'Untitled';
  const type=mcq?'mcq':'article';

  let imgSrc=imageUrl, imgH=null;
  if(!imgSrc){
    const stock=stockFor(article.id);
    imgSrc=stock.url; imgH=stock.h;
  }
  const imgStyle=imgH?`height:${imgH}px;`:'';

  div.innerHTML=`
    <img class="pin-card-img${imgH?' fixed-ratio':''}"
         src="${esc(imgSrc)}" alt="${esc(title)}" loading="lazy"
         style="${imgStyle}object-fit:cover;"
         onerror="this.style.display='none';this.nextElementSibling&&(this.nextElementSibling.style.display='flex')">
    <div class="pin-card-img-fallback" style="display:none;height:${imgH||220}px;">
      <i class="fas fa-file-alt"></i>
    </div>
    <div class="pin-card-overlay">
      <div class="pin-overlay-title">${esc(trunc(title,90))}</div>
      <div class="pin-overlay-meta">
        ${mcq
          ?`<div class="pin-badge mcq-badge"><i class="fas fa-question-circle"></i> MCQ</div>`
          :`<div class="pin-badge art-badge"><i class="fas fa-file-alt"></i> Article</div>`
        }
        <span class="pin-stat"><i class="fas fa-eye"></i>${fmtNum(article.views||0)}</span>
        <span class="pin-stat"><i class="fas fa-heart"></i>${fmtNum(article.likes||0)}</span>
      </div>
    </div>`;

  // single tap → preview popup; double-tap / read-more → feed
  div.addEventListener('click', ()=>{ openCardPreview(type, article.id); });
  return div;
}

   MAIN LOADER
   Saved libraries bubble to the top of each batch
══════════════════════════════════════════════ */
async function loadBatch(isInitial=true){
  if(artLoading||(!isInitial&&!artHasMore))return;
  artLoading=true;
  const grid=document.getElementById('mainGrid');
  if(isInitial) injectSkeletons(10);

  try{
    const{data:arts,error:aErr}=await supabase
      .from('articles').select('*')
      .order('created_at',{ascending:false})
      .range(artOffset, artOffset+ART_BATCH-1);
    if(aErr)throw aErr;

    if(!arts||arts.length===0){ artHasMore=false; }
    else{
      artOffset+=arts.length;
      if(arts.length<ART_BATCH) artHasMore=false;

      const artIds=arts.map(a=>a.id);
      const{data:media}=await supabase.from('media').select('article_id,url,type')
        .in('article_id',artIds).eq('type','image').order('display_order',{ascending:true});
      const imgMap={};
      (media||[]).forEach(m=>{if(!imgMap[m.article_id])imgMap[m.article_id]=m.url;});

      const{data:libs}=await supabase.from('playlists').select('*')
        .order('created_at',{ascending:false})
        .range(libOffset, libOffset+LIB_PER_BATCH-1);
      libOffset+=(libs||[]).length;

      const libIds=(libs||[]).map(l=>l.id);
      let libCountMap={};
      if(libIds.length){
        const{data:irows}=await supabase.from('playlist_items').select('playlist_id').in('playlist_id',libIds);
        (irows||[]).forEach(r=>{libCountMap[r.playlist_id]=(libCountMap[r.playlist_id]||0)+1;});
      }

      // Sort libs: saved ones float to top (max 5 saved shown first)
      let sortedLibs = [...(libs||[])];
      if(userFavourites.size>0){
        const saved   = sortedLibs.filter(l=>userFavourites.has(String(l.id))).slice(0,5);
        const unsaved = sortedLibs.filter(l=>!userFavourites.has(String(l.id)));
        sortedLibs = [...saved, ...unsaved];
      }

      clearSkeletons();

      let libIdx=0;
      arts.forEach((art,i)=>{
        grid.appendChild(buildArticlePin(art, imgMap[art.id]||null));
        if((i+1)%4===0 && libIdx<sortedLibs.length){
          const lib=sortedLibs[libIdx++];
          grid.appendChild(buildLibraryPin(lib, libCountMap[lib.id]||0));
        }
      });
      while(libIdx<sortedLibs.length){
        const l=sortedLibs[libIdx++];
        grid.appendChild(buildLibraryPin(l,libCountMap[l.id]||0));
      }
    }

    const lmw=document.getElementById('loadMoreWrap');
    const lmb=document.getElementById('loadMoreBtn');
    if(artHasMore){ lmw.style.display='block'; lmb.disabled=false; lmb.innerHTML='<i class="fas fa-chevron-down"></i> Load more'; }
    else lmw.style.display='none';

  }catch(e){
    console.error(e);
    clearSkeletons();
    document.getElementById('mainGrid').innerHTML+=
      `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load</p></div>`;
  }finally{
    artLoading=false;
  }
}

window.loadMore=async function(){
  const btn=document.getElementById('loadMoreBtn');
  btn.disabled=true; btn.innerHTML='<i class="fas fa-circle-notch fa-spin"></i> Loading…';
  injectSkeletons(4);
  await loadBatch(false);
};

/* ── INIT ── */
loadCreators();
loadBatch(true);
</script>
