<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Patholytica · Tag Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://js.puter.com/v2/"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f0e0b;
      --bg2:       #161410;
      --bg3:       #1c1a14;
      --border:    #2a2518;
      --border2:   #352e1e;
      --gold:      #c8a96e;
      --gold-dim:  #8a7249;
      --gold-glow: rgba(200,169,110,0.12);
      --text:      #e8e0cc;
      --muted:     #7a7060;
      --danger:    #c0624a;
      --success:   #5a9e72;
      --tag-bg:    rgba(200,169,110,0.1);
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      font-size: 15px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-logo {
      font-family: 'Merriweather', serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.03em;
    }
    .header-logo span {
      color: var(--muted);
      font-weight: 300;
      font-size: 14px;
      margin-left: 10px;
      font-family: 'DM Sans', sans-serif;
    }
    .header-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
    }
    .status-dot.connected { background: var(--success); box-shadow: 0 0 6px var(--success); }

    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: calc(100vh - 61px);
    }

    .sidebar {
      background: var(--bg2);
      border-right: 1px solid var(--border);
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .sidebar-section-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .config-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .config-field label { font-size: 12px; color: var(--muted); }
    .config-field input, .config-field select {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      outline: none;
      width: 100%;
      transition: border-color 0.2s;
    }
    .config-field input:focus, .config-field select:focus { border-color: var(--gold-dim); }
    .config-field input::placeholder { color: var(--muted); }

    /* Service badge pill inside the config section */
    .service-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 4px;
      margin-top: 4px;
      width: fit-content;
    }
    .service-badge.puter  { background: rgba(90,158,114,0.12); color: var(--success); border: 1px solid rgba(90,158,114,0.3); }
    .service-badge.bl     { background: rgba(200,169,110,0.12); color: var(--gold);    border: 1px solid var(--gold-dim); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: 7px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--gold); color: #0f0e0b; width: 100%; }
    .btn-primary:hover { background: #d4b87a; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }
    .btn-ghost:hover { border-color: var(--border2); color: var(--text); }

    .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-box {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .stat-num {
      font-family: 'Merriweather', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--gold);
    }
    .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .progress-wrap {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .progress-bar-bg { background: var(--border); border-radius: 99px; height: 5px; overflow: hidden; }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold-dim), var(--gold));
      border-radius: 99px;
      transition: width 0.5s ease;
      width: 0%;
    }
    .divider { border: none; border-top: 1px solid var(--border); }

    .main { display: flex; flex-direction: column; }
    .main-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      flex-wrap: wrap;
    }
    .toolbar-left { display: flex; align-items: center; gap: 12px; }
    .queue-title { font-family: 'Merriweather', serif; font-size: 16px; font-weight: 700; color: var(--text); }
    .queue-count {
      background: var(--tag-bg);
      color: var(--gold);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 500;
    }
    .toolbar-right { display: flex; align-items: center; gap: 8px; }
    .btn-run-all {
      background: var(--gold);
      color: #0f0e0b;
      padding: 8px 18px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s;
    }
    .btn-run-all:hover { background: #d4b87a; }
    .btn-run-all:disabled { opacity: 0.4; cursor: not-allowed; }

    .cards-container {
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      flex: 1;
    }

    .article-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .article-card:hover { border-color: var(--border2); }
    .article-card.tagging { border-color: var(--gold-dim); box-shadow: 0 0 0 2px var(--gold-glow); }
    .article-card.done { border-color: rgba(90,158,114,0.35); }
    .article-card.error { border-color: rgba(192,98,74,0.35); }

    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px 18px 14px;
    }
    .card-index { font-family: 'Merriweather', serif; font-size: 11px; color: var(--muted); min-width: 22px; margin-top: 3px; }
    .card-meta { flex: 1; min-width: 0; }
    .card-title { font-family: 'Merriweather', serif; font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.45; margin-bottom: 5px; }
    .card-excerpt { font-size: 12px; color: var(--muted); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-badge {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-pending  { background: rgba(122,112,96,0.15); color: var(--muted); border: 1px solid var(--border); }
    .badge-tagging  { background: rgba(200,169,110,0.12); color: var(--gold); border: 1px solid var(--gold-dim); }
    .badge-done     { background: rgba(90,158,114,0.12); color: var(--success); border: 1px solid rgba(90,158,114,0.3); }
    .badge-error    { background: rgba(192,98,74,0.12); color: var(--danger); border: 1px solid rgba(192,98,74,0.3); }

    .card-body { padding: 0 18px 14px 54px; }

    .tag-area {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
      min-height: 32px;
    }
    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--tag-bg);
      border: 1px solid rgba(200,169,110,0.25);
      color: var(--gold);
      border-radius: 5px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 500;
    }
    .remove-tag {
      cursor: pointer;
      color: var(--gold-dim);
      font-size: 10px;
      line-height: 1;
      transition: color 0.15s;
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
    }
    .remove-tag:hover { color: var(--danger); }

    .tag-input-wrap { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
    .tag-input {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 5px 9px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      outline: none;
      width: 160px;
      transition: border-color 0.2s;
    }
    .tag-input:focus { border-color: var(--gold-dim); }
    .tag-input::placeholder { color: var(--muted); }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px 14px 54px;
      gap: 8px;
    }
    .card-footer-left { display: flex; align-items: center; gap: 8px; }

    .btn-tag-ai {
      background: transparent;
      border: 1px solid var(--gold-dim);
      color: var(--gold);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
    }
    .btn-tag-ai:hover { background: var(--gold-glow); }
    .btn-tag-ai:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-save {
      background: var(--success);
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
    }
    .btn-save:hover { background: #4e8e65; }
    .btn-save:disabled { opacity: 0.4; cursor: not-allowed; }

    .thinking-pulse {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--gold-dim);
      font-style: italic;
    }
    .thinking-pulse::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--gold);
      animation: pulse 1s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1); }
    }

    .state-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 40px;
      text-align: center;
      gap: 14px;
      flex: 1;
    }
    .state-icon { font-size: 36px; color: var(--border2); }
    .state-title { font-family: 'Merriweather', serif; font-size: 16px; color: var(--muted); }
    .state-sub { font-size: 13px; color: var(--border2); max-width: 300px; line-height: 1.6; }

    #toast {
      position: fixed;
      bottom: 28px; right: 28px;
      background: var(--bg3);
      border: 1px solid var(--border2);
      color: var(--text);
      padding: 12px 18px;
      border-radius: 9px;
      font-size: 13px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      gap: 9px;
      z-index: 999;
      max-width: 320px;
    }
    #toast.show { display: flex; animation: slideUp 0.25s ease; }
    #toast.success { border-color: rgba(90,158,114,0.4); }
    #toast.error   { border-color: rgba(192,98,74,0.4); }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .skeleton {
      background: linear-gradient(90deg, var(--bg3) 25%, var(--border) 50%, var(--bg3) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 5px;
    }
    @keyframes shimmer {
      from { background-position: 200% 0; }
      to   { background-position: -200% 0; }
    }
    .skel-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .skel-line { height: 12px; }
    .skel-line.w80 { width: 80%; }
    .skel-line.w60 { width: 60%; }
    .skel-line.w40 { width: 40%; }

    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
      .header { padding: 14px 18px; }
      .cards-container { padding: 16px; }
      .main-toolbar { padding: 14px 16px; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-logo">Patholytica <span>Tag Studio</span></div>
  <div class="header-status">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Not connected</span>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">

    <!-- ── Supabase ── -->
    <div>
      <div class="sidebar-section-label">Supabase Config</div>
      <div class="config-field">
        <label>Project URL</label>
        <input id="sbUrl" type="text" placeholder="https://xxx.supabase.co" />
      </div>
      <div class="config-field">
        <label>Anon Key</label>
        <input id="sbKey" type="password" placeholder="eyJ..." />
      </div>
      <div class="config-field">
        <label>Table</label>
        <input id="sbTable" type="text" value="articles" />
      </div>
      <div class="config-field">
        <label>Tags column</label>
        <input id="tagsCol" type="text" value="tags" />
      </div>
      <button class="btn btn-primary" id="btnLoad">
        <i class="fa fa-plug"></i> Connect &amp; Load
      </button>
    </div>

    <hr class="divider" />

    <!-- ── AI Service ── -->
    <div>
      <div class="sidebar-section-label">AI Service</div>

      <div class="config-field">
        <label>Provider</label>
        <select id="aiService">
          <option value="puter">Puter.js (Free)</option>
          <option value="bazaarlink">BazaarLink</option>
        </select>
      </div>

      <!-- BazaarLink key — hidden by default -->
      <div class="config-field" id="blKeyWrap" style="display:none">
        <label>BazaarLink API Key</label>
        <input id="blApiKey" type="password" value="sk-bl-d1Y95l1L3ILm4GXZ7AQ8aqS1CijlWk2TG2cR7m8ilqAnliYQ" />
      </div>

      <div class="config-field">
        <label>Model</label>
        <select id="aiModel">
          <!-- populated by JS on load / service change -->
        </select>
      </div>

      <div class="config-field">
        <label>Max tags per article</label>
        <input id="maxTags" type="number" value="5" min="1" max="15" />
      </div>
    </div>

    <hr class="divider" />

    <!-- ── Stats ── -->
    <div>
      <div class="sidebar-section-label">Session Stats</div>
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-num" id="statTotal">—</div>
          <div class="stat-label">Untagged</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="statDone">0</div>
          <div class="stat-label">Tagged</div>
        </div>
      </div>
      <div style="margin-top:12px;">
        <div class="progress-wrap">
          <div class="progress-label">
            <span>Progress</span>
            <span id="progressPct">0%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill"></div>
          </div>
        </div>
      </div>
    </div>

  </aside>

  <main class="main">
    <div class="main-toolbar">
      <div class="toolbar-left">
        <span class="queue-title">Tagging Queue</span>
        <span class="queue-count" id="queueCount">0 articles</span>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-ghost" id="btnRefresh" style="display:none">
          <i class="fa fa-rotate-right"></i> Refresh
        </button>
        <button class="btn-run-all" id="btnTagAll" disabled>
          <i class="fa fa-wand-magic-sparkles"></i> Tag All with AI
        </button>
      </div>
    </div>

    <div class="cards-container" id="cardsContainer">
      <div class="state-panel">
        <div class="state-icon"><i class="fa fa-database"></i></div>
        <div class="state-title">Connect to get started</div>
        <div class="state-sub">Enter your Supabase credentials in the sidebar and click Connect to load untagged articles.</div>
      </div>
    </div>
  </main>
</div>

<div id="toast"></div>

<script>
(function () {

  // ── Model lists ─────────────────────────────────────────
  var MODELS_PUTER = [
    { value: 'anthropic/claude-opus-4-8',    label: 'Claude Opus 4.8' },
    { value: 'anthropic/claude-sonnet-4-6',  label: 'Claude Sonnet 4.6', selected: true },
    { value: 'openai/gpt-5.5',               label: 'GPT-5.5' },
    { value: 'google/gemini-3.5-flash',      label: 'Gemini 3.5 Flash' },
    { value: 'deepseek/deepseek-v4-pro',     label: 'DeepSeek V4 Pro' }
  ];

  var MODELS_BL = [
    { value: 'anthropic/claude-sonnet-4.6',  label: 'Claude Sonnet 4.6', selected: true },
    { value: 'anthropic/claude-opus-4.8',    label: 'Claude Opus 4.8' },
    { value: 'openai/gpt-5.5',               label: 'GPT-5.5' },
    { value: 'google/gemini-3.5-flash',      label: 'Gemini 3.5 Flash' },
    { value: 'deepseek/deepseek-v4-pro',     label: 'DeepSeek V4 Pro' },
    { value: 'auto',                          label: 'Auto (Best fit)' }
  ];

  // ── State ────────────────────────────────────────────────
  var sbClient    = null;
  var articles    = [];
  var taggedCount = 0;
  var isTaggingAll= false;
  var cardTags    = {};
  var toastTimer  = null;

  // ── Boot ─────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', function () {
    // Restore Supabase URL
    var saved = localStorage.getItem('patholytica_sb_url');
    if (saved) document.getElementById('sbUrl').value = saved;
    document.getElementById('sbUrl').addEventListener('change', function (e) {
      localStorage.setItem('patholytica_sb_url', e.target.value.trim());
    });

    // Populate model list for default service
    populateModels('puter');

    // Service switcher
    document.getElementById('aiService').addEventListener('change', function () {
      populateModels(this.value);
      document.getElementById('blKeyWrap').style.display =
        this.value === 'bazaarlink' ? 'block' : 'none';
    });

    document.getElementById('btnLoad').addEventListener('click', loadArticles);
    document.getElementById('btnRefresh').addEventListener('click', loadArticles);
    document.getElementById('btnTagAll').addEventListener('click', tagAll);
  });

  // ── Model dropdown ────────────────────────────────────────
  function populateModels(service) {
    var list   = service === 'bazaarlink' ? MODELS_BL : MODELS_PUTER;
    var select = document.getElementById('aiModel');
    select.innerHTML = list.map(function (m) {
      return '<option value="' + m.value + '"' + (m.selected ? ' selected' : '') + '>' +
             m.label + '</option>';
    }).join('');
  }

  // ── Supabase client ───────────────────────────────────────
  function getClient() {
    var url = document.getElementById('sbUrl').value.trim().replace(/\/$/, '');
    var key = document.getElementById('sbKey').value.trim();
    if (!url || !key) { showToast('Enter Supabase URL and key first', 'error'); return null; }
    sbClient = window.supabase.createClient(url, key);
    return sbClient;
  }

  // ── Load articles ─────────────────────────────────────────
  async function loadArticles() {
    var client = getClient();
    if (!client) return;

    var table   = document.getElementById('sbTable').value.trim() || 'articles';
    var tagsCol = document.getElementById('tagsCol').value.trim() || 'tags';
    var btnLoad = document.getElementById('btnLoad');

    btnLoad.disabled = true;
    btnLoad.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Loading…';
    setStatus('connecting');
    showSkeletons();

    try {
      var result = await client
        .from(table)
        .select('*')
        .or(tagsCol + '.is.null,' + tagsCol + '.eq.{}')
        .order('created_at', { ascending: false })
        .limit(100);

      if (result.error) throw result.error;

      articles    = result.data || [];
      cardTags    = {};
      taggedCount = 0;
      renderCards(articles);
      updateStats(articles.length, 0);
      setStatus('connected');
      document.getElementById('btnRefresh').style.display = 'flex';
      document.getElementById('btnTagAll').disabled = articles.length === 0;
      showToast('Loaded ' + articles.length + ' untagged article' + (articles.length !== 1 ? 's' : ''), 'success');
    } catch (err) {
      console.error(err);
      showToast('Failed to load: ' + err.message, 'error');
      setStatus('error');
      showErrorState(err.message);
    } finally {
      btnLoad.disabled = false;
      btnLoad.innerHTML = '<i class="fa fa-plug"></i> Connect &amp; Load';
    }
  }

  // ── Render cards ──────────────────────────────────────────
  function renderCards(data) {
    var container = document.getElementById('cardsContainer');
    document.getElementById('queueCount').textContent = data.length + ' article' + (data.length !== 1 ? 's' : '');

    if (data.length === 0) {
      container.innerHTML = '<div class="state-panel"><div class="state-icon"><i class="fa fa-check-circle" style="color:var(--success)"></i></div><div class="state-title">All caught up!</div><div class="state-sub">No untagged articles found.</div></div>';
      return;
    }

    container.innerHTML = data.map(function (article, i) {
      var title   = article.title || article.name || article.heading || '(Untitled)';
      var content = article.content || article.body || article.text || article.summary || article.excerpt || '';
      var snippet = (typeof content === 'string' ? content : JSON.stringify(content)).slice(0, 220);
      var id      = String(article.id);

      return '<div class="article-card" id="card-' + id + '" data-id="' + id + '">' +
        '<div class="card-header">' +
          '<div class="card-index">' + String(i + 1).padStart(2, '0') + '</div>' +
          '<div class="card-meta">' +
            '<div class="card-title">' + escHtml(title) + '</div>' +
            (snippet ? '<div class="card-excerpt">' + escHtml(snippet) + '</div>' : '') +
          '</div>' +
          '<span class="card-badge badge-pending" id="badge-' + id + '">Untagged</span>' +
        '</div>' +
        '<div class="card-body">' +
          '<div class="tag-area" id="tags-' + id + '"><span style="font-size:12px;color:var(--muted);font-style:italic">No tags yet</span></div>' +
          '<div class="tag-input-wrap">' +
            '<input class="tag-input" id="taginput-' + id + '" placeholder="Add tag manually…" data-card-id="' + id + '" />' +
            '<button class="btn btn-ghost" style="padding:5px 10px;font-size:11px" data-add-tag="' + id + '"><i class="fa fa-plus"></i></button>' +
          '</div>' +
        '</div>' +
        '<div class="card-footer">' +
          '<div class="card-footer-left">' +
            '<button class="btn-tag-ai" id="aibtn-' + id + '" data-ai-tag="' + id + '"><i class="fa fa-wand-magic-sparkles"></i> Tag with AI</button>' +
          '</div>' +
          '<button class="btn-save" id="savebtn-' + id + '" data-save="' + id + '"><i class="fa fa-floppy-disk"></i> Save Tags</button>' +
        '</div>' +
      '</div>';
    }).join('');

    container.addEventListener('click', handleCardClick);
    container.addEventListener('keydown', handleCardKeydown);
  }

  // ── Event delegation ──────────────────────────────────────
  function handleCardClick(e) {
    var aiBtn  = e.target.closest('[data-ai-tag]');
    var addBtn = e.target.closest('[data-add-tag]');
    var saveBtn= e.target.closest('[data-save]');
    var rmBtn  = e.target.closest('[data-remove-tag]');

    if (aiBtn)   tagArticleWithAI(aiBtn.dataset.aiTag);
    if (addBtn)  addManualTag(addBtn.dataset.addTag);
    if (saveBtn) saveArticleTags(saveBtn.dataset.save);
    if (rmBtn)   removeTag(rmBtn.dataset.removeTag, rmBtn.dataset.removeVal);
  }

  function handleCardKeydown(e) {
    if ((e.key === 'Enter' || e.key === ',') && e.target.dataset.cardId) {
      e.preventDefault();
      addManualTag(e.target.dataset.cardId);
    }
  }

  // ── Tag helpers ───────────────────────────────────────────
  function getTags(id) {
    if (!cardTags[id]) cardTags[id] = [];
    return cardTags[id];
  }

  function setTags(id, tags) {
    cardTags[id] = Array.from(new Set(
      tags.map(function (t) { return t.trim().toLowerCase(); }).filter(Boolean)
    ));
    renderTagChips(id);
  }

  function renderTagChips(id) {
    var area = document.getElementById('tags-' + id);
    if (!area) return;
    var tags = getTags(id);
    if (tags.length === 0) {
      area.innerHTML = '<span style="font-size:12px;color:var(--muted);font-style:italic">No tags yet</span>';
    } else {
      area.innerHTML = tags.map(function (t) {
        return '<span class="tag-chip">' + escHtml(t) +
          '<button class="remove-tag" data-remove-tag="' + id + '" data-remove-val="' + escHtml(t) + '" title="Remove">×</button>' +
          '</span>';
      }).join('');
    }
  }

  function removeTag(id, tag) {
    cardTags[id] = getTags(id).filter(function (t) { return t !== tag; });
    renderTagChips(id);
  }

  function addManualTag(id) {
    var inp = document.getElementById('taginput-' + id);
    if (!inp) return;
    var val = inp.value.trim().toLowerCase().replace(/,/g, '');
    if (val) {
      setTags(id, getTags(id).concat([val]));
      inp.value = '';
      inp.focus();
    }
  }

  // ── AI tagging (branched by service) ─────────────────────
  async function tagArticleWithAI(id) {
    var article = articles.find(function (a) { return String(a.id) === String(id); });
    if (!article) return;

    var service = document.getElementById('aiService').value;
    var model   = document.getElementById('aiModel').value;
    var maxTags = parseInt(document.getElementById('maxTags').value) || 5;

    var card    = document.getElementById('card-' + id);
    var badge   = document.getElementById('badge-' + id);
    var aibtn   = document.getElementById('aibtn-' + id);
    var tagArea = document.getElementById('tags-' + id);

    card.classList.add('tagging');
    badge.className = 'card-badge badge-tagging';
    badge.textContent = 'Tagging…';
    aibtn.disabled = true;
    tagArea.innerHTML = '<div class="thinking-pulse">AI is reading…</div>';

    var title   = article.title || article.name || article.heading || '';
    var content = article.content || article.body || article.text || article.summary || '';
    var snippet = (typeof content === 'string' ? content : JSON.stringify(content)).slice(0, 1200);

    var prompt =
      'You are a medical education content tagger for Patholytica, an adaptive learning platform.\n\n' +
      'Article title: "' + title + '"\n' +
      'Article content (excerpt): "' + snippet + '"\n\n' +
      'Generate up to ' + maxTags + ' precise, lowercase, hyphenated tags for this article.\n' +
      'Tags should reflect: medical specialty, organ system, condition/disease, clinical concept, or learning topic.\n' +
      'Examples of good tags: nephrology, aki, fluid-overload, ecg-interpretation, pharmacology, type-2-diabetes\n\n' +
      'Return ONLY a JSON array of tag strings — no explanation, no markdown. Example: ["nephrology","aki","fluid-management"]';

    try {
      var raw = '';

      if (service === 'bazaarlink') {
        // ── BazaarLink path ──────────────────────────────
        var apiKey = document.getElementById('blApiKey').value.trim();
        if (!apiKey) throw new Error('BazaarLink API key is missing');

        var res = await fetch('https://bazaarlink.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type':  'application/json',
            'Authorization': 'Bearer ' + apiKey
          },
          body: JSON.stringify({
            model:       model,
            messages:    [{ role: 'user', content: prompt }],
            max_tokens:  600,
            temperature: 0.3
          })
        });

        if (!res.ok) {
          var errBody = await res.json().catch(function () { return {}; });
          throw new Error(
            (errBody.error && errBody.error.message)
              ? errBody.error.message
              : 'BazaarLink error ' + res.status
          );
        }

        var data = await res.json();
        raw = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';

      } else {
        // ── Puter.js path ────────────────────────────────
        var response = await puter.ai.chat(prompt, { model: model });

        if (typeof response === 'string') {
          raw = response;
        } else if (response && response.message && response.message.content) {
          raw = Array.isArray(response.message.content)
            ? response.message.content.map(function (c) { return c.text || ''; }).join('')
            : response.message.content;
        } else {
          raw = JSON.stringify(response);
        }
      }

      // ── Parse JSON array from raw ────────────────────
      var match = raw.match(/\[[\s\S]*?\]/);
      if (!match) throw new Error('No JSON array in AI response');
      var tags = JSON.parse(match[0]);
      if (!Array.isArray(tags)) throw new Error('AI did not return an array');

      setTags(id, tags);
      card.classList.remove('tagging');
      badge.className = 'card-badge badge-done';
      badge.textContent = 'AI Tagged';

    } catch (err) {
      console.error('AI error:', err);
      card.classList.remove('tagging');
      card.classList.add('error');
      badge.className = 'card-badge badge-error';
      badge.textContent = 'Error';
      tagArea.innerHTML = '<span style="font-size:12px;color:var(--danger)"><i class="fa fa-triangle-exclamation"></i> ' + escHtml(err.message) + '</span>';
      showToast('AI error: ' + err.message, 'error');
    } finally {
      aibtn.disabled = false;
    }
  }

  // ── Save to Supabase ──────────────────────────────────────
  async function saveArticleTags(id) {
    if (!sbClient) { showToast('Not connected to Supabase', 'error'); return; }

    var table   = document.getElementById('sbTable').value.trim() || 'articles';
    var tagsCol = document.getElementById('tagsCol').value.trim() || 'tags';
    var tags    = getTags(id);
    var savebtn = document.getElementById('savebtn-' + id);
    var badge   = document.getElementById('badge-' + id);
    var card    = document.getElementById('card-' + id);

    if (tags.length === 0) { showToast('Add at least one tag before saving', 'error'); return; }

    savebtn.disabled = true;
    savebtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Saving…';

    try {
      var update = {};
      update[tagsCol] = tags;
      var result = await sbClient.from(table).update(update).eq('id', id);
      if (result.error) throw result.error;

      card.classList.remove('tagging', 'error');
      card.classList.add('done');
      badge.className = 'card-badge badge-done';
      badge.textContent = 'Saved ✓';
      savebtn.innerHTML = '<i class="fa fa-check"></i> Saved';
      savebtn.disabled = true;

      taggedCount++;
      updateStats(articles.length, taggedCount);
      var art = articles.find(function (a) { return String(a.id) === String(id); });
      showToast('Saved ' + tags.length + ' tags for "' + (art ? escHtml(art.title || id) : id) + '"', 'success');
    } catch (err) {
      console.error(err);
      showToast('Save failed: ' + err.message, 'error');
      savebtn.disabled = false;
      savebtn.innerHTML = '<i class="fa fa-floppy-disk"></i> Save Tags';
    }
  }

  // ── Tag All ───────────────────────────────────────────────
  async function tagAll() {
    if (isTaggingAll) return;
    isTaggingAll = true;
    var btn = document.getElementById('btnTagAll');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Tagging…';
    var saved = 0;

    for (var i = 0; i < articles.length; i++) {
      var id    = String(articles[i].id);
      var badge = document.getElementById('badge-' + id);
      if (badge && badge.textContent === 'Saved ✓') continue;

      await tagArticleWithAI(id);
      var tags = getTags(id);
      if (tags.length > 0) {
        await saveArticleTags(id);
        saved++;
      }
      await new Promise(function (r) { setTimeout(r, 800); });
    }

    btn.disabled = false;
    btn.innerHTML = '<i class="fa fa-wand-magic-sparkles"></i> Tag All with AI';
    isTaggingAll = false;
    showToast('Done! Tagged and saved ' + saved + ' articles.', 'success');
  }

  // ── UI helpers ────────────────────────────────────────────
  function setStatus(state) {
    var dot  = document.getElementById('statusDot');
    var text = document.getElementById('statusText');
    dot.className = 'status-dot';
    dot.style.background = '';
    if (state === 'connected') {
      dot.classList.add('connected');
      text.textContent = 'Connected';
    } else if (state === 'connecting') {
      text.textContent = 'Connecting…';
    } else if (state === 'error') {
      dot.style.background = 'var(--danger)';
      text.textContent = 'Connection error';
    } else {
      text.textContent = 'Not connected';
    }
  }

  function updateStats(total, done) {
    document.getElementById('statTotal').textContent = total - done;
    document.getElementById('statDone').textContent  = done;
    var pct = total > 0 ? Math.round((done / total) * 100) : 0;
    document.getElementById('progressPct').textContent  = pct + '%';
    document.getElementById('progressFill').style.width = pct + '%';
  }

  function showSkeletons() {
    var html = '';
    for (var i = 0; i < 4; i++) {
      html += '<div class="skel-card"><div class="skel-line skeleton w80"></div><div class="skel-line skeleton w60" style="margin-top:6px"></div><div class="skel-line skeleton w40" style="margin-top:10px"></div></div>';
    }
    document.getElementById('cardsContainer').innerHTML = html;
  }

  function showErrorState(msg) {
    document.getElementById('cardsContainer').innerHTML =
      '<div class="state-panel"><div class="state-icon"><i class="fa fa-triangle-exclamation" style="color:var(--danger)"></i></div><div class="state-title">Load failed</div><div class="state-sub">' + escHtml(msg) + '</div></div>';
  }

  function showToast(msg, type) {
    var el   = document.getElementById('toast');
    var icon = type === 'success' ? '✓' : type === 'error' ? '⚠' : 'ℹ';
    el.className = 'show ' + (type || '');
    el.innerHTML = '<span>' + icon + '</span><span>' + escHtml(msg) + '</span>';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = ''; }, 3200);
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

})();
</script>
</body>
</html>
