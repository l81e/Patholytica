<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Patholytica — Home</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@400;700&family=Caveat:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>

:root {
  --bg-color: #0f0e0b;
  --text-primary: #f5f0e8;
  --text-secondary: #8a8070;
  --hover-bg: #1a1810;
  --border-color: #2a2518;
  --accent: #c8a96e;
  --accent-hover: #b8935a;
  --accent-glow: rgba(200,169,110,0.25);
  --accent-soft: rgba(200,169,110,0.12);
  --font-article: 'Merriweather', serif;
  --font-ui: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
}
body.theme-dark {
  --bg-color: #0f0e0b; --text-primary: #f5f0e8; --text-secondary: #8a8070;
  --hover-bg: #1a1810; --border-color: #2a2518;
  --accent: #c8a96e; --accent-hover: #b8935a;
  --accent-glow: rgba(200,169,110,0.25); --accent-soft: rgba(200,169,110,0.12);
}
body.theme-light {
  --bg-color: #faf6ee; --text-primary: #1a1710; --text-secondary: #706050;
  --hover-bg: #f0ebe0; --border-color: #e0d8c8;
  --accent: #a07840; --accent-hover: #8a6430;
  --accent-glow: rgba(160,120,64,0.2); --accent-soft: rgba(160,120,64,0.08);
}
body.font-serif  { --font-article: 'Merriweather', serif; }
body.font-slab   { --font-article: 'Source Serif 4', serif; }
body.font-modern { --font-article: 'Inter', sans-serif; }

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  font-family: var(--font-ui);
  background: var(--bg-color);
  color: var(--text-primary);
  overflow-x: hidden;
  transition: background 0.2s ease, color 0.2s ease;
}

.static-header {
  background: var(--bg-color);
  padding-top: env(safe-area-inset-top);
  transition: background 0.2s ease;
}
.static-header-inner {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px 6px; max-width: 1200px; margin: 0 auto;
}
.header-logo { display: flex; align-items: center; cursor: pointer; }
.header-logo img {
  height: 28px; width: auto;
  transition: filter 0.2s ease;
}
body.theme-light .header-logo img { filter: invert(1) grayscale(1); }

.header-actions { display: flex; align-items: center; gap: 4px; }
.header-icon-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: none; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--text-secondary);
  transition: color 0.2s, background 0.2s;
  margin-right: 4px;
}
.header-icon-btn:hover { color: var(--accent); background: var(--accent-soft); }
.header-icon-btn.active { color: var(--accent); }

.notif-panel {
  display: none; flex-direction: column;
  position: fixed; z-index: 500;
  width: 310px; max-width: calc(100vw - 24px); max-height: 460px;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 16px; box-shadow: 0 16px 48px rgba(0,0,0,0.7);
  overflow: hidden;
}
.notif-panel.open { display: flex; }
.notif-panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 16px 10px; border-bottom: 1px solid var(--border-color); flex-shrink: 0;
}
.notif-panel-title { font-size: 13px; font-weight: 700; }
.notif-mark-all {
  font-size: 11px; font-weight: 600; color: var(--accent);
  background: none; border: none; cursor: pointer; font-family: var(--font-ui);
  transition: opacity 0.2s;
}
.notif-mark-all:hover { opacity: 0.7; }
.notif-list { flex: 1; overflow-y: auto; }
.notif-list::-webkit-scrollbar { width: 2px; }
.notif-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
.notif-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 11px 16px; border-bottom: 1px solid rgba(42,37,24,0.6);
  cursor: pointer; transition: background 0.15s; position: relative;
}
.notif-item:hover { background: var(--hover-bg); }
.notif-item.unread { background: rgba(200,169,110,0.04); }
.notif-item.unread::before {
  content: ''; position: absolute; left: 6px; top: 50%; transform: translateY(-50%);
  width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
}
.notif-icon {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 12px;
}
.notif-icon.like    { background: rgba(196,106,78,0.15); color: #c46a4e; }
.notif-icon.comment { background: rgba(138,160,192,0.15); color: #8aa0c0; }
.notif-icon.follow  { background: var(--accent-soft); color: var(--accent); }
.notif-icon.article { background: rgba(106,191,133,0.15); color: #6abf85; }
.notif-icon.discord { background: rgba(88,101,242,0.15); color: #7289da; }
.notif-icon.insta   { background: rgba(225,48,108,0.12); color: #e1306c; }
.notif-text { flex: 1; min-width: 0; }
.notif-msg  { font-size: 12px; line-height: 1.4; color: var(--text-primary); }
.notif-time { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }
.notif-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 40px 20px; color: var(--text-secondary);
}
.notif-empty i { font-size: 28px; opacity: 0.25; color: var(--accent); }
.notif-empty p { font-size: 12px; opacity: 0.6; margin: 0; text-align: center; }
.notif-empty a {
  font-size: 12px; font-weight: 700; color: var(--accent);
  text-decoration: none; margin-top: 4px;
  background: var(--accent-soft); border: 1px solid rgba(200,169,110,0.3);
  border-radius: 20px; padding: 6px 16px; display: inline-block;
  transition: background 0.15s;
}
.notif-empty a:hover { background: rgba(200,169,110,0.2); }
.notif-spinner-wrap { padding: 24px; display: flex; justify-content: center; }
.notif-spinner {
  width: 22px; height: 22px;
  border: 2px solid var(--border-color); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.settings-popover {
  position: fixed; z-index: 500;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 16px; padding: 0; width: 230px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  opacity: 0; pointer-events: none;
  transform: translateY(-8px) scale(0.97);
  transition: opacity 0.2s, transform 0.2s;
  overflow: hidden;
}
.settings-popover.open { opacity: 1; pointer-events: all; transform: translateY(0) scale(1); }
.sp-profile {
  padding: 14px 14px 12px;
  border-bottom: 1px solid var(--border-color);
  display: flex; align-items: center; gap: 10px;
  cursor: pointer; transition: background 0.15s;
}
.sp-profile:hover { background: rgba(200,169,110,0.06); }
.sp-profile-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--accent-soft); border: 1.5px solid rgba(200,169,110,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: var(--accent);
  overflow: hidden; flex-shrink: 0;
}
.sp-profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
.sp-profile-info { flex: 1; min-width: 0; }
.sp-profile-name {
  font-size: 13px; font-weight: 700; color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sp-profile-status { font-size: 10px; margin-top: 1px; }
.sp-profile-status.online { color: #6abf85; }
.sp-profile-status.guest  { color: var(--text-secondary); }
.sp-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.sp-label {
  font-size: 9px; font-weight: 800; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-secondary); margin-bottom: 7px;
}
.sp-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sp-pill {
  padding: 5px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
  border: 1px solid var(--border-color); background: var(--bg-color);
  color: var(--text-secondary); cursor: pointer; transition: all 0.15s;
  font-family: var(--font-ui);
}
.sp-pill.active { background: var(--accent); color: #0f0e0b; border-color: var(--accent); }
.sp-pill:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
.sp-toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 2px 1px;
}
.sp-toggle-label { font-size: 12px; font-weight: 600; color: var(--text-primary); }
.sp-switch {
  position: relative; width: 36px; height: 20px; flex-shrink: 0;
  cursor: pointer;
}
.sp-switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.sp-switch-track {
  position: absolute; inset: 0; border-radius: 20px;
  background: var(--bg-color); border: 1px solid var(--border-color);
  transition: background 0.18s, border-color 0.18s;
}
.sp-switch-thumb {
  position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--text-secondary);
  transition: transform 0.18s, background 0.18s;
}
.sp-switch input:checked ~ .sp-switch-track { background: var(--accent-soft); border-color: var(--accent); }
.sp-switch input:checked ~ .sp-switch-thumb { transform: translateX(16px); background: var(--accent); }
.sp-logout {
  width: 100%; padding: 9px 12px; border-radius: 10px;
  background: rgba(196,106,78,0.08); border: 1px solid rgba(196,106,78,0.22);
  color: #c46a4e; font-size: 12px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px;
  font-family: var(--font-ui); transition: background 0.15s; margin-top: 4px;
}
.sp-logout:hover { background: rgba(196,106,78,0.16); }
.sp-login {
  width: 100%; padding: 9px 12px; border-radius: 10px;
  background: var(--accent-soft); border: 1px solid rgba(200,169,110,0.3);
  color: var(--accent); font-size: 12px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px;
  font-family: var(--font-ui); transition: background 0.15s; margin-top: 4px;
}
.sp-login:hover { background: rgba(200,169,110,0.2); }

.float-overlay {
  position: fixed; inset: 0; z-index: 400;
  background: rgba(0,0,0,0.65); backdrop-filter: blur(5px);
  display: none; align-items: center; justify-content: center;
  padding: 20px;
}
.float-overlay.open { display: flex; }

.user-float-card {
  width: 100%; max-width: 360px;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 20px;
  padding: 22px 20px 20px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.75);
  animation: floatIn 0.22s cubic-bezier(0.34,1.26,0.64,1);
  max-height: 90vh; overflow-y: auto;
}
@keyframes floatIn {
  from { opacity:0; transform: scale(0.93) translateY(8px); }
  to   { opacity:1; transform: scale(1)    translateY(0);   }
}
.float-close {
  position: absolute; top: 14px; right: 14px;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--bg-color); border: 1px solid var(--border-color);
  color: var(--text-secondary); font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: color 0.15s, border-color 0.15s;
}
.float-close:hover { color: var(--accent); border-color: var(--accent); }

.user-float-card .user-popup-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.user-float-card .user-popup-avatar {
  width: 58px; height: 58px; border-radius: 50%;
  background: var(--accent-soft); border: 2px solid rgba(200,169,110,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 700; color: var(--accent);
  overflow: hidden; flex-shrink: 0;
}
.user-float-card .user-popup-avatar img { width: 100%; height: 100%; object-fit: cover; }
.user-float-card .user-popup-identity { flex: 1; min-width: 0; }
.user-float-card .user-popup-name {
  font-size: 16px; font-weight: 800; color: var(--text-primary);
  font-family: var(--font-article); margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.user-float-card .user-popup-handle-txt { font-size: 12px; color: var(--text-secondary); }
.user-float-card .user-popup-stats {
  display: flex; border: 1px solid var(--border-color);
  border-radius: 12px; overflow: hidden; margin-bottom: 14px;
}
.user-float-card .user-popup-stat {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 10px 6px; position: relative;
}
.user-float-card .user-popup-stat + .user-popup-stat::before {
  content: ''; position: absolute; left: 0; top: 20%; bottom: 20%;
  width: 1px; background: var(--border-color);
}
.user-float-card .user-popup-stat-val {
  font-size: 16px; font-weight: 800; color: var(--text-primary);
  font-family: var(--font-article); line-height: 1;
}
.user-float-card .user-popup-stat-label {
  font-size: 9px; font-weight: 600; color: var(--text-secondary);
  margin-top: 3px; text-transform: uppercase; letter-spacing: 0.04em;
}
.user-float-card .user-popup-bio { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 16px; }
.user-float-card .user-popup-btn {
  width: 100%; padding: 11px; border-radius: 10px;
  background: var(--accent); color: #0f0e0b;
  font-size: 13px; font-weight: 700; border: none; cursor: pointer;
  font-family: var(--font-ui); transition: background 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.user-float-card .user-popup-btn:hover { background: var(--accent-hover); }

@keyframes skelShimmer {
  0%   { background-position: -400px 0; }
  100% { background-position:  400px 0; }
}
.skel-line {
  border-radius: 6px;
  background: linear-gradient(90deg, var(--border-color) 25%, var(--hover-bg) 50%, var(--border-color) 75%);
  background-size: 400px 100%;
  animation: skelShimmer 1.4s ease infinite;
}
.skel-circle {
  border-radius: 50%;
  background: linear-gradient(90deg, var(--border-color) 25%, var(--hover-bg) 50%, var(--border-color) 75%);
  background-size: 400px 100%;
  animation: skelShimmer 1.4s ease infinite;
}

.card-float-card {
  width: 100%; max-width: 460px;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 20px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.75);
  animation: floatIn 0.22s cubic-bezier(0.34,1.26,0.64,1);
  max-height: 90vh; display: flex; flex-direction: column;
  position: relative;
}
.card-float-inner {
  flex: 1; overflow-y: auto; padding: 22px 20px 20px;
}
.card-float-inner::-webkit-scrollbar { width: 2px; }
.card-float-inner::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

.saved-panel {
  display: none; flex-direction: column;
  position: fixed; z-index: 500;
  width: 320px; max-width: calc(100vw - 24px); max-height: 480px;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 16px; box-shadow: 0 16px 48px rgba(0,0,0,0.7);
  overflow: hidden;
}
.saved-panel.open { display: flex; }
.saved-panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 16px 10px; border-bottom: 1px solid var(--border-color); flex-shrink: 0;
}
.saved-panel-title { font-size: 13px; font-weight: 700; }
.saved-list { flex: 1; overflow-y: auto; }
.saved-list::-webkit-scrollbar { width: 2px; }
.saved-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
.saved-item {
  display: flex; align-items: center; gap: 11px;
  padding: 11px 16px; border-bottom: 1px solid rgba(42,37,24,0.6);
  cursor: pointer; transition: background 0.15s;
}
.saved-item:hover { background: rgba(200,169,110,0.05); }
.saved-item-thumb {
  width: 44px; height: 44px; border-radius: 9px; flex-shrink: 0;
  background: var(--accent-soft); overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  color: var(--accent); font-size: 16px;
}
.saved-item-thumb img { width: 100%; height: 100%; object-fit: cover; }
.saved-item-info { flex: 1; min-width: 0; }
.saved-item-name {
  font-size: 13px; font-weight: 700; color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.saved-item-meta { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.saved-item-remove {
  flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary); font-size: 11px; background: none; border: none;
  cursor: pointer; transition: color 0.15s, background 0.15s;
}
.saved-item-remove:hover { color: #c46a4e; background: rgba(196,106,78,0.1); }
.saved-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 40px 20px; color: var(--text-secondary);
}
.saved-empty i { font-size: 28px; opacity: 0.25; color: var(--accent); }
.saved-empty p { font-size: 12px; opacity: 0.6; margin: 0; text-align: center; }

.cp-type-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em;
  border-radius: 5px; padding: 3px 8px; margin-bottom: 10px;
}
.cp-type-badge.article { background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(200,169,110,0.3); }
.cp-type-badge.mcq     { background: rgba(106,191,133,0.12); color: #a0d8b0; border: 1px solid rgba(106,191,133,0.25); }
.cp-type-badge.library { background: rgba(106,159,207,0.12); color: #a8c8e8; border: 1px solid rgba(106,159,207,0.25); }
.cp-title { font-size: 17px; font-weight: 800; line-height: 1.3; color: var(--text-primary); font-family: var(--font-article); margin-bottom: 10px; }
.cp-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.cp-meta-item { font-size: 11px; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
.cp-meta-item i { font-size: 10px; }
.cp-excerpt { font-size: 14px; line-height: 1.7; color: var(--text-secondary); margin-bottom: 18px; }
.cp-mcq-q { font-size: 15px; font-weight: 700; color: var(--text-primary); font-family: var(--font-article); line-height: 1.4; margin-bottom: 12px; }
.cp-mcq-opts { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.cp-mcq-opt {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 13px; border-radius: 10px;
  border: 1px solid var(--border-color); background: var(--bg-color);
  font-size: 13px; color: var(--text-primary); cursor: pointer;
  transition: border-color 0.15s, background 0.15s; text-align: left; width: 100%;
  font-family: var(--font-ui);
}
.cp-mcq-opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.cp-mcq-opt:disabled { cursor: default; }
.cp-mcq-opt .opt-l {
  width: 24px; height: 24px; border-radius: 50%;
  border: 1.5px solid var(--border-color);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 800; flex-shrink: 0; color: var(--text-secondary);
}
.cp-mcq-opt.correct { border-color: #6abf85; background: rgba(106,191,133,0.08); }
.cp-mcq-opt.correct .opt-l { background: #6abf85; border-color: #6abf85; color: #0f0e0b; }
.cp-mcq-opt.wrong   { border-color: #c46a4e; background: rgba(196,106,78,0.07); }
.cp-mcq-opt.wrong   .opt-l { background: #c46a4e; border-color: #c46a4e; color: #fff; }
.cp-mcq-opt.reveal  { border-color: rgba(106,191,133,0.5); }
.cp-mcq-opt.reveal  .opt-l { border-color: #6abf85; color: #6abf85; }
.cp-mcq-result { font-size: 13px; font-weight: 700; margin-bottom: 14px; }
.cp-mcq-result.correct { color: #6abf85; }
.cp-mcq-result.wrong   { color: #c46a4e; }
.cp-lib-desc { font-size: 14px; line-height: 1.7; color: var(--text-secondary); margin-bottom: 16px; }
.cp-lib-save-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.cp-save-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 700;
  border: 1px solid var(--border-color); background: none; color: var(--text-secondary);
  cursor: pointer; font-family: var(--font-ui); transition: all 0.15s;
}

.creator-pill-circle {

/* ══ TOPICS STRIP — pill-shaped, flat color, zero gradient/glow ══ */
.topics-strip {

}
.topics-strip::-webkit-scrollbar { display: none; }
.topic-chip {

  font-family: var(--font-ui); cursor: pointer; white-space: nowrap;
  transition: border-color 0.18s, background 0.18s;
}
.topic-chip:hover { border-color: var(--accent); background: rgba(200,169,110,0.18); }
.topic-chip:active { background: rgba(200,169,110,0.24); }
.topic-chip i { font-size: 9px; color: var(--accent); }
.topic-chip .topic-count { font-size: 10px; font-weight: 600; color: var(--text-secondary); }
.topics-strip-label {
  font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-secondary); padding: 0 2px 8px; display: flex; align-items: center; gap: 6px;
}
.topics-strip-label i { color: var(--accent); font-size: 10px; }
.topic-skel-chip {
  flex-shrink: 0; width: 84px; height: 34px; border-radius: 999px;
  background: linear-gradient(90deg, var(--border-color) 25%, var(--hover-bg) 50%, var(--border-color) 75%);
  background-size: 400px 100%; animation: skelShimmer 1.4s ease infinite;
}

/* ══════════════════════════════════════════════════════════════════
   TEXT FEED — replaces the masonry image grid.
   Adapted from the "pills anywhere, no images" mockup: a single flowing
   column of inline entries (handle → title → views → colon → body),
   with inline audio pills that can sit mid-sentence. Justify is a
   user-toggleable reading preference stored in the settings popover.
   ══════════════════════════════════════════════════════════════════ */
.text-feed-controls {
  display: flex; justify-content: flex-end; padding: 0 2px 10px;
}
.text-feed {
  font-family: var(--font-ui);
  font-size: 1rem; line-height: 1.85; color: var(--text-primary);
  padding: 2px 2px 4px;
}
.text-feed.justify {
  text-align: justify; text-justify: inter-word;
  hyphens: auto; -webkit-hyphens: auto;
}
.feed-entry {
  display: inline; cursor: pointer; border-radius: 3px;
  transition: background-color 0.15s ease;
}
.feed-entry:hover { background-color: var(--accent-soft); }
.feed-entry:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.feed-handle { color: var(--accent); font-weight: 700; }
.feed-title { font-family: var(--font-article); font-weight: 700; }
.feed-views { color: var(--text-secondary); font-size: 0.85em; }
.feed-colon { color: var(--text-secondary); }
.feed-mcq-tag {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 0.68em; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--accent); vertical-align: middle; margin-left: 2px;
}

/* inline audio pill — sits anywhere within an entry's text flow */
.feed-audio-pill {
  display: inline-flex; align-items: center; gap: 7px;
  vertical-align: middle;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 999px; padding: 3px 10px 3px 4px; margin: 0 3px;
  white-space: nowrap; line-height: 1;
}
.feed-audio-pill .play-dot {
  width: 20px; height: 20px; border-radius: 50%; background: var(--accent);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  cursor: pointer; transition: background-color 0.15s ease;
}
.feed-audio-pill .play-dot:hover { background: var(--accent-hover); }
.feed-audio-pill .play-dot i { font-size: 8px; color: #0f0e0b; }
.feed-audio-pill .mini-wave { display: flex; align-items: center; gap: 1.5px; height: 12px; }
.feed-audio-pill .mini-wave span {
  width: 2px; background: var(--text-secondary); border-radius: 1px; opacity: 0.6;
}
.feed-audio-pill .pill-label {
  font-size: 0.72rem; color: var(--text-secondary); font-weight: 500;
  max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ── inline library figure — a small pull-quote-style card that breaks
   the text rhythm like a magazine figure, keeping the library's image
   (per user request) without reverting to a grid tile. Floats within
   the column so text can wrap around it on wider screens. ── */
.feed-lib-figure {
  display: block;
  float: none;
  margin: 18px 0;
  padding: 0;
}
.feed-lib-card {
  display: flex; align-items: stretch; gap: 0;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 16px; overflow: hidden; cursor: pointer;
  transition: border-color 0.18s ease, transform 0.18s ease;
  max-width: 420px;
}
.feed-lib-card:hover { border-color: rgba(200,169,110,0.4); transform: translateY(-2px); }
.feed-lib-card:active { transform: translateY(0) scale(0.99); }
.feed-lib-img-wrap {
  width: 88px; flex-shrink: 0; position: relative; overflow: hidden;
  background: var(--bg-color);
}
.feed-lib-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.feed-lib-img-fallback {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  color: var(--accent); font-size: 18px; opacity: 0.45;
}
.feed-lib-body {
  flex: 1; min-width: 0; padding: 12px 14px;
  display: flex; flex-direction: column; justify-content: center; gap: 5px;
}
.feed-lib-kicker {
  font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.09em;
  color: var(--accent); display: flex; align-items: center; gap: 5px;
}
.feed-lib-name {
  font-family: var(--font-article); font-weight: 700; font-size: 14px;
  color: var(--text-primary); line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.feed-lib-count { font-size: 11px; color: var(--text-secondary); }
.feed-lib-saved-mark { color: var(--accent); margin-left: 4px; }

.load-more-wrap { text-align: center; margin-top: 10px; }
.btn-load-more {
  background: none; border: 1px solid var(--border-color);
  color: var(--text-secondary); font-size: 12px; font-weight: 600;
  cursor: pointer; padding: 9px 24px; border-radius: 20px;
  font-family: var(--font-ui); display: inline-flex; align-items: center; gap: 7px;
  transition: border-color 0.2s, color 0.2s;
}
.btn-load-more:hover { border-color: var(--accent); color: var(--accent); }
.btn-load-more:disabled { opacity: 0.35; pointer-events: none; }

/* ══ Create menu (replaces FAB) ══ */
.create-menu-overlay {
  position: fixed; inset: 0; z-index: 399;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(3px);
  display: none; align-items: flex-end; justify-content: center;
}
.create-menu-overlay.open { display: flex; }
.create-menu-sheet {
  width: 100%; max-width: 450px;
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-bottom: none;
  border-radius: 20px 20px 0 0;
  padding: 8px 16px calc(16px + env(safe-area-inset-bottom));
  animation: createSheetUp 0.25s cubic-bezier(0.4,0,0.2,1);
}
@keyframes createSheetUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.create-menu-handle { width: 36px; height: 4px; background: var(--border-color); border-radius: 2px; margin: 8px auto 14px; }
.create-menu-title { font-size: 13px; font-weight: 800; color: var(--text-primary); padding: 0 4px 12px; }
.create-menu-item {
  display: flex; align-items: center; gap: 13px;
  padding: 13px 10px; border-radius: 12px;
  cursor: pointer; transition: background 0.15s;
}
.create-menu-item:hover { background: var(--bg-color); }
.create-menu-icon {
  width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0;
  background: var(--accent-soft); border: 1px solid rgba(200,169,110,0.25);
  display: flex; align-items: center; justify-content: center;
  color: var(--accent); font-size: 16px;
}
.create-menu-text { flex: 1; }
.create-menu-item-title { font-size: 13.5px; font-weight: 700; color: var(--text-primary); margin-bottom: 1px; }
.create-menu-item-sub { font-size: 11px; color: var(--text-secondary); }
.create-menu-item i.chev { color: var(--text-secondary); font-size: 11px; }

@media (min-width: 820px) {
  .create-menu-overlay { align-items: center; }
  .create-menu-sheet {
    max-width: 380px; border-radius: 18px; border-bottom: 1px solid var(--border-color);
    padding-bottom: 16px; animation: createSheetPop 0.2s cubic-bezier(0.34,1.26,0.64,1);
  }
  @keyframes createSheetPop { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
}

.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px);
  background: var(--hover-bg); border: 1px solid var(--border-color);
  border-radius: 14px; padding: 10px 18px;
  font-size: 13px; font-weight: 700; color: var(--text-primary);
  z-index: 9999; opacity: 0;
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none; white-space: nowrap;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.footer-bar {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 450px;
  background: #0f0e0b; border-top: 1px solid #2a2518;
  padding: 8px 24px; padding-bottom: calc(8px + env(safe-area-inset-bottom));
  display: flex; justify-content: space-around; align-items: center; z-index: 100;
}
.footer-btn {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; color: #8a8070;
  cursor: pointer; transition: color 0.2s ease; padding: 6px 12px;
}
.footer-btn:hover { color: #f5f0e8; }
.footer-btn.active { color: #c8a96e; }
.footer-btn i { font-size: 19px; }
.footer-btn span { font-size: 10px; font-weight: 600; }

@media (min-width: 820px) {
  .footer-bar {
    left: auto; right: 24px; bottom: 50%; transform: translateY(50%);
    width: auto; max-width: none; border: 1px solid var(--border-color);
    border-top: 1px solid var(--border-color); border-radius: 24px;
    padding: 12px 10px; flex-direction: column; gap: 4px; justify-content: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.45); backdrop-filter: blur(12px);
    background: rgba(15,14,11,0.88);
  }
  .footer-btn { padding: 10px 14px; border-radius: 14px; gap: 5px; width: 64px; }
  .footer-btn:hover { background: var(--hover-bg); color: var(--accent); }
  .footer-btn i { font-size: 18px; }
  .footer-btn span { font-size: 9px; }
  .page-body { padding-right: 108px; padding-bottom: 20px; }
}
@media (max-width: 768px) {
  .footer-bar { padding: 8px 16px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
  .footer-btn { padding: 6px 8px; }
  .footer-btn i { font-size: 17px; }
  .footer-btn span { font-size: 9px; }
}

.empty-state {
  display: flex; flex-direction: column; align-items: center;
  padding: 60px 20px; color: var(--text-secondary); gap: 10px;
}
.empty-state i { font-size: 36px; opacity: 0.2; color: var(--accent); }
.empty-state p { font-size: 13px; opacity: 0.55; }

<!-- 2. Settings popover -->
<script>
(function(){
  const THEMES=['theme-dark','theme-light'];
  const FONTS = ['font-serif','font-slab','font-modern'];
  function applyTheme(val){
    THEMES.forEach(t=>document.body.classList.remove(t));
    document.body.classList.add(val);
    localStorage.setItem('pref_theme', val);
  }
  function applyFont(val){
    FONTS.forEach(f=>document.body.classList.remove(f));
    document.body.classList.add(val);
    localStorage.setItem('pref_fontfam', val);
  }
  function syncPills(){
    const curT = THEMES.find(t=>document.body.classList.contains(t))||'theme-dark';
    const curF = FONTS.find(f=>document.body.classList.contains(f))||'font-modern';
    document.querySelectorAll('#sp-themes [data-val]').forEach(b=>b.classList.toggle('active',b.dataset.val===curT));
    document.querySelectorAll('#sp-fonts [data-val]').forEach(b=>b.classList.toggle('active',b.dataset.val===curF));
  }
  document.getElementById('sp-themes').addEventListener('click',e=>{
    const b=e.target.closest('[data-val]');if(!b)return;applyTheme(b.dataset.val);syncPills();
  });
  document.getElementById('sp-fonts').addEventListener('click',e=>{
    const b=e.target.closest('[data-val]');if(!b)return;applyFont(b.dataset.val);syncPills();
  });
  let _open=false;
  window.closeSettings=function(){
    document.getElementById('settingsPopover').classList.remove('open');
    _open=false;
  };
  window.handleStripSettings=function(pill){
    const pop=document.getElementById('settingsPopover');
    _open=!_open;
    if(_open){
      document.getElementById('notifPanel').classList.remove('open');
      document.getElementById('savedPanel').classList.remove('open');
      const r=pill.getBoundingClientRect();
      pop.style.top=(r.bottom+8)+'px';
      let left=r.left;
      if(left+230>window.innerWidth-8) left=window.innerWidth-238;
      pop.style.left=Math.max(8,left)+'px';
      pop.style.right='auto';
      pop.classList.add('open');
      syncPills();
      setTimeout(()=>document.addEventListener('click',function oc(e){
        if(!pop.contains(e.target)&&!pill.contains(e.target)){
          pop.classList.remove('open');_open=false;
        }
        document.removeEventListener('click',oc);
      },10));
    } else {
      pop.classList.remove('open');
    }
  };
  document.addEventListener('DOMContentLoaded',syncPills);
})();
</script>

<script>

    const feed = document.getElementById('mainGrid');

<script>

}
function setSavedLibs(list){

}
function isLibSaved(id){ return getSavedLibs().some(l=>String(l.id)===String(id)); }
function addSavedLib(lib){
  const list=getSavedLibs().filter(l=>String(l.id)!==String(lib.id));
  list.unshift({ id:lib.id, name:lib.name||'Untitled Library', thumbnail_url:lib.thumbnail_url||null, _count:lib._count||0, saved_at:Date.now() });

}

  const scored=arr.map(item=>({item,score:weightedScore(item)}));

window._supabaseNotifLoader = async function(){
  if(!currentSupaUser) return;

  list.innerHTML='<div class="notif-spinner-wrap"><div class="notif-spinner"></div></div>';

      .eq('recipient_id', currentSupaUser.user_id)
      .order('created_at',{ascending:false}).limit(30);

    function notifIcon(type){
      if(type==='like_article'||type==='like_comment')    return{cls:'like',icon:'fa-heart'};
      if(type==='comment_on_article'||type==='reply_to_comment') return{cls:'comment',icon:'fa-comment'};
      if(type==='new_follower')                           return{cls:'follow',icon:'fa-user-plus'};
      if(type==='new_article_from_following')             return{cls:'article',icon:'fa-file-alt'};
      return{cls:'follow',icon:'fa-bell'};

    else badge.classList.remove('show');

      ? `<div class="notif-empty"><i class="fas fa-bell-slash"></i><p>No notifications yet</p></div>`

async function loadCreators(){
  const strip = document.getElementById('creatorsStrip');
  try{
    const{data:arts}=await supabase.from('articles').select('firebase_user_id');
    if(!arts) return;
    const counts={};
    arts.forEach(a=>{if(a.firebase_user_id)counts[a.firebase_user_id]=(counts[a.firebase_user_id]||0)+1;});
    const topUids=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([u])=>u);

    const{data:users}=await supabase.from('users').select('firebase_uid,username,full_name,pfp').in('firebase_uid',topUids);
    const um={};(users||[]).forEach(u=>{um[u.firebase_uid]=u;});
    strip.querySelectorAll('[id^="creatorSkel"]').forEach(el=>el.remove());
    topUids.forEach(uid=>{
      const u=um[uid];
      const name=u?.username?'@'+u.username:(u?.full_name||'?');
      const init=(name.replace(/^@/,'')||'?')[0].toUpperCase();
      const pill=document.createElement('div');
      pill.className='strip-pill creator-strip-pill';
      pill.innerHTML=`
        <div class="creator-pill-circle">${u?.pfp?`<img src="${esc(u.pfp)}" alt="${init}">`:`${init}`}</div>

/* ══ TOPICS STRIP (algotag(...) libraries) ══ */
function algotagTitle(name){
  const m=/^algotag\(([\s\S]*)\)\s*$/i.exec((name||'').trim());
  if(!m) return null;
  return m[1].trim();
}

async function loadTopicsStrip(){
  const strip=document.getElementById('topicsStrip');
  const label=document.getElementById('topicsStripLabel');
  try{
    const{data:libs}=await supabase.from('playlists').select('id,name').ilike('name','algotag(%');
    const{data:countRows}=await supabase.from('playlist_items').select('playlist_id');
    const countMap={};(countRows||[]).forEach(r=>{countMap[r.playlist_id]=(countMap[r.playlist_id]||0)+1;});
    const topics=(libs||[])
      .map(l=>({id:l.id, title:algotagTitle(l.name), count:countMap[l.id]||0}))
      .filter(t=>t.title && t.count>0)
      .sort((a,b)=>b.count-a.count);
    strip.innerHTML='';
    if(!topics.length){
      label.style.display='none';
      strip.style.display='none';
      return;
    }
    label.style.display='flex';
    topics.forEach(t=>{
      const chip=document.createElement('div');
      chip.className='topic-chip';
      chip.innerHTML=`<i class="fas fa-hashtag"></i><span>${esc(t.title)}</span><span class="topic-count">${t.count}</span>`;
      chip.addEventListener('click',()=>{ location.href=`https://patholytica.com/dailyfeed?playlist=${t.id}`; });
      strip.appendChild(chip);
    });
  }catch(e){
    label.style.display='none';
    strip.style.display='none';
  }
}

/* ══ MEDIA POOL (audio / youtube from `media` table — used for inline pills) ══ */
async function fetchMediaPool(){
  if(mediaPoolFetched) return;
  mediaPoolFetched=true;
  try{
    const{data}=await supabase.from('media').select('*')
      .in('type',['audio'])
      .order('id',{ascending:false}).limit(120);
    mediaPool = shuffleArray((data||[]).filter(m=>m.article_id));
  }catch(e){ mediaPool=[]; }

/* Builds the inline audio pill markup used within a text entry, mirroring
   the reference mockup's mid-sentence pill. Wave bars are randomized once
   at build time purely for visual texture (no waveform data available). */
function buildInlineAudioPillHTML(m, title){
  const bars = Array(5).fill(0).map(()=> (30 + Math.random()*65).toFixed(0)).join(',');
  const heights = bars.split(',');
  const waveHTML = heights.map(h=>`<span style="height:${h}%"></span>`).join('');
  return `<span class="feed-audio-pill" data-audio-url="${esc(m.url)}" onclick="event.stopPropagation()">
      <span class="play-dot" onclick="window._toggleFeedAudio(this)"><i class="fas fa-play"></i></span>
      <span class="mini-wave">${waveHTML}</span>
      <span class="pill-label">${esc(trunc(title,26))}</span>
    </span>`;
}

const _feedAudioEls = new WeakMap();
window._toggleFeedAudio = function(dotEl){
  const pill = dotEl.closest('.feed-audio-pill');
  const url = pill.getAttribute('data-audio-url');
  let audio = _feedAudioEls.get(pill);
  if(!audio){
    audio = new Audio(url);
    audio.preload='none';
    _feedAudioEls.set(pill, audio);
    audio.addEventListener('ended', ()=>{ dotEl.querySelector('i').className='fas fa-play'; });
  }
  const icon = dotEl.querySelector('i');
  if(audio.paused){ audio.play().catch(()=>{}); icon.className='fas fa-pause'; }
  else{ audio.pause(); icon.className='fas fa-play'; }
};

/* ══ TEXT ENTRIES (articles/MCQs as flowing inline spans) ══ */
function buildArticleEntryHTML(article, authorName, inlineAudio){
  const mcq = isMCQ(article.content);
  const title = article.title || (mcq ? 'Quick Question' : 'Untitled');
  let bodyText;
  if(mcq){
    const lines=(article.content||'').trim().split('\n').map(l=>l.trim()).filter(Boolean);
    bodyText = lines[0] ? lines[0].replace(/^❔/,'').trim() : '';
  } else {
    bodyText = (article.content||'').replace(/\n+/g,' ').trim();
  }
  bodyText = trunc(bodyText, 340);

  // If we have an inline audio pill for this article, splice it in
  // roughly mid-sentence the way the reference mockup does — after the
  // nearest sentence boundary past the midpoint, so it reads as a
  // natural pause rather than an interruption.
  let bodyHTML = esc(bodyText);
  // Only splice a pill into actual prose — an empty/near-empty body has
  // nowhere natural to place it, so it would just float with stray
  // whitespace on either side instead of reading as a mid-sentence pause.
  if(inlineAudio && bodyText.length > 20){
    const mid = Math.floor(bodyText.length/2);
    let splice = bodyText.indexOf('. ', mid);
    if(splice === -1) splice = bodyText.length;
    else splice += 2;
    const before = esc(bodyText.slice(0, splice));
    const after  = esc(bodyText.slice(splice));
    bodyHTML = after
      ? `${before} ${buildInlineAudioPillHTML(inlineAudio, title)} ${after}`
      : `${before} ${buildInlineAudioPillHTML(inlineAudio, title)}`;
  }

  return `<span class="feed-entry" tabindex="0" role="link" data-nav="https://patholytica.com/dailyfeed?article=${article.id}">
    <span class="feed-handle">${esc(authorName)}</span> <span class="feed-title">${esc(title)}</span>${mcq?' <span class="feed-mcq-tag"><i class="fas fa-question-circle"></i>MCQ</span>':''} <span class="feed-views">· ${fmtNum(article.views||0)} views</span><span class="feed-colon">:</span>
    ${bodyHTML}
  </span>`;
}

/* ══ INLINE LIBRARY FIGURE (keeps the library's image, per user request,
   without reverting to a masonry tile — a small horizontal card that
   breaks the text column like a pull-quote figure) ══ */
function buildLibraryFigureHTML(lib, articleCount){
  const name = lib.name || 'Untitled Library';
  const isSaved = isLibSaved(lib.id);
  const imgHTML = lib.thumbnail_url
    ? `<img src="${esc(lib.thumbnail_url)}" alt="${esc(name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling&&(this.nextElementSibling.style.display='flex')">`
    : '';
  return `<span class="feed-lib-figure" data-lib-id="${esc(String(lib.id))}" data-nav="https://patholytica.com/dailyfeed?playlist=${lib.id}">
    <span class="feed-lib-card">
      <span class="feed-lib-img-wrap">
        ${imgHTML}
        <span class="feed-lib-img-fallback" style="${lib.thumbnail_url?'display:none;':''}"><i class="fas fa-layer-group"></i></span>
      </span>
      <span class="feed-lib-body">
        <span class="feed-lib-kicker"><i class="fas fa-layer-group"></i> Library</span>
        <span class="feed-lib-name">${esc(name)}</span>
        <span class="feed-lib-count">${articleCount||0} article${articleCount!==1?'s':''}<span class="feed-lib-saved-mark" style="display:${isSaved?'inline':'none'};"> · saved</span></span>
      </span>
    </span>
  </span>`;
}

/* ══ MAIN LOADER ══ */
async function fetchAllArticles(){
  if(allArticles!==null) return;
  const{data,error}=await supabase.from('articles')
    .select('*').order('created_at',{ascending:false}).limit(300);
  if(error) throw error;
  allArticles=data||[];
  shuffledArts=weightedShuffle(allArticles);
}

// libExhausted tracks whether the paginated `.range()` library query has
// run past the end of the table. Without this, once libOffset exceeds
// the row count, PostgREST/Supabase returns a range error, the whole
// try block throws, and execution jumps straight to catch — which never
// restored the "Load more" button. That's the actual root cause of the
// original "works once & then disappears" bug: the button was left
// permanently stuck mid-spinner because a thrown error skipped the
// re-enable code entirely. The real fix is two-fold: (1) never let the
// libraries query run past what's available, and (2) make the catch
// block always restore the button to a clickable state no matter what
// failed, so a transient error never permanently breaks pagination.
let libExhausted = false;

async function loadBatch(isInitial=true){
  if(artLoading)return;
  if(!isInitial && !artHasMore) return;
  artLoading=true;
  const grid=document.getElementById('mainGrid');
  const lmw=document.getElementById('loadMoreWrap');
  const lmb=document.getElementById('loadMoreBtn');
  try{
    if(isInitial){
      await fetchAllArticles();
      await fetchMediaPool();
    }
    const batch=shuffledArts.slice(artOffset,artOffset+ART_BATCH);
    artOffset+=batch.length;
    artHasMore = artOffset < shuffledArts.length;
    if(!batch.length){ artHasMore=false; }
    else{
      const authorUids=[...new Set(batch.map(a=>a.firebase_user_id).filter(Boolean))];
      let authorMap={};
      if(authorUids.length){
        const{data:authors}=await supabase.from('users').select('firebase_uid,username').in('firebase_uid',authorUids);
        (authors||[]).forEach(u=>{authorMap[u.firebase_uid]=u.username?`@${u.username}`:'Unknown';});
      }

      let libs=[];
      if(!libExhausted){
        const{data:libData,error:libErr}=await supabase.from('playlists').select('*')
          .not('name','like','algotag(%')
          .order('created_at',{ascending:false}).range(libOffset,libOffset+LIB_PER_BATCH-1);
        if(libErr){
          // Range exhausted or otherwise failed — stop paginating libraries
          // going forward, but don't let it break article pagination.
          libExhausted=true;
        }else{
          libs=libData||[];
          libOffset+=libs.length;
          if(libs.length<LIB_PER_BATCH) libExhausted=true;
        }
      }

      const libIds=libs.map(l=>l.id);
      let libCountMap={};
      if(libIds.length){
        const{data:irows}=await supabase.from('playlist_items').select('playlist_id').in('playlist_id',libIds);
        (irows||[]).forEach(r=>{libCountMap[r.playlist_id]=(libCountMap[r.playlist_id]||0)+1;});
      }
      let sortedLibs=[...libs];
      if(userFavourites.size>0){
        const saved=sortedLibs.filter(l=>userFavourites.has(String(l.id))).slice(0,5);
        const unsaved=sortedLibs.filter(l=>!userFavourites.has(String(l.id)));
        sortedLibs=[...saved,...unsaved];
      }

      let libIdx=0;
      let html='';
      batch.forEach((art,i)=>{
        const authorName = art.firebase_user_id ? (authorMap[art.firebase_user_id]||'Unknown') : 'Unknown';
        let inlineAudio=null;
        // Weave in an inline audio pill roughly every 4th entry (matches
        // the density of the reference mockup) when the media pool has
        // an item to offer.
        if((i+1)%4===0 && mediaPool.length){
          inlineAudio = mediaPool[mediaPoolOffset % mediaPool.length];
          mediaPoolOffset++;
        }
        html += buildArticleEntryHTML(art, authorName, inlineAudio) + '\n';
        // Weave a library figure in every 5th slot — keeps libraries
        // present without crowding the reading rhythm.
        if((i+1)%5===0 && libIdx<sortedLibs.length){
          const lib=sortedLibs[libIdx++];
          html += buildLibraryFigureHTML(lib, libCountMap[lib.id]||0) + '\n';
        }
      });
      while(libIdx<sortedLibs.length){
        const l=sortedLibs[libIdx++];
        html += buildLibraryFigureHTML(l, libCountMap[l.id]||0) + '\n';
      }
      grid.insertAdjacentHTML('beforeend', html);
      if(window._applyJustifyPref) window._applyJustifyPref();
    }
    if(artHasMore){lmw.style.display='block';lmb.disabled=false;lmb.innerHTML='<i class="fas fa-chevron-down"></i> Load more';}
    else lmw.style.display='none';
  }catch(e){
    console.error(e);
    if(isInitial){
      grid.innerHTML+=`<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load</p></div>`;
    }
    // Always restore the button to a working state on failure — a
    // transient/one-off error should never permanently disable
    // pagination. Re-check artHasMore so a real end-of-list still
    // hides the button correctly instead of showing a dead-end retry.
    if(lmw&&lmb){
      if(artHasMore){
        lmw.style.display='block';
        lmb.disabled=false;
        lmb.innerHTML='<i class="fas fa-chevron-down"></i> Load more';
      }else{
        lmw.style.display='none';
      }
    }
  }finally{
    artLoading=false;
  }
}

// Single delegated click/keyboard handler for the whole feed — entries
// and library figures both carry data-nav, so one listener covers both,
// same pattern as the reference mockup's entry.click handler.
document.getElementById('mainGrid').addEventListener('click', function(e){
  if(e.target.closest('.feed-audio-pill')) return; // pill handles its own click + stopPropagation
  const el = e.target.closest('.feed-entry, .feed-lib-figure');
  if(!el) return;
  const url = el.getAttribute('data-nav');
  if(url) location.href = url;
});
document.getElementById('mainGrid').addEventListener('keydown', function(e){
  if(e.key!=='Enter' && e.key!==' ') return;
  const el = e.target.closest('.feed-entry');
  if(!el) return;
  e.preventDefault();
  const url = el.getAttribute('data-nav');
  if(url) location.href = url;
});
