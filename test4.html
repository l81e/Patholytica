<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
   <title>Article Scroller - Patholytica</title>
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
   <style>
       /* ----- BASE THEMES (Champagne Default, Grey, Ivory White, Coal Black) ----- */
       :root, body.theme-champagne {
           --bg-color: #0f0e0b;
           --text-primary: #f5f0e8;
           --text-secondary: #8a8070;
           --card-bg: #0f0e0b;
           --hover-bg: #1a1810;
           --border-color: #2a2518;
           --accent: #c8a96e;
           --accent-hover: #b8935a;
           --accent-glow: rgba(200, 169, 110, 0.25);
           --accent-soft: rgba(200, 169, 110, 0.12);
           --icon-stroke: #fff;
           --icon-fill: #fff;
           --footer-bg: rgba(15,14,11,0.96);
       }

       body.theme-grey {
           --bg-color: #18171d;
           --text-primary: #f0ede8;
           --text-secondary: #9e9a90;
           --card-bg: #18171d;
           --hover-bg: #23222a;
           --border-color: #3a3840;
           --accent: #b0aa8c;
           --accent-hover: #9c9678;
           --accent-glow: rgba(176,170,140,0.25);
           --accent-soft: rgba(176,170,140,0.12);
           --icon-stroke: #fff;
           --icon-fill: #fff;
           --footer-bg: rgba(24,23,29,0.96);
       }

       body.theme-ivory {
           --bg-color: #fefcf5;
           --text-primary: #2c2820;
           --text-secondary: #6e6558;
           --card-bg: #fefcf5;
           --hover-bg: #f5f0e4;
           --border-color: #e0d8c8;
           --accent: #9e7b4c;
           --accent-hover: #8a693f;
           --accent-glow: rgba(158,123,76,0.2);
           --accent-soft: rgba(158,123,76,0.08);
           --icon-stroke: #2c2820;
           --icon-fill: #2c2820;
           --footer-bg: rgba(254,252,245,0.96);
       }

       body.theme-coal {
           --bg-color: #0a0a0c;
           --text-primary: #ece8e0;
           --text-secondary: #8a857a;
           --card-bg: #0a0a0c;
           --hover-bg: #16161c;
           --border-color: #2a2a30;
           --accent: #b89e6e;
           --accent-hover: #a48a5c;
           --accent-glow: rgba(184,158,110,0.25);
           --accent-soft: rgba(184,158,110,0.12);
           --icon-stroke: #fff;
           --icon-fill: #fff;
           --footer-bg: rgba(10,10,12,0.96);
       }

       * { margin: 0; padding: 0; box-sizing: border-box; }

       body {
           font-family: "DM Sans", -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           background: var(--bg-color);
           color: var(--text-primary);
           overflow: hidden;
           transition: background 0.2s ease, color 0.2s ease;
           position: fixed;
           width: 100%;
           height: 100%;
       }

       .app-container {
           position: fixed;
           top: 0;
           left: 50%;
           transform: translateX(-50%);
           width: 100%;
           max-width: 450px;
           height: 100vh;
           background: var(--bg-color);
       }

       .scroller-container {
           position: relative;
           width: 100%;
           height: 100vh;
           background: var(--bg-color);
           overflow: hidden;
       }

       .posts-wrapper {
           height: 100%;
           overflow-y: scroll;
           scroll-snap-type: y mandatory;
           scrollbar-width: none;
       }
       .posts-wrapper::-webkit-scrollbar { display: none; }

       .article-card {
           position: relative;
           height: 100vh;
           scroll-snap-align: start;
           scroll-snap-stop: always;
           background: var(--bg-color);
           padding: 0;
           padding-top: calc(20px + env(safe-area-inset-top));
           display: flex;
           flex-direction: column;
       }

       .article-header {
           display: flex;
           align-items: center;
           gap: 12px;
           flex-shrink: 0;
           position: relative;
           z-index: 50;
           margin-bottom: 14px;
           padding: 0 18px;
       }

       .author-avatar {
           width: 42px; height: 42px;
           border-radius: 50%;
           background: linear-gradient(135deg, var(--accent), #8a6430);
           display: flex; align-items: center; justify-content: center;
           font-size: 17px; font-weight: 700;
           color: #0f0e0b;
           overflow: hidden; flex-shrink: 0;
           cursor: pointer;
           transition: opacity 0.15s ease, box-shadow 0.2s ease;
       }
       .author-avatar:hover { opacity: 0.9; box-shadow: 0 0 0 2px var(--accent); }
       .author-avatar img { width: 100%; height: 100%; object-fit: cover; }
       .author-info { flex: 1; }
       .author-name {
           color: var(--text-primary);
           font-weight: 700; font-size: 14px; margin-bottom: 1px;
           cursor: pointer; display: inline-block;
           transition: color 0.15s ease; letter-spacing: -0.01em;
       }
       .author-name:hover { color: var(--accent); }
       .article-date { color: var(--text-secondary); font-size: 11px; font-weight: 500; }

       .follow-btn {
           position: relative; width: 32px; height: 32px;
           border-radius: 50%; border: 1.5px solid var(--border-color);
           background: var(--hover-bg); cursor: pointer;
           display: flex; align-items: center; justify-content: center;
           flex-shrink: 0;
           transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
           overflow: hidden; -webkit-tap-highlight-color: transparent;
       }
       .follow-btn:active { transform: scale(0.9); }
       .follow-btn .icon-plus, .follow-btn .icon-bell {
           position: absolute; width: 15px; height: 15px;
           transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
       }
       .follow-btn .icon-plus { stroke: var(--text-secondary); fill: none; stroke-width: 2; opacity: 1; transform: scale(1) rotate(0deg); }
       .follow-btn .icon-bell { stroke: var(--accent); fill: none; stroke-width: 1.8; opacity: 0; transform: scale(0.4) rotate(-20deg); }
       .follow-btn.following { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 10px var(--accent-glow); }
       .follow-btn.following .icon-plus { opacity: 0; transform: scale(0.4) rotate(90deg); }
       .follow-btn.following .icon-bell { opacity: 1; transform: scale(1) rotate(0deg); }
       @keyframes bellRing {
           0%{transform:scale(1) rotate(0deg)} 15%{transform:scale(1.15) rotate(-18deg)}
           30%{transform:scale(1.15) rotate(14deg)} 45%{transform:scale(1.08) rotate(-10deg)}
           60%{transform:scale(1.08) rotate(7deg)} 75%{transform:scale(1) rotate(-4deg)}
           90%{transform:scale(1) rotate(2deg)} 100%{transform:scale(1) rotate(0deg)}
       }
       .follow-btn.ringing .icon-bell { animation: bellRing 0.55s cubic-bezier(0.36,0.07,0.19,0.97) forwards; }

       .article-title {
           font-size: 20px; font-weight: 800; color: var(--text-primary);
           margin-bottom: 10px; line-height: 1.2; flex-shrink: 0;
           letter-spacing: -0.02em; padding: 0 18px;
           font-family: 'Merriweather', serif;
       }

       .article-stats {
           display: flex; align-items: center; gap: 14px;
           margin-bottom: 10px; flex-shrink: 0; padding: 0 18px;
       }
       .stat-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); font-weight: 500; }
       .stat-item.views i { color: var(--accent); }
       .stat-item.likes i { color: #d4845a; }

       .article-content {
           color: var(--text-primary);
           font-size: 14px; line-height: 1.65;
           flex: 1; overflow-y: auto;
           padding: 0 18px; padding-right: 62px; padding-bottom: 110px;
           letter-spacing: 0.01em;
           text-align: justify;
       }
       .article-content::-webkit-scrollbar { width: 2px; }
       .article-content::-webkit-scrollbar-track { background: transparent; }
       .article-content::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
       .content-paragraph { margin-bottom: 12px; }

       .article-full-img-wrap {
           width: calc(100% + 80px);
           margin-left: -18px;
           margin-right: -62px;
           margin-bottom: 12px;
           margin-top: 4px;
           overflow: hidden;
       }
       .article-full-img-wrap img {
           width: 100%; height: auto; display: block;
           max-height: 340px; object-fit: cover;
       }
       .article-full-img-wrap .media-caption {
           font-size: 12px; color: var(--text-secondary);
           font-style: italic;
           padding: 7px 18px 0 18px;
       }

       .article-full-yt-wrap {
           width: calc(100% + 80px);
           margin-left: -18px;
           margin-right: -62px;
           margin-bottom: 12px;
           margin-top: 4px;
           overflow: hidden;
       }
       .article-full-yt-wrap iframe {
           width: 100%;
           aspect-ratio: 16/9;
           border: none;
           display: block;
       }
       .article-full-yt-label {
           display: flex; align-items: center; gap: 8px;
           padding: 8px 18px;
           background: rgba(0,0,0,0.4);
           border-bottom: 1px solid rgba(255,255,255,0.06);
       }
       .article-full-yt-label i { color: #c97a5a; font-size: 13px; }
       .article-full-yt-label span { font-size: 12px; font-weight: 600; color: var(--text-primary); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
       .article-full-yt-label a { font-size: 10px; font-weight: 700; color: #c97a5a; background: rgba(201,122,90,0.1); border: 1px solid rgba(201,122,90,0.2); border-radius: 7px; padding: 3px 9px; text-decoration: none; white-space: nowrap; flex-shrink: 0; }

       .heart-burst {
           position: fixed; pointer-events: none; z-index: 9999;
           transform: translate(-50%, -50%);
           animation: heartBurstAnim 0.72s cubic-bezier(0.16,1,0.3,1) forwards;
       }
       .heart-burst svg { width: 80px; height: 80px; filter: drop-shadow(0 0 14px rgba(200,169,110,0.6)); }
       @keyframes heartBurstAnim {
           0%  {opacity:0; transform:translate(-50%,-50%) scale(0.25) rotate(-12deg);}
           28% {opacity:1; transform:translate(-50%,-50%) scale(1.3) rotate(4deg);}
           52% {opacity:1; transform:translate(-50%,-50%) scale(0.92) rotate(-2deg);}
           72% {opacity:0.9; transform:translate(-50%,-50%) scale(1.08) rotate(0deg);}
           100%{opacity:0; transform:translate(-50%,-50%) scale(0.8) rotate(0deg) translateY(-18px);}
       }

       .mcq-card {
           position: relative; height: 100vh;
           scroll-snap-align: start; scroll-snap-stop: always;
           background: var(--bg-color);
           padding: 8px 18px 100px;
           padding-top: calc(20px + env(safe-area-inset-top));
           display: flex; flex-direction: column; overflow: hidden;
       }
       .mcq-badge {
           display: inline-flex; align-items: center; gap: 6px;
           background: var(--accent-soft); border: 1px solid rgba(200,169,110,0.3);
           border-radius: 20px; padding: 4px 12px;
           font-size: 10px; font-weight: 800; letter-spacing: 0.08em;
           text-transform: uppercase; color: var(--accent);
           margin-bottom: 16px; flex-shrink: 0; align-self: flex-start;
       }
       .mcq-question {
           font-size: 19px; font-weight: 800; color: var(--text-primary);
           line-height: 1.3; margin-bottom: 14px; flex-shrink: 0;
           padding-right: 50px; letter-spacing: -0.02em;
           font-family: 'Merriweather', serif;
       }
       .mcq-media { padding-right: 60px; flex-shrink: 0; margin-bottom: 14px; }
       .mcq-scroll-area {
           flex: 1; overflow-y: auto; padding-right: 60px;
           display: flex; flex-direction: column; gap: 0;
       }
       .mcq-scroll-area::-webkit-scrollbar { width: 2px; }
       .mcq-scroll-area::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
       .mcq-options { display: flex; flex-direction: column; gap: 9px; }
       .mcq-option {
           display: flex; align-items: center; gap: 12px;
           padding: 13px 14px; border-radius: 12px;
           border: 1px solid var(--border-color); background: var(--hover-bg);
           cursor: pointer;
           transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
           text-align: left; font-size: 14px; font-weight: 500;
           color: var(--text-primary); line-height: 1.4;
           -webkit-tap-highlight-color: transparent; width: 100%;
       }
       .mcq-option:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 12px var(--accent-glow); }
       .mcq-option .opt-letter {
           width: 26px; height: 26px; border-radius: 50%;
           border: 1.5px solid var(--border-color);
           display: flex; align-items: center; justify-content: center;
           font-size: 10px; font-weight: 800; flex-shrink: 0;
           color: var(--text-secondary); transition: all 0.15s ease;
       }
       .mcq-option .opt-text { flex: 1; }
       .mcq-option:disabled { cursor: default; }
       .mcq-option.selected-correct { border-color: #6abf85; background: rgba(106,191,133,0.08); box-shadow: 0 0 12px rgba(106,191,133,0.15); }
       .mcq-option.selected-correct .opt-letter { background: #6abf85; border-color: #6abf85; color: #0f0e0b; }
       .mcq-option.selected-wrong { border-color: #c46a4e; background: rgba(196,106,78,0.07); box-shadow: 0 0 12px rgba(196,106,78,0.1); }
       .mcq-option.selected-wrong .opt-letter { background: #c46a4e; border-color: #c46a4e; color: #fff; }
       .mcq-option.reveal-correct { border-color: rgba(106,191,133,0.5); }
       .mcq-option.reveal-correct .opt-letter { border-color: #6abf85; color: #6abf85; }
       .mcq-result-msg {
           font-size: 13px; font-weight: 700; margin-top: 14px;
           min-height: 18px; color: var(--text-secondary); flex-shrink: 0;
       }
       .mcq-result-msg.correct { color: #6abf85; }
       .mcq-result-msg.wrong   { color: #c46a4e; }

       .action-buttons {
           position: absolute; right: 14px; bottom: 143px;
           display: flex; flex-direction: column; gap: 20px; z-index: 10;
           filter: drop-shadow(0 4px 16px rgba(0,0,0,0.7));
       }
       .action-btn {
           display: flex; flex-direction: column; align-items: center; gap: 3px;
           background: none; border: none; cursor: pointer; transition: transform 0.1s;
       }
       .action-btn:active { transform: scale(0.88); }
       .action-btn svg { width: 26px; height: 26px; stroke: var(--icon-stroke); fill: none; stroke-width: 2; }
       .action-btn span { color: var(--icon-stroke); font-size: 10px; font-weight: 700; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
       body.theme-ivory .action-btn span { text-shadow: none; }

       .action-btn.like-btn svg { stroke: var(--icon-stroke); fill: none; transition: fill 0.2s ease, stroke 0.2s ease; }
       .action-btn.like-btn.liked svg { fill: #d4845a; stroke: #d4845a; }
       .action-btn.like-btn.liked[data-img-color] svg { fill: var(--img-like-color, #d4845a); stroke: var(--img-like-color, #d4845a); }

       .article-card.has-image .action-btn span,
       .article-card.has-image .action-btn svg { color: #fff; stroke: #fff; }
       body.theme-ivory .article-card.has-image .action-btn span,
       body.theme-ivory .article-card.has-image .action-btn svg { color: #fff; stroke: #fff; }
       .article-card.has-image .action-btn.liked svg { fill: var(--img-like-color, #d4845a); stroke: var(--img-like-color, #d4845a); }

       .media-embed { margin: 10px 0; max-width: 100%; }
       .media-embed img { width: 100%; max-width: 100%; height: auto; border-radius: 10px; display: block; }
       .media-caption { font-size: 12px; color: var(--text-secondary); margin-top: 5px; font-style: italic; }

       .custom-audio-player {
           background: var(--hover-bg); border-radius: 12px; padding: 14px;
           display: flex; align-items: center; gap: 12px; max-width: 100%;
           border: 1px solid var(--border-color);
       }
       .play-btn {
           width: 40px; height: 40px; border-radius: 50%;
           background: var(--accent); border: none; color: #0f0e0b;
           cursor: pointer; display: flex; align-items: center; justify-content: center;
           font-size: 14px; transition: background 0.2s ease, box-shadow 0.2s ease; flex-shrink: 0;
           box-shadow: 0 0 14px var(--accent-glow);
       }
       .play-btn:hover { background: var(--accent-hover); }
       .audio-info { flex: 1; min-width: 0; overflow: hidden; }
       .audio-title { font-size: 12px; font-weight: 600; margin-bottom: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-primary); }
       .waveform-container { position: relative; height: 28px; background: var(--bg-color); border-radius: 6px; margin-bottom: 5px; cursor: pointer; overflow: hidden; }
       .waveform-progress { position: absolute; top: 0; left: 0; height: 100%; background: var(--accent); opacity: 0.35; transition: width 0.1s linear; }
       .waveform-bars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: space-around; padding: 0 4px; }
       .waveform-bar { width: 2px; background: var(--text-secondary); border-radius: 2px; opacity: 0.5; }
       .audio-time { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-secondary); }

       .share-toast {
           position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px);
           background: #1a1810; border: 1px solid var(--border-color);
           border-radius: 14px; padding: 10px 18px;
           font-size: 13px; font-weight: 700; color: var(--text-primary);
           z-index: 9999; opacity: 0;
           transition: opacity 0.2s ease, transform 0.2s ease;
           pointer-events: none; white-space: nowrap;
           box-shadow: 0 8px 24px rgba(0,0,0,0.5);
       }
       .share-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

       .comments-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 199; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; backdrop-filter: blur(4px); }
       .comments-overlay.active { opacity: 1; pointer-events: all; }
       .comments-popup {
           position: fixed; top: 50%; left: 50%;
           transform: translate(-50%, -50%) scale(0.9);
           width: calc(100% - 40px); max-width: 500px;
           height: 70vh; max-height: 600px;
           background: #141210; border-radius: 20px; z-index: 200;
           opacity: 0; pointer-events: none;
           transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
           display: flex; flex-direction: column;
           box-shadow: 0 24px 80px rgba(0,0,0,0.7), 0 0 0 1px var(--border-color);
       }
       .comments-popup.active { opacity: 1; pointer-events: all; transform: translate(-50%,-50%) scale(1); }
       .comments-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border-color); }
       .comments-header h3 { font-size: 15px; font-weight: 700; }
       .close-comments { background: none; border: none; color: var(--text-primary); font-size: 22px; cursor: pointer; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
       .close-comments:hover { background: var(--hover-bg); }
       .comments-list { flex: 1; overflow-y: auto; padding: 14px 18px; }
       .comments-list::-webkit-scrollbar { width: 3px; }
       .comments-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
       .comment-item { display: flex; gap: 10px; margin-bottom: 18px; }
       .comment-avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #8a6430); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #0f0e0b; flex-shrink: 0; overflow: hidden; }
       .comment-avatar img { width: 100%; height: 100%; object-fit: cover; }
       .comment-content { flex: 1; }
       .comment-author { font-weight: 700; font-size: 12px; margin-bottom: 3px; }
       .comment-text { font-size: 13px; line-height: 1.5; margin-bottom: 5px; }
       .comment-time { font-size: 10px; color: var(--text-secondary); }
       .comment-input-wrapper { padding: 10px 18px; border-top: 1px solid var(--border-color); background: #141210; border-radius: 0 0 20px 20px; }
       .comment-input-container { display: flex; gap: 8px; align-items: center; }
       .comment-input {
           flex: 1; background: var(--hover-bg); border: 1px solid var(--border-color);
           border-radius: 20px; padding: 9px 14px; color: var(--text-primary);
           font-size: 16px;
           outline: none; transition: border-color 0.15s ease;
           font-family: "DM Sans", sans-serif;
           transform: scale(1);
       }
       .comment-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
       .send-comment-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); border: none; color: #0f0e0b; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: background 0.2s ease; flex-shrink: 0; }
       .send-comment-btn:hover { background: var(--accent-hover); }
       .send-comment-btn:disabled { opacity: 0.4; cursor: not-allowed; }
       .no-comments { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-secondary); gap: 10px; }
       .no-comments i { font-size: 40px; opacity: 0.3; color: var(--accent); }
       .loading-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-primary); gap: 14px; }
       .spinner { width: 40px; height: 40px; border: 3px solid var(--border-color); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
       @keyframes spin { to { transform: rotate(360deg); } }

       @keyframes shimmer { 0%,100%{opacity:0.4} 50%{opacity:0.85} }
       .skeleton-base { background: var(--hover-bg); animation: shimmer 1.6s infinite; border-radius: 6px; }
       .skeleton-card { position: relative; height: 100vh; scroll-snap-align: start; scroll-snap-stop: always; background: var(--bg-color); padding: 8px 18px 100px; padding-top: calc(20px + env(safe-area-inset-top)); display: flex; flex-direction: column; }

<script>
// THEME HANDLER (Champagne, Grey #18171d, Ivory White, Coal Black)
(function initTheme() {
    const saved = localStorage.getItem('patholytica_theme');
    const validThemes = ['theme-champagne', 'theme-grey', 'theme-ivory', 'theme-coal'];
    let theme = (saved && validThemes.includes(saved)) ? saved : 'theme-champagne';
    document.body.classList.add(theme);
    if (!saved) localStorage.setItem('patholytica_theme', 'theme-champagne');
})();

function setTheme(themeName) {
    const valid = ['theme-champagne', 'theme-grey', 'theme-ivory', 'theme-coal'];
    if (!valid.includes(themeName)) return;
    document.body.classList.remove(...valid);
    document.body.classList.add(themeName);
    localStorage.setItem('patholytica_theme', themeName);
    // update active state on theme swatches if they exist (library picker may be dynamic)
    document.querySelectorAll('.theme-swatch').forEach(sw => {
        const t = sw.dataset.theme;
        if (t === themeName) sw.classList.add('active');
        else sw.classList.remove('active');
    });
}
window.setTheme = setTheme;
</script>

   const popup=document.getElementById('termPopup');
   document.getElementById('termPopupTerm').textContent=term;
   document.getElementById('termPopupBody').innerHTML=explanation;
   const POPUP_W=270,POPUP_H=150,MARGIN=8,vw=window.innerWidth,vh=window.innerHeight;
   let anchorX=event?event.clientX:vw/2,anchorY=event?event.clientY:vh/2;
   let left=anchorX-POPUP_W/2,top=anchorY+14;
   left=Math.max(MARGIN,Math.min(left,vw-POPUP_W-MARGIN));
   if(top+POPUP_H>vh-MARGIN)top=anchorY-POPUP_H-8;top=Math.max(MARGIN,top);
   popup.style.left=left+'px';popup.style.top=top+'px';
   popup.classList.add('active');
   if(window._termPopupOutside)document.removeEventListener('click',window._termPopupOutside);

};

async function initLibraryPicker(){ if(anchorArticleId!==null){window._pickerHandledLoad=true;injectInitialSkeletons(3);loadArticles(true);return;} if(window._urlPlaylistId){ window._pickerHandledLoad=true;injectInitialSkeletons(3); try{const {data:items}=await supabase.from('playlist_items').select('article_id').eq('playlist_id',window._urlPlaylistId); const articleIds=[...new Set((items||[]).map(r=>r.article_id))]; filteredArticleIds=articleIds.length>0?articleIds:null;}catch(e){filteredArticleIds=null;} loadArticles(true);return; } const wrapper=document.getElementById('postsWrapper'); const pickerCard=buildPickerCard(); wrapper.insertBefore(pickerCard,wrapper.firstChild); window._pickerHandledLoad=true; injectInitialSkeletons(3); loadArticles(true); requestAnimationFrame(()=>{ const firstSkeleton=wrapper.querySelector('.skeleton-card'); if(firstSkeleton) wrapper.scrollTop=firstSkeleton.offsetTop; }); const grid=document.getElementById('lpGrid'),startBtn=document.getElementById('lpStartBtn'); const hint=document.getElementById('lpCountHint'),idInput=document.getElementById('lpIdInput'); const idGoBtn=document.getElementById('lpIdGoBtn'),idError=document.getElementById('lpIdError'); const selected=new Set(); async function handleIdSearch(){ const val=idInput.value.trim();if(!val){idError.textContent='Please enter an article ID.';return;} const id=parseInt(val);if(isNaN(id)||id<1){idError.textContent='Please enter a valid positive ID.';return;} idGoBtn.disabled=true;idGoBtn.textContent='…';idError.textContent=''; try{ const {data:art,error}=await supabase.from('articles').select('id').eq('id',id).single(); if(error||!art){ swapPickerForSkeleton();anchorArticleId=null;articles=[];offset=0;hasMore=true;isLoading=false; document.getElementById('postsWrapper').querySelectorAll('.article-card,.mcq-card').forEach(c=>c.remove()); const errToast=document.createElement('div');errToast.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#c46 function parseMCQ(content){ const lines=content.trim().split('\n').map(l=>l.trim()).filter(Boolean); const questionLine=lines[0].replace(/^❔/,'').trim(); const options=lines.slice(1).map(line=>{const correct=line.startsWith('✅');return{label:line.replace(/^✅/,'').trim(),correct};}); for(let i=options.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[options[i],options[j]]=[options[j],options[i]];} return{question:questionLine,options}; }

function buildMCQCard(article, index){ const {question,options}=parseMCQ(article.content); const isLiked=userLikes.has(String(article.id)); const letters=['A','B','C','D','E','F']; const card=document.createElement('div'); card.className='mcq-card';card.dataset.index=index;card.dataset.articleId=article.id; card.innerHTML=`<div class="article-header">${buildAuthorHeader(article)}</div><div class="mcq-badge">❔ Quick Question</div><div class="mcq-question">${renderEmojiText(question)}</div><div class="mcq-media" id="mcq-media-${article.id}"></div><div class="mcq-scroll-area"><div class="mcq-options" id="mcq-opts-${article.id}"></div><div class="mcq-result-msg" id="mcq-msg-${article.id}"></div></div><div class="action-buttons"><button class="action-btn like-btn ${isLiked?'liked':''}" data-id="${article.id}"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><span class="like-count">${formatNumber(article.likes||0)}</span></button><button class="action-btn comment-btn" data-id="${article.id}"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg><span class="comment-count">0</span></button><button class="action-btn share-btn" data-id="${article.id}" data-title="${(article.title||'').replace(/"/g,'&quot;')}"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg><span>Share</span></button></div>`; if(article.media&&article.media.length>0){const mc=card.querySelector(`#mcq-media-${article.id}`); article.media.forEach(m=>mc.appendChild(createMediaElement(m,false)));} const optsContainer=card.querySelector(`#mcq-opts-${article.id}`),msgEl=card.querySelector(`#mcq-msg-${article.id}`); let answered=false; options.forEach((opt,i)=>{ const btn=document.createElement('button');btn.className='mcq-option'; btn.innerHTML=`<span class="opt-letter">${letters[i]||i+1}</span><span class="opt-text">${renderEmojiText(opt.label)}</span>`; btn.addEventListener('click',()=>{ if(answered)return;answered=true;optsContainer.querySelectorAll('.mcq-option').forEach(b=>b.disabled=true); if(opt.correct){btn.classList.add('selected-correct');msgEl.textContent='✓ Correct!';msgEl.className='mcq-result-msg correct';window.launchConfetti(btn);} else{btn.classList.add('selected-wrong');msgEl.className='mcq-result-msg wrong';const correctIdx=options.findIndex(o=>o.correct);if(correctIdx!==-1){optsContainer.querySelectorAll('.mcq-option')[correctIdx].classList.add('reveal-correct');msgEl.textContent=`✗ The answer was: ${options[correctIdx].label}`;}else msgEl.textContent='✗ Incorrect';} }); optsContainer.appendChild(btn); }); setupDoubleTap(card,article.id); return card; }
function formatNumber(num){if(num>=1000000)return (num/1000000).toFixed(1)+'M';if(num>=1000)return (num/1000).toFixed(1)+'K';return (num||0).toString();}
function formatDate(date){const now=new Date(),ms=now-date,mins=Math.floor(ms/60000),hrs=Math.floor(ms/3600000),days=Math.floor(ms/86400000);if(mins<60)return `${mins}m ago`;if(hrs<24)return `${hrs}h ago`;if(days<7)return `${days}d ago`;return date.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function getAvatarContent(article){if(article.authorPfp)return `<img src="${article.authorPfp}" alt="${article.author}">`;let letter='A';if(article.authorUsername){letter=article.authorUsername.charAt(0).toUpperCase();}else if(article.author){const atIdx=article.author.indexOf('@');letter=atIdx!==-1&&article.author.length>atIdx+1?article.author.charAt(atIdx+1).toUpperCase():article.author.charAt(0).toUpperCase();}return letter;}

function applyLikeColorFromCard(card, likeBtn) { const imgEl = card.querySelector('.article-full-img-wrap img'); if (!imgEl) return; const apply = () => { window._getImageDominantColor(imgEl, color => { if (color) { likeBtn.style.setProperty('--like-dynamic-color', color); likeBtn.querySelector('svg').style.fill = color; likeBtn.querySelector('svg').style.stroke = color; } }); }; if (imgEl.complete && imgEl.naturalWidth > 0) apply(); else imgEl.addEventListener('load', apply, { once: true }); }
async function handleLike(e){ const btn=e.currentTarget,id=String(btn.dataset.id),countSpan=btn.querySelector('.like-count'); if(!currentUser){alert('Please log in to like articles');window.location.href='https://patholytica.com/login';return;} if(btn.dataset.processing==='true')return;btn.dataset.processing='true'; const wasLiked=userLikes.has(id); const artIdx=articles.findIndex(a=>String(a.id)===id); const prevRealCount=artIdx!==-1?(articles[artIdx].likes||0):0; const newCount=wasLiked?Math.max(0,prevRealCount-1):prevRealCount+1; if(wasLiked){ userLikes.delete(id);btn.classList.remove('liked'); btn.querySelector('svg').style.fill='';btn.querySelector('svg').style.stroke=''; } else { userLikes.add(id);btn.classList.add('liked'); const card=btn.closest('.article-card,.mcq-card'); if(card){applyLikeColorFromCard(card,btn);} } countSpan.textContent=formatNumber(newCount); const card=btn.closest('.article-card,.mcq-card'); if(card){const s=card.querySelector('.stat-item.likes span');if(s)s.textContent=formatNumber(newCount);} if(artIdx!==-1)articles[artIdx].likes=newCount; try{ if(wasLiked){await supabase.from('likes').delete().eq('article_id',parseInt(id)).eq('user_id',currentUser.user_id);const {error:rpcErr}=await supabase.rpc('decrement_likes',{article_id:parseInt(id)});if(rpcErr){const {data:fresh}=await supabase.from('articles').select('likes').eq('id',id).single();await supabase.from('articles').update({likes:Math.max(0,(fresh?.likes||1)-1)}).eq('id',id);}} else{const {error:insErr}=await supabase.from('likes').insert([{article_id:parseInt(id),user_id:currentUser.user_id}]);if(insErr&&insErr.code!=='23505')throw insErr;const {error:rpcErr}=await supabase.rpc('increment_likes',{article_id:parseInt(id)});if(rpcErr){const {data:fresh}=await supabase.from('articles').select('likes').eq('id',id).single();await supabase.from('articles').update({likes:(fresh?.likes||0)+1}).eq('id',id);}} }catch(err){ if(wasLiked){userLikes.add(id);btn.classList.add('liked');}else{userLikes.delete(id);btn.classList.remove('liked');btn.querySelector('svg').style.fill='';btn.querySelector('svg').style.stroke='';} countSpan.textContent=formatNumber(prevRealCount); const card=btn.closest('.article-card,.mcq-card');if(card){const s=card.querySelector('.stat-item.likes span');if(s)s.textContent=formatNumber(prevRealCount);} if(artIdx!==-1)articles[artIdx].likes=prevRealCount; }finally{btn.dataset.processing='false';} }
async function loadArticles(isInitial=true){ if(isLoading||(!isInitial&&!hasMore))return;isLoading=true; try{ if(isInitial&&anchorArticleId!==null){ const {data:anchorArt,error:anchorErr}=await supabase.from('articles').select('*').eq('id',anchorArticleId).single(); if(anchorErr||!anchorArt){anchorArticleId=null;} else{const {data:rest}=await supabase.from('articles').select('*').order('created_at',{ascending:false}).lt('created_at',anchorArt.created_at).limit(LIMIT-1); const combined=[anchorArt,...(rest||[])]; await enrichAndRender(combined,isInitial); offset=LIMIT; isLoading=false; return;} } let query=supabase.from('articles').select('*').order('created_at',{ascending:false}).range(offset,offset+LIMIT-1); if(filteredArticleIds!==null){ if(filteredArticleIds.length===0){const wrapper=document.getElementById('postsWrapper'); wrapper.querySelectorAll('.skeleton-card').forEach(s=>s.remove()); wrapper.innerHTML+=`<div class="loading-container" style="height:100vh;scroll-snap-align:start;"><i class="fas fa-inbox" style="font-size:40px;color:var(--accent);opacity:0.4;"></i><div>No articles in selected libraries</div></div>`; isLoading=false;return;} query=query.in('id',filteredArticleIds); } const {data:articlesData,error}=await query; if(error)throw error; if(!articlesData||articlesData.length===0){ if(isInitial){const wrapper=document.getElementById('postsWrapper'); wrapper.querySelectorAll('.skeleton-card').forEach(s=>s.remove()); wrapper.innerHTML+=`<div class="loading-container" style="height:100vh;scroll-snap-align:start;"><i class="fas fa-inbox" style="font-size:40px;color:var(--accent);opacity:0.4;"></i><div>No articles found</div></div>`;} hasMore=false; isLoading=false;return;} if(articlesData.length<LIMIT)hasMore=false; offset+=articlesData.length; await enrichAndRender(articlesData,isInitial); isLoading=false; }catch(e){console.error('Error loading articles:',e); if(isInitial){const wrapper=document.getElementById('postsWrapper'); wrapper.querySelectorAll('.skeleton-card').forEach(s=>s.remove()); wrapper.innerHTML+=`<div class="loading-container" style="height:100vh;scroll-snap-align:start;"><i class="fas fa-exclamation-triangle" style="font-size:40px;color:var(--accent);opacity:0.4;"></i><div>Failed to load articles</div></div>`;} isLoading=false;} }
async function enrichAndRender(articlesData, isInitial){ const userIds=[...new Set(articlesData.map(a=>a.firebase_user_id).filter(Boolean))]; let usersData=[]; if(userIds.length>0){const {data:users}=await supabase.from('users').select('firebase_uid, username, full_name, pfp, user_id').in('firebase_uid',userIds);usersData=users||[]; usersData.forEach(u=>{if(u.firebase_uid&&u.user_id){supaUserIdToFirebaseUid[u.user_id]=u.firebase_uid;firebaseUidToSupaUserId[u.firebase_uid]=u.user_id;}});} const articleIds=articlesData.map(a=>a.id); const {data:mediaData}=await supabase.from('media').select('*').in('article_id',articleIds).order('display_order',{ascending:true}); const newArticles=articlesData.map(article=>{ const user=usersData.find(u=>u.firebase_uid===article.firebase_user_id); return{...article,author:user?.username?`@${user.username}`:(user?.full_name||'Anonymous'),authorPfp:user?.pfp||null,authorUsername:user?.username||null,authorSupaUserId:user?.user_id||null,media:(mediaData||[]).filter(m=>m.article_id===article.id)}; }); articles=[...articles,...newArticles]; renderArticles(isInitial); }
function renderArticles(isInitial=true){ const wrapper=document.getElementById('postsWrapper'); if(isInitial){wrapper.querySelectorAll('.skeleton-card').forEach(s=>s.remove()); wrapper.querySelectorAll('.article-card,.mcq-card').forEach(c=>c.remove());} else{const last=wrapper.lastElementChild;if(last&&last.classList.contains('skeleton-card'))last.remove();} const startIndex=isInitial?0:articles.length-LIMIT; for(let index=startIndex;index<articles.length;index++){ const article=articles[index]; if(isMCQ(article.content)){ wrapper.appendChild(buildMCQCard(article,index)); } else { const articleDiv=document.createElement('div'); articleDiv.className='article-card'; articleDiv.dataset.index=index; articleDiv.dataset.articleId=article.id; const hasImages=article.media&&article.media.some(m=>m.type==='image'); if(hasImages)articleDiv.classList.add('has-image'); const contentDiv=document.createElement('div'); contentDiv.className='article-content'; const paragraphs=(article.content||'No content available').split('\n\n'); paragraphs.forEach((paragraph,pIndex)=>{ if(paragraph.trim()){ const p=document.createElement('div');p.className='content-paragraph'; p.innerHTML=renderEmojiText(paragraph.trim());contentDiv.appendChild(p); if(article.media?.length>0){ article.media.filter(m=>m.display_order===pIndex&&(m.type==='image'||m.type==='youtube')).forEach(m=>contentDiv.appendChild(createMediaElement(m,true))); } } }); if(article.media){ article.media.filter(m=>m.display_order>=paragraphs.length||(m.type!=='image'&&m.type!=='youtube')).forEach(m=>contentDiv.appendChild(createMediaElement(m,m.type==='image'||m.type==='youtube'))); } const isLiked=userLikes.has(String(article.id)); articleDiv.innerHTML=`<div class="article-header">${buildAuthorHeader(article)}</div><div class="article-title">${renderEmojiText(article.title||'Untitled')}</div><div class="article-stats"><div class="stat-item views"><i class="fas fa-eye"></i><span>${formatNumber(article.views||0)}</span></div><div class="stat-item likes"><i class="fas fa-heart"></i><span>${formatNumber(article.likes||0)}</span></div></div><div class="action-buttons"><button class="action-btn like-btn ${isLiked?'liked':''}" data-id="${article.id}"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><span class="like-count">${formatNumber(article.likes||0)}</span></button><button class="action-btn comment-btn" data-id="${article.id}"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg><span class="comment-count">0</span></button><button class="action-btn share-btn" data-id="${article.id}" data-title="${(article.title||'').replace(/"/g,'&quot;')}"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg><span>Share</span></button></div>`; articleDiv.querySelector('.article-stats').insertAdjacentElement('afterend',contentDiv); wrapper.appendChild(articleDiv); setupDoubleTap(articleDiv,article.id); if(isLiked&&hasImages){ const likeBtn=articleDiv.querySelector('.like-btn'); setTimeout(()=>{applyLikeColorFromCard(articleDiv,likeBtn);},200); } } } if(hasMore){const skDiv=document.createElement('div');skDiv.className='skeleton-card';skDiv.innerHTML=skeletonCardHTML();wrapper.appendChild(skDiv);} document.querySelectorAll('.like-btn').forEach(btn=>btn.addEventListener('click',handleLike)); document.querySelectorAll('.comment-btn').forEach(btn=>btn.addEventListener('click',handleComments)); document.querySelectorAll('.share-btn').forEach(btn=>btn.addEventListener('click',()=>shareArticle(btn.dataset.id,btn.dataset.title))); updateFollowButtons(); if(isInitial){wrapper.addEventListener('scroll',handleScroll);loadCommentCounts();setupIntersectionObserver();} else{setupIntersectionObserverForNew(startIndex);loadCommentCounts();} }
function setupIntersectionObserver(){const obs=new IntersectionObserver((entries)=>{entries.forEach(entry=>{const id=entry.target.dataset.articleId;if(!id)return;if(entry.isIntersecting&&entry.intersectionRatio>=0.75)startViewTimer(id);else clearViewTimer(id);});},{threshold:[0.75]}); document.querySelectorAll('.article-card,.mcq-card').forEach(c=>{if(c.dataset.articleId)obs.observe(c);});}
function setupIntersectionObserverForNew(startIndex){const obs=new IntersectionObserver((entries)=>{entries.forEach(entry=>{const id=entry.target.dataset.articleId;if(!id)return;if(entry.isIntersecting&&entry.intersectionRatio>=0.75)startViewTimer(id);else clearViewTimer(id);});},{threshold:[0.75]}); document.querySelectorAll('.article-card,.mcq-card').forEach(c=>{if(c.dataset.index>=startIndex&&c.dataset.articleId)obs.observe(c);});}
function startViewTimer(id){if(viewedArticles.has(id)||viewTimers[id])return;viewTimers[id]=setTimeout(async()=>{await incrementView(id);},5000);}
function clearViewTimer(id){if(viewTimers[id]){clearTimeout(viewTimers[id]);delete viewTimers[id];}}
async function incrementView(id){ if(viewedArticles.has(id))return; try{viewedArticles.add(id);const {data:a}=await supabase.from('articles').select('views').eq('id',id).single(); const nv=(a.views||0)+1;await supabase.from('articles').update({views:nv}).eq('id',id); const idx=articles.findIndex(a=>a.id===id);if(idx!==-1)articles[idx].views=nv; const card=document.querySelector(`.article-card[data-article-id="${id}"],.mcq-card[data-article-id="${id}"]`);if(card){const s=card.querySelector('.stat-item.views span');if(s)s.textContent=formatNumber(nv);}}catch(e){viewedArticles.delete(id);} }
async function loadCommentCounts(){try{const {data:comments}=await supabase.from('comments').select('article_id'); const counts={};(comments||[]).forEach(c=>{counts[c.article_id]=(counts[c.article_id]||0)+1;}); document.querySelectorAll('.comment-btn').forEach(btn=>{btn.querySelector('.comment-count').textContent=counts[btn.dataset.id]||0;});}catch(e){}}
async function handleComments(e){currentArticleId=e.currentTarget.dataset.id;await loadComments(currentArticleId);openComments();}
async function loadComments(articleId){ const list=document.getElementById('commentsList'); list.innerHTML='<div class="loading-container"><div class="spinner" style="width:28px;height:28px;border-width:2px;"></div></div>'; try{ const {data:comments}=await supabase.from('comments').select('*').eq('article_id',articleId).order('created_at',{ascending:true}); if(!comments||!comments.length){list.innerHTML=`<div class="no-comments"><i class="fas fa-comments"></i><div>No comments yet</div><div style="font-size:11px;">Be the first to comment!</div></div>`;return;} const uids=[...new Set(comments.map(c=>c.user_id).filter(Boolean))];let usersMap={}; if(uids.length>0){const {data:users}=await supabase.from('users').select('user_id, username, full_name, pfp').in('user_id',uids);if(users)users.forEach(u=>{usersMap[u.user_id]=u;});} list.innerHTML=comments.map(c=>{const u=usersMap[c.user_id],author=u?.username?`@${u.username}`:(u?.full_name||'Anonymous'); const av=u?.pfp?`<img src="${u.pfp}" alt="${author}">`:(u?.username||'A')[0].toUpperCase(); return `<div class="comment-item"><div class="comment-avatar">${av}</div><div class="comment-content"><div class="comment-author">${author}</div><div class="comment-text">${renderEmojiText(c.comment_text)}</div><div class="comment-time">${formatDate(new Date(c.created_at))}</div></div></div>`;}).join(''); }catch(e){list.innerHTML=`<div class="no-comments"><i class="fas fa-exclamation-triangle"></i><div>Failed to load comments</div></div>`;} }
window.openComments=()=>{document.getElementById('commentsPopup').classList.add('active');document.getElementById('commentsOverlay').classList.add('active');document.body.style.overflow='hidden';};
window.closeComments=()=>{document.getElementById('commentsPopup').classList.remove('active');document.getElementById('commentsOverlay').classList.remove('active');document.body.style.overflow='';};
window.sendComment=async function(){ const input=document.getElementById('commentInput'),text=input.value.trim(); if(!text||!currentArticleId)return;const sendBtn=document.getElementById('sendCommentBtn');sendBtn.disabled=true; try{if(!currentUser)currentUser=await getCurrentUser();if(!currentUser){window.location.href='https://patholytica.com/login';return;} await supabase.from('comments').insert([{article_id:currentArticleId,user_id:currentUser.user_id,comment_text:text}]); input.value='';await loadComments(currentArticleId); const cb=document.querySelector(`.comment-btn[data-id="${currentArticleId}"]`);if(cb){const cs=cb.querySelector('.comment-count');cs.textContent=parseInt(cs.textContent)+1;} } catch(e){alert('Failed to post comment.');}finally{sendBtn.disabled=false;} };
document.getElementById('commentInput').addEventListener('keypress',e=>{if(e.key==='Enter')window.sendComment();});
function handleScroll(e){const c=e.target;if(c.scrollTop+c.clientHeight>=c.scrollHeight*0.8&&hasMore&&!isLoading)loadArticles(false);}
initLibraryPicker();
window.toggleAudio=function(btn,audioId){ const player=btn.closest('.custom-audio-player'),audio=document.getElementById(audioId),icon=btn.querySelector('i'); if(audio.paused){audio.play();icon.className='fas fa-pause'; audio.ontimeupdate=function(){const progress=(audio.currentTime/audio.duration)*100;const prog=player.querySelector('.waveform-progress');if(prog)prog.style.width=progress+'%';const ct=player.querySelector('.current-time');if(ct){const m=Math.floor(audio.currentTime/60),s=Math.floor(audio.currentTime%60);ct.textContent=`${m}:${s.toString().padStart(2,'0')}`;}}; audio.onended=function(){icon.className='fas fa-play';const prog=player.querySelector('.waveform-progress');if(prog)prog.style.width='0%';const ct=player.querySelector('.current-time');if(ct)ct.textContent='0:00';};} else{audio.pause();icon.className='fas fa-play';} };
window.seekAudio=function(event,container,audioId){ const audio=document.getElementById(audioId);if(!audio||!audio.duration)return; const rect=container.getBoundingClientRect();audio.currentTime=((event.clientX-rect.left)/rect.width)*audio.duration; };
window.renderEmojiText=function(text,applyTerms=true){ const EMOJI_MAP={ '🔍':'emo-magnify','❗':'emo-urgent','📌':'emo-pinned','🔥':'emo-fire','💎':'emo-diamond','🟡':'emo-yellow','🔵':'emo-blue','🟢':'emo-green','🟣':'emo-purple','🔴':'emo-red','⚫':'emo-dark','🧠':'emo-brain','📖':'emo-book','💡':'emo-idea','🎯':'emo-target','🧩':'emo-puzzle','🏷️':'emo-tag','🔬':'emo-micro','⚠️':'emo-warning','✅':'emo-check','❌':'emo-cross','⏳':'emo-hourglass','🔒':'emo-lock','🔓':'emo-unlock','⚡':'emo-lightning','🌊':'emo-wave','🌀':'emo-spin','💫':'emo-float','🚀':'emo-rocket','🎬':'emo-cinematic','🌟':'emo-star','✨':'emo-sparkle','🌈':'emo-rainbow','👑':'emo-crown','🪄':'emo-magic','❤️':'emo-heart','😄':'emo-happy','😌':'emo-calm','😮':'emo-surprised','😎':'emo-cool','🤖':'emo-robot','🧪':'emo-science','🏛️':'emo-temple','🌍':'emo-earth','💰':'emo-money','⚖️':'emo-balance','📡':'emo-signal','🎵':'emo-music','🧊':'emo-ice','🔊':'emo-sound', }; function buildEmojiPattern(){const keys=Object.keys(EMOJI_MAP).sort((a,b)=>b.length-a.length);const escaped=keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');return new RegExp(`(${escaped})([\\s\\S]*?)\\1`,'gu');} function escHtmlET(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');} function renderTerms(html){return html.replace(/([A-Za-z][A-Za-z0-9\-']{0,60}?)&lt;([^&]{1,600}?)&gt;/g,function(match,term,explanation){const safeTerm=term.trim().replace(/'/g,'&#39;');const safeExp=explanation.replace(/'/g,'&#39;');return `<span class="term-link" onclick="openTermPopup('${safeTerm}','${safeExp}',event)">${term.trim()}</span>`;});} const re=buildEmojiPattern(); let result='',lastIndex=0,match; while((match=re.exec(text))!==null){result+=escHtmlET(text.slice(lastIndex,match.index));const cls=EMOJI_MAP[match[1]];result+=`<span class="${cls}">${renderEmojiText(match[2],false)}</span>`;lastIndex=re.lastIndex;}result+=escHtmlET(text.slice(lastIndex));return applyTerms?renderTerms(result):result; };
window.spawnHeartBurst=function(x,y){ const el=document.createElement('div');el.className='heart-burst'; el.style.left=x+'px';el.style.top=y+'px'; el.innerHTML=`<svg viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg"><path d="M50 85 C50 85 5 55 5 28 C5 14 16 5 28 5 C37 5 45 10 50 18 C55 10 63 5 72 5 C84 5 95 14 95 28 C95 55 50 85 50 85Z" fill="#c8a96e"/></svg>`; document.body.appendChild(el);el.addEventListener('animationend',()=>el.remove()); };
window._getImageDominantColor = function(imgEl, callback) { try { const canvas = document.createElement('canvas'); const SIZE = 50; canvas.width = SIZE; canvas.height = SIZE; const ctx = canvas.getContext('2d'); ctx.drawImage(imgEl, 0, 0, SIZE, SIZE); const data = ctx.getImageData(0, 0, SIZE, SIZE).data; let r=0,g=0,b=0,cnt=0; for(let i=0;i<data.length;i+=4){ const a=data[i+3]; if(a<128)continue; r+=data[i];g+=data[i+1];b+=data[i+2];cnt++; } if(!cnt){callback(null);return;} r=Math.round(r/cnt);g=Math.round(g/cnt);b=Math.round(b/cnt); const boost=1.6; r=Math.min(255,Math.round(r*boost)); g=Math.min(255,Math.round(g*boost)); b=Math.min(255,Math.round(b*boost)); callback(`rgb(${r},${g},${b})`); } catch(e){ callback(null); } };
</script>
