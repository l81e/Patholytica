<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Feed — Patholytica</title>
  <meta name="description" content="Patholytica medical education feed">

  <!-- OG tags updated dynamically for shared article links -->
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Patholytica">
  <meta property="og:title" content="Patholytica Feed" id="ogTitle">
  <meta property="og:description" content="Medical education content" id="ogDescription">
  <meta property="og:image" content="" id="ogImage">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Patholytica Feed" id="twTitle">
  <meta name="twitter:description" content="Medical education content" id="twDescription">
  <meta name="twitter:image" content="" id="twImage">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg:           #090c14;
      --bg-raised:    #0f1420;
      --bg-hover:     #151c2e;
      --border:       #1e2840;
      --border-soft:  rgba(30,40,64,0.7);
      --text-1:       #e2e8f0;
      --text-2:       #7a8aaa;
      --text-3:       #3d4d6a;
      --accent:       #6ee7f7;
      --accent-dim:   rgba(110,231,247,0.15);
      --accent-glow:  rgba(110,231,247,0.25);
      --accent-2:     #818cf8;
      --green:        #6ee7b7;
      --red:          #f87171;
      --orange:       #fb923c;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: "DM Sans", -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-1);
      overflow: hidden;
      position: fixed;
      width: 100%; height: 100%;
    }

    .app {
      position: fixed;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%; max-width: 460px;
      height: 100vh;
    }

    /* ── SCROLL CONTAINER ── */
    .feed {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .feed::-webkit-scrollbar { display: none; }

    /* ── SHARED CARD BASE ── */
    .card {
      position: relative;
      height: 100vh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    /* ── SKELETON ── */
    @keyframes shimmer { 0%,100%{opacity:.3} 50%{opacity:.7} }
    .sk { background: var(--bg-raised); border-radius: 6px; animation: shimmer 1.5s infinite; }
    .skeleton-card {
      height: 100vh;
      scroll-snap-align: start;
      background: var(--bg);
      padding: calc(env(safe-area-inset-top) + 14px) 20px 110px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .sk-header { display:flex; gap:10px; align-items:center; }
    .sk-av { width:40px; height:40px; border-radius:50%; flex-shrink:0; }
    .sk-lines { flex:1; display:flex; flex-direction:column; gap:6px; }
    .sk-t { height: 16px; width: 60%; }
    .sk-d { height: 11px; width: 35%; }
    .sk-title-1 { height: 22px; width: 90%; border-radius: 8px; }
    .sk-title-2 { height: 22px; width: 65%; border-radius: 8px; }
    .sk-body { display:flex; flex-direction:column; gap:8px; flex:1; }
    .sk-l { height: 13px; width: 100%; }
    .sk-l.w90 { width:90%; } .sk-l.w75 { width:75%; } .sk-l.w80 { width:80%; }

    /* ── ARTICLE CARD ── */
    .article-card {
      padding-top: calc(env(safe-area-inset-top) + 14px);
    }

    .card-header {
      display: flex; align-items: center; gap: 11px;
      padding: 0 18px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; color: var(--bg);
      overflow: hidden; flex-shrink: 0; cursor: pointer;
      border: 1.5px solid var(--border);
      transition: opacity .15s;
    }
    .avatar:hover { opacity: .85; }
    .avatar img { width:100%; height:100%; object-fit:cover; }

    .author-meta { flex:1; }
    .author-name {
      font-size: 13px; font-weight: 700; color: var(--text-1);
      cursor: pointer; display: inline-block;
      transition: color .15s; letter-spacing: -.01em;
    }
    .author-name:hover { color: var(--accent); }
    .post-date { font-size: 11px; color: var(--text-2); margin-top: 1px; }

    /* follow / edit buttons */
    .hd-btn {
      width: 30px; height: 30px; border-radius: 50%;
      border: 1.5px solid var(--border);
      background: var(--bg-raised); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: border-color .2s, background .2s, box-shadow .2s;
      -webkit-tap-highlight-color: transparent; color: var(--text-2);
      overflow: hidden; position: relative;
    }
    .hd-btn:active { transform: scale(.9); }
    .hd-btn .icon-plus, .hd-btn .icon-bell {
      position:absolute; width:14px; height:14px;
      transition: opacity .25s, transform .25s cubic-bezier(.34,1.56,.64,1);
    }
    .hd-btn .icon-plus { stroke: var(--text-2); fill:none; stroke-width:2; opacity:1; transform:scale(1) rotate(0deg); }
    .hd-btn .icon-bell { stroke: var(--accent); fill:none; stroke-width:1.8; opacity:0; transform:scale(.4) rotate(-20deg); }
    .hd-btn.following { border-color: var(--accent); background: var(--accent-dim); box-shadow: 0 0 10px var(--accent-glow); }
    .hd-btn.following .icon-plus { opacity:0; transform:scale(.4) rotate(90deg); }
    .hd-btn.following .icon-bell { opacity:1; transform:scale(1) rotate(0deg); }
    @keyframes bellRing { 0%{transform:scale(1) rotate(0deg)} 20%{transform:scale(1.2) rotate(-18deg)} 40%{transform:scale(1.15) rotate(14deg)} 60%{transform:scale(1.05) rotate(-8deg)} 80%{transform:scale(1) rotate(4deg)} 100%{transform:scale(1) rotate(0deg)} }
    .hd-btn.ringing .icon-bell { animation: bellRing .5s ease forwards; }

    .edit-btn {
      width:30px; height:30px; border-radius:50%;
      border:1.5px solid rgba(110,231,247,.25);
      background: var(--accent-dim); cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0; color:var(--accent); font-size:11px;
      transition: border-color .2s, box-shadow .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .edit-btn:hover { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
    .edit-btn:active { transform: scale(.9); }

    /* title + stats */
    .card-title {
      font-size: 19px; font-weight: 800;
      font-family: 'Merriweather', serif;
      color: var(--text-1); line-height: 1.22;
      padding: 0 18px; margin-bottom: 8px;
      flex-shrink: 0; letter-spacing: -.02em;
    }

    .card-stats {
      display:flex; align-items:center; gap:14px;
      padding: 0 18px; margin-bottom: 10px; flex-shrink:0;
    }
    .stat { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text-2); font-weight:600; }
    .stat.v i { color: var(--accent); }
    .stat.l i { color: var(--orange); }

    /* content scroll area */
    .card-content {
      flex:1; overflow-y:auto;
      padding: 0 18px 18px;
      padding-right: 62px;
      padding-bottom: 110px;
      font-size: 14px; line-height: 1.7;
      color: var(--text-1); letter-spacing: .01em;
    }
    .card-content::-webkit-scrollbar { width:2px; }
    .card-content::-webkit-scrollbar-thumb { background: var(--border); border-radius:2px; }

    .para { margin-bottom: 14px; }

    /* full bleed image inside content */
    .img-wrap {
      width: calc(100% + 80px);
      margin-left: -18px; margin-right: -62px;
      margin-bottom: 14px; margin-top: 4px;
      overflow: hidden;
    }
    .img-wrap img { width:100%; height:auto; display:block; max-height:320px; object-fit:cover; }
    .img-caption { font-size:11px; color:var(--text-2); font-style:italic; padding:5px 18px 0; }

    .yt-wrap {
      width: calc(100% + 80px);
      margin-left: -18px; margin-right: -62px;
      margin-bottom: 14px; margin-top: 4px;
    }
    .yt-wrap iframe { width:100%; aspect-ratio:16/9; border:none; display:block; }
    .yt-caption { font-size:11px; color:var(--text-2); font-style:italic; padding:5px 18px 0; }

    /* ghost comments */
    .ghost-comments { margin-top:16px; padding-top:12px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:7px; }
    .ghost-comment { font-size:11px; font-style:italic; color:var(--text-2); opacity:.6; line-height:1.5; padding-left:10px; border-left:2px solid var(--border); }
    .ghost-author { font-weight:700; font-style:normal; opacity:.8; margin-right:4px; }

    /* ── SIDE ACTIONS ── */
    .side-actions {
      position:absolute; right:12px; bottom:120px;
      display:flex; flex-direction:column; gap:18px;
      z-index:10;
    }
    .act-btn {
      display:flex; flex-direction:column; align-items:center; gap:3px;
      background:none; border:none; cursor:pointer;
      transition: transform .1s; -webkit-tap-highlight-color:transparent;
    }
    .act-btn:active { transform:scale(.85); }
    .act-btn .icon-wrap {
      width:42px; height:42px; border-radius:14px;
      background: rgba(15,20,32,.85);
      border:1px solid var(--border);
      backdrop-filter: blur(12px);
      display:flex; align-items:center; justify-content:center;
      transition: border-color .2s, background .2s;
    }
    .act-btn:hover .icon-wrap { border-color: var(--accent); background: var(--bg-hover); }
    .act-btn svg { width:20px; height:20px; stroke:var(--text-1); fill:none; stroke-width:2; }
    .act-btn span { color:var(--text-2); font-size:10px; font-weight:700; }

    .act-btn.like-btn svg { transition: fill .2s, stroke .2s; }
    .act-btn.like-btn.liked svg { fill: var(--orange); stroke: var(--orange); }
    .act-btn.like-btn.liked .icon-wrap { border-color: rgba(251,146,60,.35); background: rgba(251,146,60,.08); }

    /* heart burst */
    .heart-burst { position:fixed; pointer-events:none; z-index:9999; transform:translate(-50%,-50%); animation: hbAnim .7s cubic-bezier(.16,1,.3,1) forwards; }
    .heart-burst svg { width:72px; height:72px; filter:drop-shadow(0 0 12px rgba(251,146,60,.6)); }
    @keyframes hbAnim { 0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-15deg)} 30%{opacity:1;transform:translate(-50%,-50%) scale(1.3) rotate(5deg)} 55%{opacity:1;transform:translate(-50%,-50%) scale(.9)} 100%{opacity:0;transform:translate(-50%,-50%) scale(.8) translateY(-20px)} }

    /* ── MCQ CARD ── */
    .mcq-card {
      padding-top: calc(env(safe-area-inset-top) + 14px);
      padding-bottom: 100px;
      overflow: hidden;
    }

    .mcq-badge {
      align-self: flex-start;
      display:inline-flex; align-items:center; gap:5px;
      margin: 0 18px 14px;
      background: var(--accent-dim);
      border:1px solid rgba(110,231,247,.25);
      border-radius:20px; padding:4px 12px;
      font-size:10px; font-weight:800; letter-spacing:.08em;
      text-transform:uppercase; color:var(--accent);
      flex-shrink:0;
    }

    .mcq-question {
      font-size:18px; font-weight:800;
      font-family:'Merriweather',serif;
      color:var(--text-1); line-height:1.3;
      padding:0 18px; margin-bottom:14px;
      padding-right:56px; flex-shrink:0;
      letter-spacing:-.02em;
    }

    .mcq-media { padding:0 18px; padding-right:64px; flex-shrink:0; margin-bottom:12px; }

    .mcq-scroll {
      flex:1; overflow-y:auto;
      padding:0 18px; padding-right:64px;
      display:flex; flex-direction:column; gap:8px;
    }
    .mcq-scroll::-webkit-scrollbar { width:2px; }

    .mcq-opts { display:flex; flex-direction:column; gap:8px; }

    .mcq-opt {
      display:flex; align-items:center; gap:10px;
      padding:12px 14px; border-radius:14px;
      border:1.5px solid var(--border); background:var(--bg-raised);
      cursor:pointer; text-align:left; font-size:14px; font-weight:500;
      color:var(--text-1); line-height:1.4; width:100%;
      transition: border-color .15s, background .15s, box-shadow .15s;
      -webkit-tap-highlight-color:transparent;
    }
    .mcq-opt:hover:not(:disabled) { border-color:var(--accent); background:var(--accent-dim); box-shadow:0 0 12px var(--accent-glow); }

    .opt-pill {
      width:26px; height:26px; border-radius:8px;
      border:1.5px solid var(--border);
      display:flex; align-items:center; justify-content:center;
      font-size:10px; font-weight:800; flex-shrink:0;
      color:var(--text-2); transition:all .15s;
    }
    .mcq-opt .opt-text { flex:1; }
    .mcq-opt:disabled { cursor:default; }

    .mcq-opt.correct { border-color:var(--green); background:rgba(110,231,183,.08); box-shadow:0 0 14px rgba(110,231,183,.15); }
    .mcq-opt.correct .opt-pill { background:var(--green); border-color:var(--green); color:var(--bg); }
    .mcq-opt.wrong { border-color:var(--red); background:rgba(248,113,113,.07); }
    .mcq-opt.wrong .opt-pill { background:var(--red); border-color:var(--red); color:#fff; }
    .mcq-opt.reveal { border-color:rgba(110,231,183,.4); }
    .mcq-opt.reveal .opt-pill { border-color:var(--green); color:var(--green); }

    .mcq-result { font-size:13px; font-weight:700; margin-top:12px; min-height:18px; color:var(--text-2); flex-shrink:0; }
    .mcq-result.ok { color: var(--green); }
    .mcq-result.no { color: var(--red); }

    /* ── LIBRARY PICKER ── */
    .picker-card {
      height:100vh; scroll-snap-align:start; scroll-snap-stop:always;
      background:var(--bg); display:flex; flex-direction:column; overflow:hidden;
    }

    .picker-header {
      flex-shrink:0;
      padding: calc(env(safe-area-inset-top) + 14px) 18px 14px;
      border-bottom:1px solid var(--border);
    }
    .picker-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .picker-logo img { height:22px; width:auto; }
    .picker-create {
      display:flex; align-items:center; gap:5px;
      padding:6px 13px; border-radius:20px;
      background:var(--accent-dim); border:1px solid rgba(110,231,247,.25);
      color:var(--accent); font-size:11px; font-weight:700;
      cursor:pointer; text-decoration:none; font-family:"DM Sans",sans-serif;
      transition: background .15s;
    }
    .picker-create:hover { background:rgba(110,231,247,.2); }

    .picker-headline { font-size:21px; font-weight:900; font-family:'Merriweather',serif; color:var(--text-1); line-height:1.15; letter-spacing:-.03em; margin-bottom:3px; }
    .picker-headline em { color:var(--accent); font-style:normal; }
    .picker-sub { font-size:12px; color:var(--text-2); }

    .picker-body { flex:1; overflow-y:auto; overflow-x:hidden; padding:14px 18px 0; }
    .picker-body::-webkit-scrollbar { width:2px; }
    .picker-body::-webkit-scrollbar-thumb { background:var(--border); }

    .picker-hint { font-size:11px; color:var(--accent); font-weight:700; margin-bottom:10px; }

    /* Vertical card list for saved libs */
    .lib-list { display:flex; flex-direction:column; gap:8px; }

    .lib-pick-card {
      display:flex; align-items:center; gap:12px;
      padding:12px 14px; border-radius:14px;
      border:1.5px solid var(--border); background:var(--bg-raised);
      cursor:pointer;
      transition: border-color .2s, background .2s, box-shadow .2s;
      position:relative; -webkit-tap-highlight-color:transparent;
    }
    .lib-pick-card:hover { border-color:rgba(110,231,247,.3); background:var(--bg-hover); }
    .lib-pick-card.selected { border-color:var(--accent); background:var(--accent-dim); box-shadow:0 0 14px var(--accent-glow); }

    .lib-pick-thumb {
      width:50px; height:50px; border-radius:10px; flex-shrink:0;
      overflow:hidden; background:var(--bg-hover);
      border:1px solid var(--border);
      display:flex; align-items:center; justify-content:center;
      font-size:18px; font-weight:800;
      color:rgba(110,231,247,.2); font-family:'Merriweather',serif;
    }
    .lib-pick-thumb img { width:100%; height:100%; object-fit:cover; }

    .lib-pick-info { flex:1; min-width:0; }
    .lib-pick-name { font-size:14px; font-weight:700; color:var(--text-1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:2px; transition:color .15s; }
    .lib-pick-card.selected .lib-pick-name { color:var(--accent); }
    .lib-pick-meta { font-size:11px; color:var(--text-2); display:flex; align-items:center; gap:6px; }

    .lib-pick-check {
      width:22px; height:22px; border-radius:50%;
      background:var(--accent); flex-shrink:0;
      display:none; align-items:center; justify-content:center;
      font-size:11px; color:var(--bg); font-weight:800;
    }
    .lib-pick-card.selected .lib-pick-check { display:flex; }

    .picker-footer {
      flex-shrink:0; background:var(--bg);
      padding:12px 18px;
      padding-bottom:calc(18px + env(safe-area-inset-bottom) + 72px);
      border-top:1px solid var(--border);
    }
    .picker-go {
      width:100%; padding:14px; border-radius:12px;
      background:var(--accent); color:var(--bg);
      font-size:14px; font-weight:800; border:none; cursor:pointer;
      font-family:"DM Sans",sans-serif;
      box-shadow:0 4px 20px var(--accent-glow);
      transition: background .15s, opacity .15s, transform .1s;
    }
    .picker-go:hover:not(:disabled) { background:#5dd4e6; }
    .picker-go:active:not(:disabled) { transform:scale(.98); }
    .picker-go:disabled { opacity:.3; cursor:not-allowed; }
    .picker-scroll-hint { text-align:center; margin-top:9px; font-size:11px; color:var(--text-2); display:flex; align-items:center; justify-content:center; gap:6px; }

    @keyframes pickerExit { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-20px) scale(.97)} }
    .picker-card.exiting { animation:pickerExit .3s ease forwards; pointer-events:none; }

    /* ── FOOTER BAR ── */
    .footer-bar {
      position:fixed; bottom:0; left:50%; transform:translateX(-50%);
      width:100%; max-width:460px;
      background:rgba(9,12,20,.95);
      border-top:1px solid var(--border);
      padding:8px 32px;
      padding-bottom:calc(8px + env(safe-area-inset-bottom));
      display:flex; justify-content:space-around; align-items:center;
      z-index:100; backdrop-filter:blur(20px);
    }
    .foot-btn {
      display:flex; flex-direction:column; align-items:center; gap:3px;
      background:none; border:none; color:var(--text-3);
      cursor:pointer; transition:color .2s; padding:5px 16px;
    }
    .foot-btn:hover { color:var(--text-2); }
    .foot-btn.active { color:var(--accent); }
    .foot-btn i { font-size:19px; }
    .foot-btn span { font-size:9px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }

    /* ── COMMENTS ── */
    .comments-overlay { position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:199; opacity:0; pointer-events:none; transition:opacity .3s; backdrop-filter:blur(4px); }
    .comments-overlay.active { opacity:1; pointer-events:all; }
    .comments-popup {
      position:fixed; top:50%; left:50%;
      transform:translate(-50%,-50%) scale(.9);
      width:calc(100% - 36px); max-width:480px;
      height:70vh; max-height:580px;
      background:#0c1120; border-radius:20px; z-index:200;
      opacity:0; pointer-events:none;
      transition:all .3s cubic-bezier(.4,0,.2,1);
      display:flex; flex-direction:column;
      box-shadow:0 24px 80px rgba(0,0,0,.7), 0 0 0 1px var(--border);
    }
    .comments-popup.active { opacity:1; pointer-events:all; transform:translate(-50%,-50%) scale(1); }
    .comments-hd { display:flex; align-items:center; justify-content:space-between; padding:15px 20px; border-bottom:1px solid var(--border); }
    .comments-hd h3 { font-size:14px; font-weight:700; }
    .close-cmt { background:none; border:none; color:var(--text-1); font-size:20px; cursor:pointer; width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:50%; }
    .close-cmt:hover { background:var(--bg-hover); }
    .comments-list { flex:1; overflow-y:auto; padding:12px 18px; }
    .comments-list::-webkit-scrollbar { width:3px; }
    .cmt-item { display:flex; gap:9px; margin-bottom:16px; }
    .cmt-av { width:28px; height:28px; border-radius:50%; background:var(--accent-dim); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:var(--accent); flex-shrink:0; overflow:hidden; border:1px solid var(--border); }
    .cmt-av img { width:100%; height:100%; object-fit:cover; }
    .cmt-body { flex:1; }
    .cmt-author { font-weight:700; font-size:12px; margin-bottom:2px; }
    .cmt-text { font-size:13px; line-height:1.5; margin-bottom:4px; }
    .cmt-time { font-size:10px; color:var(--text-2); }
    .cmt-input-wrap { padding:10px 16px; border-top:1px solid var(--border); background:#0c1120; border-radius:0 0 20px 20px; }
    .cmt-input-row { display:flex; gap:8px; align-items:center; }
    .cmt-input {

<script>
/* ── CONFETTI ── */
(function(){
  const c=document.getElementById('confetti'),ctx=c.getContext('2d');
  let P=[],af=null;
  function resize(){c.width=innerWidth;c.height=innerHeight;}
  addEventListener('resize',resize);resize();
  const COLS=['#6ee7f7','#e0f2fe','#818cf8','#6ee7b7','#f87171','#fb923c','#fde68a'];
  function spawn(x,y){for(let i=0;i<65;i++){const a=Math.random()*Math.PI*2,s=Math.random()*6+2;P.push({x:x??c.width/2,y:y??c.height*.4,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,sz:Math.random()*6+3,col:COLS[Math.floor(Math.random()*COLS.length)],al:1,rot:Math.random()*Math.PI*2,rs:(Math.random()-.5)*.2,sh:Math.random()>.5?'r':'c'});} if(!af)anim();}
  function anim(){ctx.clearRect(0,0,c.width,c.height);P=P.filter(p=>p.al>.01);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.vx*=.99;p.al-=.018;p.rot+=p.rs;ctx.save();ctx.globalAlpha=Math.max(0,p.al);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;if(p.sh==='r'){ctx.fillRect(-p.sz/2,-p.sz/4,p.sz,p.sz/2);}else{ctx.beginPath();ctx.arc(0,0,p.sz/2,0,Math.PI*2);ctx.fill();}ctx.restore();});if(P.length){af=requestAnimationFrame(anim);}else{af=null;ctx.clearRect(0,0,c.width,c.height);}}
  window.launchConfetti=function(el){if(el){const r=el.getBoundingClientRect();spawn(r.left+r.width/2,r.top+r.height/2);}else spawn();};
})();

/* ── HEART BURST ── */
window.spawnHeart=function(x,y){
  const el=document.createElement('div');el.className='heart-burst';
  el.style.left=x+'px';el.style.top=y+'px';
  el.innerHTML=`<svg viewBox="0 0 100 90"><path d="M50 85C50 85 5 55 5 28C5 14 16 5 28 5C37 5 45 10 50 18C55 10 63 5 72 5C84 5 95 14 95 28C95 55 50 85 50 85Z" fill="#fb923c"/></svg>`;
  document.body.appendChild(el);el.addEventListener('animationend',()=>el.remove());
};

/* ── TOAST ── */
window.showToast=function(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);};

/* ── TERM POPUP ── */
window._tpOut=null;
window.openTermPopup=function(term,exp,e){
  const p=document.getElementById('termPopup');
  document.getElementById('tpTerm').textContent=term;
  document.getElementById('tpBody').innerHTML=exp;
  const W=270,H=150,M=8,vw=innerWidth,vh=innerHeight;
  let ax=e?e.clientX:vw/2,ay=e?e.clientY:vh/2;
  let l=ax-W/2,t=ay+14;
  l=Math.max(M,Math.min(l,vw-W-M));
  if(t+H>vh-M)t=ay-H-8;t=Math.max(M,t);
  p.style.left=l+'px';p.style.top=t+'px';
  p.classList.add('active');
  if(window._tpOut)document.removeEventListener('click',window._tpOut);
  setTimeout(()=>{window._tpOut=function(e){if(!p.contains(e.target)&&!e.target.classList.contains('term-link'))closeTermPopup();};document.addEventListener('click',window._tpOut,{once:true});},10);
};
window.closeTermPopup=function(){document.getElementById('termPopup').classList.remove('active');if(window._tpOut){document.removeEventListener('click',window._tpOut);window._tpOut=null;}};
</script>

  '⚖️':'emo-balance','📡':'emo-signal','🎵':'emo-music','🧊':'emo-ice','🔊':'emo-sound',
};
function buildEmojiRE(){const k=Object.keys(EMAP).sort((a,b)=>b.length-a.length);const e=k.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');return new RegExp(`(${e})([\\s\\S]*?)\\1`,'gu');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderTerms(h){return h.replace(/([A-Za-z][A-Za-z0-9\-']{0,60}?)&lt;([^&]{1,600}?)&gt;/g,function(m,term,exp){const st=term.trim().replace(/'/g,'&#39;');const se=exp.replace(/'/g,'&#39;');return `<span class="term-link" onclick="openTermPopup('${st}','${se}',event)">${term.trim()}</span>`;});}
function renderEmoji(text,applyTerms=true){const re=buildEmojiRE();let r='',li=0,m;while((m=re.exec(text))!==null){r+=esc(text.slice(li,m.index));const cls=EMAP[m[1]];r+=`<span class="${cls}">${renderEmoji(m[2],false)}</span>`;li=re.lastIndex;}r+=esc(text.slice(li));return applyTerms?renderTerms(r):r;}
</script>

/* ── LOAD & ENRICH ── */
async function loadArticles(isInitial = true) {
  if (isLoading || (!isInitial && !hasMore)) return;
  isLoading = true;
  try {
    if (isInitial && anchorArticleId !== null) {
      const { data: anchor } = await supabase.from('articles').select('*').eq('id', anchorArticleId).single();
      if (anchor) {
        const { data: rest } = await supabase.from('articles').select('*').order('created_at',{ascending:false}).lt('created_at', anchor.created_at).limit(LIMIT-1);
        await enrichAndRender([anchor, ...(rest||[])], true);
        offset = LIMIT; isLoading = false; return;
      }
      anchorArticleId = null;
    }

    let q = supabase.from('articles').select('*').order('created_at',{ascending:false}).range(offset, offset+LIMIT-1);
    if (filteredArticleIds !== null) {
      if (filteredArticleIds.length === 0) {
        document.getElementById('feed').querySelectorAll('.skeleton-card').forEach(s=>s.remove());
        const d = document.createElement('div'); d.className='center-state';
        d.innerHTML='<i class="fas fa-inbox" style="font-size:36px;color:var(--accent);opacity:.3;"></i><div>No articles in selected libraries</div>';
        document.getElementById('feed').appendChild(d);
        isLoading = false; return;
      }
      q = q.in('id', filteredArticleIds);
    }
    const { data, error } = await q;
    if (error) throw error;
    if (!data || !data.length) {
      if (isInitial) {
        document.getElementById('feed').querySelectorAll('.skeleton-card').forEach(s=>s.remove());
        const d=document.createElement('div');d.className='center-state';
        d.innerHTML='<i class="fas fa-inbox" style="font-size:36px;color:var(--accent);opacity:.3;"></i><div>No articles found</div>';
        document.getElementById('feed').appendChild(d);
      }
      hasMore = false; isLoading = false; return;
    }
    if (data.length < LIMIT) hasMore = false;
    offset += data.length;
    await enrichAndRender(data, isInitial);
    isLoading = false;
  } catch(e) {
    console.error(e);
    if (isInitial) {
      document.getElementById('feed').querySelectorAll('.skeleton-card').forEach(s=>s.remove());
      const d=document.createElement('div');d.className='center-state';
      d.innerHTML='<i class="fas fa-exclamation-triangle" style="font-size:36px;color:var(--accent);opacity:.4;"></i><div>Failed to load</div>';
      document.getElementById('feed').appendChild(d);
    }
    isLoading = false;
  }
}

async function enrichAndRender(data, isInitial) {
  const uids = [...new Set(data.map(a=>a.firebase_user_id).filter(Boolean))];
  let users = [];
  if (uids.length) {
    const { data: u } = await supabase.from('users').select('firebase_uid,username,full_name,pfp,user_id').in('firebase_uid', uids);
    users = u || [];
    users.forEach(u => { if(u.firebase_uid&&u.user_id){fbUidToSupaId[u.firebase_uid]=u.user_id;supaIdToFbUid[u.user_id]=u.firebase_uid;} });
  }
  const ids = data.map(a=>a.id);
  const { data: media } = await supabase.from('media').select('*').in('article_id',ids).order('display_order',{ascending:true});
  const enriched = data.map(a => {
    const u = users.find(u=>u.firebase_uid===a.firebase_user_id);
    return { ...a,
      author: u?.username ? `@${u.username}` : (u?.full_name||'Anonymous'),
      authorPfp: u?.pfp||null,
      authorUsername: u?.username||null,
      authorSupaId: u?.user_id||null,
      media: (media||[]).filter(m=>m.article_id===a.id)
    };
  });
  articles = [...articles, ...enriched];
  renderFeed(isInitial);
}

/* ── RENDER ── */
function renderFeed(isInitial) {
  const feed = document.getElementById('feed');
  const start = isInitial ? 0 : articles.length - LIMIT;
  if (isInitial) { feed.querySelectorAll('.skeleton-card').forEach(s=>s.remove()); feed.querySelectorAll('.article-card,.mcq-card').forEach(c=>c.remove()); }
  else { const last = feed.lastElementChild; if(last&&last.classList.contains('skeleton-card'))last.remove(); }

  for (let i = start; i < articles.length; i++) {
    const art = articles[i];
    if (isMCQ(art.content)) feed.appendChild(buildMCQCard(art, i));
    else                    feed.appendChild(buildArticleCard(art, i));
  }

  if (hasMore) feed.appendChild(makeSkeleton());
  bindActionButtons();
  updateLikeButtons();
  updateFollowButtons();
  if (isInitial) { feed.addEventListener('scroll', onScroll); loadCommentCounts(); setupIntersectionObserver(0); }
  else           { setupIntersectionObserver(start); loadCommentCounts(); }
}

/* ── ARTICLE CARD ── */
function buildArticleCard(art, idx) {

/* ── MCQ CARD ── */
function isMCQ(c) { return typeof c==='string' && c.trimStart().startsWith('❔'); }
function parseMCQ(c) {
  const lines = c.trim().split('\n').map(l=>l.trim()).filter(Boolean);
  const q = lines[0].replace(/^❔/,'').trim();
  const opts = lines.slice(1).map(l => ({ label:l.replace(/^✅/,'').trim(), correct:l.startsWith('✅') }));
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  return { question:q, opts };
}

function buildMCQCard(art, idx) {
  const { question, opts } = parseMCQ(art.content);
  const isLiked = userLikes.has(String(art.id));
  const LETTERS = ['A','B','C','D','E','F'];

  const card = document.createElement('div');
  card.className = 'card mcq-card';
  card.dataset.index = idx;
  card.dataset.articleId = art.id;

  card.innerHTML = `
    <div class="card-header">${buildAuthorHeader(art)}</div>
    <div class="mcq-badge"><i class="fas fa-question-circle" style="font-size:9px"></i>&nbsp;Quick Question</div>
    <div class="mcq-question">${renderEmoji(question)}</div>
    <div class="mcq-media" id="mcqm-${art.id}"></div>
    <div class="mcq-scroll">
      <div class="mcq-opts" id="mcqo-${art.id}"></div>
      <div class="mcq-result" id="mcqr-${art.id}"></div>
    </div>
    <div class="side-actions">
      <button class="act-btn like-btn ${isLiked?'liked':''}" data-id="${art.id}">
        <div class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
        <span class="like-count">${fmt(art.likes||0)}</span>
      </button>
      <button class="act-btn comment-btn" data-id="${art.id}">
        <div class="icon-wrap"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
        <span class="comment-count">0</span>
      </button>
      <button class="act-btn share-btn" data-id="${art.id}" data-title="${(art.title||'').replace(/"/g,'&quot;')}">
        <div class="icon-wrap"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></div>
        <span>Share</span>
      </button>
    </div>`;

  if (art.media?.length) {
    const mm = card.querySelector(`#mcqm-${art.id}`);
    art.media.forEach(m => mm.appendChild(createMediaEl(m, false)));
  }

  const optsEl = card.querySelector(`#mcqo-${art.id}`);
  const msgEl  = card.querySelector(`#mcqr-${art.id}`);
  let answered = false;

  opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'mcq-opt';
    btn.innerHTML = `<span class="opt-pill">${LETTERS[i]||i+1}</span><span class="opt-text">${renderEmoji(opt.label)}</span>`;
    btn.addEventListener('click', () => {
      if (answered) return;
      answered = true;
      optsEl.querySelectorAll('.mcq-opt').forEach(b=>b.disabled=true);
      if (opt.correct) {
        btn.classList.add('correct');
        msgEl.textContent = '✓ Correct!'; msgEl.className='mcq-result ok';
        window.launchConfetti(btn);
      } else {
        btn.classList.add('wrong');
        msgEl.className = 'mcq-result no';
        const ci = opts.findIndex(o=>o.correct);
        if (ci !== -1) { optsEl.querySelectorAll('.mcq-opt')[ci].classList.add('reveal'); msgEl.textContent=`✗ Answer: ${opts[ci].label}`; }
        else msgEl.textContent='✗ Incorrect';
      }
    });
    optsEl.appendChild(btn);
  });

  setupDoubleTap(card, art.id);
  return card;
}

/* ── AUTHOR HEADER ── */
function buildAuthorHeader(art) {
  const avContent = art.authorPfp ? `<img src="${art.authorPfp}" alt="">` : getInitial(art);
  const supaId = art.authorSupaId||'';
  const fbUid  = art.firebase_user_id||'';
  const uname  = art.authorUsername||'';
  const url    = uname ? `profile.html?username=${encodeURIComponent(uname)}` : (fbUid ? `profile.html?id=${encodeURIComponent(fbUid)}` : '#');
  const isOwn  = currentUser && supaId && String(currentUser.user_id)===String(supaId);
  const isFollowing = supaId && userFollowing.has(String(supaId));
  const showFollow  = supaId && !isOwn;

  let btn = '';
  if (isOwn) {
    btn = `<button class="edit-btn" onclick="location.href='https://patholytica.com/create?edit=${art.id}'" title="Edit"><i class="fas fa-pen"></i></button>`;
  } else if (showFollow) {
    btn = `<button class="hd-btn ${isFollowing?'following':''}" data-supa-uid="${supaId}"
      onclick="handleFollow(event,'${fbUid}','${supaId}')" aria-label="Follow">
      <svg class="icon-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <svg class="icon-bell" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </button>`;
  }

  return `
    <div class="avatar" onclick="location.href='${url}'">${avContent}</div>
    <div class="author-meta">
      <div class="author-name" onclick="location.href='${url}'">${art.author}</div>
      <div class="post-date">${fmtDate(new Date(art.created_at))}</div>
    </div>
    ${btn}`;
}

function getInitial(art) {
  if (art.authorUsername) return art.authorUsername.charAt(0).toUpperCase();
  if (art.author) { const i=art.author.indexOf('@'); return i!==-1&&art.author.length>i+1?art.author.charAt(i+1).toUpperCase():art.author.charAt(0).toUpperCase(); }
  return 'A';
}

/* ── MEDIA ── */
function createMediaEl(m, fullBleed=false) {
  const d = document.createElement('div');
  if (m.type==='image') {
    if (fullBleed) {
      d.className = 'img-wrap';
      d.innerHTML = `<img src="${m.url}" alt="${m.caption||''}" crossorigin="anonymous">${m.caption?`<div class="img-caption">${m.caption}</div>`:''}`;
    } else {
      d.className = 'media-embed';
      d.innerHTML = `<img src="${m.url}" alt="${m.caption||''}">${m.caption?`<div class="media-caption">${m.caption}</div>`:''}`;
    }
  } else if (m.type==='youtube') {
    if (fullBleed) {
      d.className = 'yt-wrap';
      d.innerHTML = `<iframe src="${m.url}" title="${m.caption||'Video'}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>${m.caption?`<div class="yt-caption">${m.caption}</div>`:''}`;
    } else {
      const yid = (m.url.match(/embed\/([A-Za-z0-9_-]{11})/)||[])[1]||'';
      d.className = 'media-embed';
      d.innerHTML = `<div style="background:var(--bg-raised);border:1px solid var(--border);border-radius:12px;overflow:hidden;">
        <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);">
          <i class="fab fa-youtube" style="color:#f87171;font-size:13px;flex-shrink:0;"></i>
          <span style="font-size:12px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${m.caption||'YouTube Video'}</span>
          ${yid?`<a href="https://youtube.com/watch?v=${yid}" target="_blank" style="font-size:10px;font-weight:700;color:#f87171;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.2);border-radius:7px;padding:3px 9px;text-decoration:none;white-space:nowrap;">Watch</a>`:''}
        </div>
        <iframe src="${m.url}" title="${m.caption||''}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen style="width:100%;aspect-ratio:16/9;border:none;display:block;"></iframe>
      </div>`;
    }
  } else if (m.type==='audio') {
    d.className = 'media-embed';
    const aid = 'aud-'+Math.random().toString(36).substr(2,8);
    const bars = Array(14).fill(0).map(()=>`<div class="waveform-bar" style="height:${Math.random()*60+20}%"></div>`).join('');
    d.innerHTML = `<div class="audio-player">
      <button class="play-btn" onclick="toggleAudio(this,'${aid}')"><i class="fas fa-play"></i></button>
      <div class="audio-info">
        <div class="audio-title">${m.caption||'Audio'}</div>
        <div class="waveform" onclick="seekAudio(event,this,'${aid}')"><div class="waveform-prog"></div><div class="waveform-bars">${bars}</div></div>
        <div class="audio-time"><span class="cur-t">0:00</span><span class="dur-t">0:00</span></div>
      </div>
      <audio id="${aid}" src="${m.url}" style="display:none;"></audio>
    </div>`;
    setTimeout(()=>{const a=document.getElementById(aid);if(a)a.addEventListener('loadedmetadata',()=>{const d=Math.floor(a.duration);const el=a.closest('.audio-player')?.querySelector('.dur-t');if(el)el.textContent=`${Math.floor(d/60)}:${(d%60).toString().padStart(2,'0')}`;});},50);
  } else if (m.type==='pdf') {
    d.className = 'media-embed';
    d.innerHTML = `<div style="background:var(--bg-raised);border:1px solid var(--border);border-radius:12px;overflow:hidden;">
      <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);">
        <i class="fas fa-file-pdf" style="color:#f87171;font-size:15px;flex-shrink:0;"></i>
        <span style="font-size:12px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${m.caption||'Document'}</span>
        <a href="${m.url}" target="_blank" style="font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-dim);border:1px solid rgba(110,231,247,.2);border-radius:7px;padding:3px 9px;text-decoration:none;">Open</a>
      </div>
      <iframe src="${m.url}" style="width:100%;height:180px;border:none;display:block;"></iframe>
    </div>`;
  }
  return d;
}

/* ── GHOST COMMENTS ── */
async function appendGhostComments(card, articleId) {
  try {
    const { data: comments } = await supabase.from('comments').select('comment_text,user_id').eq('article_id',articleId).order('created_at',{ascending:false}).limit(3);
    if (!comments||!comments.length) return;
    const uids = [...new Set(comments.map(c=>c.user_id).filter(Boolean))];
    let umap = {};
    if (uids.length) { const {data:users}=await supabase.from('users').select('user_id,username').in('user_id',uids); (users||[]).forEach(u=>{umap[u.user_id]=u;}); }
    const contentEl = card.querySelector('.card-content');
    if (!contentEl) return;
    const ghost = document.createElement('div');
    ghost.className = 'ghost-comments';
    comments.forEach(c => {
      const u = umap[c.user_id];
      const author = u?.username ? `@${u.username}` : 'Someone';
      const el = document.createElement('div');
      el.className = 'ghost-comment';
      el.innerHTML = `<span class="ghost-author">${author}</span>${esc(c.comment_text.slice(0,80))}${c.comment_text.length>80?'…':''}`;
      ghost.appendChild(el);
    });
    contentEl.appendChild(ghost);
  } catch(e) {}
}

/* ── INTERACTIONS ── */
function setupDoubleTap(card, id) {
  let last = 0;
  card.addEventListener('touchend', e => {
    if (e.target.closest('button,a,.term-link,.side-actions,.author-name,.avatar,.hd-btn,.edit-btn')) return;
    const now = Date.now(), t = e.changedTouches[0];
    if (now-last < 320) { triggerLike(card,id,t.clientX,t.clientY); e.preventDefault(); }
    last = now;
  }, {passive:false});
  card.addEventListener('dblclick', e => {
    if (e.target.closest('button,a,.term-link,.side-actions,.author-name,.avatar,.hd-btn,.edit-btn')) return;
    triggerLike(card,id,e.clientX,e.clientY);
  });
}
function triggerLike(card,id,x,y) {
  const btn = card.querySelector('.like-btn');
  if (!btn) return;
  if (!btn.classList.contains('liked')) btn.click();
  window.spawnHeart(x,y);
}

async function handleLike(e) {
  const btn = e.currentTarget, id = String(btn.dataset.id);
  const cntEl = btn.querySelector('.like-count');
  if (!currentUser) { location.href='https://patholytica.com/login'; return; }
  if (btn.dataset.processing==='true') return;
  btn.dataset.processing = 'true';
  const wasLiked = userLikes.has(id);
  const ai = articles.findIndex(a=>String(a.id)===id);
  const prev = ai!==-1?(articles[ai].likes||0):0;
  const next = wasLiked ? Math.max(0,prev-1) : prev+1;
  if (wasLiked) { userLikes.delete(id); btn.classList.remove('liked'); }
  else           { userLikes.add(id);    btn.classList.add('liked'); }
  cntEl.textContent = fmt(next);
  const card = btn.closest('.card');
  if (card) { const s=card.querySelector('.stat.l span'); if(s)s.textContent=fmt(next); }
  if (ai!==-1) articles[ai].likes = next;
  try {
    if (wasLiked) { await supabase.from('likes').delete().eq('article_id',parseInt(id)).eq('user_id',currentUser.user_id); const {error}=await supabase.rpc('decrement_likes',{article_id:parseInt(id)}); if(error){const {data:f}=await supabase.from('articles').select('likes').eq('id',id).single();await supabase.from('articles').update({likes:Math.max(0,(f?.likes||1)-1)}).eq('id',id);} }
    else           { const {error:ie}=await supabase.from('likes').insert([{article_id:parseInt(id),user_id:currentUser.user_id}]); if(ie&&ie.code!=='23505')throw ie; const {error:re}=await supabase.rpc('increment_likes',{article_id:parseInt(id)}); if(re){const {data:f}=await supabase.from('articles').select('likes').eq('id',id).single();await supabase.from('articles').update({likes:(f?.likes||0)+1}).eq('id',id);} }
  } catch(err) {
    if (wasLiked) { userLikes.add(id); btn.classList.add('liked'); } else { userLikes.delete(id); btn.classList.remove('liked'); }
    cntEl.textContent = fmt(prev);
    if (card) { const s=card.querySelector('.stat.l span'); if(s)s.textContent=fmt(prev); }
    if (ai!==-1) articles[ai].likes = prev;
  } finally { btn.dataset.processing='false'; }
}

window.handleFollow = async function(e, fbUid, supaId) {
  e.stopPropagation();
  if (!currentUser) { location.href='https://patholytica.com/login'; return; }
  const btn = e.currentTarget;
  if (btn.dataset.processing==='true') return;
  btn.dataset.processing = 'true';
  const sid = String(supaId), was = userFollowing.has(sid);
  if (was) userFollowing.delete(sid); else userFollowing.add(sid);
  updateFollowButtons();
  if (!was) { setTimeout(()=>{btn.classList.add('ringing');btn.addEventListener('animationend',()=>btn.classList.remove('ringing'),{once:true});},260); }
  try {
    if (was) await supabase.from('subscriptions').delete().eq('subscriber_id',currentUser.user_id).eq('author_id',parseInt(supaId));
    else      await supabase.from('subscriptions').insert([{subscriber_id:currentUser.user_id,author_id:parseInt(supaId)}]);
  } catch(err) { if(was)userFollowing.add(sid);else userFollowing.delete(sid);updateFollowButtons(); }
  finally { btn.dataset.processing='false'; }
};

window.shareArticle = function(id, title) {
  const url = `${location.origin}${location.pathname}?id=${id}`;
  if (navigator.share) { navigator.share({title:title||'Patholytica',url}).catch(()=>{}); }
  else { navigator.clipboard.writeText(url).then(()=>showToast('🔗 Link copied!')).catch(()=>showToast('🔗 '+url)); }
};

function bindActionButtons() {
  document.querySelectorAll('.like-btn').forEach(b => { b.removeEventListener('click', handleLike); b.addEventListener('click', handleLike); });
  document.querySelectorAll('.comment-btn').forEach(b => { b.removeEventListener('click', onCommentClick); b.addEventListener('click', onCommentClick); });
  document.querySelectorAll('.share-btn').forEach(b => { b.onclick = () => shareArticle(b.dataset.id, b.dataset.title); });
}
function onCommentClick(e) { currentArticleId = e.currentTarget.dataset.id; loadComments(currentArticleId); openComments(); }

/* ── FOLLOW & LIKES STATE ── */
async function loadUserLikes() {
  if (!currentUser) return;
  try { const {data}=await supabase.from('likes').select('article_id').eq('user_id',currentUser.user_id); userLikes.clear();(data||[]).forEach(l=>userLikes.add(String(l.article_id)));updateLikeButtons(); } catch(e){}
}
async function loadUserFollowing() {
  if (!currentUser) return;
  try { const {data}=await supabase.from('subscriptions').select('author_id').eq('subscriber_id',currentUser.user_id); userFollowing.clear();(data||[]).forEach(r=>userFollowing.add(String(r.author_id)));updateFollowButtons(); } catch(e){}
}
function updateLikeButtons() { document.querySelectorAll('.like-btn').forEach(b=>b.classList.toggle('liked',userLikes.has(String(b.dataset.id)))); }
function updateFollowButtons() { document.querySelectorAll('.hd-btn[data-supa-uid]').forEach(b=>{const f=userFollowing.has(String(b.dataset.supaUid));b.classList.toggle('following',f);}); }

onAuthStateChanged(auth, async fbUser => {
  if (fbUser) {
    if (!currentUser) {
      try { const {data}=await supabase.from('users').select('user_id,firebase_uid,username').eq('firebase_uid',fbUser.uid).single(); currentUser=data||null; } catch(e){}
    }
    if (currentUser) await Promise.all([loadUserLikes(), loadUserFollowing()]);
  } else { currentUser=null; userLikes.clear(); userFollowing.clear(); }
});

/* ── VIEWS ── */
function setupIntersectionObserver(start) {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { const id=e.target.dataset.articleId; if(!id)return; if(e.isIntersecting&&e.intersectionRatio>=.75)startViewTimer(id); else clearViewTimer(id); });
  }, {threshold:[.75]});
  document.querySelectorAll('.card[data-article-id]').forEach(c => { if(parseInt(c.dataset.index)>=start)obs.observe(c); });
}
function startViewTimer(id) { if(viewedArticles.has(id)||viewTimers[id])return; viewTimers[id]=setTimeout(()=>incrementView(id),5000); }
function clearViewTimer(id) { if(viewTimers[id]){clearTimeout(viewTimers[id]);delete viewTimers[id];} }
async function incrementView(id) {
  if (viewedArticles.has(id)) return;
  try { viewedArticles.add(id); const {data:a}=await supabase.from('articles').select('views').eq('id',id).single(); const nv=(a.views||0)+1; await supabase.from('articles').update({views:nv}).eq('id',id); const idx=articles.findIndex(a=>a.id===id); if(idx!==-1)articles[idx].views=nv; const card=document.querySelector(`.card[data-article-id="${id}"]`); if(card){const s=card.querySelector('.stat.v span');if(s)s.textContent=fmt(nv);} } catch(e){viewedArticles.delete(id);}
}

/* ── COMMENTS ── */
async function loadComments(articleId) {
  const list = document.getElementById('cmtList');
  list.innerHTML = '<div class="no-cmts"><div class="spinner" style="width:24px;height:24px;border-width:2px;"></div></div>';
  try {
    const {data:comments}=await supabase.from('comments').select('*').eq('article_id',articleId).order('created_at',{ascending:true});
    if (!comments||!comments.length) { list.innerHTML='<div class="no-cmts"><i class="fas fa-comments"></i><div>No comments yet</div></div>'; return; }
    const uids=[...new Set(comments.map(c=>c.user_id).filter(Boolean))];
    let umap={};
    if(uids.length){const {data:u}=await supabase.from('users').select('user_id,username,full_name,pfp').in('user_id',uids);if(u)u.forEach(u=>{umap[u.user_id]=u;});}
    list.innerHTML = comments.map(c => {
      const u=umap[c.user_id], author=u?.username?`@${u.username}`:(u?.full_name||'Anonymous');
      const av=u?.pfp?`<img src="${u.pfp}" alt="">`:(u?.username||'A')[0].toUpperCase();
      return `<div class="cmt-item"><div class="cmt-av">${av}</div><div class="cmt-body"><div class="cmt-author">${author}</div><div class="cmt-text">${renderEmoji(c.comment_text)}</div><div class="cmt-time">${fmtDate(new Date(c.created_at))}</div></div></div>`;
    }).join('');
  } catch(e) { list.innerHTML='<div class="no-cmts"><i class="fas fa-exclamation-triangle"></i><div>Failed to load</div></div>'; }
}
async function loadCommentCounts() {
  try { const {data}=await supabase.from('comments').select('article_id'); const m={}; (data||[]).forEach(c=>{m[c.article_id]=(m[c.article_id]||0)+1;}); document.querySelectorAll('.comment-btn').forEach(b=>{b.querySelector('.comment-count').textContent=m[b.dataset.id]||0;}); } catch(e){}
}
window.openComments  = ()=>{ document.getElementById('cmtPopup').classList.add('active'); document.getElementById('cmtOverlay').classList.add('active'); document.body.style.overflow='hidden'; };
window.closeComments = ()=>{ document.getElementById('cmtPopup').classList.remove('active'); document.getElementById('cmtOverlay').classList.remove('active'); document.body.style.overflow=''; };
window.sendComment   = async function() {
  const inp=document.getElementById('cmtInput'),text=inp.value.trim();
  if(!text||!currentArticleId)return;
  const btn=document.getElementById('cmtSend'); btn.disabled=true;
  try {
    if (!currentUser) { location.href='https://patholytica.com/login'; return; }
    await supabase.from('comments').insert([{article_id:currentArticleId,user_id:currentUser.user_id,comment_text:text}]);
    inp.value=''; await loadComments(currentArticleId);
    const cb=document.querySelector(`.comment-btn[data-id="${currentArticleId}"]`); if(cb){const s=cb.querySelector('.comment-count');s.textContent=parseInt(s.textContent)+1;}
  } catch(e){alert('Failed to post comment.');} finally{btn.disabled=false;}
};
document.getElementById('cmtInput').addEventListener('keypress', e=>{ if(e.key==='Enter')window.sendComment(); });

/* ── INFINITE SCROLL ── */
function onScroll(e) { const c=e.target; if(c.scrollTop+c.clientHeight>=c.scrollHeight*.8&&hasMore&&!isLoading)loadArticles(false); }

/* ── UTILS ── */
function fmt(n){if(n>=1e6)return (n/1e6).toFixed(1)+'M';if(n>=1e3)return (n/1e3).toFixed(1)+'K';return (n||0).toString();}
function fmtDate(d){const now=new Date(),ms=now-d,m=Math.floor(ms/60000),h=Math.floor(ms/3600000),dy=Math.floor(ms/86400000);if(m<60)return `${m}m ago`;if(h<24)return `${h}h ago`;if(dy<7)return `${dy}d ago`;return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}

/* ── BOOT ── */
initLibraryPicker();
</script>

<script>
window.toggleAudio=function(btn,aid){
  const player=btn.closest('.audio-player'),audio=document.getElementById(aid),icon=btn.querySelector('i');
  if(audio.paused){audio.play();icon.className='fas fa-pause';
    audio.ontimeupdate=function(){const p=(audio.currentTime/audio.duration)*100;const pg=player.querySelector('.waveform-prog');if(pg)pg.style.width=p+'%';const ct=player.querySelector('.cur-t');if(ct){const m=Math.floor(audio.currentTime/60),s=Math.floor(audio.currentTime%60);ct.textContent=`${m}:${s.toString().padStart(2,'0')}`;}};
    audio.onended=function(){icon.className='fas fa-play';const pg=player.querySelector('.waveform-prog');if(pg)pg.style.width='0%';const ct=player.querySelector('.cur-t');if(ct)ct.textContent='0:00';};}
  else{audio.pause();icon.className='fas fa-play';}
};
window.seekAudio=function(e,container,aid){const audio=document.getElementById(aid);if(!audio||!audio.duration)return;const r=container.getBoundingClientRect();audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;};
</script>
