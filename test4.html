<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
   <title>Article Scroller - Patholytica</title>
   <!-- OG / Twitter card meta tags (populated dynamically for ?article= links) -->
   <meta property="og:site_name" content="Patholytica">
   <meta property="og:type" content="article">
   <meta property="og:title" id="ogTitle" content="Patholytica – Learn smarter">
   <meta property="og:description" id="ogDescription" content="Bite-sized academic content in a social feed.">
   <meta property="og:image" id="ogImage" content="">
   <meta name="twitter:card" content="summary_large_image">
   <meta name="twitter:title" id="twTitle" content="Patholytica – Learn smarter">
   <meta name="twitter:description" id="twDescription" content="Bite-sized academic content in a social feed.">
   <meta name="twitter:image" id="twImage" content="">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=DM+Sans:wght@400;500;600&family=Source+Serif+4:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
   <style>
       :root {
           --bg-color: #0f0e0b;
           --text-primary: #f5f0e8;
           --text-secondary: #8a8070;
           --card-bg: #0f0e0b;
           --hover-bg: #1a1810;
           --border-color: #2a2518;
           --accent: #c8a96e;
           --accent-hover: #b8935a;
           --accent-glow: rgba(200, 169, 110, 0.25);
           --accent-soft: rgba(200, 169, 110, 0.12);
           --font-article: 'Merriweather', serif;
           --font-ui: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
           --font-size-base: 14px;
           --font-size-title: 20px;
           --font-size-mcq: 19px;
       }

       /* ── THEMES ── */
       body.theme-dark {
           --bg-color: #0f0e0b;
           --text-primary: #f5f0e8;
           --text-secondary: #8a8070;
           --card-bg: #0f0e0b;
           --hover-bg: #1a1810;
           --border-color: #2a2518;
           --accent: #c8a96e;
           --accent-hover: #b8935a;
           --accent-glow: rgba(200,169,110,0.25);
           --accent-soft: rgba(200,169,110,0.12);
       }
       body.theme-midnight {
           --bg-color: #0a0a12;
           --text-primary: #e8e4f0;
           --text-secondary: #6a6480;
           --card-bg: #0a0a12;
           --hover-bg: #14141f;
           --border-color: #22203a;
           --accent: #9b7fe8;
           --accent-hover: #7b5fc8;
           --accent-glow: rgba(155,127,232,0.25);
           --accent-soft: rgba(155,127,232,0.10);
       }
       body.theme-slate {
           --bg-color: #0d1117;
           --text-primary: #e6edf3;
           --text-secondary: #7d8590;
           --card-bg: #0d1117;
           --hover-bg: #161b22;
           --border-color: #21262d;
           --accent: #58a6ff;
           --accent-hover: #388bfd;
           --accent-glow: rgba(88,166,255,0.2);
           --accent-soft: rgba(88,166,255,0.10);
       }
       body.theme-sepia {
           --bg-color: #1a1510;
           --text-primary: #e8dcc8;
           --text-secondary: #8a7860;
           --card-bg: #1a1510;
           --hover-bg: #231c14;
           --border-color: #352b20;
           --accent: #d4956a;
           --accent-hover: #b87850;
           --accent-glow: rgba(212,149,106,0.25);
           --accent-soft: rgba(212,149,106,0.12);
       }
       body.theme-light {
           --bg-color: #faf6ee;
           --text-primary: #1a1710;
           --text-secondary: #706050;
           --card-bg: #faf6ee;
           --hover-bg: #f0ebe0;
           --border-color: #e0d8c8;
           --accent: #a07840;
           --accent-hover: #8a6430;
           --accent-glow: rgba(160,120,64,0.2);
           --accent-soft: rgba(160,120,64,0.08);
       }
       body.theme-forest {
           --bg-color: #0b100d;
           --text-primary: #d8ede0;
           --text-secondary: #6a8070;
           --card-bg: #0b100d;
           --hover-bg: #131a14;
           --border-color: #1e2e22;
           --accent: #6abf85;
           --accent-hover: #4fa068;
           --accent-glow: rgba(106,191,133,0.22);
           --accent-soft: rgba(106,191,133,0.10);
       }

       /* ── FONT FAMILIES ── */
       body.font-serif { --font-article: 'Merriweather', serif; --font-ui: 'DM Sans', sans-serif; }
       body.font-modern { --font-article: 'Inter', sans-serif; --font-ui: 'Inter', sans-serif; }
       body.font-slab { --font-article: 'Source Serif 4', serif; --font-ui: 'DM Sans', sans-serif; }

       /* ── FONT SIZES ── */
       body.fontsize-sm { --font-size-base: 12px; --font-size-title: 17px; --font-size-mcq: 16px; }
       body.fontsize-md { --font-size-base: 14px; --font-size-title: 20px; --font-size-mcq: 19px; }
       body.fontsize-lg { --font-size-base: 16px; --font-size-title: 23px; --font-size-mcq: 21px; }
       body.fontsize-xl { --font-size-base: 18px; --font-size-title: 26px; --font-size-mcq: 24px; }

       /* ── EMOJI EFFECTS OFF ── */
       body.no-emoji-effects .emo-fire,
       body.no-emoji-effects .emo-diamond,
       body.no-emoji-effects .emo-lightning,
       body.no-emoji-effects .emo-sparkle,
       body.no-emoji-effects .emo-rainbow,
       body.no-emoji-effects .emo-magic,
       body.no-emoji-effects .emo-earth,
       body.no-emoji-effects .emo-purple,
       body.no-emoji-effects .emo-idea,
       body.no-emoji-effects .emo-urgent,
       body.no-emoji-effects .emo-target,
       body.no-emoji-effects .emo-wave,
       body.no-emoji-effects .emo-spin,
       body.no-emoji-effects .emo-float,
       body.no-emoji-effects .emo-rocket,
       body.no-emoji-effects .emo-cinematic,
       body.no-emoji-effects .emo-star,
       body.no-emoji-effects .emo-crown,
       body.no-emoji-effects .emo-heart,
       body.no-emoji-effects .emo-happy,
       body.no-emoji-effects .emo-calm,
       body.no-emoji-effects .emo-surprised,
       body.no-emoji-effects .emo-signal,
       body.no-emoji-effects .emo-music,
       body.no-emoji-effects .emo-sound {
           animation: none !important;
           background: none !important;
           -webkit-background-clip: unset !important;
           -webkit-text-fill-color: unset !important;
           background-clip: unset !important;
           filter: none !important;
           text-shadow: none !important;
           color: var(--text-primary) !important;
       }

       * { margin: 0; padding: 0; box-sizing: border-box; }

       body {
           font-family: var(--font-ui);
           background: var(--bg-color);
           color: var(--text-primary);
           overflow: hidden;
           transition: background 0.2s ease, color 0.2s ease;
           position: fixed;
           width: 100%;
           height: 100%;
       }

       .app-container {
           position: fixed;
           top: 0;
           left: 50%;
           transform: translateX(-50%);
           width: 100%;
           max-width: 450px;
           height: 100vh;
           background: var(--bg-color);
       }

       .scroller-container {
           position: relative;
           width: 100%;
           height: 100vh;
           background: var(--bg-color);
           overflow: hidden;
       }

       .posts-wrapper {
           height: 100%;
           overflow-y: scroll;
           scroll-snap-type: y mandatory;
           scrollbar-width: none;
       }
       .posts-wrapper::-webkit-scrollbar { display: none; }

       .article-card {
           position: relative;
           height: 100vh;
           scroll-snap-align: start;
           scroll-snap-stop: always;
           background: var(--bg-color);
           padding: 0;
           padding-top: calc(20px + env(safe-area-inset-top));
           display: flex;
           flex-direction: column;
       }

       .article-header {
           display: flex;
           align-items: center;
           gap: 12px;
           flex-shrink: 0;
           position: relative;
           z-index: 50;
           margin-bottom: 14px;
           padding: 0 18px;
       }

       .author-avatar {
           width: 42px; height: 42px;
           border-radius: 50%;
           background: linear-gradient(135deg, var(--accent), #8a6430);
           display: flex; align-items: center; justify-content: center;
           font-size: 17px; font-weight: 700;
           color: #0f0e0b;
           overflow: hidden; flex-shrink: 0;
           cursor: pointer;
           transition: opacity 0.15s ease, box-shadow 0.2s ease;
       }
       .author-avatar:hover { opacity: 0.9; box-shadow: 0 0 0 2px var(--accent); }
       .author-avatar img { width: 100%; height: 100%; object-fit: cover; }
       .author-info { flex: 1; }
       .author-name {
           color: var(--text-primary);
           font-weight: 700; font-size: 14px; margin-bottom: 1px;
           cursor: pointer; display: inline-block;
           transition: color 0.15s ease; letter-spacing: -0.01em;
       }
       .author-name:hover { color: var(--accent); }
       .article-date { color: var(--text-secondary); font-size: 11px; font-weight: 500; }

       .follow-btn {
           position: relative; width: 32px; height: 32px;
           border-radius: 50%; border: 1.5px solid var(--border-color);
           background: var(--hover-bg); cursor: pointer;
           display: flex; align-items: center; justify-content: center;
           flex-shrink: 0;
           transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
           overflow: hidden; -webkit-tap-highlight-color: transparent;
       }
       .follow-btn:active { transform: scale(0.9); }
       .follow-btn .icon-plus, .follow-btn .icon-bell {
           position: absolute; width: 15px; height: 15px;
           transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
       }
       .follow-btn .icon-plus { stroke: var(--text-secondary); fill: none; stroke-width: 2; opacity: 1; transform: scale(1) rotate(0deg); }
       .follow-btn .icon-bell { stroke: var(--accent); fill: none; stroke-width: 1.8; opacity: 0; transform: scale(0.4) rotate(-20deg); }
       .follow-btn.following { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 10px var(--accent-glow); }
       .follow-btn.following .icon-plus { opacity: 0; transform: scale(0.4) rotate(90deg); }
       .follow-btn.following .icon-bell { opacity: 1; transform: scale(1) rotate(0deg); }
       @keyframes bellRing {
           0%{transform:scale(1) rotate(0deg)} 20%{transform:scale(1.1) rotate(-12deg)}
           40%{transform:scale(1.1) rotate(10deg)} 60%{transform:scale(1.05) rotate(-6deg)}
           80%{transform:scale(1) rotate(3deg)} 100%{transform:scale(1) rotate(0deg)}
       }
       .follow-btn.ringing .icon-bell { animation: bellRing 0.5s ease forwards; }

       .article-title {
           font-size: var(--font-size-title); font-weight: 800; color: var(--text-primary);
           margin-bottom: 10px; line-height: 1.2; flex-shrink: 0;
           letter-spacing: -0.02em; padding: 0 18px;
           font-family: var(--font-article);
       }

       .article-stats {
           display: flex; align-items: center; gap: 14px;
           margin-bottom: 10px; flex-shrink: 0; padding: 0 18px;
       }
       .stat-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); font-weight: 500; }
       .stat-item.views i { color: var(--accent); }
       .stat-item.likes i { color: #d4845a; }

       .article-content {
           color: var(--text-primary);
           font-size: var(--font-size-base); line-height: 1.65;
           flex: 1; overflow-y: auto;
           padding: 0 18px; padding-right: 62px; padding-bottom: 110px;
           letter-spacing: 0.01em;
           text-align: justify;
           font-family: var(--font-article);
       }
       .article-content::-webkit-scrollbar { width: 2px; }
       .article-content::-webkit-scrollbar-track { background: transparent; }
       .article-content::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
       .content-paragraph { margin-bottom: 12px; }

       /* Full-width image inside article content */
       .article-full-img-wrap {
           width: calc(100% + 80px);
           margin-left: -18px;
           margin-right: -62px;
           margin-bottom: 12px;
           margin-top: 4px;
           overflow: hidden;
       }
       .article-full-img-wrap img {
           width: 100%; height: auto; display: block;
           max-height: 340px; object-fit: cover;
       }
       .article-full-img-wrap .media-caption {
           font-size: 12px; color: var(--text-secondary);
           font-style: italic;
           padding: 7px 18px 0 18px;
       }

       /* YouTube — pure video, no decoration */
       .article-full-yt-wrap {
           width: calc(100% + 80px);
           margin-left: -18px;
           margin-right: -62px;
           margin-bottom: 12px;
           margin-top: 4px;
           overflow: hidden;
           background: #000;
       }
       .article-full-yt-wrap iframe {
           width: 100%;
           aspect-ratio: 16/9;
           border: none;
           display: block;
       }

       /* heart burst */
       .heart-burst {
           position: fixed; pointer-events: none; z-index: 9999;
           transform: translate(-50%, -50%);
           animation: heartBurstAnim 0.65s cubic-bezier(0.16,1,0.3,1) forwards;
       }
       .heart-burst svg { width: 70px; height: 70px; filter: drop-shadow(0 0 10px rgba(200,169,110,0.5)); }
       @keyframes heartBurstAnim {
           0%  {opacity:0; transform:translate(-50%,-50%) scale(0.3);}
           30% {opacity:1; transform:translate(-50%,-50%) scale(1.2);}
           55% {transform:translate(-50%,-50%) scale(0.95);}
           80% {opacity:0.85; transform:translate(-50%,-50%) scale(1.05);}
           100%{opacity:0; transform:translate(-50%,-56%) scale(0.85);}
       }

       /* MCQ */
       .mcq-card {
           position: relative; height: 100vh;
           scroll-snap-align: start; scroll-snap-stop: always;
           background: var(--bg-color);
           padding: 8px 18px 100px;
           padding-top: calc(20px + env(safe-area-inset-top));
           display: flex; flex-direction: column; overflow: hidden;
       }
       .mcq-question {
           font-size: var(--font-size-mcq); font-weight: 800; color: var(--text-primary);
           line-height: 1.3; margin-bottom: 14px; flex-shrink: 0;
           padding-right: 50px; letter-spacing: -0.02em;
           font-family: var(--font-article);
       }
       .mcq-media { padding-right: 60px; flex-shrink: 0; margin-bottom: 14px; }
       .mcq-scroll-area {
           flex: 1; overflow-y: auto; padding-right: 60px;
           display: flex; flex-direction: column; gap: 0;
       }
       .mcq-scroll-area::-webkit-scrollbar { width: 2px; }
       .mcq-scroll-area::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
       .mcq-options { display: flex; flex-direction: column; gap: 9px; }
       .mcq-option {
           display: flex; align-items: center; gap: 12px;
           padding: 13px 14px; border-radius: 12px;
           border: 1px solid var(--border-color); background: var(--hover-bg);
           cursor: pointer;
           transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
           text-align: left; font-size: var(--font-size-base); font-weight: 500;
           color: var(--text-primary); line-height: 1.4;
           -webkit-tap-highlight-color: transparent; width: 100%;
       }
       .mcq-option:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 10px var(--accent-glow); }
       .mcq-option .opt-letter {
           width: 26px; height: 26px; border-radius: 50%;
           border: 1.5px solid var(--border-color);
           display: flex; align-items: center; justify-content: center;
           font-size: 10px; font-weight: 800; flex-shrink: 0;
           color: var(--text-secondary); transition: all 0.15s ease;
       }
       .mcq-option .opt-text { flex: 1; }
       .mcq-option:disabled { cursor: default; }
       .mcq-option.selected-correct { border-color: #6abf85; background: rgba(106,191,133,0.08); box-shadow: 0 0 10px rgba(106,191,133,0.12); }
       .mcq-option.selected-correct .opt-letter { background: #6abf85; border-color: #6abf85; color: #0f0e0b; }
       .mcq-option.selected-wrong { border-color: #c46a4e; background: rgba(196,106,78,0.07); }
       .mcq-option.selected-wrong .opt-letter { background: #c46a4e; border-color: #c46a4e; color: #fff; }
       .mcq-option.reveal-correct { border-color: rgba(106,191,133,0.5); }
       .mcq-option.reveal-correct .opt-letter { border-color: #6abf85; color: #6abf85; }
       .mcq-result-msg {
           font-size: 13px; font-weight: 700; margin-top: 14px;
           min-height: 18px; color: var(--text-secondary); flex-shrink: 0;
       }
       .mcq-result-msg.correct { color: #6abf85; }
       .mcq-result-msg.wrong   { color: #c46a4e; }

       /* action buttons */
       .action-buttons {
           position: absolute; right: 14px; bottom: 143px;
           display: flex; flex-direction: column; gap: 20px; z-index: 10;
           filter: drop-shadow(0 4px 16px rgba(0,0,0,0.7));
       }
       .action-btn {
           display: flex; flex-direction: column; align-items: center; gap: 3px;
           background: none; border: none; cursor: pointer; transition: transform 0.1s;
       }
       .action-btn:active { transform: scale(0.88); }
       .action-btn svg { width: 26px; height: 26px; stroke: #fff; fill: none; stroke-width: 2; }
       .action-btn span { color: #fff; font-size: 10px; font-weight: 700; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
       .action-btn.like-btn svg { stroke: #fff; fill: none; transition: fill 0.2s ease, stroke 0.2s ease; }
       .action-btn.like-btn.liked svg { fill: #d4845a; stroke: #d4845a; }
       .action-btn.edit-btn svg { stroke: var(--accent); }

       .media-embed { margin: 10px 0; max-width: 100%; }
       .media-embed img { width: 100%; max-width: 100%; height: auto; border-radius: 10px; display: block; }
       .media-caption { font-size: 12px; color: var(--text-secondary); margin-top: 5px; font-style: italic; }

       .custom-audio-player {
           background: var(--hover-bg); border-radius: 12px; padding: 14px;
           display: flex; align-items: center; gap: 12px; max-width: 100%;
           border: 1px solid var(--border-color);
       }
       .play-btn {
           width: 40px; height: 40px; border-radius: 50%;
           background: var(--accent); border: none; color: #0f0e0b;
           cursor: pointer; display: flex; align-items: center; justify-content: center;
           font-size: 14px; transition: background 0.2s ease; flex-shrink: 0;
       }
       .play-btn:hover { background: var(--accent-hover); }
       .audio-info { flex: 1; min-width: 0; overflow: hidden; }
       .audio-title { font-size: 12px; font-weight: 600; margin-bottom: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-primary); }
       .waveform-container { position: relative; height: 28px; background: var(--bg-color); border-radius: 6px; margin-bottom: 5px; cursor: pointer; overflow: hidden; }
       .waveform-progress { position: absolute; top: 0; left: 0; height: 100%; background: var(--accent); opacity: 0.35; transition: width 0.1s linear; }
       .waveform-bars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: space-around; padding: 0 4px; }
       .waveform-bar { width: 2px; background: var(--text-secondary); border-radius: 2px; opacity: 0.5; }
       .audio-time { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-secondary); }

       .share-toast {
           position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(10px);
           background: #1a1810; border: 1px solid var(--border-color);
           border-radius: 14px; padding: 10px 18px;
           font-size: 13px; font-weight: 700; color: var(--text-primary);
           z-index: 9999; opacity: 0;
           transition: opacity 0.2s ease, transform 0.2s ease;
           pointer-events: none; white-space: nowrap;
           box-shadow: 0 8px 24px rgba(0,0,0,0.5);
       }
       .share-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

       /* ── COMMENTS ── */
       .comments-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 199; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; backdrop-filter: blur(4px); }
       .comments-overlay.active { opacity: 1; pointer-events: all; }
       .comments-popup {
           position: fixed; top: 50%; left: 50%;
           transform: translate(-50%, -50%) scale(0.9);
           width: calc(100% - 40px); max-width: 500px;
           height: 70vh; max-height: 600px;
           background: #141210; border-radius: 20px; z-index: 200;
           opacity: 0; pointer-events: none;
           transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
           display: flex; flex-direction: column;
           box-shadow: 0 24px 80px rgba(0,0,0,0.7), 0 0 0 1px var(--border-color);
       }
       .comments-popup.active { opacity: 1; pointer-events: all; transform: translate(-50%,-50%) scale(1); }
       .comments-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border-color); }
       .comments-header h3 { font-size: 15px; font-weight: 700; }
       .close-comments { background: none; border: none; color: var(--text-primary); font-size: 22px; cursor: pointer; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
       .close-comments:hover { background: var(--hover-bg); }
       .comments-list { flex: 1; overflow-y: auto; padding: 14px 18px; }
       .comments-list::-webkit-scrollbar { width: 3px; }
       .comments-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

       /* comment items */
       .comment-item { display: flex; gap: 10px; margin-bottom: 14px; }
       .comment-avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #8a6430); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #0f0e0b; flex-shrink: 0; overflow: hidden; }
       .comment-avatar img { width: 100%; height: 100%; object-fit: cover; }
       .comment-content { flex: 1; }
       .comment-author { font-weight: 700; font-size: 12px; margin-bottom: 3px; }
       .comment-text { font-size: 13px; line-height: 1.5; margin-bottom: 5px; }
       .comment-meta { display: flex; align-items: center; gap: 10px; }
       .comment-time { font-size: 10px; color: var(--text-secondary); }
       .comment-reply-btn {
           font-size: 10px; font-weight: 700; color: var(--text-secondary);
           background: none; border: none; cursor: pointer; padding: 0;
           transition: color 0.15s ease;
       }
       .comment-reply-btn:hover { color: var(--accent); }
       .comment-pending { opacity: 0.5; }
       .comment-pending .comment-time { color: var(--accent); }
       .comment-spinner {
           width: 10px; height: 10px; border: 1.5px solid var(--border-color);
           border-top-color: var(--accent); border-radius: 50%;
           animation: spin 0.8s linear infinite; display: inline-block;
           vertical-align: middle; margin-right: 3px;
       }

       /* reply thread */
       .comment-replies { margin-top: 8px; padding-left: 14px; border-left: 2px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; }
       .reply-item { display: flex; gap: 8px; }
       .reply-avatar { width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #8a6430); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #0f0e0b; flex-shrink: 0; overflow: hidden; }
       .reply-avatar img { width: 100%; height: 100%; object-fit: cover; }
       .reply-content { flex: 1; }
       .reply-author { font-weight: 700; font-size: 11px; margin-bottom: 2px; }
       .reply-text { font-size: 12px; line-height: 1.5; margin-bottom: 3px; }
       .reply-meta { display: flex; align-items: center; gap: 8px; }
       .reply-time { font-size: 10px; color: var(--text-secondary); }
       .reply-pending { opacity: 0.5; }

       /* inline reply input */
       .reply-input-row {
           display: flex; gap: 7px; align-items: center;
           margin-top: 8px; padding-left: 14px;
       }
       .reply-input {
           flex: 1; background: var(--hover-bg); border: 1px solid var(--border-color);
           border-radius: 16px; padding: 7px 12px; color: var(--text-primary);
           font-size: 13px; outline: none;
           font-family: var(--font-ui);
           transition: border-color 0.15s ease;
       }
       .reply-input:focus { border-color: var(--accent); }
       .reply-send-btn {
           width: 28px; height: 28px; border-radius: 50%;
           background: var(--accent); border: none; color: #0f0e0b;
           cursor: pointer; display: flex; align-items: center; justify-content: center;
           font-size: 11px; flex-shrink: 0;
       }
       .reply-cancel-btn {
           font-size: 10px; font-weight: 700; color: var(--text-secondary);
           background: none; border: none; cursor: pointer; padding: 0 4px;
       }

       .no-comments { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-secondary); gap: 10px; }
       .no-comments i { font-size: 40px; opacity: 0.3; color: var(--accent); }
       .loading-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-primary); gap: 14px; }
       .spinner { width: 40px; height: 40px; border: 3px solid var(--border-color); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
       @keyframes spin { to { transform: rotate(360deg); } }

       .comment-input-wrapper { padding: 10px 18px; border-top: 1px solid var(--border-color); background: #141210; border-radius: 0 0 20px 20px; }
       .comment-input-container { display: flex; gap: 8px; align-items: center; }
       .comment-input {
           flex: 1; background: var(--hover-bg); border: 1px solid var(--border-color);
           border-radius: 20px; padding: 9px 14px; color: var(--text-primary);
           font-size: 16px; outline: none;
           transition: border-color 0.15s ease;
           font-family: var(--font-ui);
       }
       .comment-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
       .send-comment-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); border: none; color: #0f0e0b; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: background 0.2s ease; flex-shrink: 0; }
       .send-comment-btn:hover { background: var(--accent-hover); }
       .send-comment-btn:disabled { opacity: 0.4; cursor: not-allowed; }
       .replying-to-bar {
           font-size: 11px; color: var(--accent); font-weight: 600;
           padding: 6px 0 4px; display: none; align-items: center; gap: 6px;
       }
       .replying-to-bar.visible { display: flex; }
       .replying-to-bar button { background: none; border: none; color: var(--text-secondary); font-size: 13px; cursor: pointer; padding: 0 2px; }

       /* skeletons */
       @keyframes shimmer { 0%,100%{opacity:0.4} 50%{opacity:0.85} }
       .skeleton-base { background: var(--hover-bg); animation: shimmer 1.6s infinite; border-radius: 6px; }
       .skeleton-card { position: relative; height: 100vh; scroll-snap-align: start; scroll-snap-stop: always; background: var(--bg-color); padding: 8px 18px 100px; padding-top: calc(20px + env(safe-area-inset-top)); display: flex; flex-direction: column; }
       .skeleton-header { display: flex; align-items: center; gap: 12px; flex-shrink: 0; margin-bottom: 16px; }
       .skeleton-avatar { width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0; }
       .skeleton-author-block { flex: 1; display: flex; flex-direction: column; gap: 6px; }
       .skeleton-name { height: 13px; width: 110px; }
       .skeleton-date { height: 9px; width: 65px; }
       .skeleton-title { height: 22px; width: 88%; margin-bottom: 8px; border-radius: 6px; }
       .skeleton-title-short { height: 22px; width: 62%; margin-bottom: 12px; border-radius: 6px; }
       .skeleton-stats { display: flex; gap: 12px; margin-bottom: 14px; flex-shrink: 0; }
       .skeleton-stat { height: 12px; width: 48px; }
       .skeleton-line { height: 12px; margin-bottom: 9px; width: 100%; }
       .skeleton-line.w90{width:90%}.skeleton-line.w75{width:75%}.skeleton-line.w80{width:80%}.skeleton-line.w65{width:65%}.skeleton-line.w95{width:95%}

       /* footer */
       .footer-bar {
           position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
           width: 100%; max-width: 450px;
           background: rgba(15,14,11,0.96);
           border-top: 1px solid var(--border-color);
           padding: 8px 24px;
           padding-bottom: calc(8px + env(safe-area-inset-bottom));
           display: flex; justify-content: space-around; align-items: center;
           z-index: 100;
           backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
       }
       .footer-btn {
           display: flex; flex-direction: column; align-items: center; gap: 3px;
           background: none; border: none; color: var(--text-secondary);
           cursor: pointer; transition: color 0.2s ease; padding: 6px 12px;
       }
       .footer-btn:hover { color: var(--text-primary); }
       .footer-btn.active { color: var(--accent); }
       .footer-btn i { font-size: 19px; }
       .footer-btn span { font-size: 10px; font-weight: 600; }

       /* ══ LIBRARY PICKER ══ */
       .library-picker-card {
           position: relative; height: 100vh;
           scroll-snap-align: start; scroll-snap-stop: always;
           background: var(--bg-color);
           display: flex; flex-direction: column; overflow: hidden;
       }

       .lp-hero {
           position: relative; flex-shrink: 0;
           padding: calc(16px + env(safe-area-inset-top)) 18px 14px;
           background: var(--bg-color);
           border-bottom: 1px solid var(--border-color);
       }
       .lp-hero-logo { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
       .lp-hero-logo img { height: 22px; width: auto; }
       .lp-hero-main-title { font-size: 20px; font-weight: 900; color: var(--text-primary); line-height: 1.15; letter-spacing: -0.03em; font-family: var(--font-article); margin-bottom: 3px; }
       .lp-hero-main-title span { color: var(--accent); }
       .lp-hero-sub { font-size: 12px; color: var(--text-secondary); }

       .lp-body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 14px 18px 0; display: flex; flex-direction: column; padding-bottom: 0; }
       .lp-body::-webkit-scrollbar { width: 2px; }
       .lp-body::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

       .lp-id-row { display: flex; gap: 8px; align-items: center; margin-bottom: 5px; }
       .lp-id-input {
           flex: 1; background: var(--hover-bg); border: 1px solid var(--border-color);
           border-radius: 10px; padding: 10px 13px; color: var(--text-primary);
           font-size: 16px; outline: none;
           transition: border-color 0.15s ease, box-shadow 0.15s ease;
           font-family: var(--font-ui); -moz-appearance: textfield;
       }
       .lp-id-input::-webkit-outer-spin-button,.lp-id-input::-webkit-inner-spin-button { -webkit-appearance: none; }
       .lp-id-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
       .lp-id-input::placeholder { color: var(--text-secondary); opacity: 0.6; }
       .lp-id-go-btn { padding: 10px 16px; border-radius: 10px; background: var(--accent); color: #0f0e0b; font-size: 12px; font-weight: 700; border: none; cursor: pointer; white-space: nowrap; flex-shrink: 0; font-family: var(--font-ui); }
       .lp-id-go-btn:disabled { opacity: 0.4; cursor: not-allowed; }
       .lp-id-error { font-size: 11px; color: #c46a4e; min-height: 14px; margin-bottom: 8px; }

       .lp-divider { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
       .lp-divider-line { flex: 1; height: 1px; background: var(--border-color); }
       .lp-divider-text { font-size: 10px; font-weight: 800; color: var(--text-secondary); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }

       .lp-hint { font-size: 11px; color: var(--accent); font-weight: 700; margin-bottom: 8px; }

       .lp-shelf-wrap { overflow: visible; margin-bottom: 10px; padding-top: 10px; }
       .lp-shelf { display: flex; gap: 10px; width: calc(100% + 36px); margin-left: -18px; padding-left: 18px; padding-right: 18px; overflow-x: auto; overflow-y: visible; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }
       .lp-shelf::-webkit-scrollbar { height: 2px; }
       .lp-shelf::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

       .lp-movie-card { flex-shrink: 0; width: 130px; scroll-snap-align: start; cursor: pointer; position: relative; border-radius: 10px; overflow: visible; transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1); }
       .lp-movie-card:hover { transform: translateY(-4px) scale(1.02); z-index: 20; }
       .lp-movie-card.selected { transform: translateY(-4px) scale(1.02); z-index: 20; }
       .lp-movie-card.selected .lp-movie-poster { box-shadow: 0 0 0 2.5px var(--accent), 0 12px 32px var(--accent-glow); border-color: var(--accent); }
       .lp-movie-poster { width: 130px; height: 190px; border-radius: 10px; overflow: hidden; position: relative; background: linear-gradient(135deg, #1e1a10 0%, #0e0c08 100%); border: 1px solid var(--border-color); box-shadow: 0 6px 20px rgba(0,0,0,0.5); transition: box-shadow 0.22s ease, border-color 0.22s ease; }
       .lp-movie-poster img { width: 100%; height: 100%; object-fit: cover; }
       .lp-poster-placeholder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(160deg, #1e1a10 0%, #0e0c08 100%); }
       .lp-poster-letter { font-size: 26px; font-weight: 800; color: rgba(200,169,110,0.2); font-family: var(--font-article); }
       .lp-poster-icon { font-size: 18px; color: rgba(200,169,110,0.15); }
       .lp-movie-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,8,5,0.96) 0%, rgba(10,8,5,0.3) 50%, transparent 75%); display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; }
       .lp-movie-count { display: inline-flex; align-items: center; gap: 3px; background: rgba(200,169,110,0.18); border: 1px solid rgba(200,169,110,0.25); backdrop-filter: blur(6px); border-radius: 5px; padding: 2px 6px; font-size: 9px; font-weight: 700; color: var(--accent); align-self: flex-start; margin-bottom: 4px; }
       .lp-selected-badge { position: absolute; top: 7px; right: 7px; background: var(--accent); border-radius: 50%; width: 20px; height: 20px; display: none; align-items: center; justify-content: center; font-size: 10px; color: #0f0e0b; font-weight: 800; }
       .lp-movie-card.selected .lp-selected-badge { display: flex; }
       .lp-movie-info { padding: 6px 2px 0; }
       .lp-movie-title { font-size: 12px; font-weight: 700; line-height: 1.3; color: var(--text-primary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 3px; transition: color 0.2s ease; }
       .lp-movie-card:hover .lp-movie-title,.lp-movie-card.selected .lp-movie-title { color: var(--accent); }
       .lp-movie-meta { font-size: 10px; color: var(--text-secondary); }

       .lp-section-label { font-size: 10px; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 6px; padding: 4px 0; flex-shrink: 0; margin-bottom: 6px; }
       .lp-section-divider { font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-secondary); opacity: 0.4; padding: 4px 0; margin-top: 6px; margin-bottom: 6px; }
       .lp-loading { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 12px; padding: 20px 0; }

       /* ── PREFERENCES PANEL ── */
       .lp-prefs-toggle {
           display: flex; align-items: center; gap: 6px;
           font-size: 11px; font-weight: 700; color: var(--text-secondary);
           background: none; border: none; cursor: pointer; padding: 6px 0;
           margin-bottom: 4px;
       }
       .lp-prefs-toggle i { font-size: 11px; transition: transform 0.2s ease; }
       .lp-prefs-toggle.open i { transform: rotate(180deg); }

       .lp-prefs-panel {
           display: none; flex-direction: column; gap: 12px;
           padding: 10px 0 4px;
           border-top: 1px solid var(--border-color);
           margin-bottom: 8px;
       }
       .lp-prefs-panel.open { display: flex; }

       .lp-pref-group { display: flex; flex-direction: column; gap: 6px; }
       .lp-pref-label { font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-secondary); }
       .lp-chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
       .lp-chip {
           padding: 5px 12px; border-radius: 20px;
           border: 1px solid var(--border-color);
           background: var(--hover-bg);
           font-size: 11px; font-weight: 700; color: var(--text-secondary);
           cursor: pointer; transition: all 0.15s ease;
       }
       .lp-chip:hover { border-color: var(--accent); color: var(--accent); }
       .lp-chip.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
       .lp-toggle-row { display: flex; align-items: center; justify-content: space-between; }
       .lp-toggle-row span { font-size: 12px; color: var(--text-primary); font-weight: 500; }
       .lp-toggle {
           position: relative; width: 36px; height: 20px;
           background: var(--border-color); border-radius: 20px; cursor: pointer;
           transition: background 0.2s ease; flex-shrink: 0;
       }
       .lp-toggle.on { background: var(--accent); }
       .lp-toggle::after { content:''; position:absolute; left:3px; top:3px; width:14px; height:14px; border-radius:50%; background:#fff; transition: transform 0.2s ease; }
       .lp-toggle.on::after { transform: translateX(16px); }

       .lp-actions-fixed {
           flex-shrink: 0; background: var(--bg-color);
           padding: 12px 18px;
           padding-bottom: calc(20px + env(safe-area-inset-bottom) + 72px);
           border-top: 1px solid var(--border-color);
           display: flex; flex-direction: column; gap: 8px;
       }
       .lp-start-btn {
           width: 100%; padding: 14px; border-radius: 12px;
           background: var(--accent); color: #0f0e0b;
           font-size: 14px; font-weight: 800; border: none; cursor: pointer;
           transition: background 0.15s ease, opacity 0.15s ease, transform 0.1s ease;
           font-family: var(--font-ui);
           box-shadow: 0 4px 20px var(--accent-glow);
       }
       .lp-start-btn:hover:not(:disabled) { background: var(--accent-hover); }
       .lp-start-btn:active:not(:disabled) { transform: scale(0.98); }
       .lp-start-btn:disabled { opacity: 0.3; cursor: not-allowed; }
       .lp-scroll-hint { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 11px; color: var(--text-secondary); font-weight: 500; }
       .lp-scroll-hint i { font-size: 10px; opacity: 0.5; }

       @keyframes lp-btn-launch {
           0%{transform:scale(1);opacity:1} 30%{transform:scale(1.03);opacity:1} 60%{transform:scale(0.97);opacity:0.85} 100%{transform:scale(1);opacity:1}
       }
       .lp-start-btn.launching { animation: lp-btn-launch 0.45s ease forwards; background: var(--accent-hover); }

       @keyframes lp-card-exit {
           0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-24px) scale(0.97)}
       }
       .library-picker-card.exiting { animation: lp-card-exit 0.35s cubic-bezier(0.4,0,0.2,1) forwards; pointer-events: none; }

       /* term popups */
       .term-link { color: var(--accent); border-bottom: 1px dashed rgba(200,169,110,0.45); cursor: pointer; font-weight: 600; transition: opacity 0.15s ease; -webkit-tap-highlight-color: transparent; }
       .term-link:hover { opacity: 0.75; }
       .term-popup-overlay { display: none; }
       .term-popup { position: fixed; width: 270px; max-width: calc(100vw - 24px); background: #141210; border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 14px 10px; z-index: 301; opacity: 0; pointer-events: none; transition: opacity 0.18s ease, transform 0.18s ease; transform: translateY(4px); box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
       .term-popup.active { opacity: 1; pointer-events: all; transform: translateY(0); }
       .term-popup-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
       .term-popup-term { font-size: 12px; font-weight: 900; color: var(--accent); flex: 1; margin-right: 8px; }
       .term-popup-close { width: 20px; height: 20px; border-radius: 50%; background: var(--hover-bg); border: none; color: var(--text-secondary); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
       .term-popup-divider { height: 1px; background: var(--border-color); margin-bottom: 9px; }
       .term-popup-body { font-size: 12px; line-height: 1.6; color: var(--text-secondary); }

       #confettiCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9998; }

       /* ══ EMOJI STYLES — revised ══
          Philosophy: color classes apply a literal color match to the emoji's meaning.
          Animation classes are subtle — no exaggerated scaling or glow explosions.
          Gradient text is reserved for fire/rainbow/diamond — genuinely warrants it.
       */

       /* ── Semantic color classes ── */
       .emo-yellow  { color: #e8c858; }
       .emo-red     { color: #c96a58; }
       .emo-green   { color: #6abf85; }
       .emo-blue    { color: #6a9fcf; }
       .emo-purple  { color: #9b7fe8; }
       .emo-dark    { color: #c8c0b8; background: rgba(0,0,0,0.55); padding: 0.06em 0.3em; border-radius: 3px; }
       .emo-ice     { color: #a0c4d8; }

       /* ── Structural / semantic text classes ── */
       .emo-magnify { font-weight: 700; font-size: 1.05em; }
       .emo-pinned  { border-left: 2px solid var(--accent); padding-left: 0.45em; background: linear-gradient(to right, var(--accent-soft), transparent); border-radius: 0 3px 3px 0; }
       .emo-book    { font-family: var(--font-article); background: rgba(200,169,110,0.07); color: #d4b88a; padding: 0.06em 0.3em; border-radius: 4px; border: 1px solid rgba(200,169,110,0.15); font-size: 0.94em; }
       .emo-brain   { font-style: italic; color: var(--accent); }
       .emo-temple  { font-family: var(--font-article); color: #c4b090; letter-spacing: 0.04em; }
       .emo-science { font-family: 'Courier New', monospace; color: #b0a878; font-size: 0.9em; }
       .emo-micro   { font-family: 'Courier New', monospace; color: #c8a96e; font-size: 0.88em; }
       .emo-robot   { font-family: 'Courier New', monospace; color: #b0a08a; font-size: 0.88em; }
       .emo-idea    { color: #d4a96e; background: linear-gradient(to right, var(--accent-soft), rgba(200,169,110,0.03)); padding: 0.06em 0.3em; border-radius: 3px; }
       .emo-urgent  { font-weight: 700; color: #e0b840; border: 1px solid rgba(224,184,64,0.3); padding: 0.06em 0.3em; border-radius: 4px; }
       .emo-warning { color: #c8a040; border: 1px solid rgba(200,160,64,0.3); padding: 0.06em 0.38em; border-radius: 4px; font-weight: 600; }
       .emo-check   { color: #6abf85; font-weight: 700; }
       .emo-cross   { color: #c46a4e; text-decoration: line-through; text-decoration-color: rgba(196,106,78,0.5); }
       .emo-lock    { color: #7a7268; background: rgba(42,37,24,0.7); padding: 0.06em 0.35em; border-radius: 4px; border: 1px solid var(--border-color); font-weight: 600; }
       .emo-unlock  { color: var(--accent); background: var(--accent-soft); padding: 0.06em 0.35em; border-radius: 4px; }
       .emo-hourglass { color: var(--accent); }
       .emo-puzzle  { border: 1px dashed rgba(200,169,110,0.3); padding: 0.06em 0.35em; border-radius: 4px; color: #c8a96e; }
       .emo-tag     { background: var(--accent-soft); border: 1px solid rgba(200,169,110,0.2); color: #c8a96e; padding: 0.04em 0.5em; border-radius: 20px; font-size: 0.88em; }
       .emo-target  { font-weight: 700; color: var(--accent); }
       .emo-cool    { background: rgba(10,8,4,0.85); color: var(--accent); padding: 0.06em 0.35em; border-radius: 4px; border: 1px solid rgba(200,169,110,0.18); }

<script>
(function(){
   const canvas=document.getElementById('confettiCanvas'),ctx=canvas.getContext('2d');
   let particles=[],animFrame=null;
   function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
   window.addEventListener('resize',resize);resize();
   const COLORS=['#c8a96e','#e8d8a0','#a07840','#d4b86a','#7ab88a','#c97a5a','#8aa0c0','#f0e8d8'];
   function spawnParticles(x,y){
       for(let i=0;i<60;i++){const angle=Math.random()*Math.PI*2,speed=Math.random()*5+2;particles.push({x:x??canvas.width/2,y:y??canvas.height*0.4,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-2.5,size:Math.random()*5+2.5,color:COLORS[Math.floor(Math.random()*COLORS.length)],alpha:1,rotation:Math.random()*Math.PI*2,rotSpeed:(Math.random()-0.5)*0.15,shape:Math.random()>0.5?'rect':'circle'});}
       if(!animFrame)animate();
   }
   function animate(){
       ctx.clearRect(0,0,canvas.width,canvas.height);
       particles=particles.filter(p=>p.alpha>0.01);
       particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.vx*=0.99;p.alpha-=0.016;p.rotation+=p.rotSpeed;ctx.save();ctx.globalAlpha=Math.max(0,p.alpha);ctx.translate(p.x,p.y);ctx.rotate(p.rotation);ctx.fillStyle=p.color;if(p.shape==='rect'){ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);}else{ctx.beginPath();ctx.arc(0,0,p.size/2,0,Math.PI*2);ctx.fill();}ctx.restore();});
       if(particles.length>0){animFrame=requestAnimationFrame(animate);}else{animFrame=null;ctx.clearRect(0,0,canvas.width,canvas.height);}
   }
   window.launchConfetti=function(targetEl){if(targetEl){const r=targetEl.getBoundingClientRect();spawnParticles(r.left+r.width/2,r.top+r.height/2);}else{spawnParticles();}};
})();
</script>

window._termPopupOutside=null;
window.openTermPopup=function(term,explanation,event){
   const popup=document.getElementById('termPopup');
   document.getElementById('termPopupTerm').textContent=term;
   document.getElementById('termPopupBody').innerHTML=explanation;
   const POPUP_W=270,POPUP_H=150,MARGIN=8,vw=window.innerWidth,vh=window.innerHeight;
   let anchorX=event?event.clientX:vw/2,anchorY=event?event.clientY:vh/2;
   let left=anchorX-POPUP_W/2,top=anchorY+14;
   left=Math.max(MARGIN,Math.min(left,vw-POPUP_W-MARGIN));

   popup.style.left=left+'px';popup.style.top=top+'px';
   popup.classList.add('active');
   if(window._termPopupOutside)document.removeEventListener('click',window._termPopupOutside);
   setTimeout(()=>{window._termPopupOutside=function(e){if(!popup.contains(e.target)&&!e.target.classList.contains('term-link'))closeTermPopup();};document.addEventListener('click',window._termPopupOutside,{once:true});},10);

<script>
const EMOJI_MAP={
   '🔍':'emo-magnify','❗':'emo-urgent','📌':'emo-pinned','🔥':'emo-fire','💎':'emo-diamond',
   '🟡':'emo-yellow','🔵':'emo-blue','🟢':'emo-green','🟣':'emo-purple','🔴':'emo-red',
   '⚫':'emo-dark','🧠':'emo-brain','📖':'emo-book','💡':'emo-idea','🎯':'emo-target',
   '🧩':'emo-puzzle','🏷️':'emo-tag','🔬':'emo-micro','⚠️':'emo-warning','✅':'emo-check',
   '❌':'emo-cross','⏳':'emo-hourglass','🔒':'emo-lock','🔓':'emo-unlock','⚡':'emo-lightning',
   '🌊':'emo-wave','🌀':'emo-spin','💫':'emo-float','🚀':'emo-rocket','🎬':'emo-cinematic',
   '🌟':'emo-star','✨':'emo-sparkle','🌈':'emo-rainbow','👑':'emo-crown','🪄':'emo-magic',
   '❤️':'emo-heart','😄':'emo-happy','😌':'emo-calm','😮':'emo-surprised','😎':'emo-cool',
   '🤖':'emo-robot','🧪':'emo-science','🏛️':'emo-temple','🌍':'emo-earth','💰':'emo-money',
   '⚖️':'emo-balance','📡':'emo-signal','🎵':'emo-music','🧊':'emo-ice','🔊':'emo-sound',
};
function buildEmojiPattern(){const keys=Object.keys(EMOJI_MAP).sort((a,b)=>b.length-a.length);const escaped=keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');return new RegExp(`(${escaped})([\\s\\S]*?)\\1`,'gu');}
function escHtmlET(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderTerms(html){return html.replace(/([A-Za-z][A-Za-z0-9\-']{0,60}?)&lt;([^&]{1,600}?)&gt;/g,function(match,term,explanation){const safeTerm=term.trim().replace(/'/g,'&#39;');const safeExp=explanation.replace(/'/g,'&#39;');return `<span class="term-link" onclick="openTermPopup('${safeTerm}','${safeExp}',event)">${term.trim()}</span>`;});}
function renderEmojiText(text,applyTerms=true){const re=buildEmojiPattern();let result='',lastIndex=0,match;while((match=re.exec(text))!==null){result+=escHtmlET(text.slice(lastIndex,match.index));const cls=EMOJI_MAP[match[1]];result+=`<span class="${cls}">${renderEmojiText(match[2],false)}</span>`;lastIndex=re.lastIndex;}result+=escHtmlET(text.slice(lastIndex));return applyTerms?renderTerms(result):result;}
</script>

<script>
window._getImageDominantColor = function(imgEl, callback) {
   try {
       const canvas = document.createElement('canvas');
       const SIZE = 50; canvas.width = SIZE; canvas.height = SIZE;
       const ctx = canvas.getContext('2d');
       ctx.drawImage(imgEl, 0, 0, SIZE, SIZE);
       const data = ctx.getImageData(0, 0, SIZE, SIZE).data;
       let r=0,g=0,b=0,cnt=0;
       for(let i=0;i<data.length;i+=4){const a=data[i+3];if(a<128)continue;r+=data[i];g+=data[i+1];b+=data[i+2];cnt++;}
       if(!cnt){callback(null);return;}
       r=Math.round(r/cnt);g=Math.round(g/cnt);b=Math.round(b/cnt);
       const boost=1.5;r=Math.min(255,Math.round(r*boost));g=Math.min(255,Math.round(g*boost));b=Math.min(255,Math.round(b*boost));
       callback(`rgb(${r},${g},${b})`);
   } catch(e){ callback(null); }
};
</script>

   catch(err){if(wasFollowing)userFollowing.add(supaUid);else userFollowing.delete(supaUid);updateFollowButtons();}
   finally{btn.dataset.processing='false';}
};

function applyPrefs(){
   const theme    = localStorage.getItem('pref_theme')    || 'theme-dark';
   const fontFam  = localStorage.getItem('pref_fontfam')  || 'font-serif';
   const fontSize = localStorage.getItem('pref_fontsize') || 'fontsize-md';
   const noEmoji  = localStorage.getItem('pref_noEmoji')  === '1';
   const allThemes=['theme-dark','theme-midnight','theme-slate','theme-sepia','theme-light','theme-forest'];
   const allFonts=['font-serif','font-modern','font-slab'];
   const allSizes=['fontsize-sm','fontsize-md','fontsize-lg','fontsize-xl'];
   allThemes.forEach(c=>document.body.classList.remove(c));
   allFonts.forEach(c=>document.body.classList.remove(c));
   allSizes.forEach(c=>document.body.classList.remove(c));

   document.body.classList.add(theme,fontFam,fontSize);
   if(noEmoji) document.body.classList.add('no-emoji-effects');
}

async function initLibraryPicker(){
   if(anchorArticleId!==null){window._pickerHandledLoad=true;injectInitialSkeletons(3);loadArticles(true);return;}
   if(window._urlPlaylistId){
       window._pickerHandledLoad=true;injectInitialSkeletons(3);
       try{const {data:items}=await supabase.from('playlist_items').select('article_id').eq('playlist_id',window._urlPlaylistId);const articleIds=[...new Set((items||[]).map(r=>r.article_id))];filteredArticleIds=articleIds.length>0?articleIds:null;}catch(e){filteredArticleIds=null;}
       loadArticles(true);return;
   }

   const wrapper=document.getElementById('postsWrapper');
   const pickerCard=buildPickerCard();
   wrapper.insertBefore(pickerCard,wrapper.firstChild);
   window._pickerHandledLoad=true;

   injectInitialSkeletons(3);
   loadArticles(true);

   requestAnimationFrame(()=>{
       const firstSkeleton=wrapper.querySelector('.skeleton-card');
       if(firstSkeleton)wrapper.scrollTop=firstSkeleton.offsetTop;
   });

   initPrefsUI();

   const grid=document.getElementById('lpGrid'),startBtn=document.getElementById('lpStartBtn');
   const hint=document.getElementById('lpCountHint'),idInput=document.getElementById('lpIdInput');
   const idGoBtn=document.getElementById('lpIdGoBtn'),idError=document.getElementById('lpIdError');
   const selected=new Set();

   async function handleIdSearch(){
       const val=idInput.value.trim();if(!val){idError.textContent='Please enter an article ID.';return;}
       const id=parseInt(val);if(isNaN(id)||id<1){idError.textContent='Please enter a valid positive ID.';return;}
       idGoBtn.disabled=true;idGoBtn.textContent='…';idError.textContent='';
       try{
           const {data:art,error}=await supabase.from('articles').select('id').eq('id',id).single();
           if(error||!art){
               swapPickerForSkeleton();anchorArticleId=null;articles=[];offset=0;hasMore=true;isLoading=false;
               document.getElementById('postsWrapper').querySelectorAll('.article-card,.mcq-card').forEach(c=>c.remove());
               const errToast=document.createElement('div');errToast.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#c46a4e;color:#fff;padding:9px 18px;border-radius:10px;font-size:13px;font-weight:700;z-index:9999;';
               errToast.textContent=`No article found with ID ${id}.`;document.body.appendChild(errToast);setTimeout(()=>errToast.remove(),3000);
               loadArticles(true);return;
           }
           animatePickerOut(()=>{anchorArticleId=id;filteredArticleIds=null;articles=[];offset=0;hasMore=true;isLoading=false;document.getElementById('postsWrapper').querySelectorAll('.article-card,.mcq-card').forEach(c=>c.remove());loadArticles(true);});
       }catch(e){swapPickerForSkeleton();articles=[];offset=0;hasMore=true;isLoading=false;loadArticles(true);}
   }
   idGoBtn.addEventListener('click',handleIdSearch);
   idInput.addEventListener('keypress',e=>{if(e.key==='Enter')handleIdSearch();});

   try{
       const {data:libs,error}=await supabase.from('playlists').select('id,name,description,thumbnail_url').order('name',{ascending:true});
       if(error||!libs||libs.length===0){grid.innerHTML='';return;}
       const {data:countRows}=await supabase.from('playlist_items').select('playlist_id');
       const countMap={};(countRows||[]).forEach(r=>{countMap[r.playlist_id]=(countMap[r.playlist_id]||0)+1;});
       const filteredLibs=libs.filter(lib=>(countMap[lib.id]||0)>0);
       const favedLibs=filteredLibs.filter(l=>userFavLibs.has(String(l.id))).sort((a,b)=>(countMap[b.id]||0)-(countMap[a.id]||0));
       const otherLibs=filteredLibs.filter(l=>!userFavLibs.has(String(l.id))).sort((a,b)=>(countMap[b.id]||0)-(countMap[a.id]||0));
       if(filteredLibs.length===0){grid.innerHTML='';return;}
       grid.innerHTML='';

       function renderMovieItem(lib,isFaved){
           const count=countMap[lib.id]||0;
           const firstLetter=(lib.name||'?')[0].toUpperCase();
           const posterContent=lib.thumbnail_url
               ?`<img src="${lib.thumbnail_url}" alt="${lib.name||''}" loading="lazy">`
               :`<div class="lp-poster-placeholder"><div class="lp-poster-letter">${firstLetter}</div><div class="lp-poster-icon"><i class="fas fa-book-open"></i></div></div>`;
           const card=document.createElement('div');
           card.className='lp-movie-card';card.dataset.id=lib.id;
           card.innerHTML=`
               <div class="lp-movie-poster">${posterContent}
                   <div class="lp-movie-overlay"><div class="lp-movie-count"><i class="fas fa-layer-group"></i> ${count}</div></div>
                   <div class="lp-selected-badge">✓</div>
               </div>
               <div class="lp-movie-info">
                   <div class="lp-movie-title">${lib.name||'Untitled'}</div>
                   <div class="lp-movie-meta">${isFaved?'❤️ Saved':''}</div>
               </div>`;
           card.addEventListener('click',()=>{
               const id=String(lib.id);
               if(selected.has(id)){selected.delete(id);card.classList.remove('selected');}
               else{if(selected.size>=5)return;selected.add(id);card.classList.add('selected');}
               const n=selected.size;hint.textContent=`${n} / 5 selected`;startBtn.disabled=n===0;
               grid.querySelectorAll('.lp-movie-card').forEach(el=>{
                   if(!el.classList.contains('selected')){el.style.opacity=n>=5?'0.35':'1';el.style.pointerEvents=n>=5?'none':'';}
                   else{el.style.opacity='1';el.style.pointerEvents='';}
               });
           });
           return card;
       }

       function makeShelfSection(label,libs,isFaved,isSubLabel){
           const wrap=document.createElement('div');
           const lbl=document.createElement('div');
           lbl.className=isSubLabel?'lp-section-divider':'lp-section-label';
           lbl.innerHTML=isSubLabel?label:`<i class="fas fa-heart"></i> ${label}`;
           wrap.appendChild(lbl);
           const shelfWrap=document.createElement('div');shelfWrap.className='lp-shelf-wrap';
           const shelf=document.createElement('div');shelf.className='lp-shelf';
           libs.forEach(lib=>shelf.appendChild(renderMovieItem(lib,isFaved)));
           shelfWrap.appendChild(shelf);wrap.appendChild(shelfWrap);
           return wrap;
       }

       if(favedLibs.length>0)grid.appendChild(makeShelfSection('Your Saved Libraries',favedLibs,true,false));
       if(otherLibs.length>0)grid.appendChild(makeShelfSection(favedLibs.length>0?'All Libraries':'Libraries',otherLibs,false,favedLibs.length>0));

       startBtn.addEventListener('click',async()=>{
           startBtn.disabled=true;startBtn.textContent='Loading…';
           animatePickerOut(async()=>{
               const playlistIds=[...selected].map(Number);
               const {data:items}=await supabase.from('playlist_items').select('article_id').in('playlist_id',playlistIds);
               const articleIds=[...new Set((items||[]).map(r=>r.article_id))];
               filteredArticleIds=articleIds.length>0?articleIds:null;
               articles=[];offset=0;hasMore=true;isLoading=false;
               document.getElementById('postsWrapper').querySelectorAll('.article-card,.mcq-card').forEach(c=>c.remove());
               loadArticles(true);
           });
       });
   }catch(e){console.error('Library picker error:',e);grid.innerHTML='';}
}

function isMCQ(content){return typeof content==='string'&&content.trimStart().startsWith('❔');}
function parseMCQ(content){
   const lines=content.trim().split('\n').map(l=>l.trim()).filter(Boolean);
   const questionLine=lines[0].replace(/^❔/,'').trim();
   const options=lines.slice(1).map(line=>{const correct=line.startsWith('✅');return{label:line.replace(/^✅/,'').trim(),correct};});
   for(let i=options.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[options[i],options[j]]=[options[j],options[i]];}
   return{question:questionLine,options};
}

function createMediaElement(m, forArticleContent=false){
   const d=document.createElement('div');
   if(m.type==='image'){
       if(forArticleContent){
           d.className='article-full-img-wrap';
           d.innerHTML=`<img src="${m.url}" alt="${m.caption||''}" crossorigin="anonymous">${m.caption?`<div class="media-caption">${m.caption}</div>`:''}`;
       }else{
           d.className='media-embed';
           d.innerHTML=`<img src="${m.url}" alt="${m.caption||''}">${m.caption?`<div class="media-caption">${m.caption}</div>`:''}`;
       }
   }else if(m.type==='audio'){
       d.className='media-embed';
       const aid='audio-'+Math.random().toString(36).substr(2,9);
       const bars=Array(15).fill(0).map(()=>`<div class="waveform-bar" style="height:${Math.random()*60+20}%"></div>`).join('');
       d.innerHTML=`<div class="custom-audio-player"><button class="play-btn" onclick="toggleAudio(this,'${aid}')"><i class="fas fa-play"></i></button><div class="audio-info"><div class="audio-title">${m.caption||'Audio'}</div><div class="waveform-container" onclick="seekAudio(event,this,'${aid}')"><div class="waveform-progress"></div><div class="waveform-bars">${bars}</div></div><div class="audio-time"><span class="current-time">0:00</span><span class="duration">0:00</span></div></div><audio id="${aid}" src="${m.url}" style="display:none;"></audio></div>`;
       setTimeout(()=>{const audio=document.getElementById(aid);if(audio)audio.addEventListener('loadedmetadata',()=>{const dur=Math.floor(audio.duration);const dEl=audio.closest('.custom-audio-player')?.querySelector('.duration');if(dEl)dEl.textContent=`${Math.floor(dur/60)}:${(dur%60).toString().padStart(2,'0')}`;});},100);
   }else if(m.type==='pdf'){
       d.className='media-embed';
       d.innerHTML=`<div style="background:var(--hover-bg);border:1px solid var(--border-color);border-radius:12px;overflow:hidden;"><div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border-color);"><i class="fas fa-file-pdf" style="color:#c97a5a;font-size:16px;flex-shrink:0;"></i><span style="font-size:12px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-primary);">${m.caption||'Document'}</span><a href="${m.url}" target="_blank" rel="noopener" style="font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px solid rgba(200,169,110,0.25);border-radius:7px;padding:3px 9px;text-decoration:none;white-space:nowrap;flex-shrink:0;">Open PDF</a></div><iframe src="${m.url}" style="width:100%;height:200px;border:none;display:block;"></iframe></div>`;
   }else if(m.type==='youtube'){
       // Pure video embed — no header bar
       if(forArticleContent){
           d.className='article-full-yt-wrap';
           d.innerHTML=`<iframe src="${m.url}" title="${m.caption||'Video'}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>`;
       }else{
           d.className='media-embed';
           d.style.cssText='border-radius:10px;overflow:hidden;background:#000;';
           d.innerHTML=`<iframe src="${m.url}" title="${m.caption||'Video'}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen style="width:100%;aspect-ratio:16/9;border:none;display:block;"></iframe>`;
       }
   }
   return d;
}

   const showFollow=authorSupaId&&!isOwnArticle;
   const followBtnHTML=showFollow?`

               <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
               <span>Share</span>

       </div>`;
   if(article.media&&article.media.length>0){const mc=card.querySelector(`#mcq-media-${article.id}`);article.media.forEach(m=>mc.appendChild(createMediaElement(m,false)));}
   const optsContainer=card.querySelector(`#mcq-opts-${article.id}`),msgEl=card.querySelector(`#mcq-msg-${article.id}`);
   let answered=false;
   options.forEach((opt,i)=>{
       const btn=document.createElement('button');btn.className='mcq-option';
       btn.innerHTML=`<span class="opt-letter">${letters[i]||i+1}</span><span class="opt-text">${renderEmojiText(opt.label)}</span>`;

           else{btn.classList.add('selected-wrong');msgEl.className='mcq-result-msg wrong';const correctIdx=options.findIndex(o=>o.correct);if(correctIdx!==-1){optsContainer.querySelectorAll('.mcq-option')[correctIdx].classList.add('reveal-correct');msgEl.textContent=`✗ The answer was: ${options[correctIdx].label}`;}else msgEl.textContent='✗ Incorrect';}
       });
       optsContainer.appendChild(btn);
   });
   setupDoubleTap(card,article.id);return card;
}

function formatNumber(num){if(num>=1000000)return (num/1000000).toFixed(1)+'M';if(num>=1000)return (num/1000).toFixed(1)+'K';return (num||0).toString();}
function formatDate(date){const now=new Date(),ms=now-date,mins=Math.floor(ms/60000),hrs=Math.floor(ms/3600000),days=Math.floor(ms/86400000);if(mins<60)return `${mins}m ago`;if(hrs<24)return `${hrs}h ago`;if(days<7)return `${days}d ago`;return date.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function getAvatarContent(article){if(article.authorPfp)return `<img src="${article.authorPfp}" alt="${article.author}">`;let letter='A';if(article.authorUsername){letter=article.authorUsername.charAt(0).toUpperCase();}else if(article.author){const atIdx=article.author.indexOf('@');letter=atIdx!==-1&&article.author.length>atIdx+1?article.author.charAt(atIdx+1).toUpperCase():article.author.charAt(0).toUpperCase();}return letter;}

function applyLikeColorFromCard(card, likeBtn){

   const apply=()=>{window._getImageDominantColor(imgEl,color=>{if(color){likeBtn.querySelector('svg').style.fill=color;likeBtn.querySelector('svg').style.stroke=color;}});};

async function handleLike(e){
   const btn=e.currentTarget,id=String(btn.dataset.id),countSpan=btn.querySelector('.like-count');
   if(!currentUser){alert('Please log in to like articles');window.location.href='https://patholytica.com/login';return;}
   if(btn.dataset.processing==='true')return;btn.dataset.processing='true';
   const wasLiked=userLikes.has(id);
   const artIdx=articles.findIndex(a=>String(a.id)===id);
   const prevRealCount=artIdx!==-1?(articles[artIdx].likes||0):0;
   const newCount=wasLiked?Math.max(0,prevRealCount-1):prevRealCount+1;
   if(wasLiked){userLikes.delete(id);btn.classList.remove('liked');btn.querySelector('svg').style.fill='';btn.querySelector('svg').style.stroke='';}
   else{userLikes.add(id);btn.classList.add('liked');const card=btn.closest('.article-card,.mcq-card');if(card)applyLikeColorFromCard(card,btn);}
   countSpan.textContent=formatNumber(newCount);
   const card=btn.closest('.article-card,.mcq-card');if(card){const s=card.querySelector('.stat-item.likes span');if(s)s.textContent=formatNumber(newCount);}
   if(artIdx!==-1)articles[artIdx].likes=newCount;
   try{
       if(wasLiked){await supabase.from('likes').delete().eq('article_id',parseInt(id)).eq('user_id',currentUser.user_id);const {error:rpcErr}=await supabase.rpc('decrement_likes',{article_id:parseInt(id)});if(rpcErr){const {data:fresh}=await supabase.from('articles').select('likes').eq('id',id).single();await supabase.from('articles').update({likes:Math.max(0,(fresh?.likes||1)-1)}).eq('id',id);}}
       else{const {error:insErr}=await supabase.from('likes').insert([{article_id:parseInt(id),user_id:currentUser.user_id}]);if(insErr&&insErr.code!=='23505')throw insErr;const {error:rpcErr}=await supabase.rpc('increment_likes',{article_id:parseInt(id)});if(rpcErr){const {data:fresh}=await supabase.from('articles').select('likes').eq('id',id).single();await supabase.from('articles').update({likes:(fresh?.likes||0)+1}).eq('id',id);}}
   }catch(err){
       if(wasLiked){userLikes.add(id);btn.classList.add('liked');}else{userLikes.delete(id);btn.classList.remove('liked');btn.querySelector('svg').style.fill='';btn.querySelector('svg').style.stroke='';}
       countSpan.textContent=formatNumber(prevRealCount);
       const card=btn.closest('.article-card,.mcq-card');if(card){const s=card.querySelector('.stat-item.likes span');if(s)s.textContent=formatNumber(prevRealCount);}
       if(artIdx!==-1)articles[artIdx].likes=prevRealCount;
   }finally{btn.dataset.processing='false';}
}

async function loadArticles(isInitial=true){
   if(isLoading||(!isInitial&&!hasMore))return;isLoading=true;
   try{
       if(isInitial&&anchorArticleId!==null){
           const {data:anchorArt,error:anchorErr}=await supabase.from('articles').select('*').eq('id',anchorArticleId).single();

           else{const {data:rest}=await supabase.from('articles').select('*').order('created_at',{ascending:false}).lt('created_at',anchorArt.created_at).limit(LIMIT-1);const combined=[anchorArt,...(rest||[])];await enrichAndRender(combined,isInitial);offset=LIMIT;isLoading=false;return;}
       }
       let query=supabase.from('articles').select('*').order('created_at',{ascending:false}).range(offset,offset+LIMIT-1);
       if(filteredArticleIds!==null){
           if(filteredArticleIds.length===0){const wrapper=document.getElementById('postsWrapper');wrapper.querySelectorAll('.skeleton-card').forEach(s=>s.remove());wrapper.innerHTML+=`<div class="loading-container" style="height:100vh;scroll-snap-align:start;"><i class="fas fa-inbox" style="font-size:40px;color:var(--accent);opacity:0.4;"></i><div>No articles in selected libraries</div></div>`;isLoading=false;return;}

       if(articlesData.length<LIMIT)hasMore=false;offset+=articlesData.length;
       await enrichAndRender(articlesData,isInitial);isLoading=false;
   }catch(e){console.error('Error loading articles:',e);if(isInitial){const wrapper=document.getElementById('postsWrapper');wrapper.querySelectorAll('.skeleton-card').forEach(s=>s.remove());wrapper.innerHTML+=`<div class="loading-container" style="height:100vh;scroll-snap-align:start;"><i class="fas fa-exclamation-triangle" style="font-size:40px;color:var(--accent);opacity:0.4;"></i><div>Failed to load articles</div></div>`;}isLoading=false;}

async function enrichAndRender(articlesData, isInitial){
   const userIds=[...new Set(articlesData.map(a=>a.firebase_user_id).filter(Boolean))];
   let usersData=[];
   if(userIds.length>0){const {data:users}=await supabase.from('users').select('firebase_uid, username, full_name, pfp, user_id').in('firebase_uid',userIds);usersData=users||[];usersData.forEach(u=>{if(u.firebase_uid&&u.user_id){supaUserIdToFirebaseUid[u.user_id]=u.firebase_uid;firebaseUidToSupaUserId[u.firebase_uid]=u.user_id;}});}
   const articleIds=articlesData.map(a=>a.id);
   const {data:mediaData}=await supabase.from('media').select('*').in('article_id',articleIds).order('display_order',{ascending:true});
   const newArticles=articlesData.map(article=>{
       const user=usersData.find(u=>u.firebase_uid===article.firebase_user_id);
       return{...article,author:user?.username?`@${user.username}`:(user?.full_name||'Anonymous'),authorPfp:user?.pfp||null,authorUsername:user?.username||null,authorSupaUserId:user?.user_id||null,media:(mediaData||[]).filter(m=>m.article_id===article.id)};
   });
   articles=[...articles,...newArticles];
   renderArticles(isInitial);
}

function renderArticles(isInitial=true){
   const wrapper=document.getElementById('postsWrapper');
   if(isInitial){wrapper.querySelectorAll('.skeleton-card').forEach(s=>s.remove());wrapper.querySelectorAll('.article-card,.mcq-card').forEach(c=>c.remove());}
   else{const last=wrapper.lastElementChild;if(last&&last.classList.contains('skeleton-card'))last.remove();}
   const startIndex=isInitial?0:articles.length-LIMIT;

   for(let index=startIndex;index<articles.length;index++){
       const article=articles[index];
       if(isMCQ(article.content)){
           wrapper.appendChild(buildMCQCard(article,index));
       }else{
           const articleDiv=document.createElement('div');
           articleDiv.className='article-card';
           articleDiv.dataset.index=index;
           articleDiv.dataset.articleId=article.id;

           const hasImages=article.media&&article.media.some(m=>m.type==='image');
           if(hasImages)articleDiv.classList.add('has-image');

           const contentDiv=document.createElement('div');
           contentDiv.className='article-content';

           const paragraphs=(article.content||'No content available').split('\n\n');
           let firstTextEmitted=false;

           paragraphs.forEach((paragraph,pIndex)=>{
               if(!paragraph.trim())return;
               const p=document.createElement('div');p.className='content-paragraph';
               p.innerHTML=renderEmojiText(paragraph.trim());

               // Only allow media to appear before the first text paragraph if it's NOT an image/yt
               // (i.e., media that isn't rich visual gets injected in normal order)
               const associatedMedia=(article.media||[]).filter(m=>m.display_order===pIndex);

               if(!firstTextEmitted){
                   // Defer any image/yt media that would appear before the first text block
                   contentDiv.appendChild(p);
                   firstTextEmitted=true;
                   // Now emit the associated media for this paragraph (after text is safely first)
                   associatedMedia.filter(m=>m.type==='image'||m.type==='youtube').forEach(m=>contentDiv.appendChild(createMediaElement(m,true)));
               }else{
                   // Emit media that belongs before this paragraph
                   associatedMedia.filter(m=>m.type==='image'||m.type==='youtube').forEach(m=>contentDiv.appendChild(createMediaElement(m,true)));
                   contentDiv.appendChild(p);
               }
           });

           // Any media whose display_order exceeds paragraph count, or non-image/non-yt types
           if(article.media){
               article.media.filter(m=>m.display_order>=paragraphs.length||(m.type!=='image'&&m.type!=='youtube')).forEach(m=>contentDiv.appendChild(createMediaElement(m,m.type==='image'||m.type==='youtube')));
           }

           const isLiked=userLikes.has(String(article.id));
           articleDiv.innerHTML=`
               <div class="article-header">${buildAuthorHeader(article)}</div>
               <div class="article-title">${renderEmojiText(article.title||'Untitled')}</div>
               <div class="article-stats">
                   <div class="stat-item views"><i class="fas fa-eye"></i><span>${formatNumber(article.views||0)}</span></div>
                   <div class="stat-item likes"><i class="fas fa-heart"></i><span>${formatNumber(article.likes||0)}</span></div>
               </div>
               <div class="action-buttons">
                   ${buildEditBtn(article)}
                   <button class="action-btn like-btn ${isLiked?'liked':''}" data-id="${article.id}">
                       <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                       <span class="like-count">${formatNumber(article.likes||0)}</span>
                   </button>
                   <button class="action-btn comment-btn" data-id="${article.id}">
                       <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                       <span class="comment-count">0</span>
                   </button>
                   <button class="action-btn share-btn" data-id="${article.id}" data-title="${(article.title||'').replace(/"/g,'&quot;')}">
                       <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                       <span>Share</span>
                   </button>
               </div>`;
           articleDiv.querySelector('.article-stats').insertAdjacentElement('afterend',contentDiv);
           wrapper.appendChild(articleDiv);
           setupDoubleTap(articleDiv,article.id);

           if(isLiked&&hasImages){
               const likeBtn=articleDiv.querySelector('.like-btn');
               setTimeout(()=>{applyLikeColorFromCard(articleDiv,likeBtn);},200);
           }
       }
   }

   if(hasMore){const skDiv=document.createElement('div');skDiv.className='skeleton-card';skDiv.innerHTML=skeletonCardHTML();wrapper.appendChild(skDiv);}
   document.querySelectorAll('.like-btn').forEach(btn=>btn.addEventListener('click',handleLike));
   document.querySelectorAll('.comment-btn').forEach(btn=>btn.addEventListener('click',handleComments));
   document.querySelectorAll('.share-btn').forEach(btn=>btn.addEventListener('click',()=>shareArticle(btn.dataset.id,btn.dataset.title)));
   updateFollowButtons();
   if(isInitial){wrapper.addEventListener('scroll',handleScroll);loadCommentCounts();setupIntersectionObserver();}
   else{setupIntersectionObserverForNew(startIndex);loadCommentCounts();}
}

function setupIntersectionObserver(){const obs=new IntersectionObserver((entries)=>{entries.forEach(entry=>{const id=entry.target.dataset.articleId;if(!id)return;if(entry.isIntersecting&&entry.intersectionRatio>=0.75)startViewTimer(id);else clearViewTimer(id);});},{threshold:[0.75]});document.querySelectorAll('.article-card,.mcq-card').forEach(c=>{if(c.dataset.articleId)obs.observe(c);});}
function setupIntersectionObserverForNew(startIndex){const obs=new IntersectionObserver((entries)=>{entries.forEach(entry=>{const id=entry.target.dataset.articleId;if(!id)return;if(entry.isIntersecting&&entry.intersectionRatio>=0.75)startViewTimer(id);else clearViewTimer(id);});},{threshold:[0.75]});document.querySelectorAll('.article-card,.mcq-card').forEach(c=>{if(c.dataset.index>=startIndex&&c.dataset.articleId)obs.observe(c);});}
function startViewTimer(id){if(viewedArticles.has(id)||viewTimers[id])return;viewTimers[id]=setTimeout(async()=>{await incrementView(id);},5000);}
function clearViewTimer(id){if(viewTimers[id]){clearTimeout(viewTimers[id]);delete viewTimers[id];}}
async function incrementView(id){
   if(viewedArticles.has(id))return;
   try{viewedArticles.add(id);const {data:a}=await supabase.from('articles').select('views').eq('id',id).single();const nv=(a.views||0)+1;await supabase.from('articles').update({views:nv}).eq('id',id);const idx=articles.findIndex(a=>a.id===id);if(idx!==-1)articles[idx].views=nv;const card=document.querySelector(`.article-card[data-article-id="${id}"],.mcq-card[data-article-id="${id}"]`);if(card){const s=card.querySelector('.stat-item.views span');if(s)s.textContent=formatNumber(nv);}}catch(e){viewedArticles.delete(id);}
}

async function loadCommentCounts(){try{const {data:comments}=await supabase.from('comments').select('article_id');const counts={};(comments||[]).forEach(c=>{counts[c.article_id]=(counts[c.article_id]||0)+1;});document.querySelectorAll('.comment-btn').forEach(btn=>{btn.querySelector('.comment-count').textContent=counts[btn.dataset.id]||0;});}catch(e){}}
