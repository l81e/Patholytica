<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Patholytica — Profile</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #0f0e0b;
  --text: #f5f0e8;
  --sub: #8a8070;
  --hover: #1a1810;
  --border: #2a2518;
  --accent: #c8a96e;
  --accent-h: #b8935a;
  --accent-glow: rgba(200,169,110,0.25);
  --accent-soft: rgba(200,169,110,0.12);
  --success: #4ade80;
  --error: #ef4444;
  --warn: #f59e0b;
}
body.light-theme {
  --bg: #faf6ee;
  --text: #1a1710;
  --sub: #706050;
  --hover: #f0ebe0;
  --border: #e0d8c8;
  --accent: #a07840;
  --accent-h: #8a6430;
  --accent-glow: rgba(160,120,64,0.2);
  --accent-soft: rgba(160,120,64,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:"DM Sans",sans-serif;
  background: var(--bg); color: var(--text);
  overflow:hidden; position:fixed; width:100%; height:100vh;
  transition: background .2s, color .2s;
}
.app {
  position:fixed; top:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:450px; height:100vh;
  background: var(--bg); display:flex; flex-direction:column;
}

/* ── Header ── */
.header {
  flex-shrink:0; display:flex; align-items:center; gap:10px;
  padding: 10px 16px;
  padding-top: calc(10px + env(safe-area-inset-top));
  background: rgba(15,14,11,0.96);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  z-index:40;
}
body.light-theme .header { background: rgba(250,246,238,0.96); }
.icon-btn {
  width:34px; height:34px; border-radius:50%;
  background: var(--hover); border: 1px solid var(--border);
  color: var(--text); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; transition: border-color .2s, color .2s; flex-shrink:0;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.header-center { flex:1; }
.header-title { font-size:14px; font-weight:700; font-family:'Merriweather',serif; }
.header-sub { font-size:10px; color: var(--sub); margin-top:1px; }

/* ── Scrollable content ── */
.profile-scroll {
  flex:1; overflow-y:auto; overflow-x:hidden;
}
.profile-scroll::-webkit-scrollbar { width:2px; }
.profile-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius:2px; }

/* ══════════════════════════════════
   HERO
══════════════════════════════════ */
.hero {
  position:relative; padding: 20px 18px 18px;
  border-bottom: 1px solid var(--border);
}
.hero-top {
  display:flex; align-items:flex-start; gap:16px; margin-bottom:14px;
}
.hero-avatar-wrap { position:relative; flex-shrink:0; }
.hero-avatar {
  width:68px; height:68px; border-radius:50%;
  background: linear-gradient(135deg, var(--hover), var(--bg));
  border: 2px solid rgba(200,169,110,0.35);
  display:flex; align-items:center; justify-content:center;
  font-size:24px; font-weight:800; color: var(--accent);
  overflow:hidden;
  box-shadow: 0 0 0 4px var(--bg), 0 0 0 5px rgba(200,169,110,0.2);
}
.hero-avatar img { width:100%; height:100%; object-fit:cover; }
.hero-counters {
  flex:1; display:flex; gap:0;
  border: 1px solid var(--border); border-radius:12px;
  overflow:hidden; margin-top:6px;
}
.hero-counter {
  flex:1; display:flex; flex-direction:column; align-items:center;
  padding:10px 6px; position:relative;
}
.hero-counter + .hero-counter::before {
  content:''; position:absolute; left:0; top:20%; bottom:20%;
  width:1px; background: var(--border);
}
.hero-counter-val {
  font-size:17px; font-weight:800; color: var(--text); line-height:1;
  font-family:'Merriweather',serif;
}
.hero-counter-label { font-size:9px; font-weight:600; color: var(--sub); margin-top:3px; letter-spacing:.04em; text-transform:uppercase; }

.hero-identity { margin-bottom:10px; }
.hero-full-name {
  font-size:18px; font-weight:800; color: var(--text);
  font-family:'Merriweather',serif; margin-bottom:2px; line-height:1.2;
}
.hero-username { font-size:12px; color: var(--sub); margin-bottom:8px; }
.hero-bio {
  font-size:13px; line-height:1.65; color: var(--text);
  white-space:pre-wrap; word-break:break-word;
}
.hero-bio-empty { font-size:12px; color: var(--sub); font-style:italic; }

.hero-actions { display:flex; gap:8px; margin-top:12px; }
.btn-edit-profile {
  flex:1; padding:9px; border-radius:10px;
  background: var(--accent); color:#0f0e0b;
  font-size:12px; font-weight:700; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:6px;
  font-family:"DM Sans",sans-serif;
  box-shadow: 0 2px 10px var(--accent-glow);
  transition: background .15s;
}
.btn-edit-profile:hover { background: var(--accent-h); }
.btn-create-library {
  padding:9px 14px; border-radius:10px;
  background: var(--hover); border: 1px solid var(--border);
  color: var(--text); font-size:12px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:6px;
  font-family:"DM Sans",sans-serif;
  transition: border-color .15s, color .15s;
}
.btn-create-library:hover { border-color: var(--accent); color: var(--accent); }

/* ── Skeleton hero ── */
.hero-skeleton {
  padding:20px 18px 18px; border-bottom: 1px solid var(--border);
}
.sk-top { display:flex; gap:16px; margin-bottom:14px; }
.sk-av { width:68px; height:68px; border-radius:50%; flex-shrink:0; }
.sk-counters { flex:1; border:1px solid var(--border); border-radius:12px; margin-top:6px; }
.sk-name { height:18px; width:140px; border-radius:6px; margin-bottom:8px; }
.sk-bio-line { height:11px; border-radius:4px; margin-bottom:5px; }
@keyframes shimmer { 0%,100%{opacity:.3} 50%{opacity:.7} }
.sk { background: var(--hover); animation: shimmer 1.6s infinite; border-radius:6px; }

/* ── Tabs ── */
.tabs {
  flex-shrink:0; display:flex;
  border-bottom: 1px solid var(--border);
  background: var(--bg); position:sticky; top:0; z-index:20;
}
.tab-btn {
  flex:1; padding:11px 0; font-size:11px; font-weight:700;
  letter-spacing:.05em; text-transform:uppercase;
  background:none; border:none; color: var(--sub);
  cursor:pointer; transition: color .15s; position:relative;
  font-family:"DM Sans",sans-serif;
}
.tab-btn.active { color: var(--accent); }
.tab-btn.active::after {
  content:''; position:absolute; bottom:0; left:15%; right:15%;
  height:2px; background: var(--accent); border-radius:2px 2px 0 0;
}
.tab-btn i { margin-right:4px; font-size:10px; }

/* ── Panel ── */
.panel { display:none; }
.panel.active { display:block; }

/* ── Selection bar ── */
.selection-bar {
  position:sticky; top:0; z-index:10;
  background: var(--bg); border-bottom: 1px solid var(--border);
  padding:8px 14px; display:none; align-items:center; gap:8px;
}
.selection-bar.show { display:flex; }
.sel-count { font-size:12px; font-weight:700; color: var(--accent); flex:1; }
.sel-btn {
  padding:6px 11px; border-radius:7px; font-size:11px; font-weight:700;
  cursor:pointer; border:none; font-family:"DM Sans",sans-serif; transition: all .15s;
}
.sel-all { background: var(--hover); color: var(--text); border: 1px solid var(--border); }
.sel-all:hover { border-color: var(--accent); color: var(--accent); }
.sel-del { background: rgba(239,68,68,.12); color:#f87171; border: 1px solid rgba(239,68,68,.25); }
.sel-del:hover { background: rgba(239,68,68,.22); }
.sel-cancel { background:transparent; color: var(--sub); border: 1px solid var(--border); }

/* ══════════════════════════════════
   ARTICLE ITEMS — X-inspired
══════════════════════════════════ */
.article-item {
  display:flex; gap:0;
  padding:14px 16px 0;
  border-bottom: 1px solid var(--border);
  cursor:pointer; transition: background .12s; position:relative;
  -webkit-tap-highlight-color:transparent;
  align-items:flex-start;
}
.article-item:hover { background: rgba(200,169,110,0.03); }
.article-item.selected { background: rgba(200,169,110,.05); border-left:3px solid var(--accent); padding-left:13px; }

.article-select-box {
  width:20px; height:20px; border-radius:50%;
  border: 1.5px solid var(--border);
  display:none; align-items:center; justify-content:center;
  font-size:9px; flex-shrink:0; margin-top:3px; margin-right:10px;
  color:transparent; transition: all .15s;
}
.selection-mode .article-select-box { display:flex; }
.article-item.selected .article-select-box { background: var(--accent); border-color: var(--accent); color:#0f0e0b; }

/* left column: avatar strip */
.article-item-left {
  display:flex; flex-direction:column; align-items:center;
  flex-shrink:0; margin-right:11px;
}
.art-avatar {
  width:36px; height:36px; border-radius:50%;
  background: linear-gradient(135deg, var(--accent), #8a6430);
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700; color:#0f0e0b;
  overflow:hidden; flex-shrink:0;
}
.art-avatar img { width:100%; height:100%; object-fit:cover; }
.art-thread-line {
  width:2px; background: var(--border); flex:1;
  margin-top:4px; min-height:12px; border-radius:1px;
}

/* right column */
.article-item-right { flex:1; min-width:0; padding-bottom:14px; }
.art-meta-row {
  display:flex; align-items:center; gap:6px; margin-bottom:4px; flex-wrap:wrap;
}
.art-author { font-size:13px; font-weight:700; color: var(--text); }
.art-handle { font-size:12px; color: var(--sub); }
.art-dot { font-size:10px; color: var(--sub); }
.art-time { font-size:12px; color: var(--sub); }
.mcq-badge-sm {
  font-size:9px; font-weight:700; padding:2px 7px; border-radius:20px;
  background:rgba(74,222,128,.1); color:#4ade80; display:inline-flex; align-items:center; gap:3px;
  letter-spacing:.04em; text-transform:uppercase; border: 1px solid rgba(74,222,128,.2);
}
.art-title {
  font-size:14px; font-weight:700; line-height:1.4; margin-bottom:6px;
  font-family:'Merriweather',serif; color: var(--text);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.art-excerpt {
  font-size:13px; color: var(--sub); line-height:1.55; margin-bottom:8px;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
}
.art-thumb {
  width:100%; max-height:160px; object-fit:cover;
  border-radius:10px; margin-bottom:10px; border:1px solid var(--border);
  display:block;
}
.art-actions-row {
  display:flex; gap:0; align-items:center;
  margin-top:6px; margin-left:-8px;
}
.art-action {
  display:flex; align-items:center; gap:5px;
  padding:7px 8px; border-radius:20px;
  background:none; border:none; cursor:pointer;
  font-size:12px; color: var(--sub);
  transition: color .15s, background .15s;
  font-family:"DM Sans",sans-serif;
}
.art-action:hover { color: var(--accent); background: var(--accent-soft); }
.art-action i { font-size:13px; }
.art-action.danger:hover { color:#f87171; background:rgba(239,68,68,.08); }
.art-action-spacer { flex:1; }

/* MCQ preview in article list */
.art-mcq-preview {
  background: var(--hover); border: 1px solid var(--border);
  border-radius:10px; padding:10px 12px; margin-bottom:8px;
}
.art-mcq-q {
  font-size:13px; font-weight:700; color: var(--text); line-height:1.4; margin-bottom:8px;
  font-family:'Merriweather',serif;
}
.art-mcq-opts { display:flex; flex-direction:column; gap:5px; }
.art-mcq-opt {
  display:flex; align-items:center; gap:8px;
  padding:7px 10px; border-radius:8px;
  border: 1px solid var(--border); background: var(--bg);
  font-size:12px; color: var(--text); line-height:1.4;
  cursor:pointer; transition: border-color .15s, background .15s;
  text-align:left; width:100%;
  font-family:"DM Sans",sans-serif;
}
.art-mcq-opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.art-mcq-opt:disabled { cursor:default; }
.art-mcq-opt .opt-l {
  width:22px; height:22px; border-radius:50%;
  border:1.5px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size:9px; font-weight:800; flex-shrink:0; color: var(--sub);
  transition: all .15s;
}
.art-mcq-opt.correct { border-color:#6abf85; background:rgba(106,191,133,0.08); }
.art-mcq-opt.correct .opt-l { background:#6abf85; border-color:#6abf85; color:#0f0e0b; }
.art-mcq-opt.wrong { border-color:#c46a4e; background:rgba(196,106,78,0.07); }
.art-mcq-opt.wrong .opt-l { background:#c46a4e; border-color:#c46a4e; color:#fff; }
.art-mcq-opt.reveal { border-color:rgba(106,191,133,0.5); }
.art-mcq-opt.reveal .opt-l { border-color:#6abf85; color:#6abf85; }
.art-mcq-result { font-size:12px; font-weight:700; margin-top:8px; }
.art-mcq-result.correct { color:#6abf85; }
.art-mcq-result.wrong { color:#c46a4e; }

/* ── Library items ── */
.lib-grid {
  display:grid; grid-template-columns:1fr 1fr;
  gap:0; padding:0;
}
.library-card {
  position:relative; cursor:pointer;
  border-bottom: 1px solid var(--border);
  transition: background .12s;
  -webkit-tap-highlight-color:transparent;
}
.library-card:nth-child(odd) { border-right: 1px solid var(--border); }
.library-card:hover { background: var(--hover); }
.library-card.selected { background: rgba(200,169,110,.05); }

.lib-select-box {
  position:absolute; top:8px; left:8px; z-index:5;
  width:20px; height:20px; border-radius:50%;
  border: 1.5px solid rgba(255,255,255,.5);
  background:rgba(0,0,0,.4);
  display:none; align-items:center; justify-content:center;
  font-size:9px; color:transparent; backdrop-filter:blur(4px);
}
.selection-mode-lib .lib-select-box { display:flex; }
.library-card.selected .lib-select-box { background: var(--accent); border-color: var(--accent); color:#0f0e0b; }

.lib-poster {
  width:100%; aspect-ratio:3/4; position:relative; overflow:hidden;
  background: linear-gradient(135deg, var(--hover), var(--bg));
}
.lib-poster img { width:100%; height:100%; object-fit:cover; }
.lib-poster-placeholder {
  width:100%; height:100%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:8px;
}
.lib-poster-letter { font-size:32px; font-weight:800; color:rgba(200,169,110,.15); font-family:'Merriweather',serif; }
.lib-poster-icon { font-size:20px; color:rgba(200,169,110,.1); }
.lib-poster-gradient {
  position:absolute; inset:0;
  background:linear-gradient(to top, rgba(10,8,5,.95) 0%, rgba(10,8,5,.3) 50%, transparent 80%);
  display:flex; flex-direction:column; justify-content:flex-end; padding:10px;
}
.lib-count-chip {
  display:inline-flex; align-items:center; gap:3px;
  background:rgba(200,169,110,.18); border:1px solid rgba(200,169,110,.25);
  border-radius:5px; padding:2px 6px; font-size:9px; font-weight:700;
  color: var(--accent); align-self:flex-start; margin-bottom:5px;
  backdrop-filter:blur(4px);
}
.lib-poster-name {
  font-size:12px; font-weight:700; color:#f5f0e8; line-height:1.25;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  text-shadow:0 1px 4px rgba(0,0,0,.8);
}
.lib-card-actions {
  position:absolute; top:8px; right:8px; display:flex; gap:4px; z-index:5;
  opacity:0; transition: opacity .15s;
}
.library-card:hover .lib-card-actions { opacity:1; }
.selection-mode-lib .lib-card-actions { display:none; }
.lib-action {
  width:24px; height:24px; border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  font-size:9px; cursor:pointer; border:none; transition: all .15s;
  backdrop-filter:blur(6px);
}
.lib-action.edit { background:rgba(200,169,110,.3); color:#f5f0e8; }
.lib-action.del  { background:rgba(239,68,68,.35); color:#fff; }

/* ── Library detail expanded panel ── */
.lib-detail-panel {
  grid-column: 1 / -1;
  background: var(--hover);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px;
  display:none;
  animation: detailIn .2s ease;
}
.lib-detail-panel.open { display:block; }
@keyframes detailIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
.lib-detail-name {
  font-size:15px; font-weight:800; color: var(--text);
  font-family:'Merriweather',serif; margin-bottom:5px;
}
.lib-detail-desc {
  font-size:13px; color: var(--sub); line-height:1.6; margin-bottom:12px;
}
.lib-detail-desc-empty { font-size:12px; color: var(--sub); font-style:italic; margin-bottom:12px; }
.lib-detail-row { display:flex; align-items:center; gap:8px; }
.lib-detail-count { font-size:11px; color: var(--sub); display:flex; align-items:center; gap:4px; flex:1; }
.lib-detail-count i { color: var(--accent); font-size:10px; }
.btn-start-feed {
  padding:8px 16px; border-radius:8px;
  background: var(--accent); color:#0f0e0b;
  font-size:11px; font-weight:700; border:none; cursor:pointer;
  display:flex; align-items:center; gap:5px;
  font-family:"DM Sans",sans-serif;
  transition: background .15s;
}
.btn-start-feed:hover { background: var(--accent-h); }

/* ── Empty / Loading ── */
.feed-empty {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:50px 20px; gap:12px; color: var(--sub); text-align:center;
}
.feed-empty i { font-size:36px; opacity:.18; color: var(--accent); }
.feed-empty h3 { font-size:15px; color: var(--text); font-family:'Merriweather',serif; }
.feed-empty p { font-size:12px; }
.loading-wrap {
  display:flex; align-items:center; justify-content:center;
  padding:40px; gap:12px; color: var(--sub); font-size:13px;
}
.spinner { width:24px; height:24px; border:2.5px solid var(--border); border-top-color: var(--accent); border-radius:50%; animation:spin .8s linear infinite; flex-shrink:0; }
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Sheets ── */
.sheet-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.85);
  z-index:200; display:none; align-items:flex-end; justify-content:center;
  backdrop-filter:blur(4px);
}
.sheet-overlay.show { display:flex; }
.sheet {
  background:#141210; border-radius:20px 20px 0 0;
  border:1px solid var(--border); border-bottom:none;
  width:100%; max-width:450px; max-height:88vh;
  display:flex; flex-direction:column;
  animation:slideUp .3s cubic-bezier(.4,0,.2,1);
  padding-bottom: env(safe-area-inset-bottom);
}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 0;flex-shrink:0;}
.sheet-header{padding:12px 18px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;}
.sheet-title{font-size:14px;font-weight:700;font-family:'Merriweather',serif;}
.sheet-close{width:28px;height:28px;border-radius:50%;background:var(--hover);border:1px solid var(--border);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:border-color .2s,color .2s;}
.sheet-close:hover{border-color:var(--accent);color:var(--accent);}
.sheet-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;}
.sheet-body::-webkit-scrollbar{width:2px;}
.sheet-body::-webkit-scrollbar-thumb{background:var(--border);}
.sheet-footer{padding:10px 18px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0;}

/* Form */
.form-field label{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);margin-bottom:7px;}
.form-input{width:100%;padding:10px 13px;background:var(--hover);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;outline:none;font-family:"DM Sans",sans-serif;transition:border-color .2s,box-shadow .2s;}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.form-input::placeholder{color:var(--sub);opacity:.5;}
.form-textarea{width:100%;padding:10px 13px;background:var(--hover);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;outline:none;resize:none;font-family:"DM Sans",sans-serif;line-height:1.55;transition:border-color .2s,box-shadow .2s;min-height:80px;}
.form-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.form-textarea::placeholder{color:var(--sub);opacity:.5;}
.char-count{font-size:10px;color:var(--sub);text-align:right;margin-top:4px;}

/* Avatar upload */
.avatar-upload-row{display:flex;align-items:center;gap:14px;}
.avatar-preview{width:60px;height:60px;border-radius:50%;background:var(--accent-soft);border:2px solid rgba(200,169,110,0.3);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--accent);overflow:hidden;flex-shrink:0;}
.avatar-preview img{width:100%;height:100%;object-fit:cover;}
.avatar-btns{display:flex;flex-direction:column;gap:6px;flex:1;}
.btn-upload-av,.btn-remove-av{padding:7px 12px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;font-family:"DM Sans",sans-serif;transition:all .15s;}
.btn-upload-av{background:var(--hover);border:1px solid var(--border);color:var(--text);}
.btn-upload-av:hover{border-color:var(--accent);color:var(--accent);}
.btn-remove-av{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.2);color:#f87171;}
.btn-remove-av:hover{background:rgba(239,68,68,.15);}
.upload-hint{font-size:10px;color:var(--sub);}

/* Thumbnail section (library) */
.thumb-preview{width:100%;height:140px;border-radius:12px;background: linear-gradient(135deg, var(--hover), var(--bg));border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative;transition:border-color .2s;}
.thumb-preview:hover{border-color:var(--accent);}
.thumb-preview img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.thumb-preview-overlay{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;opacity:0;transition:opacity .2s;}
.thumb-preview:hover .thumb-preview-overlay{opacity:1;}
.thumb-preview-placeholder{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--sub);}
.thumb-preview-placeholder i{font-size:28px;opacity:.4;}
.thumb-preview-placeholder span{font-size:11px;font-weight:600;}
.thumb-actions{display:flex;gap:6px;margin-top:8px;}
.thumb-action-btn{flex:1;padding:7px 10px;border-radius:7px;border:1px solid var(--border);background:var(--hover);color:var(--sub);font-size:10px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .15s;}
.thumb-action-btn:hover{border-color:var(--accent);color:var(--accent);}
.thumb-action-btn.danger:hover{border-color:var(--error);color:#f87171;}

/* Sheet buttons */
.btn{flex:1;padding:11px 8px;border-radius:10px;border:none;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;font-family:"DM Sans",sans-serif;}
.btn-secondary{background:var(--hover);color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
.btn-primary{background:var(--accent);color:#0f0e0b;box-shadow:0 2px 10px var(--accent-glow);}
.btn-primary:hover{background:var(--accent-h);}
.btn-danger{background:rgba(239,68,68,.12);color:#f87171;border:1px solid rgba(239,68,68,.22);}
.btn-danger:hover{background:rgba(239,68,68,.22);}
.btn:disabled{opacity:.35;cursor:not-allowed;}

/* Confirm */
.confirm-icon{display:flex;align-items:center;justify-content:center;margin-bottom:4px;}
.confirm-icon i{font-size:30px;color:#f87171;}
.confirm-title{font-size:15px;font-weight:800;text-align:center;margin-bottom:6px;font-family:'Merriweather',serif;}
.confirm-msg{font-size:12px;color:var(--sub);text-align:center;line-height:1.55;}

/* Toast */
.notif{position:fixed;top:calc(60px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#141210;border:1px solid var(--border);border-radius:10px;padding:10px 16px;box-shadow:0 8px 32px rgba(0,0,0,.6);z-index:500;display:none;align-items:center;gap:8px;min-width:200px;max-width:300px;}
.notif.show{display:flex;animation:notifIn .25s ease;}
.notif.success{border-left:3px solid var(--success);}
.notif.error{border-left:3px solid var(--error);}
.notif.warning{border-left:3px solid var(--warn);}
.notif i{font-size:13px;}
.notif.success i{color:var(--success);}
.notif.error i{color:var(--error);}
.notif.warning i{color:var(--warn);}
.notif span{font-size:12px;font-weight:500;}
@keyframes notifIn{from{transform:translateX(-50%) translateY(-10px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}

/* Emoji styles (from dailyfeed) */
.emo-magnify{font-weight:700;font-size:1.18em}
.emo-urgent{font-weight:700;color:#e8c86a;background:rgba(232,200,106,.12);border:1px solid rgba(232,200,106,.25);padding:.08em .35em;border-radius:5px;animation:urgentWarm 1.6s ease-in-out infinite;display:inline-block}
@keyframes urgentWarm{0%,100%{box-shadow:0 0 0 0 rgba(232,200,106,.3)}50%{box-shadow:0 0 0 5px rgba(232,200,106,0)}}
.emo-pinned{font-weight:700;border-left:2px solid var(--accent);padding-left:.5em;padding-right:.2em;background:linear-gradient(to right,var(--accent-soft),transparent);border-radius:0 4px 4px 0}
.emo-fire{font-weight:700;background:linear-gradient(90deg,#c87040,#e8a040,#c8a96e,#e8a040,#c87040);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:fireWarm 2s linear infinite;filter:drop-shadow(0 0 6px rgba(200,140,60,.4))}
@keyframes fireWarm{0%{background-position:0% center}100%{background-position:200% center}}
.emo-diamond{font-weight:700;background:linear-gradient(135deg,#e8d8a0,#c8a96e,#a08050,#e8d8a0);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:crystalWarm 3s ease-in-out infinite}
@keyframes crystalWarm{0%,100%{filter:drop-shadow(0 0 5px rgba(200,169,110,.3))}50%{filter:drop-shadow(0 0 14px rgba(220,190,130,.8))}}
.emo-yellow{color:#e8c86a;text-shadow:0 0 8px rgba(232,200,106,.6)}
.emo-blue{color:#8aa0c0;text-shadow:0 0 8px rgba(138,160,192,.55)}
.emo-green{color:#7ab88a;text-shadow:0 0 8px rgba(122,184,138,.55)}
.emo-purple{color:var(--accent);text-shadow:0 0 10px rgba(200,169,110,.7);animation:champagnePulse 2.2s ease-in-out infinite}
@keyframes champagnePulse{0%,100%{text-shadow:0 0 10px rgba(200,169,110,.7)}50%{text-shadow:0 0 22px rgba(220,190,130,1)}}
.emo-red{color:#c97a5a;text-shadow:0 0 8px rgba(201,122,90,.55)}
.emo-dark{color:#f0e8d8;background:rgba(0,0,0,.75);padding:.08em .35em;border-radius:4px}
.emo-brain{font-style:italic;color:var(--accent);border-bottom:1.5px solid rgba(200,169,110,.35)}
.emo-book{font-family:'Merriweather',Georgia,serif;background:rgba(200,169,110,.06);color:#d4b88a;padding:.08em .35em;border-radius:4px;border:1px solid rgba(200,169,110,.15);font-size:.95em}
.emo-idea{background:linear-gradient(to right,var(--accent-soft),rgba(200,169,110,.04));color:#d4a96e;padding:.08em .35em;border-radius:4px;animation:ideaWarm 2.5s ease-in-out infinite}
@keyframes ideaWarm{0%,100%{text-shadow:0 0 10px rgba(200,169,110,.5)}50%{text-shadow:0 0 20px rgba(220,180,120,.9)}}
.emo-target{font-weight:700;outline:1.5px solid rgba(200,169,110,.5);outline-offset:3px;padding:.08em .28em;animation:targetWarm 2.2s ease-in-out infinite;display:inline-block}
@keyframes targetWarm{0%,100%{outline-color:rgba(200,169,110,.5);outline-offset:3px}50%{outline-color:rgba(200,169,110,.12);outline-offset:6px}}
.emo-puzzle{border:1px dashed rgba(200,169,110,.35);padding:.08em .38em;border-radius:5px;color:#c8a96e}
.emo-tag{background:var(--accent-soft);border:1px solid rgba(200,169,110,.25);color:#c8a96e;padding:.06em .55em;border-radius:20px;font-size:.88em}
.emo-micro{font-family:'Courier New',monospace;color:#c8a96e;font-size:.88em;border-bottom:1px dotted rgba(200,169,110,.4)}
.emo-warning{background:rgba(200,169,110,.1);border:1px solid rgba(200,169,110,.3);color:#c8a96e;padding:.08em .4em;border-radius:5px;font-weight:700}
.emo-check{color:#7ab88a;background:rgba(122,184,138,.1);padding:.08em .32em;border-radius:4px;font-weight:700}
.emo-cross{color:#c97a5a;background:rgba(201,122,90,.08);padding:.08em .32em;border-radius:4px;text-decoration:line-through;text-decoration-color:rgba(201,122,90,.5)}
.emo-hourglass{color:var(--accent);background:var(--accent-soft);padding:.08em .32em;border-radius:4px}
.emo-lock{color:#8a8070;background:rgba(42,37,24,.8);padding:.08em .38em;border-radius:4px;border:1px solid var(--border);font-weight:600}
.emo-unlock{color:var(--accent);background:var(--accent-soft);padding:.08em .38em;border-radius:4px;border:1px solid rgba(200,169,110,.25)}
.emo-lightning{font-weight:700;background:linear-gradient(90deg,#e8c86a,#c8a96e,#e8d8a0);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:electricWarm 1s ease-in-out infinite}
@keyframes electricWarm{0%,100%{filter:drop-shadow(0 0 4px rgba(200,169,110,.4))}50%{filter:drop-shadow(0 0 12px rgba(232,200,106,.9))}}
.emo-star{color:#f0e0b0;animation:starWarm 1.8s ease-in-out infinite}
@keyframes starWarm{0%,100%{text-shadow:-1px -1px 6px rgba(200,169,110,.7),1px 1px 6px rgba(200,169,110,.7)}50%{text-shadow:-2px -2px 14px rgba(232,200,106,1),2px 2px 14px rgba(232,216,160,1)}}
.emo-sparkle{background:linear-gradient(90deg,#f0e0b0 0%,#c8a96e 25%,#f0e0b0 50%,#e8c880 75%,#f0e0b0 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:sparkleWarm 1.8s linear infinite}
@keyframes sparkleWarm{0%{background-position:0% center}100%{background-position:200% center}}
.emo-rainbow{background:linear-gradient(90deg,#c97a5a,#c8a96e,#7ab88a,#8aa0c0,#c8a96e,#c97a5a);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:rainbowWarm 2.5s linear infinite;font-weight:700}
@keyframes rainbowWarm{0%{background-position:0% center}100%{background-position:200% center}}
.emo-crown{font-weight:800;background:linear-gradient(135deg,#e8d8a0,#c8a96e,#a07840,#e8d8a0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 2px 6px rgba(200,169,110,.45));font-size:1.06em}
.emo-magic{display:inline-block;background:linear-gradient(90deg,#f0d8a0,#c8a96e,#e8c880,#f0d8a0);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:magicWarm 1.8s linear infinite}
@keyframes magicWarm{0%{background-position:0% center}100%{background-position:200% center}}
.emo-heart{color:#c87a6a;display:inline-block;animation:heartWarm 1.4s ease-in-out infinite}
@keyframes heartWarm{0%,100%{transform:scale(1)}14%{transform:scale(1.06)}28%{transform:scale(1)}42%{transform:scale(1.04)}}
.emo-happy{color:#e8c86a;display:inline-block;animation:happyWarm .8s ease-in-out infinite}
@keyframes happyWarm{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.emo-calm{color:var(--accent);animation:calmWarm 3s ease-in-out infinite}
@keyframes calmWarm{0%,100%{opacity:1}50%{opacity:.7}}
.emo-wave{display:inline-block;animation:waveWarm 1.6s ease-in-out infinite;color:#c8a96e}
@keyframes waveWarm{0%,100%{transform:translateY(0)}25%{transform:translateY(-3px)}75%{transform:translateY(3px)}}
.emo-float{display:inline-block;animation:floatWarm 2.2s ease-in-out infinite;color:#c8a96e}
@keyframes floatWarm{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-5px) rotate(.5deg)}}
.emo-rocket{font-weight:700;display:inline-block;animation:rocketWarm .6s cubic-bezier(.16,1,.3,1) both;color:#e8d8a0}
@keyframes rocketWarm{0%{transform:translateX(-16px);opacity:0}100%{transform:translateX(0);opacity:1}}
.emo-science{font-family:'Courier New',monospace;color:#b8a878;font-size:.9em;border-bottom:1px solid rgba(184,168,120,.35)}
.emo-temple{font-family:'Merriweather',Georgia,serif;color:#c4b090;letter-spacing:.05em}
.emo-robot{font-family:'Courier New',monospace;color:#b0a08a;border:1px solid rgba(176,160,138,.2);padding:.04em .3em;border-radius:3px;font-size:.88em}
.emo-earth{background:linear-gradient(90deg,#7a6030,#506838,#385870,#7a6030);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:earthWarm 4s linear infinite;font-weight:700}
@keyframes earthWarm{0%{background-position:0% center}100%{background-position:300% center}}
.emo-money{font-weight:700;background:linear-gradient(135deg,#d4b86a,#c8a96e,#b89848);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.emo-balance{color:var(--text);border-left:2px solid #c8a96e;border-right:2px solid #8aa0c0;padding:.04em .38em;background:linear-gradient(90deg,rgba(200,169,110,.06),transparent,rgba(138,160,192,.06))}
.emo-signal{color:var(--accent);display:inline-block;animation:signalWarm 1.5s ease-in-out infinite}
@keyframes signalWarm{0%,100%{text-shadow:0 0 3px rgba(200,169,110,.3)}50%{text-shadow:0 0 12px rgba(200,169,110,.8)}}
.emo-music{color:#c87a6a;display:inline-block;animation:musicWarm .6s ease-in-out infinite alternate}
@keyframes musicWarm{0%{transform:scaleY(.97)}100%{transform:scaleY(1.03)}}
.emo-ice{color:#a0b8c8;background:rgba(160,184,200,.07);border:1px solid rgba(160,184,200,.18);padding:.08em .32em;border-radius:4px}
.emo-sound{font-weight:800;font-size:1.08em;color:#e8d8a0;display:inline-block;animation:soundWarm 1s ease-in-out infinite}
@keyframes soundWarm{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.emo-spin{display:inline-block;animation:expandWarm 4s ease-in-out infinite;color:#b89060}
@keyframes expandWarm{0%,100%{letter-spacing:0em}50%{letter-spacing:.08em}}
.emo-surprised{display:inline-block;animation:popWarm .5s cubic-bezier(.34,1.56,.64,1) both;color:#d4a86a;font-size:1.1em}
@keyframes popWarm{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.emo-cool{background:rgba(10,8,4,.9);color:var(--accent);padding:.08em .38em;border-radius:4px;border:1px solid rgba(200,169,110,.2)}
.emo-cinematic{animation:cinematicWarm 1.2s cubic-bezier(.16,1,.3,1) both;color:#f0e8d8}
@keyframes cinematicWarm{0%{opacity:0;filter:blur(4px);letter-spacing:.18em}100%{opacity:1;filter:blur(0);letter-spacing:0}}
</style>
</head>
<body>
<script>if(localStorage.getItem('theme')==='light')document.body.classList.add('light-theme');</script>

<div class="app">
  <div class="header" id="mainHeader">
    <button class="icon-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
    <div class="header-center">
      <div class="header-title" id="headerTitle">Profile</div>
      <div class="header-sub" id="headerSub">Loading…</div>
    </div>
    <button class="icon-btn" onclick="toggleTheme()"><i class="fas fa-circle-half-stroke"></i></button>
  </div>

  <div class="profile-scroll" id="profileScroll">
    <div id="heroArea">
      <div class="hero-skeleton" id="heroSkeleton">
        <div class="sk-top">
          <div class="sk-av sk"></div>
          <div style="flex:1;border:1px solid var(--border);border-radius:12px;margin-top:6px;" class="sk"></div>
        </div>
        <div class="sk-name sk"></div>
        <div class="sk-bio-line sk" style="width:90%"></div>
        <div class="sk-bio-line sk" style="width:70%"></div>
      </div>
    </div>

    <div class="tabs" id="tabsBar" style="display:none;">
      <button class="tab-btn active" id="tabLibraries" onclick="switchTab('libraries')">
        <i class="fas fa-book-open"></i>Libraries
      </button>
      <button class="tab-btn" id="tabArticles" onclick="switchTab('articles')">
        <i class="fas fa-file-alt"></i>Articles
      </button>
    </div>

    <!-- Libraries panel — default -->
    <div class="panel active" id="panelLibraries">
      <div class="selection-bar" id="selBarLibraries">
        <span class="sel-count" id="selCountLibraries">0 selected</span>
        <button class="sel-btn sel-all" onclick="selectAllLibraries()">All</button>
        <button class="sel-btn sel-del" onclick="confirmBulkDeleteLibraries()"><i class="fas fa-trash"></i> Delete</button>
        <button class="sel-btn sel-cancel" onclick="exitSelectionModeLibraries()">Cancel</button>
      </div>
      <div class="lib-grid" id="librariesGrid"></div>
    </div>

    <!-- Articles panel -->
    <div class="panel" id="panelArticles">
      <div class="selection-bar" id="selBarArticles">
        <span class="sel-count" id="selCountArticles">0 selected</span>
        <button class="sel-btn sel-all" onclick="selectAllArticles()">All</button>
        <button class="sel-btn sel-del" onclick="confirmBulkDeleteArticles()"><i class="fas fa-trash"></i> Delete</button>
        <button class="sel-btn sel-cancel" onclick="exitSelectionModeArticles()">Cancel</button>
      </div>
      <div id="articlesList"></div>
    </div>

  </div>
</div>

<!-- Edit Profile Sheet -->
<div class="sheet-overlay" id="editProfileSheet">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <span class="sheet-title">Edit Profile</span>
      <button class="sheet-close" onclick="closeEditProfile()"><i class="fas fa-times"></i></button>
    </div>
    <div class="sheet-body">
      <div class="form-field">
        <label>Profile Picture</label>
        <div class="avatar-upload-row">
          <div class="avatar-preview" id="avatarPreviewCircle"><i class="fas fa-user"></i></div>
          <div class="avatar-btns">
            <button class="btn-upload-av" onclick="document.getElementById('fileInputAvatar').click()"><i class="fas fa-upload"></i> Choose Image</button>
            <button class="btn-remove-av" id="removeAvatarBtn" style="display:none;" onclick="removeAvatar()"><i class="fas fa-trash"></i> Remove</button>
            <input type="file" id="fileInputAvatar" style="display:none;" accept="image/*" onchange="handleAvatarSelect(event)">
            <span class="upload-hint">JPG, PNG or GIF · max 2MB</span>
          </div>
        </div>
      </div>
      <div class="form-field">
        <label>Bio</label>
        <textarea class="form-textarea" id="bioInputEdit" placeholder="Tell people about yourself…" maxlength="300"
          oninput="document.getElementById('bioCharCount').textContent=this.value.length+'/300'"></textarea>
        <div class="char-count" id="bioCharCount">0/300</div>
      </div>
    </div>
    <div class="sheet-footer">
      <button class="btn btn-secondary" style="flex:.5" onclick="closeEditProfile()">Cancel</button>
      <button class="btn btn-primary" id="saveProfileBtn" onclick="saveProfile()"><i class="fas fa-check"></i> Save</button>
    </div>
  </div>
</div>

<!-- Edit Article Sheet -->
<div class="sheet-overlay" id="editArticleSheet">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <span class="sheet-title">Edit Article</span>
      <button class="sheet-close" onclick="closeEditArticle()"><i class="fas fa-times"></i></button>
    </div>
    <div class="sheet-body">
      <div class="form-field"><label>Title</label><input class="form-input" id="editArticleTitle" placeholder="Article title…" maxlength="200"></div>
      <div class="form-field"><label>Content</label><textarea class="form-textarea" id="editArticleContent" placeholder="Article content…" style="min-height:160px;"></textarea></div>
    </div>
    <div class="sheet-footer">
      <button class="btn btn-secondary" style="flex:.5" onclick="closeEditArticle()">Cancel</button>
      <button class="btn btn-primary" id="saveArticleBtn" onclick="saveArticle()"><i class="fas fa-check"></i> Save</button>
    </div>
  </div>
</div>

<!-- Edit Library Sheet -->
<div class="sheet-overlay" id="editLibrarySheet">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <span class="sheet-title">Edit Library</span>
      <button class="sheet-close" onclick="closeEditLibrary()"><i class="fas fa-times"></i></button>
    </div>
    <div class="sheet-body">
      <div class="form-field"><label>Cover Image</label>
        <div class="thumb-preview" id="libThumbPreview" onclick="document.getElementById('libThumbInput').click()">
          <div class="thumb-preview-placeholder" id="libThumbPlaceholder"><i class="fas fa-image"></i><span>Add Cover Image</span></div>
          <div class="thumb-preview-overlay"><i class="fas fa-camera" style="color:#fff;font-size:20px;"></i><span style="color:#fff;font-size:11px;font-weight:600;">Change Image</span></div>
        </div>
        <input type="file" id="libThumbInput" accept="image/jpeg,image/png,image/webp" style="display:none;" onchange="handleLibThumb(this)">
        <div class="thumb-actions" id="libThumbActions" style="display:none;">
          <button class="thumb-action-btn" onclick="document.getElementById('libThumbInput').click()"><i class="fas fa-upload"></i> Change</button>
          <button class="thumb-action-btn danger" onclick="removeLibThumb()"><i class="fas fa-trash"></i> Remove</button>

<script>
/* ── Emoji rendering system (ported from dailyfeed) ── */
const EMOJI_MAP={
  '🔍':'emo-magnify','❗':'emo-urgent','📌':'emo-pinned','🔥':'emo-fire','💎':'emo-diamond',
  '🟡':'emo-yellow','🔵':'emo-blue','🟢':'emo-green','🟣':'emo-purple','🔴':'emo-red',
  '⚫':'emo-dark','🧠':'emo-brain','📖':'emo-book','💡':'emo-idea','🎯':'emo-target',
  '🧩':'emo-puzzle','🏷️':'emo-tag','🔬':'emo-micro','⚠️':'emo-warning','✅':'emo-check',
  '❌':'emo-cross','⏳':'emo-hourglass','🔒':'emo-lock','🔓':'emo-unlock','⚡':'emo-lightning',
  '🌊':'emo-wave','🌀':'emo-spin','💫':'emo-float','🚀':'emo-rocket','🎬':'emo-cinematic',
  '🌟':'emo-star','✨':'emo-sparkle','🌈':'emo-rainbow','👑':'emo-crown','🪄':'emo-magic',
  '❤️':'emo-heart','😄':'emo-happy','😌':'emo-calm','😮':'emo-surprised','😎':'emo-cool',
  '🤖':'emo-robot','🧪':'emo-science','🏛️':'emo-temple','🌍':'emo-earth','💰':'emo-money',
  '⚖️':'emo-balance','📡':'emo-signal','🎵':'emo-music','🧊':'emo-ice','🔊':'emo-sound',
};
function buildEmojiPattern(){
  const keys=Object.keys(EMOJI_MAP).sort((a,b)=>b.length-a.length);
  const escaped=keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
  return new RegExp(`(${escaped})([\\s\\S]*?)\\1`,'gu');
}
function escHtmlET(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderEmojiText(text){
  const re=buildEmojiPattern();
  let result='',lastIndex=0,match;
  while((match=re.exec(text))!==null){
    result+=escHtmlET(text.slice(lastIndex,match.index));
    const cls=EMOJI_MAP[match[1]];
    result+=`<span class="${cls}">${renderEmojiText(match[2])}</span>`;
    lastIndex=re.lastIndex;
  }
  result+=escHtmlET(text.slice(lastIndex));
  return result;
}
</script>

/* ── parseMCQ ── */
function parseMCQ(content){
  const lines=content.trim().split('\n').map(l=>l.trim()).filter(Boolean);
  const question=lines[0].replace(/^❔/,'').trim();
  const options=lines.slice(1).map(line=>({label:line.replace(/^✅/,'').trim(),correct:line.startsWith('✅')}));
  for(let i=options.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[options[i],options[j]]=[options[j],options[i]];}
  return{question,options};
}

function toggleLibDetail(libId,lib,count,card){
  // Close if already open
  if(openDetailLibId===libId){
    const existing=document.querySelector('.lib-detail-panel');
    if(existing)existing.remove();
    openDetailLibId=null;
    return;
  }
  // Remove any existing
  document.querySelectorAll('.lib-detail-panel').forEach(p=>p.remove());
  openDetailLibId=libId;

  const panel=document.createElement('div');
  panel.className='lib-detail-panel open';
  const descHTML=lib.description
    ?`<div class="lib-detail-desc">${escHtml(lib.description)}</div>`
    :`<div class="lib-detail-desc-empty">No description.</div>`;
  panel.innerHTML=`
    <div class="lib-detail-name">${escHtml(lib.name||'Untitled')}</div>
    ${descHTML}
    <div class="lib-detail-row">
      <div class="lib-detail-count"><i class="fas fa-layer-group"></i>${count} article${count!==1?'s':''}</div>
      <button class="btn-start-feed" onclick="location.href='https://patholytica.com/dailyfeed.html?playlist=${libId}'">
        <i class="fas fa-play"></i> Start in Feed
      </button>
    </div>`;

  // Insert after the card's row — find the grid and insert after card's parent row
  const grid=document.getElementById('librariesGrid');
  const cards=[...grid.querySelectorAll('.library-card')];
  const idx=cards.indexOf(card);
  // Because it's a 2-col grid, insert after the row (every 2 cards)
  const rowEndIdx=idx%2===0?idx+1:idx;
  const nextEl=rowEndIdx<cards.length-1?cards[rowEndIdx+1]:null;
  if(nextEl){grid.insertBefore(panel,nextEl);}
  else{grid.appendChild(panel);}
}

  document.getElementById('confirmMsg').textContent=msg;
  _confirmCb=cb;
  const btn=document.getElementById('confirmActionBtn');
  btn.onclick=async()=>{btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Deleting…';await cb();btn.disabled=false;btn.innerHTML='<i class="fas fa-trash"></i> Delete';closeConfirmSheet();};
  document.getElementById('confirmSheet').classList.add('show');
}
window.closeConfirmSheet=function(){document.getElementById('confirmSheet').classList.remove('show');_confirmCb=null;};
document.getElementById('confirmSheet').addEventListener('click',e=>{if(e.target===e.currentTarget)closeConfirmSheet();});

/* ── Edit article ── */
window.openEditArticle=function(e,id){
  e.stopPropagation();
  const a=articles.find(x=>x.id===id);if(!a)return;
  editingArticleId=id;
  document.getElementById('editArticleTitle').value=a.title||'';
  document.getElementById('editArticleContent').value=a.content||'';
  document.getElementById('editArticleSheet').classList.add('show');
};
window.closeEditArticle=function(){document.getElementById('editArticleSheet').classList.remove('show');editingArticleId=null;};
window.saveArticle=async function(){
  if(!editingArticleId)return;
  const title=document.getElementById('editArticleTitle').value.trim();
  const content=document.getElementById('editArticleContent').value.trim();
  if(!title){showNotif('Title required','warning');return;}
  const btn=document.getElementById('saveArticleBtn');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>';
  try{
    const{error}=await supabase.from('articles').update({title,content}).eq('id',editingArticleId);
    if(error)throw error;
    const idx=articles.findIndex(x=>x.id===editingArticleId);
    if(idx!==-1){articles[idx].title=title;articles[idx].content=content;}
    closeEditArticle();renderArticlesList();showNotif('Saved','success');
  }catch(err){showNotif('Failed to save','error');}
  btn.disabled=false;btn.innerHTML='<i class="fas fa-check"></i> Save';
};
document.getElementById('editArticleSheet').addEventListener('click',e=>{if(e.target===e.currentTarget)closeEditArticle();});

/* ── Edit library ── */
window.openEditLibrary=function(e,id){
  e.stopPropagation();
  const l=libraries.find(x=>x.id===id);if(!l)return;
  editingLibraryId=id;
  libThumbFile=null;libThumbCurrentUrl=l.thumbnail_url||null;
  document.getElementById('editLibraryName').value=l.name||'';
  document.getElementById('editLibraryDesc').value=l.description||'';
  const prev=document.getElementById('libThumbPreview');
  const placeholder=document.getElementById('libThumbPlaceholder');
  const actions=document.getElementById('libThumbActions');
  prev.querySelectorAll('img').forEach(img=>img.remove());
  if(l.thumbnail_url){
    const img=document.createElement('img');img.src=l.thumbnail_url;
    prev.insertBefore(img,placeholder);
    placeholder.style.display='none';actions.style.display='flex';
  } else {
    placeholder.style.display='flex';actions.style.display='none';
  }
  document.getElementById('editLibrarySheet').classList.add('show');
};
window.closeEditLibrary=function(){document.getElementById('editLibrarySheet').classList.remove('show');editingLibraryId=null;libThumbFile=null;};
window.handleLibThumb=function(input){
  const f=input.files[0];if(!f)return;
  if(f.size>5*1024*1024){showNotif('Max 5MB','warning');input.value='';return;}
  libThumbFile=f;
  const r=new FileReader();
  r.onload=ev=>{
    const prev=document.getElementById('libThumbPreview');
    const placeholder=document.getElementById('libThumbPlaceholder');
    prev.querySelectorAll('img').forEach(img=>img.remove());
    const img=document.createElement('img');img.src=ev.target.result;
    prev.insertBefore(img,placeholder);
    placeholder.style.display='none';
    document.getElementById('libThumbActions').style.display='flex';
  };
  r.readAsDataURL(f);
};
window.removeLibThumb=function(){
  const prev=document.getElementById('libThumbPreview');
  prev.querySelectorAll('img').forEach(img=>img.remove());
  document.getElementById('libThumbPlaceholder').style.display='flex';
  document.getElementById('libThumbActions').style.display='none';
  document.getElementById('libThumbInput').value='';
  libThumbFile=null;libThumbCurrentUrl=null;
};
window.saveLibrary=async function(){
  if(!editingLibraryId)return;
  const name=document.getElementById('editLibraryName').value.trim();
  const desc=document.getElementById('editLibraryDesc').value.trim();
  if(!name){showNotif('Name required','warning');return;}
  const btn=document.getElementById('saveLibraryBtn');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>';
  try{
    let thumbUrl=libThumbCurrentUrl;
    if(libThumbFile){
      const ext=libThumbFile.name.split('.').pop();
      const path=`library-thumbnails/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
      const{data,error:upErr}=await supabase.storage.from('media').upload(path,libThumbFile,{cacheControl:'3600',upsert:false});
      if(upErr)throw upErr;
      const{data:{publicUrl}}=supabase.storage.from('media').getPublicUrl(data.path);
      thumbUrl=publicUrl;
    }
    const{error}=await supabase.from('playlists').update({name,description:desc||null,thumbnail_url:thumbUrl||null}).eq('id',editingLibraryId);
    if(error)throw error;
    const idx=libraries.findIndex(x=>x.id===editingLibraryId);
    if(idx!==-1){libraries[idx].name=name;libraries[idx].description=desc;libraries[idx].thumbnail_url=thumbUrl||null;}
    closeEditLibrary();renderLibrariesGrid();showNotif('Library updated','success');
  }catch(err){console.error(err);showNotif('Failed to save','error');}
  btn.disabled=false;btn.innerHTML='<i class="fas fa-check"></i> Save';
};
document.getElementById('editLibrarySheet').addEventListener('click',e=>{if(e.target===e.currentTarget)closeEditLibrary();});

/* ── Edit Profile ── */
window.openEditProfile=function(){
  if(!currentUserData)return;
  const bio=currentUserData.bio||'';
  document.getElementById('bioInputEdit').value=bio;
  document.getElementById('bioCharCount').textContent=`${bio.length}/300`;
  const prev=document.getElementById('avatarPreviewCircle');
  const rb=document.getElementById('removeAvatarBtn');
  if(currentUserData.pfp){prev.innerHTML=`<img src="${currentUserData.pfp}">`;rb.style.display='flex';}
  else{prev.innerHTML=`<i class="fas fa-user"></i>`;rb.style.display='none';}
  selectedAvatarDataUrl=null;
  document.getElementById('editProfileSheet').classList.add('show');
};
window.closeEditProfile=function(){document.getElementById('editProfileSheet').classList.remove('show');selectedAvatarDataUrl=null;document.getElementById('fileInputAvatar').value='';};
window.handleAvatarSelect=function(event){
  const f=event.target.files[0];if(!f)return;
  if(f.size>2*1024*1024){showNotif('Max 2MB','warning');event.target.value='';return;}
  const r=new FileReader();
  r.onload=e=>{selectedAvatarDataUrl=e.target.result;document.getElementById('avatarPreviewCircle').innerHTML=`<img src="${selectedAvatarDataUrl}">`;document.getElementById('removeAvatarBtn').style.display='flex';};
  r.readAsDataURL(f);
};
window.removeAvatar=function(){selectedAvatarDataUrl='';document.getElementById('avatarPreviewCircle').innerHTML=`<i class="fas fa-user"></i>`;document.getElementById('removeAvatarBtn').style.display='none';document.getElementById('fileInputAvatar').value='';};
window.saveProfile=async function(){
  if(!currentUser||!isOwnProfile)return;
  const btn=document.getElementById('saveProfileBtn');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i>';
  try{
    const updateData={bio:document.getElementById('bioInputEdit').value.trim()};
    if(selectedAvatarDataUrl!==null)updateData.pfp=selectedAvatarDataUrl||null;
    const{error}=await supabase.from('users').update(updateData).eq('firebase_uid',currentUser.uid);
    if(error)throw error;
    const{data:refreshed}=await supabase.from('users').select('*').eq('firebase_uid',currentUser.uid).single();
    if(refreshed){currentUserData=refreshed;viewingUserData=refreshed;}
    closeEditProfile();renderHero(currentUserData);showNotif('Profile updated','success');
  }catch(err){showNotif('Failed to save','error');}
  btn.disabled=false;btn.innerHTML='<i class="fas fa-check"></i> Save';
};
document.getElementById('editProfileSheet').addEventListener('click',e=>{if(e.target===e.currentTarget)closeEditProfile();});

onAuthStateChanged(auth,async user=>{currentUser=user||null;await loadProfile(user);});
</script>
