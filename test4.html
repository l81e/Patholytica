<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Create — Patholytica</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #0f0e0b;
  --text: #f5f0e8;
  --sub: #8a8070;
  --hover: #1a1810;
  --border: #2a2518;
  --accent: #c8a96e;
  --accent-h: #b8935a;
  --accent-glow: rgba(200,169,110,0.25);
  --accent-soft: rgba(200,169,110,0.12);
}
body.light-theme {
  --bg: #faf6ee;
  --text: #1a1710;
  --sub: #706050;
  --hover: #f0ebe0;
  --border: #e0d8c8;
  --accent: #a07840;
  --accent-h: #8a6430;
  --accent-glow: rgba(160,120,64,0.2);
  --accent-soft: rgba(160,120,64,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "DM Sans", sans-serif;
  background: var(--bg); color: var(--text);
  overflow: hidden; position: fixed; width: 100%; height: 100%;
  transition: background .2s, color .2s;
}
.app {
  position: fixed; top:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:450px; height:100vh;
  background: var(--bg); display:flex; flex-direction:column;
}

/* ── Header ── */
.header {
  flex-shrink:0; display:flex; align-items:center; gap:10px;
  padding: 10px 16px;
  padding-top: calc(10px + env(safe-area-inset-top));
  border-bottom: 1px solid var(--border);
  background: rgba(15,14,11,0.96);
  backdrop-filter: blur(20px);
}
body.light-theme .header { background: rgba(250,246,238,0.96); }
.hdr-back {
  width:34px; height:34px; border-radius:50%;
  background: var(--hover); border: 1px solid var(--border);
  color: var(--text); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; transition: border-color .2s; flex-shrink:0;
}
.hdr-back:hover { border-color: var(--accent); color: var(--accent); }
.hdr-title { flex:1; font-size:14px; font-weight:700; font-family:'Merriweather',serif; }
.hdr-actions { display:flex; gap:8px; }
.hdr-btn {
  padding: 7px 14px; border-radius:20px;
  font-size:12px; font-weight:700;
  cursor:pointer; transition: all .15s;
  font-family:"DM Sans",sans-serif;
  display:flex; align-items:center; gap:5px;
}
.hdr-btn-ghost {
  background: var(--hover); border: 1px solid var(--border); color: var(--sub);
}
.hdr-btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
.hdr-btn-primary {
  background: var(--accent); color: #0f0e0b; border: none;
  box-shadow: 0 2px 10px var(--accent-glow);
}
.hdr-btn-primary:hover { background: var(--accent-h); }
.hdr-btn-primary:disabled { opacity:.35; cursor:not-allowed; }

/* ── Mode Tabs ── */
.mode-tabs {
  flex-shrink:0; display:flex;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
.mode-tab {
  flex:1; padding:10px 0; font-size:11px; font-weight:700;
  letter-spacing:.06em; text-transform:uppercase;
  background:none; border:none; color: var(--sub);
  cursor:pointer; position:relative; font-family:"DM Sans",sans-serif;
  transition: color .15s;
}
.mode-tab.active { color: var(--accent); }
.mode-tab.active::after {
  content:''; position:absolute; bottom:0; left:20%; right:20%;
  height:2px; background: var(--accent); border-radius:2px 2px 0 0;
}

/* ── Scrollable body ── */
.editor-body {
  flex:1; overflow-y:auto; overflow-x:hidden;
  padding: 0 0 140px;
}
.editor-body::-webkit-scrollbar { width:2px; }
.editor-body::-webkit-scrollbar-thumb { background: var(--border); border-radius:2px; }

/* ── Preview header (mimics feed) ── */
.preview-author-bar {
  display:flex; align-items:center; gap:10px;
  padding: 14px 18px 0;
}
.preview-avatar {
  width:38px; height:38px; border-radius:50%;
  background: linear-gradient(135deg, var(--accent), #8a6430);
  display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:700; color:#0f0e0b;
  flex-shrink:0; overflow:hidden;
}
.preview-avatar img { width:100%; height:100%; object-fit:cover; }
.preview-author-info { flex:1; }
.preview-author-name { font-size:13px; font-weight:700; }
.preview-author-date { font-size:10px; color: var(--sub); }

/* ── Title input ── */
.title-wrap { padding: 10px 18px 4px; }
.title-input {
  font-size:20px; font-weight:800; color: var(--text);
  line-height:1.2; letter-spacing:-0.02em;
  font-family:'Merriweather',serif;
  border:none; outline:none; background:transparent;
  width:100%; resize:none; overflow:hidden; padding:0;
}
.title-input::placeholder { color: var(--sub); opacity:.5; }

/* ── Stats bar ── */
.stats-preview {
  display:flex; gap:14px; padding: 6px 18px 8px;
  border-bottom: 1px solid var(--border);
}
.stat-chip { display:flex; align-items:center; gap:4px; font-size:11px; color: var(--sub); }
.stat-chip i { font-size:10px; }

/* ── Content area ── */
.content-wrap { padding: 12px 18px 0; }
.content-input {
  font-size:14px; line-height:1.7; color: var(--text);
  border:none; outline:none; background:transparent;
  width:100%; resize:none; min-height:200px;
  font-family:"DM Sans",sans-serif; letter-spacing:.01em;
}
.content-input::placeholder { color: var(--sub); opacity:.45; }

/* ── Media list in editor ── */
.media-list { padding: 8px 18px 0; display:flex; flex-direction:column; gap:8px; }
.media-row {
  display:flex; align-items:center; gap:10px;
  background: var(--hover); border: 1px solid var(--border);
  border-radius:10px; padding:8px 10px; position:relative;
}
.media-row-icon {
  width:30px; height:30px; border-radius:7px;
  display:flex; align-items:center; justify-content:center;
  font-size:12px; flex-shrink:0;
}
.media-row-icon.img { background:rgba(59,130,246,.15); color:#60a5fa; }
.media-row-icon.aud { background:rgba(168,85,247,.15); color:#c084fc; }
.media-row-icon.yt  { background:rgba(239,68,68,.15);  color:#f87171; }
.media-row-info { flex:1; min-width:0; }
.media-row-name { font-size:11px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.media-caption-input {
  width:100%; background:transparent; border:none; outline:none;
  font-size:10px; color: var(--sub); font-family:"DM Sans",sans-serif; margin-top:2px;
}
.media-caption-input::placeholder { color: var(--sub); opacity:.5; }
.media-thumb { width:36px; height:36px; border-radius:6px; object-fit:cover; flex-shrink:0; }
.media-remove {
  width:20px; height:20px; border-radius:50%;
  background:rgba(239,68,68,.12); border:none; color:#f87171;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-size:9px; flex-shrink:0;
}
.media-remove:hover { background:rgba(239,68,68,.25); }

/* ── Library selector ── */
.library-section {
  margin: 14px 18px 0;
  background: var(--hover); border: 1px solid var(--border);
  border-radius:12px; overflow:hidden;
}
.library-section-header {
  display:flex; align-items:center; gap:8px; padding:11px 14px;
  cursor:pointer; user-select:none;
}
.library-section-header i { font-size:13px; color: var(--accent); }
.library-section-label { font-size:12px; font-weight:700; flex:1; }
.library-section-val { font-size:11px; color: var(--sub); }
.library-section-chevron { font-size:10px; color: var(--sub); transition: transform .2s; }
.library-section.open .library-section-chevron { transform:rotate(180deg); }
.library-dropdown { display:none; border-top: 1px solid var(--border); max-height:180px; overflow-y:auto; }
.library-section.open .library-dropdown { display:block; }
.library-dropdown::-webkit-scrollbar { width:2px; }
.library-dropdown::-webkit-scrollbar-thumb { background: var(--border); }
.library-option {
  display:flex; align-items:center; gap:10px; padding:10px 14px;
  cursor:pointer; transition: background .12s;
}
.library-option:hover { background: var(--bg); }
.library-option.selected { background: var(--accent-soft); }
.library-option-thumb {
  width:32px; height:32px; border-radius:6px; overflow:hidden; flex-shrink:0;
  background: var(--bg); border: 1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size:13px; color: var(--sub);
}
.library-option-thumb img { width:100%; height:100%; object-fit:cover; }
.library-option-name { font-size:12px; font-weight:600; flex:1; }
.library-option-check { font-size:11px; color: var(--accent); display:none; }
.library-option.selected .library-option-check { display:block; }
.lib-none-option { padding:10px 14px; font-size:12px; color: var(--sub); cursor:pointer; }
.lib-none-option:hover { background: var(--bg); }

/* ── MCQ editor ── */
.mcq-badge-edit {
  margin: 12px 18px 8px; display:inline-flex; align-items:center; gap:6px;
  background: var(--accent-soft); border: 1px solid rgba(200,169,110,0.3);
  border-radius:20px; padding:4px 12px;
  font-size:10px; font-weight:800; letter-spacing:.08em;
  text-transform:uppercase; color: var(--accent);
}
.mcq-question-wrap { padding: 0 18px 10px; }
.mcq-question-input {
  font-size:18px; font-weight:800; color: var(--text);
  line-height:1.3; letter-spacing:-0.02em;
  font-family:'Merriweather',serif;
  border:none; outline:none; background:transparent;
  width:100%; resize:none; overflow:hidden; padding:0;
  padding-right:50px;
}
.mcq-question-input::placeholder { color: var(--sub); opacity:.45; }
.mcq-options-wrap { padding: 0 18px; display:flex; flex-direction:column; gap:8px; }
.mcq-opt-row {
  display:flex; align-items:center; gap:10px;
  border: 1px solid var(--border); border-radius:12px;
  padding:11px 13px; background: var(--hover);
  transition: border-color .15s;
}
.mcq-opt-row.correct-opt { border-color: rgba(106,191,133,0.6); background:rgba(106,191,133,0.06); }
.mcq-opt-letter {
  width:24px; height:24px; border-radius:50%;
  border: 1.5px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size:9px; font-weight:800; color: var(--sub); flex-shrink:0;
}
.mcq-opt-row.correct-opt .mcq-opt-letter { background:#6abf85; border-color:#6abf85; color:#0f0e0b; }
.mcq-opt-input {
  flex:1; background:transparent; border:none; outline:none;
  font-size:13px; font-weight:500; color: var(--text);
  font-family:"DM Sans",sans-serif;
}
.mcq-opt-input::placeholder { color: var(--sub); opacity:.45; }
.mcq-opt-correct-btn {
  width:22px; height:22px; border-radius:50%; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:9px; flex-shrink:0; transition: all .15s;
  background: var(--bg); color: var(--sub);
}
.mcq-opt-row.correct-opt .mcq-opt-correct-btn { background:#6abf85; color:#0f0e0b; }
.mcq-opt-remove {
  width:20px; height:20px; border-radius:50%; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  font-size:9px; flex-shrink:0; background:transparent; color: var(--sub);
}
.mcq-opt-remove:hover { color:#f87171; }
.mcq-add-opt {
  margin: 8px 18px 0; padding:10px; border-radius:10px;
  border: 1px dashed var(--border); background:transparent;
  color: var(--sub); font-size:12px; font-weight:600; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:6px;
  font-family:"DM Sans",sans-serif; transition: border-color .15s, color .15s;
  width:calc(100% - 36px);
}
.mcq-add-opt:hover { border-color: var(--accent); color: var(--accent); }

/* ── Bottom toolbar ── */
.bottom-toolbar {
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:450px;
  background: rgba(15,14,11,0.96);
  border-top: 1px solid var(--border);
  backdrop-filter:blur(20px);
  padding: 10px 16px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
  display:flex; gap:8px; z-index:100;
}
body.light-theme .bottom-toolbar { background: rgba(250,246,238,0.96); }
.tool-btn {
  display:flex; align-items:center; justify-content:center; gap:6px;
  padding: 9px 12px; border-radius:10px;
  border: 1px solid var(--border); background: var(--hover);
  color: var(--sub); font-size:11px; font-weight:700;
  cursor:pointer; transition: all .15s; font-family:"DM Sans",sans-serif;
}
.tool-btn:hover { border-color: var(--accent); color: var(--accent); }
.tool-btn i { font-size:13px; }
.tool-btn label { cursor:pointer; display:flex; align-items:center; gap:6px; }

/* ── Edit existing sheet ── */
.sheet-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.8);
  z-index:200; display:none; align-items:flex-end; justify-content:center;
  backdrop-filter:blur(4px);
}
.sheet-overlay.show { display:flex; }
.sheet {
  background:#141210; border-radius:20px 20px 0 0;
  border: 1px solid var(--border); border-bottom:none;
  width:100%; max-width:450px; max-height:85vh;
  display:flex; flex-direction:column;
  animation: slideUp .3s cubic-bezier(.4,0,.2,1);
  padding-bottom: env(safe-area-inset-bottom);
}
@keyframes slideUp { from{transform:translateY(100%);opacity:0} to{transform:translateY(0);opacity:1} }
.sheet-handle { width:36px; height:4px; background: var(--border); border-radius:2px; margin:12px auto 0; flex-shrink:0; }
.sheet-header {
  padding:12px 18px 10px; display:flex; align-items:center; justify-content:space-between;
  border-bottom: 1px solid var(--border); flex-shrink:0;
}
.sheet-title { font-size:14px; font-weight:700; font-family:'Merriweather',serif; }
.sheet-close {
  width:28px; height:28px; border-radius:50%;
  background: var(--hover); border: 1px solid var(--border);
  color: var(--text); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:11px;
}
.sheet-body { flex:1; overflow-y:auto; padding:14px 18px; }
.sheet-body::-webkit-scrollbar { width:2px; }
.sheet-body::-webkit-scrollbar-thumb { background: var(--border); }
.edit-article-item {
  display:flex; align-items:flex-start; gap:10px; padding:12px;
  background: var(--hover); border: 1px solid var(--border);
  border-radius:10px; margin-bottom:8px; cursor:pointer;
  transition: border-color .15s;
}
.edit-article-item:hover { border-color: var(--accent); }
.edit-article-item-body { flex:1; min-width:0; }
.edit-article-title { font-size:13px; font-weight:700; margin-bottom:3px; line-height:1.3; font-family:'Merriweather',serif; }
.edit-article-meta { font-size:10px; color: var(--sub); }
.edit-article-badge {
  font-size:9px; font-weight:700; padding:2px 6px; border-radius:4px;
  background:rgba(74,222,128,.12); color:#4ade80; flex-shrink:0;
}

/* ── YT input ── */
.yt-row { display:flex; gap:6px; align-items:center; margin-top:8px; padding:0 18px; }
.yt-input {
  flex:1; padding:8px 12px; background: var(--hover);
  border: 1px solid var(--border); border-radius:8px; outline:none;
  font-size:12px; color: var(--text); font-family:"DM Sans",sans-serif;
  transition: border-color .15s;
}
.yt-input:focus { border-color:#f87171; }
.yt-input::placeholder { color: var(--sub); opacity:.5; }
.yt-add { padding:8px 12px; background:rgba(239,68,68,.15); border:1px solid rgba(239,68,68,.3); border-radius:8px; color:#f87171; font-size:11px; font-weight:700; cursor:pointer; white-space:nowrap; }
.yt-cancel { padding:8px 10px; background:transparent; border:1px solid var(--border); border-radius:8px; color: var(--sub); font-size:11px; cursor:pointer; }

/* ── Toast ── */
.toast {
  position:fixed; top: calc(60px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
  background:#141210; border: 1px solid var(--border); border-radius:10px;
  padding:10px 16px; font-size:12px; font-weight:600; color: var(--text);
  z-index:9999; opacity:0; pointer-events:none;
  transition: opacity .2s, transform .2s; white-space:nowrap;
  box-shadow: 0 8px 32px rgba(0,0,0,.5);
}
.toast.success { border-left:3px solid #6abf85; }
.toast.error   { border-left:3px solid #c46a4e; }
.toast.show { opacity:1; }

/* ── Spinner ── */
.spinner { width:18px; height:18px; border:2px solid var(--border); border-top-color: var(--accent); border-radius:50%; animation:spin .8s linear infinite; display:inline-block; }
@keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<script>if(localStorage.getItem('theme')==='light')document.body.classList.add('light-theme');</script>

<div class="app">

  <!-- Header -->
  <div class="header">
    <button class="hdr-back" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
    <div class="hdr-title" id="hdrTitle">New Article</div>
    <div class="hdr-actions">
      <button class="hdr-btn hdr-btn-ghost" onclick="openEditSheet()"><i class="fas fa-folder-open"></i> Edit Existing</button>
      <button class="hdr-btn hdr-btn-primary" id="publishBtn" onclick="publishArticle()">Publish</button>
    </div>
  </div>

  <!-- Mode tabs -->
  <div class="mode-tabs">
    <button class="mode-tab active" id="tabArticle" onclick="switchMode('article')"><i class="fas fa-file-alt"></i> Article</button>
    <button class="mode-tab" id="tabMCQ" onclick="switchMode('mcq')"><i class="fas fa-question-circle"></i> MCQ</button>
  </div>

  <!-- Editor body -->
  <div class="editor-body" id="editorBody">

    <!-- Preview author bar -->
    <div class="preview-author-bar">
      <div class="preview-avatar" id="previewAvatar">?</div>
      <div class="preview-author-info">
        <div class="preview-author-name" id="previewAuthorName">@username</div>
        <div class="preview-author-date" id="previewAuthorDate">Just now</div>
      </div>
    </div>

    <!-- Article mode -->
    <div id="articleMode">
      <div class="title-wrap">
        <textarea class="title-input" id="titleInput" placeholder="Article Title" rows="1" oninput="autoResize(this)"></textarea>
      </div>
      <div class="stats-preview">
        <div class="stat-chip"><i class="fas fa-eye"></i> 0 views</div>
        <div class="stat-chip"><i class="fas fa-heart"></i> 0 likes</div>
      </div>
      <div class="content-wrap">
        <textarea class="content-input" id="contentInput" placeholder="Start writing your article…" rows="8" oninput="autoResize(this)"></textarea>
      </div>
    </div>

    <!-- MCQ mode -->
    <div id="mcqMode" style="display:none;">
      <div class="mcq-badge-edit"><i class="fas fa-question-circle"></i> Quick Question</div>
      <div class="mcq-question-wrap">
        <textarea class="mcq-question-input" id="mcqQuestion" placeholder="Type your question here…" rows="2" oninput="autoResize(this)"></textarea>
      </div>
      <div class="mcq-options-wrap" id="mcqOptionsWrap"></div>
      <button class="mcq-add-opt" onclick="addMCQOption()"><i class="fas fa-plus"></i> Add Option</button>
    </div>

    <!-- Media list -->
    <div class="media-list" id="mediaList"></div>

    <!-- YT input (hidden by default) -->
    <div id="ytInputArea" style="display:none;">
      <div class="yt-row">
        <input class="yt-input" id="ytUrlInput" placeholder="Paste YouTube URL…">
        <button class="yt-add" onclick="addYouTube()">Add</button>
        <button class="yt-cancel" onclick="document.getElementById('ytInputArea').style.display='none'"><i class="fas fa-times"></i></button>
      </div>
    </div>

    <!-- Library selector -->
    <div class="library-section" id="librarySection">
      <div class="library-section-header" onclick="toggleLibraryDropdown()">
        <i class="fas fa-book-open"></i>
        <span class="library-section-label">Add to Library</span>
        <span class="library-section-val" id="libSectionVal">None</span>
        <i class="fas fa-chevron-down library-section-chevron"></i>
      </div>
      <div class="library-dropdown" id="libraryDropdown">
        <div class="lib-none-option" onclick="selectLibrary(null,'None')">None (publish standalone)</div>
        <div id="libraryOptions">
          <div style="padding:12px 14px;font-size:11px;color:var(--sub);">Loading libraries…</div>
        </div>
      </div>
    </div>

    <div style="height:14px;"></div>

  </div><!-- end editor-body -->

  <!-- Bottom toolbar -->
  <div class="bottom-toolbar">
    <button class="tool-btn" onclick="toggleTheme()" style="flex-shrink:0; padding:9px;">
      <i class="fas fa-circle-half-stroke"></i>
    </button>
    <label class="tool-btn" style="flex:1;">
      <i class="fas fa-image"></i> Image
      <input type="file" accept="image/*" style="display:none;" onchange="handleImage(event)">
    </label>
    <label class="tool-btn" style="flex:1;">
      <i class="fas fa-music"></i> Audio
      <input type="file" accept="audio/*" style="display:none;" onchange="handleAudio(event)">
    </label>
    <button class="tool-btn" style="flex:1;" onclick="document.getElementById('ytInputArea').style.display='flex'">
      <i class="fab fa-youtube"></i> YouTube
    </button>
  </div>

</div><!-- end app -->

<!-- Edit Existing Sheet -->
<div class="sheet-overlay" id="editSheet">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <span class="sheet-title">Edit Existing Article</span>
      <button class="sheet-close" onclick="closeEditSheet()"><i class="fas fa-times"></i></button>
    </div>
    <div class="sheet-body" id="editSheetBody">
      <div style="display:flex;align-items:center;justify-content:center;padding:30px;gap:10px;color:var(--sub);font-size:12px;">
        <div class="spinner"></div> Loading…
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function goBack(){
  if(document.referrer&&document.referrer.includes(location.host))history.back();
  else location.href='index.html';
}
function toggleTheme(){
  document.body.classList.toggle('light-theme');
  localStorage.setItem('theme',document.body.classList.contains('light-theme')?'light':'dark');
}
function autoResize(el){el.style.height='auto';el.style.height=el.scrollHeight+'px';}
function showToast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast '+type+' show';
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),3000);
}
function toggleLibraryDropdown(){
  document.getElementById('librarySection').classList.toggle('open');
}

let mode='article';
function switchMode(m){
  mode=m;
  document.getElementById('articleMode').style.display=m==='article'?'block':'none';
  document.getElementById('mcqMode').style.display=m==='mcq'?'block':'none';
  document.getElementById('tabArticle').classList.toggle('active',m==='article');
  document.getElementById('tabMCQ').classList.toggle('active',m==='mcq');
  document.getElementById('hdrTitle').textContent=m==='article'?'New Article':'New MCQ';
  if(m==='mcq'&&document.querySelectorAll('.mcq-opt-row').length===0){
    addMCQOption(); addMCQOption(); addMCQOption(); addMCQOption();
    document.querySelectorAll('.mcq-opt-row')[0].classList.add('correct-opt');
  }
}

/* ── MCQ Options ── */
const letters=['A','B','C','D','E','F'];
function addMCQOption(){
  const wrap=document.getElementById('mcqOptionsWrap');
  const i=wrap.children.length;
  if(i>=6)return;
  const row=document.createElement('div');
  row.className='mcq-opt-row'; row.dataset.idx=i;
  row.innerHTML=`
    <div class="mcq-opt-letter">${letters[i]||i+1}</div>
    <input class="mcq-opt-input" placeholder="Option ${letters[i]||i+1}…">
    <button class="mcq-opt-correct-btn" title="Mark correct" onclick="markCorrect(this)"><i class="fas fa-check"></i></button>
    <button class="mcq-opt-remove" title="Remove" onclick="removeMCQOpt(this)"><i class="fas fa-times"></i></button>`;
  wrap.appendChild(row);
}
function markCorrect(btn){
  document.querySelectorAll('.mcq-opt-row').forEach(r=>r.classList.remove('correct-opt'));
  btn.closest('.mcq-opt-row').classList.add('correct-opt');
}
function removeMCQOpt(btn){
  const wrap=document.getElementById('mcqOptionsWrap');
  if(wrap.children.length<=2)return;
  btn.closest('.mcq-opt-row').remove();
  [...wrap.children].forEach((r,i)=>{
    r.dataset.idx=i;
    r.querySelector('.mcq-opt-letter').textContent=letters[i]||i+1;
    r.querySelector('.mcq-opt-input').placeholder=`Option ${letters[i]||i+1}…`;
  });
}

/* ── Media ── */
let mediaItems=[];
function renderMediaList(){
  const list=document.getElementById('mediaList');
  list.innerHTML='';
  mediaItems.forEach((m,i)=>{
    const row=document.createElement('div'); row.className='media-row';
    let iconHtml,previewHtml='';
    if(m.type==='image'){iconHtml=`<div class="media-row-icon img"><i class="fas fa-image"></i></div>`;previewHtml=`<img class="media-thumb" src="${m.dataUrl}">`;}
    else if(m.type==='audio'){iconHtml=`<div class="media-row-icon aud"><i class="fas fa-music"></i></div>`;}
    else if(m.type==='youtube'){iconHtml=`<div class="media-row-icon yt"><i class="fab fa-youtube"></i></div>`;previewHtml=`<img class="media-thumb" src="https://img.youtube.com/vi/${m.ytId}/mqdefault.jpg">`;}
    row.innerHTML=`${iconHtml}<div class="media-row-info"><div class="media-row-name">${m.name}</div><input class="media-caption-input" placeholder="Caption (optional)" value="${m.caption||''}" oninput="mediaItems[${i}].caption=this.value"></div>${previewHtml}<button class="media-remove" onclick="removeMedia(${i})"><i class="fas fa-times"></i></button>`;
    list.appendChild(row);
  });
}
function removeMedia(i){mediaItems.splice(i,1);renderMediaList();}
function handleImage(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{mediaItems.push({type:'image',name:f.name,dataUrl:ev.target.result,file:f,caption:''});renderMediaList();};
  r.readAsDataURL(f); e.target.value='';
}
function handleAudio(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{mediaItems.push({type:'audio',name:f.name,dataUrl:ev.target.result,file:f,caption:''});renderMediaList();};
  r.readAsDataURL(f); e.target.value='';
}
function extractYtId(url){
  const m=url.match(/(?:youtu\.be\/|v=|\/v\/|embed\/|shorts\/)([A-Za-z0-9_\-]{11})/);
  return m?m[1]:null;
}
function addYouTube(){
  const url=document.getElementById('ytUrlInput').value.trim();
  if(!url)return;
  const id=extractYtId(url);
  if(!id){showToast('Invalid YouTube URL','error');return;}
  mediaItems.push({type:'youtube',name:`YouTube: ${id}`,ytId:id,url:`https://www.youtube.com/embed/${id}`,caption:''});
  renderMediaList();
  document.getElementById('ytUrlInput').value='';
  document.getElementById('ytInputArea').style.display='none';
}

/* ── Library ── */
let selectedLibraryId=null;
function selectLibrary(id,name){
  selectedLibraryId=id;
  document.getElementById('libSectionVal').textContent=name;
  document.getElementById('librarySection').classList.remove('open');
}
function toggleLibraryDropdown(){
  document.getElementById('librarySection').classList.toggle('open');
}

/* ── Edit existing sheet ── */
function openEditSheet(){
  document.getElementById('editSheet').classList.add('show');
  loadUserArticlesForEdit();
}
function closeEditSheet(){document.getElementById('editSheet').classList.remove('show');}
document.getElementById('editSheet').addEventListener('click',e=>{if(e.target===e.currentTarget)closeEditSheet();});

let _editArticles=[];
async function loadUserArticlesForEdit(){
  if(!window._supabase||!window._currentUser)return;
  const body=document.getElementById('editSheetBody');
  body.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;padding:30px;gap:10px;color:var(--sub);font-size:12px;"><div class="spinner"></div> Loading…</div>`;
  const {data,error}=await window._supabase.from('articles').select('*').eq('firebase_user_id',window._currentUser.uid).order('created_at',{ascending:false});
  if(error||!data||!data.length){
    body.innerHTML=`<div style="text-align:center;padding:30px;color:var(--sub);font-size:12px;">No articles found</div>`;return;
  }
  _editArticles=data;
  body.innerHTML='';
  data.forEach(a=>{
    const isMcq=a.content&&a.content.trimStart().startsWith('❔');
    const item=document.createElement('div');item.className='edit-article-item';
    item.innerHTML=`
      ${isMcq?`<span class="edit-article-badge">MCQ</span>`:''}
      <div class="edit-article-item-body">
        <div class="edit-article-title">${escHtml(a.title||'Untitled')}</div>
        <div class="edit-article-meta">${new Date(a.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>
      </div>
      <i class="fas fa-chevron-right" style="color:var(--sub);font-size:11px;"></i>`;
    item.onclick=()=>loadArticleForEdit(a);
    body.appendChild(item);
  });
}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function loadArticleForEdit(a){
  closeEditSheet();
  const isMcq=a.content&&a.content.trimStart().startsWith('❔');
  window._editingArticleId=a.id;
  document.getElementById('hdrTitle').textContent='Edit Article';
  document.getElementById('publishBtn').textContent='Save Changes';
  if(isMcq){
    switchMode('mcq');
    const lines=a.content.trim().split('\n').map(l=>l.trim()).filter(Boolean);
    document.getElementById('mcqQuestion').value=lines[0].replace(/^❔/,'').trim();
    autoResize(document.getElementById('mcqQuestion'));
    document.getElementById('mcqOptionsWrap').innerHTML='';
    lines.slice(1).forEach((line,i)=>{
      addMCQOption();
      const rows=document.querySelectorAll('.mcq-opt-row');
      const row=rows[i];
      if(!row)return;
      const isCorrect=line.startsWith('✅');
      row.querySelector('.mcq-opt-input').value=line.replace(/^✅/,'').trim();
      if(isCorrect){document.querySelectorAll('.mcq-opt-row').forEach(r=>r.classList.remove('correct-opt'));row.classList.add('correct-opt');}
    });
  } else {
    switchMode('article');
    document.getElementById('titleInput').value=a.title||'';
    autoResize(document.getElementById('titleInput'));
    document.getElementById('contentInput').value=a.content||'';
    autoResize(document.getElementById('contentInput'));
  }
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig={apiKey:"AIzaSyBs6V0yY14cuLBXB1nciZ-X0eyAiodC-Ak",authDomain:"patholytica.firebaseapp.com",databaseURL:"https://patholytica-default-rtdb.europe-west1.firebasedatabase.app",projectId:"patholytica",storageBucket:"patholytica.firebasestorage.app",messagingSenderId:"738430635282",appId:"1:738430635282:web:8451ef380447c7611137cb"};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const supabase=window.supabase.createClient("https://vduqewqyvszfquntmark.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZkdXFld3F5dnN6ZnF1bnRtYXJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk2MTg3MjgsImV4cCI6MjA4NTE5NDcyOH0.V2JellFmUGgYhKfW-D4CBdcBHyPztOlcgLCBdhnXj7c");
window._supabase=supabase;
window._editingArticleId=null;

let currentUser=null, currentUserData=null;

onAuthStateChanged(auth,async user=>{
  if(!user){location.href='login.html';return;}
  currentUser=user; window._currentUser=user;
  const{data:ud}=await supabase.from('users').select('*').eq('firebase_uid',user.uid).single();
  if(ud){
    currentUserData=ud;
    const av=document.getElementById('previewAvatar');
    const nm=document.getElementById('previewAuthorName');
    nm.textContent=ud.username?`@${ud.username}`:(ud.full_name||'You');
    if(ud.pfp){av.innerHTML=`<img src="${ud.pfp}" alt="pfp">`;}
    else{av.textContent=(ud.username||'U')[0].toUpperCase();}
  }
  loadLibraries();
});

async function loadLibraries(){
  if(!currentUserData)return;
  const{data:libs}=await supabase.from('playlists').select('id,name,thumbnail_url').eq('user_id',currentUserData.user_id).order('name',{ascending:true});
  const wrap=document.getElementById('libraryOptions');
  if(!libs||!libs.length){wrap.innerHTML=`<div style="padding:10px 14px;font-size:11px;color:var(--sub);">No libraries yet</div>`;return;}
  wrap.innerHTML='';
  libs.forEach(lib=>{
    const opt=document.createElement('div');opt.className='library-option';
    const thumbHtml=lib.thumbnail_url?`<img src="${lib.thumbnail_url}">`:`<i class="fas fa-book-open"></i>`;
    opt.innerHTML=`<div class="library-option-thumb">${thumbHtml}</div><span class="library-option-name">${escHtml(lib.name)}</span><i class="fas fa-check library-option-check"></i>`;
    opt.onclick=()=>{
      document.querySelectorAll('.library-option').forEach(o=>o.classList.remove('selected'));
      opt.classList.add('selected');
      selectLibrary(lib.id,lib.name);
    };
    wrap.appendChild(opt);
  });
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

window.publishArticle=async function(){
  if(!currentUser){showToast('Not logged in','error');return;}
  const btn=document.getElementById('publishBtn');
  const isEditing=!!window._editingArticleId;

  if(mode==='article'){
    const title=document.getElementById('titleInput').value.trim();
    const content=document.getElementById('contentInput').value.trim();
    if(!title){showToast('Title required','error');return;}
    if(!content){showToast('Content required','error');return;}
    btn.disabled=true;btn.innerHTML='<div class="spinner"></div>';
    try{
      let artId;
      if(isEditing){
        const{error}=await supabase.from('articles').update({title,content}).eq('id',window._editingArticleId);
        if(error)throw error;
        artId=window._editingArticleId;
      } else {
        const{data:art,error}=await supabase.from('articles').insert([{title,content,firebase_user_id:currentUser.uid,views:0,likes:0}]).select().single();
        if(error)throw error;
        artId=art.id;
        if(mediaItems.length>0){
          const ins=mediaItems.map((m,i)=>({article_id:artId,type:m.type,url:m.dataUrl||m.url,caption:m.caption||null,display_order:i}));
          await supabase.from('media').insert(ins);
        }
        if(selectedLibraryId){
          await supabase.from('playlist_items').insert([{playlist_id:selectedLibraryId,article_id:artId}]);
        }
      }
      showToast(isEditing?'Saved!':'Published!','success');
      setTimeout(()=>{location.href=`https://patholytica.com/dailyfeed.html?article=${artId}`;},1000);
    }catch(e){showToast('Error: '+e.message,'error');btn.disabled=false;btn.textContent=isEditing?'Save Changes':'Publish';}
  } else {
    // MCQ
    const question=document.getElementById('mcqQuestion').value.trim();
    if(!question){showToast('Question required','error');return;}
    const rows=[...document.querySelectorAll('.mcq-opt-row')];
    if(rows.length<2){showToast('Need at least 2 options','error');return;}
    const hasCorrect=rows.some(r=>r.classList.contains('correct-opt'));
    if(!hasCorrect){showToast('Mark one correct answer','error');return;}
    const contentLines=['❔'+question,...rows.map(r=>{const inp=r.querySelector('.mcq-opt-input').value.trim();const correct=r.classList.contains('correct-opt');return correct?'✅'+inp:inp;})];
    const content=contentLines.join('\n');
    btn.disabled=true;btn.innerHTML='<div class="spinner"></div>';
    try{
      let artId;
      if(isEditing){
        const{error}=await supabase.from('articles').update({title:question,content}).eq('id',window._editingArticleId);
        if(error)throw error;
        artId=window._editingArticleId;
      } else {
        const{data:art,error}=await supabase.from('articles').insert([{title:question,content,firebase_user_id:currentUser.uid,views:0,likes:0}]).select().single();
        if(error)throw error;
        artId=art.id;
        if(selectedLibraryId){
          await supabase.from('playlist_items').insert([{playlist_id:selectedLibraryId,article_id:artId}]);
        }
      }
      showToast(isEditing?'Saved!':'Published!','success');
      setTimeout(()=>{location.href=`https://patholytica.com/dailyfeed.html?article=${artId}`;},1000);
    }catch(e){showToast('Error: '+e.message,'error');btn.disabled=false;btn.textContent=isEditing?'Save Changes':'Publish';}
  }
};
</script>
