<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Feed — Patholytica</title>
  <meta name="description" content="Patholytica medical education feed">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Patholytica">
  <meta property="og:title" content="Patholytica Feed" id="ogTitle">
  <meta property="og:description" content="Medical education content" id="ogDesc">
  <meta property="og:image" content="" id="ogImg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Patholytica Feed" id="twTitle">
  <meta name="twitter:description" content="Medical education content" id="twDesc">
  <meta name="twitter:image" content="" id="twImg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:          #000000;
      --g1:          rgba(255,255,255,0.05);
      --g2:          rgba(255,255,255,0.08);
      --g3:          rgba(255,255,255,0.12);
      --border:      rgba(255,255,255,0.08);
      --border-hi:   rgba(255,255,255,0.18);
      --text-1:      rgba(255,255,255,0.92);
      --text-2:      rgba(255,255,255,0.40);
      --text-3:      rgba(255,255,255,0.18);
      --white:       #ffffff;
      --blur-sm:     blur(12px);
      --blur-md:     blur(20px);
      --blur-lg:     blur(32px);
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: "DM Sans", -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-1);
      overflow: hidden;
      position: fixed;
      width: 100%; height: 100%;
    }

    /* subtle grain overlay */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      opacity: 0.4;
    }

    .app {
      position: fixed; top:0; left:50%; transform:translateX(-50%);
      width:100%; max-width:460px; height:100vh; z-index:1;
    }

    /* ── FEED ── */
    .feed {
      height:100vh; overflow-y:scroll;
      scroll-snap-type:y mandatory; scrollbar-width:none;
    }
    .feed::-webkit-scrollbar { display:none; }

    /* ── SKELETON ── */
    @keyframes pulse { 0%,100%{opacity:.15} 50%{opacity:.35} }
    .sk { background: var(--g1); border-radius:6px; animation:pulse 2s infinite; }
    .skeleton-card {
      height:100vh; scroll-snap-align:start;
      background:var(--bg);
      padding: calc(env(safe-area-inset-top)+16px) 20px 110px;
      display:flex; flex-direction:column; gap:14px;
    }
    .sk-row { display:flex; gap:10px; align-items:center; }
    .sk-av  { width:38px; height:38px; border-radius:50%; flex-shrink:0; }
    .sk-col { flex:1; display:flex; flex-direction:column; gap:6px; }
    .sk-l   { height:12px; width:100%; border-radius:4px; }
    .sk-l.w90{width:90%} .sk-l.w75{width:75%} .sk-l.w60{width:60%} .sk-l.w40{width:40%}

    /* ── CARD BASE ── */
    .card {
      position:relative; height:100vh;
      scroll-snap-align:start; scroll-snap-stop:always;
      background:var(--bg);
      display:flex; flex-direction:column;
    }

    /* ── GLASS PANEL (used in picker + overlays) ── */
    .glass {
      background: var(--g1);
      border: 1px solid var(--border);
      backdrop-filter: var(--blur-md);
      -webkit-backdrop-filter: var(--blur-md);
    }
    .glass-hi {
      background: var(--g2);
      border: 1px solid var(--border-hi);
      backdrop-filter: var(--blur-md);
      -webkit-backdrop-filter: var(--blur-md);
    }

    /* ── ARTICLE CARD ── */
    .article-card {
      padding-top: calc(env(safe-area-inset-top)+16px);
    }

    .card-header {
      display:flex; align-items:center; gap:11px;
      padding:0 18px; margin-bottom:12px; flex-shrink:0;
    }

    .avatar {
      width:38px; height:38px; border-radius:50%;
      background: var(--g2); border:1px solid var(--border-hi);
      display:flex; align-items:center; justify-content:center;
      font-size:14px; font-weight:700; color:var(--text-1);
      overflow:hidden; flex-shrink:0; cursor:pointer;
      backdrop-filter: var(--blur-sm);
      transition:opacity .15s, border-color .15s;
    }
    .avatar:hover { opacity:.8; border-color:rgba(255,255,255,.3); }
    .avatar img { width:100%; height:100%; object-fit:cover; }

    .author-meta { flex:1; }
    .author-name {
      font-size:13px; font-weight:700; color:var(--text-1);
      cursor:pointer; display:inline-block; letter-spacing:-.01em;
      transition:opacity .15s;
    }
    .author-name:hover { opacity:.6; }
    .post-date { font-size:11px; color:var(--text-2); margin-top:1px; }

    /* follow / edit */
    .hd-btn {
      width:30px; height:30px; border-radius:50%;
      background:var(--g1); border:1px solid var(--border);
      backdrop-filter:var(--blur-sm);
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      flex-shrink:0; overflow:hidden; position:relative;
      transition:border-color .2s, background .2s;
      -webkit-tap-highlight-color:transparent;
    }
    .hd-btn:active { transform:scale(.88); }
    .hd-btn .icon-plus, .hd-btn .icon-bell {
      position:absolute; width:13px; height:13px;
      transition:opacity .25s, transform .25s cubic-bezier(.34,1.56,.64,1);
    }
    .hd-btn .icon-plus { stroke:var(--text-2); fill:none; stroke-width:2; opacity:1; transform:scale(1) rotate(0deg); }
    .hd-btn .icon-bell { stroke:var(--text-1); fill:none; stroke-width:1.8; opacity:0; transform:scale(.4) rotate(-20deg); }
    .hd-btn.following { border-color:var(--border-hi); background:var(--g2); }
    .hd-btn.following .icon-plus { opacity:0; transform:scale(.4) rotate(90deg); }
    .hd-btn.following .icon-bell { opacity:1; transform:scale(1) rotate(0deg); }
    @keyframes bellRing { 0%{transform:scale(1) rotate(0)} 20%{transform:scale(1.2) rotate(-18deg)} 40%{transform:scale(1.15) rotate(14deg)} 60%{transform:scale(1.05) rotate(-8deg)} 100%{transform:scale(1) rotate(0)} }
    .hd-btn.ringing .icon-bell { animation:bellRing .5s ease forwards; }

    .edit-btn {
      width:30px; height:30px; border-radius:50%;
      background:var(--g2); border:1px solid var(--border-hi);
      backdrop-filter:var(--blur-sm); cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0; color:var(--text-1); font-size:10px;
      -webkit-tap-highlight-color:transparent;
      transition:border-color .2s;
    }
    .edit-btn:hover { border-color:rgba(255,255,255,.35); }
    .edit-btn:active { transform:scale(.88); }

    /* title */
    .card-title {
      font-size:19px; font-weight:800; font-family:'Merriweather',serif;
      color:var(--text-1); line-height:1.22; letter-spacing:-.02em;
      padding:0 18px; margin-bottom:8px; flex-shrink:0;
    }

    .card-stats {
      display:flex; align-items:center; gap:14px;
      padding:0 18px; margin-bottom:10px; flex-shrink:0;
    }
    .stat { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text-2); font-weight:600; }

    /* content */
    .card-content {
      flex:1; overflow-y:auto;
      padding:0 18px 18px; padding-right:62px; padding-bottom:110px;
      font-size:14px; line-height:1.72; color:var(--text-1);
      letter-spacing:.01em;
    }
    .card-content::-webkit-scrollbar { width:2px; }
    .card-content::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
    .para { margin-bottom:14px; }

    /* full-bleed media */
    .img-wrap {
      width:calc(100% + 80px); margin-left:-18px; margin-right:-62px;
      margin-bottom:14px; margin-top:4px; overflow:hidden;
    }
    .img-wrap img { width:100%; height:auto; display:block; max-height:300px; object-fit:cover; }
    .img-caption { font-size:11px; color:var(--text-2); font-style:italic; padding:5px 18px 0; }

    .yt-wrap {
      width:calc(100% + 80px); margin-left:-18px; margin-right:-62px;
      margin-bottom:14px; margin-top:4px;
    }
    .yt-wrap iframe { width:100%; aspect-ratio:16/9; border:none; display:block; }
    .yt-caption { font-size:11px; color:var(--text-2); font-style:italic; padding:5px 18px 0; }

    /* ghost comments */
    .ghost-cmts { margin-top:16px; padding-top:12px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:7px; }
    .ghost-cmt { font-size:11px; font-style:italic; color:var(--text-2); opacity:.55; line-height:1.5; padding-left:10px; border-left:1px solid var(--border-hi); }
    .ghost-auth { font-weight:700; font-style:normal; opacity:.7; margin-right:4px; }

    /* ── SIDE ACTIONS ── */
    .side-actions {
      position:absolute; right:12px; bottom:116px;
      display:flex; flex-direction:column; gap:16px; z-index:10;
    }
    .act-btn {
      display:flex; flex-direction:column; align-items:center; gap:4px;
      background:none; border:none; cursor:pointer;
      -webkit-tap-highlight-color:transparent; transition:transform .1s;
    }
    .act-btn:active { transform:scale(.84); }
    .act-icon {
      width:44px; height:44px; border-radius:50%;
      background:rgba(0,0,0,.55);
      border:1px solid var(--border);
      backdrop-filter:var(--blur-md);
      -webkit-backdrop-filter:var(--blur-md);
      display:flex; align-items:center; justify-content:center;
      transition:border-color .2s, background .2s;
    }
    .act-btn:hover .act-icon { border-color:var(--border-hi); background:rgba(255,255,255,.06); }
    .act-btn svg { width:19px; height:19px; stroke:var(--text-1); fill:none; stroke-width:1.8; }
    .act-label { font-size:10px; font-weight:700; color:var(--text-2); letter-spacing:.02em; }

    .like-btn svg { transition:fill .2s, stroke .2s; }
    .like-btn.liked svg { fill:var(--white); stroke:var(--white); }
    .like-btn.liked .act-icon { background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.25); }

    /* heart burst */
    .heart-burst { position:fixed; pointer-events:none; z-index:9999; transform:translate(-50%,-50%); animation:hbAnim .7s cubic-bezier(.16,1,.3,1) forwards; }
    .heart-burst svg { width:72px; height:72px; filter:drop-shadow(0 0 18px rgba(255,255,255,.5)); }
    @keyframes hbAnim { 0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-15deg)} 30%{opacity:1;transform:translate(-50%,-50%) scale(1.3) rotate(5deg)} 55%{opacity:1;transform:translate(-50%,-50%) scale(.9)} 100%{opacity:0;transform:translate(-50%,-50%) scale(.8) translateY(-20px)} }

    /* ── MCQ CARD ── */
    .mcq-card {
      padding-top:calc(env(safe-area-inset-top)+16px);
      padding-bottom:100px; overflow:hidden;
    }
    .mcq-badge {
      align-self:flex-start; display:inline-flex; align-items:center; gap:5px;
      margin:0 18px 14px;
      background:var(--g1); border:1px solid var(--border);
      backdrop-filter:var(--blur-sm); border-radius:20px;
      padding:4px 12px; font-size:10px; font-weight:800;
      letter-spacing:.08em; text-transform:uppercase; color:var(--text-2);
      flex-shrink:0;
    }
    .mcq-question {
      font-size:18px; font-weight:800; font-family:'Merriweather',serif;
      color:var(--text-1); line-height:1.3;
      padding:0 18px; margin-bottom:14px; padding-right:56px;
      flex-shrink:0; letter-spacing:-.02em;
    }
    .mcq-media { padding:0 18px; padding-right:64px; flex-shrink:0; margin-bottom:12px; }
    .mcq-scroll {
      flex:1; overflow-y:auto;
      padding:0 18px; padding-right:64px;
      display:flex; flex-direction:column; gap:8px;
    }
    .mcq-scroll::-webkit-scrollbar { width:2px; }
    .mcq-opts { display:flex; flex-direction:column; gap:8px; }

    .mcq-opt {
      display:flex; align-items:center; gap:10px;
      padding:12px 14px; border-radius:14px;
      border:1px solid var(--border); background:var(--g1);
      backdrop-filter:var(--blur-sm);
      cursor:pointer; width:100%; text-align:left;
      font-size:14px; font-weight:500; color:var(--text-1); line-height:1.4;
      transition:border-color .15s, background .15s;
      -webkit-tap-highlight-color:transparent;
    }
    .mcq-opt:hover:not(:disabled) { border-color:var(--border-hi); background:var(--g2); }
    .opt-pill {
      width:26px; height:26px; border-radius:8px;
      border:1px solid var(--border); flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      font-size:10px; font-weight:800; color:var(--text-2);
      transition:all .15s;
    }
    .mcq-opt .opt-text { flex:1; }
    .mcq-opt:disabled { cursor:default; }
    .mcq-opt.correct { border-color:rgba(255,255,255,.35); background:rgba(255,255,255,.06); }
    .mcq-opt.correct .opt-pill { background:var(--white); border-color:var(--white); color:#000; }
    .mcq-opt.wrong { border-color:rgba(255,255,255,.1); opacity:.5; }
    .mcq-opt.wrong .opt-pill { border-color:rgba(255,255,255,.2); }
    .mcq-opt.reveal { border-color:rgba(255,255,255,.25); }
    .mcq-opt.reveal .opt-pill { border-color:rgba(255,255,255,.4); color:var(--text-1); }

    .mcq-result { font-size:13px; font-weight:700; margin-top:12px; min-height:18px; color:var(--text-2); flex-shrink:0; }
    .mcq-result.ok { color:var(--text-1); }
    .mcq-result.no { color:var(--text-2); }

    /* ── LIBRARY PICKER ── */
    .picker-card {
      height:100vh; scroll-snap-align:start; scroll-snap-stop:always;
      background:var(--bg); display:flex; flex-direction:column; overflow:hidden;
    }
    .picker-header {
      flex-shrink:0;
      padding:calc(env(safe-area-inset-top)+16px) 20px 16px;
      border-bottom:1px solid var(--border);
      background:rgba(0,0,0,.6);
      backdrop-filter:var(--blur-md); -webkit-backdrop-filter:var(--blur-md);
    }
    .picker-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .picker-logo img { height:20px; width:auto; filter:brightness(0) invert(1); opacity:.8; }
    .picker-create {
      display:flex; align-items:center; gap:5px;
      padding:6px 13px; border-radius:20px;
      background:var(--g2); border:1px solid var(--border-hi);
      backdrop-filter:var(--blur-sm);
      color:var(--text-1); font-size:11px; font-weight:700;
      cursor:pointer; text-decoration:none; font-family:"DM Sans",sans-serif;
      transition:background .15s;
    }
    .picker-create:hover { background:var(--g3); }
    .picker-headline {
      font-size:22px; font-weight:900; font-family:'Merriweather',serif;
      color:var(--text-1); line-height:1.15; letter-spacing:-.03em; margin-bottom:4px;
    }
    .picker-sub { font-size:12px; color:var(--text-2); }

    .picker-body { flex:1; overflow-y:auto; overflow-x:hidden; padding:16px 20px 0; }
    .picker-body::-webkit-scrollbar { width:2px; }
    .picker-body::-webkit-scrollbar-thumb { background:var(--border); }

    .picker-count { font-size:11px; color:var(--text-2); font-weight:600; margin-bottom:12px; }

    .lib-list { display:flex; flex-direction:column; gap:8px; }

    .lib-pick {
      display:flex; align-items:center; gap:13px;
      padding:13px 15px; border-radius:16px;
      background:var(--g1); border:1px solid var(--border);
      backdrop-filter:var(--blur-sm); cursor:pointer;
      transition:border-color .2s, background .2s;
      -webkit-tap-highlight-color:transparent; position:relative;
    }
    .lib-pick:hover { border-color:var(--border-hi); background:var(--g2); }
    .lib-pick.selected { background:var(--g2); border-color:rgba(255,255,255,.3); }

    .lib-thumb {
      width:48px; height:48px; border-radius:10px; flex-shrink:0;
      overflow:hidden; background:var(--g2); border:1px solid var(--border);
      display:flex; align-items:center; justify-content:center;
      font-size:18px; font-weight:800; color:var(--text-3);
      font-family:'Merriweather',serif;
    }
    .lib-thumb img { width:100%; height:100%; object-fit:cover; }

    .lib-info { flex:1; min-width:0; }
    .lib-name { font-size:14px; font-weight:700; color:var(--text-1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:2px; transition:color .15s; }
    .lib-pick.selected .lib-name { color:var(--white); }
    .lib-meta { font-size:11px; color:var(--text-2); display:flex; align-items:center; gap:6px; }

    .lib-check {
      width:22px; height:22px; border-radius:50%;
      background:var(--white); flex-shrink:0;
      display:none; align-items:center; justify-content:center;
      font-size:11px; color:#000; font-weight:800;
    }
    .lib-pick.selected .lib-check { display:flex; }

    .picker-footer {
      flex-shrink:0; padding:14px 20px;
      padding-bottom:calc(16px + env(safe-area-inset-bottom) + 68px);
      border-top:1px solid var(--border);
      background:rgba(0,0,0,.7);
      backdrop-filter:var(--blur-md); -webkit-backdrop-filter:var(--blur-md);
    }
    .picker-go {
      width:100%; padding:15px; border-radius:14px;
      background:var(--white); color:#000;
      font-size:14px; font-weight:800; border:none; cursor:pointer;
      font-family:"DM Sans",sans-serif;
      transition:opacity .15s, transform .1s;
    }
    .picker-go:hover:not(:disabled) { opacity:.88; }
    .picker-go:active:not(:disabled) { transform:scale(.98); }
    .picker-go:disabled { opacity:.2; cursor:not-allowed; }
    .picker-hint-row { text-align:center; margin-top:10px; font-size:11px; color:var(--text-2); display:flex; align-items:center; justify-content:center; gap:6px; }

    @keyframes pickerExit { 0%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(.97) translateY(-16px)} }
    .picker-card.exiting { animation:pickerExit .3s ease forwards; pointer-events:none; }

    /* ── FOOTER BAR ── */
    .footer-bar {
      position:fixed; bottom:0; left:50%; transform:translateX(-50%);
      width:100%; max-width:460px;
      background:rgba(0,0,0,.75);
      border-top:1px solid var(--border);
      backdrop-filter:var(--blur-lg); -webkit-backdrop-filter:var(--blur-lg);
      padding:10px 32px;
      padding-bottom:calc(10px + env(safe-area-inset-bottom));
      display:flex; justify-content:space-around; align-items:center; z-index:100;
    }
    .foot-btn {
      display:flex; flex-direction:column; align-items:center; gap:3px;
      background:none; border:none; color:var(--text-3);
      cursor:pointer; transition:color .2s; padding:5px 16px;
    }
    .foot-btn.active { color:var(--text-1); }
    .foot-btn:hover { color:var(--text-2); }
    .foot-btn i { font-size:18px; }
    .foot-btn span { font-size:9px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; }

    /* ── COMMENTS POPUP ── */
    .cmt-overlay { position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:199; opacity:0; pointer-events:none; transition:opacity .3s; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
    .cmt-overlay.open { opacity:1; pointer-events:all; }
    .cmt-popup {
      position:fixed; top:50%; left:50%;
      transform:translate(-50%,-50%) scale(.92);
      width:calc(100% - 32px); max-width:460px;
      height:70vh; max-height:560px;
      background:rgba(8,8,8,.9);
      border:1px solid var(--border-hi);
      border-radius:22px; z-index:200;
      opacity:0; pointer-events:none;
      backdrop-filter:var(--blur-lg); -webkit-backdrop-filter:var(--blur-lg);
      transition:all .3s cubic-bezier(.4,0,.2,1);
      display:flex; flex-direction:column;
      box-shadow:0 32px 80px rgba(0,0,0,.8);
    }
    .cmt-popup.open { opacity:1; pointer-events:all; transform:translate(-50%,-50%) scale(1); }
    .cmt-hd { display:flex; align-items:center; justify-content:space-between; padding:15px 20px; border-bottom:1px solid var(--border); }
    .cmt-hd h3 { font-size:14px; font-weight:700; color:var(--text-1); }
    .cmt-close { background:var(--g1); border:1px solid var(--border); color:var(--text-1); font-size:16px; width:26px; height:26px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .cmt-close:hover { background:var(--g2); }
    .cmt-list { flex:1; overflow-y:auto; padding:12px 18px; }
    .cmt-list::-webkit-scrollbar { width:2px; }
    .cmt-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
    .cmt-item { display:flex; gap:9px; margin-bottom:16px; }
    .cmt-av { width:28px; height:28px; border-radius:50%; background:var(--g2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:var(--text-1); flex-shrink:0; overflow:hidden; }

<script>
/* ── CONFETTI (monochrome whites/greys) ── */
(function(){
  const c=document.getElementById('confetti'),ctx=c.getContext('2d');
  let P=[],af=null;
  function resize(){c.width=innerWidth;c.height=innerHeight;}
  addEventListener('resize',resize);resize();
  const COLS=['#ffffff','#cccccc','#999999','#666666','#eeeeee','#bbbbbb'];
  function spawn(x,y){for(let i=0;i<60;i++){const a=Math.random()*Math.PI*2,s=Math.random()*6+2;P.push({x:x??c.width/2,y:y??c.height*.4,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,sz:Math.random()*5+3,col:COLS[Math.floor(Math.random()*COLS.length)],al:1,rot:Math.random()*Math.PI*2,rs:(Math.random()-.5)*.2,sh:Math.random()>.5?'r':'c'});}if(!af)anim();}
  function anim(){ctx.clearRect(0,0,c.width,c.height);P=P.filter(p=>p.al>.01);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.vx*=.99;p.al-=.018;p.rot+=p.rs;ctx.save();ctx.globalAlpha=Math.max(0,p.al);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;if(p.sh==='r'){ctx.fillRect(-p.sz/2,-p.sz/4,p.sz,p.sz/2);}else{ctx.beginPath();ctx.arc(0,0,p.sz/2,0,Math.PI*2);ctx.fill();}ctx.restore();});if(P.length){af=requestAnimationFrame(anim);}else{af=null;ctx.clearRect(0,0,c.width,c.height);}}
  window.launchConfetti=function(el){if(el){const r=el.getBoundingClientRect();spawn(r.left+r.width/2,r.top+r.height/2);}else spawn();};
})();

window.spawnHeart=function(x,y){
  const el=document.createElement('div');el.className='heart-burst';
  el.style.left=x+'px';el.style.top=y+'px';
  el.innerHTML=`<svg viewBox="0 0 100 90"><path d="M50 85C50 85 5 55 5 28C5 14 16 5 28 5C37 5 45 10 50 18C55 10 63 5 72 5C84 5 95 14 95 28C95 55 50 85 50 85Z" fill="white"/></svg>`;
  document.body.appendChild(el);el.addEventListener('animationend',()=>el.remove());
};

window.showToast=function(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);};

/* ── TERM POPUP ── */
window._tpOut=null;
window.openTermPopup=function(term,exp,e){
  const p=document.getElementById('termPopup');
  document.getElementById('tpTerm').textContent=term;
  document.getElementById('tpBody').innerHTML=exp;
  const W=260,H=140,M=8,vw=innerWidth,vh=innerHeight;
  let ax=e?e.clientX:vw/2,ay=e?e.clientY:vh/2;
  let l=ax-W/2,t=ay+14;
  l=Math.max(M,Math.min(l,vw-W-M));
  if(t+H>vh-M)t=ay-H-8;t=Math.max(M,t);
  p.style.left=l+'px';p.style.top=t+'px';
  p.classList.add('active');
  if(window._tpOut)document.removeEventListener('click',window._tpOut);
  setTimeout(()=>{window._tpOut=function(e){if(!p.contains(e.target)&&!e.target.classList.contains('term-link'))closeTermPopup();};document.addEventListener('click',window._tpOut,{once:true});},10);
};
window.closeTermPopup=function(){document.getElementById('termPopup').classList.remove('active');if(window._tpOut){document.removeEventListener('click',window._tpOut);window._tpOut=null;}};
</script>

<script>
/* ── EMOJI RENDER ── */
const EMAP={
  '🔍':'emo-magnify','❗':'emo-urgent','📌':'emo-pinned','🔥':'emo-fire','💎':'emo-diamond',
  '🟡':'emo-yellow','🔵':'emo-blue','🟢':'emo-green','🟣':'emo-purple','🔴':'emo-red',
  '⚫':'emo-dark','🧠':'emo-brain','📖':'emo-book','💡':'emo-idea','🎯':'emo-target',
  '🧩':'emo-puzzle','🏷️':'emo-tag','🔬':'emo-micro','⚠️':'emo-warning','✅':'emo-check',
  '❌':'emo-cross','⏳':'emo-hourglass','🔒':'emo-lock','🔓':'emo-unlock','⚡':'emo-lightning',
  '🌊':'emo-wave','🌀':'emo-spin','💫':'emo-float','🚀':'emo-rocket','🎬':'emo-cinematic',
  '🌟':'emo-star','✨':'emo-sparkle','🌈':'emo-rainbow','👑':'emo-crown','🪄':'emo-magic',
  '❤️':'emo-heart','😄':'emo-happy','😌':'emo-calm','😮':'emo-surprised','😎':'emo-cool',
  '🤖':'emo-robot','🧪':'emo-science','🏛️':'emo-temple','🌍':'emo-earth','💰':'emo-money',
  '⚖️':'emo-balance','📡':'emo-signal','🎵':'emo-music','🧊':'emo-ice','🔊':'emo-sound',
};
function buildRE(){const k=Object.keys(EMAP).sort((a,b)=>b.length-a.length);return new RegExp(`(${k.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')})([\\s\\S]*?)\\1`,'gu');}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderTerms(h){return h.replace(/([A-Za-z][A-Za-z0-9\-']{0,60}?)&lt;([^&]{1,600}?)&gt;/g,(_,term,exp)=>`<span class="term-link" onclick="openTermPopup('${term.trim().replace(/'/g,"&#39;")}','${exp.replace(/'/g,"&#39;")}',event)">${term.trim()}</span>`);}
function renderEmoji(text,applyTerms=true){const re=buildRE();let r='',li=0,m;while((m=re.exec(text))!==null){r+=esc(text.slice(li,m.index));r+=`<span class="${EMAP[m[1]]}">${renderEmoji(m[2],false)}</span>`;li=re.lastIndex;}r+=esc(text.slice(li));return applyTerms?renderTerms(r):r;}
</script>

    try{const {data:f}=await sb.from('favourite_playlists').select('playlist_id').eq('user_id',currentUser.user_id);favIds=(f||[]).map(r=>r.playlist_id);}catch(e){}
  }

  if(!favIds.length){
    grid.innerHTML=`<div style="text-align:center;padding:32px 0;color:rgba(255,255,255,.25);font-size:13px;"><i class="fas fa-heart" style="font-size:28px;display:block;margin-bottom:10px;opacity:.15;"></i>No saved libraries yet.<br><span style="font-size:11px;opacity:.6;">Save libraries from Home to see them here.</span></div>`;
    return;
  }

  try{
    const {data:libs}=await sb.from('playlists').select('id,name,description,thumbnail_url').in('id',favIds).order('name',{ascending:true});
    if(!libs||!libs.length){grid.innerHTML='<div style="text-align:center;padding:20px;color:rgba(255,255,255,.25);font-size:13px;">No libraries found.</div>';return;}
    const {data:cr}=await sb.from('playlist_items').select('playlist_id').in('playlist_id',libs.map(l=>l.id));
    const cm={};(cr||[]).forEach(r=>{cm[r.playlist_id]=(cm[r.playlist_id]||0)+1;});

    const list=document.createElement('div');list.className='lib-list';

    libs.forEach(lib=>{
      const count=cm[lib.id]||0;
      const letter=(lib.name||'?')[0].toUpperCase();
      const item=document.createElement('div');
      item.className='lib-pick';item.dataset.id=lib.id;
      item.innerHTML=`
        <div class="lib-thumb">${lib.thumbnail_url?`<img src="${lib.thumbnail_url}" alt="">`:letter}</div>
        <div class="lib-info">
          <div class="lib-name">${lib.name||'Untitled'}</div>
          <div class="lib-meta"><i class="fas fa-layer-group" style="font-size:9px;"></i> ${count} article${count!==1?'s':''}</div>
        </div>
        <div class="lib-check">✓</div>`;
      item.addEventListener('click',()=>{
        const id=String(lib.id);
        if(selected.has(id)){selected.delete(id);item.classList.remove('selected');}
        else{if(selected.size>=5)return;selected.add(id);item.classList.add('selected');}
        const n=selected.size;
        cnt.textContent=`${n} / 5 selected`;
        go.disabled=n===0;
        list.querySelectorAll('.lib-pick').forEach(el=>{
          if(!el.classList.contains('selected')){el.style.opacity=n>=5?'.25':'1';el.style.pointerEvents=n>=5?'none':'';}
          else{el.style.opacity='1';el.style.pointerEvents='';}
        });
      });
      list.appendChild(item);
    });

    grid.innerHTML='';
    grid.appendChild(list);

    go.addEventListener('click',async()=>{
      go.disabled=true;go.textContent='Loading…';
      const pc=document.getElementById('pickerCard');
      if(pc)pc.classList.add('exiting');
      setTimeout(async()=>{
        const pids=[...selected].map(Number);
        const {data:items}=await sb.from('playlist_items').select('article_id').in('playlist_id',pids);
        const ids=[...new Set((items||[]).map(r=>r.article_id))];
        filteredIds=ids.length>0?ids:null;
        articles=[];offset=0;hasMore=true;isLoading=false;
        document.getElementById('feed').querySelectorAll('.article-card,.mcq-card').forEach(c=>c.remove());
        if(pc){const sk=makeSkel();pc.replaceWith(sk);}
        loadArticles(true);
      },330);
    });
  }catch(e){console.error(e);grid.innerHTML='';}
}

/* ── LOAD ── */
async function loadArticles(isInit=true){
  if(isLoading||(!isInit&&!hasMore))return;
  isLoading=true;
  const feed=document.getElementById('feed');
  try{
    if(isInit&&anchorId!==null){
      const {data:a}=await sb.from('articles').select('*').eq('id',anchorId).single();
      if(a){
        const {data:rest}=await sb.from('articles').select('*').order('created_at',{ascending:false}).lt('created_at',a.created_at).limit(LIMIT-1);
        await enrichAndRender([a,...(rest||[])],true);offset=LIMIT;isLoading=false;return;
      }
      anchorId=null;
    }
    let q=sb.from('articles').select('*').order('created_at',{ascending:false}).range(offset,offset+LIMIT-1);
    if(filteredIds!==null){
      if(filteredIds.length===0){feed.querySelectorAll('.skeleton-card').forEach(s=>s.remove());const d=document.createElement('div');d.className='center-state';d.innerHTML='<i class="fas fa-inbox" style="font-size:32px;opacity:.15;"></i><div>No articles in selected libraries</div>';feed.appendChild(d);isLoading=false;return;}
      q=q.in('id',filteredIds);
    }
    const {data,error}=await q;
    if(error)throw error;
    if(!data||!data.length){
      if(isInit){feed.querySelectorAll('.skeleton-card').forEach(s=>s.remove());const d=document.createElement('div');d.className='center-state';d.innerHTML='<i class="fas fa-inbox" style="font-size:32px;opacity:.15;"></i><div>No articles found</div>';feed.appendChild(d);}
      hasMore=false;isLoading=false;return;
    }
    if(data.length<LIMIT)hasMore=false;
    offset+=data.length;
    await enrichAndRender(data,isInit);
    isLoading=false;
  }catch(e){
    console.error(e);
    if(isInit){feed.querySelectorAll('.skeleton-card').forEach(s=>s.remove());const d=document.createElement('div');d.className='center-state';d.innerHTML='<i class="fas fa-exclamation-triangle" style="font-size:32px;opacity:.15;"></i><div>Failed to load</div>';feed.appendChild(d);}
    isLoading=false;
  }
}

async function enrichAndRender(data,isInit){
  const uids=[...new Set(data.map(a=>a.firebase_user_id).filter(Boolean))];
  let users=[];
  if(uids.length){const {data:u}=await sb.from('users').select('firebase_uid,username,full_name,pfp,user_id').in('firebase_uid',uids);users=u||[];}
  const ids=data.map(a=>a.id);
  const {data:media}=await sb.from('media').select('*').in('article_id',ids).order('display_order',{ascending:true});
  const enriched=data.map(a=>{const u=users.find(u=>u.firebase_uid===a.firebase_user_id);return{...a,author:u?.username?`@${u.username}`:(u?.full_name||'Anonymous'),authorPfp:u?.pfp||null,authorUsername:u?.username||null,authorSupaId:u?.user_id||null,media:(media||[]).filter(m=>m.article_id===a.id)};});
  articles=[...articles,...enriched];
  renderFeed(isInit);
}

/* ── RENDER ── */
function renderFeed(isInit){
  const feed=document.getElementById('feed');
  const start=isInit?0:articles.length-LIMIT;
  if(isInit){feed.querySelectorAll('.skeleton-card').forEach(s=>s.remove());feed.querySelectorAll('.article-card,.mcq-card').forEach(c=>c.remove());}
  else{const last=feed.lastElementChild;if(last&&last.classList.contains('skeleton-card'))last.remove();}
  for(let i=start;i<articles.length;i++){
    const a=articles[i];
    feed.appendChild(isMCQ(a.content)?buildMCQ(a,i):buildArticle(a,i));
  }
  if(hasMore)feed.appendChild(makeSkel());
  bindBtns();updateLikeBtns();updateFollowBtns();
  if(isInit){feed.addEventListener('scroll',onScroll);loadCmtCounts();setupIO(0);}
  else{setupIO(start);loadCmtCounts();}
}

/* ── ARTICLE ── */
function buildArticle(art,idx){
  const card=document.createElement('div');
  card.className='card article-card';
  card.dataset.index=idx;card.dataset.articleId=art.id;

  card.innerHTML=`

        <span class="act-label comment-count">0</span>

        <div class="act-icon"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></div>

function buildContent(art){
  const div=document.createElement('div');div.className='card-content';
  const paras=(art.content||'').split('\n\n');
  paras.forEach((p,pi)=>{
    if(!p.trim())return;
    const el=document.createElement('div');el.className='para';el.innerHTML=renderEmoji(p.trim());div.appendChild(el);
    art.media?.filter(m=>m.display_order===pi&&(m.type==='image'||m.type==='youtube')).forEach(m=>div.appendChild(makeMedia(m,true)));
  });
  art.media?.filter(m=>m.display_order>=paras.length||(m.type!=='image'&&m.type!=='youtube')).forEach(m=>div.appendChild(makeMedia(m,m.type==='image'||m.type==='youtube')));
  return div;
}

/* ── MCQ ── */
function isMCQ(c){return typeof c==='string'&&c.trimStart().startsWith('❔');}
function parseMCQ(c){
  const lines=c.trim().split('\n').map(l=>l.trim()).filter(Boolean);
  const q=lines[0].replace(/^❔/,'').trim();
  const opts=lines.slice(1).map(l=>({label:l.replace(/^✅/,'').trim(),correct:l.startsWith('✅')}));
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  return{q,opts};
}

function buildMCQ(art,idx){
  const {q,opts}=parseMCQ(art.content);
  const isLiked=userLikes.has(String(art.id));
  const LETS=['A','B','C','D','E','F'];
  const card=document.createElement('div');
  card.className='card mcq-card';card.dataset.index=idx;card.dataset.articleId=art.id;
  card.innerHTML=`
    <div class="card-header">${authorHeader(art)}</div>
    <div class="mcq-badge">Question</div>
    <div class="mcq-question">${renderEmoji(q)}</div>
    <div class="mcq-media" id="mm-${art.id}"></div>
    <div class="mcq-scroll">
      <div class="mcq-opts" id="mo-${art.id}"></div>
      <div class="mcq-result" id="mr-${art.id}"></div>
    </div>
    <div class="side-actions">
      <button class="act-btn like-btn ${isLiked?'liked':''}" data-id="${art.id}">
        <div class="act-icon"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
        <span class="act-label like-count">${fmt(art.likes||0)}</span>
      </button>
      <button class="act-btn comment-btn" data-id="${art.id}">
        <div class="act-icon"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
        <span class="act-label comment-count">0</span>
      </button>
      <button class="act-btn share-btn" data-id="${art.id}" data-title="${(art.title||'').replace(/"/g,'&quot;')}">
        <div class="act-icon"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></div>
        <span class="act-label">Share</span>
      </button>
    </div>`;
  if(art.media?.length){const mm=card.querySelector(`#mm-${art.id}`);art.media.forEach(m=>mm.appendChild(makeMedia(m,false)));}
  const optsEl=card.querySelector(`#mo-${art.id}`),msgEl=card.querySelector(`#mr-${art.id}`);
  let answered=false;
  opts.forEach((opt,i)=>{
    const btn=document.createElement('button');btn.className='mcq-opt';
    btn.innerHTML=`<span class="opt-pill">${LETS[i]||i+1}</span><span class="opt-text">${renderEmoji(opt.label)}</span>`;
    btn.addEventListener('click',()=>{
      if(answered)return;answered=true;
      optsEl.querySelectorAll('.mcq-opt').forEach(b=>b.disabled=true);
      if(opt.correct){btn.classList.add('correct');msgEl.textContent='✓ Correct';msgEl.className='mcq-result ok';window.launchConfetti(btn);}
      else{btn.classList.add('wrong');msgEl.className='mcq-result no';const ci=opts.findIndex(o=>o.correct);if(ci!==-1){optsEl.querySelectorAll('.mcq-opt')[ci].classList.add('reveal');msgEl.textContent=`✗ Answer: ${opts[ci].label}`;}else msgEl.textContent='✗ Incorrect';}
    });
    optsEl.appendChild(btn);
  });
  setupDblTap(card,art.id);
  return card;
}

/* ── AUTHOR HEADER ── */
function authorHeader(art){
  const av=art.authorPfp?`<img src="${art.authorPfp}" alt="">`:getInit(art);
  const sid=art.authorSupaId||'',fbuid=art.firebase_user_id||'',uname=art.authorUsername||'';
  const url=uname?`profile.html?username=${encodeURIComponent(uname)}`:(fbuid?`profile.html?id=${encodeURIComponent(fbuid)}`:'#');
  const isOwn=currentUser&&sid&&String(currentUser.user_id)===String(sid);
  const isFollowing=sid&&userFollowing.has(String(sid));
  const showFollow=sid&&!isOwn;
  let btn='';
  if(isOwn){btn=`<button class="edit-btn" onclick="location.href='https://patholytica.com/create?edit=${art.id}'" title="Edit"><i class="fas fa-pen"></i></button>`;}
  else if(showFollow){btn=`<button class="hd-btn ${isFollowing?'following':''}" data-supa-uid="${sid}" onclick="handleFollow(event,'${fbuid}','${sid}')"><svg class="icon-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><svg class="icon-bell" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></button>`;}
  return `<div class="avatar" onclick="location.href='${url}'">${av}</div><div class="author-meta"><div class="author-name" onclick="location.href='${url}'">${art.author}</div><div class="post-date">${fmtDate(new Date(art.created_at))}</div></div>${btn}`;
}
function getInit(art){
  if(art.authorUsername)return art.authorUsername.charAt(0).toUpperCase();
  if(art.author){const i=art.author.indexOf('@');return i!==-1&&art.author.length>i+1?art.author.charAt(i+1).toUpperCase():art.author.charAt(0).toUpperCase();}
  return 'A';
}

/* ── MEDIA ── */
function makeMedia(m,full=false){
  const d=document.createElement('div');
  if(m.type==='image'){
    if(full){d.className='img-wrap';d.innerHTML=`<img src="${m.url}" alt="${m.caption||''}">${m.caption?`<div class="img-caption">${m.caption}</div>`:''}`;}
    else{d.className='media-embed';d.innerHTML=`<img src="${m.url}" alt="${m.caption||''}">${m.caption?`<div class="media-caption">${m.caption}</div>`:''}`;} 
  }else if(m.type==='youtube'){
    if(full){d.className='yt-wrap';d.innerHTML=`<iframe src="${m.url}" title="${m.caption||''}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>${m.caption?`<div class="yt-caption">${m.caption}</div>`:''}`;} 
    else{const yid=(m.url.match(/embed\/([A-Za-z0-9_-]{11})/)||[])[1]||'';d.className='media-embed';d.innerHTML=`<div style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden;"><div style="display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.06);"><i class="fab fa-youtube" style="color:rgba(255,255,255,.4);font-size:13px;flex-shrink:0;"></i><span style="font-size:12px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.7);">${m.caption||'YouTube Video'}</span>${yid?`<a href="https://youtube.com/watch?v=${yid}" target="_blank" style="font-size:10px;font-weight:700;color:rgba(255,255,255,.5);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:7px;padding:3px 9px;text-decoration:none;">Watch</a>`:''}</div><iframe src="${m.url}" title="${m.caption||''}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen style="width:100%;aspect-ratio:16/9;border:none;display:block;"></iframe></div>`;}
  }else if(m.type==='audio'){
    d.className='media-embed';const aid='a-'+Math.random().toString(36).substr(2,8);
    const bars=Array(14).fill(0).map(()=>`<div class="waveform-bar" style="height:${Math.random()*60+20}%"></div>`).join('');
    d.innerHTML=`<div class="audio-player"><button class="play-btn" onclick="toggleAudio(this,'${aid}')"><i class="fas fa-play"></i></button><div class="audio-info"><div class="audio-title">${m.caption||'Audio'}</div><div class="waveform" onclick="seekAudio(event,this,'${aid}')"><div class="waveform-prog"></div><div class="waveform-bars">${bars}</div></div><div class="audio-time"><span class="cur-t">0:00</span><span class="dur-t">0:00</span></div></div><audio id="${aid}" src="${m.url}" style="display:none;"></audio></div>`;
    setTimeout(()=>{const a=document.getElementById(aid);if(a)a.addEventListener('loadedmetadata',()=>{const s=Math.floor(a.duration);const el=a.closest('.audio-player')?.querySelector('.dur-t');if(el)el.textContent=`${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;});},50);
  }else if(m.type==='pdf'){
    d.className='media-embed';d.innerHTML=`<div style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden;"><div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.06);"><i class="fas fa-file-pdf" style="color:rgba(255,255,255,.4);font-size:14px;flex-shrink:0;"></i><span style="font-size:12px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.7);">${m.caption||'Document'}</span><a href="${m.url}" target="_blank" style="font-size:10px;font-weight:700;color:rgba(255,255,255,.6);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:7px;padding:3px 9px;text-decoration:none;">Open</a></div><iframe src="${m.url}" style="width:100%;height:180px;border:none;display:block;"></iframe></div>`;
  }
  return d;
}

/* ── GHOST COMMENTS ── */
async function appendGhostCmts(card,id){
  try{const {data:c}=await sb.from('comments').select('comment_text,user_id').eq('article_id',id).order('created_at',{ascending:false}).limit(3);if(!c||!c.length)return;const uids=[...new Set(c.map(x=>x.user_id).filter(Boolean))];let um={};if(uids.length){const {data:u}=await sb.from('users').select('user_id,username').in('user_id',uids);(u||[]).forEach(u=>{um[u.user_id]=u;});}const el=card.querySelector('.card-content');if(!el)return;const g=document.createElement('div');g.className='ghost-cmts';c.forEach(x=>{const u=um[x.user_id];const a=u?.username?`@${u.username}`:'Someone';const d=document.createElement('div');d.className='ghost-cmt';d.innerHTML=`<span class="ghost-auth">${a}</span>${esc(x.comment_text.slice(0,80))}${x.comment_text.length>80?'…':''}`;g.appendChild(d);});el.appendChild(g);}catch(e){}
}

/* ── INTERACTIONS ── */
function setupDblTap(card,id){
  let last=0;
  card.addEventListener('touchend',e=>{if(e.target.closest('button,a,.term-link,.side-actions,.author-name,.avatar'))return;const now=Date.now(),t=e.changedTouches[0];if(now-last<320){triggerLike(card,id,t.clientX,t.clientY);e.preventDefault();}last=now;},{passive:false});
  card.addEventListener('dblclick',e=>{if(e.target.closest('button,a,.term-link,.side-actions,.author-name,.avatar'))return;triggerLike(card,id,e.clientX,e.clientY);});
}
function triggerLike(card,id,x,y){const b=card.querySelector('.like-btn');if(!b)return;if(!b.classList.contains('liked'))b.click();window.spawnHeart(x,y);}

async function handleLike(e){
  const btn=e.currentTarget,id=String(btn.dataset.id),cEl=btn.querySelector('.like-count');
  if(!currentUser){location.href='https://patholytica.com/login';return;}
  if(btn.dataset.processing==='true')return;btn.dataset.processing='true';
  const wasLiked=userLikes.has(id);
  const ai=articles.findIndex(a=>String(a.id)===id);
  const prev=ai!==-1?(articles[ai].likes||0):0;
  const next=wasLiked?Math.max(0,prev-1):prev+1;
  if(wasLiked){userLikes.delete(id);btn.classList.remove('liked');}else{userLikes.add(id);btn.classList.add('liked');}
  cEl.textContent=fmt(next);
  const card=btn.closest('.card');
  if(card){const s=card.querySelectorAll('.stat span');if(s[1])s[1].textContent=fmt(next);}
  if(ai!==-1)articles[ai].likes=next;
  try{
    if(wasLiked){await sb.from('likes').delete().eq('article_id',parseInt(id)).eq('user_id',currentUser.user_id);const {error:re}=await sb.rpc('decrement_likes',{article_id:parseInt(id)});if(re){const {data:f}=await sb.from('articles').select('likes').eq('id',id).single();await sb.from('articles').update({likes:Math.max(0,(f?.likes||1)-1)}).eq('id',id);}}
    else{const {error:ie}=await sb.from('likes').insert([{article_id:parseInt(id),user_id:currentUser.user_id}]);if(ie&&ie.code!=='23505')throw ie;const {error:re}=await sb.rpc('increment_likes',{article_id:parseInt(id)});if(re){const {data:f}=await sb.from('articles').select('likes').eq('id',id).single();await sb.from('articles').update({likes:(f?.likes||0)+1}).eq('id',id);}}
  }catch(err){if(wasLiked){userLikes.add(id);btn.classList.add('liked');}else{userLikes.delete(id);btn.classList.remove('liked');}cEl.textContent=fmt(prev);if(card){const s=card.querySelectorAll('.stat span');if(s[1])s[1].textContent=fmt(prev);}if(ai!==-1)articles[ai].likes=prev;}
  finally{btn.dataset.processing='false';}
}

window.handleFollow=async function(e,fbuid,sid){
  e.stopPropagation();if(!currentUser){location.href='https://patholytica.com/login';return;}
  const btn=e.currentTarget;if(btn.dataset.processing==='true')return;btn.dataset.processing='true';
  const was=userFollowing.has(String(sid));
  if(was)userFollowing.delete(String(sid));else userFollowing.add(String(sid));
  updateFollowBtns();
  if(!was){setTimeout(()=>{btn.classList.add('ringing');btn.addEventListener('animationend',()=>btn.classList.remove('ringing'),{once:true});},260);}
  try{if(was)await sb.from('subscriptions').delete().eq('subscriber_id',currentUser.user_id).eq('author_id',parseInt(sid));else await sb.from('subscriptions').insert([{subscriber_id:currentUser.user_id,author_id:parseInt(sid)}]);}
  catch(err){if(was)userFollowing.add(String(sid));else userFollowing.delete(String(sid));updateFollowBtns();}
  finally{btn.dataset.processing='false';}
};

window.shareArticle=function(id,title){
  const url=`${location.origin}${location.pathname}?id=${id}`;
  if(navigator.share){navigator.share({title:title||'Patholytica',url}).catch(()=>{});}
  else{navigator.clipboard.writeText(url).then(()=>showToast('Link copied')).catch(()=>showToast(url));}
};

function bindBtns(){
  document.querySelectorAll('.like-btn').forEach(b=>{b.removeEventListener('click',handleLike);b.addEventListener('click',handleLike);});
  document.querySelectorAll('.comment-btn').forEach(b=>{b.removeEventListener('click',onCmt);b.addEventListener('click',onCmt);});
  document.querySelectorAll('.share-btn').forEach(b=>{b.onclick=()=>shareArticle(b.dataset.id,b.dataset.title);});
}
function onCmt(e){currentArticleId=e.currentTarget.dataset.id;loadCmts(currentArticleId);openComments();}

async function loadUserLikes(){if(!currentUser)return;try{const {data}=await sb.from('likes').select('article_id').eq('user_id',currentUser.user_id);userLikes.clear();(data||[]).forEach(l=>userLikes.add(String(l.article_id)));updateLikeBtns();}catch(e){}}
async function loadUserFollowing(){if(!currentUser)return;try{const {data}=await sb.from('subscriptions').select('author_id').eq('subscriber_id',currentUser.user_id);userFollowing.clear();(data||[]).forEach(r=>userFollowing.add(String(r.author_id)));updateFollowBtns();}catch(e){}}
function updateLikeBtns(){document.querySelectorAll('.like-btn').forEach(b=>b.classList.toggle('liked',userLikes.has(String(b.dataset.id))));}
function updateFollowBtns(){document.querySelectorAll('.hd-btn[data-supa-uid]').forEach(b=>b.classList.toggle('following',userFollowing.has(String(b.dataset.supaUid))));}

onAuthStateChanged(auth,async fbUser=>{
  if(fbUser){if(!currentUser){try{const {data}=await sb.from('users').select('user_id,firebase_uid,username').eq('firebase_uid',fbUser.uid).single();currentUser=data||null;}catch(e){}}if(currentUser)await Promise.all([loadUserLikes(),loadUserFollowing()]);}
  else{currentUser=null;userLikes.clear();userFollowing.clear();}
});

/* ── VIEWS ── */
function setupIO(start){
  const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{const id=e.target.dataset.articleId;if(!id)return;if(e.isIntersecting&&e.intersectionRatio>=.75)startView(id);else clearView(id);});},{threshold:[.75]});
  document.querySelectorAll('.card[data-article-id]').forEach(c=>{if(parseInt(c.dataset.index)>=start)obs.observe(c);});
}
function startView(id){if(viewedSet.has(id)||viewTimers[id])return;viewTimers[id]=setTimeout(()=>incView(id),5000);}
function clearView(id){if(viewTimers[id]){clearTimeout(viewTimers[id]);delete viewTimers[id];}}
async function incView(id){
  if(viewedSet.has(id))return;
  try{viewedSet.add(id);const {data:a}=await sb.from('articles').select('views').eq('id',id).single();const nv=(a.views||0)+1;await sb.from('articles').update({views:nv}).eq('id',id);const idx=articles.findIndex(a=>a.id===id);if(idx!==-1)articles[idx].views=nv;const card=document.querySelector(`.card[data-article-id="${id}"]`);if(card){const s=card.querySelectorAll('.stat span');if(s[0])s[0].textContent=fmt(nv);}}catch(e){viewedSet.delete(id);}
}

/* ── COMMENTS ── */
async function loadCmts(id){
  const list=document.getElementById('cmtList');
  list.innerHTML='<div class="no-cmts"><div class="spinner" style="width:22px;height:22px;border-width:2px;"></div></div>';
  try{
    const {data:c}=await sb.from('comments').select('*').eq('article_id',id).order('created_at',{ascending:true});
    if(!c||!c.length){list.innerHTML='<div class="no-cmts"><i class="fas fa-comments"></i><div>No comments yet</div></div>';return;}
    const uids=[...new Set(c.map(x=>x.user_id).filter(Boolean))];let um={};
    if(uids.length){const {data:u}=await sb.from('users').select('user_id,username,full_name,pfp').in('user_id',uids);if(u)u.forEach(u=>{um[u.user_id]=u;});}
    list.innerHTML=c.map(x=>{const u=um[x.user_id],a=u?.username?`@${u.username}`:(u?.full_name||'Anonymous');const av=u?.pfp?`<img src="${u.pfp}" alt="">`:(u?.username||'A')[0].toUpperCase();return `<div class="cmt-item"><div class="cmt-av">${av}</div><div class="cmt-body"><div class="cmt-author">${a}</div><div class="cmt-text">${renderEmoji(x.comment_text)}</div><div class="cmt-time">${fmtDate(new Date(x.created_at))}</div></div></div>`;}).join('');
  }catch(e){list.innerHTML='<div class="no-cmts"><i class="fas fa-exclamation-triangle"></i><div>Failed to load</div></div>';}
}
async function loadCmtCounts(){try{const {data}=await sb.from('comments').select('article_id');const m={};(data||[]).forEach(c=>{m[c.article_id]=(m[c.article_id]||0)+1;});document.querySelectorAll('.comment-btn').forEach(b=>{b.querySelector('.comment-count').textContent=m[b.dataset.id]||0;});}catch(e){}}
window.openComments=()=>{document.getElementById('cmtPopup').classList.add('open');document.getElementById('cmtOverlay').classList.add('open');document.body.style.overflow='hidden';};
window.closeComments=()=>{document.getElementById('cmtPopup').classList.remove('open');document.getElementById('cmtOverlay').classList.remove('open');document.body.style.overflow='';};
window.sendComment=async function(){
  const inp=document.getElementById('cmtInput'),text=inp.value.trim();if(!text||!currentArticleId)return;
  const btn=document.getElementById('cmtSend');btn.disabled=true;
  try{if(!currentUser){location.href='https://patholytica.com/login';return;}await sb.from('comments').insert([{article_id:currentArticleId,user_id:currentUser.user_id,comment_text:text}]);inp.value='';await loadCmts(currentArticleId);const cb=document.querySelector(`.comment-btn[data-id="${currentArticleId}"]`);if(cb){const s=cb.querySelector('.comment-count');s.textContent=parseInt(s.textContent)+1;}}
  catch(e){alert('Failed to post.');}finally{btn.disabled=false;}
};
document.getElementById('cmtInput').addEventListener('keypress',e=>{if(e.key==='Enter')window.sendComment();});

/* ── SCROLL ── */
function onScroll(e){const c=e.target;if(c.scrollTop+c.clientHeight>=c.scrollHeight*.8&&hasMore&&!isLoading)loadArticles(false);}

/* ── UTILS ── */
function fmt(n){if(n>=1e6)return (n/1e6).toFixed(1)+'M';if(n>=1e3)return (n/1e3).toFixed(1)+'K';return (n||0).toString();}
function fmtDate(d){const now=new Date(),ms=now-d,m=Math.floor(ms/60000),h=Math.floor(ms/3600000),dy=Math.floor(ms/86400000);if(m<60)return `${m}m ago`;if(h<24)return `${h}h ago`;if(dy<7)return `${dy}d ago`;return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}

/* ── BOOT ── */
initPicker();
</script>

<script>
window.toggleAudio=function(btn,aid){const player=btn.closest('.audio-player'),audio=document.getElementById(aid),icon=btn.querySelector('i');if(audio.paused){audio.play();icon.className='fas fa-pause';audio.ontimeupdate=function(){const p=(audio.currentTime/audio.duration)*100;const pg=player.querySelector('.waveform-prog');if(pg)pg.style.width=p+'%';const ct=player.querySelector('.cur-t');if(ct){const m=Math.floor(audio.currentTime/60),s=Math.floor(audio.currentTime%60);ct.textContent=`${m}:${s.toString().padStart(2,'0')}`;}};audio.onended=function(){icon.className='fas fa-play';const pg=player.querySelector('.waveform-prog');if(pg)pg.style.width='0%';const ct=player.querySelector('.cur-t');if(ct)ct.textContent='0:00';};}else{audio.pause();icon.className='fas fa-play';}};
window.seekAudio=function(e,container,aid){const audio=document.getElementById(aid);if(!audio||!audio.duration)return;const r=container.getBoundingClientRect();audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;};
</script>
