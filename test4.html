function renderCommentNode(c, usersMap, isReply=false){
   const u=usersMap[c.user_id];
   const author=u?.username?`@${u.username}`:(u?.full_name||'Anonymous');
   const avatarContent=u?.pfp?`<img src="${u.pfp}" alt="">`:(u?.username||'A')[0].toUpperCase();
   const time=formatDate(new Date(c.created_at));
   const replyCount=(c.replies||[]).length;

   const node=document.createElement('div');
   if(isReply){
       node.className='reply-item';
       node.innerHTML=`
           <div class="reply-avatar">${avatarContent}</div>
           <div class="reply-content">
               <div class="reply-author">${author}</div>
               <div class="reply-text">${renderEmojiText(c.comment_text)}</div>
               <div class="reply-meta"><span class="reply-time">${time}</span></div>
           </div>`;
   }else{
       node.className='comment-item';
       node.dataset.commentId=c.id;
       let repliesHTML='';
       if(replyCount>0){
           repliesHTML=`<div class="comment-replies" id="replies-${c.id}">`
               +(c.replies||[]).map(r=>renderCommentNode(r,usersMap,true).outerHTML).join('')
               +`</div>`;
       }else{
           repliesHTML=`<div class="comment-replies" id="replies-${c.id}" style="display:none;"></div>`;
       }
       node.innerHTML=`
           <div class="comment-avatar">${avatarContent}</div>
           <div class="comment-content">
               <div class="comment-author">${author}</div>
               <div class="comment-text">${renderEmojiText(c.comment_text)}</div>
               <div class="comment-meta">
                   <span class="comment-time">${time}</span>
                   <button class="comment-reply-btn" data-comment-id="${c.id}" data-author="${author}">Reply</button>
               </div>
               ${repliesHTML}
           </div>`;
       // wire reply button
       node.querySelector('.comment-reply-btn').addEventListener('click',()=>{
           startReply(c.id, author);
       });
   }
   return node;
}

async function loadComments(articleId){
   const list=document.getElementById('commentsList');
   // show spinner only if list is empty
   if(!list.children.length||list.querySelector('.no-comments')||list.querySelector('.loading-container')){
       list.innerHTML='<div class="loading-container"><div class="spinner" style="width:28px;height:28px;border-width:2px;"></div></div>';
   }
   try{
       // Fetch top-level comments
       const {data:topComments}=await supabase.from('comments').select('*').eq('article_id',articleId).is('parent_comment_id',null).order('created_at',{ascending:true});
       if(!topComments||!topComments.length){list.innerHTML=`<div class="no-comments"><i class="fas fa-comments"></i><div>No comments yet</div><div style="font-size:11px;">Be the first to comment!</div></div>`;return;}

       // Fetch all replies for these comments
       const topIds=topComments.map(c=>c.id);
       const {data:replies}=await supabase.from('comments').select('*').in('parent_comment_id',topIds).order('created_at',{ascending:true});

       // Build users map
       const allComments=[...topComments,...(replies||[])];
       const uids=[...new Set(allComments.map(c=>c.user_id).filter(Boolean))];
       let usersMap={};
       if(uids.length>0){const {data:users}=await supabase.from('users').select('user_id,username,full_name,pfp').in('user_id',uids);if(users)users.forEach(u=>{usersMap[u.user_id]=u;});}

       // Attach replies to their parent
       topComments.forEach(c=>{c.replies=(replies||[]).filter(r=>r.parent_comment_id===c.id);});

       list.innerHTML='';
       topComments.forEach(c=>list.appendChild(renderCommentNode(c,usersMap,false)));
   }catch(e){list.innerHTML=`<div class="no-comments"><i class="fas fa-exclamation-triangle"></i><div>Failed to load comments</div></div>`;}
}

window.sendComment=async function(){
   const input=document.getElementById('commentInput'),text=input.value.trim();
   if(!text||!currentArticleId)return;
   const sendBtn=document.getElementById('sendCommentBtn');
   sendBtn.disabled=true;
   const isReply=!!replyingToCommentId;
   const parentId=replyingToCommentId;
   const parentAuthor=replyingToAuthorName;

   // grab current user optimistically
   if(!currentUser)currentUser=await getCurrentUser();
   if(!currentUser){window.location.href='https://patholytica.com/login';sendBtn.disabled=false;return;}

   input.value='';
   cancelReply();

   // ── Instant optimistic insertion ──
   const tempId='temp-'+Date.now();
   const list=document.getElementById('commentsList');

   const noC=list.querySelector('.no-comments');if(noC)noC.remove();

   const fakeUser={user_id:currentUser.user_id,username:currentUser.username,full_name:null,pfp:null};
   const authorName=currentUser.username?`@${currentUser.username}`:'You';
   const avatarContent=(currentUser.username||'Y')[0].toUpperCase();

   if(isReply){
       // append to the reply thread of the parent
       const repliesContainer=document.getElementById(`replies-${parentId}`);
       if(repliesContainer){
           repliesContainer.style.display='';
           const replyEl=document.createElement('div');
           replyEl.className='reply-item reply-pending';
           replyEl.id=tempId;
           replyEl.innerHTML=`
               <div class="reply-avatar">${avatarContent}</div>
               <div class="reply-content">
                   <div class="reply-author">${authorName}</div>
                   <div class="reply-text">${renderEmojiText(text)}</div>
                   <div class="reply-meta"><span class="reply-time"><span class="comment-spinner"></span> Sending…</span></div>
               </div>`;
           repliesContainer.appendChild(replyEl);
           repliesContainer.scrollIntoView({behavior:'smooth',block:'nearest'});
       }
   }else{
       const commentEl=document.createElement('div');
       commentEl.className='comment-item comment-pending';
       commentEl.id=tempId;
       commentEl.innerHTML=`
           <div class="comment-avatar">${avatarContent}</div>
           <div class="comment-content">
               <div class="comment-author">${authorName}</div>
               <div class="comment-text">${renderEmojiText(text)}</div>
               <div class="comment-meta">
                   <span class="comment-time"><span class="comment-spinner"></span> Sending…</span>
               </div>
               <div class="comment-replies" style="display:none;"></div>
           </div>`;
       list.appendChild(commentEl);
       commentEl.scrollIntoView({behavior:'smooth',block:'nearest'});
   }

   // Update comment counter optimistically
   const cb=document.querySelector(`.comment-btn[data-id="${currentArticleId}"]`);
   if(cb){const cs=cb.querySelector('.comment-count');cs.textContent=parseInt(cs.textContent||0)+1;}

   try{
       const insertPayload={article_id:currentArticleId,user_id:currentUser.user_id,comment_text:text};
       if(isReply)insertPayload.parent_comment_id=parentId;
       const {data:newComment,error}=await supabase.from('comments').insert([insertPayload]).select().single();
       if(error)throw error;

       // Replace temp element with confirmed one
       const tempEl=document.getElementById(tempId);
       if(tempEl){
           if(isReply){
               const confirmedReplyEl=document.createElement('div');
               confirmedReplyEl.className='reply-item';
               confirmedReplyEl.innerHTML=`
                   <div class="reply-avatar">${avatarContent}</div>
                   <div class="reply-content">
                       <div class="reply-author">${authorName}</div>
                       <div class="reply-text">${renderEmojiText(text)}</div>
                       <div class="reply-meta"><span class="reply-time">${formatDate(new Date(newComment.created_at))}</span></div>
                   </div>`;
               tempEl.replaceWith(confirmedReplyEl);
           }else{
               tempEl.classList.remove('comment-pending');
               const timeEl=tempEl.querySelector('.comment-time');
               if(timeEl)timeEl.innerHTML=formatDate(new Date(newComment.created_at));
               // wire up reply button now that we have real ID
               const replyBtn=document.createElement('button');
               replyBtn.className='comment-reply-btn';
               replyBtn.dataset.commentId=newComment.id;
               replyBtn.dataset.author=authorName;
               replyBtn.textContent='Reply';
               replyBtn.addEventListener('click',()=>startReply(newComment.id,authorName));
               const meta=tempEl.querySelector('.comment-meta');
               if(meta)meta.appendChild(replyBtn);
               // fix replies container id
               const rc=tempEl.querySelector('.comment-replies');
               if(rc)rc.id=`replies-${newComment.id}`;
               tempEl.dataset.commentId=newComment.id;
           }
       }
   }catch(err){
       // remove optimistic element on failure
       const tempEl=document.getElementById(tempId);if(tempEl)tempEl.remove();
       if(cb){const cs=cb.querySelector('.comment-count');cs.textContent=Math.max(0,parseInt(cs.textContent||1)-1);}
       alert('Failed to post comment.');
   }finally{sendBtn.disabled=false;}
};

document.getElementById('commentInput').addEventListener('keypress',e=>{if(e.key==='Enter')window.sendComment();});
function handleScroll(e){const c=e.target;if(c.scrollTop+c.clientHeight>=c.scrollHeight*0.8&&hasMore&&!isLoading)loadArticles(false);}

initLibraryPicker();
</script>

<script>
window.toggleAudio=function(btn,audioId){
   const player=btn.closest('.custom-audio-player'),audio=document.getElementById(audioId),icon=btn.querySelector('i');
   if(audio.paused){audio.play();icon.className='fas fa-pause';audio.ontimeupdate=function(){const progress=(audio.currentTime/audio.duration)*100;const prog=player.querySelector('.waveform-progress');if(prog)prog.style.width=progress+'%';const ct=player.querySelector('.current-time');if(ct){const m=Math.floor(audio.currentTime/60),s=Math.floor(audio.currentTime%60);ct.textContent=`${m}:${s.toString().padStart(2,'0')}`;}};audio.onended=function(){icon.className='fas fa-play';const prog=player.querySelector('.waveform-progress');if(prog)prog.style.width='0%';const ct=player.querySelector('.current-time');if(ct)ct.textContent='0:00';};}
   else{audio.pause();icon.className='fas fa-play';}
};
window.seekAudio=function(event,container,audioId){
   const audio=document.getElementById(audioId);if(!audio||!audio.duration)return;
   const rect=container.getBoundingClientRect();audio.currentTime=((event.clientX-rect.left)/rect.width)*audio.duration;
};
</script>
