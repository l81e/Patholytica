<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Article Scroller - Patholytica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-primary: #f0f0f0;
            --text-secondary: #888;
            --card-bg: #0a0a0a;
            --hover-bg: #141414;
            --border-color: #1e1e1e;
            --accent: #a855f7;
            --accent-hover: #9333ea;
            --accent-glow: rgba(168, 85, 247, 0.25);
            --accent-soft: rgba(168, 85, 247, 0.12);
        }

    body.light-theme {
        --bg-color: #f4f4f8;
        --text-primary: #0f0f14;
        --text-secondary: #606070;
        --card-bg: #f4f4f8;
        --hover-bg: #eaeaf0;
        --border-color: #dcdce8;
        --accent: #7c3aed;
        --accent-hover: #6d28d9;
        --accent-glow: rgba(124, 58, 237, 0.2);
        --accent-soft: rgba(124, 58, 237, 0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-color);
        color: var(--text-primary);
        overflow: hidden;
        transition: background 0.2s ease, color 0.2s ease;
        position: fixed;
        width: 100%;
        height: 100%;
    }

    .app-container {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 450px;
        height: 100vh;
        background: var(--bg-color);
        visibility: visible;
        opacity: 1;
    }

    .scroller-container {
        position: relative;
        width: 100%;
        height: 100vh;
        background: var(--bg-color);
        overflow: hidden;
    }

    .posts-wrapper {
        height: 100%;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        scrollbar-width: none;
    }

    .posts-wrapper::-webkit-scrollbar { display: none; }

    .article-card {
        position: relative;
        height: 100vh;
        scroll-snap-align: start;
        scroll-snap-stop: always;
        background: var(--bg-color);
        padding: 8px 22px 32px;
        padding-top: calc(20px + env(safe-area-inset-top));
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* ── Background image for article cards ── */
    .article-card-bg {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        opacity: 0.18;
        filter: blur(2px) saturate(0.7);
        z-index: 0;
        transition: opacity 0.4s ease;
    }
    .article-card-bg::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
            to bottom,
            rgba(10,10,10,0.55) 0%,
            rgba(10,10,10,0.25) 40%,
            rgba(10,10,10,0.55) 75%,
            rgba(10,10,10,0.88) 100%
        );
    }
    body.light-theme .article-card-bg::after {
        background: linear-gradient(
            to bottom,
            rgba(244,244,248,0.55) 0%,
            rgba(244,244,248,0.2) 40%,
            rgba(244,244,248,0.55) 75%,
            rgba(244,244,248,0.9) 100%
        );
    }
    .article-card > *:not(.article-card-bg) {
        position: relative;
        z-index: 1;
    }

    .article-header {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
        position: relative;
        z-index: 50;
        margin-bottom: 18px;
    }

    .author-avatar {
        width: 46px; height: 46px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), #7c3aed);
        display: flex; align-items: center; justify-content: center;
        font-size: 19px; font-weight: 700;
        color: #fff;
        overflow: hidden; flex-shrink: 0;
        cursor: pointer;
        transition: opacity 0.15s ease, box-shadow 0.2s ease;
        box-shadow: 0 0 0 2px transparent;
    }
    .author-avatar:hover {
        opacity: 0.9;
        box-shadow: 0 0 0 2px var(--accent);
    }
    .author-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .author-info { flex: 1; }
    .author-name {
        color: var(--text-primary);
        font-weight: 700;
        font-size: 15px;
        margin-bottom: 2px;
        cursor: pointer;
        display: inline-block;
        transition: color 0.15s ease;
        letter-spacing: -0.01em;
    }
    .author-name:hover { color: var(--accent); }
    .article-date {
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 500;
    }

    .follow-btn {
        position: relative;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1.5px solid var(--border-color);
        background: var(--hover-bg);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
    }
    .follow-btn:active { transform: scale(0.9); }
    .follow-btn .icon-plus,
    .follow-btn .icon-bell,
    .follow-btn .icon-check {
        position: absolute;
        width: 16px;
        height: 16px;
        transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .follow-btn .icon-plus {
        stroke: var(--text-secondary);
        fill: none;
        stroke-width: 2;
        opacity: 1;
        transform: scale(1) rotate(0deg);
    }
    .follow-btn .icon-bell {
        stroke: var(--accent);
        fill: none;
        stroke-width: 1.8;
        opacity: 0;
        transform: scale(0.4) rotate(-20deg);
    }
    .follow-btn.following {
        border-color: var(--accent);
        background: var(--accent-soft);
        box-shadow: 0 0 10px var(--accent-glow);
    }
    .follow-btn.following .icon-plus {
        opacity: 0;
        transform: scale(0.4) rotate(90deg);
    }
    .follow-btn.following .icon-bell {
        opacity: 1;
        transform: scale(1) rotate(0deg);
    }
    @keyframes bellRing {
        0%   { transform: scale(1) rotate(0deg); }
        15%  { transform: scale(1.15) rotate(-18deg); }
        30%  { transform: scale(1.15) rotate(14deg); }
        45%  { transform: scale(1.08) rotate(-10deg); }
        60%  { transform: scale(1.08) rotate(7deg); }
        75%  { transform: scale(1) rotate(-4deg); }
        90%  { transform: scale(1) rotate(2deg); }
        100% { transform: scale(1) rotate(0deg); }
    }
    .follow-btn.ringing .icon-bell {
        animation: bellRing 0.55s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
    }

    .article-title {
        font-size: 24px;
        font-weight: 800;
        color: var(--text-primary);
        margin-bottom: 12px;
        line-height: 1.2;
        flex-shrink: 0;
        letter-spacing: -0.02em;
    }

    .article-stats {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 14px;
        flex-shrink: 0;
    }
    .stat-item {
        display: flex; align-items: center; gap: 6px;
        font-size: 13px; color: var(--text-secondary);
        font-weight: 500;
    }
    .stat-item.views i { color: var(--accent); }
    .stat-item.likes i { color: #ef4444; }

    .article-content {
        color: var(--text-primary);
        font-size: 17px;
        line-height: 1.7;
        flex: 1;
        overflow-y: auto;
        padding-right: 60px;
    }
    .article-content::-webkit-scrollbar { width: 3px; }
    .article-content::-webkit-scrollbar-track { background: transparent; }
    .article-content::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
    .content-paragraph { margin-bottom: 16px; }

    .heart-burst {
        position: fixed;
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
        animation: heartBurstAnim 0.72s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .heart-burst svg {
        width: 88px;
        height: 88px;
        filter: drop-shadow(0 0 16px rgba(239,68,68,0.55));
    }
    @keyframes heartBurstAnim {
        0%   { opacity: 0;   transform: translate(-50%,-50%) scale(0.25) rotate(-12deg); }
        28%  { opacity: 1;   transform: translate(-50%,-50%) scale(1.3)  rotate(4deg); }
        52%  { opacity: 1;   transform: translate(-50%,-50%) scale(0.92) rotate(-2deg); }
        72%  { opacity: 0.9; transform: translate(-50%,-50%) scale(1.08) rotate(0deg); }
        100% { opacity: 0;   transform: translate(-50%,-50%) scale(0.8)  rotate(0deg) translateY(-18px); }
    }

    .mcq-card {
        position: relative;
        height: 100vh;
        scroll-snap-align: start;
        scroll-snap-stop: always;
        background: var(--bg-color);
        padding: 8px 22px 32px;
        padding-top: calc(20px + env(safe-area-inset-top));
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .mcq-badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: var(--accent-soft);
        border: 1px solid rgba(168, 85, 247, 0.3);
        border-radius: 20px;
        padding: 5px 13px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 18px;
        flex-shrink: 0;
        align-self: flex-start;
    }

    .mcq-question {
        font-size: 22px;
        font-weight: 800;
        color: var(--text-primary);
        line-height: 1.3;
        margin-bottom: 16px;
        flex-shrink: 0;
        padding-right: 50px;
        letter-spacing: -0.02em;
    }

    .mcq-media {
        padding-right: 60px;
        flex-shrink: 0;
        margin-bottom: 16px;
    }

    .mcq-scroll-area {
        flex: 1;
        overflow-y: auto;
        padding-right: 60px;
        display: flex;
        flex-direction: column;
        gap: 0;
    }
    .mcq-scroll-area::-webkit-scrollbar { width: 3px; }
    .mcq-scroll-area::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }

    .mcq-options { display: flex; flex-direction: column; gap: 10px; }

    .mcq-option {
        display: flex; align-items: center; gap: 13px;
        padding: 15px 16px; border-radius: 12px;
        border: 1px solid var(--border-color);
        background: var(--hover-bg); cursor: pointer;
        transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
        text-align: left; font-size: 16px; font-weight: 500;
        color: var(--text-primary); line-height: 1.4;
        -webkit-tap-highlight-color: transparent; width: 100%;
    }
    .mcq-option:hover:not(:disabled) {
        border-color: var(--accent);
        background: var(--accent-soft);
        box-shadow: 0 0 12px var(--accent-glow);
    }
    .mcq-option .opt-letter {
        width: 28px; height: 28px; border-radius: 50%;
        border: 1.5px solid var(--border-color);
        display: flex; align-items: center; justify-content: center;
        font-size: 11px; font-weight: 800; flex-shrink: 0;
        color: var(--text-secondary); transition: all 0.15s ease;
    }
    .mcq-option .opt-text { flex: 1; }
    .mcq-option:disabled { cursor: default; }
    .mcq-option.selected-correct { border-color: #4ade80; background: rgba(74,222,128,0.08); box-shadow: 0 0 12px rgba(74,222,128,0.15); }
    .mcq-option.selected-correct .opt-letter { background: #4ade80; border-color: #4ade80; color: #0a0a0a; }
    .mcq-option.selected-wrong { border-color: #ef4444; background: rgba(239,68,68,0.07); box-shadow: 0 0 12px rgba(239,68,68,0.1); }
    .mcq-option.selected-wrong .opt-letter { background: #ef4444; border-color: #ef4444; color: #fff; }
    .mcq-option.reveal-correct { border-color: rgba(74,222,128,0.5); }
    .mcq-option.reveal-correct .opt-letter { border-color: #4ade80; color: #4ade80; }

    .mcq-result-msg {
        font-size: 14px; font-weight: 700; margin-top: 16px;
        min-height: 20px; color: var(--text-secondary); flex-shrink: 0;
        letter-spacing: -0.01em;
    }
    .mcq-result-msg.correct { color: #4ade80; }
    .mcq-result-msg.wrong   { color: #ef4444; }

    .action-buttons {
        position: absolute; right: 16px; bottom: 48px;
        display: flex; flex-direction: column; gap: 22px; z-index: 10;
    }
    .action-btn {
        display: flex; flex-direction: column; align-items: center; gap: 4px;
        background: none; border: none; cursor: pointer; transition: transform 0.1s;
    }
    .action-btn:active { transform: scale(0.88); }
    .action-btn svg { width: 28px; height: 28px; stroke: var(--text-primary); fill: none; stroke-width: 2; }
    .action-btn.liked svg { fill: #ef4444; stroke: #ef4444; }
    .action-btn span { color: var(--text-secondary); font-size: 11px; font-weight: 700; }

    .media-embed { margin: 14px 0; max-width: 100%; }
    .media-embed img { width: 100%; max-width: 100%; height: auto; border-radius: 10px; display: block; }
    .media-caption { font-size: 13px; color: var(--text-secondary); margin-top: 6px; font-style: italic; }

    /* ── Enhanced Audio Player ── */
    .custom-audio-player {
        background: linear-gradient(135deg, #110d1f, #1a1030);
        border-radius: 18px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        max-width: 100%;
        border: 1px solid rgba(168,85,247,0.25);
        box-shadow: 0 8px 32px rgba(168,85,247,0.12), inset 0 1px 0 rgba(255,255,255,0.05);
        position: relative;
        overflow: hidden;
    }
    .custom-audio-player::before {
        content: '';
        position: absolute;
        top: -40px; right: -40px;
        width: 120px; height: 120px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(168,85,247,0.15), transparent 70%);
        pointer-events: none;
    }
    .audio-top-row {
        display: flex;
        align-items: center;
        gap: 13px;
    }
    .play-btn {
        width: 48px; height: 48px; border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), #7c3aed);
        border: none; color: #fff;
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        font-size: 17px; transition: transform 0.2s ease, box-shadow 0.2s ease; flex-shrink: 0;
        box-shadow: 0 0 20px rgba(168,85,247,0.5);
    }
    .play-btn:hover { transform: scale(1.08); box-shadow: 0 0 28px rgba(168,85,247,0.7); }
    .play-btn:active { transform: scale(0.95); }
    .audio-info { flex: 1; min-width: 0; overflow: hidden; }
    .audio-title {
        font-size: 13px; font-weight: 700;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        color: var(--text-primary);
        margin-bottom: 3px;
    }
    .audio-subtitle { font-size: 11px; color: var(--accent); font-weight: 600; opacity: 0.8; }
    .waveform-container {
        position: relative; height: 44px;
        background: rgba(255,255,255,0.04);
        border-radius: 10px; cursor: pointer; overflow: hidden;
        border: 1px solid rgba(168,85,247,0.12);
    }
    .waveform-progress {
        position: absolute; top: 0; left: 0; height: 100%;
        background: linear-gradient(90deg, rgba(168,85,247,0.3), rgba(192,132,252,0.15));
        transition: width 0.1s linear;
        border-radius: 10px;
    }
    .waveform-bars {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: space-around; padding: 0 6px;
    }
    .waveform-bar {
        width: 2.5px;
        background: linear-gradient(to top, rgba(168,85,247,0.8), rgba(232,121,249,0.4));
        border-radius: 2px;
        transition: background 0.2s ease;
    }
    .waveform-bar.played {
        background: linear-gradient(to top, var(--accent), #e879f9);
    }
    .audio-bottom-row {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .audio-time {
        display: flex; justify-content: space-between;
        font-size: 11px; color: var(--text-secondary); font-weight: 600;
        font-variant-numeric: tabular-nums;
        flex: 1;
    }
    .audio-speed-btn {
        background: rgba(168,85,247,0.15);
        border: 1px solid rgba(168,85,247,0.3);
        border-radius: 20px;
        color: var(--accent);
        font-size: 11px; font-weight: 800;
        padding: 4px 9px;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.1s ease;
        flex-shrink: 0;
    }
    .audio-speed-btn:hover { background: rgba(168,85,247,0.25); }
    .audio-speed-btn:active { transform: scale(0.92); }
    @keyframes audioActivePulse {
        0%, 100% { box-shadow: 0 0 20px rgba(168,85,247,0.5); }
        50% { box-shadow: 0 0 32px rgba(168,85,247,0.85); }
    }
    .play-btn.playing { animation: audioActivePulse 1.4s ease-in-out infinite; }

    /* ── Enhanced YouTube Embed ── */
    .yt-embed-wrapper {
        background: #000;
        border-radius: 18px;
        overflow: hidden;
        border: 1px solid rgba(248,113,113,0.2);
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        margin: 4px 0;
        position: relative;
    }
    .yt-embed-header {
        display: flex; align-items: center; gap: 10px;
        padding: 12px 14px;
        background: linear-gradient(135deg, #0f0000, #1a0808);
        border-bottom: 1px solid rgba(248,113,113,0.15);
    }
    .yt-embed-icon {
        width: 32px; height: 32px;
        background: #ff0000;
        border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 0 14px rgba(255,0,0,0.4);
    }
    .yt-embed-icon i { color: #fff; font-size: 14px; }
    .yt-embed-label {
        flex: 1; min-width: 0;
    }
    .yt-embed-label-title {
        font-size: 13px; font-weight: 700;
        color: #f0f0f0;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .yt-embed-label-sub { font-size: 10px; color: rgba(248,113,113,0.7); font-weight: 600; }
    .yt-embed-open-btn {
        font-size: 11px; font-weight: 800;
        color: #ff4444;
        background: rgba(255,68,68,0.1);
        border: 1px solid rgba(255,68,68,0.25);
        border-radius: 8px;
        padding: 5px 11px;
        text-decoration: none;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background 0.2s ease;
    }
    .yt-embed-open-btn:hover { background: rgba(255,68,68,0.2); }
    .yt-embed-frame-wrap {
        position: relative;
        width: 100%;
        padding-bottom: 56.25%;
        background: #000;
    }
    .yt-embed-frame-wrap iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        display: block;
    }
    .yt-embed-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 9px 14px;
        background: rgba(0,0,0,0.7);
        border-top: 1px solid rgba(255,255,255,0.05);
    }
    .yt-embed-footer-text {
        font-size: 10px;
        color: rgba(255,255,255,0.3);
        font-weight: 500;
    }
    .yt-embed-pip-hint {
        font-size: 10px;
        color: rgba(248,113,113,0.5);
        font-weight: 600;
    }

    .share-toast {
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(10px);
        background: #1a1a1a; border: 1px solid var(--border-color);
        border-radius: 14px; padding: 11px 20px;
        font-size: 13px; font-weight: 700; color: var(--text-primary);
        z-index: 9999; opacity: 0;
        transition: opacity 0.2s ease, transform 0.2s ease;
        pointer-events: none; white-space: nowrap;
        box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .share-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .comments-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 199; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; backdrop-filter: blur(4px); }
    .comments-overlay.active { opacity: 1; pointer-events: all; }
    .comments-popup {
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%) scale(0.9);
        width: calc(100% - 40px); max-width: 500px;
        height: 70vh; max-height: 600px;
        background: #111; border-radius: 20px; z-index: 200;
        opacity: 0; pointer-events: none;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex; flex-direction: column;
        box-shadow: 0 24px 80px rgba(0,0,0,0.7), 0 0 0 1px var(--border-color);
    }
    .comments-popup.active { opacity: 1; pointer-events: all; transform: translate(-50%, -50%) scale(1); }
    .comments-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--border-color); }
    .comments-header h3 { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
    .close-comments { background: none; border: none; color: var(--text-primary); font-size: 24px; cursor: pointer; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; transition: background 0.2s ease; }
    .close-comments:hover { background: var(--hover-bg); }
    .comments-list { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .comments-list::-webkit-scrollbar { width: 4px; }
    .comments-list::-webkit-scrollbar-track { background: transparent; }
    .comments-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 2px; }
    .comment-item { display: flex; gap: 12px; margin-bottom: 20px; }

    @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
    .skeleton-base {

    .skeleton-card { position: relative; height: 100vh; scroll-snap-align: start; scroll-snap-stop: always; background: var(--bg-color); padding: 8px 22px 32px; padding-top: calc(20px + env(safe-area-inset-top)); display: flex; flex-direction: column; }

    .library-picker-card {

        padding-top: calc(20px + env(safe-area-inset-top));

    }

    .lp-card-logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; margin-bottom: 16px; }

    .lp-card-title { font-size: 24px; font-weight: 900; color: var(--text-primary); line-height: 1.15; margin-bottom: 6px; flex-shrink: 0; letter-spacing: -0.03em; }

    .lp-card-divider-text { font-size: 10px; font-weight: 800; color: var(--text-secondary); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }

    .lp-section-label {
        font-size: 10px; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase;

    .lp-item { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--border-color); background: var(--hover-bg); cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease; -webkit-tap-highlight-color: transparent; flex-shrink: 0; }
    .lp-item:hover { border-color: rgba(168,85,247,0.3); }

    .lp-item.faved-item { border-color: rgba(168,85,247,0.2); background: rgba(168,85,247,0.04); }
    .lp-item.faved-item.selected { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 14px var(--accent-glow); }

    .lp-fav-star { font-size: 12px; color: var(--accent); flex-shrink: 0; margin-right: -4px; }
    .lp-card-loading { display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--text-secondary); font-size: 13px; padding: 24px 0; flex-shrink: 0; }
    .lp-card-actions { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
    .lp-card-start-btn { width: 100%; padding: 15px; border-radius: 14px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 800; border: none; cursor: pointer; transition: background 0.15s ease, opacity 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease; letter-spacing: -0.01em; }
    .lp-card-start-btn:hover:not(:disabled) { background: var(--accent-hover); box-shadow: 0 0 24px var(--accent-glow); }
    .lp-card-start-btn:active:not(:disabled) { transform: scale(0.98); }
    .lp-card-start-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .lp-card-scroll-hint { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--text-secondary); padding: 4px 0 0; flex-shrink: 0; font-weight: 500; }

    @keyframes lp-btn-launch {
        0%   { transform: scale(1);    opacity: 1; }
        30%  { transform: scale(1.03); opacity: 1; }
        60%  { transform: scale(0.97); opacity: 0.85; }
        100% { transform: scale(1);    opacity: 1; }

    @keyframes lp-card-exit {
        0%   { opacity: 1; transform: translateY(0) scale(1); }
        100% { opacity: 0; transform: translateY(-24px) scale(0.97); }

    #confettiCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9998; }

    /* ── Term links & popup ── */
    .term-link {
        color: var(--accent);
        border-bottom: 1px dashed rgba(168,85,247,0.5);

        font-weight: 600;
        transition: opacity 0.15s ease, text-shadow 0.15s ease;
        -webkit-tap-highlight-color: transparent;

    .term-popup-close:hover { background: var(--border-color); }

    /* ── EmoType styles — purple theme ── */

<!-- ── Confetti ── -->
<script>
    (function() {
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animFrame = null;
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();
        const COLORS = ['#a855f7','#c084fc','#e879f9','#818cf8','#4ade80','#f472b6','#facc15','#fff'];
        function spawnParticles(x, y) {
            for (let i = 0; i < 80; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                particles.push({ x: x ?? canvas.width/2, y: y ?? canvas.height*0.4, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed-3, size: Math.random()*7+3, color: COLORS[Math.floor(Math.random()*COLORS.length)], alpha: 1, rotation: Math.random()*Math.PI*2, rotSpeed: (Math.random()-0.5)*0.2, shape: Math.random()>0.5?'rect':'circle' });
            }
            if (!animFrame) animate();
        }
        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            particles = particles.filter(p => p.alpha > 0.01);
            particles.forEach(p => {
                p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.vx*=0.99; p.alpha-=0.018; p.rotation+=p.rotSpeed;
                ctx.save(); ctx.globalAlpha=Math.max(0,p.alpha); ctx.translate(p.x,p.y); ctx.rotate(p.rotation); ctx.fillStyle=p.color;
                if(p.shape==='rect'){ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);}else{ctx.beginPath();ctx.arc(0,0,p.size/2,0,Math.PI*2);ctx.fill();}
                ctx.restore();
            });
            if(particles.length>0){animFrame=requestAnimationFrame(animate);}else{animFrame=null;ctx.clearRect(0,0,canvas.width,canvas.height);}
        }
        window.launchConfetti = function(targetEl) {
            if(targetEl){const r=targetEl.getBoundingClientRect();spawnParticles(r.left+r.width/2,r.top+r.height/2);}else{spawnParticles();}
        };
    })();
</script>

<script>
    window._termPopupOutside = null;
    window.openTermPopup = function(term, explanation, event) {
        const popup = document.getElementById('termPopup');
        document.getElementById('termPopupTerm').textContent = term;
        document.getElementById('termPopupBody').innerHTML = explanation;
        const POPUP_W=270,POPUP_H=160,MARGIN=8,vw=window.innerWidth,vh=window.innerHeight;
        let anchorX=event?event.clientX:vw/2, anchorY=event?event.clientY:vh/2;
        let left=anchorX-POPUP_W/2, top=anchorY+16;
        left=Math.max(MARGIN,Math.min(left,vw-POPUP_W-MARGIN));
        if(top+POPUP_H>vh-MARGIN)top=anchorY-POPUP_H-10;
        top=Math.max(MARGIN,top);
        popup.style.left=left+'px'; popup.style.top=top+'px';
        popup.classList.add('active');
        if(window._termPopupOutside)document.removeEventListener('click',window._termPopupOutside);
        setTimeout(()=>{
            window._termPopupOutside=function(e){if(!popup.contains(e.target)&&!e.target.classList.contains('term-link'))closeTermPopup();};
            document.addEventListener('click',window._termPopupOutside,{once:true});
        },10);
    };
    window.closeTermPopup = function() {
        document.getElementById('termPopup').classList.remove('active');
        if(window._termPopupOutside){document.removeEventListener('click',window._termPopupOutside);window._termPopupOutside=null;}
    };
</script>

<!-- ── EmojiType + Term renderer ── -->
<script>
    const EMOJI_MAP = {
        '🔍':'emo-magnify','❗':'emo-urgent','📌':'emo-pinned','🔥':'emo-fire','💎':'emo-diamond',
        '🟡':'emo-yellow','🔵':'emo-blue','🟢':'emo-green','🟣':'emo-purple','🔴':'emo-red',
        '⚫':'emo-dark','🧠':'emo-brain','📖':'emo-book','💡':'emo-idea','🎯':'emo-target',
        '🧩':'emo-puzzle','🏷️':'emo-tag','🔬':'emo-micro','⚠️':'emo-warning','✅':'emo-check',
        '❌':'emo-cross','⏳':'emo-hourglass','🔒':'emo-lock','🔓':'emo-unlock','⚡':'emo-lightning',
        '🌊':'emo-wave','🌀':'emo-spin','💫':'emo-float','🚀':'emo-rocket','🎬':'emo-cinematic',
        '🌟':'emo-star','✨':'emo-sparkle','🌈':'emo-rainbow','👑':'emo-crown','🪄':'emo-magic',
        '❤️':'emo-heart','😄':'emo-happy','😌':'emo-calm','😮':'emo-surprised','😎':'emo-cool',
        '🤖':'emo-robot','🧪':'emo-science','🏛️':'emo-temple','🌍':'emo-earth','💰':'emo-money',
        '⚖️':'emo-balance','📡':'emo-signal','🎵':'emo-music','🧊':'emo-ice','🔊':'emo-sound',
    };
    function buildEmojiPattern(){const keys=Object.keys(EMOJI_MAP).sort((a,b)=>b.length-a.length);const escaped=keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');return new RegExp(`(${escaped})([\\s\\S]*?)\\1`,'gu');}
    function escHtmlET(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
    function renderTerms(html){return html.replace(/([A-Za-z][A-Za-z0-9\-']{0,60}?)&lt;([^&]{1,600}?)&gt;/g,function(match,term,explanation){const safeTerm=term.trim().replace(/'/g,'&#39;');const safeExp=explanation.replace(/'/g,'&#39;');return `<span class="term-link" onclick="openTermPopup('${safeTerm}','${safeExp}',event)">${term.trim()}</span>`;});}
    function renderEmojiText(text,applyTerms=true){const re=buildEmojiPattern();let result='',lastIndex=0,match;while((match=re.exec(text))!==null){result+=escHtmlET(text.slice(lastIndex,match.index));const cls=EMOJI_MAP[match[1]];result+=`<span class="${cls}">${renderEmojiText(match[2],false)}</span>`;lastIndex=re.lastIndex;}result+=escHtmlET(text.slice(lastIndex));return applyTerms?renderTerms(result):result;}
</script>

                    swapPickerForSkeleton();
                    anchorArticleId = null; articles = []; offset = 0; hasMore = true; isLoading = false;

                    const errToast = document.createElement('div');
                    errToast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#ef4444;color:#fff;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:700;z-index:9999;';

                    anchorArticleId = id; filteredArticleIds = null;
                    articles = []; offset = 0; hasMore = true; isLoading = false;
                    document.getElementById('postsWrapper').querySelectorAll('.article-card, .mcq-card').forEach(c => c.remove());
                    loadArticles(true);
                });
            } catch(e) { swapPickerForSkeleton(); articles = []; offset = 0; hasMore = true; isLoading = false; loadArticles(true); }
        }

        idGoBtn.addEventListener('click', handleIdSearch);
        idInput.addEventListener('keypress', e => { if (e.key === 'Enter') handleIdSearch(); });

        try {
            const { data: libs, error } = await supabase.from('playlists').select('id, name, description').order('name', { ascending: true });
            if (error || !libs || libs.length === 0) { grid.innerHTML = ''; return; }
            const { data: countRows } = await supabase.from('playlist_items').select('playlist_id');
            const countMap = {};
            (countRows || []).forEach(r => { countMap[r.playlist_id] = (countMap[r.playlist_id] || 0) + 1; });

            const filteredLibs = libs.filter(lib => (countMap[lib.id] || 0) > 0);

            const favedLibs = filteredLibs.filter(l => userFavLibs.has(String(l.id))).sort((a,b) => (countMap[b.id]||0) - (countMap[a.id]||0));
            const otherLibs = filteredLibs.filter(l => !userFavLibs.has(String(l.id))).sort((a,b) => (countMap[b.id]||0) - (countMap[a.id]||0));

            if (filteredLibs.length === 0) { grid.innerHTML = ''; return; }
            grid.innerHTML = '';

            function renderLibItem(lib, isFaved) {
                const articleCount = countMap[lib.id] || 0;
                const item = document.createElement('div');
                item.className = 'lp-item' + (isFaved ? ' faved-item' : '');
                item.dataset.id = lib.id;
                item.innerHTML = `
                    <div class="lp-check">✓</div>
                    <div class="lp-info">
                        <div class="lp-name">${lib.name || 'Untitled Library'}</div>
                        <div class="lp-meta">${lib.description || ''}</div>
                    </div>
                    ${isFaved ? '<div class="lp-fav-star"><i class="fas fa-heart"></i></div>' : ''}
                    <div class="lp-article-count">${articleCount} article${articleCount !== 1 ? 's' : ''}</div>`;
                item.addEventListener('click', () => {
                    const id = String(lib.id);
                    if (selected.has(id)) { selected.delete(id); item.classList.remove('selected'); }
                    else { if (selected.size >= 5) return; selected.add(id); item.classList.add('selected'); }
                    const n = selected.size;
                    hint.textContent = `${n} / 5 selected`;
                    startBtn.disabled = n === 0;
                    grid.querySelectorAll('.lp-item').forEach(el => {
                        if (!el.classList.contains('selected')) { el.style.opacity = n >= 5 ? '0.4' : '1'; el.style.pointerEvents = n >= 5 ? 'none' : ''; }
                        else { el.style.opacity = '1'; el.style.pointerEvents = ''; }
                    });
                });
                return item;
            }

            if (favedLibs.length > 0) {
                const favLabel = document.createElement('div');
                favLabel.className = 'lp-section-label';
                favLabel.innerHTML = '<i class="fas fa-heart"></i> Your Saved Libraries';

                if (otherLibs.length > 0) {
                    const otherLabel = document.createElement('div');

            startBtn.addEventListener('click', async () => {
                startBtn.disabled = true; startBtn.textContent = 'Loading…';
                animatePickerOut(async () => {
                    const playlistIds = [...selected].map(Number);
                    const { data: items } = await supabase.from('playlist_items').select('article_id').in('playlist_id', playlistIds);
                    const articleIds = [...new Set((items || []).map(r => r.article_id))];
                    filteredArticleIds = articleIds.length > 0 ? articleIds : null;
                    articles = []; offset = 0; hasMore = true; isLoading = false;
                    const wrapper = document.getElementById('postsWrapper');
                    wrapper.querySelectorAll('.article-card, .mcq-card').forEach(c => c.remove());
                    loadArticles(true);
                });

        } catch(e) { console.error('Library picker error:', e); grid.innerHTML = ''; }
    }

    function isMCQ(content) { return typeof content === 'string' && content.trimStart().startsWith('❔'); }
    function parseMCQ(content) {
        const lines = content.trim().split('\n').map(l => l.trim()).filter(Boolean);
        const questionLine = lines[0].replace(/^❔/, '').trim();
        const options = lines.slice(1).map(line => { const correct = line.startsWith('✅'); return { label: line.replace(/^✅/, '').trim(), correct }; });
        for (let i = options.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [options[i], options[j]] = [options[j], options[i]]; }
        return { question: questionLine, options };
    }

            const barCount = 28;
            const bars = Array(barCount).fill(0).map(() => `<div class="waveform-bar" style="height:${Math.random()*55+15}%"></div>`).join('');
            d.innerHTML = `
                <div class="custom-audio-player" id="player-${aid}">
                    <div class="audio-top-row">

        } else if (m.type === 'youtube') {
            const ytMatch = m.url.match(/embed\/([A-Za-z0-9_-]{11})/);
            const videoId = ytMatch ? ytMatch[1] : '';
            const label = m.caption || (videoId ? `youtube.com/watch?v=${videoId}` : 'YouTube Video');
            const thumbUrl = videoId ? `https://img.youtube.com/vi/${videoId}/mqdefault.jpg` : '';

    function buildAuthorHeader(article) {
        const avatarContent = getAvatarContent(article);

        const authorFirebaseUid = article.firebase_user_id || '';
        const authorUsername = article.authorUsername || '';

            ? `profile.html?username=${encodeURIComponent(authorUsername)}`
            : (authorFirebaseUid ? `profile.html?id=${encodeURIComponent(authorFirebaseUid)}` : '#');

        const showFollow = authorSupaId && (!currentUser || String(currentUser.user_id) !== String(authorSupaId));

        const followBtnHTML = showFollow ? `
            <button class="follow-btn ${isFollowing ? 'following' : ''}"
                data-supa-uid="${authorSupaId}"

    function buildMCQCard(article, index) {
        const { question, options } = parseMCQ(article.content);
        const isLiked = userLikes.has(String(article.id));
        const letters = ['A','B','C','D','E','F'];
        const card = document.createElement('div');
        card.className = 'mcq-card';
        card.dataset.index = index;
        card.dataset.articleId = article.id;
        card.innerHTML = `
            <div class="article-header">${buildAuthorHeader(article)}</div>
            <div class="mcq-badge">❔ Quick Question</div>
            <div class="mcq-question">${renderEmojiText(question)}</div>
            <div class="mcq-media" id="mcq-media-${article.id}"></div>
            <div class="mcq-scroll-area">
                <div class="mcq-options" id="mcq-opts-${article.id}"></div>
                <div class="mcq-result-msg" id="mcq-msg-${article.id}"></div>
            </div>
            <div class="action-buttons">
                <button class="action-btn like-btn ${isLiked ? 'liked' : ''}" data-id="${article.id}">
                    <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>

                    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    <span class="comment-count">0</span>
                </button>
                <button class="action-btn share-btn" data-id="${article.id}" data-title="${(article.title||'').replace(/"/g,'&quot;')}">
                    <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                    <span>Share</span>
                </button>
            </div>`;

        if (article.media && article.media.length > 0) {
            const mediaContainer = card.querySelector(`#mcq-media-${article.id}`);
            article.media.forEach(m => mediaContainer.appendChild(createMediaElement(m)));
        }
        const optsContainer = card.querySelector(`#mcq-opts-${article.id}`);
        const msgEl = card.querySelector(`#mcq-msg-${article.id}`);
        let answered = false;
        options.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'mcq-option';

            btn.addEventListener('click', () => {
                if (answered) return;
                answered = true;
                optsContainer.querySelectorAll('.mcq-option').forEach(b => b.disabled = true);

                    btn.classList.add('selected-correct');
                    msgEl.textContent = '✓ Correct!';
                    msgEl.className = 'mcq-result-msg correct';
                    window.launchConfetti(btn);
                } else {
                    btn.classList.add('selected-wrong');
                    msgEl.className = 'mcq-result-msg wrong';
                    const correctIdx = options.findIndex(o => o.correct);
                    if (correctIdx !== -1) { optsContainer.querySelectorAll('.mcq-option')[correctIdx].classList.add('reveal-correct'); msgEl.textContent = `✗ The answer was: ${options[correctIdx].label}`; }
                    else { msgEl.textContent = '✗ Incorrect'; }
                }
            });
            optsContainer.appendChild(btn);
        });
        setupDoubleTap(card, article.id);
        return card;
    }

    function formatNumber(num) { if (num >= 1000000) return (num/1000000).toFixed(1)+'M'; if (num >= 1000) return (num/1000).toFixed(1)+'K'; return (num || 0).toString(); }
    function formatDate(date) { const now=new Date(),ms=now-date,mins=Math.floor(ms/60000),hrs=Math.floor(ms/3600000),days=Math.floor(ms/86400000); if(mins<60)return `${mins}m ago`; if(hrs<24)return `${hrs}h ago`; if(days<7)return `${days}d ago`; return date.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
    function getAvatarContent(article) {
        if (article.authorPfp) return `<img src="${article.authorPfp}" alt="${article.author}">`;
        let letter = 'A';
        if (article.authorUsername) { letter = article.authorUsername.charAt(0).toUpperCase(); }
        else if (article.author) { const atIdx = article.author.indexOf('@'); letter = atIdx !== -1 && article.author.length > atIdx+1 ? article.author.charAt(atIdx+1).toUpperCase() : article.author.charAt(0).toUpperCase(); }
        return letter;
    }

    async function getCurrentUser() {
        try { const firebaseUser = auth.currentUser; if (!firebaseUser) return null; const { data, error } = await supabase.from('users').select('user_id, firebase_uid, username').eq('firebase_uid', firebaseUser.uid).single(); if (error) return null; return data; } catch(e) { return null; }
    }

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUser = await getCurrentUser();
            if (currentUser) await Promise.all([loadUserLikes(), loadUserFollowing(), loadUserFavLibs()]);
        } else { currentUser = null; userLikes.clear(); userFollowing.clear(); userFavLibs.clear(); }
    });

    async function loadUserFavLibs() {
        if (!currentUser) return;
        try { const { data } = await supabase.from('favourite_playlists').select('playlist_id').eq('user_id', currentUser.user_id); userFavLibs.clear(); (data || []).forEach(r => userFavLibs.add(String(r.playlist_id))); } catch(e) {}
    }

    async function loadUserLikes() {
        if (!currentUser) return;
        try { const { data: likes } = await supabase.from('likes').select('article_id').eq('user_id', currentUser.user_id); userLikes.clear(); (likes || []).forEach(l => userLikes.add(String(l.article_id))); updateLikeButtons(); } catch(e) {}
    }
    function updateLikeButtons() { document.querySelectorAll('.like-btn').forEach(btn => { btn.classList.toggle('liked', userLikes.has(String(btn.dataset.id))); }); }

    async function handleLike(e) {
        const btn = e.currentTarget, id = String(btn.dataset.id), countSpan = btn.querySelector('.like-count');
        if (!currentUser) { alert('Please log in to like articles'); window.location.href = 'https://patholytica.com/login'; return; }
        if (btn.dataset.processing === 'true') return;
        btn.dataset.processing = 'true';
        const wasLiked = userLikes.has(id);
        const artIdx = articles.findIndex(a => String(a.id) === id);
        const prevRealCount = artIdx !== -1 ? (articles[artIdx].likes || 0) : 0;
        const newCount = wasLiked ? Math.max(0, prevRealCount - 1) : prevRealCount + 1;
        if (wasLiked) { userLikes.delete(id); btn.classList.remove('liked'); } else { userLikes.add(id); btn.classList.add('liked'); }
        countSpan.textContent = formatNumber(newCount);
        const card = btn.closest('.article-card, .mcq-card');
        if (card) { const s = card.querySelector('.stat-item.likes span'); if (s) s.textContent = formatNumber(newCount); }
        if (artIdx !== -1) articles[artIdx].likes = newCount;
        try {
            if (wasLiked) {
                await supabase.from('likes').delete().eq('article_id', parseInt(id)).eq('user_id', currentUser.user_id);
                const { error: rpcErr } = await supabase.rpc('decrement_likes', { article_id: parseInt(id) });
                if (rpcErr) { const { data: fresh } = await supabase.from('articles').select('likes').eq('id', id).single(); await supabase.from('articles').update({ likes: Math.max(0,(fresh?.likes||1)-1) }).eq('id', id); }
            } else {
                const { error: insErr } = await supabase.from('likes').insert([{ article_id: parseInt(id), user_id: currentUser.user_id }]);
                if (insErr && insErr.code !== '23505') throw insErr;
                const { error: rpcErr } = await supabase.rpc('increment_likes', { article_id: parseInt(id) });
                if (rpcErr) { const { data: fresh } = await supabase.from('articles').select('likes').eq('id', id).single(); await supabase.from('articles').update({ likes: (fresh?.likes||0)+1 }).eq('id', id); }
            }
        } catch(err) {
            console.error(err);
            if (wasLiked) { userLikes.add(id); btn.classList.add('liked'); } else { userLikes.delete(id); btn.classList.remove('liked'); }
            countSpan.textContent = formatNumber(prevRealCount);
            if (card) { const s = card.querySelector('.stat-item.likes span'); if (s) s.textContent = formatNumber(prevRealCount); }
            if (artIdx !== -1) articles[artIdx].likes = prevRealCount;
        } finally { btn.dataset.processing = 'false'; }
    }

    async function loadArticles(isInitial = true) {
        if (isLoading || (!isInitial && !hasMore)) return;
        isLoading = true;
        try {
            if (isInitial && anchorArticleId !== null) {
                const { data: anchorArt, error: anchorErr } = await supabase.from('articles').select('*').eq('id', anchorArticleId).single();
                if (anchorErr || !anchorArt) { anchorArticleId = null; }
                else {
                    const { data: rest } = await supabase.from('articles').select('*').order('created_at', { ascending: false }).lt('created_at', anchorArt.created_at).limit(LIMIT - 1);
                    const combined = [anchorArt, ...(rest || [])];
                    await enrichAndRender(combined, isInitial);
                    offset = LIMIT; isLoading = false; return;
                }
            }
            let query = supabase.from('articles').select('*').order('created_at', { ascending: false }).range(offset, offset + LIMIT - 1);
            if (filteredArticleIds !== null) {
                if (filteredArticleIds.length === 0) {
                    const wrapper = document.getElementById('postsWrapper');
                    wrapper.querySelectorAll('.skeleton-card').forEach(s => s.remove());
                    wrapper.innerHTML += `<div class="loading-container" style="height:100vh;scroll-snap-align:start;"><i class="fas fa-inbox" style="font-size:48px;color:var(--accent);opacity:0.4;"></i><div>No articles in selected libraries</div></div>`;
                    isLoading = false; return;
                }
                query = query.in('id', filteredArticleIds);
            }
            const { data: articlesData, error } = await query;
            if (error) throw error;
            if (!articlesData || articlesData.length === 0) {
                if (isInitial) { const wrapper = document.getElementById('postsWrapper'); wrapper.querySelectorAll('.skeleton-card').forEach(s => s.remove()); wrapper.innerHTML += `<div class="loading-container" style="height:100vh;scroll-snap-align:start;"><i class="fas fa-inbox" style="font-size:48px;color:var(--accent);opacity:0.4;"></i><div>No articles found</div></div>`; }
                hasMore = false; isLoading = false; return;
            }
            if (articlesData.length < LIMIT) hasMore = false;
            offset += articlesData.length;
            await enrichAndRender(articlesData, isInitial);
            isLoading = false;
        } catch(e) {
            console.error('Error loading articles:', e);
            if (isInitial) { const wrapper = document.getElementById('postsWrapper'); wrapper.querySelectorAll('.skeleton-card').forEach(s => s.remove()); wrapper.innerHTML += `<div class="loading-container" style="height:100vh;scroll-snap-align:start;"><i class="fas fa-exclamation-triangle" style="font-size:48px;color:var(--accent);opacity:0.4;"></i><div>Failed to load articles</div></div>`; }
            isLoading = false;
        }
    }

    async function enrichAndRender(articlesData, isInitial) {
        const userIds = [...new Set(articlesData.map(a => a.firebase_user_id).filter(Boolean))];
        let usersData = [];
        if (userIds.length > 0) {
            const { data: users } = await supabase.from('users').select('firebase_uid, username, full_name, pfp, user_id').in('firebase_uid', userIds);
            usersData = users || [];
            usersData.forEach(u => { if (u.firebase_uid && u.user_id) { supaUserIdToFirebaseUid[u.user_id] = u.firebase_uid; firebaseUidToSupaUserId[u.firebase_uid] = u.user_id; } });
        }
        const articleIds = articlesData.map(a => a.id);
        const { data: mediaData } = await supabase.from('media').select('*').in('article_id', articleIds).order('display_order', { ascending: true });
        const newArticles = articlesData.map(article => {
            const user = usersData.find(u => u.firebase_uid === article.firebase_user_id);
            return { ...article, author: user?.username ? `@${user.username}` : (user?.full_name || 'Anonymous'), authorPfp: user?.pfp || null, authorUsername: user?.username || null, authorSupaUserId: user?.user_id || null, media: (mediaData || []).filter(m => m.article_id === article.id) };
        });
        articles = [...articles, ...newArticles];
        renderArticles(isInitial);
    }

    function renderArticles(isInitial = true) {
        const wrapper = document.getElementById('postsWrapper');
        if (isInitial) { wrapper.querySelectorAll('.skeleton-card').forEach(s => s.remove()); wrapper.querySelectorAll('.article-card, .mcq-card').forEach(c => c.remove()); }
        else { const last = wrapper.lastElementChild; if (last && last.classList.contains('skeleton-card')) last.remove(); }

        const startIndex = isInitial ? 0 : articles.length - LIMIT;

        for (let index = startIndex; index < articles.length; index++) {
            const article = articles[index];
            if (isMCQ(article.content)) {
                wrapper.appendChild(buildMCQCard(article, index));
            } else {
                const articleDiv = document.createElement('div');
                articleDiv.className = 'article-card';
                articleDiv.dataset.index = index;
                articleDiv.dataset.articleId = article.id;

                // ── Background image: use first image media if available ──
                const firstImg = article.media && article.media.find(m => m.type === 'image');
                if (firstImg) {
                    const bgDiv = document.createElement('div');
                    bgDiv.className = 'article-card-bg';
                    bgDiv.style.backgroundImage = `url('${firstImg.url}')`;
                    articleDiv.appendChild(bgDiv);
                }

                const contentDiv = document.createElement('div');
                contentDiv.className = 'article-content';
                const paragraphs = (article.content || 'No content available').split('\n\n');
                paragraphs.forEach((paragraph, pIndex) => {
                    if (paragraph.trim()) {
                        const p = document.createElement('div');
                        p.className = 'content-paragraph';
                        p.innerHTML = renderEmojiText(paragraph.trim());
                        contentDiv.appendChild(p);
                        // Non-image media still renders inline in content
                        if (article.media?.length > 0) {
                            article.media
                                .filter(m => m.display_order === pIndex && m.type !== 'image')
                                .forEach(m => contentDiv.appendChild(createMediaElement(m)));
                        }
                    }
                });
                // Non-image media beyond paragraph range
                if (article.media) {
                    article.media
                        .filter(m => m.display_order >= paragraphs.length && m.type !== 'image')
                        .forEach(m => contentDiv.appendChild(createMediaElement(m)));
                    // Image-type media still renders inline too (in addition to bg), so users can see it clearly
                    article.media
                        .filter(m => m.type === 'image')
                        .forEach(m => contentDiv.appendChild(createMediaElement(m)));
                }

                const isLiked = userLikes.has(String(article.id));
                articleDiv.innerHTML += `
                    <div class="article-header">${buildAuthorHeader(article)}</div>
                    <div class="article-title">${renderEmojiText(article.title || 'Untitled')}</div>
                    <div class="article-stats">
                        <div class="stat-item views"><i class="fas fa-eye"></i><span>${formatNumber(article.views || 0)}</span></div>
                        <div class="stat-item likes"><i class="fas fa-heart"></i><span>${formatNumber(article.likes || 0)}</span></div>
                    </div>
                    <div class="action-buttons">
                        <button class="action-btn like-btn ${isLiked ? 'liked' : ''}" data-id="${article.id}">
                            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                            <span class="like-count">${formatNumber(article.likes || 0)}</span>
                        </button>
                        <button class="action-btn comment-btn" data-id="${article.id}">
                            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                            <span class="comment-count">0</span>
                        </button>
                        <button class="action-btn share-btn" data-id="${article.id}" data-title="${(article.title||'').replace(/"/g,'&quot;')}">
                            <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                            <span>Share</span>
                        </button>
                    </div>`;
                articleDiv.querySelector('.article-stats').insertAdjacentElement('afterend', contentDiv);
                wrapper.appendChild(articleDiv);
                setupDoubleTap(articleDiv, article.id);
            }
        }

        if (hasMore) { const skDiv = document.createElement('div'); skDiv.className = 'skeleton-card'; skDiv.innerHTML = skeletonCardHTML(); wrapper.appendChild(skDiv); }

        document.querySelectorAll('.like-btn').forEach(btn => btn.addEventListener('click', handleLike));
        document.querySelectorAll('.comment-btn').forEach(btn => btn.addEventListener('click', handleComments));
        document.querySelectorAll('.share-btn').forEach(btn => btn.addEventListener('click', () => shareArticle(btn.dataset.id, btn.dataset.title)));
        updateFollowButtons();

        if (isInitial) { wrapper.addEventListener('scroll', handleScroll); loadCommentCounts(); setupIntersectionObserver(); }
        else { setupIntersectionObserverForNew(startIndex); loadCommentCounts(); }
    }

    function setupIntersectionObserver() {
        const obs = new IntersectionObserver((entries) => { entries.forEach(entry => { const id = entry.target.dataset.articleId; if (!id) return; if (entry.isIntersecting && entry.intersectionRatio >= 0.75) startViewTimer(id); else clearViewTimer(id); }); }, { threshold: [0.75] });
        document.querySelectorAll('.article-card, .mcq-card').forEach(c => { if (c.dataset.articleId) obs.observe(c); });
    }
    function setupIntersectionObserverForNew(startIndex) {
        const obs = new IntersectionObserver((entries) => { entries.forEach(entry => { const id = entry.target.dataset.articleId; if (!id) return; if (entry.isIntersecting && entry.intersectionRatio >= 0.75) startViewTimer(id); else clearViewTimer(id); }); }, { threshold: [0.75] });
        document.querySelectorAll('.article-card, .mcq-card').forEach(c => { if (c.dataset.index >= startIndex && c.dataset.articleId) obs.observe(c); });
    }
    function startViewTimer(id) { if (viewedArticles.has(id) || viewTimers[id]) return; viewTimers[id] = setTimeout(async () => { await incrementView(id); }, 5000); }
    function clearViewTimer(id) { if (viewTimers[id]) { clearTimeout(viewTimers[id]); delete viewTimers[id]; } }
    async function incrementView(id) {
        if (viewedArticles.has(id)) return;
        try {
            viewedArticles.add(id);
            const { data: a } = await supabase.from('articles').select('views').eq('id', id).single();
            const nv = (a.views || 0) + 1;
            await supabase.from('articles').update({ views: nv }).eq('id', id);
            const idx = articles.findIndex(a => a.id === id);
            if (idx !== -1) articles[idx].views = nv;
            const card = document.querySelector(`.article-card[data-article-id="${id}"], .mcq-card[data-article-id="${id}"]`);
            if (card) { const s = card.querySelector('.stat-item.views span'); if (s) s.textContent = formatNumber(nv); }
        } catch(e) { viewedArticles.delete(id); }
    }

    async function loadCommentCounts() {
        try { const { data: comments } = await supabase.from('comments').select('article_id'); const counts = {}; (comments || []).forEach(c => { counts[c.article_id] = (counts[c.article_id] || 0) + 1; }); document.querySelectorAll('.comment-btn').forEach(btn => { btn.querySelector('.comment-count').textContent = counts[btn.dataset.id] || 0; }); } catch(e) {}
    }
    async function handleComments(e) { currentArticleId = e.currentTarget.dataset.id; await loadComments(currentArticleId); openComments(); }
    async function loadComments(articleId) {
        const list = document.getElementById('commentsList');
        list.innerHTML = '<div class="loading-container"><div class="spinner" style="width:32px;height:32px;border-width:3px;"></div></div>';
        try {
            const { data: comments } = await supabase.from('comments').select('*').eq('article_id', articleId).order('created_at', { ascending: true });
            if (!comments || !comments.length) { list.innerHTML = `<div class="no-comments"><i class="fas fa-comments"></i><div>No comments yet</div><div style="font-size:12px;">Be the first to comment!</div></div>`; return; }
            const uids = [...new Set(comments.map(c => c.user_id).filter(Boolean))];
            let usersMap = {};
            if (uids.length > 0) { const { data: users } = await supabase.from('users').select('user_id, username, full_name, pfp').in('user_id', uids); if (users) users.forEach(u => { usersMap[u.user_id] = u; }); }
            list.innerHTML = comments.map(c => { const u = usersMap[c.user_id], author = u?.username ? `@${u.username}` : (u?.full_name || 'Anonymous'); const av = u?.pfp ? `<img src="${u.pfp}" alt="${author}">` : (u?.username || 'A')[0].toUpperCase(); return `<div class="comment-item"><div class="comment-avatar">${av}</div><div class="comment-content"><div class="comment-author">${author}</div><div class="comment-text">${renderEmojiText(c.comment_text)}</div><div class="comment-time">${formatDate(new Date(c.created_at))}</div></div></div>`; }).join('');
        } catch(e) { list.innerHTML = `<div class="no-comments"><i class="fas fa-exclamation-triangle"></i><div>Failed to load comments</div></div>`; }
    }
    window.openComments = () => { document.getElementById('commentsPopup').classList.add('active'); document.getElementById('commentsOverlay').classList.add('active'); document.body.style.overflow = 'hidden'; };
    window.closeComments = () => { document.getElementById('commentsPopup').classList.remove('active'); document.getElementById('commentsOverlay').classList.remove('active'); document.body.style.overflow = ''; };
    window.sendComment = async function() {
        const input = document.getElementById('commentInput'), text = input.value.trim();
        if (!text || !currentArticleId) return;
        const sendBtn = document.getElementById('sendCommentBtn'); sendBtn.disabled = true;
        try {
            if (!currentUser) currentUser = await getCurrentUser();
            if (!currentUser) { window.location.href = 'https://patholytica.com/login'; return; }
            await supabase.from('comments').insert([{ article_id: currentArticleId, user_id: currentUser.user_id, comment_text: text }]);
            input.value = ''; await loadComments(currentArticleId);
            const cb = document.querySelector(`.comment-btn[data-id="${currentArticleId}"]`);
            if (cb) { const cs = cb.querySelector('.comment-count'); cs.textContent = parseInt(cs.textContent) + 1; }
        } catch(e) { alert('Failed to post comment.'); } finally { sendBtn.disabled = false; }
    };

    document.getElementById('commentInput').addEventListener('keypress', e => { if (e.key === 'Enter') window.sendComment(); });
    function handleScroll(e) { const c = e.target; if (c.scrollTop + c.clientHeight >= c.scrollHeight * 0.8 && hasMore && !isLoading) loadArticles(false); }

    initLibraryPicker().then(() => {
        if (!window._pickerHandledLoad) {
            injectInitialSkeletons(3);
            loadArticles(true);
        }
    });
</script>

<script>
    const _audioSpeeds = [1, 1.25, 1.5, 1.75, 2];
    const _audioSpeedState = {};

    window.toggleAudio = function(btn, audioId) {
        const audio = document.getElementById(audioId);
        if (!audio) return;
        const icon = btn.querySelector('i');
        if (audio.paused) {
            // Pause all other audio players first
            document.querySelectorAll('audio').forEach(a => {
                if (a.id !== audioId && !a.paused) {
                    a.pause();
                    const otherBtn = document.getElementById('playbtn-' + a.id);
                    if (otherBtn) { otherBtn.querySelector('i').className = 'fas fa-play'; otherBtn.classList.remove('playing'); }
                }
            });
            audio.play();
            icon.className = 'fas fa-pause';
            btn.classList.add('playing');
            audio.ontimeupdate = function() {
                if (!audio.duration) return;
                const pct = (audio.currentTime / audio.duration) * 100;
                const prog = document.getElementById('prog-' + audioId);
                if (prog) prog.style.width = pct + '%';
                // Colour played bars
                const barsEl = document.getElementById('bars-' + audioId);
                if (barsEl) {
                    const bars = barsEl.querySelectorAll('.waveform-bar');
                    const playedCount = Math.floor((pct / 100) * bars.length);
                    bars.forEach((b, i) => b.classList.toggle('played', i < playedCount));
                }
                const cur = document.getElementById('cur-' + audioId);
                if (cur) { const m = Math.floor(audio.currentTime/60), s = Math.floor(audio.currentTime%60); cur.textContent = `${m}:${s.toString().padStart(2,'0')}`; }
            };
            audio.onended = function() {
                icon.className = 'fas fa-play';
                btn.classList.remove('playing');
                const prog = document.getElementById('prog-' + audioId);
                if (prog) prog.style.width = '0%';
                const cur = document.getElementById('cur-' + audioId);
                if (cur) cur.textContent = '0:00';
                const barsEl = document.getElementById('bars-' + audioId);
                if (barsEl) barsEl.querySelectorAll('.waveform-bar').forEach(b => b.classList.remove('played'));
            };
        } else {
            audio.pause();
            icon.className = 'fas fa-play';
            btn.classList.remove('playing');
        }
    };

    window.seekAudio = function(event, container, audioId) {
        const audio = document.getElementById(audioId);
        if (!audio || !audio.duration) return;
        const rect = container.getBoundingClientRect();
        audio.currentTime = ((event.clientX - rect.left) / rect.width) * audio.duration;
    };

    window.cycleAudioSpeed = function(audioId) {
        const audio = document.getElementById(audioId);
        if (!audio) return;
        const idx = _audioSpeedState[audioId] ?? 0;
        const nextIdx = (idx + 1) % _audioSpeeds.length;
        _audioSpeedState[audioId] = nextIdx;
        const speed = _audioSpeeds[nextIdx];
        audio.playbackRate = speed;
        const btn = document.getElementById('speed-' + audioId);
        if (btn) btn.textContent = speed === 1 ? '1×' : speed + '×';
    };
</script>
