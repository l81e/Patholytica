<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Patholytica — Article</title>
    <meta property="og:site_name" content="Patholytica">
    <meta property="og:type" content="article">
    <meta property="og:title" id="ogTitle" content="Patholytica – Learn smarter">
    <meta property="og:description" id="ogDescription" content="Bite-sized academic content in a social feed.">
    <meta property="og:image" id="ogImage" content="">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" id="twTitle" content="Patholytica – Learn smarter">
    <meta name="twitter:description" id="twDescription" content="Bite-sized academic content in a social feed.">
    <meta name="twitter:image" id="twImage" content="">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f0e0b;
            --text-primary: #f5f0e8;
            --text-secondary: #8a8070;
            --card-bg: #0f0e0b;
            --hover-bg: #1a1810;
            --border-color: #2a2518;
            --accent: #c8a96e;
            --accent-hover: #b8935a;
            --accent-glow: rgba(200,169,110,0.25);
            --accent-soft: rgba(200,169,110,0.12);
            --font-article: 'Merriweather', serif;
            --font-ui: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-ui);
            background: var(--bg-color);
            color: var(--text-primary);
        }

        .app-container {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 450px;
            height: 100vh;
            background: var(--bg-color);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .app-container::-webkit-scrollbar {
            width: 4px;
        }

        .app-container::-webkit-scrollbar-track {
            background: var(--border-color);
        }

        .app-container::-webkit-scrollbar-thumb {
            background: var(--text-secondary);
            border-radius: 2px;
        }

        /* ══════════════════════════════════════════════
           PROGRESS BAR — thin fixed indicator at the very
           bottom of the viewport, fills with real scroll
           progress through the article. Mirrors the
           mockup's detail-screen progress hairline.
        ══════════════════════════════════════════════ */
        .scroll-progress-track {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: 0;
            width: 100%;
            max-width: 450px;
            height: 3px;
            background: rgba(245,240,232,0.12);
            z-index: 500;
        }

        .scroll-progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
            transition: width 0.08s linear;
        }

        /* ══════════════════════════════════════════════
           HERO IMAGE — first attributed image of the
           article, pinned to the absolute top of the page
           (no header above it). Sized close to full-screen
           like the mockup's detail view, with a strong
           gradient scrim so the title block sits directly
           on the photo rather than the photo fully
           resolving to background before text starts.
        ══════════════════════════════════════════════ */
        .hero-image-wrap {
            position: relative;
            width: 100%;
            height: 82vh;
            min-height: 460px;
            overflow: hidden;
            background: var(--bg-color);
        }

        .hero-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .hero-image-scrim {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 78%;
            background: linear-gradient(to bottom,
                rgba(15,14,11,0) 0%,
                rgba(15,14,11,0.05) 25%,
                rgba(15,14,11,0.55) 60%,
                rgba(15,14,11,0.92) 88%,
                var(--bg-color) 100%);
            pointer-events: none;
        }

        /* Close (X) button — top right of the hero, matches
           the mockup's dismissible detail-screen pattern. */
        .hero-close-btn {
            position: absolute;
            top: calc(16px + env(safe-area-inset-top));
            right: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(15,14,11,0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(245,240,232,0.15);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
            z-index: 20;
            transition: background 0.2s ease;
        }

        .hero-close-btn:hover {
            background: rgba(15,14,11,0.8);
        }

        /* Title block anchored to the bottom of the hero,
           sitting on the scrim — name, publisher, stats,
           date, like/share actions. Replaces the old
           standalone .article-header + .article-stats rows
           that used to sit below the image on plain bg. */
        .hero-title-block {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 0 20px 22px;
            z-index: 10;
        }

        .hero-eyebrow-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .author-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #8a6430);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: #0f0e0b;
            overflow: hidden;
            flex-shrink: 0;
            cursor: pointer;
        }

        .author-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-eyebrow-text {
            flex: 1;
            min-width: 0;
        }

        .author-name {
            color: var(--text-primary);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .author-name:hover {
            color: var(--accent);
        }

        .article-date {
            color: var(--text-secondary);
            font-size: 12px;
            margin-top: 1px;
        }

        .article-title {
            font-family: var(--font-article);
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
            line-height: 1.15;
            letter-spacing: -0.01em;
        }

        /* Stats row + like/share actions share one line,
           matching the mockup's icon row beneath the title. */
        .hero-stats-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .stat-item i {
            font-size: 14px;
        }

        .stat-item.views i {
            color: var(--accent);
        }

        .stat-item.likes i {
            color: #d4845a;
        }

        .hero-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        .icon-action-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(245,240,232,0.1);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(245,240,232,0.15);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .icon-action-btn:hover {
            background: rgba(245,240,232,0.18);
        }

        .icon-action-btn:active {
            transform: scale(0.92);
        }

        .icon-action-btn.like-active {
            color: #d4845a;
            border-color: rgba(212,132,90,0.4);
            background: rgba(212,132,90,0.15);
        }

        .icon-action-btn.like-active i {
            font-weight: 900;
        }

        .icon-action-btn.share-pop i {
            animation: shareTick 0.3s ease;
        }

        @keyframes shareTick {
            0% { transform: scale(1); }
            40% { transform: scale(0.8); }
            100% { transform: scale(1); }
        }

        /* ── Fallback header, used only when an article has
           no hero image — keeps the page usable without
           forcing a photo that doesn't exist. Same content
           as hero-title-block but on flat background, laid
           out at the top of the wrapper the old way. ── */
        .plain-header {
            display: none;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .no-hero .plain-header {
            display: flex;
        }

        .no-hero .plain-header .author-avatar {
            width: 44px;
            height: 44px;
            font-size: 18px;
        }

        .no-hero .plain-header .author-name {
            font-size: 17px;
        }

        .no-hero .plain-header .article-date {
            font-size: 12px;
        }

        .plain-stats-row {
            display: none;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .no-hero .plain-stats-row {
            display: flex;
        }

        .plain-title {
            display: none;
            font-family: var(--font-article);
            font-size: 30px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
            line-height: 1.2;
            letter-spacing: -0.01em;
        }

        .no-hero .plain-title {
            display: block;
        }

        .article-wrapper {
            padding: 22px 20px;
            padding-top: 24px;
            padding-bottom: 60px;
        }

        .no-hero.article-wrapper {
            padding-top: calc(20px + env(safe-area-inset-top));
        }

        /* Section label above the body copy — mirrors the
           mockup's "About" heading over its description
           paragraph. */
        .content-section-label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .article-content {
            color: var(--text-primary);
            font-size: 16px;
            line-height: 1.65;
            font-family: var(--font-article);
        }

        .content-paragraph {
            margin-bottom: 14px;
        }

        /* ── EMOJI HIGHLIGHT STYLES (ported from Dailyfeed) ── */
        .emo-magnify { font-weight: 700; font-size: 1.05em; }
        .emo-pinned { border-left: 2px solid var(--accent); padding-left: 0.45em; background: linear-gradient(to right, var(--accent-soft), transparent); border-radius: 0 3px 3px 0; }
        .emo-book { font-family: var(--font-article); background: rgba(200,169,110,0.07); color: #d4b88a; padding: 0.06em 0.3em; border-radius: 4px; border: 1px solid rgba(200,169,110,0.15); font-size: 0.94em; }
        .emo-brain { font-style: italic; color: var(--accent); }
        .emo-temple { font-family: var(--font-article); color: #c4b090; letter-spacing: 0.04em; }
        .emo-science { font-family: 'Courier New', monospace; color: #b0a878; font-size: 0.9em; }
        .emo-micro { font-family: 'Courier New', monospace; color: #c8a96e; font-size: 0.88em; }
        .emo-robot { font-family: 'Courier New', monospace; color: #b0a08a; font-size: 0.88em; }
        .emo-idea { color: #d4a96e; background: linear-gradient(to right, var(--accent-soft), rgba(200,169,110,0.03)); padding: 0.06em 0.3em; border-radius: 3px; }
        .emo-urgent { font-weight: 700; color: #e0b840; border: 1px solid rgba(224,184,64,0.3); padding: 0.06em 0.3em; border-radius: 4px; }
        .emo-warning { color: #c8a040; border: 1px solid rgba(200,160,64,0.3); padding: 0.06em 0.38em; border-radius: 4px; font-weight: 600; }
        .emo-check { color: #6abf85; font-weight: 700; }
        .emo-cross { color: #c46a4e; text-decoration: line-through; text-decoration-color: rgba(196,106,78,0.5); }
        .emo-lock { color: #7a7268; background: rgba(42,37,24,0.7); padding: 0.06em 0.35em; border-radius: 4px; border: 1px solid var(--border-color); font-weight: 600; }
        .emo-unlock { color: var(--accent); background: var(--accent-soft); padding: 0.06em 0.35em; border-radius: 4px; }
        .emo-hourglass { color: var(--accent); }
        .emo-puzzle { border: 1px dashed rgba(200,169,110,0.3); padding: 0.06em 0.35em; border-radius: 4px; color: #c8a96e; }
        .emo-tag { background: var(--accent-soft); border: 1px solid rgba(200,169,110,0.2); color: #c8a96e; padding: 0.04em 0.5em; border-radius: 20px; font-size: 0.88em; }
        .emo-target { font-weight: 700; color: var(--accent); }
        .emo-cool { background: rgba(10,8,4,0.85); color: var(--accent); padding: 0.06em 0.35em; border-radius: 4px; border: 1px solid rgba(200,169,110,0.18); }
        .emo-balance { color: var(--text-primary); border-left: 2px solid #c8a96e; border-right: 2px solid #6a9fcf; padding: 0.03em 0.35em; background: linear-gradient(90deg,rgba(200,169,110,0.05),transparent,rgba(106,159,207,0.05)); }
        .emo-money { font-weight: 700; color: #c8a050; }
        .emo-earth { color: #7a9868; font-weight: 700; }
        .emo-crown { font-weight: 800; color: #d4b870; }
        .emo-yellow { color: #e8c858; }
        .emo-red { color: #c96a58; }
        .emo-green { color: #6abf85; }
        .emo-blue { color: #6a9fcf; }
        .emo-purple { color: #9b7fe8; }
        .emo-dark { color: #c8c0b8; background: rgba(0,0,0,0.55); padding: 0.06em 0.3em; border-radius: 3px; }
        .emo-ice { color: #a0c4d8; }
        .emo-fire { font-weight: 700; background: linear-gradient(90deg,#c87040,#e0a040,#c8a050,#e0a040,#c87040); background-size: 300% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: fireScroll 3s linear infinite; }
        @keyframes fireScroll { 0%{background-position:0% center} 100%{background-position:300% center} }
        .emo-diamond { font-weight: 700; background: linear-gradient(135deg,#e8d8a0,#c8a96e,#a08050,#e8d8a0); background-size: 300% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: diamondShimmer 4s ease-in-out infinite; }
        @keyframes diamondShimmer { 0%,100%{background-position:0% center} 50%{background-position:100% center} }
        .emo-lightning { color: #e0c850; animation: lightningBlink 2s ease-in-out infinite; }
        @keyframes lightningBlink { 0%,100%{opacity:1} 50%{opacity:0.7} }
        .emo-sparkle { background: linear-gradient(90deg,#f0e0b0,#c8a96e,#f0e0b0,#e8c880,#f0e0b0); background-size: 300% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: sparkleScroll 2.5s linear infinite; }
        @keyframes sparkleScroll { 0%{background-position:0% center} 100%{background-position:300% center} }
        .emo-rainbow { background: linear-gradient(90deg,#c97a5a,#c8a96e,#6abf85,#6a9fcf,#9b7fe8,#c8a96e,#c97a5a); background-size: 300% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: rainbowScroll 3s linear infinite; font-weight: 700; }
        @keyframes rainbowScroll { 0%{background-position:0% center} 100%{background-position:300% center} }
        .emo-magic { background: linear-gradient(90deg,#f0d8a0,#c8a96e,#e8c880,#f0d8a0); background-size: 300% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: sparkleScroll 2.2s linear infinite; }
        .emo-wave { display: inline-block; animation: gentleWave 2s ease-in-out infinite; }
        @keyframes gentleWave { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
        .emo-spin { display: inline-block; color: var(--text-secondary); }
        .emo-float { display: inline-block; animation: gentleFloat 2.5s ease-in-out infinite; color: var(--accent); }
        @keyframes gentleFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
        .emo-rocket { color: #e8d0a0; font-weight: 700; }
        .emo-cinematic { color: #f0e8d8; }
        .emo-sound { font-weight: 700; color: #e8d0a0; }
        .emo-signal { color: var(--accent); }
        .emo-music { color: #c87a6a; }
        .emo-star { color: #f0e0b0; animation: starTwinkle 2.5s ease-in-out infinite; }
        @keyframes starTwinkle { 0%,100%{opacity:1} 50%{opacity:0.65} }
        .emo-heart { color: #c87a6a; display: inline-block; animation: heartBeat 1.8s ease-in-out infinite; }
        @keyframes heartBeat { 0%,100%{transform:scale(1)} 20%{transform:scale(1.07)} 40%{transform:scale(1)} }
        .emo-happy { color: #e0c050; display: inline-block; }
        .emo-calm { color: var(--accent); }
        .emo-surprised { color: #d4a86a; display: inline-block; }

        /* ── TERM DEFINITION POPUP (ported from Dailyfeed) ── */
        .term-link { color: var(--accent); border-bottom: 1px dashed rgba(200,169,110,0.45); cursor: pointer; font-weight: 600; transition: opacity 0.15s ease; -webkit-tap-highlight-color: transparent; }
        .term-link:hover { opacity: 0.75; }
        .term-popup { position: fixed; width: 270px; max-width: calc(100vw - 24px); background: var(--hover-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px 14px 10px; z-index: 301; opacity: 0; pointer-events: none; transition: opacity 0.18s ease, transform 0.18s ease; transform: translateY(4px); box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
        .term-popup.active { opacity: 1; pointer-events: all; transform: translateY(0); }
        .term-popup-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .term-popup-term { font-size: 12px; font-weight: 900; color: var(--accent); flex: 1; margin-right: 8px; }
        .term-popup-close { width: 20px; height: 20px; border-radius: 50%; background: var(--bg-color); border: none; color: var(--text-secondary); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .term-popup-divider { height: 1px; background: var(--border-color); margin-bottom: 9px; }
        .term-popup-body { font-size: 12px; line-height: 1.6; color: var(--text-secondary); }

        /* ── MID-ARTICLE MEDIA ── */
        .media-embed {
            margin: 16px 0;
            max-width: 100%;
        }

        .media-embed img {
            width: 100%;
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            display: block;
        }

        .media-caption {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 6px;
            font-style: italic;
        }

        .media-embed.yt-embed {
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }

        .media-embed.yt-embed iframe {
            width: 100%;
            aspect-ratio: 16/9;
            border: none;
            display: block;
        }

        .custom-audio-player {
            background: var(--hover-bg);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 100%;
            border: 1px solid var(--border-color);
        }

        .play-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: #0f0e0b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s ease;
            flex-shrink: 0;
            box-shadow: 0 0 14px var(--accent-glow);
        }

        .play-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }

        .audio-info {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        .audio-title {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary);
        }

        .waveform-container {
            position: relative;
            height: 32px;
            background: var(--bg-color);
            border-radius: 4px;
            margin-bottom: 6px;
            cursor: pointer;
            overflow: hidden;
        }

        .waveform-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: var(--accent);
            opacity: 0.3;
            transition: width 0.1s linear;
        }

        .waveform-bars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 4px;
        }

        .waveform-bar {
            width: 2px;
            background: var(--text-secondary);
            border-radius: 2px;
            opacity: 0.6;
        }

        .audio-time {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .suggested-articles {
            margin-top: 40px;
            padding-top: 20px;
            padding-bottom: 2px;
            border-top: 2px solid var(--border-color);
        }

        .suggested-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .suggested-article {
            display: flex;
            gap: 12px;
            padding: 12px;
            background: var(--hover-bg);
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid var(--border-color);
        }

        .suggested-article:hover {
            background: var(--border-color);
            transform: translateY(-2px);
        }

        .suggested-thumbnail {
            width: 80px;
            height: 80px;
            border-radius: 6px;
            background: var(--border-color);
            flex-shrink: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

    <script>
        function openProfile(username) {
            if (username) {
                const cleanUsername = username.replace('@', '');
                window.location.href = `https://patholytica.com/profile.html?username=${cleanUsername}`;
            }
        }

        // ── EMOJI HIGHLIGHT SYSTEM (ported verbatim from Dailyfeed) ──
        const EMOJI_MAP={
          '🔍':'emo-magnify','❗':'emo-urgent','📌':'emo-pinned','🔥':'emo-fire','💎':'emo-diamond',
          '🟡':'emo-yellow','🔵':'emo-blue','🟢':'emo-green','🟣':'emo-purple','🔴':'emo-red',
          '⚫':'emo-dark','🧠':'emo-brain','📖':'emo-book','💡':'emo-idea','🎯':'emo-target',
          '🧩':'emo-puzzle','🏷️':'emo-tag','🔬':'emo-micro','⚠️':'emo-warning','✅':'emo-check',
          '❌':'emo-cross','⏳':'emo-hourglass','🔒':'emo-lock','🔓':'emo-unlock','⚡':'emo-lightning',
          '🌊':'emo-wave','🌀':'emo-spin','💫':'emo-float','🚀':'emo-rocket','🎬':'emo-cinematic',
          '🌟':'emo-star','✨':'emo-sparkle','🌈':'emo-rainbow','👑':'emo-crown','🪄':'emo-magic',
          '❤️':'emo-heart','😄':'emo-happy','😌':'emo-calm','😮':'emo-surprised','😎':'emo-cool',
          '🤖':'emo-robot','🧪':'emo-science','🏛️':'emo-temple','🌍':'emo-earth','💰':'emo-money',
          '⚖️':'emo-balance','📡':'emo-signal','🎵':'emo-music','🧊':'emo-ice','🔊':'emo-sound',
        };
        function buildEmojiPattern(){const keys=Object.keys(EMOJI_MAP).sort((a,b)=>b.length-a.length);const escaped=keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');return new RegExp(`(${escaped})([\\s\\S]*?)\\1`,'gu');}
        function escHtmlET(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
        function renderTerms(html){return html.replace(/([A-Za-z][A-Za-z0-9\-']{0,60}?)&lt;([^&]{1,600}?)&gt;/g,function(match,term,explanation){const safeTerm=term.trim().replace(/'/g,'&#39;');const safeExp=explanation.replace(/'/g,'&#39;');return `<span class="term-link" onclick="openTermPopup('${safeTerm}','${safeExp}',event)">${term.trim()}</span>`;});}
        function renderEmojiText(text,applyTerms=true){const re=buildEmojiPattern();let result='',lastIndex=0,match;while((match=re.exec(text))!==null){result+=escHtmlET(text.slice(lastIndex,match.index));const cls=EMOJI_MAP[match[1]];result+=`<span class="${cls}">${renderEmojiText(match[2],false)}</span>`;lastIndex=re.lastIndex;}result+=escHtmlET(text.slice(lastIndex));return applyTerms?renderTerms(result):result;}

        // ── TERM POPUP ──
        window._termPopupOutside=null;
        window.openTermPopup=function(term,explanation,event){
          const popup=document.getElementById('termPopup');
          document.getElementById('termPopupTerm').textContent=term;
          document.getElementById('termPopupBody').innerHTML=explanation;
          const PW=270,PH=150,M=8,vw=window.innerWidth,vh=window.innerHeight;
          let ax=event?event.clientX:vw/2,ay=event?event.clientY:vh/2;
          let left=ax-PW/2,top=ay+14;
          left=Math.max(M,Math.min(left,vw-PW-M));
          if(top+PH>vh-M)top=ay-PH-8;top=Math.max(M,top);
          popup.style.left=left+'px';popup.style.top=top+'px';
          popup.classList.add('active');
          if(window._termPopupOutside)document.removeEventListener('click',window._termPopupOutside);
          setTimeout(()=>{window._termPopupOutside=function(e){if(!popup.contains(e.target)&&!e.target.classList.contains('term-link'))closeTermPopup();};document.addEventListener('click',window._termPopupOutside,{once:true});},10);
        };
        window.closeTermPopup=function(){
          document.getElementById('termPopup').classList.remove('active');
          if(window._termPopupOutside){document.removeEventListener('click',window._termPopupOutside);window._termPopupOutside=null;}
        };

        // ── AUDIO (lazy-load via data-src, ported from Dailyfeed) ──
        window._loadedAudioIds=window._loadedAudioIds||new Set();
        window.loadAudioIfNeeded=function(audioId){
          if(window._loadedAudioIds.has(audioId))return;
          const audio=document.getElementById(audioId);
          if(!audio)return;
          const realSrc=audio.dataset.src;
          if(!realSrc)return;
          audio.src=realSrc;
          audio.load();
          window._loadedAudioIds.add(audioId);
          audio.addEventListener('loadedmetadata',()=>{
            const dur=Math.floor(audio.duration);
            const dEl=audio.closest('.custom-audio-player')?.querySelector('.duration');
            if(dEl)dEl.textContent=`${Math.floor(dur/60)}:${(dur%60).toString().padStart(2,'0')}`;
          });
        };
        window.toggleAudio=function(btn,audioId){
          window.loadAudioIfNeeded(audioId);
          const player=btn.closest('.custom-audio-player'),audio=document.getElementById(audioId),icon=btn.querySelector('i');
          if(audio.paused){
            audio.play();icon.className='fas fa-pause';
            audio.ontimeupdate=function(){const progress=(audio.currentTime/audio.duration)*100;const prog=player.querySelector('.waveform-progress');if(prog)prog.style.width=progress+'%';const ct=player.querySelector('.current-time');if(ct){const m=Math.floor(audio.currentTime/60),s=Math.floor(audio.currentTime%60);ct.textContent=`${m}:${s.toString().padStart(2,'0')}`;}};
            audio.onended=function(){icon.className='fas fa-play';const prog=player.querySelector('.waveform-progress');if(prog)prog.style.width='0%';const ct=player.querySelector('.current-time');if(ct)ct.textContent='0:00';};
          }else{audio.pause();icon.className='fas fa-play';}
        };
        window.seekAudio=function(event,container,audioId){const audio=document.getElementById(audioId);if(!audio||!audio.duration)return;const rect=container.getBoundingClientRect();audio.currentTime=((event.clientX-rect.left)/rect.width)*audio.duration;};

        // Kick off a lazy-load timer for any audio players once the page
        // has settled, mirroring Dailyfeed's intersection-triggered timer
        // (a single article page has no scroll-based visibility signal,
        // so this fires once after initial paint instead).
        window._articleAudioLoadTimer=null;
        function scheduleAudioLazyLoad(){
          if(window._articleAudioLoadTimer)return;
          window._articleAudioLoadTimer=setTimeout(()=>{
            document.querySelectorAll('audio[data-src]').forEach(a=>window.loadAudioIfNeeded(a.id));
          },10000);
        }

        // ── SCROLL PROGRESS ──
        // Tracks real scroll position within .app-container (the page's
        // actual scroll container, since body itself doesn't scroll here)
        // and fills the fixed bottom bar proportionally.
        function initScrollProgress(){
          const container = document.getElementById('appContainer');
          const fill = document.getElementById('scrollProgressFill');
          if (!container || !fill) return;
          function update(){
            const scrollable = container.scrollHeight - container.clientHeight;
            const pct = scrollable > 0 ? Math.min(100, Math.max(0, (container.scrollTop / scrollable) * 100)) : 0;
            fill.style.width = pct + '%';
          }
          container.addEventListener('scroll', update, { passive: true });
          window.addEventListener('resize', update);
          update();
        }

        // ── CLOSE BUTTON ──
        // No defined parent route exists in this standalone file, so this
        // falls back to browser history, and to the site root if there is
        // no history to go back to (e.g. article opened directly).
        function initCloseButton(){
          const btn = document.getElementById('heroCloseBtn');
          if (!btn) return;
          btn.addEventListener('click', () => {
            if (window.history.length > 1) {
              window.history.back();
            } else {
              window.location.href = 'https://patholytica.com/';
            }
          });
        }

        // ── SHARE TOAST ──
        let shareToastTimer = null;
        function showShareToast(message){
          const toast = document.getElementById('shareToast');
          if (!toast) return;
          toast.textContent = message;
          toast.classList.add('visible');
          if (shareToastTimer) clearTimeout(shareToastTimer);
          shareToastTimer = setTimeout(() => toast.classList.remove('visible'), 2200);
        }
    </script>

        // ── LIKE / SHARE ──

            const formatted = formatNumber(n || 0);
            const heroEl = document.getElementById('viewCountHero');

        async function refreshLikeState(articleId) {

        async function handleLikeClick() {

            likeInFlight = true;

            // Optimistic update first, matching the responsiveness of the
            // mockup's tappable heart icon.
            const prevLiked = hasLiked;
            const prevCount = currentArticle.likes || 0;
            hasLiked = !prevLiked;
            setLikeButtonState(hasLiked);
            setLikeCount(prevCount + (hasLiked ? 1 : -1));

            try {
                const { data: newCount, error } = await supabase.rpc('toggle_like', {
                    p_article_id: parseInt(currentArticle.id),
                    p_user_id: currentUser.user_id
                });

                    p_user_id: currentUser.user_id,
                    p_article_id: parseInt(currentArticle.id),
                    p_interaction_type: hasLiked ? 'like' : 'unlike'

            }

            if (currentUser && currentArticle) {
                supabase.rpc('record_article_interaction', {
                    p_user_id: currentUser.user_id,
                    p_article_id: parseInt(currentArticle.id),
                    p_interaction_type: 'share'
                }).then(({ error }) => { if (error) console.error('[record_article_interaction share]', error); });
            }
        }

        function initLikeShareButtons() {
            ['likeBtn', 'likeBtnPlain'].forEach(id => {
                const btn = document.getElementById(id);
                if (btn) btn.addEventListener('click', handleLikeClick);
            });
            ['shareBtn', 'shareBtnPlain'].forEach(id => {
                const btn = document.getElementById(id);
                if (btn) btn.addEventListener('click', () => handleShareClick(btn));
            });
        }

        function formatNumber(num) {
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            }
            if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toString();
        }

        async function loadSuggestedArticles(firebaseUserId, currentArticleId) {
            try {
                const { data: articles, error } = await supabase
                    .from('articles')
                    .select('id, title, created_at, views, likes, media(url)')
                    .eq('firebase_user_id', firebaseUserId)
                    .neq('id', currentArticleId)
                    .order('created_at', { ascending: false })
                    .limit(3);

                if (error) throw error;

                if (articles && articles.length > 0) {
                    const suggestedSection = document.getElementById('suggestedArticles');
                    const suggestedList = document.getElementById('suggestedArticlesList');
                    
                    suggestedList.innerHTML = articles.map(article => {
                        const timeAgo = formatDate(new Date(article.created_at));
                        const articleImage = article.media && article.media.length > 0 ? article.media[0].url : null;
                        
                        let thumbnailContent;
                        if (articleImage) {
                            thumbnailContent = `<img src="${articleImage}" alt="${article.title || 'Article'}">`;
                        } else {
                            thumbnailContent = `<i class="fas fa-file-alt"></i>`;
                        }
                        
                        return `
                            <div class="suggested-article" onclick="window.location.href='article.html?id=${article.id}'">
                                <div class="suggested-thumbnail">
                                    ${thumbnailContent}
                                </div>
                                <div class="suggested-info">
                                    <div class="suggested-title">${article.title || 'Untitled'}</div>
                                    <div class="suggested-meta">
                                        <div class="suggested-meta-item">
                                            <i class="fas fa-eye"></i>
                                            <span>${formatNumber(article.views || 0)}</span>
                                        </div>
                                        <div class="suggested-meta-item">
                                            <i class="fas fa-heart"></i>
                                            <span>${formatNumber(article.likes || 0)}</span>
                                        </div>
                                        <div class="suggested-meta-item">
                                            <span>${timeAgo}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                    
                    suggestedSection.style.display = 'block';
                }
            } catch (error) {
                console.error('Error loading suggested articles:', error);
            }
        }

        async function populateOGMeta(article, heroImageUrl) {
            const title = article.title || 'Patholytica';
            const desc = (article.content || '').replace(/[🔍❗📌🔥💎🟡🔵🟢🟣🔴⚫🧠📖💡🎯🧩🏷️🔬⚠️✅❌⏳🔒🔓⚡🌊🌀💫🚀🎬🌟✨🌈👑🪄❤️😄😌😮😎🤖🧪🏛️🌍💰⚖️📡🎵🧊🔊]/gu, '').slice(0, 160).trim();
            document.getElementById('ogTitle').content = title;
            document.getElementById('ogDescription').content = desc;
            document.getElementById('ogImage').content = heroImageUrl || '';
            document.getElementById('twTitle').content = title;
            document.getElementById('twDescription').content = desc;
            document.getElementById('twImage').content = heroImageUrl || '';
            document.title = `${title} — Patholytica`;
        }

        async function loadArticle() {
            const articleId = getArticleId();
            
            if (!articleId) {
                showError();
                return;
            }

            try {
                const { data: article, error: articleError } = await supabase
                    .from('articles')
                    .select('*')
                    .eq('id', articleId)
                    .single();

                if (articleError) throw articleError;
                if (!article) {
                    showError();
                    return;
                }

                currentArticle = article;

                const { data: author } = await supabase
                    .from('users')
                    .select('username, full_name, pfp')
                    .eq('firebase_uid', article.firebase_user_id)
                    .single();

                const { data: media } = await supabase
                    .from('media')
                    .select('*')
                    .eq('article_id', articleId)
                    .order('display_order', { ascending: true });

                displayArticle(article, author, media || []);
                
                await loadSuggestedArticles(article.firebase_user_id, articleId);

                startViewTimer(articleId);
                scheduleAudioLazyLoad();
                initScrollProgress();
                initCloseButton();
                initLikeShareButtons();
                if (currentUser) {
                    await refreshLikeState(articleId);
                }

            } catch (error) {
                console.error('Error loading article:', error);
                showError();
            }
        }

        window.addEventListener('beforeunload', () => {
            clearViewTimer();
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clearViewTimer();
            } else if (!hasIncrementedView && currentArticle) {
                startViewTimer(currentArticle.id);
            }
        });

        function getAvatarContent(author, pfp) {
            if (pfp) {
                return `<img src="${pfp}" alt="${author}">`;
            }
            
            let letter = 'A';
            
            if (author) {
                const atIndex = author.indexOf('@');
                if (atIndex !== -1 && author.length > atIndex + 1) {
                    letter = author.charAt(atIndex + 1).toUpperCase();
                } else {
                    letter = author.charAt(0).toUpperCase();
                }
            }
            
            return letter;
        }

        function displayArticle(article, author, media) {
            document.getElementById('loadingContainer').style.display = 'none';
            document.getElementById('articleContent').style.display = 'block';

            // ── Hero image: pull out the first image-type media item by
            // display_order and render it full-bleed at the top of the
            // page, with the title block laid on top of it (mockup-style).
            // It is excluded from the media array used by the
            // paragraph-interleaving loop below, so it never repeats
            // further down the article. When no hero image exists, the
            // .no-hero class switches over to the flat fallback header
            // inside .article-wrapper instead.
            const heroWrap = document.getElementById('heroImageWrap');
            const heroImg = document.getElementById('heroImageEl');
            const articleWrapper = document.getElementById('articleWrapper');

            const sortedMedia = [...media].sort((a, b) => (a.display_order ?? 0) - (b.display_order ?? 0));
            const heroIndex = sortedMedia.findIndex(m => m.type === 'image');
            let heroMediaItem = null;
            let remainingMedia = sortedMedia;

            if (heroIndex !== -1) {
                heroMediaItem = sortedMedia[heroIndex];
                remainingMedia = sortedMedia.filter((m, i) => i !== heroIndex);
                heroImg.src = heroMediaItem.url;
                heroImg.alt = heroMediaItem.caption || article.title || 'Article image';
                heroWrap.style.display = 'block';
                articleWrapper.classList.remove('no-hero');
            } else {
                heroWrap.style.display = 'none';
                articleWrapper.classList.add('no-hero');
            }

            populateOGMeta(article, heroMediaItem ? heroMediaItem.url : null);

            const titleText = article.title || 'Untitled';
            document.getElementById('articleTitleHero').textContent = titleText;
            document.getElementById('articleTitle').textContent = titleText;

            const authorUsername = author?.username || '';
            const authorName = authorUsername ? `@${authorUsername}` : (author?.full_name || 'Anonymous');
            const dateText = formatDate(new Date(article.created_at));
            const avatarContent = getAvatarContent(authorName, author?.pfp);

            [
                { nameId: 'authorNameHero', dateId: 'articleDateHero', avatarId: 'authorAvatarHero' },
                { nameId: 'authorName', dateId: 'articleDate', avatarId: 'authorAvatar' }
            ].forEach(({ nameId, dateId, avatarId }) => {
                const nameEl = document.getElementById(nameId);
                const dateEl = document.getElementById(dateId);
                const avatarEl = document.getElementById(avatarId);

                nameEl.textContent = authorName;
                dateEl.textContent = dateText;
                avatarEl.innerHTML = avatarContent;

                if (authorUsername) {
                    nameEl.style.cursor = 'pointer';
                    nameEl.onclick = () => openProfile(authorUsername);
                    avatarEl.style.cursor = 'pointer';
                    avatarEl.onclick = () => openProfile(authorUsername);
                }
            });

            setViewCount(article.views || 0);
            setLikeCount(article.likes || 0);

            const contentContainer = document.getElementById('articleBody');
            contentContainer.innerHTML = '';

            const paragraphs = (article.content || 'No content available').split('\n\n');
            
            paragraphs.forEach((paragraph, index) => {
                if (paragraph.trim()) {
                    const p = document.createElement('div');
                    p.className = 'content-paragraph';
                    p.innerHTML = renderEmojiText(paragraph.trim());
                    contentContainer.appendChild(p);

                    const relatedMedia = remainingMedia.filter(m => m.display_order === index);
                    relatedMedia.forEach(m => {
                        contentContainer.appendChild(createMediaElement(m));
                    });
                }
            });

            remainingMedia.filter(m => m.display_order >= paragraphs.length).forEach(m => {
                contentContainer.appendChild(createMediaElement(m));
            });
        }

        function createMediaElement(mediaItem) {
            const mediaDiv = document.createElement('div');

            if (mediaItem.type === 'image') {
                mediaDiv.className = 'media-embed';
                mediaDiv.innerHTML = `
                    <img src="${mediaItem.url}" alt="${mediaItem.caption || 'Article image'}">
                    ${mediaItem.caption ? `<div class="media-caption">${mediaItem.caption}</div>` : ''}
                `;
            } else if (mediaItem.type === 'youtube') {
                mediaDiv.className = 'media-embed yt-embed';
                mediaDiv.innerHTML = `
                    <iframe src="${mediaItem.url}" title="${mediaItem.caption || 'Video'}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>
                    ${mediaItem.caption ? `<div class="media-caption">${mediaItem.caption}</div>` : ''}
                `;
            } else if (mediaItem.type === 'audio') {
                mediaDiv.className = 'media-embed';
                const audioId = 'audio-' + Math.random().toString(36).substr(2, 9);
                mediaDiv.innerHTML = `
                    <div class="custom-audio-player">
                        <button class="play-btn" onclick="toggleAudio(this, '${audioId}')">
                            <i class="fas fa-play"></i>
                        </button>
                        <div class="audio-info">
                            <div class="audio-title">${mediaItem.caption || 'Audio'}</div>
                            <div class="waveform-container" onclick="seekAudio(event, this, '${audioId}')">
                                <div class="waveform-progress"></div>
                                <div class="waveform-bars">
                                    ${Array(15).fill(0).map(() => `<div class="waveform-bar" style="height: ${Math.random() * 60 + 20}%"></div>`).join('')}
                                </div>
                            </div>
                            <div class="audio-time">
                                <span class="current-time">0:00</span>
                                <span class="duration">0:00</span>
                            </div>
                        </div>
                        <audio id="${audioId}" data-src="${mediaItem.url}" style="display: none;"></audio>
                    </div>
                    ${mediaItem.caption ? `<div class="media-caption">${mediaItem.caption}</div>` : ''}
                `;
            }

            return mediaDiv;
        }

        function formatDate(date) {
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);

            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHours < 24) return `${diffHours}h ago`;
            if (diffDays < 7) return `${diffDays}d ago`;
            
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function showError() {
            document.getElementById('loadingContainer').style.display = 'none';
            document.getElementById('errorContainer').style.display = 'flex';
        }

        loadArticle();
    </script>
</body>
